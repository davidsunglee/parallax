name: release
run-name: ${{ inputs.operation == 'bootstrap' && format('Bootstrap {0} on {1}', inputs.bootstrap-project, inputs.bootstrap-index) || format('Release {0}', github.ref_name) }}

on:
  push:
    branches: ['release/**']
  workflow_dispatch:
    inputs:
      operation:
        description: Release validated artifacts, or establish one new project's publishing access without uploading files
        type: choice
        options: [release, bootstrap]
        default: release
      bootstrap-index:
        description: Index for setup-only ownership bootstrap
        type: choice
        options: [testpypi, pypi]
        default: testpypi
      bootstrap-project:
        description: Configured project with a pending publisher (one project per bootstrap run)
        type: string
        default: ''
      candidate-run-id:
        description: Recover the exact archived candidate from this prior release run (blank builds a new candidate)
        type: string
        default: ''
      candidate-attempt:
        description: Attempt that retained the archived candidate
        type: string
        default: '1'

permissions:
  contents: read
  actions: read

# Publication is coordinated across six projects; never cancel an admitted upload.
concurrency:
  group: ${{ inputs.operation == 'bootstrap' && format('publisher-bootstrap-{0}', inputs.bootstrap-index) || 'coordinated-release' }}
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap one project without publishing packages
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'bootstrap'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: ${{ inputs.bootstrap-index }}
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      BOOTSTRAP_INDEX: ${{ inputs.bootstrap-index }}
      BOOTSTRAP_PROJECT: ${{ inputs.bootstrap-project }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
      - name: Verify environment protections
        run: python languages/python/tools/release_setup.py --output bootstrap/environments.json
      - name: Convert one pending publisher into a real owned project
        run: python languages/python/tools/release_bootstrap.py --index "$BOOTSTRAP_INDEX" --project "$BOOTSTRAP_PROJECT" --output bootstrap/evidence.json
      - name: Show non-secret bootstrap evidence
        if: always()
        shell: bash
        run: |
          if [ -f bootstrap/evidence.json ]; then
            cat bootstrap/evidence.json >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: publisher-bootstrap-${{ inputs.bootstrap-index }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: bootstrap/
          retention-days: 90
          if-no-files-found: warn

  wheels:
    if: inputs.operation != 'bootstrap' && inputs.candidate-run-id == ''
    uses: ./.github/workflows/wheels.yml
    with:
      source-ref: ${{ github.sha }}
    permissions:
      contents: read
      actions: read

  candidate:
    if: always() && inputs.operation != 'bootstrap' && (needs.wheels.result == 'success' || (needs.wheels.result == 'skipped' && inputs.candidate-run-id != ''))
    needs: wheels
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
      id-token: write
      attestations: write
    outputs:
      source: ${{ steps.identity.outputs.source }}
      version: ${{ steps.identity.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      CANDIDATE_RUN: ${{ inputs.candidate-run-id }}
      CANDIDATE_ATTEMPT: ${{ inputs.candidate-attempt || '1' }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
      - if: inputs.candidate-run-id == ''
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.wheels.outputs.artifact }}
          path: handoff
      - name: Freeze the exact validated production set
        if: inputs.candidate-run-id == ''
        run: python languages/python/tools/release_artifacts.py freeze --handoff handoff --output candidate
      - name: Recover attested archived bytes without rebuilding
        if: inputs.candidate-run-id != ''
        shell: bash
        run: |
          [[ "$CANDIDATE_RUN" =~ ^[0-9]+$ && "$CANDIDATE_ATTEMPT" =~ ^[1-9][0-9]*$ ]]
          workflow=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml" --jq .id)
          original=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CANDIDATE_RUN/attempts/$CANDIDATE_ATTEMPT")
          test "$(jq -r .workflow_id <<< "$original")" = "$workflow"
          source=$(jq -r .head_sha <<< "$original")
          gh release download "release-candidate-$CANDIDATE_RUN-$CANDIDATE_ATTEMPT" --pattern candidate.tar.gz --dir recovered
          gh attestation verify recovered/candidate.tar.gz --repo "$GITHUB_REPOSITORY" --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/release.yml" --source-digest "$source" --deny-self-hosted-runners --format json > recovered/provenance.json
          python - <<'PY'
          import tarfile
          with tarfile.open('recovered/candidate.tar.gz') as archive:
              archive.extractall('.', filter='data')
          PY
          test "$(jq -r .source_sha candidate/release-manifest.json)" = "$source"
          python languages/python/tools/release_artifacts.py verify --bundle candidate
      - name: Require source CI and actual PostgreSQL floor/latest evidence
        if: inputs.candidate-run-id == ''
        run: python languages/python/tools/release_ci.py --repository "$GITHUB_REPOSITORY" --bundle candidate
      - name: Verify retained source CI and PostgreSQL evidence from the attested archive
        if: inputs.candidate-run-id != ''
        run: python languages/python/tools/release_ci.py --repository "$GITHUB_REPOSITORY" --bundle candidate --retained
      - name: Retain native validation records and timing evidence
        if: inputs.candidate-run-id == ''
        shell: bash
        run: |
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --pattern "wheel-cell-*-$GITHUB_RUN_ATTEMPT" --dir candidate/validation
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "wheel-summary-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" --dir candidate/wheel-summary
      - name: Identify and archive the candidate
        id: identity
        shell: bash
        run: |
          echo "source=$(jq -r .source_sha candidate/release-manifest.json)" >> "$GITHUB_OUTPUT"
          echo "version=$(jq -r .version candidate/release-manifest.json)" >> "$GITHUB_OUTPUT"
          tar -czf candidate.tar.gz candidate
      - name: Attest archived candidate provenance
        id: provenance
        uses: actions/attest@v4
        with:
          subject-path: candidate.tar.gz
      - name: Retain candidate durably before any index upload
        shell: bash
        env:
          SOURCE: ${{ steps.identity.outputs.source }}
          ATTESTATION: ${{ steps.provenance.outputs.bundle-path }}
        run: |
          cp "$ATTESTATION" candidate-provenance.json
          gh release create "release-candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" candidate.tar.gz candidate-provenance.json --draft --target "$SOURCE" --title "Release candidate $GITHUB_RUN_ID/$GITHUB_RUN_ATTEMPT" --notes "Retained validated bytes and evidence; this draft is not a production release."
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/
          retention-days: 90
          if-no-files-found: error
      - name: Retain candidate failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-preparation-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            candidate/
            recovered/provenance.json
          retention-days: 90

  rehearsal:
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: testpypi
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
      - uses: astral-sh/setup-uv@v7
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - uses: ./.github/actions/release-index
        id: prepare
        with:
          phase: prepare
          index: testpypi
          bundle: candidate
          evidence: rehearsal
      - name: Upload only missing verified bytes with publication attestations
        if: steps.prepare.outputs.missing_count != '0'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ steps.prepare.outputs.missing }}/
          repository-url: https://test.pypi.org/legacy/
          attestations: true
          skip-existing: false
          print-hash: true
      - uses: ./.github/actions/release-index
        with:
          phase: verify
          index: testpypi
          bundle: candidate
          evidence: rehearsal
      - name: Present concrete candidate for Dave's approval
        env:
          SOURCE: ${{ needs.candidate.outputs.source }}
          VERSION: ${{ needs.candidate.outputs.version }}
        shell: bash
        run: |
          {
            echo "## Production approval: Parallax $VERSION"
            echo "Source: $SOURCE"
            echo "Release manifest SHA-256: $(sha256sum candidate/release-manifest.json | cut -d ' ' -f 1)"
            echo "CI: $(jq -r .run.html_url candidate/ci.json)"
            echo "All 25 artifact downloads match; all six distributions passed the TestPyPI installation smoke test."
            echo "Full validation, PostgreSQL, provenance and timing evidence is retained in the candidate draft release and workflow artifacts."
            echo 'Production requires Dave’s explicit approval of the protected pypi environment.'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: testpypi-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: rehearsal/
          retention-days: 90
          if-no-files-found: error

  retain-rehearsal:
    needs: [candidate, rehearsal]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: testpypi-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: rehearsal
      - run: tar -czf testpypi-evidence.tar.gz rehearsal
      - run: gh release upload "release-candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" testpypi-evidence.tar.gz --repo "$GITHUB_REPOSITORY"

  publish:
    if: inputs.operation != 'bootstrap' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: [candidate, rehearsal, retain-rehearsal]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: ${{ needs.candidate.outputs.source }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.15'
      - uses: astral-sh/setup-uv@v7
      - name: Fetch attested candidate source
        run: git fetch --no-tags origin "$SOURCE"
      - name: Require candidate source to be present on main
        shell: bash
        run: |
          if ! git merge-base --is-ancestor "$SOURCE" origin/main; then
            source_tree=$(git rev-parse "$SOURCE^{tree}")
            git log --format=%T origin/main | grep -Fx "$source_tree"
          fi
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - uses: ./.github/actions/release-index
        id: prepare
        with:
          phase: prepare
          index: pypi
          bundle: candidate
          evidence: production
      - name: Upload only missing verified bytes with publication attestations
        if: steps.prepare.outputs.missing_count != '0'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ steps.prepare.outputs.missing }}/
          repository-url: https://upload.pypi.org/legacy/
          attestations: true
          skip-existing: false
          print-hash: true
      - uses: ./.github/actions/release-index
        with:
          phase: verify
          index: pypi
          bundle: candidate
          evidence: production
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pypi-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: production/
          retention-days: 90
          if-no-files-found: error

  announce:
    needs: [candidate, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      SOURCE: ${{ needs.candidate.outputs.source }}
      VERSION: ${{ needs.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: release-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate
      - uses: actions/download-artifact@v8
        with:
          name: pypi-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: production
      - name: Retain production verification and publish the verified release
        shell: bash
        run: |
          tar -czf pypi-evidence.tar.gz production
          gh release upload "release-candidate-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" pypi-evidence.tar.gz
          {
            printf 'Parallax %s is published to PyPI.\n\n' "$VERSION"
            printf 'Production artifact downloads match the validated manifest for source `%s`.\n\n' "$SOURCE"
            printf '[Release notes](https://github.com/%s/blob/%s/languages/python/docs/releases.md)\n' "$GITHUB_REPOSITORY" "$SOURCE"
          } > published-notes.md
          gh release create "v$VERSION" candidate/dist/* candidate/release-manifest.json candidate/wheel-manifest.json candidate/ci.json pypi-evidence.tar.gz --target "$SOURCE" --title "Parallax $VERSION" --notes-file published-notes.md
