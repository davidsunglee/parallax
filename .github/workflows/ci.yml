name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret scanning: fail fast on live credentials or credentials whose verifier
  # could not conclusively determine status. GitHub secret scanning should still
  # be enabled for continuous repository monitoring where available.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The Lob detector matches `test_` followed by 35 word characters, which is
      # the shape of an ordinary Python test function name — 46 already in this
      # repository, none of them a credential. Excluding it costs nothing here:
      # no part of this project integrates with Lob, so a real Lob key would be
      # unexplainable rather than merely leaked. Every other detector stays on.
      - name: Scan for leaked secrets
        uses: trufflesecurity/trufflehog@v3.97.5
        with:
          extra_args: --results=verified,unknown --exclude-detectors=lob

  # The root justfile against the language testing contract: the command
  # grammar, the execution/aggregate roles, the scheduling partition and its
  # composition, the declared runtime classes, the test layout, the runner
  # configuration, and this job list. No Docker required.
  check-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Sync harness deps
        working-directory: reference-harness
        run: uv sync --frozen
      - name: just check-gates
        run: just check-gates

  # Validation of the core spec and compatibility corpus: module-graph DAG
  # legality + the coverage gate (every in-scope module has a fixture), the
  # profile gate (each tagged slice is consistent with its canonical describe
  # claim), schema/meta-schema validation + sqlglot-parse, and the
  # language-contract diagnostics against canonical inputs. No Docker required.
  core-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Sync harness deps
        working-directory: reference-harness
        run: uv sync --frozen
      - name: just core-check
        run: just core-check

  # Markdown lint across core/spec, languages/**/spec, and root.
  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: just lint-markdown
        run: just lint-markdown

  # Conventional-commit validation across the PR commit range.
  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate PR commits
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  # The harness's own code health plus every harness test whose fixture closure
  # reaches no database provider. No Docker required.
  harness-check-dbfree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Sync harness deps
        working-directory: reference-harness
        run: uv sync --frozen
      - name: just harness-check-dbfree
        run: just harness-check-dbfree

  # The compatibility corpus across the database matrix. Docker is available on
  # GitHub-hosted ubuntu runners, so Testcontainers works out of the box.
  harness-check-db:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, mariadb]
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Sync harness deps
        working-directory: reference-harness
        run: uv sync --frozen
      - name: just harness-check-db (${{ matrix.database }})
        env:
          PARALLAX_DATABASES: ${{ matrix.database }}
        run: just harness-check-db

  # Every Python check that needs no live database on the latest CPython: ruff
  # (lint + format check), Pyright strict, the generated import-linter
  # forbidden-edge complement (DAG-sync check) + lint-imports, the database-free
  # test selection + branch coverage + diff-cover, the database-access guard,
  # dead-code scan, build + distribution metadata, and the supply-chain audit.
  # The previous CPython minor runs the database-free tests only. No Docker.
  python-check-dbfree:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
    env:
      UV_FROZEN: "1"
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # python-coverage-diff compares changed lines against origin/main.
          fetch-depth: 0
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync Python workspace (frozen)
        working-directory: languages/python
        run: uv sync --frozen

      # The latest supported interpreter owns the complete database-free gate,
      # including the branch-coverage and diff-coverage verdicts.
      - name: just python-check-dbfree
        if: matrix.python-version == '3.14'
        run: just python-check-dbfree

      # The previous supported interpreter proves runtime compatibility without
      # recomputing coverage. Before Python 3.14, coverage.py cannot use
      # sys.monitoring for branch coverage and falls back to the slower C tracer.
      # Remove this step and the condition above when Python 3.13 rolls off.
      - name: just python-test-dbfree
        if: matrix.python-version != '3.14'
        env:
          PYTEST_ADDOPTS: "--no-cov"
        run: just python-test-dbfree

  # Every Python check that needs a live database: provisions Testcontainers
  # Postgres and runs the pg-full run sweep, provider contract, adapter smoke,
  # and API conformance. Docker is available on GitHub-hosted ubuntu runners, so
  # PARALLAX_REQUIRE_DB turns a provider skip into a failure here — a green run
  # has therefore exercised every database-backed check, never skipped one.
  python-check-db:
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1"
      PARALLAX_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Sync Python workspace (frozen)
        working-directory: languages/python
        run: uv sync --frozen
      - name: just python-check-db
        run: just python-check-db

  # Every Python check needing an interpreter no other test shares: the memory
  # instruments read the whole process, so each measurement is taken in a child
  # that has loaded only what it needs. `just check` deliberately omits this
  # class (core/spec/language-testing.md §7) so the command run after every
  # change stays fast; this job is what keeps it gated on every change instead.
  # Each child is CPU-bound work in an interpreter of its own, so a single
  # runner cannot shorten them: the class is split across cells rather than
  # across more workers within one. Together the cells are the one run the class
  # command owns (§9), over the shards `test_scheduling_partition.py` grades
  # against this matrix.
  python-check-cost:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/6", "2/6", "3/6", "4/6", "5/6", "6/6"]
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Sync Python workspace (frozen)
        working-directory: languages/python
        run: uv sync --frozen
      - name: just python-check-cost (shard ${{ matrix.shard }})
        run: just python-check-cost ${{ matrix.shard }}

  # Advisory only: the committed cost evidence is verified against the head
  # lock and, on pull requests, against the event-merge lock, in seconds.
  # Nothing here measures; fresh captures are the cost-report workflow's, on
  # request by label, dispatch, or the nightly schedule.
  python-verify-cost:
    runs-on: ubuntu-latest
    # Advisory until the canonical capture is retaken: its write-lowering member
    # records the workload digest of instrument source that has since changed, so
    # verification reports that member stale and exits non-zero on every run.
    continue-on-error: true
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          # advisories asks whether the producing commit is an ancestor of the
          # inspected head.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Identify the inspected head
        shell: bash
        run: echo "HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Verify committed evidence against head lock
        shell: bash
        run: |
          echo "## Committed evidence: head lock $HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          uv run --project languages/python python languages/python/tools/cost_report.py --verify languages/python/docs/structural-metadata-envelope/recovered/portfolio.json 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check committed evidence against event merge lock
        if: github.event_name == 'pull_request' && !cancelled()
        shell: bash
        env:
          MERGE_SHA: ${{ github.sha }}
        run: |
          echo "## Committed evidence: event merge lock $MERGE_SHA" >> "$GITHUB_STEP_SUMMARY"
          git fetch --no-tags origin "$MERGE_SHA"
          git show "$MERGE_SHA:languages/python/uv.lock" > "$RUNNER_TEMP/event-merge-uv.lock"
          uv run --project languages/python python languages/python/tools/cost_report.py --freshness-only languages/python/docs/structural-metadata-envelope/recovered/portfolio.json --lock-file "$RUNNER_TEMP/event-merge-uv.lock" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  # The Pydantic parity corpus resolved against the minimum Pydantic release
  # parallax-core declares, rather than against the locked one
  # `python-check-dbfree` already grades it on. A published value presents its
  # instance state to Pydantic's own readers, so the declared floor is the end of
  # the supported range where that seam could behave differently. The recipe is a
  # focused selector and is therefore no aggregate's dependency
  # (core/spec/language-testing.md §3); this job is what runs it on every change,
  # the same division that gives the prior interpreter minor its own leg above.
  python-test-pydantic-floor:
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.14"
      - name: Sync Python workspace (frozen)
        working-directory: languages/python
        run: uv sync --frozen
      - name: just python-test-pydantic-floor
        run: just python-test-pydantic-floor
