name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:
    inputs:
      environment-version:
        description: The TestEnvironment parameter version the cloud run must observe
        type: string
        required: false
        default: ""

permissions:
  contents: read

# Cancel superseded runs on the same ref and event. The event keeps a push from
# cancelling a scheduled or dispatched run on main, and each dispatched run has
# a group of its own, so no later run can cancel the one a deployment waits on.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}${{ github.event_name == 'workflow_dispatch' && format('-{0}', github.run_id) || '' }}
  cancel-in-progress: true

jobs:
  wheel-relevance:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.inputs.outputs.required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - name: Decide wheel relevance
        id: inputs
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          relevant=$(python languages/python/tools/wheel_relevance.py --base "$BASE")
          echo "required=$relevant" >> "$GITHUB_OUTPUT"

  wheels:
    needs: wheel-relevance
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    uses: ./.github/workflows/wheels.yml
    with:
      validate: ${{ needs.wheel-relevance.outputs.required == 'true' }}
    permissions:
      contents: read
      actions: read

  # Secret scanning: fail fast on live credentials or credentials whose verifier
  # could not conclusively determine status. GitHub secret scanning should still
  # be enabled for continuous repository monitoring where available.
  secrets:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # The Lob detector matches `test_` followed by 35 word characters, which is
      # the shape of an ordinary Python test function name — 46 already in this
      # repository, none of them a credential. Excluding it costs nothing here:
      # no part of this project integrates with Lob, so a real Lob key would be
      # unexplainable rather than merely leaked. Every other detector stays on.
      - name: Scan for leaked secrets
        uses: trufflesecurity/trufflehog@v3.99.7
        with:
          extra_args: --results=verified,unknown --exclude-detectors=lob

  # The root justfile against the language testing contract: the command
  # grammar, the execution/aggregate roles, the scheduling partition and its
  # composition, the declared runtime classes, the test layout, the runner
  # configuration, and this job list. No Docker required.
  check-gates:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15.2"
      - name: Sync harness deps
        working-directory: reference-harness
        run: uv sync --frozen
      - name: just check-gates
        run: just check-gates

  # Validation of the core spec and compatibility corpus: module-graph DAG
  # legality + the coverage gate (every in-scope module has a fixture), the
  # profile gate (each tagged slice is consistent with its canonical describe
  # claim), schema/meta-schema validation + sqlglot-parse, and the
  # language-contract diagnostics against canonical inputs. No Docker required.
  core-check:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15.2"
      - name: Sync harness deps
        working-directory: reference-harness
        run: uv sync --frozen
      - name: just core-check
        run: just core-check

  # Markdown lint over the globs .markdownlint-cli2.jsonc declares.
  lint-markdown:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: just lint-markdown
        run: just lint-markdown

  # Duplicated-code scans over the harness and the Python implementation, each
  # against its own threshold.
  lint-duplication:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: just lint-duplication
        run: just lint-duplication

  # Conventional-commit validation across the PR commit range.
  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate PR commits
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  # The harness's own code health plus every harness test whose fixture closure
  # reaches no database provider. No Docker required.
  harness-check-dbfree:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15.2"
      - name: Sync harness deps
        working-directory: reference-harness
        run: uv sync --frozen
      - name: just harness-check-dbfree
        run: just harness-check-dbfree

  # The compatibility corpus across the database matrix. Docker is available on
  # GitHub-hosted ubuntu runners, so Testcontainers works out of the box.
  harness-check-db:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, mariadb]
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15.2"
      - name: Sync harness deps
        working-directory: reference-harness
        run: uv sync --frozen
      - name: just harness-check-db (${{ matrix.database }})
        env:
          PARALLAX_DATABASES: ${{ matrix.database }}
        run: just harness-check-db

  # Every infrastructure check: formatting, lint, types, dead code, import
  # boundaries, the source inventory, generated types, the lockfile, dependency
  # audits, a synthesis from compiled output, and tests with changed-line
  # coverage. No AWS credential exists here, and every command also runs isolated
  # from any. The harness environment supplies the changed-line coverage tool.
  infra-check-dbfree:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          # infra-coverage-diff compares changed lines against origin/main.
          fetch-depth: 0
      - uses: extractions/setup-just@v4
      - uses: pnpm/action-setup@v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15.2"
      - run: pnpm install --frozen-lockfile
      - name: Sync harness deps
        working-directory: reference-harness
        run: uv sync --frozen
      - name: just infra-check-dbfree
        run: just infra-check-dbfree

  # Static validation runs beside the tests; their canonical aggregates have
  # disjoint execution owners, including the native-source prerequisites.
  python-check-static:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15.2"
      - name: Sync Python workspace (frozen)
        working-directory: languages/python
        run: uv sync --frozen
      - name: just python-check-static
        run: just python-check-static

  python-test-dbfree:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14.10", "3.15.2"]
    env:
      UV_FROZEN: "1"
      UV_PYTHON: ${{ matrix.python-version }}
      # Python 3.14 proves runtime compatibility without the slower branch
      # tracer; the latest interpreter owns coverage, here and in python-check-db.
      PYTEST_ADDOPTS: ${{ matrix.python-version != '3.15.2' && '--no-cov' || '' }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The tree python-check-db tests: python-coverage-diff reads only data
          # measured on the tree it grades.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync Python workspace (frozen)
        working-directory: languages/python
        run: uv sync --frozen
      - name: just python-test-dbfree
        run: just python-test-dbfree
      - name: Retain coverage data
        if: matrix.python-version == '3.15.2'
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-dbfree-${{ github.run_attempt }}
          path: languages/python/reports/coverage/dbfree/
          if-no-files-found: error
          retention-days: 7

  postgres-versions:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.versions.outputs.versions }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.15"
      - name: Select PostgreSQL floor and latest
        id: versions
        shell: bash
        run: |
          versions=$(python languages/python/tools/postgres_matrix.py --output postgres-matrix.json)
          echo "versions=$versions" >> "$GITHUB_OUTPUT"
          echo "PostgreSQL main-suite versions: $versions" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: postgres-matrix-${{ github.run_id }}-${{ github.run_attempt }}
          path: postgres-matrix.json
          retention-days: 90

  # Every Python check that needs a live database: provisions Testcontainers
  # Postgres and runs the pg-full run sweep, provider contract, adapter smoke,
  # and API conformance. Docker is available on GitHub-hosted ubuntu runners, so
  # PARALLAX_REQUIRE_DB turns a provider skip into a failure here — a green run
  # has therefore exercised every database-backed check, never skipped one.
  python-check-db:
    if: github.event_name == 'push' || github.event_name == 'pull_request' || github.event_name == 'schedule'
    needs: postgres-versions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14.10", "3.15.2"]
        shard: ["1/2", "2/2"]
        postgres-version: ${{ fromJSON(needs.postgres-versions.outputs.versions) }}
    env:
      PARALLAX_DB_SHARD: ${{ matrix.shard }}
      PARALLAX_POSTGRES_VERSION: ${{ matrix.postgres-version }}
      PARALLAX_POSTGRES_EVIDENCE: reports/postgres-versions
      UV_FROZEN: "1"
      UV_PYTHON: ${{ matrix.python-version }}
      PARALLAX_REQUIRE_DB: "1"
      PYTEST_ADDOPTS: "--durations=0 --junitxml=reports/db-tests.xml --timing-report=reports/db-timings ${{ matrix.python-version != '3.15.2' && '--no-cov' || '' }}"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Identify database test source
        shell: bash
        run: echo "PARALLAX_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync Python workspace (frozen)
        working-directory: languages/python
        run: uv sync --frozen
      - name: just python-check-db
        run: just python-check-db ${{ matrix.shard }}

      - name: Retain database test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: db-test-timings-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: |
            languages/python/reports/db-tests.xml
            languages/python/reports/db-timings/
            languages/python/reports/postgres-versions/
          retention-days: 90
      - name: Retain coverage data
        if: matrix.python-version == '3.15.2'
        uses: actions/upload-artifact@v7
        with:
          name: python-coverage-db-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: languages/python/reports/coverage/db/
          if-no-files-found: error
          retention-days: 7

  # The changed-line gate over what the dbfree cell and every database cell of the
  # latest interpreter measured, shards and PostgreSQL versions alike. Each
  # artifact lands in a directory of its own, the layout the classes leave locally.
  python-check-coverage:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    needs: [python-test-dbfree, python-check-db]
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1"
      UV_PYTHON: "3.15.2"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # python-coverage-diff compares changed lines against origin/main.
          fetch-depth: 0
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15.2"
      - name: Sync Python workspace (frozen)
        working-directory: languages/python
        run: uv sync --frozen
      - name: Fetch coverage data
        uses: actions/download-artifact@v8
        with:
          pattern: python-coverage-*
          path: languages/python/reports/coverage
      - name: just python-check-coverage
        run: just python-check-coverage

  # Every Python test needing an interpreter no other test shares, or the
  # committed cost evidence: the memory instruments read the whole process, so
  # each measurement is taken in a child that has loaded only what it needs, and
  # a verdict on the evidence is owed to a recapture. `just check` deliberately
  # omits this class (core/spec/language-testing.md §7) so the command run after
  # every change stays fast; these jobs are what keep it gated on every change
  # instead, running `python-check-cost`'s dependencies side by side. Each child
  # is CPU-bound work in an interpreter of its own, so a single runner cannot
  # shorten them: the class's tests are split across cells rather than across
  # more workers within one. Together the cells are the one run the class's test
  # command owns (§9), over the shards `test_scheduling_partition.py` grades
  # against this matrix.
  python-test-cost:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ["1/6", "2/6", "3/6", "4/6", "5/6", "6/6"]
    env:
      UV_FROZEN: "1"
      PYTEST_ADDOPTS: "--durations=0 --junitxml=reports/cost-tests.xml -o junit_duration_report=call --timing-report=reports/cost-timings"
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15.2"
      - name: Sync Python workspace (frozen)
        working-directory: languages/python
        run: uv sync --frozen
      - name: just python-test-cost (shard ${{ matrix.shard }})
        run: just python-test-cost ${{ matrix.shard }}

      - name: Retain cost test durations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cost-test-durations-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: |
            languages/python/reports/cost-tests.xml
            languages/python/reports/cost-timings/
          retention-days: 7

  # The cost class's confinement check, beside the tests it confines.
  python-check-instrument-access:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15.2"
      - name: Sync Python workspace (frozen)
        working-directory: languages/python
        run: uv sync --frozen
      - name: just python-check-instrument-access
        run: just python-check-instrument-access

  # The committed canonical capture verified against the head lock and, on pull
  # requests, against the event-merge lock, in seconds. It fails only for
  # evidence that is not evidence, and the answer to that is a capture, so a
  # change to an input a digest covers blocks until the evidence is retaken.
  # Drift that leaves a capture evidence is an advisory line and blocks nothing.
  # Nothing here measures; fresh captures are the cost-report workflow's, on
  # request by label, dispatch, or the nightly schedule.
  python-check-evidence:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          # advisories asks whether the producing commit is an ancestor of the
          # inspected head.
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15.2"
      - name: Identify the inspected head
        shell: bash
        run: echo "HEAD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: just python-check-evidence
        shell: bash
        run: |
          echo "## Committed evidence: head lock $HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
          just python-check-evidence 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Check committed evidence against event merge lock
        if: github.event_name == 'pull_request' && !cancelled()
        shell: bash
        env:
          MERGE_SHA: ${{ github.sha }}
        run: |
          echo "## Committed evidence: event merge lock $MERGE_SHA" >> "$GITHUB_STEP_SUMMARY"
          git fetch --no-tags origin "$MERGE_SHA"
          git show "$MERGE_SHA:languages/python/uv.lock" > "$RUNNER_TEMP/event-merge-uv.lock"
          uv run --project languages/python python languages/python/tools/cost_report.py --freshness-only languages/python/evidence/cost/current/portfolio.json --lock-file "$RUNNER_TEMP/event-merge-uv.lock" 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"

  # The Pydantic parity corpus resolved against the minimum Pydantic release
  # parallax-core declares, rather than against the locked one
  # `python-check-dbfree` already grades it on. A published value presents its
  # instance state to Pydantic's own readers, so the declared floor is the end of
  # the supported range where that seam could behave differently. The recipe is a
  # focused selector and is therefore no aggregate's dependency
  # (core/spec/language-testing.md §3); this job is what runs it on every change,
  # the same division that gives the prior interpreter minor its own leg above.
  python-test-pydantic-floor:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14.10", "3.15.2"]
    env:
      UV_FROZEN: "1"
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync Python workspace (frozen)
        working-directory: languages/python
        run: uv sync --frozen
      - name: just python-test-pydantic-floor
        run: just python-test-pydantic-floor

  # The compiled loaders under psycopg's C build. The adapter compiles one loader
  # body against each psycopg build and imports the one psycopg selected, so the
  # build the lock does not install is graded here: psycopg-c is compiled against
  # the runner's system libpq and the differential tests run with it selected.
  # A focused selector like the floor above, and for the same reason no
  # aggregate's dependency.
  python-test-psycopg-c:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14.10", "3.15.2"]
    env:
      UV_FROZEN: "1"
      UV_PYTHON: ${{ matrix.python-version }}
      PARALLAX_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install libpq headers and pg_config
        run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - name: Sync Python workspace (frozen)
        working-directory: languages/python
        run: uv sync --frozen
      - name: just python-test-psycopg-c
        run: just python-test-psycopg-c

  # Whether this change could affect the cloud class, and so whether the cloud
  # path runs: the pathspec list below is where relevance is decided. Scheduled
  # and dispatched runs are always relevant. A base the checkout cannot reach is
  # treated as relevant rather than guessed at; anything else this cannot decide
  # fails the job, which fails the verdict.
  cloud-relevance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      relevant: ${{ steps.relevance.outputs.relevant }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Decide relevance
        id: relevance
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          case "$EVENT" in
            schedule | workflow_dispatch)
              echo "relevant=true" >> "$GITHUB_OUTPUT"
              exit 0
              ;;
            push | pull_request) ;;
            *)
              echo "no relevance rule for the $EVENT event" >&2
              exit 1
              ;;
          esac
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE" HEAD -- \
            languages/python/packages \
            languages/python/tests/_support \
            languages/python/tests/conftest.py \
            languages/python/tests/provider_contract/aws \
            languages/python/pyproject.toml \
            languages/python/uv.lock \
            infra \
            pnpm-lock.yaml \
            reference-harness/src/reference_harness/cloud_verdict.py \
            reference-harness/src/reference_harness/ci_workflow.py \
            reference-harness/pyproject.toml \
            reference-harness/uv.lock \
            .github/workflows \
            justfile)"
          if [ -n "$changed" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

  # The cloud class against each provider's deployed environment, on that
  # provider's runner: the AWS cell runs on the private CodeBuild runner, whose
  # role reaches the test cluster's login and its published TestEnvironment and
  # nothing else. A pull request from a fork reaches it only once a maintainer
  # approves the run, through this same job. A dispatched run must observe the
  # TestEnvironment version its dispatcher deployed.
  python-check-cloud:
    name: python-check-cloud (${{ matrix.provider }})
    needs: cloud-relevance
    if: needs.cloud-relevance.outputs.relevant == 'true'
    runs-on: ${{ matrix.runner }}
    concurrency:
      group: cloud-${{ matrix.provider }}
      queue: max
      cancel-in-progress: false
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - provider: aws
            runner: codebuild-parallax-ci-${{ github.run_id }}-${{ github.run_attempt }}
    env:
      UV_FROZEN: "1"
      PARALLAX_CLOUD_PROVIDERS: ${{ matrix.provider }}
      PARALLAX_AWS_ENVIRONMENT_VERSION: ${{ inputs.environment-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15.2"
      - name: Sync Python workspace (frozen)
        working-directory: languages/python
        run: uv sync --frozen
      - name: just python-check-cloud (${{ matrix.provider }})
        run: just python-check-cloud

  # The required status for the cloud class. It needs the relevance job alone
  # and runs whatever that job's outcome, so a cloud cell whose runner never
  # arrives fails it within a bound instead of holding it open; it reads the
  # cells from this run attempt's own jobs record and can change nothing.
  cloud-verdict:
    needs: cloud-relevance
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 145
    permissions:
      actions: read
      contents: read
    env:
      UV_FROZEN: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.15.2"
      - name: Sync harness deps
        working-directory: reference-harness
        run: uv sync --frozen
      - name: Supervise the cloud cells
        working-directory: reference-harness
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEVANCE_RESULT: ${{ needs.cloud-relevance.result }}
          RELEVANT: ${{ needs.cloud-relevance.outputs.relevant }}
        run: uv run python -m reference_harness.cloud_verdict --workflow ../.github/workflows/ci.yml --job python-check-cloud
