name: ci

on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Secret scanning: fail fast on live credentials or credentials whose verifier
  # could not conclusively determine status. GitHub secret scanning should still
  # be enabled for continuous repository monitoring where available.
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Scan for leaked secrets
        uses: trufflesecurity/trufflehog@v3.96.0
        with:
          extra_args: --results=verified,unknown

  # The root justfile against the language testing contract: the command
  # grammar, the execution/aggregate roles, the scheduling partition and its
  # composition, the declared runtime classes, the test layout, the runner
  # configuration, and this job list. No Docker required.
  check-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
      - name: Sync harness deps
        working-directory: reference-harness
        run: uv sync --frozen
      - name: just check-gates
        run: just check-gates

  # Validation of the core spec and compatibility corpus: module-graph DAG
  # legality + the coverage gate (every in-scope module has a fixture), the
  # profile gate (each tagged slice is consistent with its canonical describe
  # claim), schema/meta-schema validation + sqlglot-parse, and the
  # language-contract diagnostics against canonical inputs. No Docker required.
  core-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
      - name: Sync harness deps
        working-directory: reference-harness
        run: uv sync --frozen
      - name: just core-check
        run: just core-check

  # Markdown lint across core/spec, languages/**/spec, and root.
  lint-markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: just lint-markdown
        run: just lint-markdown

  # Conventional-commit validation across the PR commit range.
  commitlint:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6.0.9
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate PR commits
        run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}

  # The harness's own code health plus every harness test whose fixture closure
  # reaches no database provider. No Docker required.
  harness-check-dbfree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
      - name: Sync harness deps
        working-directory: reference-harness
        run: uv sync --frozen
      - name: just harness-check-dbfree
        run: just harness-check-dbfree

  # The compatibility corpus across the database matrix. Docker is available on
  # GitHub-hosted ubuntu runners, so Testcontainers works out of the box.
  harness-check-db:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [postgres, mariadb]
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
      - name: Sync harness deps
        working-directory: reference-harness
        run: uv sync --frozen
      - name: just harness-check-db (${{ matrix.database }})
        env:
          PARALLAX_DATABASES: ${{ matrix.database }}
        run: just harness-check-db

  # Every Python check that needs no live database, across the supported CPython
  # matrix: ruff (lint + format check), Pyright strict, the generated
  # import-linter forbidden-edge complement (DAG-sync check) + lint-imports, the
  # database-free test selection + branch coverage + diff-cover, the
  # database-access guard, dead-code scan, build + distribution metadata, and the
  # supply-chain audit. No Docker.
  python-check-dbfree:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    env:
      UV_FROZEN: "1"
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # python-coverage-diff compares changed lines against origin/main.
          fetch-depth: 0
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Sync Python workspace (frozen)
        working-directory: languages/python
        run: uv sync --frozen
      - name: just python-check-dbfree
        run: just python-check-dbfree

  # Every Python check that needs a live database: provisions Testcontainers
  # Postgres and runs the pg-full run sweep, provider contract, adapter smoke,
  # and API conformance. Docker is available on GitHub-hosted ubuntu runners, so
  # PARALLAX_REQUIRE_DB turns a provider skip into a failure here — a green run
  # has therefore exercised every database-backed check, never skipped one.
  python-check-db:
    runs-on: ubuntu-latest
    env:
      UV_FROZEN: "1"
      PARALLAX_REQUIRE_DB: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: extractions/setup-just@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - name: Sync Python workspace (frozen)
        working-directory: languages/python
        run: uv sync --frozen
      - name: just python-check-db
        run: just python-check-db
