# Benchmark fixture (m-perf-bench): the deep-fetch shapes workload.
#
# Prices, at scale, the statement shape m-deep-fetch's N+1 elimination produces.
# The headline property is that a deep fetch costs `1 + levels` round trips
# regardless of fan-out: a 1 -> N -> N fetch over P parents is THREE statements
# (root + items + statuses), never 1 + N + N. This fixture authors that shape and
# times it: a run executes the statements below and reports how many it issued, so
# `expectRoundTrips` keeps the declared arithmetic consistent with the statement
# list rather than catching a target that fell back to N+1. What refuses THAT is
# the compatibility corpus's golden statements for m-deep-fetch.
#
# A multi-statement workload lists its golden SQL as an ORDERED list per dialect
# (one per relationship level) with one bind list per statement — the child levels
# keyed by the parent IN-list. The generated dataset builds P orders, each with K
# items, each item with K statuses, so the fan-out is real.
# Builds 200 orders; for each order K=5 items; for each item K=5 statuses
# (so order_item has 1,000 rows and order_status 5,000). Deterministic.
tags: [m-perf-bench, deep-fetch]
model: models/orders.yaml
dataset:
  generate:
    rows: 200
    recipe: orders-tree
    fanout: 5
workloads:
  - name: deep-fetch-1-N
    note: root + to-many items — TWO statements over 200 parents, never 1 + 200
    iterations: 50
    expectRoundTrips: 2
    statements:
      - sql:
          postgres: select t0.id, t0.name from orders t0 where t0.id <= ?
          mariadb: select t0.id, t0.name from orders t0 where t0.id <= ?
        binds: [5]
      - sql:
          postgres: select t0.id, t0.order_id, t0.sku, t0.quantity from order_item t0 where t0.order_id in (?, ?, ?, ?, ?)
          mariadb: select t0.id, t0.order_id, t0.sku, t0.quantity from order_item t0 where t0.order_id in (?, ?, ?, ?, ?)
        binds: [1, 2, 3, 4, 5]
  - name: deep-fetch-1-N-N
    note: root + items + statuses — THREE statements, the N+1-eliminating shape
    iterations: 50
    expectRoundTrips: 3
    statements:
      - sql:
          postgres: select t0.id, t0.name from orders t0 where t0.id <= ?
          mariadb: select t0.id, t0.name from orders t0 where t0.id <= ?
        binds: [5]
      - sql:
          postgres: select t0.id, t0.order_id, t0.sku, t0.quantity from order_item t0 where t0.order_id in (?, ?, ?, ?, ?)
          mariadb: select t0.id, t0.order_id, t0.sku, t0.quantity from order_item t0 where t0.order_id in (?, ?, ?, ?, ?)
        binds: [1, 2, 3, 4, 5]
      - sql:
          postgres: select t0.id, t0.order_id, t0.order_item_id, t0.code from order_status t0 where t0.order_item_id in (?, ?, ?, ?, ?)
          mariadb: select t0.id, t0.order_id, t0.order_item_id, t0.code from order_status t0 where t0.order_item_id in (?, ?, ?, ?, ?)
        binds: [1, 2, 3, 4, 5]
