# Benchmark fixture (m-perf-bench): the Relational Document Layout query and write mix.
#
# The benchmark README's "Add Or Change Core Behavior" rule asks for a benchmark once
# a change makes a query or write SHAPE part of the claim, which is what this layout
# does: the same members read through one Structured Column rather than through five
# columns, and the same members written as one document rather than five cells.
#
# The dataset is the corpus model's own three rows, loaded through the same fixture
# path every case uses, so the document each row stores is the codec's rather than
# this file's.
#
# Three workloads, each with `expectRoundTrips`, so the report carries a statement
# count beside every timing rather than a wall-time reading alone:
#
#   - document-path-filter (200): a scalar path predicate through the typed-cast seam
#   - instance-read (200):        the whole document projected once and fanned out
#   - patch-update (100):         a two-assignment patch, ONE statement
#
# `patch-update` is the one whose count carries the most meaning: the contract's
# patch is ONE statement, where a read-modify-write of the whole Structured Column
# would issue a SELECT before its UPDATE and cost two. This fixture authors the
# one-statement shape and prices it, so `expectRoundTrips: 1` records what a
# conforming patch costs; what refuses the two-statement shape is the corpus's
# golden statements for the layout.
#
# Its `displayName` value carries the `$i` iteration sentinel INSIDE the JSON text,
# so each repeat writes a distinct value and an engine that skips a physically
# unchanged row still does the work being measured. The sentinel cannot ride as a
# bare bind here: the mutation expression's value hole takes JSON text
# (m-case-format), and a host integer bound into `cast(? as jsonb)` is a typed
# parameter Postgres refuses outright.
tags: [m-perf-bench, m-storage-layout, document-layout]
model: models/document-layout.yaml
dataset:
  rows:
    parallax.compatibility.Traveler:
      - id: 1
        displayName: Ada
        score: 7
        joinedOn: "2026-01-15"
        note: north wing
        address: { city: Oslo, geo: { country: "NO" } }
        tags: [{ label: founder }]
      - id: 2
        displayName: Bo
        score: 30
        joinedOn: "2025-12-31"
        address: { city: Bergen, geo: { country: "NO" } }
      - id: 3
        displayName: Cyd
        score: null
        joinedOn: null
        note: null
        address: null
workloads:
  - name: document-path-filter
    note: a scalar document-path predicate through the m-dialect typed cast — one statement, one round trip
    iterations: 200
    expectRoundTrips: 1
    statements:
      - sql:
          postgres: select t0.id, t0.payload from traveler t0 where cast(jsonb_extract_path_text(t0.payload, ?) as bigint) > ?
          mariadb: select t0.id, t0.payload from traveler t0 where cast(json_value(t0.payload, ?) as signed) > ?
        binds:
          postgres: [score, 5]
          mariadb: ['$.score', 5]
  - name: instance-read
    note: the instance-form read — the Structured Column projected ONCE, every member decoded from it
    iterations: 200
    expectRoundTrips: 1
    statements:
      - sql:
          postgres: select t0.id, t0.payload from traveler t0
          mariadb: select t0.id, t0.payload from traveler t0
  - name: patch-update
    kind: write
    note: a two-assignment patch update — ONE statement, no resolving read; a read-modify-write regression takes two round trips
    iterations: 100
    expectRoundTrips: 1
    statements:
      - sql:
          postgres: update traveler set payload = jsonb_set(jsonb_set(payload, ?, cast(? as jsonb)), ?, cast(? as jsonb)) where id = ?
          mariadb: update traveler set payload = json_set(payload, ?, json_extract(?, '$'), ?, json_extract(?, '$')) where id = ?
        binds:
          postgres: ['{displayName}', '"Ada-$i"', '{score}', '21', 1]
          mariadb: ['$.displayName', '"Ada-$i"', '$.score', '21', 1]
  - name: guarded-occurrence-assignment
    kind: write
    note: depth 2, two named leaves, one guarded object write-back per occurrence level, one statement and one round trip
    iterations: 100
    expectRoundTrips: 1
    statements:
      - sql:
          postgres: 'update traveler set payload = jsonb_set(payload, ?, jsonb_set(jsonb_set(case when jsonb_typeof(payload #> ?) = ? then payload #> ? else cast(? as jsonb) end, ?, cast(? as jsonb)), ?, jsonb_set(case when jsonb_typeof(payload #> ?) = ? then payload #> ? else cast(? as jsonb) end, ?, cast(? as jsonb)))) where id = ?'
          mariadb: update traveler set payload = json_set(payload, ?, json_set(json_set(case when json_type(json_extract(payload, ?)) = ? then json_extract(payload, ?) else json_object() end, ?, json_extract(?, '$')), ?, json_set(case when json_type(json_extract(payload, ?)) = ? then json_extract(payload, ?) else json_object() end, ?, json_extract(?, '$')))) where id = ?
        binds:
          postgres: ['{address}', '{address}', object, '{address}', '{}', '{city}', '"Oslo-$i"', '{geo}', '{address,geo}', object, '{address,geo}', '{}', '{country}', '"NO"', 1]
          mariadb: ['$.address', '$.address', OBJECT, '$.address', '$.city', '"Oslo-$i"', '$.geo', '$.address.geo', OBJECT, '$.address.geo', '$.country', '"NO"', 1]
