        binds: [20, 7]
      - sql:
          postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id in (?, ?, ?, ?, ?, ?, ?) order by t0.id desc
          mariadb: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id in (?, ?, ?, ?, ?, ?, ?) order by t0.id desc
        binds: [1, 2, 3, 4, 5, 6, 7]
      - sql:
          postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.id <= ? and t0.id > ? order by t0.id asc limit ?
          mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.id <= ? and t0.id > ? order by t0.id asc limit ?
        binds: [20, 7, 7]
      - sql:
          postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id in (?, ?, ?, ?, ?, ?, ?) order by t0.id desc
          mariadb: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id in (?, ?, ?, ?, ?, ?, ?) order by t0.id desc
        binds: [8, 9, 10, 11, 12, 13, 14]
      - sql:
          postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.id <= ? and t0.id > ? order by t0.id asc limit ?
          mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.id <= ? and t0.id > ? order by t0.id asc limit ?
        binds: [20, 14, 7]
