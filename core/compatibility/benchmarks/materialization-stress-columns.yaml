tags: [m-perf-bench, m-snapshot-read, materialization-stress]
model: models/materialization-stress-columns.yaml
dataset:
  generate:
    rows: 200
    recipe: materialization-stress
    fanout: 4
objectQuery:
  target: snapshot.materialization.Owner
  predicate: { "true": {} }
  includes:
    - segments: [{ rel: snapshot.materialization.Owner.nodes }]
    - segments:
        - rel: snapshot.materialization.Owner.special
          narrowTo: [snapshot.materialization.Alpha]
    - segments: [{ rel: snapshot.materialization.Owner.favorite }]
    - segments:
        - rel: snapshot.materialization.Owner.nodes
        - rel: snapshot.materialization.Node.owner
delivery:
  pageSizes: [1, 32, 128]
