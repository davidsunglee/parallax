# The retired temporal container `asOfAttributes` named each axis after an
# as-of attribute of its own; an axis is identified by its Temporal Dimension,
# and the dimensions an entity carries are derived from its `temporality`
# profile rather than authored. The entity's closed key set rejects the retired
# container itself, whatever its entries carry, as one `additionalProperties`
# violation at the entity — the spelling can never be re-admitted silently by
# loosening the entry shape alone.
phase: schema
code: descriptor-schema-invalid
violations:
  - path: [entity]
    rule: additionalProperties
