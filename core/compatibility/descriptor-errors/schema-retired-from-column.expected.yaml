# The retired `fromColumn` bound a temporal axis's inclusive start directly to a
# physical column, on an axis a descriptor no longer authors at all: an axis and
# both its endpoints are derived from `temporality`, and their columns are
# framework-fixed. The retired key therefore travels inside the retired
# `asOfAxes` container, and the entity's closed key set rejects that container as
# one `additionalProperties` violation at the entity — so re-admitting the
# container without also refusing `fromColumn` fails here by name.
phase: schema
code: descriptor-schema-invalid
violations:
  - path: [entity]
    rule: additionalProperties
