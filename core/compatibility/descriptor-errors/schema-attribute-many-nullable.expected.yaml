# A scalar collection (`multiplicity: many`) is an ordered, non-null sequence
# whose sole zero-element form is the empty collection, so `many` +
# `nullable: true` is rejected. The forbidden combination fails a `not` keyword,
# reported as one violation at the Attribute it applies to.
phase: schema
code: descriptor-schema-invalid
violations:
  - path: [entity, attributes, 1]
    rule: not
