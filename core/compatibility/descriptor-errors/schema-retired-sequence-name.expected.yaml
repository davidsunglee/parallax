# The retired member `sequenceName` is replaced by `name` inside the
# `pkGeneration` key-sequence object. `pkGeneration` is a closed union (the bare
# `application-assigned` token or a key-sequence object), so an object carrying the retired member
# fails every branch and — by the branching-keyword collapse rule — reports
# exactly one `oneOf` violation at the pkGeneration value, never per-branch
# sub-errors.
phase: schema
code: descriptor-schema-invalid
violations:
  - path: [entity, attributes, 0, pkGeneration]
    rule: oneOf
