# Phase-3 value fixture: in a two-entity document the first entity is entirely
# valid and the second carries an unconstructible decimal spelling, so the one
# violation is reported at the second entity's own document path.
entities:
  - name: Instrument
    table: instrument
    attributes:
      - name: id
        type: int64
        primaryKey: true
  - name: Measurement
    table: measurement
    attributes:
      - name: id
        type: int64
        primaryKey: true
      - name: ratio
        type: decimal(0,9)
