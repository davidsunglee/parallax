# The Temporality Profile admits only the nontemporal / transaction-time /
# bitemporal vocabulary; a value outside the closed enum reports `enum` at the
# offending value. The rejected spelling is `valid-time` on purpose: a lone
# Valid-Time axis is the separately catalogued Valid-Time-Only formation, which
# the profile vocabulary has no accepted spelling for, so no document naming it
# is admitted.
phase: schema
code: descriptor-schema-invalid
violations:
  - path: [entity, temporality]
    rule: enum
