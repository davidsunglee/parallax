# Identifier components are raw: case, a reserved word, a dot, and an embedded
# quote character are all part of the name and survive normalization unchanged.
reader: postgres
normalized:
  format_version: 1
  backend: postgres
  default: { schema: Tenant.Acme }
  entities:
    commerce.Customer: { schema: 'legacy "crm"', table: order }
    commerce.Order: { table: Order.Lines }
