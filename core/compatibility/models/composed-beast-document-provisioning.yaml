# Den exists only in this provisioning model, so provisioning resolved through
# the reader would refuse it rather than pass unnoticed.
entities:
  - name: Beast
    namespace: parallax.compatibility
    table: beast_document
    layout:
      document:
        column: payload
    inheritance:
      role: root
      strategy: table-per-hierarchy
      tag:
        column: kind
    attributes:
      - name: id
        type: int64
        primaryKey: true
      - name: name
        type: string
        maxLength: 32
      - name: leaderId
        type: int64
        nullable: true
    relationships:
      - name: followers
        cardinality: one-to-many
        join:
          source: id
          target: { entity: parallax.compatibility.Beast, attribute: leaderId }
        orderBy:
          - { attribute: id }
  - name: Fox
    namespace: parallax.compatibility
    inheritance:
      role: concrete-subtype
      parent: parallax.compatibility.Beast
      tagValue: fox
    attributes:
      - name: brush
        type: string
        maxLength: 16
  - name: Wolf
    namespace: parallax.compatibility
    inheritance:
      role: concrete-subtype
      parent: parallax.compatibility.Beast
      tagValue: wolf
    attributes:
      - name: howl
        type: string
        maxLength: 16
  - name: Bear
    namespace: parallax.compatibility
    inheritance:
      role: concrete-subtype
      parent: parallax.compatibility.Beast
      tagValue: bear
    attributes:
      - name: roar
        type: string
        maxLength: 16
  - name: Den
    namespace: parallax.compatibility
    table: den_document
    layout:
      document:
        column: payload
    attributes:
      - name: id
        type: int64
        primaryKey: true
      - name: name
        type: string
        maxLength: 32
