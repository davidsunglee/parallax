entities:
  - name: Person
    namespace: parallax.compatibility
    table: person
    attributes:
      - name: id
        type: int64
        primaryKey: true
      - name: name
        type: string
        maxLength: 64
    relationships:
      - name: passport
        cardinality: one-to-one
        join:
          source: id
          target: { entity: parallax.compatibility.Passport, attribute: personId }
        dependent: true
  - name: Passport
    namespace: parallax.compatibility
    table: passport
    attributes:
      - name: id
        type: int64
        primaryKey: true
      - name: personId
        type: int64
      - name: number
        type: string
        maxLength: 32
    relationships:
      - name: holder
        reverseOf: parallax.compatibility.Person.passport
    indices:
      - name: passport_person
        attributes: [personId]
        unique: true
