# Folder / Item (v1): the earlier endpoint of the Relationship ORDERING
# scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. The
# association orders the Entities it reaches, which is the only result ordering
# the model itself defines.
entities:
  - name: Folder
    namespace: parallax.compatibility
    table: evolution_folder
    attributes:
      - { name: id, type: int64, primaryKey: true }
    relationships:
      - name: items
        cardinality: one-to-many
        join:
          source: id
          target: { entity: parallax.compatibility.Item, attribute: folderId }
        orderBy:
          - { attribute: label }
  - name: Item
    namespace: parallax.compatibility
    table: evolution_item
    attributes:
      - { name: id, type: int64, primaryKey: true }
      - { name: folderId, type: int64 }
      - { name: label, type: string, maxLength: 32 }
