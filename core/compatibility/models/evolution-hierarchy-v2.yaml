# Deal (v2): the later endpoint of the TABLE-PER-HIERARCHY subtype scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. It is
# models/evolution-hierarchy-v1.yaml plus the concrete `Future`, whose own
# nullable member the subtype addition describes.
entities:
  - name: Deal
    namespace: parallax.compatibility
    table: evolution_deal
    inheritance:
      role: root
      strategy: table-per-hierarchy
      tag:
        column: kind
    attributes:
      - name: id
        type: int64
        primaryKey: true
      - name: notional
        type: decimal(18,2)
  - name: Swap
    namespace: parallax.compatibility
    inheritance:
      role: concrete-subtype
      parent: parallax.compatibility.Deal
      tagValue: swap
    attributes:
      - name: tenor
        type: int64
        nullable: true
  - name: Future
    namespace: parallax.compatibility
    inheritance:
      role: concrete-subtype
      parent: parallax.compatibility.Deal
      tagValue: future
    attributes:
      - name: expiry
        type: timestamp
        nullable: true
