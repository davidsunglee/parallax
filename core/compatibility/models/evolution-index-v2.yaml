# Pallet (v2): the later endpoint of the authored INDEX scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. It is
# models/evolution-index-v1.yaml with the non-unique access path gone and a
# unique enforcement rule in its place.
entity:
  name: Pallet
  namespace: parallax.compatibility
  table: evolution_pallet
  attributes:
    - { name: id, type: int64, primaryKey: true }
    - { name: label, type: string, maxLength: 32 }
    - { name: serial, type: string, maxLength: 32 }
  indices:
    - { name: pallet_serial, attributes: [serial], unique: true }
