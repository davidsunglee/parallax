# A native key sequence on a Transaction-Time-Only entity (m-pk-gen +
# m-temporal-write): an insert takes its key from a reserved block, then opens a
# milestone `[in_z = txInstant, out_z = infinity)` carrying it. Temporal
# successors keep the key the insert allocated.
entity:
  name: AuditEntry
  namespace: parallax.compatibility
  table: audit_entry
  temporality: transaction-time
  attributes:
    - name: id
      type: int64
      primaryKey: true
      pkGeneration: { strategy: key-sequence, name: entry_seq }
    - name: note
      type: string
      maxLength: 64
