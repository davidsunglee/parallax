# Vessel (v1): the earlier endpoint of the TABLE-PER-CONCRETE-SUBTYPE scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. Each
# concrete position owns its own Table and the abstract root is tableless, which
# is what makes a later concrete subtype invisible to an earlier reader: it
# occupies a Table the earlier edition never reads.
entities:
  - name: Vessel
    namespace: parallax.compatibility
    inheritance:
      role: root
      strategy: table-per-concrete-subtype
    attributes:
      - name: id
        type: int64
        primaryKey: true
      - name: tonnage
        type: int64
  - name: Barge
    namespace: parallax.compatibility
    table: evolution_barge
    inheritance:
      role: concrete-subtype
      parent: parallax.compatibility.Vessel
    attributes:
      - name: draft
        type: int64
        nullable: true
