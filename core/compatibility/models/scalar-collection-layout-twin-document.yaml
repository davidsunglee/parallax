# Relational Document Layout member of the scalar collection transparency twin.
# Its only difference from the Columns member is the root-owned layout block, so
# every top-level collection is an array member of the shared `payload` document
# and every nested collection an array inside its occurrence's subtree there.
entity:
  name: CollectionTwinItem
  namespace: parallax.compatibility
  table: collection_twin
  layout:
    document:
      column: payload
  attributes:
    - name: id
      type: int64
      primaryKey: true
    - name: flags
      type: boolean
      multiplicity: many
    - name: smalls
      type: int32
      multiplicity: many
    - name: counts
      type: int64
      multiplicity: many
    - name: ratios
      type: float32
      multiplicity: many
    - name: scores
      type: float64
      multiplicity: many
    - name: amounts
      type: decimal(12,2)
      multiplicity: many
    - name: tags
      type: string
      multiplicity: many
    - name: blobs
      type: bytes
      multiplicity: many
    - name: days
      type: date
      multiplicity: many
    - name: clocks
      type: time
      multiplicity: many
    - name: instants
      type: timestamp
      multiplicity: many
    - name: tokens
      type: uuid
      multiplicity: many
  valueObjects:
    - name: detail
      nullable: true
      attributes:
        - name: labels
          type: string
          multiplicity: many
    - name: parts
      multiplicity: many
      attributes:
        - name: sku
          type: string
        - name: marks
          type: int32
          multiplicity: many
      valueObjects:
        - name: note
          nullable: true
          attributes:
            - name: words
              type: string
              multiplicity: many
