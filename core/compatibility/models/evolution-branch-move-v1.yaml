# Filing and Docket (v1): the earlier endpoint of the BRANCH MOVE scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. Two
# independent table-per-hierarchy families exist so that a concrete position can
# leave one branch for the other in v2 — a narrowing through the earlier branch
# stops resolving, and the rows themselves belong to a different Table.
entities:
  - name: Filing
    namespace: parallax.compatibility
    table: evolution_filing
    inheritance:
      role: root
      strategy: table-per-hierarchy
      tag:
        column: kind
    attributes:
      - name: id
        type: int64
        primaryKey: true
      - name: filedOn
        type: date
  - name: Brief
    namespace: parallax.compatibility
    inheritance:
      role: concrete-subtype
      parent: parallax.compatibility.Filing
      tagValue: brief
    attributes:
      - name: pages
        type: int64
        nullable: true
  - name: Motion
    namespace: parallax.compatibility
    inheritance:
      role: concrete-subtype
      parent: parallax.compatibility.Filing
      tagValue: motion
    attributes:
      - name: relief
        type: string
        maxLength: 64
        nullable: true
  - name: Docket
    namespace: parallax.compatibility
    table: evolution_docket
    inheritance:
      role: root
      strategy: table-per-hierarchy
      tag:
        column: kind
    attributes:
      - name: id
        type: int64
        primaryKey: true
      - name: openedOn
        type: date
  - name: Summons
    namespace: parallax.compatibility
    inheritance:
      role: concrete-subtype
      parent: parallax.compatibility.Docket
      tagValue: summons
    attributes:
      - name: served
        type: boolean
        nullable: true
