# Orders model: five related non-temporal entities.
#
# This file is a model descriptor — an instance of
# core/schemas/metamodel.schema.json. It is intentionally pure metadata: no
# fixture rows live here (the descriptor IS the serialized m-descriptor metamodel, and the
# metamodel schema forbids extra top-level keys). Row data for a model lives in
# the sibling core/compatibility/fixtures/<model-stem>.yaml file.
#
# Order carries string / decimal / nullable / boolean columns so the Predicate
# algebra's range, null, string, and membership comparisons have attributes to
# exercise, and the other four give relationships, navigate / exists predicates,
# and deep fetch something to traverse:
#   - Order        — the root entity.
#   - OrderItem    — line items; many belong to one Order (one-to-many `items`).
#   - OrderStatus  — status events; each belongs to an Order, and OPTIONALLY to a
#                    specific OrderItem. This lets one entity serve both the
#                    to-one `Order.status`-style lookup and the multi-hop
#                    `Order.items -> OrderItem.statuses` deep-fetch path.
#   - OrderTag     — labels carrying a priority, so one relationship can declare a
#                    MULTI-KEY ordering whose second key breaks the first's ties.
#   - OrderNote    — notes with an optional resolution date, so each authorable
#                    direction/Null-Placement pair of a DECLARED ordering gets its
#                    own relationship over one nullable key. There are three, not
#                    four: canonical form omits a default, so `asc` with Nulls Last
#                    is exactly the placement-free `Order.itemsByShipDate`.
#
# The multi-hop `Order.items -> OrderItem.statuses` path is the 1 -> N -> N case
# that MUST resolve in exactly three statements (root + items + statuses), never
# 1 + N + N, which is how the suite proves N+1 elimination automatically.
entities:
  - name: Order
    namespace: parallax.compatibility
    table: orders
    attributes:
      - name: id
        type: int64
        primaryKey: true
      - name: name
        type: string
        maxLength: 255
      - name: sku
        type: string
        maxLength: 32
        nullable: true
      - name: qty
        type: int32
      - name: price
        type: decimal(18,2)
      - name: active
        type: boolean
      - name: orderedOn
        type: date
    relationships:
      - name: items
        cardinality: one-to-many
        join:
          source: id
          target: { entity: parallax.compatibility.OrderItem, attribute: orderId }
        dependent: true
        orderBy:
          - { attribute: id, direction: desc }
      - name: statuses
        cardinality: one-to-many
        join:
          source: id
          target: { entity: parallax.compatibility.OrderStatus, attribute: orderId }
        dependent: true
      - name: tags
        cardinality: one-to-many
        join:
          source: id
          target: { entity: parallax.compatibility.OrderTag, attribute: orderId }
        orderBy:
          - { attribute: priority, direction: desc }
          - { attribute: label }
      - name: itemsByShipDate
        cardinality: one-to-many
        join:
          source: id
          target: { entity: parallax.compatibility.OrderItem, attribute: orderId }
        orderBy:
          - { attribute: shippedOn }
      - name: notesAscNullsFirst
        cardinality: one-to-many
        join:
          source: id
          target: { entity: parallax.compatibility.OrderNote, attribute: orderId }
        orderBy:
          - { attribute: resolvedOn, nulls: first }
      - name: notesDescNullsLast
        cardinality: one-to-many
        join:
          source: id
          target: { entity: parallax.compatibility.OrderNote, attribute: orderId }
        orderBy:
          - { attribute: resolvedOn, direction: desc }
      - name: notesDescNullsFirst
        cardinality: one-to-many
        join:
          source: id
          target: { entity: parallax.compatibility.OrderNote, attribute: orderId }
        orderBy:
          - { attribute: resolvedOn, direction: desc, nulls: first }
    indices:
      - name: orders_sku
        attributes: [sku]
  - name: OrderItem
    namespace: parallax.compatibility
    table: order_item
    attributes:
      - name: id
        type: int64
        primaryKey: true
      - name: orderId
        type: int64
      - name: sku
        type: string
        maxLength: 32
      - name: quantity
        type: int32
      - name: shippedOn
        type: date
        nullable: true
    relationships:
      - name: order
        reverseOf: parallax.compatibility.Order.items
      - name: statuses
        cardinality: one-to-many
        join:
          source: id
          target: { entity: parallax.compatibility.OrderStatus, attribute: orderItemId }
        dependent: true
        orderBy:
          - { attribute: code }
    indices:
      - name: order_item_order_id
        attributes: [orderId]
  - name: OrderStatus
    namespace: parallax.compatibility
    table: order_status
    attributes:
      - name: id
        type: int64
        primaryKey: true
      - name: orderId
        type: int64
      - name: orderItemId
        type: int64
        nullable: true
      - name: code
        type: string
        maxLength: 16
    relationships:
      - name: order
        reverseOf: parallax.compatibility.Order.statuses
      - name: orderItem
        reverseOf: parallax.compatibility.OrderItem.statuses
    indices:
      - name: order_status_order_id
        attributes: [orderId]
  - name: OrderTag
    namespace: parallax.compatibility
    table: order_tag
    attributes:
      - name: id
        type: int64
        primaryKey: true
      - name: orderId
        type: int64
      - name: label
        type: string
        maxLength: 32
      - name: priority
        type: int32
    relationships:
      - name: order
        reverseOf: parallax.compatibility.Order.tags
    indices:
      - name: order_tag_order_id
        attributes: [orderId]
  - name: OrderNote
    namespace: parallax.compatibility
    table: order_note
    attributes:
      - name: id
        type: int64
        primaryKey: true
      - name: orderId
        type: int64
      - name: body
        type: string
        maxLength: 32
      - name: resolvedOn
        type: date
        nullable: true
    indices:
      - name: order_note_order_id
        attributes: [orderId]
