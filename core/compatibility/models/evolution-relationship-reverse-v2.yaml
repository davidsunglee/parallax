# Folder / Bin / Item (v2): the later endpoint of the REVERSE RELATIONSHIP
# scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. It is
# models/evolution-relationship-reverse-v1.yaml with `holder` naming the other
# defining declaration, so the direction it navigates reaches a different Entity.
entities:
  - name: Bin
    namespace: parallax.compatibility
    table: evolution_bin
    attributes:
      - { name: id, type: int64, primaryKey: true }
    relationships:
      - name: items
        cardinality: one-to-many
        join:
          source: id
          target: { entity: parallax.compatibility.Item, attribute: binId }
  - name: Folder
    namespace: parallax.compatibility
    table: evolution_folder
    attributes:
      - { name: id, type: int64, primaryKey: true }
    relationships:
      - name: items
        cardinality: one-to-many
        join:
          source: id
          target: { entity: parallax.compatibility.Item, attribute: folderId }
  - name: Item
    namespace: parallax.compatibility
    table: evolution_item
    attributes:
      - { name: id, type: int64, primaryKey: true }
      - { name: binId, type: int64 }
      - { name: folderId, type: int64 }
    relationships:
      - name: holder
        reverseOf: parallax.compatibility.Bin.items
