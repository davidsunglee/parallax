# Folder / Item (v1): the earlier endpoint of the Relationship JOIN scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. Both
# candidate target Attributes exist at both endpoints, so the pair varies which
# rows the association reaches while the target Entity survives it.
entities:
  - name: Folder
    namespace: parallax.compatibility
    table: evolution_folder
    attributes:
      - { name: id, type: int64, primaryKey: true }
    relationships:
      - name: items
        cardinality: one-to-many
        join:
          source: id
          target: { entity: parallax.compatibility.Item, attribute: folderId }
  - name: Item
    namespace: parallax.compatibility
    table: evolution_item
    attributes:
      - { name: id, type: int64, primaryKey: true }
      - { name: folderId, type: int64 }
      - { name: ownerId, type: int64 }
