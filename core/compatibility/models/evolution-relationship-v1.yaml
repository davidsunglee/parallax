# Folder / Item / Note (v1): the earlier endpoint of the Relationship
# ADD-AND-REMOVE scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. Both
# target Entities are declared at both endpoints, so the pair varies exactly the
# Relationship declarations.
entities:
  - name: Folder
    namespace: parallax.compatibility
    table: evolution_folder
    attributes:
      - { name: id, type: int64, primaryKey: true }
    relationships:
      - name: notes
        cardinality: one-to-many
        join:
          source: id
          target: { entity: parallax.compatibility.Note, attribute: folderId }
  - name: Item
    namespace: parallax.compatibility
    table: evolution_item
    attributes:
      - { name: id, type: int64, primaryKey: true }
      - { name: folderId, type: int64 }
  - name: Note
    namespace: parallax.compatibility
    table: evolution_note
    attributes:
      - { name: id, type: int64, primaryKey: true }
      - { name: folderId, type: int64 }
