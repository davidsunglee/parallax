# Balance and Register (v2): the later endpoint of the OPTIMISTIC LOCKING
# scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. It is
# models/evolution-optimistic-locking-v1.yaml with the two Entities' explicit
# version declarations exchanged.
entities:
  - name: Balance
    namespace: parallax.compatibility
    table: evolution_balance
    attributes:
      - name: id
        type: int64
        primaryKey: true
      - name: version
        type: int64
        optimisticLocking: true
  - name: Register
    namespace: parallax.compatibility
    table: evolution_register
    attributes:
      - name: id
        type: int64
        primaryKey: true
      - name: revision
        type: int64
