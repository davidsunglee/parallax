# Archive and Excerpt (v1): the earlier endpoint of the UNBOUNDED INDICES
# scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. Two
# Entities in two Tables each carry an unbounded String, so the later endpoint's
# two access paths become two refusals on a database that cannot build either.
entities:
  - name: Archive
    namespace: parallax.compatibility
    table: evolution_archive
    attributes:
      - { name: id, type: int64, primaryKey: true }
      - { name: body, type: string }
  - name: Excerpt
    namespace: parallax.compatibility
    table: evolution_excerpt
    attributes:
      - { name: id, type: int64, primaryKey: true }
      - { name: passage, type: string }
