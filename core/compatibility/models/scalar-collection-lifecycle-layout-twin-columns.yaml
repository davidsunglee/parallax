# Columns member of the scalar collection lifecycle twin. Every owner kind holds a
# scalar collection: a versioned standalone Entity (with another inside a nullable
# `one`), a Transaction-Time-Only and a Bitemporal Entity, a table-per-hierarchy
# family whose root, abstract subtype, and concretes each declare one, and a
# table-per-concrete-subtype family whose root and concretes do. Under Columns each
# top-level collection is a structured Column of its own, and a sibling's collection
# is NULL in a table-per-hierarchy row it does not apply to. The Document twin
# differs only by the root-owned layout block on each layout owner.
entities:
  - name: TagLedger
    namespace: parallax.compatibility
    table: tag_ledger
    attributes:
      - {name: id, type: int64, primaryKey: true}
      - {name: version, type: int32, optimisticLocking: true}
      - {name: label, type: string, maxLength: 16}
      - {name: tags, type: string, multiplicity: many}
    valueObjects:
      - name: route
        nullable: true
        attributes:
          - {name: stops, type: string, multiplicity: many}
  - name: TagLog
    namespace: parallax.compatibility
    table: tag_log
    temporality: transaction-time
    attributes:
      - {name: id, type: int64, primaryKey: true}
      - {name: tags, type: string, multiplicity: many}
  - name: TagSpan
    namespace: parallax.compatibility
    table: tag_span
    temporality: bitemporal
    attributes:
      - {name: id, type: int64, primaryKey: true}
      - {name: amount, type: int64}
      - {name: marks, type: int32, multiplicity: many}
  - name: TagAsset
    namespace: parallax.compatibility
    table: tag_asset
    inheritance: {role: root, strategy: table-per-hierarchy, tag: {column: kind}}
    attributes:
      - {name: id, type: int64, primaryKey: true}
      - {name: tags, type: string, multiplicity: many}
  - name: TagDevice
    namespace: parallax.compatibility
    inheritance: {role: abstract-subtype, parent: parallax.compatibility.TagAsset}
    attributes:
      - {name: ports, type: int32, multiplicity: many}
  - name: TagPhone
    namespace: parallax.compatibility
    inheritance: {role: concrete-subtype, parent: parallax.compatibility.TagDevice, tagValue: phone}
    attributes:
      - {name: numbers, type: string, multiplicity: many}
      - {name: codes, type: bytes, multiplicity: many}
  - name: TagDesk
    namespace: parallax.compatibility
    inheritance: {role: concrete-subtype, parent: parallax.compatibility.TagAsset, tagValue: desk}
    attributes:
      - {name: legs, type: string, multiplicity: many}
  - name: TagKit
    namespace: parallax.compatibility
    inheritance: {role: root, strategy: table-per-concrete-subtype}
    attributes:
      - {name: id, type: int64, primaryKey: true}
      - {name: tags, type: string, multiplicity: many}
  - name: TagDrill
    namespace: parallax.compatibility
    table: tag_drill
    inheritance: {role: concrete-subtype, parent: parallax.compatibility.TagKit}
    attributes:
      - {name: bits, type: int32, multiplicity: many}
  - name: TagSaw
    namespace: parallax.compatibility
    table: tag_saw
    inheritance: {role: concrete-subtype, parent: parallax.compatibility.TagKit}
    attributes:
      - {name: blades, type: string, multiplicity: many}
