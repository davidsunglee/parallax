# Folder / Item / Archive (v1): the earlier endpoint of the Relationship TARGET
# scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. Both
# candidate targets are declared at both endpoints, so the pair varies which
# Entity a preserved navigation reaches.
entities:
  - name: Archive
    namespace: parallax.compatibility
    table: evolution_archive
    attributes:
      - { name: id, type: int64, primaryKey: true }
      - { name: folderId, type: int64 }
  - name: Folder
    namespace: parallax.compatibility
    table: evolution_folder
    attributes:
      - { name: id, type: int64, primaryKey: true }
    relationships:
      - name: holder
        cardinality: one-to-one
        join:
          source: id
          target: { entity: parallax.compatibility.Item, attribute: folderId }
  - name: Item
    namespace: parallax.compatibility
    table: evolution_item
    attributes:
      - { name: id, type: int64, primaryKey: true }
      - { name: folderId, type: int64 }
