# Folio (v1): the earlier endpoint of the ROWLESS SCALAR COLLECTION scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. The
# abstract `Sketch` composes no concrete subtype of its own, so it resolves to an
# empty effective concrete set while the family stays legal on `Page`.
entities:
  - name: Folio
    namespace: parallax.compatibility
    table: evolution_folio
    inheritance: {role: root, strategy: table-per-hierarchy, tag: {column: kind}}
    attributes:
      - {name: id, type: int64, primaryKey: true}
  - name: Sketch
    namespace: parallax.compatibility
    inheritance: {role: abstract-subtype, parent: parallax.compatibility.Folio}
  - name: Page
    namespace: parallax.compatibility
    inheritance: {role: concrete-subtype, parent: parallax.compatibility.Folio, tagValue: page}
    attributes:
      - {name: words, type: int32}
