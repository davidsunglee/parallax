# Two inheritance families whose abstract ROOT declares a to-many relationship with a
# to-one reverse, so a path can return to the root's family through a narrowed hop.
# Each family has three concretes: a narrow to two of them selects among the objects
# already fetched and leaves the third out. Keeper is table-per-concrete-subtype and
# Crew table-per-hierarchy.
entities:
  - name: Keeper
    namespace: parallax.compatibility
    inheritance: {role: root, strategy: table-per-concrete-subtype}
    attributes:
      - {name: id, type: int64, primaryKey: true}
      - {name: name, type: string, maxLength: 32}
    relationships:
      - name: charges
        cardinality: one-to-many
        join: {source: id, target: {entity: parallax.compatibility.Charge, attribute: keeperId}}
        orderBy: [{attribute: id}]
  - name: Ranger
    namespace: parallax.compatibility
    table: keeper_ranger
    inheritance: {role: concrete-subtype, parent: parallax.compatibility.Keeper}
  - name: Vet
    namespace: parallax.compatibility
    table: keeper_vet
    inheritance: {role: concrete-subtype, parent: parallax.compatibility.Keeper}
  - name: Warden
    namespace: parallax.compatibility
    table: keeper_warden
    inheritance: {role: concrete-subtype, parent: parallax.compatibility.Keeper}
  - name: Charge
    namespace: parallax.compatibility
    table: keeper_charge
    attributes:
      - {name: id, type: int64, primaryKey: true}
      - {name: keeperId, type: int64}
      - {name: label, type: string, maxLength: 32}
    relationships:
      - {name: keeper, reverseOf: parallax.compatibility.Keeper.charges}
  - name: Crew
    namespace: parallax.compatibility
    table: crew
    inheritance: {role: root, strategy: table-per-hierarchy, tag: {column: kind}}
    attributes:
      - {name: id, type: int64, primaryKey: true}
      - {name: name, type: string, maxLength: 32}
    relationships:
      - name: tasks
        cardinality: one-to-many
        join: {source: id, target: {entity: parallax.compatibility.Task, attribute: crewId}}
        orderBy: [{attribute: id}]
  - name: Cook
    namespace: parallax.compatibility
    inheritance: {role: concrete-subtype, parent: parallax.compatibility.Crew, tagValue: cook}
  - name: Medic
    namespace: parallax.compatibility
    inheritance: {role: concrete-subtype, parent: parallax.compatibility.Crew, tagValue: medic}
  - name: Pilot
    namespace: parallax.compatibility
    inheritance: {role: concrete-subtype, parent: parallax.compatibility.Crew, tagValue: pilot}
  - name: Task
    namespace: parallax.compatibility
    table: crew_task
    attributes:
      - {name: id, type: int64, primaryKey: true}
      - {name: crewId, type: int64}
      - {name: label, type: string, maxLength: 32}
    relationships:
      - {name: crew, reverseOf: parallax.compatibility.Crew.tasks}
