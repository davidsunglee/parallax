# Native key sequences (m-pk-gen *Native key sequences*), one allocator per
# entity, each with its own settings to cover the block arithmetic:
#   - Badge     (badge_seq):     initial 1,          increment 1,  batch 1
#   - Ticket    (ticket_seq):    initial 1000,       increment 5,  batch 1
#   - Pass      (pass_seq):      initial 1,          increment 1,  batch 3
#   - Voucher   (voucher_seq):   initial 100,        increment 10, batch 2
#   - Wristband (wristband_seq): initial 2147483646, increment 1,  batch 3, int32,
#     so its first block is clipped to the key range's last two keys.
entities:
  - name: Badge
    namespace: parallax.compatibility
    table: badge
    attributes:
      - name: id
        type: int64
        primaryKey: true
        pkGeneration: { strategy: key-sequence, name: badge_seq, batchSize: 1 }
      - { name: holder, type: string, maxLength: 64 }
  - name: Ticket
    namespace: parallax.compatibility
    table: ticket
    attributes:
      - name: id
        type: int64
        primaryKey: true
        pkGeneration: { strategy: key-sequence, name: ticket_seq, batchSize: 1, initialValue: 1000, incrementSize: 5 }
      - { name: tier, type: string, maxLength: 64 }
  - name: Pass
    namespace: parallax.compatibility
    table: pass
    attributes:
      - name: id
        type: int64
        primaryKey: true
        pkGeneration: { strategy: key-sequence, name: pass_seq, batchSize: 3 }
      - { name: zone, type: string, maxLength: 64 }
  - name: Voucher
    namespace: parallax.compatibility
    table: voucher
    attributes:
      - name: id
        type: int64
        primaryKey: true
        pkGeneration: { strategy: key-sequence, name: voucher_seq, initialValue: 100, incrementSize: 10, batchSize: 2 }
      - { name: label, type: string, maxLength: 64 }
  - name: Wristband
    namespace: parallax.compatibility
    table: wristband
    attributes:
      - name: id
        type: int32
        primaryKey: true
        pkGeneration: { strategy: key-sequence, name: wristband_seq, initialValue: 2147483646, batchSize: 3 }
      - { name: gate, type: string, maxLength: 64 }
