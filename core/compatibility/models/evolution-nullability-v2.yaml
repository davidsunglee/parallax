# Reading (v2): the NULLABLE end of the nullability scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. It is
# models/evolution-nullability-v1.yaml with `note` nullable and nothing else
# changed.
entity:
  name: Reading
  namespace: parallax.compatibility
  table: evolution_reading
  attributes:
    - name: id
      type: int64
      primaryKey: true
    - name: note
      type: string
      maxLength: 64
      nullable: true
