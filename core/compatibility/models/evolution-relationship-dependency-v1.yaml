# Folder / Item / Note (v1): the earlier endpoint of the Relationship
# DEPENDENCY scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. Two
# associations sit at opposite ends of the boundary, so one evolution moves each
# in the opposite direction.
entities:
  - name: Folder
    namespace: parallax.compatibility
    table: evolution_folder
    attributes:
      - { name: id, type: int64, primaryKey: true }
    relationships:
      - name: items
        cardinality: one-to-many
        join:
          source: id
          target: { entity: parallax.compatibility.Item, attribute: folderId }
      - name: notes
        cardinality: one-to-many
        dependent: true
        join:
          source: id
          target: { entity: parallax.compatibility.Note, attribute: folderId }
  - name: Item
    namespace: parallax.compatibility
    table: evolution_item
    attributes:
      - { name: id, type: int64, primaryKey: true }
      - { name: folderId, type: int64 }
  - name: Note
    namespace: parallax.compatibility
    table: evolution_note
    attributes:
      - { name: id, type: int64, primaryKey: true }
      - { name: folderId, type: int64 }
