# Folder / Bin / Item (v1): the earlier endpoint of the REVERSE RELATIONSHIP
# scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. Two
# defining declarations reach `Item` from different Entities, and the reverse
# declaration names one of them.
entities:
  - name: Bin
    namespace: parallax.compatibility
    table: evolution_bin
    attributes:
      - { name: id, type: int64, primaryKey: true }
    relationships:
      - name: items
        cardinality: one-to-many
        join:
          source: id
          target: { entity: parallax.compatibility.Item, attribute: binId }
  - name: Folder
    namespace: parallax.compatibility
    table: evolution_folder
    attributes:
      - { name: id, type: int64, primaryKey: true }
    relationships:
      - name: items
        cardinality: one-to-many
        join:
          source: id
          target: { entity: parallax.compatibility.Item, attribute: folderId }
  - name: Item
    namespace: parallax.compatibility
    table: evolution_item
    attributes:
      - { name: id, type: int64, primaryKey: true }
      - { name: binId, type: int64 }
      - { name: folderId, type: int64 }
    relationships:
      - name: holder
        reverseOf: parallax.compatibility.Folder.items
