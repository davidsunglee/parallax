# Folder / Item (v2): the later endpoint of the Relationship ORDERING scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. It is
# models/evolution-relationship-ordering-v1.yaml with the ordering term
# descending and nothing else changed.
entities:
  - name: Folder
    namespace: parallax.compatibility
    table: evolution_folder
    attributes:
      - { name: id, type: int64, primaryKey: true }
    relationships:
      - name: items
        cardinality: one-to-many
        join:
          source: id
          target: { entity: parallax.compatibility.Item, attribute: folderId }
        orderBy:
          - { attribute: label, direction: desc }
  - name: Item
    namespace: parallax.compatibility
    table: evolution_item
    attributes:
      - { name: id, type: int64, primaryKey: true }
      - { name: folderId, type: int64 }
      - { name: label, type: string, maxLength: 32 }
