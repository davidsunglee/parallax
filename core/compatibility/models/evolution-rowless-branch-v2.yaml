# Journal (v2): the later endpoint of the ROWLESS BRANCH scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. It is
# models/evolution-rowless-branch-v1.yaml with `Sketch` extending the root
# instead of `Bound`; nothing else differs. `Bound` declares no member, so the
# move withdraws nothing a read of `Sketch` could address.
entities:
  - name: Journal
    namespace: parallax.compatibility
    table: evolution_journal
    inheritance:
      role: root
      strategy: table-per-hierarchy
      tag:
        column: kind
    attributes:
      - name: id
        type: int64
        primaryKey: true
  - name: Bound
    namespace: parallax.compatibility
    inheritance:
      role: abstract-subtype
      parent: parallax.compatibility.Journal
  - name: Sketch
    namespace: parallax.compatibility
    inheritance:
      role: abstract-subtype
      parent: parallax.compatibility.Journal
  - name: Page
    namespace: parallax.compatibility
    inheritance:
      role: concrete-subtype
      parent: parallax.compatibility.Bound
      tagValue: page
    attributes:
      - name: body
        type: string
        maxLength: 64
