# Gear and Tool (v2): the later endpoint of the INHERITED SCALAR MULTIPLICITY
# scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. It is
# models/evolution-inherited-multiplicity-v1.yaml with every scalar collection
# declared single and every single scalar beside them declared a collection of
# the same type; nothing else differs.
entities:
  - name: Gear
    namespace: parallax.compatibility
    table: evolution_gear
    inheritance: {role: root, strategy: table-per-hierarchy, tag: {column: kind}}
    attributes:
      - {name: id, type: int64, primaryKey: true}
      - {name: labels, type: string}
  - name: Prototype
    namespace: parallax.compatibility
    inheritance: {role: abstract-subtype, parent: parallax.compatibility.Gear}
    attributes:
      - {name: marks, type: string, multiplicity: many}
  - name: Drill
    namespace: parallax.compatibility
    inheritance: {role: concrete-subtype, parent: parallax.compatibility.Gear, tagValue: drill}
    attributes:
      - {name: sizes, type: int32, multiplicity: many}
  - name: Tool
    namespace: parallax.compatibility
    layout: {document: {column: payload}}
    inheritance: {role: root, strategy: table-per-concrete-subtype}
    attributes:
      - {name: id, type: int64, primaryKey: true}
      - {name: tags, type: string, multiplicity: many}
  - name: Saw
    namespace: parallax.compatibility
    table: evolution_saw
    inheritance: {role: concrete-subtype, parent: parallax.compatibility.Tool}
    attributes:
      - {name: teeth, type: int32}
  - name: Lathe
    namespace: parallax.compatibility
    table: evolution_lathe
    inheritance: {role: concrete-subtype, parent: parallax.compatibility.Tool}
