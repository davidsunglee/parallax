# `version` keeps a target write of Magazine otherwise admissible: it states a valid
# `ifVersion`, so the family's read-only Persistence Mode is its only defect.
entities:
  - name: Publication
    namespace: parallax.compatibility
    table: publication
    persistence: read-only
    inheritance:
      role: root
      strategy: table-per-hierarchy
      tag:
        column: kind
    attributes:
      - name: id
        type: int64
        primaryKey: true
      - name: title
        type: string
        maxLength: 64
      - name: version
        type: int32
        optimisticLocking: true
  - name: Periodical
    namespace: parallax.compatibility
    inheritance:
      role: abstract-subtype
      parent: parallax.compatibility.Publication
    attributes:
      - name: frequency
        type: string
        maxLength: 16
        nullable: true
  - name: Magazine
    namespace: parallax.compatibility
    inheritance:
      role: concrete-subtype
      parent: parallax.compatibility.Periodical
      tagValue: magazine
    attributes:
      - name: issue
        type: int32
        nullable: true
