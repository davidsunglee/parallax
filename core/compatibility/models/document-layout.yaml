# Traveler / Trip / Ledger / Voyage / Charter / Beacon: the shared model for every
# Relational Document Layout witness.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. What makes it
# different from every other model in the corpus is one entity-level property:
# `layout.document.column`. The root owns it, and it moves every member the layout
# does NOT keep in a Column of its own into ONE shared Structured Column
# (m-storage-layout). Nothing else about the declaration changes — the members, their
# types, their nullability, and their Index are what any `Columns` model would carry —
# which is the point: one logical model, two physical shapes, one set of answers.
#
# `Traveler` keeps exactly one direct Column besides the Structured Column: `id`, the
# primary key, which is direct-column role 1. Everything else — four scalars and two
# Value Object occurrences — is document-resident and addressed by its Document Path:
#
#   displayName  ("displayName")     string    compares as the extracted text
#   score        ("score")           int64     compares through a dialect cast
#   joinedOn     ("joinedOn")        date      compares as the extracted text
#   note         ("note")            string    the presence pair below
#   address      ("address")         one       a subtree, with `geo` nested inside it
#   tags         ("tags")            many      an array, never null (m-document-codec)
#
# `note` is the presence pair: one row omits the key entirely and one writes an
# explicit JSON null, so a case can assert that a NULL Column's single not-present
# state and a document's two collapse to one logical answer (m-op-algebra).
#
# `Trip` is the join side. `travelerId` is one endpoint of `Traveler.trips`, so the
# layout keeps it in a Column of its own (direct-column role 2) beside the primary
# key, while `destination` and `nights` are document-resident. That is what makes a
# hop between two document-mapped Entities plain column equality: both endpoints are
# Columns under either layout, so no correlation predicate ever extracts from a
# document, and `trip_traveler_id` is an Index over a Column that really exists.
#
# `Ledger` is the versioned side. `version` carries `optimisticLocking`, which the
# layout keeps direct (role 5), so the per-object gate stays `and version = ?` over a
# Column while `label` and `balance` live in the document the same UPDATE patches.
# `balance` is a `decimal(18,2)`, whose document form is an exact digit string
# (m-document-codec) — a member whose stored spelling differs from its Column
# spelling, so a resolving read that skipped the decode would compare the wrong
# thing.
#
# `Beacon` and `Mooring` exist for the projection rule alone, and they divide its two
# halves. Both declare the same layout and NO document-resident member at all, so each
# one's Structured Column is physically present, `NOT NULL`, and holds a document
# nothing ever extracts from. `Beacon` is the half that projects nothing: a row-form
# read of its one member emits no document extraction whatsoever, because no member it
# was asked for lives inside one. `Mooring` is the half that projects anyway: it is
# Bitemporal, and a read that OBSERVES it — an instance-form find, or the resolving
# read a predicate write materializes from — carries the stored document itself,
# because that is what its Predecessor Row retains and what every rectangle a split
# chains is built from.
#
# Row data lives in the sibling fixtures/document-layout.yaml. Each fixture row
# authors its document-resident members under their own member names, in the spelling
# they would take if the layout had given each one a Column: the file describes one
# logical row and the codec decides how it is stored.
entities:
  - name: Traveler
    namespace: parallax.compatibility
    table: traveler
    layout:
      document:
        column: payload
    attributes:
      - name: id
        type: int64
        primaryKey: true
      - name: displayName
        type: string
        maxLength: 64
        nullable: true
      - name: score
        type: int64
        nullable: true
      - name: joinedOn
        type: date
        nullable: true
      - name: note
        type: string
        maxLength: 64
        nullable: true
    valueObjects:
      - name: address
        nullable: true
        attributes:
          - name: city
            type: string
            nullable: true
        valueObjects:
          - name: geo
            nullable: true
            attributes:
              - name: country
                type: string
                nullable: true
      - name: tags
        multiplicity: many
        attributes:
          - name: label
            type: string
            nullable: true
    relationships:
      - name: trips
        cardinality: one-to-many
        join:
          source: id
          target: { entity: parallax.compatibility.Trip, attribute: travelerId }
        orderBy:
          - { attribute: id }
    indices:
      - name: traveler_pk
        attributes: [id]
        unique: true
  # Trip: the far side of a relationship between two document-mapped Entities. Its
  # own primary key and the join endpoint `travelerId` are Columns; everything else
  # is document-resident.
  - name: Trip
    namespace: parallax.compatibility
    table: trip
    layout:
      document:
        column: payload
    attributes:
      - name: id
        type: int64
        primaryKey: true
      - name: travelerId
        type: int64
      - name: destination
        type: string
        maxLength: 64
        nullable: true
      - name: nights
        type: int32
        nullable: true
    relationships:
      - name: traveler
        reverseOf: parallax.compatibility.Traveler.trips
    indices:
      - name: trip_pk
        attributes: [id]
        unique: true
      - name: trip_traveler_id
        attributes: [travelerId]
  # Ledger: a document-mapped Entity carrying an explicit optimistic-lock version.
  - name: Ledger
    namespace: parallax.compatibility
    table: ledger
    layout:
      document:
        column: payload
    attributes:
      - name: id
        type: int64
        primaryKey: true
      - name: version
        type: int32
        optimisticLocking: true
      - name: label
        type: string
        maxLength: 64
        nullable: true
      - name: balance
        type: decimal(18,2)
        nullable: true
    valueObjects:
      - name: details
        nullable: true
        attributes:
          - name: code
            type: string
            nullable: true
    indices:
      - name: ledger_pk
        attributes: [id]
        unique: true
  # Voyage: the Transaction-Time-Only member of the family. The two axis bounds are
  # designated Attributes, so the layout keeps both in Columns of their own
  # (direct-column role 3) while `title`, `crew`, and the `manifest` occurrence are
  # document-resident. A milestone-chaining update closes the current row and chains
  # a successor whose Structured Column is the closed row's own document with the
  # assignment patched into it, so every key that document carried — one no member
  # declares included — survives the close-and-insert.
  - name: Voyage
    namespace: parallax.compatibility
    table: voyage
    layout:
      document:
        column: payload
    attributes:
      - name: id
        type: int64
        primaryKey: true
      - name: title
        type: string
        maxLength: 64
        nullable: true
      - name: crew
        type: int32
        nullable: true
      - name: tx_start
        type: timestamp
        column: in_z
      - name: tx_end
        type: timestamp
        column: out_z
    valueObjects:
      - name: manifest
        nullable: true
        attributes:
          - name: cargo
            type: string
            nullable: true
      - name: legs
        multiplicity: many
        attributes:
          - name: port
            type: string
            nullable: true
    asOfAxes:
      - dimension: transactionTime
        startAttribute: tx_start
        endAttribute: tx_end
    indices:
      - name: voyage_pk
        attributes: [id, tx_start]
        unique: true
  # Charter: the Bitemporal member. Four bound Attributes stay direct and the
  # rectangle split chains head / middle / tail milestones, each carrying a whole
  # document. `terms` is the occurrence the split's middle rectangle assigns, which
  # is where patching's one deliberate loss shows: an assigned subtree is replaced,
  # so a key no member declares INSIDE it does not survive while one outside does.
  - name: Charter
    namespace: parallax.compatibility
    table: charter
    layout:
      document:
        column: payload
    attributes:
      - name: id
        type: int64
        primaryKey: true
      - name: route
        type: string
        maxLength: 64
        nullable: true
      - name: valid_start
        type: timestamp
        column: from_z
      - name: valid_end
        type: timestamp
        column: thru_z
      - name: tx_start
        type: timestamp
        column: in_z
      - name: tx_end
        type: timestamp
        column: out_z
    valueObjects:
      - name: terms
        nullable: true
        attributes:
          - name: clause
            type: string
            nullable: true
    asOfAxes:
      - dimension: validTime
        startAttribute: valid_start
        endAttribute: valid_end
      - dimension: transactionTime
        startAttribute: tx_start
        endAttribute: tx_end
    indices:
      - name: charter_pk
        attributes: [id, valid_start, tx_start]
        unique: true
  # Beacon: a document-layout Entity whose only member is its primary key, which the
  # layout keeps direct. Its Structured Column carries the empty object and nothing
  # ever extracts from it.
  - name: Beacon
    namespace: parallax.compatibility
    table: beacon
    layout:
      document:
        column: payload
    attributes:
      - name: id
        type: int64
        primaryKey: true
    indices:
      - name: beacon_pk
        attributes: [id]
        unique: true
  # Mooring: Beacon's Bitemporal twin. Its primary key and all four axis bounds hold
  # direct-column roles, so like Beacon it has no document-resident member — but every
  # observation of it retains the whole Structured Column, and the rectangles a split
  # chains carry that document forward. A key no member declares therefore survives a
  # close-and-insert on a model that decodes nothing out of the document at all, which
  # is the state a newer application version leaves behind for an older one.
  - name: Mooring
    namespace: parallax.compatibility
    table: mooring
    layout:
      document:
        column: payload
    attributes:
      - name: id
        type: int64
        primaryKey: true
      - name: valid_start
        type: timestamp
        column: from_z
      - name: valid_end
        type: timestamp
        column: thru_z
      - name: tx_start
        type: timestamp
        column: in_z
      - name: tx_end
        type: timestamp
        column: out_z
    asOfAxes:
      - dimension: validTime
        startAttribute: valid_start
        endAttribute: valid_end
      - dimension: transactionTime
        startAttribute: tx_start
        endAttribute: tx_end
    indices:
      - name: mooring_pk
        attributes: [id, valid_start, tx_start]
        unique: true
