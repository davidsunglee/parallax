# Parcel (v2): the later endpoint of the SCALAR COLLECTION MEMBERS scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. It is
# models/evolution-collection-members-v1.yaml with `legacy` and `origin.zones`
# removed and the collections `tags` and `origin.codes` added; nothing else
# differs. A collection is never nullable, so each one arrives and leaves as a
# required member of a shape that survives.
entity:
  name: Parcel
  namespace: parallax.compatibility
  table: evolution_parcel
  attributes:
    - {name: id, type: int64, primaryKey: true}
    - {name: tags, type: string, multiplicity: many}
  valueObjects:
    - name: origin
      attributes:
        - {name: city, type: string}
        - {name: codes, type: int32, multiplicity: many}
