entity:
  name: Parcel
  namespace: parallax.compatibility
  table: evolution_parcel
  attributes:
    - {name: id, type: int64, primaryKey: true}
    - {name: tags, type: string, multiplicity: many}
  valueObjects:
    - name: origin
      attributes:
        - {name: city, type: string}
        - {name: codes, type: int32, multiplicity: many}
