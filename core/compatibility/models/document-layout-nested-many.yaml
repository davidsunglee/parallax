# A minimal Relational Document Layout model whose top-level `route` is a `one`,
# whose named `segment` member is another `one`, and whose named `stops` member is
# a `many`. It exists so a readless predicate write can show that a whole `one`
# assignment replaces the nested array it holds without choosing a route by content.
entity:
  name: NestedRoute
  namespace: parallax.compatibility
  table: nested_route
  layout:
    document:
      column: payload
  attributes:
    - { name: id, type: int64, primaryKey: true }
  valueObjects:
    - name: route
      attributes:
        - { name: name, type: string }
      valueObjects:
        - name: segment
          valueObjects:
            - name: stops
              multiplicity: many
              attributes:
                - { name: port, type: string }
