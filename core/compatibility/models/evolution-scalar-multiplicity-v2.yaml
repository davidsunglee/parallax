# Roster (v2): the later endpoint of the SCALAR MULTIPLICITY scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. It is
# models/evolution-scalar-multiplicity-v1.yaml with every scalar collection
# declared single and every single scalar declared a collection of the same
# type. `note` was nullable and a collection never is, so it also becomes
# required; nothing else differs.
entities:
  - name: Roster
    namespace: parallax.compatibility
    table: evolution_roster
    attributes:
      - {name: id, type: int64, primaryKey: true}
      - {name: codes, type: int32}
      - {name: note, type: string, multiplicity: many}
      - {name: tag, type: string, multiplicity: many}
    valueObjects:
      - name: detail
        attributes:
          - {name: label, type: string, multiplicity: many}
          - {name: scores, type: int32}
      - name: lines
        multiplicity: many
        attributes:
          - {name: flags, type: boolean, multiplicity: many}
  - name: Register
    namespace: parallax.compatibility
    table: evolution_register
    layout: {document: {column: payload}}
    attributes:
      - {name: id, type: int64, primaryKey: true}
      - {name: marks, type: int32}
      - {name: title, type: string, multiplicity: many}
