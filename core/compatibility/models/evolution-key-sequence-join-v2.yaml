# models/evolution-key-sequence-join-v1.yaml with the family key and the
# garage's key both drawing from one new native allocator, `fleetIds`: the
# later endpoint of a populated join, whose sequence must start past every key
# both leaves and the garage's history already store.
entities:
  - name: Vehicle
    namespace: parallax.compatibility
    inheritance:
      role: root
      strategy: table-per-concrete-subtype
    attributes:
      - name: id
        type: int64
        primaryKey: true
        pkGeneration: { strategy: key-sequence, name: fleetIds, batchSize: 10 }
      - { name: name, type: string, maxLength: 32 }
  - name: Car
    namespace: parallax.compatibility
    table: car
    inheritance:
      role: concrete-subtype
      parent: parallax.compatibility.Vehicle
    attributes:
      - { name: doors, type: int32, nullable: true }
  - name: Truck
    namespace: parallax.compatibility
    table: truck
    inheritance:
      role: concrete-subtype
      parent: parallax.compatibility.Vehicle
    attributes:
      - { name: axles, type: int32, nullable: true }
  - name: Garage
    namespace: parallax.compatibility
    table: garage
    temporality: transaction-time
    attributes:
      - name: id
        type: int64
        primaryKey: true
        pkGeneration: { strategy: key-sequence, name: fleetIds, batchSize: 10 }
      - { name: label, type: string, maxLength: 32 }
