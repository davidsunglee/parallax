# Customer: a valueObject model — a recursive, typed embedded composite mapped to
# a single structured-document column (m-value-object).
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. The
# `address` element is a top-level `valueObject`: an embedded composite stored in
# ONE m-core `json` column (`address`), NOT column-flattened (a deliberate
# deviation from Reladomo). It declares typed inner `attributes` (street / city),
# nested `valueObjects` to arbitrary depth (`geo` one -> `point` one), and a
# to-many nested member (`phones` many). Every nested value object and inner
# attribute lives inside that SAME `address` column — never an extra column, row,
# or join — so only `address` carries `column`/`mapping`.
#
# Its inner fields are read / filtered with the m-predicate nested-attribute
# access form (a dotted path `Customer.address.field` / `Customer.address.geo.…`).
# Postgres golden SQL lowers that to a `jsonb_extract_path_text` extraction whose
# path segments are carried as `?` binds.
#
# Row data lives in the sibling fixtures/customer.yaml; each `address` fixture
# value is a nested mapping loaded into the structured-document column. Nested
# members not yet present in every fixture row are `nullable: true` so the current
# fixtures stay valid.
#
# A SECOND, VO-bearing child entity `Location` and the to-many
# `Customer.locations` relationship let the corpus witness the deep-fetch ×
# value-object composition — a read
# `deepFetch(all(Customer), paths=[{ segments: [{ rel: Customer.locations }] }])`
# whose root level projects Customer's instance-form list (`id, name, address`)
# and whose child level projects Location's own instance-form list (`id,
# customer_id, label, address`: `customer_id` is a Domain slot and `address` the
# final Document slot). `Location` reuses Customer's `address` composite verbatim
# — same declared members, same absence-state vocabulary — so a null-document
# child materializes null exactly as a null-address Customer does, pinning the
# absence collapse AT DEPTH. Being a sibling entity + relationship, it leaves
# Customer's own Attribute and Value Object declaration sequences untouched, so
# the existing customer reads (the 21 filter reads and the -023/-024
# materialization graphs) do not ripple.
#
# A THIRD entity `Depot` and the to-many `Customer.depots` make the per-step
# read-entity resolution regression-sensitive. Where `Location` reuses Customer's
# `address` composite VERBATIM (so a wrong-descriptor decode is
# indistinguishable), `Depot.address` is a DIFFERENT declared STRUCTURE — a FLAT
# `{ line, postcode }` in the same `address` column. Decoding a Depot row with the
# root Customer descriptor therefore yields observably wrong keys, so the deferred
# `action: load` and operation-list first-`access` witnesses over `depots`
# (m-deep-fetch-020, m-op-list-004) go RED if a runner materializes them with the
# scenario root instead of the navigated child entity. `Depot` and its relationship
# likewise leave Customer's / Location's Attribute and Value Object declarations
# untouched, so no existing customer/location case ripples.
entities:
  - name: Customer
    namespace: parallax.compatibility
    table: customer
    attributes:
      - name: id
        type: int64
        primaryKey: true
      - name: name
        type: string
        maxLength: 64
    valueObjects:
      - name: address
        nullable: true
        attributes:
          - name: street
            type: string
          - name: city
            type: string
        valueObjects:
          - name: geo
            nullable: true
            attributes:
              - name: country
                type: string
              - name: elevation
                type: float64
                nullable: true
            valueObjects:
              - name: point
                nullable: true
                attributes:
                  - name: lat
                    type: float64
                    nullable: true
                  - name: lon
                    type: float64
                    nullable: true
          - name: phones
            multiplicity: many
            attributes:
              - name: type
                type: string
                nullable: true
              - name: number
                type: string
                nullable: true
    relationships:
      - name: locations
        cardinality: one-to-many
        join:
          source: id
          target: { entity: parallax.compatibility.Location, attribute: customerId }
        dependent: true
        orderBy:
          - { attribute: id }
      # depots: a SECOND VO-bearing child, reached via a distinct one-to-many. Its
      # `Depot.address` value object reuses the SAME column name `address` but a
      # DIFFERENT declared STRUCTURE (a FLAT { line, postcode }) than Customer's /
      # Location's recursive composite — a deliberate descriptor DIVERGENCE. Decoding
      # a Depot row with Customer's `address` descriptor yields observably wrong keys,
      # so the deferred-load / first-access witnesses over `depots` are regression-
      # sensitive to per-step read-entity resolution (`m-sql` instance-form Document-
      # slot selection; `m-case-format` "Read result form"), unlike Location whose
      # composite is Customer's verbatim.
      - name: depots
        cardinality: one-to-many
        join:
          source: id
          target: { entity: parallax.compatibility.Depot, attribute: customerId }
        dependent: true
        orderBy:
          - { attribute: id }
  # Location: a VO-bearing CHILD of Customer (the many side of the to-many
  # `Customer.locations`). It carries its own scalars — `id`, the `customer_id`
  # foreign key, and `label` — plus its OWN `address` value object, the same
  # recursive composite Customer declares (reused verbatim, m-value-object). It is
  # the first relationship-target entity in the corpus to declare a value object,
  # so a deep-fetch child level materializes a document at DEPTH: the child's
  # instance-form projection is `id, customer_id, label, address` (Identity and
  # Domain slots in declaration-preserving tier order, then the Document slot).
  - name: Location
    namespace: parallax.compatibility
    table: location
    attributes:
      - name: id
        type: int64
        primaryKey: true
      - name: customerId
        type: int64
      - name: label
        type: string
        maxLength: 64
    valueObjects:
      - name: address
        nullable: true
        attributes:
          - name: street
            type: string
          - name: city
            type: string
        valueObjects:
          - name: geo
            nullable: true
            attributes:
              - name: country
                type: string
              - name: elevation
                type: float64
                nullable: true
            valueObjects:
              - name: point
                nullable: true
                attributes:
                  - name: lat
                    type: float64
                    nullable: true
                  - name: lon
                    type: float64
                    nullable: true
          - name: phones
            multiplicity: many
            attributes:
              - name: type
                type: string
                nullable: true
              - name: number
                type: string
                nullable: true
    relationships:
      - name: customer
        reverseOf: parallax.compatibility.Customer.locations
    indices:
      - name: location_customer_id
        attributes: [customerId]
  - name: Depot
    namespace: parallax.compatibility
    table: depot
    attributes:
      - name: id
        type: int64
        primaryKey: true
      - name: customerId
        type: int64
      - name: label
        type: string
        maxLength: 64
    valueObjects:
      - name: address
        nullable: true
        attributes:
          - name: line
            type: string
            nullable: true
          - name: postcode
            type: string
            nullable: true
    relationships:
      - name: customer
        reverseOf: parallax.compatibility.Customer.depots
    indices:
      - name: depot_customer_id
        attributes: [customerId]
