entity:
  name: Account
  namespace: parallax.compatibility
  table: account
  attributes:
    - name: id
      type: int64
      primaryKey: true
    - name: owner
      type: string
      maxLength: 64
    - name: balance
      type: decimal(18,2)
    - name: version
      type: int32
      optimisticLocking: true
  indices:
    - name: account_owner
      attributes: [owner]
