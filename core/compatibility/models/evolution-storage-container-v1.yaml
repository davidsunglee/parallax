# Vault (v1): the earlier endpoint of the STORAGE CONTAINER scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. The
# Entity keeps every logical declaration across the pair and changes only the
# Table its rows live in.
entity:
  name: Vault
  namespace: parallax.compatibility
  table: evolution_vault
  attributes:
    - name: id
      type: int64
      primaryKey: true
    - name: holding
      type: decimal(18,2)
