# Meter (v2): the TRANSACTION-TIME end of the As-Of Axis scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. It is
# models/evolution-temporality-v1.yaml with the Transaction-Time profile, whose
# axis and framework-owned endpoint Attributes the Temporality Profile derives.
entity:
  name: Meter
  namespace: parallax.compatibility
  table: evolution_meter
  temporality: transaction-time
  attributes:
    - { name: id, type: int64, primaryKey: true }
    - { name: reading, type: int64 }
