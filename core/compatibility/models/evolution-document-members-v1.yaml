# Container (v1): the earlier endpoint of the DOCUMENT-LAYOUT member scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. Its
# governed members live in one Structured Column, so the pair proves that the
# described evolution is the same one a Columns model produces.
entity:
  name: Container
  namespace: parallax.compatibility
  table: evolution_container
  layout:
    document:
      column: payload
  attributes:
    - { name: id, type: int64, primaryKey: true }
