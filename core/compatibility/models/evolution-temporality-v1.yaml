# Meter (v1): the NON-TEMPORAL end of the As-Of Axis scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. The
# Entity already stores rows, so v2's axis lands on an existing stored shape
# rather than being carried by a parent Entity addition.
entity:
  name: Meter
  namespace: parallax.compatibility
  table: evolution_meter
  attributes:
    - { name: id, type: int64, primaryKey: true }
    - { name: reading, type: int64 }
