# A table-per-concrete-subtype family and a Transaction-Time Entity, every key
# application-assigned: the earlier endpoint of a populated join onto one native
# allocator. The leaves may sit in schemas of their own, and the garage keeps
# its history in its one table.
entities:
  - name: Vehicle
    namespace: parallax.compatibility
    inheritance:
      role: root
      strategy: table-per-concrete-subtype
    attributes:
      - { name: id, type: int64, primaryKey: true }
      - { name: name, type: string, maxLength: 32 }
  - name: Car
    namespace: parallax.compatibility
    table: car
    inheritance:
      role: concrete-subtype
      parent: parallax.compatibility.Vehicle
    attributes:
      - { name: doors, type: int32, nullable: true }
  - name: Truck
    namespace: parallax.compatibility
    table: truck
    inheritance:
      role: concrete-subtype
      parent: parallax.compatibility.Vehicle
    attributes:
      - { name: axles, type: int32, nullable: true }
  - name: Garage
    namespace: parallax.compatibility
    table: garage
    temporality: transaction-time
    attributes:
      - { name: id, type: int64, primaryKey: true }
      - { name: label, type: string, maxLength: 32 }
