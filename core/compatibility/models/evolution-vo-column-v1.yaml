# Crate (v1): the earlier endpoint of the Value Object STORAGE LOCATION
# scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. Only a
# top-level occurrence owns a Storage Location, which is why this pair varies a
# top-level one.
entity:
  name: Crate
  namespace: parallax.compatibility
  table: evolution_crate
  attributes:
    - { name: id, type: int64, primaryKey: true }
  valueObjects:
    - name: origin
      column: origin_doc
      attributes:
        - { name: city, type: string }
