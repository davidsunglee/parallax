        cardinality: one-to-many
        join: {source: id, target: {entity: parallax.compatibility.Int64Child, attribute: parentId}}
        orderBy: [{attribute: id}]
  - name: Int64Child
    namespace: parallax.compatibility
    table: int64_child
    attributes:
      - {name: id, type: int64, primaryKey: true}
      - {name: parentId, type: int64}
    relationships:
      - {name: parent, reverseOf: parallax.compatibility.Int64Parent.children}
  - name: StringParent
    namespace: parallax.compatibility
    table: string_parent
    attributes:
      - {name: id, type: string, primaryKey: true}
      - {name: label, type: string}
    relationships:
      - name: children
        cardinality: one-to-many
        join: {source: id, target: {entity: parallax.compatibility.StringChild, attribute: parentId}}
        orderBy: [{attribute: id}]
  - name: StringChild
    namespace: parallax.compatibility
    table: string_child
    attributes:
      - {name: id, type: string, primaryKey: true}
      - {name: parentId, type: string}
    relationships:
      - {name: parent, reverseOf: parallax.compatibility.StringParent.children}
  - name: UuidParent
    namespace: parallax.compatibility
    table: uuid_parent
    attributes:
      - {name: id, type: uuid, primaryKey: true}
      - {name: label, type: string}
    relationships:
      - name: children
        cardinality: one-to-many
        join: {source: id, target: {entity: parallax.compatibility.UuidChild, attribute: parentId}}
        orderBy: [{attribute: id}]
  - name: UuidChild
    namespace: parallax.compatibility
    table: uuid_child
    attributes:
      - {name: id, type: uuid, primaryKey: true}
      - {name: parentId, type: uuid}
    relationships:
      - {name: parent, reverseOf: parallax.compatibility.UuidParent.children}
