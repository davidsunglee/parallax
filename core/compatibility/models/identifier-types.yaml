entities:
  - name: Int32Parent
    namespace: parallax.compatibility
    table: int32_parent
    attributes:
      - {name: id, type: int32, primaryKey: true}
      - {name: label, type: string}
    relationships:
      - name: children
        cardinality: one-to-many
        join: {source: id, target: {entity: parallax.compatibility.Int32Child, attribute: parentId}}
        orderBy: [{attribute: id}]
  - name: Int32Child
    namespace: parallax.compatibility
    table: int32_child
    attributes:
      - {name: id, type: int32, primaryKey: true}
      - {name: parentId, type: int32}
    relationships:
      - {name: parent, reverseOf: parallax.compatibility.Int32Parent.children}
