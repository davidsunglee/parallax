# Placard (v2): the later endpoint of the STORAGE LOCATION scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. It is
# models/evolution-attribute-column-v1.yaml with `caption` mapped to the
# `headline` Column.
entity:
  name: Placard
  namespace: parallax.compatibility
  table: evolution_placard
  attributes:
    - name: id
      type: int64
      primaryKey: true
    - name: caption
      type: string
      column: headline
      maxLength: 64
