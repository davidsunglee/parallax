# Each Entity takes a different kind of binding placement: Invoice and its
# `invoiceNumbers` allocator the default, Refund its own entry, and Entry and
# Statement their namespaces.
entities:
  - name: Invoice
    namespace: parallax.compatibility
    table: invoice
    attributes:
      - name: id
        type: int64
        primaryKey: true
        pkGeneration: { strategy: sequence, name: invoiceNumbers }
      - { name: total, type: int64 }
  - name: Refund
    namespace: parallax.compatibility
    table: refund
    attributes:
      - { name: id, type: int64, primaryKey: true }
      - { name: invoiceId, type: int64 }
  - name: Entry
    namespace: audit
    table: entry
    attributes:
      - { name: id, type: int64, primaryKey: true }
      - { name: note, type: string, maxLength: 64 }
  - name: Statement
    namespace: archive
    table: statement
    attributes:
      - { name: id, type: int64, primaryKey: true }
      - { name: period, type: string, maxLength: 16 }
