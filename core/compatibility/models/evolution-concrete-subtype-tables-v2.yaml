# Vessel (v2): the later endpoint of the TABLE-PER-CONCRETE-SUBTYPE scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. It is
# models/evolution-concrete-subtype-tables-v1.yaml plus the concrete `Tanker`
# and its own Table.
entities:
  - name: Vessel
    namespace: parallax.compatibility
    inheritance:
      role: root
      strategy: table-per-concrete-subtype
    attributes:
      - name: id
        type: int64
        primaryKey: true
      - name: tonnage
        type: int64
  - name: Barge
    namespace: parallax.compatibility
    table: evolution_barge
    inheritance:
      role: concrete-subtype
      parent: parallax.compatibility.Vessel
    attributes:
      - name: draft
        type: int64
        nullable: true
  - name: Tanker
    namespace: parallax.compatibility
    table: evolution_tanker
    inheritance:
      role: concrete-subtype
      parent: parallax.compatibility.Vessel
    attributes:
      - name: capacity
        type: int64
        nullable: true
