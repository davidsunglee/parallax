# A native allocator two Entities share over int64 keys, at a batch size of 20.
entities:
  - name: Badge
    namespace: parallax.compatibility
    table: badge
    attributes:
      - name: id
        type: int64
        primaryKey: true
        pkGeneration: { strategy: key-sequence, name: credentialIds, batchSize: 20 }
      - { name: holder, type: string, maxLength: 32 }
  - name: Pass
    namespace: parallax.compatibility
    table: pass
    attributes:
      - name: id
        type: int64
        primaryKey: true
        pkGeneration: { strategy: key-sequence, name: credentialIds, batchSize: 20 }
      - { name: holder, type: string, maxLength: 32 }
