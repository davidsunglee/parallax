# A native allocator two Entities share, at a batch size of 20. An int32 key bounds its
# key range by the key type on every backend.
entities:
  - name: Badge
    namespace: parallax.compatibility
    table: badge
    attributes:
      - name: id
        type: int32
        primaryKey: true
        pkGeneration: { strategy: key-sequence, name: credentialIds, batchSize: 20 }
      - { name: holder, type: string, maxLength: 32 }
  - name: Pass
    namespace: parallax.compatibility
    table: pass
    attributes:
      - name: id
        type: int32
        primaryKey: true
        pkGeneration: { strategy: key-sequence, name: credentialIds, batchSize: 20 }
      - { name: holder, type: string, maxLength: 32 }
