# A native allocator one Entity draws from beside an Entity whose keys are
# application-assigned.
entities:
  - name: Badge
    namespace: parallax.compatibility
    table: badge
    attributes:
      - name: id
        type: int64
        primaryKey: true
        pkGeneration: { strategy: key-sequence, name: credentialIds, batchSize: 50 }
      - { name: holder, type: string, maxLength: 32 }
  - name: Pass
    namespace: parallax.compatibility
    table: pass
    attributes:
      - { name: id, type: int64, primaryKey: true }
      - { name: holder, type: string, maxLength: 32 }
