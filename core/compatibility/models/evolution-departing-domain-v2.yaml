# Registry (v2): the endpoint of the DEPARTING DOMAIN scenario where the abstract
# `Filed` denotes nothing and its member is required.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. It is
# models/evolution-departing-domain-v1.yaml with `Record` extending the root
# directly and `Filed.clerk` required, so the position whose domain narrowed
# keeps no stored shape to hold a value against it.
entities:
  - name: Registry
    namespace: parallax.compatibility
    table: evolution_registry
    inheritance:
      role: root
      strategy: table-per-hierarchy
      tag:
        column: kind
    attributes:
      - name: id
        type: int64
        primaryKey: true
  - name: Filed
    namespace: parallax.compatibility
    inheritance:
      role: abstract-subtype
      parent: parallax.compatibility.Registry
    attributes:
      - name: clerk
        type: string
        maxLength: 32
  - name: Record
    namespace: parallax.compatibility
    inheritance:
      role: concrete-subtype
      parent: parallax.compatibility.Registry
      tagValue: record
    attributes:
      - name: body
        type: string
        maxLength: 64
