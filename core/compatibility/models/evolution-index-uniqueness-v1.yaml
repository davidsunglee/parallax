# Skid (v1): the earlier endpoint of the INDEX UNIQUENESS scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. Two
# authored Indices sit at opposite ends of the boundary, so one evolution moves
# each in the opposite direction.
entity:
  name: Skid
  namespace: parallax.compatibility
  table: evolution_skid
  attributes:
    - { name: id, type: int64, primaryKey: true }
    - { name: label, type: string, maxLength: 32 }
    - { name: serial, type: string, maxLength: 32 }
  indices:
    - { name: skid_label, attributes: [label], unique: true }
    - { name: skid_serial, attributes: [serial] }
