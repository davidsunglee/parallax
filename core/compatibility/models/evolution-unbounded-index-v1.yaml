# Transcript (v1): the earlier endpoint of the UNBOUNDED INDEX scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. The
# unbounded String sits here unindexed; the later endpoint puts an access path
# over it, which is the Index a database with a key-length limit cannot build.
entity:
  name: Transcript
  namespace: parallax.compatibility
  table: evolution_transcript
  attributes:
    - { name: id, type: int64, primaryKey: true }
    - { name: body, type: string }
