# Memo (v2): the WIDE end of the WIDENED DOMAIN scenario.
#
# This descriptor is an instance of core/schemas/metamodel.schema.json. It is
# models/evolution-widened-domain-v1.yaml with `body` nullable and bounded four
# times as long; nothing else differs.
entity:
  name: Memo
  namespace: parallax.compatibility
  table: evolution_memo
  attributes:
    - name: id
      type: int64
      primaryKey: true
    - name: body
      type: string
      maxLength: 128
      nullable: true
