# One logical allocator shared across a table-per-concrete-subtype family and a
# standalone Entity. The tableless Vehicle root declares the family key once,
# so both leaves inherit its `fleetIds` allocator; Depot declares the same key
# with the same settings, sharing it deliberately. Bindings may place the
# leaves and the depot anywhere, and the allocator still resolves to one
# physical sequence of its own.
entities:
  - name: Vehicle
    namespace: parallax.compatibility
    inheritance:
      role: root
      strategy: table-per-concrete-subtype
    attributes:
      - name: id
        type: int64
        primaryKey: true
        pkGeneration: { strategy: sequence, name: fleetIds }
      - { name: name, type: string, maxLength: 32 }
  - name: Car
    namespace: parallax.compatibility
    table: car
    inheritance:
      role: concrete-subtype
      parent: parallax.compatibility.Vehicle
    attributes:
      - { name: doors, type: int32, nullable: true }
  - name: Truck
    namespace: parallax.compatibility
    table: truck
    inheritance:
      role: concrete-subtype
      parent: parallax.compatibility.Vehicle
    attributes:
      - { name: axles, type: int32, nullable: true }
  - name: Depot
    namespace: parallax.compatibility
    table: depot
    attributes:
      - name: id
        type: int64
        primaryKey: true
        pkGeneration: { strategy: sequence, name: fleetIds }
      - { name: label, type: string, maxLength: 32 }
