# startsWith + wildcard escape — affix escaping (m-predicate §Wildcard/escape rule).
model: models/orders.yaml
tags: [m-predicate, startsWith, string, escape, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Order
    predicate:
      startsWith:
        attr: parallax.compatibility.Order.sku
        value: C_
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.sku like ? escape ?
      binds: ["C\\_%", "\\"]
  referenceSql: select id, name, sku, qty, price, active, ordered_on from orders where left(sku, 2) = 'C_'
  rows:
    - { id: 5, name: Alan, sku: "C_50%", qty: 25, price: "50.75", active: false, ordered_on: 2024-05-25 }
  roundTrips: 1
