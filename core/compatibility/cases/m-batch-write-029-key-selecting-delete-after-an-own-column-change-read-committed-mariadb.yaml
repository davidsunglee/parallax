# Transaction A changes order item 11's own sku, a column the predicate tests, and
# holds the change. Transaction B's key-selecting delete of Ada's items whose sku is
# A-100 runs before A commits. MariaDB re-reads the changed row once A commits and
# excludes item 11 from the selection.
model: models/orders.yaml
tags: [m-batch-write, m-sql, m-unit-work, isolation, concurrency, predicate-write, readless, relationship, to-one, delete, read-committed]
shape: concurrencySuccess
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "two-session isolation witness (when.concurrency)"
given:
  fixtures: true
when:
  uow:
    isolation: read-committed
  concurrency:
    rounds:
      - A:
          kind: write
          statements:
            - sql:
                mariadb: update order_item set sku = ? where id = ?
              binds: [X-1, 11]
          affectedRows: [1]
      - B:
          kind: write
          blocks: true
          statements:
            - sql:
                mariadb: delete from order_item where id in (select t0.id from order_item t0 left join orders t1 on t1.id = t0.order_id where t1.name = ? and t0.sku = ?)
              binds: [Ada, A-100]
          affectedRows: [0]
      - A:
          kind: commit
      - B:
          kind: commit
then:
  tableState:
    order_item:
      - { id: 11, order_id: 1, sku: X-1, quantity: 2, shipped_on: null }
      - { id: 12, order_id: 1, sku: B-200, quantity: 1, shipped_on: 2024-02-15 }
      - { id: 21, order_id: 2, sku: A-300, quantity: 4, shipped_on: 2024-02-20 }
      - { id: 421, order_id: 42, sku: A-999, quantity: 3, shipped_on: 2024-03-10 }
      - { id: 422, order_id: 42, sku: B-200, quantity: 5, shipped_on: 2024-02-05 }
