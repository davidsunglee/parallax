model: models/versioned-payment-document.yaml
tags: [m-concurrency, m-inheritance, m-storage-layout, m-sql, m-dialect, m-document-codec, m-predicate, table-per-hierarchy, document-layout, narrow, predicate, slice-snapshot-1, slice-managed-1]
shape: read
when:
  uow:
    concurrency: optimistic
  objectQuery:
    target: parallax.compatibility.VersionedPayment
    predicate:
      or:
        operands:
          - narrow:
              to:
                - parallax.compatibility.VersionedCardPayment
              operand:
                eq:
                  path: parallax.compatibility.VersionedCardPayment.detail
                  value: visa-4242
          - narrow:
              to:
                - parallax.compatibility.VersionedCashPayment
              operand:
                greaterThan:
                  path: parallax.compatibility.VersionedCashPayment.detail
                  value: "10.00"
then:
  statements:
    - sql:
        postgres: select p1.id, p1.kind, p1.version, not p1.payload is null, p1.payload from (select * from versioned_payment_document t0 where t0.kind = ? offset 0) p1 where jsonb_extract_path_text(p1.payload, ?) = ? or 1 = 0 union all select p2.id, p2.kind, p2.version, not p2.payload is null, p2.payload from (select * from versioned_payment_document t0 where t0.kind = ? offset 0) p2 where 1 = 0 or cast(jsonb_extract_path_text(p2.payload, ?) as decimal(18, 2)) > ?
        mariadb: select p1.id, p1.kind, p1.version, not p1.payload is null, p1.payload from (select * from versioned_payment_document t0 where t0.kind = ? limit ?) p1 where json_value(p1.payload, ?) = ? or 1 = 0 union all select p2.id, p2.kind, p2.version, not p2.payload is null, p2.payload from (select * from versioned_payment_document t0 where t0.kind = ? limit ?) p2 where 1 = 0 or cast(json_value(p2.payload, ?) as decimal(18, 2)) > ?
      binds:
        postgres: [versioned-card, detail, visa-4242, versioned-cash, detail, '10.00']
        mariadb: [versioned-card, 18446744073709551615, '$.detail', visa-4242, versioned-cash, 18446744073709551615, '$.detail', '10.00']
  referenceSql:
    postgres: select id, kind, version, payload from versioned_payment_document where kind = 'versioned-card' and payload ->> 'detail' = 'visa-4242' union all select id, kind, version, payload from versioned_payment_document where kind = 'versioned-cash' and (payload ->> 'detail')::decimal(18,2) > 10.00
    mariadb: select id, kind, version, payload from versioned_payment_document where kind = 'versioned-card' and json_value(payload, '$.detail') = 'visa-4242' union all select id, kind, version, payload from versioned_payment_document where kind = 'versioned-cash' and cast(json_value(payload, '$.detail') as decimal(18,2)) > 10.00
  rows:
    - { id: 1, version: 1, detail: visa-4242, familyVariant: VersionedCardPayment }
    - { id: 2, version: 1, detail: "12.50", familyVariant: VersionedCashPayment }
  databaseCalls: 1
