# Negative (m-predicate scalar collection rule): `eq` compares one scalar value,
# and `CollectionTwinItem.tags` is a scalar collection rather than one string, so
# model-aware validation refuses the query before SQL instead of reading the
# literal as one element of it. No element is reached implicitly.
model: models/scalar-collection-layout-twin-columns.yaml
tags: [m-predicate, rejected, negative, eq, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  objectQuery:
    target: parallax.compatibility.CollectionTwinItem
    predicate:
      eq:
        path: parallax.compatibility.CollectionTwinItem.tags
        value: urgent
then:
  rejectedRule: scalar-collection-unquantified
