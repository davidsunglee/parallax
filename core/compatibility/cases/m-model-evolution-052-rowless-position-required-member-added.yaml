# Adding a required member to a position that denotes no stored shape
# (m-model-evolution): unilateral.
tags: [m-model-evolution, m-schema-delta, evolution, inheritance, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-rowless-position-v1.yaml
    later: models/evolution-rowless-position-v2.yaml
then:
  evolution:
    kind: unilateral
    operations:
      - kind: AttributeAdded
        attribute: parallax.compatibility.Draft.reviewer
    behavioralImpacts: []
    overlapVisibleOperations: []
    coordinationRequirements: []
  schema:
    postgres:
      delta:
        statements:
          - alter table evolution_catalog add column reviewer varchar(64)
        createdIndices: []
    mariadb:
      delta:
        statements:
          - alter table evolution_catalog add column reviewer varchar(64)
        createdIndices: []
