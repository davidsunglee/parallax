# A versioned predicate delete materializes: an unlocked read of the rows under
# 200.00, then a delete gated on each observed version. The peer changes account 1 and
# commits between the two. At Repeatable Read account 1's delete is refused because
# the row changed after the snapshot the read took.
model: models/account.yaml
tags: [m-batch-write, m-opt-lock, m-unit-work, m-db-error, isolation, concurrency, predicate-write, materialize, delete, repeatable-read, slice-snapshot-1]
shape: error
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "two-session isolation witness (when.concurrency)"
given:
  fixtures: true
when:
  uow:
    concurrency: optimistic
    isolation: repeatable-read
  concurrency:
    rounds:
      - A:
          statements:
            - sql:
                postgres: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.balance < ?
                mariadb: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.balance < ?
              binds: ["200.00"]
      - B:
          statements:
            - sql:
                postgres: update account set balance = ?, version = ? where id = ? and version = ?
                mariadb: update account set balance = ?, version = ? where id = ? and version = ?
              binds: ["150.00", 2, 1, 1]
      - B:
          kind: commit
      - A:
          statements:
            - sql:
                postgres: delete from account where id = ? and version = ?
                mariadb: delete from account where id = ? and version = ?
              binds: [1, 1]
            - sql:
                postgres: delete from account where id = ? and version = ?
                mariadb: delete from account where id = ? and version = ?
              binds: [3, 1]
then:
  errorClass: deadlock
  nativeCode:
    postgres: "40001"
    mariadb: 1020
  tableState:
    account:
      - { id: 1, owner: Ada, balance: "150.00", version: 2 }
      - { id: 2, owner: Linus, balance: "250.00", version: 1 }
      - { id: 3, owner: Grace, balance: "10.00", version: 1 }
