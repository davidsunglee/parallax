# Negative (m-predicate non-string-member MUST, and the order the two nested string
# checks run in): a nested string predicate aimed at a NUMERIC member is refused as a
# non-string member, not as a mistyped literal.
model: models/customer.yaml
tags: [m-predicate, m-wire, m-value-object, rejected, negative, nested, string, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  objectQuery:
    target: parallax.compatibility.Customer
    predicate:
      nestedStartsWith:
        path: parallax.compatibility.Customer.address.geo.elevation
        value: '1'
then:
  rejectedRule: nested-string-predicate-non-string-member
