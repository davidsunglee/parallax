# orderBy DESCENDING with an explicit `nulls: last` placement over a NULLABLE key,
# proven on BOTH dialects (m-object-query orderBy + m-dialect NULL ordering).
#
# The corpus's first witness for `desc` over a nullable column, and so the first for
# Postgres's `desc nulls last` suffix. The dialects compensate in opposite directions:
# Postgres treats NULL as largest and so needs the explicit suffix on `desc`, while
# MariaDB treats it as smallest and already trails NULLs on `desc`, emitting nothing.
# `limit 2` makes the placement observable through row MEMBERSHIP (the two LARGEST
# skus, never the NULL row), since top-level row comparison is order-insensitive. The
# paired contrast is m-op-algebra-038, whose `nulls: first` over the same key and the
# same limit returns the NULL row instead of the second-largest sku.
model: models/orders.yaml
tags: [m-predicate, m-object-query, m-dialect, orderBy, ordering, nulls, nullable, limit, directive, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Order
    predicate:
      all: {}
    orderBy:
      - attr: parallax.compatibility.Order.sku
        direction: desc
        nulls: last
    limit: 2
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 order by t0.sku desc nulls last limit ?
        mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 order by t0.sku desc limit ?
      binds: [2]
  referenceSql: select id, name, sku, qty, price, active, ordered_on from orders order by case when sku is null then 1 else 0 end, sku desc limit 2
  rows:
    - { id: 5, name: Alan, sku: "C_50%", qty: 25, price: 50.75, active: false, ordered_on: 2024-05-25 }
    - { id: 2, name: Linus, sku: B-200, qty: 10, price: 20.00, active: true, ordered_on: 2024-02-10 }
  roundTrips: 1
