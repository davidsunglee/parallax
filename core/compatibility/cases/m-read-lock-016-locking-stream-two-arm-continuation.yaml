# A locking transactional stream reaches a continuing page without surrendering
# PostgreSQL's shared-row authority (m-read-lock / m-snapshot-read / m-sql).
# Page 1 asks for three roots and publishes accounts 1 and 2. Page 2 seeks from
# account 2 and returns account 3 alone, which proves exhaustion. PostgreSQL's
# emitted NULL placement requires the two disjoint arms even though the accepted
# key is non-nullable; neither arm may carry a lock clause. Their derived result
# joins account on its complete physical identity, retains the capture-alias
# order and outer cap, and locks only t0. MariaDB places ascending NULLs first, so
# its existing one-arm continuation remains the complete and canonical form.
model: models/account.yaml
tags: [m-read-lock, m-snapshot-read, m-unit-work, m-sql, m-dialect, stream, streamed-delivery, concurrency, locking-mode, slice-snapshot-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "the continuing page binds the primary key of the root the first page delivered last"
given:
  fixtures: true
when:
  uow:
    concurrency: locking
  scenario:
    - uow: locking-stream
      objectQuery:
        target: parallax.compatibility.Account
        predicate:
          all: {}
      stream:
        batchSize: 2
      roundTrips: 2
      statements:
        - sql:
            postgres: select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 order by t0.id asc limit ? for share of t0
            mariadb: select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 order by t0.id asc limit ? lock in share mode
          binds: [3]
        - sql:
            postgres: select u.id, u.owner, u.balance, u.version, u.parallax_seek_0 from ((select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 where t0.id >= ? and (t0.id > ? or t0.id is null) order by t0.id asc limit ?) union all (select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 where t0.id is null order by t0.id asc limit ?)) u join account t0 on u.id = t0.id order by u.parallax_seek_0 asc limit ? for share of t0
            mariadb: select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 where t0.id >= ? and t0.id > ? order by t0.id asc limit ? lock in share mode
          binds:
            postgres: [2, 2, 3, 3, 3]
            mariadb: [2, 2, 3]
      referenceSql: select id, owner, balance, version from account
      expectRows:
      - { id: 1, owner: Ada, balance: "100.00", version: 1 }
      - { id: 2, owner: Linus, balance: "250.00", version: 1 }
      - { id: 3, owner: Grace, balance: "10.00", version: 1 }
then:
  roundTrips: 2
