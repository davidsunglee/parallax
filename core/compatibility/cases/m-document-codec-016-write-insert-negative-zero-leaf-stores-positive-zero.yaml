# A leaf authored as negative zero names the one float zero, which is positive
# (m-wire "zero is positive"): each leaf's canonical Wire value, and so the
# document bound and stored, is `0.0` at both float widths. Canonical comparison
# observes a float zero's sign, so a document that keeps either leaf's `-0.0`
# fails this case.
model: models/document-codec.yaml
tags: [m-document-codec, m-wire, m-value-object, m-sql, write-sequence, insert, json, slice-snapshot-1, slice-managed-1]
shape: writeSequence
when:
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.Sample
      statements: 1
      note: insert one Sample whose float32 and float64 leaves are negative zero
      rows:
        - id: 160
          label: SignedZero
          profile:
            ratio: -0.0
            measure: -0.0
then:
  statements:
    - sql:
        postgres: insert into sample(id, label, profile) values (?, ?, ?)
        mariadb: insert into sample(id, label, profile) values (?, ?, ?)
      binds:
        - 160
        - SignedZero
        - ratio: 0.0
          measure: 0.0
          entries: []
  tableState:
    sample:
      - id: 160
        label: SignedZero
        profile:
          ratio: 0.0
          measure: 0.0
          entries: []
  roundTrips: 1
