# A streamed page ordered by a document-resident `date` captures what its own
# ordering extraction evaluated to and seeks past that carrier unchanged. The
# canonical document spelling of a `date` already orders as text, so the
# extraction compares WITHOUT a cast and the captured carrier IS the ISO text the
# caller's authored equality binds — bound back as comparison text rather than
# re-derived from a decoded date. One matching root fills the page, so the empty
# second statement is what makes the captured cell and its rebind observable; a
# page re-encoding the coordinate from a managed value would agree here only by
# coincidence and would have nothing to encode for a corrupt one.
#
# This is also where the boundary of `m-sql`'s hoisted leading range is visible.
# `day` is non-nullable, which over a direct Column would hoist `<column> >= ?`
# for the planner, but it is document-resident: its extraction reads NULL for a
# missing member as readily as for a stored one, and a range over an extraction
# is no index range to trade for that. So the continuing page carries the branch
# tree alone, and its leading branch's `or <extraction> is null` arm — keyed on
# where the EMITTED clause put NULLs, Postgres trailing them on `asc`, never on
# what the model declares — is what still admits such a root.
model: models/stream-coordinates.yaml
tags: [m-snapshot-read, m-object-query, stream, streamed-delivery, date, document-layout, graph, slice-snapshot-1]
shape: read
compileEligibility: { mode: run-only, reason: query-result-dependent }
when:
  objectQuery:
    target: parallax.compatibility.StreamCoordinate
    predicate: { eq: { attr: parallax.compatibility.StreamCoordinate.day, value: "2026-01-15" } }
    orderBy: [{ attr: parallax.compatibility.StreamCoordinate.day }]
  stream: { batchSize: 1 }
then:
  statements:
    - sql: { postgres: "select t0.id, not t0.coordinates is null, t0.coordinates, jsonb_extract_path_text(t0.coordinates, ?) parallax_seek_0, t0.id parallax_seek_1 from stream_coordinate t0 where jsonb_extract_path_text(t0.coordinates, ?) = ? order by jsonb_extract_path_text(t0.coordinates, ?) asc, t0.id asc limit ?" }
      binds: { postgres: [day, day, "2026-01-15", day, 1] }
    - sql: { postgres: "select t0.id, not t0.coordinates is null, t0.coordinates, jsonb_extract_path_text(t0.coordinates, ?) parallax_seek_0, t0.id parallax_seek_1 from stream_coordinate t0 where jsonb_extract_path_text(t0.coordinates, ?) = ? and (jsonb_extract_path_text(t0.coordinates, ?) > ? or jsonb_extract_path_text(t0.coordinates, ?) is null or (jsonb_extract_path_text(t0.coordinates, ?) = ? and (t0.id > ? or t0.id is null))) order by jsonb_extract_path_text(t0.coordinates, ?) asc, t0.id asc limit ?" }
      binds: { postgres: [day, day, "2026-01-15", day, "2026-01-15", day, day, "2026-01-15", 101, day, 1] }
  referenceSql: { postgres: "select id, coordinates ->> 'day' as day from stream_coordinate where coordinates ->> 'day' = '2026-01-15'" }
  graph: { StreamCoordinate: [{ id: 101, day: "2026-01-15", clock: "09:30:00", amount: "10.25", payload: "0a1b", token: "00000000-0000-4000-8000-0000000000ab", instant: "2026-01-15T09:30:00.000000Z", f32: 1.5, f64: 2.25 }] }
  roundTrips: 2
