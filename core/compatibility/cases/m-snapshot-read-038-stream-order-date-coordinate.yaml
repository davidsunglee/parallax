# A streamed page ordered by a document-resident `date` derives its continuing
# seek from the validated query and the last root's managed date coordinate.
# The caller-authored equality and generated seek therefore bind the same
# canonical ISO date through the same extraction form. One matching root fills
# the page, so the empty second statement proves continuation was attempted;
# comparing the Python carrier directly would not prove the declared-type seam.
model: models/stream-coordinates.yaml
tags: [m-snapshot-read, m-object-query, stream, streamed-delivery, date, document-layout, graph, slice-snapshot-1]
shape: read
compileEligibility: { mode: run-only, reason: query-result-dependent }
when:
  objectQuery:
    target: parallax.compatibility.StreamCoordinate
    predicate: { eq: { attr: parallax.compatibility.StreamCoordinate.day, value: "2026-01-15" } }
    orderBy: [{ attr: parallax.compatibility.StreamCoordinate.day }]
  stream: { batchSize: 1 }
then:
  statements:
    - sql: { postgres: "select t0.id, not t0.coordinates is null, t0.coordinates from stream_coordinate t0 where jsonb_extract_path_text(t0.coordinates, ?) = ? order by jsonb_extract_path_text(t0.coordinates, ?) asc, t0.id asc limit ?" }
      binds: { postgres: [day, "2026-01-15", day, 1] }
    - sql: { postgres: "select t0.id, not t0.coordinates is null, t0.coordinates from stream_coordinate t0 where jsonb_extract_path_text(t0.coordinates, ?) = ? and jsonb_extract_path_text(t0.coordinates, ?) >= ? and (jsonb_extract_path_text(t0.coordinates, ?) > ? or (jsonb_extract_path_text(t0.coordinates, ?) = ? and t0.id > ?)) order by jsonb_extract_path_text(t0.coordinates, ?) asc, t0.id asc limit ?" }
      binds: { postgres: [day, "2026-01-15", day, "2026-01-15", day, "2026-01-15", day, "2026-01-15", 101, day, 1] }
  referenceSql: { postgres: "select id, coordinates ->> 'day' as day from stream_coordinate where coordinates ->> 'day' = '2026-01-15'" }
  graph: { StreamCoordinate: [{ id: 101, day: "2026-01-15", clock: "09:30:00", amount: "10.25", payload: "0a1b", token: "00000000-0000-4000-8000-0000000000ab", instant: "2026-01-15T09:30:00.000000Z", f32: 1.5, f64: 2.25 }] }
  roundTrips: 2
