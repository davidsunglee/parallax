# Negative (m-inheritance family invariants): a concrete subtype is the parent of
# another position.
model: models/payment.yaml
tags: [m-inheritance, m-descriptor, rejected, negative, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  model:
    entities:
      - name: Vessel
        table: vessel
        inheritance:
          strategy: table-per-hierarchy
          role: root
          tag: { column: kind }
        attributes:
          - { name: id, type: int64, column: id, primaryKey: true }
      - name: Tug
        inheritance:
          role: concrete-subtype
          parent: Vessel
          tagValue: tug
        attributes:
          - { name: bollardPull, type: int32, column: bollard_pull, nullable: true }
      - name: Barge
        inheritance:
          role: concrete-subtype
          parent: Tug
          tagValue: barge
        attributes:
          - { name: deckArea, type: int32, column: deck_area, nullable: true }
then:
  rejectedRule: inheritance-concrete-subtype-with-children
