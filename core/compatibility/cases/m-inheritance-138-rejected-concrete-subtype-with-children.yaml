# Negative (m-inheritance family invariants): a concrete subtype is the parent of
# another position.
#
# `Vessel` is a well-formed table-per-hierarchy root, `Tug` a concrete subtype under
# it, and `Barge` a concrete subtype whose parent is the CONCRETE `Tug` — every other
# family rule passes: both parents resolve, there is exactly one root, the root owns
# the shared table and no descendant repeats it, both concretes reach that abstract
# root, the family has concrete subtypes, every concrete carries a tagValue, the two
# tagValues are distinct, and the one primary key sits on the root. Only leaves may
# be concrete: a concrete position's effective concrete-subtype set is itself, so
# `Tug`'s rows could not be told apart from `Barge`'s by a read of `Tug`. A
# model-aware validator MUST reject the model at formation, before any SQL. The
# strategy is incidental — the rule is a question about the tree, not about how it
# maps to storage — so one case pins it for both strategies.
model: models/payment.yaml
tags: [m-inheritance, m-descriptor, rejected, negative, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  model:
    entities:
      - name: Vessel
        table: vessel
        inheritance:
          strategy: table-per-hierarchy
          role: root
          tag: { column: kind }
        attributes:
          - { name: id, type: int64, column: id, primaryKey: true }
      - name: Tug
        inheritance:
          role: concrete-subtype
          parent: Vessel
          tagValue: tug
        attributes:
          - { name: bollardPull, type: int32, column: bollard_pull, nullable: true }
      - name: Barge
        inheritance:
          role: concrete-subtype
          parent: Tug
          tagValue: barge
        attributes:
          - { name: deckArea, type: int32, column: deck_area, nullable: true }
then:
  rejectedRule: inheritance-concrete-subtype-with-children
