# Boundary case (m-auto-retry x m-db-port isolation): a retried invocation states
# its requested Isolation Level ONCE, on the outer invocation, and no attempt of
# its own restates it — `api-conformance` lane.
#
# An injected `deadlock` makes the first attempt's write fail retriably, so the
# boundary re-executes the whole closure and the second attempt commits. The
# stream below is what that costs and what it states: ONE outer invocation
# carrying `isolation: repeatable-read`, and TWO Transaction Attempts under it,
# neither carrying a level of its own.
#
# That placement is the whole assertion, and a retry is what puts it under
# pressure. A level is requested by an INVOCATION and the request stands over
# every attempt beneath it (`m-execution-lifecycle`), so an attempt restating it
# would read as a level that attempt chose, and an invocation omitting it would
# leave the request unstated on the very shape where the closure runs twice.
#
# What no observable here shows is either attempt's EFFECTIVE database isolation.
# Setting the level is boundary mechanics like begin, commit, and rollback: it
# constructs no Database Call and appears nowhere in this stream, and a boundary
# case authors no SQL either. That both attempts open at the requested level
# follows from the request being the invocation's rather than an attempt's — it
# is not a distinction these observables discriminate.
#
# The same exclusion is why `roundTrips: 4` is the count `m-auto-retry-002`'s
# retried pair costs — each attempt's observing read plus its write, the failed
# one included.
#
# `lane: api-conformance`: an injected transient and a re-executed closure are
# observables a single-connection harness cannot provoke. No golden SQL is
# authored, so each Database Call omits its `statement` index.
model: models/account.yaml
tags: [m-auto-retry, m-execution-lifecycle, m-api-conformance, isolation, transient, slice-snapshot-1]
lane: api-conformance
shape: boundary
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection concurrency/locking intent (given.fault, shape:boundary)"
given:
  fault: deadlock
when:
  uow:
    concurrency: optimistic
    isolation: repeatable-read
  boundary:
    - action: read
      note: observe the versioned row
    - action: update
      note: the first attempt's write raises an injected deadlock — auto-retried
then:
  outcome: committed
  roundTrips: 4
  executionLifecycle:
    roots:
      - execution: 1
        kind: transaction-invocation
        events:
          - sequence: 1
            activity: 1
            parent: null
            transactionInvocationStarted:
              invocation: outer
              concurrency: optimistic
              retries: 10
              retryOptimisticConflicts: false
              isolation: repeatable-read
          - sequence: 2
            activity: 2
            parent: 1
            transactionAttemptStarted: {edition: account}
          - sequence: 3
            activity: 3
            parent: 2
            acquisitionStarted: {}
          - sequence: 4
            activity: 3
            parent: 2
            acquisitionFinished: { outcome: acquired }
          - sequence: 5
            activity: 4
            parent: 2
            readStarted: { target: parallax.compatibility.Account, interface: typed }
          - sequence: 6
            activity: 5
            parent: 4
            databaseCallStarted: { target: parallax.compatibility.Account, kind: read }
          - sequence: 7
            activity: 5
            parent: 4
            databaseCallFinished: { outcome: readCompleted, returnedRows: 1 }
          - sequence: 8
            activity: 4
            parent: 2
            readFinished: { outcome: completed }
          - sequence: 9
            activity: 6
            parent: 2
            writeBatchStarted: { trigger: pre-commit }
          - sequence: 10
            activity: 7
            parent: 6
            databaseCallStarted: { target: parallax.compatibility.Account, kind: write }
          - sequence: 11
            activity: 7
            parent: 6
            databaseCallFinished: { outcome: failed, category: deadlock }
          - sequence: 12
            activity: 6
            parent: 2
            writeBatchFinished: { outcome: failed, attribution: caused, cause: 7 }
          - sequence: 13
            activity: 8
            parent: 2
            releaseStarted: {}
          - sequence: 14
            activity: 8
            parent: 2
            releaseFinished: { cleanup: returned }
          - sequence: 15
            activity: 2
            parent: 1
            transactionAttemptFinished:
              outcome: rolledBack
              phase: pre-commit
              retryEligible: true
              attribution: caused
              cause: 6
          - sequence: 16
            activity: 9
            parent: 1
            transactionAttemptStarted: {edition: account}
          - sequence: 17
            activity: 10
            parent: 9
            acquisitionStarted: {}
          - sequence: 18
            activity: 10
            parent: 9
            acquisitionFinished: { outcome: acquired }
          - sequence: 19
            activity: 11
            parent: 9
            readStarted: { target: parallax.compatibility.Account, interface: typed }
          - sequence: 20
            activity: 12
            parent: 11
            databaseCallStarted: { target: parallax.compatibility.Account, kind: read }
          - sequence: 21
            activity: 12
            parent: 11
            databaseCallFinished: { outcome: readCompleted, returnedRows: 1 }
          - sequence: 22
            activity: 11
            parent: 9
            readFinished: { outcome: completed }
          - sequence: 23
            activity: 13
            parent: 9
            writeBatchStarted: { trigger: pre-commit }
          - sequence: 24
            activity: 14
            parent: 13
            databaseCallStarted: { target: parallax.compatibility.Account, kind: write }
          - sequence: 25
            activity: 14
            parent: 13
            databaseCallFinished: { outcome: writeCompleted, affectedRows: 1 }
          - sequence: 26
            activity: 13
            parent: 9
            writeBatchFinished: { outcome: completed }
          - sequence: 27
            activity: 15
            parent: 9
            releaseStarted: {}
          - sequence: 28
            activity: 15
            parent: 9
            releaseFinished: { cleanup: returned }
          - sequence: 29
            activity: 9
            parent: 1
            transactionAttemptFinished: { outcome: committed }
          - sequence: 30
