# A back-reference at both Sharing Scopes (m-snapshot-read *Node sharing*): `Order.items.order`
# returns to the Order it arrived from, reached here from OrderItem roots so that two
# roots reach it. A shared Order is a true cycle in a Typed graph, and its document
# stays finite, because the nested `order` ends where the include path ends. This
# pair sits on `m-snapshot-read-011`'s lane, which holds a back-reference to an ancestor.
model: models/orders.yaml
tags: [m-snapshot-read, m-read-planning, sharing-scope, back-reference, cycle, relationship, graph, slice-snapshot-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "deep-fetch child levels - the Order and Order.items IN-list binds are gathered from the level above, so the child emissions depend on a query result (the closing OrderItem.order hop issues no SQL of its own)"
lane: api-conformance
when:
  objectQuery:
    target: parallax.compatibility.OrderItem
    predicate:
      in:
        path: parallax.compatibility.OrderItem.id
        values:
          - 11
          - 12
    orderBy:
      - attr: parallax.compatibility.OrderItem.id
        direction: asc
    includes:
      - segments:
          - rel: parallax.compatibility.OrderItem.order
          - rel: parallax.compatibility.Order.items
          - rel: parallax.compatibility.OrderItem.order
  sharingScope: page
then:
  statements:
    - sql:
        postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.id = any(cast(? as bigint[])) order by t0.id asc
      binds: [[11, 12]]
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.id = any(cast(? as bigint[]))
      binds: [[1]]
    - sql:
        postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id = any(cast(? as bigint[])) order by t0.id desc
      binds: [[1]]
  graph:
    OrderItem:
      - id: 11
        orderId: 1
        sku: A-100
        quantity: 2
        shippedOn: null
        order:
          id: 1
          name: Ada
          sku: A-100
          qty: 5
          price: "10.50"
          active: true
          orderedOn: 2024-01-05
          items:
            - id: 12
              orderId: 1
              sku: B-200
              quantity: 1
              shippedOn: 2024-02-15
              order: { id: 1, name: Ada, sku: A-100, qty: 5, price: "10.50", active: true, orderedOn: 2024-01-05 }
            - id: 11
              orderId: 1
              sku: A-100
              quantity: 2
              shippedOn: null
              order: { id: 1, name: Ada, sku: A-100, qty: 5, price: "10.50", active: true, orderedOn: 2024-01-05 }
      - id: 12
        orderId: 1
        sku: B-200
        quantity: 1
        shippedOn: 2024-02-15
        order:
          id: 1
          name: Ada
          sku: A-100
          qty: 5
          price: "10.50"
          active: true
          orderedOn: 2024-01-05
          items:
            - id: 12
              orderId: 1
              sku: B-200
              quantity: 1
              shippedOn: 2024-02-15
              order: { id: 1, name: Ada, sku: A-100, qty: 5, price: "10.50", active: true, orderedOn: 2024-01-05 }
            - id: 11
              orderId: 1
              sku: A-100
              quantity: 2
              shippedOn: null
              order: { id: 1, name: Ada, sku: A-100, qty: 5, price: "10.50", active: true, orderedOn: 2024-01-05 }
  databaseCalls: 3
