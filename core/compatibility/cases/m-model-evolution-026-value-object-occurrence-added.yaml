# Adding a Value Object OCCURRENCE (m-model-evolution): the addition boundary is
# the member's own nullability, not the kind of member it is.
tags: [m-model-evolution, evolution, value-object, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-value-object-v1.yaml
    later: models/evolution-value-object-v2.yaml
then:
  evolution:
    kind: coordinated
    operations:
      - kind: ValueObjectOccurrenceAdded
        valueObject: parallax.compatibility.Shipment.audit
      - kind: ValueObjectOccurrenceAdded
        valueObject: parallax.compatibility.Shipment.warranty
    behavioralImpacts: []
    overlapVisibleOperations: []
    coordinationRequirements:
      - operation:
          kind: ValueObjectOccurrenceAdded
          valueObject: parallax.compatibility.Shipment.warranty
        reasons:
          - AuthoringSurfaceChangeRequired
          - DatabaseMigrationRequired
