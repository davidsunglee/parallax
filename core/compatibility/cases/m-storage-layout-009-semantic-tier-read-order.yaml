# Canonical semantic tier order decides a read's projection, not declaration
# position or ancestry (m-storage-layout x m-sql).
model: models/storage-layout.yaml
tags: [m-storage-layout, m-object-query, m-inheritance, m-temporal-read, m-value-object, m-sql, table-per-hierarchy, root, temporal, as-of, document, familyVariant, graph, instance-form, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.LayoutReading
    predicate:
      all: {}
    temporal:
      transaction-time:
        asOf: latest
then:
  statements:
    - sql:
        postgres: select t0.id, t0.kind, t0.sensor, t0.celsius, t0.in_z, t0.out_z, not t0.probe is null, t0.probe from layout_reading t0 where t0.out_z = ?
      binds: [infinity]
  referenceSql: select id, kind, sensor, celsius, in_z, out_z from layout_reading where out_z = 'infinity'::timestamptz
  graph:
    LayoutReading:
      - id: 1
        sensor: north
        celsius: "21.50"
        txStart: "2024-02-01T00:00:00.000000Z"
        txEnd: infinity
        probe:
          model: TH-2
        familyVariant: LayoutMeterReading
  roundTrips: 1
