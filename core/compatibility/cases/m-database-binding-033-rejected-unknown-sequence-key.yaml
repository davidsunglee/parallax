# A sequence entry must name a logical allocator the model declares: the model
# declares `fleetIds`, so an entry for `fleetId` is a typo, refused rather than
# silently ignored.
model: models/binding-fleet.yaml
tags: [m-database-binding, rejected, negative, binding, slice-snapshot-1]
shape: rejected
when:
  binding:
    postgres:
      format_version: 1
      backend: postgres
      default: { schema: px }
      sequences:
        fleetId: { schema: px_keys }
    mariadb:
      format_version: 1
      backend: mariadb
      default: { database: px }
      sequences:
        fleetId: { database: px_keys }
then:
  rejectedRule: binding-sequence-unknown
