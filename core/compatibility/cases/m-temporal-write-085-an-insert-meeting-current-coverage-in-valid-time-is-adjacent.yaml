# Position 1 covers [March, September) in Valid Time. A later insert opens
# [September, December): the rectangles share Transaction Time but meet at September
# in Valid Time without overlapping, so both stand.
model: models/position.yaml
tags: [m-temporal-write, m-sql, bitemporal, temporal, write-sequence, insert-until, slice-snapshot-1, slice-managed-1]
shape: writeSequence
when:
  writeSequence:
    - mutation: insertUntil
      entity: parallax.compatibility.Position
      statements: 1
      note: open [2024-03-01, 2024-09-01)
      rows:
        - { id: 1, acctNum: A, value: "100.00" }
      validFrom: "2024-03-01T00:00:00.000000Z"
      at: "2024-01-01T00:00:00.000000Z"
      until: "2024-09-01T00:00:00.000000Z"
    - mutation: insertUntil
      entity: parallax.compatibility.Position
      statements: 1
      note: open [2024-09-01, 2024-12-01), meeting the first rectangle in Valid Time
      rows:
        - { id: 1, acctNum: A, value: "150.00" }
      validFrom: "2024-09-01T00:00:00.000000Z"
      at: "2024-02-01T00:00:00.000000Z"
      until: "2024-12-01T00:00:00.000000Z"
then:
  statements:
    - sql:
        postgres: insert into position(pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
        mariadb: insert into `position` (pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
      binds: [1, A, "100.00", "2024-03-01T00:00:00.000000Z", "2024-09-01T00:00:00.000000Z", "2024-01-01T00:00:00.000000Z", infinity]
    - sql:
        postgres: insert into position(pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
        mariadb: insert into `position` (pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
      binds: [1, A, "150.00", "2024-09-01T00:00:00.000000Z", "2024-12-01T00:00:00.000000Z", "2024-02-01T00:00:00.000000Z", infinity]
  tableState:
    position:
      - pos_id: 1
        acct_num: A
        val: "100.00"
        from_z: "2024-03-01T00:00:00.000000Z"
        thru_z: "2024-09-01T00:00:00.000000Z"
        in_z: "2024-01-01T00:00:00.000000Z"
        out_z: infinity
      - pos_id: 1
        acct_num: A
        val: "150.00"
        from_z: "2024-09-01T00:00:00.000000Z"
        thru_z: "2024-12-01T00:00:00.000000Z"
        in_z: "2024-02-01T00:00:00.000000Z"
        out_z: infinity
  databaseCalls: 2
