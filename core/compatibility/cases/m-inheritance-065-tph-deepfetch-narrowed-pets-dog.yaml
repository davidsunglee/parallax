# Deep fetch of ONE narrowed subtype view `pets[Dog]` (m-deep-fetch, m-inheritance).
model: models/animal.yaml
tags: [m-deep-fetch, m-inheritance, m-predicate, m-object-query, m-sql, table-per-hierarchy, narrow, deep-fetch, slice-snapshot-1, slice-managed-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "deep-fetch child level - the narrowed pets[Dog] view's shared animal-table IN-list binds are the distinct owner ids gathered from the root query result, so the child emissions depend on a query result"
when:
  objectQuery:
    target: parallax.compatibility.Person
    predicate:
      all: {}
    includes:
      - segments:
          - rel: parallax.compatibility.Person.pets
            narrowTo:
              - parallax.compatibility.Dog
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name from person t0
    - sql:
        postgres: select t0.id, t0.name, t0.owner_id, t0.license_id, t0.bark_volume from animal t0 where t0.owner_id = any(?) and t0.kind = ?
      binds: [[10, 11, 12], dog]
  referenceSql: select id, name from person
  graph:
    Person:
      - id: 10
        name: Alice
        "pets[Dog]":
          - { id: 1, name: Rex, ownerId: 10, licenseId: L-100, barkVolume: 7 }
      - id: 11
        name: Bob
        "pets[Dog]":
          - { id: 2, name: Fido, ownerId: 11, licenseId: L-101, barkVolume: 3 }
      - id: 12
        name: Carol
        "pets[Dog]": []
  roundTrips: 2
