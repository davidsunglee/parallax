# Boundary case (m-auto-retry): a PERSISTENT retriable failure surfaces after the bound is
# exhausted — `api-conformance` lane.
model: models/account.yaml
tags: [m-auto-retry, m-opt-lock, m-api-conformance, transient, slice-snapshot-1, slice-managed-1]
lane: api-conformance
shape: boundary
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection concurrency/locking intent (given.fault, shape:boundary)"
given:
  fault: serialization-failure
when:
  uow:
    concurrency: locking
    maxRetries: 2
  boundary:
    - action: read
      note: observe the versioned row
    - action: update
      note: the write raises a serialization failure on every attempt — surfaces after the bound
then:
  outcome: serialization-failure
  roundTrips: 6
