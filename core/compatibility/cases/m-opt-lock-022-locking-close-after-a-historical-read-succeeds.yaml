# A locking-mode milestone close staged after an AUDIT read of the same key commits
# UNGATED (m-opt-lock "Effective Concurrency Strategy determines the gate uniformly" + m-read-lock
# "Automatic read-lock correctness", composed inside one `uow` group).
#
# One unit of work reads Balance id 1 at Latest (the current milestone, value 150),
# then reads the SAME key at the past Transaction-Time instant 2024-04-01 — a
# historical milestone, value 100, superseded on the Transaction-Time axis — and then
# writes. Both finds carry the dialect's shared row lock, because the unit participates
# in `locking` mode; the close that follows carries NO gate predicate — its address is
# the whole `where bal_id = ? and out_z = ?` — because a gate is optimistic mode's
# recovery and this mode holds locks instead. The close addresses the milestone still
# open on Transaction Time, chains its successor, and commits; `then.tableState` shows
# the superseded milestone the audit read returned untouched.
#
# The semantic distinction is that the gate decision and the address are properties of
# Balance's own Effective Concurrency Strategy and of the milestone the close observes,
# not of the transaction's
# reading history: staging a second, historical read of the same key between the first
# find and the write changes neither. An implementation that emitted an `and in_z = ?`
# gate here, or that took no shared lock on either find, fails the case.
#
# What this case does NOT grade, so that no reader takes it for more: the milestone
# this close addresses is resolved from the case's own current state — the one row of
# Balance id 1 still open on Transaction Time — and NOT from either find step. A case
# supplies the observed rows a write consumes rather than the framework issuing an
# implicit resolving read, so neither find contributes evidence to this write and no
# license exists for the audit read to revoke. Nothing here observes how an
# implementation KEYS the observations its own reads record, nor whether a write
# consults them at all.
model: models/balance.yaml
tags: [m-opt-lock, m-unit-work, m-txtime-write, m-read-lock, m-temporal-read, temporal, audit-only, as-of, scenario, slice-snapshot-1, slice-managed-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "the close addresses the milestone the write observes as current on Transaction Time, and its out_z bind is read off that observation rather than authored (m-opt-lock)"
when:
  uow:
    concurrency: locking
  scenario:
    - uow: audit-then-close
      objectQuery:
        target: parallax.compatibility.Balance
        predicate:
          eq:
            attr: parallax.compatibility.Balance.id
            value: 1
        temporal:
          transaction-time:
            asOf: latest
      roundTrips: 1
      note: read the CURRENT milestone of id 1 (value 150, known from 2024-06-01) under the shared row lock this unit's locking mode takes
      statements:
        - sql:
            postgres: select t0.bal_id, t0.acct_num, t0.val, t0.in_z, t0.out_z from balance t0 where t0.bal_id = ? and t0.out_z = ? for share of t0
          binds: [1, infinity]
      expectRows:
        - { bal_id: 1, acct_num: A, val: "150.00", in_z: "2024-06-01T00:00:00.000000Z", out_z: infinity }
    - uow: audit-then-close
      objectQuery:
        target: parallax.compatibility.Balance
        predicate:
          eq:
            attr: parallax.compatibility.Balance.id
            value: 1
        temporal:
          transaction-time:
            asOf: "2024-04-01T00:00:00.000000Z"
      roundTrips: 1
      note: audit the SAME key at the past Transaction-Time instant 2024-04-01 — the superseded milestone (value 100), a DIFFERENT milestone of the same primary key
      statements:
        - sql:
            postgres: select t0.bal_id, t0.acct_num, t0.val, t0.in_z, t0.out_z from balance t0 where t0.bal_id = ? and t0.in_z <= ? and t0.out_z > ? for share of t0
          binds: [1, "2024-04-01T00:00:00.000000Z", "2024-04-01T00:00:00.000000Z"]
      expectRows:
        - { bal_id: 1, acct_num: A, val: "100.00", in_z: "2024-01-01T00:00:00.000000Z", out_z: "2024-06-01T00:00:00.000000Z" }
    - uow: audit-then-close
      write:
        - mutation: update
          entity: parallax.compatibility.Balance
          rows:
            - { id: 1, acctNum: A, value: "175.00" }
          at: "2024-10-01T00:00:00.000000Z"
      roundTrips: 2
      note: the close is ACCEPTED and commits — no gate predicate (locking mode), addressing the milestone still open on Transaction Time rather than the historical one the audit read returned
      statements:
        - sql:
            postgres: update balance set out_z = ? where bal_id = ? and out_z = ?
          binds: ["2024-10-01T00:00:00.000000Z", 1, infinity]
        - sql:
            postgres: insert into balance(bal_id, acct_num, val, in_z, out_z) values (?, ?, ?, ?, ?)
          binds: [1, A, "175.00", "2024-10-01T00:00:00.000000Z", infinity]
then:
  roundTrips: 4
  tableState:
    balance:
      - { bal_id: 1, acct_num: A, val: "100.00", in_z: "2024-01-01T00:00:00.000000Z", out_z: "2024-06-01T00:00:00.000000Z" }
      - { bal_id: 1, acct_num: A, val: "150.00", in_z: "2024-06-01T00:00:00.000000Z", out_z: "2024-10-01T00:00:00.000000Z" }
      - { bal_id: 1, acct_num: A, val: "175.00", in_z: "2024-10-01T00:00:00.000000Z", out_z: infinity }
      - { bal_id: 2, acct_num: B, val: "200.00", in_z: "2024-02-01T00:00:00.000000Z", out_z: infinity }
      - { bal_id: 3, acct_num: C, val: "50.00", in_z: "2024-03-01T00:00:00.000000Z", out_z: "2024-08-01T00:00:00.000000Z" }
