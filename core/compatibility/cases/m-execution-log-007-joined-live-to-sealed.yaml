# Joined live-to-sealed (m-execution-log): a joined unit of work appends to the
# OUTER log — one log, one attempt, spanning both bodies.
#
# The body reads, then opens a joined unit of work (`action: join`) and writes
# inside it. A joined boundary shares the outer transaction rather than opening a
# nested one (m-unit-work), so the semantic distinction this case pins down is
# that the joined write produces no second Execution Log and no second Transaction
# Attempt: the log holds ONE attempt whose traces span both bodies, and the
# joined write reaches the database under the OUTER boundary's `finalization`
# trigger because that boundary is the one that finalizes the shared buffer.
# A log showing two attempts, or two logs, would describe a fictitious nested
# transaction that never existed physically.
#
# That terminal value graph is the whole of what `then.execution` asserts here,
# and this case must not be read as proving the lifecycle that reaches it. The
# log being reachable and `active` while the outer boundary still runs, the
# joined result exposing the same log OBJECT rather than a copy, a trace appended
# after the join becoming visible on it, the seal at the outer boundary, and the
# two intermediate states (outer still active, outer later rolled back) surfacing
# as distinct errors on the joined result are observations taken DURING an
# invocation, which a terminal oracle cannot express. Each language proves them
# in the API Conformance story this case maps to, not from anything portable in
# this file.
#
# `lane: api-conformance`: a joined boundary is an API arrangement with no wire
# spelling, so no golden SQL is authored and each Database Call omits its
# `statement` index, so that story grades the whole case.
model: models/account.yaml
tags: [m-execution-log, m-unit-work, m-api-conformance, joined]
lane: api-conformance
shape: boundary
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection unit-of-work boundary intent (shape:boundary)"
when:
  uow:
    concurrency: locking
  boundary:
    - action: read
      note: the OUTER body observes the row it will write
    - action: join
      note: open a joined unit of work — it shares the outer transaction, not a nested boundary
    - action: update
      note: the joined body writes; the OUTER boundary finalizes the shared buffer
then:
  outcome: committed
  roundTrips: 2
  execution:
    transactionLog:
      concurrency: locking
      retryPolicy:
        maxRetries: 10
        retryOptimisticConflicts: false
      attempts:
        - status: committed
          traces:
            - readTrace:
                calls:
                  - kind: read
                    completion:
                      readCompleted:
                        returnedRows: 1
                roundTrips: 1
            - writeBatch:
                trigger: finalization
                calls:
                  - kind: write
                    completion:
                      writeCompleted:
                        affectedRows: 1
                roundTrips: 1
          roundTrips: 2
      roundTrips: 2
