# A POPULATED to-many relationship survives an authored edit (m-snapshot-read
# *Closed world*, composition): once a read has materialized a relationship,
# deriving an edited copy of the node leaves that view alone — accessing it still
# issues ZERO SQL, still answers the same objects, and its contents are intact.
# This is the clause "a derived copy's view state IS its source's" for the arm
# m-snapshot-read-015 cannot reach: that case's source read included nothing, so it
# proves only the ABSENT half, and nothing anywhere states what a copy answers for a
# relationship the read DID materialize.
#
# Step 0 materializes order 1 WITH its `items` — the ordinary 1 + L deep fetch, one
# statement per level, two round trips. Step 1 derives an edited copy, assigning
# `name` in memory: no DML at all, exactly as m-snapshot-read-010 pins. Step 2
# accesses `items` on the view step 0 materialized, now that an edit has intervened,
# and states its WHOLE contents through `expectGraph` — both OrderItem rows, every
# declared member, unchanged, in the `id desc` order the relationship declares.
# `roundTrips: 0` is the closed-world half (the access fires no query) and
# `expectGraph` is the survival half (it answers what the read paid for). A language
# that rebuilds an edited copy from its declared members alone fails the second; one
# that quietly re-fetches the relationship fails the first.
#
# The semantic distinction is against a read-back. A fresh find after the edit
# re-queries the database and therefore grades a NEW materialization: it would pass
# on an implementation that discarded every view, because the database still holds
# the rows. Only an access on the node the scenario already materialized can tell
# a surviving view from a re-derived one, which is why `expectGraph` is legal on an
# access step alone. `sameObjectAs: 0` rides along for consistency with the other
# zero-round-trip accesses (m-op-list-002), but on the wire lane it is primary-key
# equality against this step's own reused source rows; the identity proof of record
# — that the copy's items are literally the SAME objects — is the reference-identity
# assertion each language's API Conformance Suite runs (m-api-conformance).
model: models/orders.yaml
tags: [m-snapshot-read, m-deep-fetch, closed-world, relationship, mutation, scenario, slice-snapshot-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "include level - the Order.items child IN-list binds are the distinct root keys gathered from step 0's own root read, so the child emission depends on a query result"
when:
  scenario:
    - objectQuery:
        target: parallax.compatibility.Order
        predicate:
          eq:
            attr: parallax.compatibility.Order.id
            value: 1
        includes:
          - segments:
              - rel: parallax.compatibility.Order.items
      roundTrips: 2
      note: materialize a snapshot of order 1 WITH its line items (1 + L levels)
      statements:
        - sql:
            postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.id = ?
          binds: [1]
        - sql:
            postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id in (?) order by t0.id desc
          binds: [1]
      expectRows:
        - { id: 1, name: Ada, sku: A-100, qty: 5, price: 10.50, active: true, ordered_on: 2024-01-05 }
    - action: mutate
      "on": 0
      set: { name: Mutant }
      roundTrips: 0
      note: derive an edited copy of the snapshot node -> NO DML (a snapshot has no write-back)
    - action: access
      "on": 0
      path: items
      roundTrips: 0
      sameObjectAs: 0
      note: access the ALREADY-MATERIALIZED items after the edit -> ZERO SQL and the same contents
      expectGraph:
        OrderItem:
          - { id: 12, orderId: 1, sku: B-200, quantity: 1, shippedOn: 2024-02-15 }
          - { id: 11, orderId: 1, sku: A-100, quantity: 2, shippedOn: null }
then:
  roundTrips: 2
