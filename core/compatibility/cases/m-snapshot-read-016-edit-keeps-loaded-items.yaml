# A POPULATED to-many relationship survives an authored edit (m-snapshot-read
# *Closed world*, composition): once a read has materialized a relationship, an
# intervening edit leaves that view alone — accessing it still issues ZERO SQL and
# still answers the same line items. The clause "a derived copy's view state IS its
# source's" has two halves, and this case holds the SOURCE's: what the node the
# read produced still answers once a copy has been derived from it.
# m-snapshot-read-015 holds the copy's half, accessing the COPY rather than the
# read — which is why it is an api-conformance-lane case, graded by each language's
# Suite, where a copy exists as an object at all.
model: models/orders.yaml
tags: [m-snapshot-read, m-edit, m-deep-fetch, closed-world, relationship, mutation, scenario, slice-snapshot-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "include level - the Order.items child IN-list binds are the distinct root keys gathered from step 0's own root read, so the child emission depends on a query result"
when:
  scenario:
    - objectQuery:
        target: parallax.compatibility.Order
        predicate:
          eq:
            attr: parallax.compatibility.Order.id
            value: 1
        includes:
          - segments:
              - rel: parallax.compatibility.Order.items
      roundTrips: 2
      note: materialize a snapshot of order 1 WITH its line items (1 + L levels)
      statements:
        - sql:
            postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.id = ?
          binds: [1]
        - sql:
            postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id = any(?) order by t0.id desc
          binds: [[1]]
      expectRows:
        - { id: 1, name: Ada, sku: A-100, qty: 5, price: "10.50", active: true, ordered_on: 2024-01-05 }
    - action: mutate
      "on": 0
      set: { name: Mutant }
      roundTrips: 0
      note: derive an edited copy of the snapshot node -> NO DML (a snapshot has no write-back)
    - action: access
      "on": 0
      path: items
      roundTrips: 0
      sameObjectAs: 0
      note: access the ALREADY-MATERIALIZED items after the edit -> ZERO SQL and the same contents
      expectGraph:
        OrderItem:
          - { id: 12, orderId: 1, sku: B-200, quantity: 1, shippedOn: 2024-02-15 }
          - { id: 11, orderId: 1, sku: A-100, quantity: 2, shippedOn: null }
then:
  roundTrips: 2
