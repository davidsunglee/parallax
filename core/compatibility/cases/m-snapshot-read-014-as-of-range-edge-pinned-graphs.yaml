# asOfRange returns one Continuation-ordered root sequence over the overlapping
# milestones; the compatibility projection remains edge-keyed.
model: models/invoice.yaml
tags: [m-snapshot-read, m-object-query, m-deep-fetch, m-temporal-read, temporal, as-of-range, edge-pinned, graph, audit-only, slice-snapshot-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.InvoiceLine
    predicate:
      eq:
        attr: parallax.compatibility.InvoiceLine.id
        value: 1000
    temporal:
      transaction-time:
        asOfRange:
          start: "2024-02-01T00:00:00.000000Z"
          end: "2024-05-01T00:00:00.000000Z"
then:
  statements:
    - sql:
        postgres: select t0.id, t0.invoice_id, t0.amount, t0.in_z, t0.out_z from invoice_line t0 where t0.id = ? and t0.in_z < ? and t0.out_z > ? order by t0.id asc, t0.in_z asc
      binds: [1000, "2024-05-01T00:00:00.000000Z", "2024-02-01T00:00:00.000000Z"]
  referenceSql: "select id, invoice_id, amount, in_z, out_z from invoice_line where id = 1000 and in_z < '2024-05-01T00:00:00+00:00'::timestamptz and out_z > '2024-02-01T00:00:00+00:00'::timestamptz order by id asc, in_z asc"
  graphs:
    - pin: { transaction-time: "2024-01-01T00:00:00.000000Z" }
      graph:
        InvoiceLine:
          - { id: 1000, invoiceId: 100, amount: "50.00", txStart: "2024-01-01T00:00:00.000000Z", txEnd: "2024-04-01T00:00:00.000000Z" }
    - pin: { transaction-time: "2024-04-01T00:00:00.000000Z" }
      graph:
        InvoiceLine:
          - { id: 1000, invoiceId: 100, amount: "75.00", txStart: "2024-04-01T00:00:00.000000Z", txEnd: infinity }
  roundTrips: 1
