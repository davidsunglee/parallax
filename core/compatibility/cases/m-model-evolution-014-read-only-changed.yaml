# Making a member read-only, and making one editable (m-model-evolution): one
# evolution, both directions of the boundary.
tags: [m-model-evolution, evolution, write-surface, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-read-only-v1.yaml
    later: models/evolution-read-only-v2.yaml
then:
  evolution:
    kind: coordinated
    operations:
      - kind: AttributeAltered
        attribute: parallax.compatibility.Notice.headline
        deltas: [{ kind: ReadOnlyChanged, earlier: false, later: true }]
      - kind: AttributeAltered
        attribute: parallax.compatibility.Notice.slug
        deltas: [{ kind: ReadOnlyChanged, earlier: true, later: false }]
    behavioralImpacts:
      - kind: WriteCapabilityChanged
        scope: { attribute: parallax.compatibility.Notice.headline }
        earlier: CallerInsertAndUpdate
        later: CallerInsertOnly
        causedBy:
          - kind: AttributeAltered
            attribute: parallax.compatibility.Notice.headline
            deltas: [{ kind: ReadOnlyChanged, earlier: false, later: true }]
      - kind: WriteCapabilityChanged
        scope: { attribute: parallax.compatibility.Notice.slug }
        earlier: CallerInsertOnly
        later: CallerInsertAndUpdate
        causedBy:
          - kind: AttributeAltered
            attribute: parallax.compatibility.Notice.slug
            deltas: [{ kind: ReadOnlyChanged, earlier: true, later: false }]
    overlapVisibleOperations: []
    coordinationRequirements:
      - operation:
          kind: AttributeAltered
          attribute: parallax.compatibility.Notice.headline
          deltas: [{ kind: ReadOnlyChanged, earlier: false, later: true }]
        reasons: [AuthoringSurfaceChangeRequired]
