# Diagnostic evidence and a physical coordinate describe the same stored cell and
# are still two different values, and this is the case that separates them.
# `given.corrupt` writes the digit string `1.500` over row 102's `amount`, a
# `decimal(12,2)` whose canonical document spelling carries exactly the declared
# scale — so no decoding admits it and the read publishes no value for that root.
# The ordering expression is untouched by that verdict: `decimal` compares through
# a dialect cast, and the cast of `1.500` is `1.50`, an ordinary member of the
# declared value space that the database ranks smallest of the three.
#
# So the delivery reads `1.50` as the coordinate it continues from and never as a
# repaired value: the root it belongs to still publishes `null` and still states
# `stored-data-leaf-undecodable`. The two values sit side by side in this file —
# `given.corrupt` states what the model rejects, and the second page's leading
# seek binds what `order by` evaluated — and a page that derived its coordinate
# from the rejected value instead would have nothing to bind.
model: models/stream-coordinates.yaml
tags: [m-snapshot-read, m-object-query, m-sql, stream, streamed-delivery, stored-data, corrupt, decimal, document-layout, graph, slice-snapshot-1]
shape: read
compileEligibility: { mode: run-only, reason: query-result-dependent }
given:
  corrupt:
    - entity: parallax.compatibility.StreamCoordinate
      key: 102
      member: [amount]
      value: "1.500"
when:
  objectQuery:
    target: parallax.compatibility.StreamCoordinate
    predicate: { all: {} }
    orderBy: [{ attr: parallax.compatibility.StreamCoordinate.amount }]
  stream: { batchSize: 1 }
then:
  statements:
    - sql: { postgres: "select t0.id, not t0.coordinates is null, t0.coordinates, cast(jsonb_extract_path_text(t0.coordinates, ?) as decimal(12, 2)) parallax_seek_0, t0.id parallax_seek_1 from stream_coordinate t0 order by cast(jsonb_extract_path_text(t0.coordinates, ?) as decimal(12, 2)) asc, t0.id asc limit ?" }
      binds: { postgres: [amount, amount, 2] }
    - sql: { postgres: "select t0.id, not t0.coordinates is null, t0.coordinates, cast(jsonb_extract_path_text(t0.coordinates, ?) as decimal(12, 2)) parallax_seek_0, t0.id parallax_seek_1 from stream_coordinate t0 where (cast(jsonb_extract_path_text(t0.coordinates, ?) as decimal(12, 2)) > ? or jsonb_extract_path_text(t0.coordinates, ?) is null or (cast(jsonb_extract_path_text(t0.coordinates, ?) as decimal(12, 2)) = ? and (t0.id > ? or t0.id is null))) order by cast(jsonb_extract_path_text(t0.coordinates, ?) as decimal(12, 2)) asc, t0.id asc limit ?" }
      binds: { postgres: [amount, amount, "1.50", amount, amount, "1.50", 102, amount, 2] }
    - sql: { postgres: "select t0.id, not t0.coordinates is null, t0.coordinates, cast(jsonb_extract_path_text(t0.coordinates, ?) as decimal(12, 2)) parallax_seek_0, t0.id parallax_seek_1 from stream_coordinate t0 where (cast(jsonb_extract_path_text(t0.coordinates, ?) as decimal(12, 2)) > ? or jsonb_extract_path_text(t0.coordinates, ?) is null or (cast(jsonb_extract_path_text(t0.coordinates, ?) as decimal(12, 2)) = ? and (t0.id > ? or t0.id is null))) order by cast(jsonb_extract_path_text(t0.coordinates, ?) as decimal(12, 2)) asc, t0.id asc limit ?" }
      binds: { postgres: [amount, amount, "10.25", amount, amount, "10.25", 101, amount, 2] }
  graph:
    StreamCoordinate:
      - null
      - { id: 101, day: "2026-01-15", clock: "09:30:00", amount: "10.25", payload: "0a1b", token: "00000000-0000-4000-8000-0000000000ab", instant: "2026-01-15T09:30:00.000000Z", f32: 1.5, f64: 2.25 }
      - { id: 103, day: "2026-01-15", clock: "09:30:00", amount: "10.25", payload: "0a1b", token: "00000000-0000-4000-8000-0000000000ab", instant: "2026-01-15T09:30:00.000000Z", f32: 1.5, f64: 2.25 }
  storedDataIssues:
    - ordinal: 0
      hydrated: false
      issues:
        - code: stored-data-leaf-undecodable
          entity: parallax.compatibility.StreamCoordinate
          member: parallax.compatibility.StreamCoordinate.amount
          objectKey: { entity: parallax.compatibility.StreamCoordinate, key: { id: 102 } }
  roundTrips: 3
