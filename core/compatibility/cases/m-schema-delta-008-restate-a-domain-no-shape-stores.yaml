# Contracting a value domain at a position that denotes no stored shape
# (m-schema-delta): unilateral, and still one physical statement.
tags: [m-model-evolution, m-schema-delta, evolution, inheritance, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-rowless-domain-v1.yaml
    later: models/evolution-rowless-domain-v2.yaml
then:
  evolution:
    kind: unilateral
    operations:
      - kind: AttributeAltered
        attribute: parallax.compatibility.Draft.caption
        deltas: [{ kind: MaximumLengthChanged, earlier: 64, later: 32 }]
    behavioralImpacts:
      - kind: ValueAdmissibilityChanged
        scope: { attribute: parallax.compatibility.Draft.caption }
        earlier: { type: string, nullable: false, maxLength: 64 }
        later: { type: string, nullable: false, maxLength: 32 }
        causedBy:
          - kind: AttributeAltered
            attribute: parallax.compatibility.Draft.caption
            deltas: [{ kind: MaximumLengthChanged, earlier: 64, later: 32 }]
    overlapVisibleOperations: []
    coordinationRequirements: []
  schema:
    postgres:
      delta:
        statements:
          - alter table evolution_registry alter column caption type varchar(32)
        createdIndices: []
    mariadb:
      delta:
        statements:
          - alter table evolution_registry modify caption varchar(32)
        createdIndices: []
