# A versioned UPDATE of a document-mapped Entity gates on a direct Column while
# patching the document in the same statement (m-concurrency x m-storage-layout x
# m-dialect), on Postgres AND MariaDB.
model: models/document-layout.yaml
tags: [m-concurrency, m-storage-layout, m-dialect, m-document-codec, m-sql, m-unit-work, write-sequence, update, json, document-layout, slice-snapshot-1]
shape: writeSequence
given:
  fixtures: true
when:
  uow:
    concurrency: optimistic
  writeSequence:
    - mutation: amend
      entity: parallax.compatibility.Ledger
      statements: 1
      note: one document path patched, the version Column advanced and gated
      rows:
        - { id: 100, label: closing, observedVersion: 1 }
then:
  statements:
    - sql:
        postgres: update px.ledger set payload = jsonb_set(payload, ?, cast(? as jsonb)), version = ? where id = ? and version = ?
        mariadb: update px.ledger set payload = json_set(payload, ?, json_extract(?, '$')), version = ? where id = ? and version = ?
      binds:
        postgres: ['{label}', closing, 2, 100, 1]
        mariadb: ['$.label', closing, 2, 100, 1]
  tableState:
    px:
      ledger:
        - id: 100
          version: 2
          payload:
            label: closing
            balance: '250.00'
            details: { code: opening }
        - id: 200
          version: 1
          payload:
            balance: '40.00'
            details: { code: settled }
  databaseCalls: 2
