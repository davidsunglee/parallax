# Deep fetch of EQUIVALENT authored narrowings that derive the SAME view key
# (m-deep-fetch, m-inheritance).
model: models/animal.yaml
tags: [m-deep-fetch, m-inheritance, m-predicate, m-object-query, m-sql, table-per-hierarchy, narrow, deep-fetch, familyVariant, slice-snapshot-1, slice-managed-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "deep-fetch child level - the deduplicated pets[Cat,Dog] view's shared animal-table IN-list binds are the distinct owner ids gathered from the root query result, so the child emissions depend on a query result"
when:
  objectQuery:
    target: parallax.compatibility.Person
    predicate:
      all: {}
    includes:
      - segments:
          - rel: parallax.compatibility.Person.pets
            narrowTo:
              - parallax.compatibility.Cat
              - parallax.compatibility.Dog
      - segments:
          - rel: parallax.compatibility.Person.pets
            narrowTo:
              - parallax.compatibility.Pet
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name from person t0
    - sql:
        postgres: select t0.id, t0.kind, t0.name, t0.owner_id, t0.license_id, t0.indoor, t0.bark_volume from animal t0 where t0.owner_id = any(?) and t0.kind in (?, ?)
      binds: [[10, 11, 12], cat, dog]
  referenceSql: select id, name from person
  graph:
    Person:
      - id: 10
        name: Alice
        "pets[Cat,Dog]":
          - { id: 1, name: Rex, ownerId: 10, licenseId: L-100, barkVolume: 7, indoor: null, familyVariant: Dog }
          - { id: 3, name: Whiskers, ownerId: 10, licenseId: L-200, barkVolume: null, indoor: true, familyVariant: Cat }
      - id: 11
        name: Bob
        "pets[Cat,Dog]":
          - { id: 2, name: Fido, ownerId: 11, licenseId: L-101, barkVolume: 3, indoor: null, familyVariant: Dog }
      - id: 12
        name: Carol
        "pets[Cat,Dog]": []
  roundTrips: 2
