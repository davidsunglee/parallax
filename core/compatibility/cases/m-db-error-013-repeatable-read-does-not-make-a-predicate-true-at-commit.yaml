# Transaction A zeroes the accounts under 200.00 it read. A peer brings account 2
# under 200.00 and commits first; A's repeated read keeps its snapshot, so A writes
# accounts 1 and 3 and commits while account 2 matches the predicate unwritten.
model: models/account.yaml
tags: [m-db-error, m-unit-work, isolation, concurrency, phantom, repeatable-read, slice-snapshot-1]
shape: concurrencySuccess
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "two-session isolation witness (when.concurrency)"
given:
  fixtures: true
when:
  uow:
    concurrency: optimistic
    isolation: repeatable-read
  concurrency:
    rounds:
      - A:
          kind: read
          statements:
            - sql:
                postgres: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.balance < ?
                mariadb: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.balance < ?
              binds: ["200.00"]
          expectRows:
            - { id: 1, owner: Ada, balance: "100.00", version: 1 }
            - { id: 3, owner: Grace, balance: "10.00", version: 1 }
      - B:
          kind: write
          statements:
            - sql:
                postgres: update account set balance = ?, version = ? where id = ? and version = ?
                mariadb: update account set balance = ?, version = ? where id = ? and version = ?
              binds: ["50.00", 2, 2, 1]
          affectedRows: [1]
      - B:
          kind: commit
      - A:
          kind: read
          statements:
            - sql:
                postgres: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.balance < ?
                mariadb: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.balance < ?
              binds: ["200.00"]
          expectRows:
            - { id: 1, owner: Ada, balance: "100.00", version: 1 }
            - { id: 3, owner: Grace, balance: "10.00", version: 1 }
      - A:
          kind: write
          statements:
            - sql:
                postgres: update account set balance = ?, version = ? where id = ? and version = ?
                mariadb: update account set balance = ?, version = ? where id = ? and version = ?
              binds: ["0.00", 2, 1, 1]
            - sql:
                postgres: update account set balance = ?, version = ? where id = ? and version = ?
                mariadb: update account set balance = ?, version = ? where id = ? and version = ?
              binds: ["0.00", 2, 3, 1]
          affectedRows: [1, 1]
      - A:
          kind: commit
then:
  tableState:
    account:
      - { id: 1, owner: Ada, balance: "0.00", version: 2 }
      - { id: 2, owner: Linus, balance: "50.00", version: 2 }
      - { id: 3, owner: Grace, balance: "0.00", version: 2 }
