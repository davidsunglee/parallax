# Nothing places the Wallet table: no entry, namespace, or default supplies a
# location, and no connection default or search path stands in for one.
model: models/wallet.yaml
tags: [m-database-binding, rejected, negative, binding, slice-snapshot-1]
shape: rejected
when:
  binding:
    postgres:
      format_version: 1
      backend: postgres
      entities:
        parallax.compatibility.Wallet: { table: purse }
    mariadb:
      format_version: 1
      backend: mariadb
      entities:
        parallax.compatibility.Wallet: { table: purse }
then:
  rejectedRule: binding-table-unresolved
