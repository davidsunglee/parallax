# An owner whose active is null makes the operand unknown, which does not match.
model: models/predicate-collections.yaml
tags: [m-predicate, relationship, to-one, traversal, notExists, matching, negation, m-dialect, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Basket
    predicate:
      and:
        operands:
          - notEq: {path: parallax.compatibility.Basket.owner.name, value: Cy}
          - notExists:
              path: parallax.compatibility.Basket.owner
              where:
                eq: {path: active, value: true}
then:
  statements:
  - sql: {postgres: 'select t0.id, t0.label, t0.owner_id, not t0.tags is null, t0.tags, not t0.scores is null, t0.scores, not t0.prices is null, t0.prices, not t0.flags is null, t0.flags, not t0.parcels is null, t0.parcels, not t0.meta is null, t0.meta from basket t0 left join basket_owner t1 on t1.id = t0.owner_id where t1.name <> ? and not case when t1.id is null then false else (t1.active = ?) is true end', mariadb: 'select t0.id, t0.label, t0.owner_id, not t0.tags is null, t0.tags, not t0.scores is null, t0.scores, not t0.prices is null, t0.prices, not t0.flags is null, t0.flags, not t0.parcels is null, t0.parcels, not t0.meta is null, t0.meta from basket t0 left join basket_owner t1 on t1.id = t0.owner_id where t1.name <> ? and not case when t1.id is null then false else (t1.active = ?) is true end'}
    binds: [Cy, true]
  graph:
    Basket:
    - id: 3
      label: three
      ownerId: 2
      tags: [gift]
      scores: [15]
      prices: ['2.00', '3.00']
      flags: [false]
      parcels:
      - sku: c
        qty: 5
        notes: [urgent]
      meta:
        labels: []
  roundTrips: 1
