# Streamed delivery (m-execution-lifecycle): a Snapshot Stream is a Root
# Execution of its own, and each page it reads is a Stream Batch under it.
model: models/orders.yaml
tags: [m-execution-lifecycle, m-snapshot-read, m-deep-fetch, stream, streamed-delivery, to-many, relationship, graph, slice-snapshot-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "a streamed read's keyset seek - page 2's root statement binds the primary key of the root page 1 delivered last, and each page's item level binds the order ids that page's own roots gathered"
when:
  objectQuery:
    target: parallax.compatibility.Order
    predicate:
      in:
        attr: parallax.compatibility.Order.id
        values:
          - 1
          - 2
          - 3
    includes:
      - segments:
          - rel: parallax.compatibility.Order.items
  stream:
    batchSize: 2
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.id parallax_seek_0 from orders t0 where t0.id in (?, ?, ?) order by t0.id asc limit ?
        mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.id parallax_seek_0 from orders t0 where t0.id in (?, ?, ?) order by t0.id asc limit ?
      binds: [1, 2, 3, 3]
    - sql:
        postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id = any(?) order by t0.id desc
        mariadb: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id in (?, ?) order by t0.id desc
      binds: { postgres: [[1, 2]], mariadb: [1, 2] }
    - sql:
        postgres: select u.id, u.name, u.sku, u.qty, u.price, u.active, u.ordered_on, u.parallax_seek_0 from ((select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.id parallax_seek_0 from orders t0 where t0.id in (?, ?, ?) and t0.id >= ? and (t0.id > ? or t0.id is null) order by t0.id asc limit ?) union all (select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.id parallax_seek_0 from orders t0 where t0.id in (?, ?, ?) and t0.id is null order by t0.id asc limit ?)) u order by u.parallax_seek_0 asc limit ?
        mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.id parallax_seek_0 from orders t0 where t0.id in (?, ?, ?) and t0.id >= ? and t0.id > ? order by t0.id asc limit ?
      binds:
        postgres: [1, 2, 3, 2, 2, 3, 1, 2, 3, 3, 3]
        mariadb: [1, 2, 3, 2, 2, 3]
    - sql:
        postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id = any(?) order by t0.id desc
        mariadb: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id in (?) order by t0.id desc
      binds: { postgres: [[3]], mariadb: [3] }
  referenceSql: select id, name, sku, qty, price, active, ordered_on from orders where id in (1, 2, 3)
  graph:
    Order:
      - id: 1
        name: Ada
        sku: A-100
        qty: 5
        price: "10.50"
        active: true
        orderedOn: 2024-01-05
        items:
          - { id: 12, orderId: 1, sku: B-200, quantity: 1, shippedOn: 2024-02-15 }
          - { id: 11, orderId: 1, sku: A-100, quantity: 2, shippedOn: null }
      - id: 2
        name: Linus
        sku: B-200
        qty: 10
        price: "20.00"
        active: true
        orderedOn: 2024-02-10
        items:
          - { id: 21, orderId: 2, sku: A-300, quantity: 4, shippedOn: 2024-02-20 }
      - id: 3
        name: ada
        sku: A-300
        qty: 15
        price: "30.25"
        active: false
        orderedOn: 2024-03-15
        items: []
  roundTrips: 4
  executionLifecycle:
    roots:
      - execution: 1
        kind: snapshot-stream
        events:
          - sequence: 1
            activity: 1
            parent: null
            snapshotStreamStarted:
              target: parallax.compatibility.Order
              interface: wire
              batchSize: 2
              edition: orders
          - sequence: 2
            activity: 2
            parent: 1
            streamBatchStarted: {}
          - sequence: 3
            activity: 3
            parent: 2
            acquisitionStarted: {}
          - sequence: 4
            activity: 3
            parent: 2
            acquisitionFinished: { outcome: acquired }
          - sequence: 5
            activity: 4
            parent: 2
            databaseCallStarted:
              target: parallax.compatibility.Order
              kind: read
              statement: 0
          - sequence: 6
            activity: 4
            parent: 2
            databaseCallFinished: { outcome: readCompleted, returnedRows: 3 }
          - sequence: 7
            activity: 5
            parent: 2
            databaseCallStarted:
              target: parallax.compatibility.OrderItem
              kind: read
              statement: 1
          - sequence: 8
            activity: 5
            parent: 2
            databaseCallFinished: { outcome: readCompleted, returnedRows: 3 }
          - sequence: 9
            activity: 6
            parent: 2
            releaseStarted: {}
          - sequence: 10
            activity: 6
            parent: 2
            releaseFinished: { cleanup: returned }
          - sequence: 11
            activity: 2
            parent: 1
            streamBatchFinished: { outcome: completed }
          - sequence: 12
            activity: 7
            parent: 1
            streamBatchStarted: {}
          - sequence: 13
            activity: 8
            parent: 7
            acquisitionStarted: {}
          - sequence: 14
            activity: 8
            parent: 7
            acquisitionFinished: { outcome: acquired }
          - sequence: 15
            activity: 9
            parent: 7
            databaseCallStarted:
              target: parallax.compatibility.Order
              kind: read
              statement: 2
          - sequence: 16
            activity: 9
            parent: 7
            databaseCallFinished: { outcome: readCompleted, returnedRows: 1 }
          - sequence: 17
            activity: 10
            parent: 7
            databaseCallStarted:
              target: parallax.compatibility.OrderItem
              kind: read
              statement: 3
          - sequence: 18
            activity: 10
            parent: 7
            databaseCallFinished: { outcome: readCompleted, returnedRows: 0 }
          - sequence: 19
            activity: 11
            parent: 7
            releaseStarted: {}
          - sequence: 20
            activity: 11
            parent: 7
            releaseFinished: { cleanup: returned }
          - sequence: 21
            activity: 7
            parent: 1
            streamBatchFinished: { outcome: completed }
          - sequence: 22
            activity: 1
            parent: null
            snapshotStreamFinished: { outcome: exhausted }
