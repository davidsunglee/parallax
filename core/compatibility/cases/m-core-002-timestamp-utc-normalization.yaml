# Timestamp UTC preservation at the boundary (m-core timezone rule).
#
# m-wire requires a canonical UTC instant before this write reaches m-core. This
# inserts that instant and asserts both dialects preserve it through timestamp
# storage. Postgres uses timestamptz; the MariaDB seam converts to and from its
# naive-UTC datetime(6) representation.
model: models/event.yaml
tags: [m-core, m-sql, m-dialect, timestamp, timezone, utc, write-sequence, slice-snapshot-1, slice-managed-1]
shape: writeSequence
when:
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.Event
      statements: 1
      note: insert a canonical UTC instant and preserve it through storage
      rows:
        - { id: 1, occurredAt: "2024-03-01T00:00:00.000000Z" }
then:
  statements:
    - sql:
        postgres: insert into event(id, occurred_at) values (?, ?)
        mariadb: insert into event(id, occurred_at) values (?, ?)
      binds: [1, "2024-03-01T00:00:00.000000Z"]
  tableState:
    event:
      - { id: 1, occurred_at: "2024-03-01T00:00:00.000000Z" }
  roundTrips: 1
