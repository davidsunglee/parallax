# BOTH keyed write families refuse a value produced by a read through some OTHER
# framework-managed source (m-unit-work *Write value provenance*): a value's
# stored counterpart is only the one the writing source itself produced, so no
# verb may treat another source's value as its own — the same store or not. The
# refusal is `write-value-foreign-lifecycle` for the `insert` family and for the
# `update` family alike, which is what makes the three-way partition total: every
# value a keyed verb can be handed falls under exactly one of the three answers.
model: models/account.yaml
lane: api-conformance
tags: [m-unit-work, write-value, provenance, scenario, slice-snapshot-1]
shape: scenario
when:
  scenario:
    - action: insert
      value: anotherSource
      roundTrips: 0
      expectError: write-value-foreign-lifecycle
      note: the insert family refuses another managed source's value
    - action: update
      value: anotherSource
      roundTrips: 0
      expectError: write-value-foreign-lifecycle
      note: and so does the update family — neither writes a value it did not produce
then:
  roundTrips: 0
