# Reading one key at two as-of coordinates leaves TWO independently pinned views, and
# whether a view may be mutated is decided by that view's OWN pin rather than by the
# transaction's most recent read of the primary key the two share. The finite-pin
# mutation contrast is what decides it, and only a Bitemporal shape can pose both of its
# halves at once: a finite Valid-Time pin is the writable retroactive correction
# (m-temporal-read's finite-pin mutation row) and a finite Transaction-Time pin is
# read-only because the Transaction-Time past is never rewritten (m-txtime-write "The
# Transaction-Time past is never rewritten", whose subject is a VIEW pinned at that
# instant, on every surface that authors these writes). Both halves take a view as their
# subject; this case is what pins the subject down.
#
# Both steps read Position id 1. Step 0 pins it at the finite Valid-Time instant
# 2024-03-01 with Transaction Time defaulted Latest, materializing the rectangle-split
# head (value 100) — a WRITABLE view. Step 1 pins the SAME primary key at the finite
# Transaction-Time instant 2024-02-01, materializing the superseded belief (value 90) —
# a READ-ONLY view. The two coordinates resolve to two DIFFERENT milestones of one key.
#
# The mutation verb then answers per view, in both directions: step 2 mutates the view
# step 0 produced and is ACCEPTED, and step 3 mutates the view step 1 produced and
# raises `transaction-time-pin-read-only`.
#
# That is the semantic distinction, and it is what m-bitemp-write-015 and -016 cannot
# state: each of those holds ONE view of one key, so its transaction's most recent pin
# and that view's own pin are the same pin, and each stays consistent with an
# implementation carrying a single pin per primary key or per transaction. Here both
# views are live at once and their pins disagree, so such an implementation answers
# wrongly in one direction or the other — the second read demotes the first view, or the
# first licenses the second. Substituting the transaction's most recent pin for the
# view's own therefore fails this case while -015 and -016 both still pass, whereas
# breaking the finite-pin contrast itself fails all three.
#
# What this case does NOT grade, so that no reader takes it for more:
#
# - NOT anything m-snapshot-read owns beyond supplying the views. The case observes pins
#   and mutability and has no identity observable, so an implementation that materializes
#   one node for both reads while keeping a pin per view passes, and graph-local identity
#   resolution is untouched. It navigates no relationship either, so the whole-graph pin
#   has nothing to propagate here and an implementation that propagated nothing per hop
#   would still answer this case correctly. m-identity-map
#   states the per-view rule for the MANAGED lifecycle, where the views are interned
#   objects rather than graphs — that slice's own witnesses are m-identity-map-010 /
#   -011, and this case makes no claim about them.
# - NOT write-observation keying. A `mutate` step is an in-memory change over a
#   snapshot-read view that emits no DML at all (roundTrips 0, as every mutate step in
#   the corpus does) and enrolls the view in no unit of work. No write evidence is
#   recorded and none is consumed, so an implementation keying the observations its reads
#   record by identity alone is indistinguishable here: nothing observes how they are
#   keyed, nor which row a later flush would close. The wire-lane pair
#   m-bitemp-write-021 / -022
#   grades that a close's address is derived from the milestone its write observed; no
#   case in the corpus grades the keying itself.
model: models/position.yaml
lane: api-conformance
tags: [m-bitemp-write, m-temporal-read, bitemporal, temporal, as-of, scenario, slice-snapshot-1]
shape: scenario
when:
  scenario:
    - targetEntity: Position
      find:
        asOf:
          operand:
            eq:
              attr: Position.id
              value: 1
          dimension: valid-time
          coordinate: "2024-03-01T00:00:00+00:00"
      roundTrips: 1
      note: pin id 1 at the finite Valid-Time instant 2024-03-01 (Transaction Time defaulted Latest) — the rectangle-split head (100.00), a WRITABLE view
      statements:
        - sql:
            postgres: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? and t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?
          binds: [1, "2024-03-01T00:00:00+00:00", "2024-03-01T00:00:00+00:00", infinity]
      expectRows:
        - { pos_id: 1, acct_num: A, val: 100.00, from_z: "2024-01-01T00:00:00+00:00", thru_z: "2024-06-01T00:00:00+00:00", in_z: "2024-04-01T00:00:00+00:00", out_z: infinity }
    - targetEntity: Position
      find:
        asOf:
          operand:
            eq:
              attr: Position.id
              value: 1
          dimension: transaction-time
          coordinate: "2024-02-01T00:00:00+00:00"
      roundTrips: 1
      note: pin the SAME primary key at the finite Transaction-Time instant 2024-02-01 — the superseded belief (90.00), a DIFFERENT milestone and a READ-ONLY view
      statements:
        - sql:
            postgres: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? and t0.thru_z = ? and t0.in_z <= ? and t0.out_z > ?
          binds: [1, infinity, "2024-02-01T00:00:00+00:00", "2024-02-01T00:00:00+00:00"]
      expectRows:
        - { pos_id: 1, acct_num: A, val: 90.00, from_z: "2024-01-01T00:00:00+00:00", thru_z: infinity, in_z: "2024-01-01T00:00:00+00:00", out_z: "2024-04-01T00:00:00+00:00" }
    - action: mutate
      "on": 0
      set:
        value: 250.00
      roundTrips: 0
      note: the Valid-Time-pinned view stays WRITABLE — step 1's read of the same primary key observed another milestone and took nothing away from this one
    - action: mutate
      "on": 1
      set:
        value: 999.00
      roundTrips: 0
      expectError: transaction-time-pin-read-only
      note: the Transaction-Time-pinned view stays READ-ONLY — step 0's read of the same primary key licensed nothing here either
then:
  roundTrips: 2
