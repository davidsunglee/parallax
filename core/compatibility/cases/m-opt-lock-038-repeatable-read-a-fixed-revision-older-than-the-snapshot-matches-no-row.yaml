# The peer's change commits before this transaction takes its snapshot, so at
# Repeatable Read the fixed-revision update stating version 1 sees version 2 and
# matches no row: a failed precondition, which the snapshot neither hides nor raises.
model: models/account.yaml
tags: [m-opt-lock, m-unit-work, isolation, concurrency, target-write, repeatable-read, slice-snapshot-1]
shape: concurrencySuccess
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "two-session isolation witness (when.concurrency)"
given:
  fixtures: true
when:
  uow:
    concurrency: optimistic
    isolation: repeatable-read
  concurrency:
    rounds:
      - B:
          kind: write
          statements:
            - sql:
                postgres: update account set balance = ?, version = ? where id = ? and version = ?
                mariadb: update account set balance = ?, version = ? where id = ? and version = ?
              binds: ["999.00", 2, 2, 1]
          affectedRows: [1]
      - B:
          kind: commit
      - A:
          kind: write
          statements:
            - sql:
                postgres: update account set balance = ?, version = ? where id = ? and version = ?
                mariadb: update account set balance = ?, version = ? where id = ? and version = ?
              binds: ["300.00", 2, 2, 1]
          affectedRows: [0]
then:
  tableState:
    account:
      - { id: 1, owner: Ada, balance: "100.00", version: 1 }
      - { id: 2, owner: Linus, balance: "999.00", version: 2 }
      - { id: 3, owner: Grace, balance: "10.00", version: 1 }
