# Withdrawing a write and narrowing a domain on a position that denotes no stored
# shape (m-model-evolution): both unilateral.
tags: [m-model-evolution, m-schema-delta, evolution, inheritance, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-rowless-member-v1.yaml
    later: models/evolution-rowless-member-v2.yaml
then:
  evolution:
    kind: unilateral
    operations:
      - kind: AttributeAltered
        attribute: parallax.compatibility.Provisional.clerk
        deltas: [{ kind: ReadOnlyChanged, earlier: false, later: true }]
      - kind: AttributeAltered
        attribute: parallax.compatibility.Provisional.memo
        deltas: [{ kind: NullabilityChanged, earlier: true, later: false }]
    behavioralImpacts:
      - kind: ValueAdmissibilityChanged
        scope: { attribute: parallax.compatibility.Provisional.memo }
        earlier: { type: string, nullable: true, maxLength: 64 }
        later: { type: string, nullable: false, maxLength: 64 }
        causedBy:
          - kind: AttributeAltered
            attribute: parallax.compatibility.Provisional.memo
            deltas: [{ kind: NullabilityChanged, earlier: true, later: false }]
      - kind: WriteCapabilityChanged
        scope: { attribute: parallax.compatibility.Provisional.clerk }
        earlier: CallerInsertAndUpdate
        later: CallerInsertOnly
        causedBy:
          - kind: AttributeAltered
            attribute: parallax.compatibility.Provisional.clerk
            deltas: [{ kind: ReadOnlyChanged, earlier: false, later: true }]
    overlapVisibleOperations: []
    coordinationRequirements: []
  schema:
    postgres:
      delta:
        statements: []
        createdIndices: []
    mariadb:
      delta:
        statements: []
        createdIndices: []
