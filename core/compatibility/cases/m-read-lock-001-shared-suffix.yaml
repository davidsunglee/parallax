# Read-lock case (m-read-lock): an in-transaction read acquires a shared row lock.
#
# A read performed inside a unit of work that intends to write is made correct
# automatically — the caller writes no locking SQL. An in-transaction read
# governed by the Locking Effective Concurrency Strategy, which this case's
# declared `locking` preference imposes on the versioned Account, appends the
# dialect's shared-row-lock suffix (m-read-lock / m-dialect). For Postgres that
# is `for share of t0`, qualified by the root alias and appended AFTER every other
# clause.
#
# The lock itself is a concurrency property; a single-connection harness proves the
# observable half — the locking read is WELL-FORMED and RESULT-CORRECT. The golden
# SQL is a normal `eq` read with the lock suffix; it executes against real Postgres
# and returns the expected row, cross-checked by an independent naive oracle (the
# same select WITHOUT the lock, which must return the same rows because the lock
# does not change the result).
#
# `for share of t0` is fully lowercase — the canonical fixed point of the m-sql
# normalizer, which lowercases the lock-clause keywords like any other keyword
# even though sqlglot tokenizes them as values, so the golden SQL passes the
# layer-3 canonical-form check.
model: models/account.yaml
tags: [m-read-lock, m-dialect, slice-snapshot-1, slice-managed-1]
shape: read
when:
  uow:
    concurrency: locking
  objectQuery:
    target: parallax.compatibility.Account
    predicate:
      eq:
        attr: parallax.compatibility.Account.id
        value: 2
then:
  statements:
    - sql:
        postgres: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.id = ? for share of t0
      binds: [2]
  referenceSql: select id, owner, balance, version from account where id = 2
  rows:
    - { id: 2, owner: Linus, balance: "250.00", version: 1 }
  roundTrips: 1
