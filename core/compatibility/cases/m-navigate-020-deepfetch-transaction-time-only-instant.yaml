# Deep fetch Invoice.lines as of Transaction Time INSTANT 2024-02-01. Single-axis range
# propagation: the child carries `in_z <= ? and out_z > ?` (binds T, T). At that
# instant line 1000 is the SUPERSEDED 50 (L-R1), line 1001 -> 25 — distinct from
# m-navigate-019, proving the propagated instant selects the milestone whose interval
# contains it.
model: models/invoice.yaml
tags: [m-navigate, m-object-query, m-temporal-read, temporal, relationship, propagation, audit-only, slice-snapshot-1, slice-managed-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "deep-fetch child level - the Invoice.lines IN-list binds are the distinct invoice ids gathered from the root query result, so the child emissions depend on a query result"
when:
  objectQuery:
    target: parallax.compatibility.Invoice
    predicate:
      all: {}
    temporal:
      transaction-time:
        asOf: "2024-02-01T00:00:00.000000Z"
    includes:
      - segments:
          - rel: parallax.compatibility.Invoice.lines
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name, t0.in_z, t0.out_z from invoice t0 where t0.in_z <= ? and t0.out_z > ?
        mariadb: select t0.id, t0.name, t0.in_z, t0.out_z from invoice t0 where t0.in_z <= ? and t0.out_z > ?
      binds: ["2024-02-01T00:00:00.000000Z", "2024-02-01T00:00:00.000000Z"]
    - sql:
        postgres: select t0.id, t0.invoice_id, t0.amount, t0.in_z, t0.out_z from invoice_line t0 where t0.invoice_id in (?) and t0.in_z <= ? and t0.out_z > ?
        mariadb: select t0.id, t0.invoice_id, t0.amount, t0.in_z, t0.out_z from invoice_line t0 where t0.invoice_id in (?) and t0.in_z <= ? and t0.out_z > ?
      binds: [100, "2024-02-01T00:00:00.000000Z", "2024-02-01T00:00:00.000000Z"]
  graph:
    Invoice:
      - id: 100
        name: INV-100
        txStart: "2024-01-01T00:00:00.000000Z"
        txEnd: infinity
        lines:
          - { id: 1000, invoiceId: 100, amount: "50.00", txStart: "2024-01-01T00:00:00.000000Z", txEnd: "2024-04-01T00:00:00.000000Z" }
          - { id: 1001, invoiceId: 100, amount: "25.00", txStart: "2024-01-01T00:00:00.000000Z", txEnd: infinity }
  roundTrips: 2
