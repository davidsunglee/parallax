# Rollback / abort scenario for INSERT (m-unit-work): an INSERT performed inside a
# unit of work that ABORTS is discarded — a post-abort find observes NO row.
model: models/account.yaml
tags: [m-unit-work, rollback, abort, scenario, slice-snapshot-1, slice-managed-1]
shape: scenario
when:
  scenario:
    - write:
        - mutation: insert
          entity: parallax.compatibility.Account
          rows:
            - { id: 7, owner: Newton, balance: "5.00", version: 1 }
      rollback: true
      roundTrips: 1
      note: apply an insert of a new account 7, then ROLL BACK — the insert is discarded
      statements:
        - sql:
            postgres: insert into account(id, owner, balance, version) values (?, ?, ?, ?)
          binds: [7, Newton, "5.00", 1]
    - objectQuery:
        target: parallax.compatibility.Account
        predicate:
          eq:
            attr: parallax.compatibility.Account.id
            value: 7
      roundTrips: 1
      note: the aborted insert never became durable — the find MUST observe NO rows
      statements:
        - sql:
            postgres: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.id = ?
          binds: [7]
      expectRows: []
then:
  roundTrips: 2
