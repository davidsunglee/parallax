# A POPULATED to-one relationship survives a PERSISTING WRITE (m-snapshot-read
# *Closed world*, composition): a materialized graph is a value taken at its pin,
# so a committed write that rewrites the very row a loaded to-one view holds
# neither refreshes that view nor invalidates it — accessing it still issues ZERO
# SQL and still answers the object the read produced. This is the clause "a write
# changes nothing about a graph already materialized", held on the to-one
# back-reference arm (OrderItem.order); m-snapshot-read-016 holds the to-many arm
# across a derived copy instead, and the two together are the populated half of
# the composition rule for both cardinalities.
model: models/orders.yaml
tags: [m-snapshot-read, m-deep-fetch, m-unit-work, closed-world, relationship, to-one, update, scenario, slice-snapshot-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "include level - the OrderItem.order parent IN-list binds are the distinct order keys gathered from step 0's own root read, so the child emission depends on a query result"
when:
  scenario:
    - objectQuery:
        target: parallax.compatibility.OrderItem
        predicate:
          eq:
            attr: parallax.compatibility.OrderItem.id
            value: 11
        includes:
          - segments:
              - rel: parallax.compatibility.OrderItem.order
      roundTrips: 2
      note: materialize a snapshot of line item 11 WITH its owning order (1 + L levels)
      statements:
        - sql:
            postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.id = ?
          binds: [11]
        - sql:
            postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.id = any(?)
          binds: [[1]]
      expectRows:
        - { id: 11, order_id: 1, sku: A-100, quantity: 2, shipped_on: null }
    - write:
        - mutation: update
          entity: parallax.compatibility.Order
          rows:
            - { id: 1, name: Rewritten }
      roundTrips: 2
      note: commit an update to the very row the loaded `order` view holds - one DML statement plus the resolving read the keyed update owes
      statements:
        - sql:
            postgres: update orders set name = ? where id = ?
          binds: [Rewritten, 1]
    - action: access
      "on": 0
      path: order
      roundTrips: 0
      sameObjectAs: 0
      note: access the ALREADY-MATERIALIZED order after the write -> ZERO SQL and the contents the read paid for
      expectGraph:
        Order:
          - { id: 1, name: Ada, sku: A-100, qty: 5, price: "10.50", active: true, orderedOn: 2024-01-05 }
then:
  roundTrips: 4
