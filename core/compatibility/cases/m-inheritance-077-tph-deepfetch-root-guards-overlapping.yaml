# Two OVERLAPPING path-root guards over one relationship stay two hops, and the
# shared roots are fetched twice (m-deep-fetch, m-inheritance).
#
# The two guards on `Animal.owner` are `to: [Dog, WildBoar]` and `to: [Cat, Dog]`:
# they share the Dog roots, yet neither contains the other, so this is the one
# guard relation that is neither equal, nor disjoint, nor containment. Hop identity
# keys on the resolved source set, and {Dog, WildBoar} != {Cat, Dog}, so the two
# stay distinct — `1 + L` = 3, with the first child keyed by the Dog and WildBoar
# roots' owner ids (10, 11, 12) and the second by the Cat and Dog roots' (10, 11).
# Rex and Fido, whom BOTH guards admit, therefore have their owner fetched twice.
# The semantic distinction the case pins down is that the overlap is idempotent
# and invisible in the object graph: both hops attach to the SAME ordinary `owner`
# view, so a doubly-admitted root carries exactly one owner and `then.graph` is
# indistinguishable from what one broad path produces. Only `roundTrips` observes
# the second hop, which is what leaves collapsing overlapping guards into one hop
# over the union of their sources a later statement-count-only change.
model: models/animal.yaml
tags: [m-deep-fetch, m-inheritance, m-op-algebra, m-sql, table-per-hierarchy, narrow, deep-fetch, familyVariant, slice-snapshot-1, slice-managed-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "deep-fetch child levels - each guarded owner hop binds its person-table IN-list from the owner ids gathered from its own guard's rows of the root query result, so the child emissions depend on a query result"
when:
  targetEntity: parallax.compatibility.Animal
  operation:
    deepFetch:
      operand:
        all: {}
      paths:
        - { narrow: { to: [parallax.compatibility.Dog, parallax.compatibility.WildBoar] }, segments: [{ rel: parallax.compatibility.Animal.owner }] }
        - { narrow: { to: [parallax.compatibility.Cat, parallax.compatibility.Dog] }, segments: [{ rel: parallax.compatibility.Animal.owner }] }
then:
  statements:
    - sql:
        postgres: select t0.id, t0.kind, t0.name, t0.owner_id, t0.license_id, t0.indoor, t0.bark_volume, t0.tusk_length from animal t0
    - sql:
        postgres: select t0.id, t0.name from person t0 where t0.id in (?, ?, ?)
      binds: [10, 11, 12]
    - sql:
        postgres: select t0.id, t0.name from person t0 where t0.id in (?, ?)
      binds: [10, 11]
  referenceSql: select id, kind, name, owner_id, license_id, indoor, bark_volume, tusk_length from animal
  graph:
    Animal:
      - id: 1
        name: Rex
        owner_id: 10
        license_id: L-100
        bark_volume: 7
        indoor: null
        tusk_length: null
        familyVariant: Dog
        owner: { id: 10, name: Alice }
      - id: 2
        name: Fido
        owner_id: 11
        license_id: L-101
        bark_volume: 3
        indoor: null
        tusk_length: null
        familyVariant: Dog
        owner: { id: 11, name: Bob }
      - id: 3
        name: Whiskers
        owner_id: 10
        license_id: L-200
        bark_volume: null
        indoor: true
        tusk_length: null
        familyVariant: Cat
        owner: { id: 10, name: Alice }
      - id: 4
        name: Tusker
        owner_id: 12
        license_id: null
        bark_volume: null
        indoor: null
        tusk_length: 12.50
        familyVariant: WildBoar
        owner: { id: 12, name: Carol }
  roundTrips: 3
