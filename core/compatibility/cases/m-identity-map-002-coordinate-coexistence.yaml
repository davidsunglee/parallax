# Coordinate coexistence (m-identity-map): the identity key of a temporal entity
# includes its lowered as-of coordinates, so two pins of ONE primary key coexist
# within one unit of work as DISTINCT pinned views.
model: models/balance.yaml
tags: [m-identity-map, m-temporal-read, identity, as-of, temporal, audit-only, scenario, slice-managed-1]
shape: scenario
when:
  uow:
    concurrency: optimistic
  scenario:
    - objectQuery:
        target: parallax.compatibility.Balance
        predicate:
          eq:
            attr: parallax.compatibility.Balance.id
            value: 1
        temporal:
          transaction-time:
            asOf: latest
      roundTrips: 1
      note: explicit latest pin (current-row predicate)
      statements:
        - sql:
            postgres: select t0.bal_id, t0.acct_num, t0.val, t0.in_z, t0.out_z from balance t0 where t0.bal_id = ? and t0.out_z = ?
          binds: [1, infinity]
      expectRows:
        - { bal_id: 1, acct_num: A, val: "150.00", in_z: "2024-06-01T00:00:00.000000Z", out_z: infinity }
    - objectQuery:
        target: parallax.compatibility.Balance
        predicate:
          eq:
            attr: parallax.compatibility.Balance.id
            value: 1
        temporal:
          transaction-time:
            asOf: "2024-04-01T00:00:00.000000Z"
      roundTrips: 1
      note: finite past pin — a DISTINCT pinned view of the same primary key (the superseded milestone)
      statements:
        - sql:
            postgres: select t0.bal_id, t0.acct_num, t0.val, t0.in_z, t0.out_z from balance t0 where t0.bal_id = ? and t0.in_z <= ? and t0.out_z > ?
          binds: [1, "2024-04-01T00:00:00.000000Z", "2024-04-01T00:00:00.000000Z"]
      expectRows:
        - { bal_id: 1, acct_num: A, val: "100.00", in_z: "2024-01-01T00:00:00.000000Z", out_z: "2024-06-01T00:00:00.000000Z" }
    - objectQuery:
        target: parallax.compatibility.Balance
        predicate:
          eq:
            attr: parallax.compatibility.Balance.id
            value: 1
        temporal:
          transaction-time:
            asOf: latest
      roundTrips: 1
      sameObjectAs: 0
      identityAttr: bal_id
      note: latest pin again — same lowered coordinate, the SAME managed view as step 0
      statements:
        - sql:
            postgres: select t0.bal_id, t0.acct_num, t0.val, t0.in_z, t0.out_z from balance t0 where t0.bal_id = ? and t0.out_z = ?
          binds: [1, infinity]
      expectRows:
        - { bal_id: 1, acct_num: A, val: "150.00", in_z: "2024-06-01T00:00:00.000000Z", out_z: infinity }
then:
  roundTrips: 3
