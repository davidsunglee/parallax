# and — n-ary conjunction of THREE operands (m-predicate §Boolean combinators).
#
# m-predicate-020 proves the two-operand junction; this pins the n-ary (>= 3) form: the
# operands serialize in order and the binds follow left-to-right appearance, so
# the conjunction renders as `a = ? and b > ? and c < ?` with binds in that
# order. active=true AND qty>5 AND qty<30 keeps orders 2 (qty 10) and 4 (qty 20);
# order 42 (qty 30) fails qty<30 and the inactive rows fail active=true.
model: models/orders.yaml
tags: [m-predicate, and, boolean, n-ary, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Order
    predicate:
      and:
        operands:
          - eq:
              attr: parallax.compatibility.Order.active
              value: true
          - greaterThan:
              attr: parallax.compatibility.Order.qty
              value: 5
          - lessThan:
              attr: parallax.compatibility.Order.qty
              value: 30
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.active = ? and t0.qty > ? and t0.qty < ?
      binds: [true, 5, 30]
  referenceSql: select id, name, sku, qty, price, active, ordered_on from orders where active = true and qty > 5 and qty < 30
  rows:
    - { id: 2, name: Linus, sku: B-200, qty: 10, price: 20.00, active: true, ordered_on: 2024-02-10 }
    - { id: 4, name: Margaret, sku: null, qty: 20, price: 40.00, active: true, ordered_on: 2024-04-20 }
  roundTrips: 1
