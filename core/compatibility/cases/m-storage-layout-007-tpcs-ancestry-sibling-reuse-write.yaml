# Table-per-concrete-subtype ancestry composition and legal sibling Column reuse
# (m-storage-layout).
model: models/storage-layout.yaml
tags: [m-storage-layout, m-inheritance, m-sql, table-per-concrete-subtype, write-sequence, slice-snapshot-1, slice-managed-1]
shape: writeSequence
when:
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.LayoutAudit
      statements: 1
      note: insert into the audit table; ancestry chain then the reused detail column
      rows:
        - { id: 1, title: Quarterly audit, auditor: Ingrid }
    - mutation: insert
      entity: parallax.compatibility.LayoutSurvey
      statements: 1
      note: insert into the sibling survey table, which reuses the same column spelling
      rows:
        - { id: 1, title: Annual survey, respondent: Bjorn }
then:
  statements:
    - sql:
        postgres: insert into layout_audit(id, title, detail) values (?, ?, ?)
      binds: [1, Quarterly audit, Ingrid]
    - sql:
        postgres: insert into layout_survey(id, title, detail) values (?, ?, ?)
      binds: [1, Annual survey, Bjorn]
  tableState:
    layout_audit:
      - { id: 1, title: Quarterly audit, detail: Ingrid }
    layout_survey:
      - { id: 1, title: Annual survey, detail: Bjorn }
  roundTrips: 2
