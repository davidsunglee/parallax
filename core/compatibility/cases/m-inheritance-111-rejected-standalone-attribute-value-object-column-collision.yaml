# A standalone Entity maps a scalar Attribute and a top-level Value Object to
# the same physical column even though their canonical rendered names differ.
# Model Formation must reject the duplicate storage contributors before SQL;
# neither ingestion nor materialization may choose which declaration owns the
# raw row key.
model: models/member-column-defaults.yaml
tags: [m-inheritance, m-model-formation, m-value-object, m-descriptor, rejected, negative, physical-column, standalone, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  model:
    entity:
      name: Contact
      table: contact
      attributes:
        - { name: id, type: int64, primaryKey: true }
        - { name: profileText, type: string, column: profile }
      valueObjects:
        - name: profileDocument
          column: profile
          attributes:
            - { name: label, type: string }
then:
  rejectedRule: inheritance-physical-column-collision
