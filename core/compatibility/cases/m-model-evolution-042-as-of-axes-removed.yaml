# Removing every AS-OF AXIS from an Entity (m-model-evolution): coordinated for
# BOTH reasons, on every operation.
#
# Removal invalidates every previously valid temporal operation, and unlike a
# removal that takes its stored shape with it, this one leaves the shape behind:
# the `Gauge` Table survives, its four endpoint Columns still demand values the
# later model no longer describes, and the axis end Attributes leaving the
# derived physical key make the later logical identity NARROWER than the one the
# surviving history was written under, so that history collides beneath it. A
# Temporal Dimension participates in axis identity, so the two axes are removed
# independently rather than altered.
tags: [m-model-evolution, evolution, temporal, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-bitemporality-v2.yaml
    later: models/evolution-bitemporality-v1.yaml
then:
  evolution:
    kind: coordinated
    operations:
      - kind: AttributeRemoved
        attribute: parallax.compatibility.Gauge.txEnd
      - kind: AttributeRemoved
        attribute: parallax.compatibility.Gauge.txStart
      - kind: AttributeRemoved
        attribute: parallax.compatibility.Gauge.validEnd
      - kind: AttributeRemoved
        attribute: parallax.compatibility.Gauge.validStart
      - kind: AsOfAxisRemoved
        entity: parallax.compatibility.Gauge
        dimension: valid-time
      - kind: AsOfAxisRemoved
        entity: parallax.compatibility.Gauge
        dimension: transaction-time
    behavioralImpacts:
      - kind: ConcurrencyControlChanged
        scope:
          entity: parallax.compatibility.Gauge
        earlier:
          gate: TransactionTimeGated
          startAttribute: parallax.compatibility.Gauge.txStart
        later:
          gate: LockingFallback
        causedBy:
          - kind: AsOfAxisRemoved
            entity: parallax.compatibility.Gauge
            dimension: transaction-time
      - kind: QueryResultMembershipChanged
        scope:
          entity: parallax.compatibility.Gauge
        earlier:
          concreteEntities:
            - parallax.compatibility.Gauge
          axes:
            - dimension: valid-time
              startAttribute: parallax.compatibility.Gauge.validStart
              endAttribute: parallax.compatibility.Gauge.validEnd
            - dimension: transaction-time
              startAttribute: parallax.compatibility.Gauge.txStart
              endAttribute: parallax.compatibility.Gauge.txEnd
        later:
          concreteEntities:
            - parallax.compatibility.Gauge
          axes: []
        causedBy:
          - kind: AsOfAxisRemoved
            entity: parallax.compatibility.Gauge
            dimension: valid-time
          - kind: AsOfAxisRemoved
            entity: parallax.compatibility.Gauge
            dimension: transaction-time
      - kind: WriteCapabilityChanged
        scope:
          entity: parallax.compatibility.Gauge
        earlier:
          writes: Enabled
          shape: Bitemporal
        later:
          writes: Enabled
          shape: NonTemporal
        causedBy:
          - kind: AsOfAxisRemoved
            entity: parallax.compatibility.Gauge
            dimension: valid-time
          - kind: AsOfAxisRemoved
            entity: parallax.compatibility.Gauge
            dimension: transaction-time
    overlapVisibleOperations: []
    coordinationRequirements:
      - operation:
          kind: AttributeRemoved
          attribute: parallax.compatibility.Gauge.txEnd
        reasons:
          - AuthoringSurfaceChangeRequired
          - DatabaseMigrationRequired
      - operation:
          kind: AttributeRemoved
          attribute: parallax.compatibility.Gauge.txStart
        reasons:
          - AuthoringSurfaceChangeRequired
          - DatabaseMigrationRequired
      - operation:
          kind: AttributeRemoved
          attribute: parallax.compatibility.Gauge.validEnd
        reasons:
          - AuthoringSurfaceChangeRequired
          - DatabaseMigrationRequired
      - operation:
          kind: AttributeRemoved
          attribute: parallax.compatibility.Gauge.validStart
        reasons:
          - AuthoringSurfaceChangeRequired
          - DatabaseMigrationRequired
      - operation:
          kind: AsOfAxisRemoved
          entity: parallax.compatibility.Gauge
          dimension: valid-time
        reasons:
          - AuthoringSurfaceChangeRequired
          - DatabaseMigrationRequired
      - operation:
          kind: AsOfAxisRemoved
          entity: parallax.compatibility.Gauge
          dimension: transaction-time
        reasons:
          - AuthoringSurfaceChangeRequired
          - DatabaseMigrationRequired
