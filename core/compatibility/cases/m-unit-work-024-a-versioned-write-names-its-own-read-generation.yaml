# A unit of work that reads one versioned key twice keeps BOTH readings as
# evidence, and a write settles against the generation the read it names observed
# (m-unit-work "The ledger admits multiple observed states for one Entity and
# primary key"; m-case-format *Settling against a grouped find*).
#
# The versioned Non-Temporal counterpart of m-unit-work-015, which grades the same
# keying over a Bitemporal key's two current rectangles. Account 1 holds one ROW,
# but this group holds one observed GENERATION of it per read: the observing find
# sees version 1, a write advances it to version 2, and the dependent find sees
# version 2. Each write then names the read its value came from, and its gate binds
# THAT reading's version — an implementation filing evidence under identity alone
# holds one slot, so the second read would erase the first and both writes would
# gate on whichever reading ran last.
#   step 0 find  : observe account 1 (Ada, 100.00, version 1), 1 round trip.
#   step 1 write : `balance = 125.00`, naming step 0 — gated on version 1, advancing
#                  to 2. The buffered intent is still pending when step 2 runs.
#   step 2 find  : the dependent read force-flushes that intent and then observes
#                  the FRESH state (125.00, version 2), 1 round trip beyond the
#                  write's own.
#   step 3 write : `balance = 175.00`, naming step 2 — gated on version 2, advancing
#                  to 3. Naming step 0 here would gate on version 1, which the row no
#                  longer stands at, and the write would affect zero rows.
# The two writes are two intents against two different observed states, so nothing
# coalesces: the flush emits both statements, in authored order. The case is
# `run-only` (query-result-dependent): every version bind is the framework-owned
# advance of a version a query returned.
model: models/account.yaml
tags: [m-unit-work, m-opt-lock, m-sql, observed-state, scenario, slice-snapshot-1, slice-managed-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "each write's gate binds the observed version the find it names returned — a query result (m-opt-lock)"
when:
  scenario:
    - uow: two-generations
      objectQuery:
        target: parallax.compatibility.Account
        predicate:
          eq:
            attr: parallax.compatibility.Account.id
            value: 1
      roundTrips: 1
      note: observe generation one — account 1 at balance 100.00, version 1
      statements:
        - sql:
            postgres: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.id = ?
          binds: [1]
      expectRows:
        - { id: 1, owner: Ada, balance: 100.00, version: 1 }
    - uow: two-generations
      "on": 0
      write:
        - mutation: update
          entity: parallax.compatibility.Account
          rows:
            - { id: 1, balance: 125.00 }
      roundTrips: 1
      note: settle against generation one — the gate binds version 1 and the advance writes 2
      statements:
        - sql:
            postgres: update account set balance = ?, version = ? where id = ? and version = ?
          binds: [125.00, 2, 1, 1]
    - uow: two-generations
      objectQuery:
        target: parallax.compatibility.Account
        predicate:
          eq:
            attr: parallax.compatibility.Account.id
            value: 1
      roundTrips: 1
      note: the dependent read force-flushes the pending intent and observes generation two (125.00, version 2)
      statements:
        - sql:
            postgres: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.id = ?
          binds: [1]
      expectRows:
        - { id: 1, owner: Ada, balance: 125.00, version: 2 }
    - uow: two-generations
      "on": 2
      write:
        - mutation: update
          entity: parallax.compatibility.Account
          rows:
            - { id: 1, balance: 175.00 }
      roundTrips: 1
      note: settle against generation TWO — the gate binds version 2; naming step 0 would gate on a version the row has left
      statements:
        - sql:
            postgres: update account set balance = ?, version = ? where id = ? and version = ?
          binds: [175.00, 3, 1, 2]
then:
  roundTrips: 4
