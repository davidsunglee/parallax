# Bitemporal as-of NOW on BOTH axes: the fully-Latest milestone.
model: models/position.yaml
tags: [m-temporal-read, m-object-query, m-sql, bitemporal, temporal, as-of, both-axes, defaulted, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Position
    predicate:
      all: {}
    temporal:
      transaction-time:
        asOf: latest
      valid-time:
        asOf: latest
then:
  statements:
    - sql:
        postgres: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.thru_z = ? and t0.out_z = ?
      binds: [infinity, infinity]
  referenceSql: select pos_id, acct_num, val, from_z, thru_z, in_z, out_z from position where thru_z = 'infinity'::timestamptz and out_z = 'infinity'::timestamptz
  rows:
    - { pos_id: 1, acct_num: A, val: "200.00", from_z: "2024-06-01T00:00:00.000000Z", thru_z: infinity, in_z: "2024-04-01T00:00:00.000000Z", out_z: infinity }
  roundTrips: 1
