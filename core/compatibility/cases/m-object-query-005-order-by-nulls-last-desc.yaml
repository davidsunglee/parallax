# orderBy DESCENDING with an explicit `nulls: last` placement over a NULLABLE key,
# proven on BOTH dialects (m-object-query orderBy + m-dialect NULL ordering).
model: models/orders.yaml
tags: [m-object-query, m-predicate, m-dialect, orderBy, ordering, nulls, nullable, limit, directive, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Order
    predicate:
      all: {}
    orderBy:
      - attr: parallax.compatibility.Order.sku
        direction: desc
        nulls: last
    limit: 2
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 order by t0.sku desc nulls last limit ?
        mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 order by t0.sku desc limit ?
      binds: [2]
  referenceSql: select id, name, sku, qty, price, active, ordered_on from orders order by case when sku is null then 1 else 0 end, sku desc limit 2
  rows:
    - { id: 5, name: Alan, sku: "C_50%", qty: 25, price: "50.75", active: false, ordered_on: 2024-05-25 }
    - { id: 2, name: Linus, sku: B-200, qty: 10, price: "20.00", active: true, ordered_on: 2024-02-10 }
  roundTrips: 1
