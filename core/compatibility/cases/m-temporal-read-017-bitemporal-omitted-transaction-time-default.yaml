# Bitemporal read with only the Valid-Time dimension pinned. The omitted Transaction-Time
# authoring form is retained under `equivalentEncodings`; canonical normalization
# makes Transaction Time explicit as Latest, so the golden SQL includes out_z = infinity.
model: models/position.yaml
tags: [m-temporal-read, m-object-query, m-sql, bitemporal, temporal, as-of, default-transaction-time, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Position
    predicate:
      all: {}
    temporal:
      transaction-time:
        asOf: latest
      valid-time:
        asOf: "2024-03-01T00:00:00.000000Z"
  equivalentEncodings:
    - target: parallax.compatibility.Position
      predicate:
        all: {}
      temporal:
        valid-time:
          asOf: "2024-03-01T00:00:00.000000Z"
then:
  statements:
    - sql:
        postgres: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?
      binds: ["2024-03-01T00:00:00.000000Z", "2024-03-01T00:00:00.000000Z", infinity]
  referenceSql: "select pos_id, acct_num, val, from_z, thru_z, in_z, out_z from position where from_z <= '2024-03-01T00:00:00+00:00'::timestamptz and thru_z > '2024-03-01T00:00:00+00:00'::timestamptz and out_z = 'infinity'::timestamptz"
  rows:
    - { pos_id: 1, acct_num: A, val: "100.00", from_z: "2024-01-01T00:00:00.000000Z", thru_z: "2024-06-01T00:00:00.000000Z", in_z: "2024-04-01T00:00:00.000000Z", out_z: infinity }
  roundTrips: 1
