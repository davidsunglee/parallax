# A locking read over heterogeneous TPH document interpretations evaluates each
# cast only inside its discriminator branch, joins those matching identities back
# to the shared base Table, and locks the base rows with one outer SELECT.
#
# CardPayment.detail is text while CashPayment.detail is decimal, so an
# unpartitioned cast is unsafe. Each derived branch fences its inner tag filter
# before the outer variant-specific cast: PostgreSQL uses `offset 0`, while
# MariaDB binds its maximum-limit form. A flattenable derived relation would not
# preserve this ordering. The outer Postgres `for share of t0` and MariaDB `lock
# in share mode` lock the returned payment_document rows in one round trip.
model: models/document-layout.yaml
tags: [m-read-lock, m-inheritance, m-storage-layout, m-sql, m-dialect, m-document-codec, m-predicate, table-per-hierarchy, document-layout, narrow, predicate, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Payment
    predicate:
      or:
        operands:
          - narrow:
              to:
                - parallax.compatibility.CardPayment
              operand:
                eq:
                  attr: parallax.compatibility.CardPayment.detail
                  value: visa-4242
          - narrow:
              to:
                - parallax.compatibility.CashPayment
              operand:
                greaterThan:
                  attr: parallax.compatibility.CashPayment.detail
                  value: 10.00
then:
  statements:
    - sql:
        postgres: select t0.id, t0.kind, t0.payload from payment_document t0 join (select p1.id from (select * from payment_document t1 where t1.kind = ? offset 0) p1 where jsonb_extract_path_text(p1.payload, ?) = ? or 1 = 0 union all select p2.id from (select * from payment_document t2 where t2.kind = ? offset 0) p2 where 1 = 0 or cast(jsonb_extract_path_text(p2.payload, ?) as decimal(18, 2)) > ?) u on u.id = t0.id for share of t0
        mariadb: select t0.id, t0.kind, t0.payload from payment_document t0 join (select p1.id from (select * from payment_document t1 where t1.kind = ? limit ?) p1 where json_value(p1.payload, ?) = ? or 1 = 0 union all select p2.id from (select * from payment_document t2 where t2.kind = ? limit ?) p2 where 1 = 0 or cast(json_value(p2.payload, ?) as decimal(18, 2)) > ?) u on u.id = t0.id lock in share mode
      binds:
        postgres: [card, detail, visa-4242, cash, detail, '10.0']
        mariadb: [card, 18446744073709551615, '$.detail', visa-4242, cash, 18446744073709551615, '$.detail', '10.0']
  referenceSql:
    postgres: select id, kind, payload from payment_document where kind = 'card' and payload ->> 'detail' = 'visa-4242' union all select id, kind, payload from payment_document where kind = 'cash' and (payload ->> 'detail')::decimal(18,2) > 10.00
    mariadb: select id, kind, payload from payment_document where kind = 'card' and json_value(payload, '$.detail') = 'visa-4242' union all select id, kind, payload from payment_document where kind = 'cash' and cast(json_value(payload, '$.detail') as decimal(18,2)) > 10.00
  rows:
    - { id: 1, detail: visa-4242, authorization_code: AUTH-7, familyVariant: CardPayment }
    - { id: 2, detail: 12.50, authorization_code: null, familyVariant: CashPayment }
  roundTrips: 1
