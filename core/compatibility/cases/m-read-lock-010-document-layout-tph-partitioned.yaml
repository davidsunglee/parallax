# A locking read over heterogeneous TPH document interpretations evaluates each
# cast only inside its discriminator branch, joins those matching identities back
# to the shared base Table, and locks the base rows with one outer SELECT.
#
# CardPayment.detail is text while CashPayment.detail is decimal, so an
# unpartitioned cast is unsafe. The derived relation preserves tag-disjoint
# evaluation; the outer Postgres `for share of t0` and MariaDB `lock in share
# mode` lock the returned payment_document rows in one round trip rather than
# locking a derived result or issuing one statement per concrete subtype.
model: models/document-layout.yaml
tags: [m-read-lock, m-inheritance, m-storage-layout, m-sql, m-dialect, m-document-codec, m-op-algebra, table-per-hierarchy, document-layout, narrow, predicate, slice-snapshot-1, slice-managed-1]
shape: read
when:
  targetEntity: Payment
  operation:
    or:
      operands:
        - narrow:
            entity: Payment
            to: [CardPayment]
            operand:
              eq: { attr: CardPayment.detail, value: visa-4242 }
        - narrow:
            entity: Payment
            to: [CashPayment]
            operand:
              greaterThan: { attr: CashPayment.detail, value: 10.00 }
then:
  statements:
    - sql:
        postgres: select t0.id, t0.kind, t0.payload from payment_document t0 join (select t1.id from payment_document t1 where (jsonb_extract_path_text(t1.payload, ?) = ? or 1 = 0) and t1.kind = ? union all select t2.id from payment_document t2 where (1 = 0 or cast(jsonb_extract_path_text(t2.payload, ?) as decimal(18, 2)) > ?) and t2.kind = ?) u on u.id = t0.id for share of t0
        mariadb: select t0.id, t0.kind, t0.payload from payment_document t0 join (select t1.id from payment_document t1 where (json_value(t1.payload, ?) = ? or 1 = 0) and t1.kind = ? union all select t2.id from payment_document t2 where (1 = 0 or cast(json_value(t2.payload, ?) as decimal(18, 2)) > ?) and t2.kind = ?) u on u.id = t0.id lock in share mode
      binds:
        postgres: [detail, visa-4242, card, detail, '10.0', cash]
        mariadb: ['$.detail', visa-4242, card, '$.detail', '10.0', cash]
  referenceSql:
    postgres: select id, kind, payload from payment_document where kind = 'card' and payload ->> 'detail' = 'visa-4242' union all select id, kind, payload from payment_document where kind = 'cash' and (payload ->> 'detail')::decimal(18,2) > 10.00
    mariadb: select id, kind, payload from payment_document where kind = 'card' and json_value(payload, '$.detail') = 'visa-4242' union all select id, kind, payload from payment_document where kind = 'cash' and cast(json_value(payload, '$.detail') as decimal(18,2)) > 10.00
  rows:
    - { id: 1, detail: visa-4242, authorization_code: AUTH-7, familyVariant: CardPayment }
    - { id: 2, detail: 12.50, authorization_code: null, familyVariant: CashPayment }
  roundTrips: 1
