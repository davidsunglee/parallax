# Units of work spanning two qualifiers on one connection: the orders stay in
# `px` while the binding places their line items in `px_crm`. The committed unit
# deletes, predicate-updates through a join back to `px.orders`, and inserts a
# parent order beside a batched child insert; every effect stands. The abandoned
# unit amends a line item, inserts an order, and predicate-updates in `px_crm`,
# and its rollback erases all of it in both schemas.
model: models/orders.yaml
binding:
  postgres:
    format_version: 1
    backend: postgres
    default: { schema: px }
    entities:
      parallax.compatibility.OrderItem: { schema: px_crm }
  mariadb:
    format_version: 1
    backend: mariadb
    default: { database: px }
    entities:
      parallax.compatibility.OrderItem: { database: px_crm }
tags: [m-database-binding, m-unit-work, m-batch-write, m-sql, predicate-write, write-group, fk-ordering, scenario, rollback, binding, slice-snapshot-1]
shape: scenario
given:
  fixtures: true
when:
  scenario:
    - uow: kept
      objectQuery:
        target: parallax.compatibility.OrderItem
        predicate:
          eq:
            path: parallax.compatibility.OrderItem.id
            value: 12
      databaseCalls: 1
      note: observe line item 12 inside the unit of work, so the delete below has a source
      statements:
        - sql:
            postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from px_crm.order_item t0 where t0.id = ? for share of t0
            mariadb: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from px_crm.order_item t0 where t0.id = ? lock in share mode
          binds: [12]
      expectRows:
        - { id: 12, order_id: 1, sku: B-200, quantity: 1, shipped_on: 2024-02-15 }
    - uow: kept
      write:
        - mutation: delete
          entity: parallax.compatibility.OrderItem
          rows:
            - { id: 12 }
      databaseCalls: 1
      note: buffered, then delivered first by the predicate write's flush
      statements:
        - sql:
            postgres: delete from px_crm.order_item where id = ?
            mariadb: delete from px_crm.order_item where id = ?
          binds: [12]
    - uow: kept
      write:
        mutation: amend
        target:
          entity: parallax.compatibility.OrderItem
          predicate:
            and:
              operands:
                - exists: { path: parallax.compatibility.OrderItem.order }
                - eq: { path: parallax.compatibility.OrderItem.order.name, value: Linus }
        assignments:
          - { attr: parallax.compatibility.OrderItem.sku, value: Z }
      databaseCalls: 1
      expectAffectedRows: 1
      note: the readless predicate write selects its keys in `px_crm` through a join to the orders in `px`
      statements:
        - sql:
            postgres: update px_crm.order_item set sku = ? where id in (select t0.id from px_crm.order_item t0 left join px.orders t1 on t1.id = t0.order_id where not t1.id is null and t1.name = ?)
            mariadb: update px_crm.order_item set sku = ? where id in (select t0.id from px_crm.order_item t0 left join px.orders t1 on t1.id = t0.order_id where not t1.id is null and t1.name = ?)
          binds: [Z, Linus]
    - uow: kept
      write:
        - mutation: insert
          entity: parallax.compatibility.OrderItem
          rows:
            - { id: 13, orderId: 7, sku: N-13, quantity: 1 }
        - mutation: insert
          entity: parallax.compatibility.Order
          rows:
            - { id: 7, name: Grouped, sku: G-7, qty: 2, price: "3.00", active: true, orderedOn: "2024-09-01" }
        - mutation: insert
          entity: parallax.compatibility.OrderItem
          rows:
            - { id: 14, orderId: 7, sku: N-14, quantity: 2 }
      databaseCalls: 2
      note: the pre-commit flush inserts the parent order in `px`, then both line items in `px_crm` in one batched statement
      statements:
        - sql:
            postgres: insert into px.orders(id, name, sku, qty, price, active, ordered_on) values (?, ?, ?, ?, ?, ?, ?)
            mariadb: insert into px.orders(id, name, sku, qty, price, active, ordered_on) values (?, ?, ?, ?, ?, ?, ?)
          binds: [7, Grouped, G-7, 2, "3.00", true, 2024-09-01]
        - sql:
            postgres: insert into px_crm.order_item(id, order_id, sku, quantity) select * from unnest(cast(? as bigint[]), cast(? as bigint[]), cast(? as text[]), cast(? as int[]))
            mariadb: insert into px_crm.order_item(id, order_id, sku, quantity) values (?, ?, ?, ?), (?, ?, ?, ?)
          binds:
            postgres:
              - [13, 14]
              - [7, 7]
              - [N-13, N-14]
              - [1, 2]
            mariadb: [13, 7, N-13, 1, 14, 7, N-14, 2]
    - uow: abandoned
      objectQuery:
        target: parallax.compatibility.OrderItem
        predicate:
          eq:
            path: parallax.compatibility.OrderItem.id
            value: 11
      databaseCalls: 1
      note: observe line item 11, so the amendment below has a source
      statements:
        - sql:
            postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from px_crm.order_item t0 where t0.id = ? for share of t0
            mariadb: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from px_crm.order_item t0 where t0.id = ? lock in share mode
          binds: [11]
      expectRows:
        - { id: 11, order_id: 1, sku: A-100, quantity: 2, shipped_on: null }
    - uow: abandoned
      write:
        - mutation: amend
          entity: parallax.compatibility.OrderItem
          rows:
            - { id: 11, sku: X-11 }
        - mutation: insert
          entity: parallax.compatibility.Order
          rows:
            - { id: 8, name: Abandoned, sku: G-8, qty: 1, price: "1.00", active: true, orderedOn: "2024-10-01" }
      databaseCalls: 2
      note: buffered, then delivered by the predicate write's flush, the insert's mutation phase in `px` before the update's in `px_crm`
      statements:
        - sql:
            postgres: insert into px.orders(id, name, sku, qty, price, active, ordered_on) values (?, ?, ?, ?, ?, ?, ?)
            mariadb: insert into px.orders(id, name, sku, qty, price, active, ordered_on) values (?, ?, ?, ?, ?, ?, ?)
          binds: [8, Abandoned, G-8, 1, "1.00", true, 2024-10-01]
        - sql:
            postgres: update px_crm.order_item set sku = ? where id = ?
            mariadb: update px_crm.order_item set sku = ? where id = ?
          binds: [X-11, 11]
    - uow: abandoned
      write:
        mutation: amend
        target:
          entity: parallax.compatibility.OrderItem
          predicate:
            greaterThan:
              path: parallax.compatibility.OrderItem.quantity
              value: 4
        assignments:
          - { attr: parallax.compatibility.OrderItem.sku, value: "Y" }
      databaseCalls: 1
      expectAffectedRows: 1
      note: the group's last step; its callback then abandons the unit of work
      statements:
        - sql:
            postgres: update px_crm.order_item set sku = ? where quantity > ?
            mariadb: update px_crm.order_item set sku = ? where quantity > ?
          binds: ["Y", 4]
then:
  databaseCalls: 9
  units:
    kept: { outcome: committed }
    abandoned: { outcome: rolledBack }
  tableState:
    px:
      orders:
        - { id: 1, name: Ada, sku: A-100, qty: 5, price: "10.50", active: true, ordered_on: 2024-01-05 }
        - { id: 2, name: Linus, sku: B-200, qty: 10, price: "20.00", active: true, ordered_on: 2024-02-10 }
        - { id: 3, name: ada, sku: A-300, qty: 15, price: "30.25", active: false, ordered_on: 2024-03-15 }
        - { id: 4, name: Margaret, sku: null, qty: 20, price: "40.00", active: true, ordered_on: 2024-04-20 }
        - { id: 5, name: Alan, sku: "C_50%", qty: 25, price: "50.75", active: false, ordered_on: 2024-05-25 }
        - { id: 7, name: Grouped, sku: G-7, qty: 2, price: "3.00", active: true, ordered_on: 2024-09-01 }
        - { id: 42, name: Grace, sku: A-999, qty: 30, price: "99.99", active: true, ordered_on: 2024-06-30 }
    px_crm:
      order_item:
        - { id: 11, order_id: 1, sku: A-100, quantity: 2, shipped_on: null }
        - { id: 13, order_id: 7, sku: N-13, quantity: 1, shipped_on: null }
        - { id: 14, order_id: 7, sku: N-14, quantity: 2, shipped_on: null }
        - { id: 21, order_id: 2, sku: Z, quantity: 4, shipped_on: 2024-02-20 }
        - { id: 421, order_id: 42, sku: A-999, quantity: 3, shipped_on: 2024-03-10 }
        - { id: 422, order_id: 42, sku: B-200, quantity: 5, shipped_on: 2024-02-05 }
