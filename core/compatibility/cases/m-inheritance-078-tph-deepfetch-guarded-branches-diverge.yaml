# Two guarded branches over one relationship DIVERGE at the next level, and each
# deeper hop descends from its own branch's parents (m-read-planning, m-inheritance).
model: models/animal.yaml
tags: [m-read-planning, m-inheritance, m-predicate, m-object-query, m-sql, table-per-hierarchy, narrow, deep-fetch, type-key, slice-snapshot-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "deep-fetch child levels - each guarded owner hop binds its person-table IN-list from its own guard's rows of the root query result, and the pets hop binds its animal-table IN-list from the Dog branch's owner ids, so the child emissions depend on a query result"
when:
  objectQuery:
    target: parallax.compatibility.Animal
    predicate:
      "true": {}
    includes:
      - appliesTo:
          - parallax.compatibility.WildBoar
        segments:
          - rel: parallax.compatibility.Animal.owner
      - appliesTo:
          - parallax.compatibility.Dog
        segments:
          - rel: parallax.compatibility.Animal.owner
          - rel: parallax.compatibility.Person.pets
then:
  statements:
    - sql:
        postgres: select t0.id, t0.kind, t0.name, t0.owner_id, t0.license_id, t0.indoor, t0.bark_volume, t0.tusk_length from animal t0
    - sql:
        postgres: select t0.id, t0.name from person t0 where t0.id = any(cast(? as bigint[]))
      binds: [[12]]
    - sql:
        postgres: select t0.id, t0.name from person t0 where t0.id = any(cast(? as bigint[]))
      binds: [[10, 11]]
    - sql:
        postgres: select t0.id, t0.kind, t0.name, t0.owner_id, t0.license_id, t0.indoor, t0.bark_volume from animal t0 where t0.owner_id = any(cast(? as bigint[])) and t0.kind in (?, ?)
      binds: [[10, 11], cat, dog]
  referenceSql: select id, kind, name, owner_id, license_id, indoor, bark_volume, tusk_length from animal
  graph:
    Animal:
      - id: 1
        name: Rex
        ownerId: 10
        licenseId: L-100
        barkVolume: 7
        _type: parallax.compatibility.Dog
        owner:
          id: 10
          name: Alice
          pets:
            - { id: 1, name: Rex, ownerId: 10, licenseId: L-100, barkVolume: 7, _type: parallax.compatibility.Dog }
            - { id: 3, name: Whiskers, ownerId: 10, licenseId: L-200, indoor: true, _type: parallax.compatibility.Cat }
      - id: 2
        name: Fido
        ownerId: 11
        licenseId: L-101
        barkVolume: 3
        _type: parallax.compatibility.Dog
        owner:
          id: 11
          name: Bob
          pets:
            - { id: 2, name: Fido, ownerId: 11, licenseId: L-101, barkVolume: 3, _type: parallax.compatibility.Dog }
      - id: 3
        name: Whiskers
        ownerId: 10
        licenseId: L-200
        indoor: true
        _type: parallax.compatibility.Cat
      - id: 4
        name: Tusker
        ownerId: 12
        tuskLength: "12.50"
        _type: parallax.compatibility.WildBoar
        owner: { id: 12, name: Carol }
  databaseCalls: 4
