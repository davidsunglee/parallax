# Query-backed list x DIVERGENT value object: the first-access materialization
# witness (m-op-list + m-value-object) — the query-backed-list analogue of
# m-deep-fetch-020, resolving the VO-bearing child via a FIRST `action: access`
# instead of a relationship load (the other instance-form step read m-sql "Read
# result form" classifies: the first access of a query-backed list is INSTANCE-FORM,
# object lane).
model: models/customer.yaml
tags: [m-op-list, m-value-object, lazy, materialization, json, slice-managed-1]
shape: scenario
when:
  scenario:
    - objectQuery:
        target: parallax.compatibility.Depot
        predicate:
          all: {}
      roundTrips: 0
      note: construction -> a query-backed list, no DB work
    - action: access
      "on": 0
      roundTrips: 1
      note: first access resolves the list once — INSTANCE-FORM, projects Depot's own list (id, customer_id, label, then address presence/value pair); each row's flat address decodes with DEPOT's descriptor
      statements:
        - sql:
            postgres: select t0.id, t0.customer_id, t0.label, not t0.address is null, t0.address from depot t0
            mariadb: select t0.id, t0.customer_id, t0.label, not t0.address is null, t0.address from depot t0
      expectRows:
        - id: 200
          customer_id: 1
          label: Dock
          address:
            line: "1 Dock St"
            postcode: "0193"
        - id: 201
          customer_id: 1
          label: Yard
          address: null
    - action: access
      "on": 0
      roundTrips: 0
      sameObjectAs: 1
      note: re-access (iterate / index / size again) -> zero SQL, the same resolved objects
then:
  roundTrips: 1
