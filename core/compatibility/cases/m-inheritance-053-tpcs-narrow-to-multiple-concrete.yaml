# Table-per-concrete-subtype narrow to MULTIPLE concrete subtypes across branches
# (m-inheritance, m-object-query, m-sql).
model: models/document.yaml
tags: [m-inheritance, m-predicate, m-object-query, m-sql, table-per-concrete-subtype, union-all, narrow, familyVariant, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Document
    predicate:
      all: {}
    narrowTo:
      - parallax.compatibility.Invoice
      - parallax.compatibility.Memo
then:
  statements:
    - sql:
        postgres: select t0.id, t0.title, t0.folder_id, t0.currency, t0.amount_due, cast(null as varchar(64)) body, 'Invoice' family_variant from invoice t0 union all select t0.id, t0.title, t0.folder_id, cast(null as varchar(3)) currency, cast(null as decimal(18, 2)) amount_due, t0.body, 'Memo' family_variant from memo t0
        mariadb: select t0.id, t0.title, t0.folder_id, t0.currency, t0.amount_due, cast(null as char(64)) body, 'Invoice' family_variant from invoice t0 union all select t0.id, t0.title, t0.folder_id, cast(null as char(3)) currency, cast(null as decimal(18, 2)) amount_due, t0.body, 'Memo' family_variant from memo t0
  rows:
    - { id: 1, title: Invoice-A, folder_id: 100, currency: USD, amount_due: "120.00", body: null, familyVariant: Invoice }
    - { id: 2, title: Invoice-B, folder_id: 101, currency: EUR, amount_due: "80.00", body: null, familyVariant: Invoice }
    - { id: 1, title: Memo-A, folder_id: 102, currency: null, amount_due: null, body: Reminder, familyVariant: Memo }
  roundTrips: 1
