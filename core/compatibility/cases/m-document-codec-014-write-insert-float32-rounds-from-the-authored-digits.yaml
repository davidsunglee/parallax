# A `float32` leaf whose authored number is rounded ONCE, from the digits it was
# written with (m-document-codec "Rounding happens once, from the digits").
model: models/document-codec.yaml
tags: [m-document-codec, m-value-object, m-sql, write-sequence, insert, json, slice-snapshot-1, slice-managed-1]
shape: writeSequence
when:
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.Sample
      statements: 1
      note: insert one Sample whose float32 and float64 leaves carry the same authored digits
      rows:
        - id: 140
          label: Nearest
          profile:
            ratio: 1.0000000596046448
            measure: 1.0000000596046448
then:
  statements:
    - sql:
        postgres: insert into sample(id, label, profile) values (?, ?, ?)
        mariadb: insert into sample(id, label, profile) values (?, ?, ?)
      binds:
        - 140
        - Nearest
        - ratio: 1.0000001
          measure: 1.0000000596046448
          entries: []
  tableState:
    sample:
      - id: 140
        label: Nearest
        profile:
          ratio: 1.0000001
          measure: 1.0000000596046448
          entries: []
  roundTrips: 1
