# A table-per-concrete-subtype root owns no table: each concrete leaf owns its
# own, so an entry keyed by the tableless Vehicle root places nothing and is
# refused.
model: models/binding-fleet.yaml
tags: [m-database-binding, rejected, negative, binding, slice-snapshot-1]
shape: rejected
when:
  binding:
    postgres:
      format_version: 1
      backend: postgres
      default: { schema: px }
      entities:
        parallax.compatibility.Vehicle: { schema: px_eu }
    mariadb:
      format_version: 1
      backend: mariadb
      default: { database: px }
      entities:
        parallax.compatibility.Vehicle: { database: px_eu }
then:
  rejectedRule: binding-entity-owns-no-table
