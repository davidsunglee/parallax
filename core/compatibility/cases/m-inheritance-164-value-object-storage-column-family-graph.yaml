# A polymorphic Value Object may store its document in a Column spelled apart from its
# occurrence name because a graph renders it by that name: both the `profile` document
# and the exact concrete variant must survive one abstract-family read.
model: models/materialization-key-compatibility.yaml
tags: [m-inheritance, m-value-object, m-sql, m-api-conformance, table-per-hierarchy, type-key, graph, instance-form, materialization-key, positive, slice-snapshot-1]
shape: read
when:
  objectQuery:
    target: compatibility.overlap.VariantRecord
    predicate:
      "true": {}
then:
  statements:
    - sql:
        postgres: select t0.id, t0.kind, not t0."variantProfile" is null, t0."variantProfile" from px.variant_record t0
        mariadb: select t0.id, t0.kind, not t0.`variantProfile` is null, t0.`variantProfile` from px.variant_record t0
  referenceSql: select id, kind from px.variant_record
  graph:
    VariantRecord:
      - { id: 2, profile: { label: variant-profile }, _type: compatibility.overlap.VariantNote }
  databaseCalls: 1
