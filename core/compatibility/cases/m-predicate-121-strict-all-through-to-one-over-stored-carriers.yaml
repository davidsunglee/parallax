model: models/predicate-collections.yaml
tags: [m-predicate, quantifier, scalar-collection, relationship, to-one, slice-snapshot-1, slice-managed-1]
shape: read
given:
  corrupt:
  - entity: parallax.compatibility.Owner
    key: 1
    member: [tags]
    value: [vip, 7]
  - entity: parallax.compatibility.Owner
    key: 2
    member: [tags]
    value: vip
  - entity: parallax.compatibility.Owner
    key: 3
    member: [tags]
    value: [vip, null]
when:
  objectQuery:
    target: parallax.compatibility.Basket
    predicate:
      all:
        path: parallax.compatibility.Basket.owner.tags
        where:
          startsWith: {value: v}
then:
  statements:
  - sql: {postgres: 'select t0.id, t0.label, t0.owner_id, not t0.tags is null, t0.tags, not t0.scores is null, t0.scores, not t0.prices is null, t0.prices, not t0.flags is null, t0.flags, not t0.parcels is null, t0.parcels, not t0.meta is null, t0.meta from basket t0 left join basket_owner t1 on t1.id = t0.owner_id left join (select t3.id, not exists (select 1 from jsonb_array_elements(case when jsonb_typeof(t3.tags) = ? then t3.tags else cast(? as jsonb) end) t2 where not (case when jsonb_typeof(t2.value) = ? then t2.value #>> ? end like ?) is true) q0 from basket_owner t3) r0 on r0.id = t1.id where coalesce(r0.q0, true)'}
    binds: [array, '[]', string, '{}', v%]
  graph:
    Basket:
    - id: 2
      label: two
      ownerId: null
      tags: []
      scores: []
      prices: []
      flags: []
      parcels: []
      meta: null
    - id: 3
      label: three
      ownerId: 2
      tags: [gift]
      scores: [15]
      prices: ['2.00', '3.00']
      flags: [false]
      parcels:
      - sku: c
        qty: 5
        notes: [urgent]
      meta:
        labels: []
  roundTrips: 1
