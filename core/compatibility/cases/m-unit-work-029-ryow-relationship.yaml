# Read-your-own-writes across a RELATIONSHIP (m-unit-work): a dependent find
# inside the unit of work observes its own buffered writes in the relationship it
# deep-fetches, not only in the row it keys on.
model: models/orders.yaml
tags: [m-unit-work, m-deep-fetch, read-your-own-writes, relationship, to-many, insert, update, scenario, slice-snapshot-1, slice-managed-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "include level - the Order.items child IN-list binds are the distinct root keys gathered from each find's own root read, so the child emission depends on a query result"
when:
  scenario:
    - uow: observed-items
      objectQuery:
        target: parallax.compatibility.Order
        predicate:
          eq:
            attr: parallax.compatibility.Order.id
            value: 1
        includes:
          - segments:
              - rel: parallax.compatibility.Order.items
      roundTrips: 2
      note: observe order 1 WITH its items inside the unit of work the write below shares
      statements:
        - sql:
            postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.id = ? for share of t0
          binds: [1]
        - sql:
            postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id = any(?) order by t0.id desc for share of t0
          binds: [[1]]
      expectGraph:
        Order:
          - id: 1
            name: Ada
            sku: A-100
            qty: 5
            price: "10.50"
            active: true
            orderedOn: 2024-01-05
            items:
              - { id: 12, orderId: 1, sku: B-200, quantity: 1, shippedOn: 2024-02-15 }
              - { id: 11, orderId: 1, sku: A-100, quantity: 2, shippedOn: null }
    - uow: observed-items
      write:
        - mutation: insert
          entity: parallax.compatibility.OrderItem
          rows:
            - { id: 13, orderId: 1, sku: D-130, quantity: 6 }
        - mutation: update
          entity: parallax.compatibility.OrderItem
          rows:
            - { id: 11, sku: Rewritten }
      roundTrips: 2
      note: add a line item to the very relationship the find above materialized and rewrite one it already held; both settle inside the group, so neither owes a resolving read
      statements:
        - sql:
            postgres: insert into order_item(id, order_id, sku, quantity) values (?, ?, ?, ?)
          binds: [13, 1, D-130, 6]
        - sql:
            postgres: update order_item set sku = ? where id = ?
          binds: [Rewritten, 11]
    - uow: observed-items
      objectQuery:
        target: parallax.compatibility.Order
        predicate:
          eq:
            attr: parallax.compatibility.Order.id
            value: 1
        includes:
          - segments:
              - rel: parallax.compatibility.Order.items
      roundTrips: 2
      note: the SAME read again, still inside the group - it MUST observe its own writes across the relationship; the group COMMITS after this, its last step
      expectGraph:
        Order:
          - id: 1
            name: Ada
            sku: A-100
            qty: 5
            price: "10.50"
            active: true
            orderedOn: 2024-01-05
            items:
              - { id: 13, orderId: 1, sku: D-130, quantity: 6, shippedOn: null }
              - { id: 12, orderId: 1, sku: B-200, quantity: 1, shippedOn: 2024-02-15 }
              - { id: 11, orderId: 1, sku: Rewritten, quantity: 2, shippedOn: null }
      statements:
        - sql:
            postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.id = ? for share of t0
          binds: [1]
        - sql:
            postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id = any(?) order by t0.id desc for share of t0
          binds: [[1]]
then:
  roundTrips: 6
