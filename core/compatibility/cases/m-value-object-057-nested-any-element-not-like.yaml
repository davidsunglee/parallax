# valueObject to-many negated string match: nestedNotLike through a `many` segment keeps
# the uniform ANY-ELEMENT reading — SOME element's member does not match — never "no
# element's does" (m-predicate any-element, m-sql). Postgres golden only — a
# non-equality element predicate is outside MariaDB's containment scope (m-dialect,
# "Scope of the containment golden").
model: models/customer.yaml
tags: [m-value-object, m-predicate, m-sql, m-dialect, nested, json, to-many, any-element, string, notLike, array-traversal, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Customer
    predicate:
      nestedNotLike:
        path: parallax.compatibility.Customer.address.phones.number
        value: 555-9999
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name from customer t0 where exists (select 1 from jsonb_array_elements(case when jsonb_typeof(jsonb_extract_path(t0.address, ?)) = ? then jsonb_extract_path(t0.address, ?) else cast(? as jsonb) end) t1 where jsonb_extract_path_text(t1.value, ?) not like ?)
      binds: [phones, 'array', phones, '[]', number, '555-9999']
  referenceSql:
    postgres: select id, name from customer where jsonb_typeof(address -> 'phones') = 'array' and exists (select 1 from jsonb_array_elements(address -> 'phones') e where not (e.value ->> 'number' like '555-9999'))
  rows:
    - { id: 1, name: Ada }
    - { id: 7, name: Nils }
  roundTrips: 1
