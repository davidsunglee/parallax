# Negative (m-metamodel): a non-temporal Entity names a business Attribute
# `txStart`. The four temporal endpoint names are reserved whatever dimensions an
# Entity declares, including none.
model: models/person.yaml
tags: [m-metamodel, m-model-formation, m-descriptor, rejected, negative, temporal, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  model:
    entity:
      name: Ledger
      table: ledger
      attributes:
        - { name: id, type: int64, primaryKey: true }
        - { name: txStart, type: timestamp }
then:
  rejectedRule: metamodel-temporal-member-reserved
