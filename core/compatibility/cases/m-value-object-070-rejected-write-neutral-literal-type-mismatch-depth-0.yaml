# Negative (m-wire typed-literal conversion): a depth-0 attribute literal that cannot
# denote the declared type is refused PRE-SQL.
model: models/contact.yaml
tags: [m-value-object, m-wire, rejected, negative, write, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  write:
    id: "five"
    name: Acme
    address:
      street: 1 Main St
      city: Oslo
      geo:
        country: "NO"
        point: { lat: 59.9, lon: 10.7 }
then:
  rejectedRule: neutral-literal-type-mismatch
