# Portable document encoding: an `int32` leaf is a JSON number and compares through
# the integer cast (m-document-codec, m-dialect typed cast form, m-sql), on Postgres
# AND MariaDB.
model: models/document-codec.yaml
tags: [m-document-codec, m-value-object, m-sql, m-dialect, nested, json, cast, numeric, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Sample
    predicate:
      nestedGt:
        path: parallax.compatibility.Sample.profile.small
        value: 0
then:
  statements:
    - sql:
        postgres: select t0.id, t0.label from sample t0 where cast(jsonb_extract_path_text(t0.profile, ?) as bigint) > ?
        mariadb: select t0.id, t0.label from sample t0 where cast(json_value(t0.profile, ?) as signed) > ?
      binds:
        postgres: [small, 0]
        mariadb: ['$.small', 0]
  referenceSql:
    postgres: select id, label from sample where (profile ->> 'small')::bigint > 0
    mariadb: select id, label from sample where nullif(json_unquote(json_extract(profile, '$.small')), 'null') + 0 > 0
  rows:
    - { id: 1, label: Ada }
  roundTrips: 1
