# valueObject absence collapse and stored-data classification on ONE read: a wrong-kind
# occurrence the predicate reads as not present selects its row, and the same read
# classifies that row (m-predicate, m-value-object, m-snapshot-read), on Postgres AND
# MariaDB. Rin (6) is selected only because its wrong-kind `geo` collapses, and Omar (9)
# and Priya (10) only because their wrong-kind `phones` do; Nils (7) has a null
# `country` and a real phone, so it falls to the second operand.
model: models/customer.yaml
tags: [m-value-object, m-predicate, m-sql, m-dialect, nested, json, "null", exists, absence-collapse, array-traversal, materialization, graph, to-one, to-many, slice-snapshot-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Customer
    predicate:
      and:
        operands:
          - isNull:
              path: parallax.compatibility.Customer.address.geo.country
          - none:
              path: parallax.compatibility.Customer.address.phones
    orderBy:
      - attr: parallax.compatibility.Customer.id
        direction: asc
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name, not t0.address is null, t0.address from customer t0 where jsonb_extract_path_text(t0.address, ?, ?) is null and not exists (select 1 from jsonb_array_elements(case when jsonb_typeof(jsonb_extract_path(t0.address, ?)) = ? then jsonb_extract_path(t0.address, ?) else cast(? as jsonb) end) t1) order by t0.id asc
        mariadb: select t0.id, t0.name, not t0.address is null, t0.address from customer t0 where json_value(t0.address, ?) is null and not coalesce(json_type(json_extract(t0.address, ?)) = ? and json_length(t0.address, ?) > ?, ?) order by t0.id asc
      binds:
        postgres: [geo, country, phones, 'array', phones, '[]']
        mariadb: ['$.geo.country', '$.phones', 'ARRAY', '$.phones', 0, 0]
  referenceSql:
    postgres: select id, name from customer where address -> 'geo' ->> 'country' is null and case when jsonb_typeof(address -> 'phones') = 'array' then jsonb_array_length(address -> 'phones') = 0 else true end
    mariadb: select id, name from customer where nullif(json_unquote(json_extract(address, '$.geo.country')), 'null') is null and (json_type(json_extract(address, '$.phones')) is null or json_type(json_extract(address, '$.phones')) <> 'ARRAY' or not exists (select 1 from json_table(address, '$.phones[*]' columns (v json path '$')) jt))
  graph:
    Customer:
      - id: 4
        name: Mary
        address: null
      - id: 5
        name: Kavi
        address:
          street: 5 Harbour Rd
          geo: {}
          phones: []
      - id: 6
        name: Rin
        address:
          street: 6 Kastanien Allee
          city: Berlin
          geo: null
          phones: []
      - id: 8
        name: Iris
        address:
          street: 8 Null Way
          phones: []
      - id: 9
        name: Omar
        address:
          street: 9 Scalar Rd
          phones: []
      - id: 10
        name: Priya
        address:
          street: 10 Object Ct
          phones: []
  storedDataIssues:
    - ordinal: 2
      hydrated: true
      issues:
        - code: stored-data-one-wrong-kind
          entity: parallax.compatibility.Customer
          member: parallax.compatibility.Customer.address.geo
          objectKey: { entity: parallax.compatibility.Customer, key: { id: 6 } }
    - ordinal: 4
      hydrated: true
      issues:
        - code: stored-data-many-wrong-kind
          entity: parallax.compatibility.Customer
          member: parallax.compatibility.Customer.address.phones
          objectKey: { entity: parallax.compatibility.Customer, key: { id: 9 } }
    - ordinal: 5
      hydrated: true
      issues:
        - code: stored-data-many-wrong-kind
          entity: parallax.compatibility.Customer
          member: parallax.compatibility.Customer.address.phones
          objectKey: { entity: parallax.compatibility.Customer, key: { id: 10 } }
  databaseCalls: 1
