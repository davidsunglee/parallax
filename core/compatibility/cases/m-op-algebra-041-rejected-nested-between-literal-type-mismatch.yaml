# Negative (m-predicate typed-literal MUST, and the order the two range checks run
# in): an element-scoped range whose BOUNDS mistype the declared leaf is refused as a
# type mismatch, not as an inverted range.
#
# `phones.type`/`phones.number` are `string` attributes, so bounding the
# element-relative `number` by the NUMBERS 42 and 7 mismatches the leaf's declared
# type. Those same two literals are also inverted as raw numbers, which is what makes
# this case discriminating: a resolver that ordered the bounds before resolving the
# subject would report `between-bounds-inverted` and blame the ordering for a problem
# that is actually the bounds' types. m-predicate fixes the order as subject first,
# bounds second — the nested path resolves and both bounds are type-checked against
# the leaf before they are compared to each other — so the diagnostic names the real
# fault. The node is schema-valid, since the polymorphic `literal` admits a number in
# either bound position, and the element scope is reached through the enclosing
# `nestedExists` `where`, so only model-aware validation inside that scope catches it.
model: models/customer.yaml
tags: [m-predicate, m-value-object, rejected, negative, nested, between, scoped, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  objectQuery:
    target: parallax.compatibility.Customer
    predicate:
      nestedExists:
        path: parallax.compatibility.Customer.address.phones
        where:
          nestedBetween:
            path: number
            lower: 42
            upper: 7
then:
  rejectedRule: nested-literal-type-mismatch
