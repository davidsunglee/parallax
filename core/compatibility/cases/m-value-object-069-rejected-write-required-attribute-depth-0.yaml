# Negative (m-value-object write validation, resolved Q7): a write missing a required
# DEPTH-0 attribute — the ENTITY's own scalar, not a document field — is refused PRE-SQL.
#
# `write-required-attribute-missing` holds "at any depth", and depth 0 is the entity
# itself: a bare `when.write` row is resolved against the written entity's whole
# declared structure, its top-level Attributes included, not against its value-object
# documents alone. Contact's `name` is a required (`nullable: false`) top-level
# attribute; this write supplies `id` and a complete `address` document but omits
# `name`, so model-aware write validation MUST reject it before any DML. Together with
# m-value-object-039/040/041 this pins the rule at every depth the model has.
model: models/contact.yaml
tags: [m-value-object, rejected, negative, write, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  write:
    id: 1
    address:
      street: 1 Main St
      city: Oslo
      geo:
        country: "NO"
        point: { lat: 59.9, lon: 10.7 }
then:
  rejectedRule: write-required-attribute-missing
