# Portable document encoding: a `uuid` leaf stores the canonical LOWERCASE 8-4-4-4-12
# form, and a comparison binds that form however the literal was written
# (m-document-codec, m-dialect text-compared table, m-sql), on Postgres AND MariaDB.
model: models/document-codec.yaml
tags: [m-document-codec, m-value-object, m-sql, m-dialect, nested, json, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Sample
    predicate:
      nestedEq:
        path: parallax.compatibility.Sample.profile.token
        value: "123e4567-e89b-12d3-a456-426614174000"
then:
  statements:
    - sql:
        postgres: select t0.id, t0.label from sample t0 where jsonb_extract_path_text(t0.profile, ?) = ?
        mariadb: select t0.id, t0.label from sample t0 where json_value(t0.profile, ?) = ?
      binds:
        postgres: [token, '123e4567-e89b-12d3-a456-426614174000']
        mariadb: ['$.token', '123e4567-e89b-12d3-a456-426614174000']
  referenceSql:
    postgres: select id, label from sample where profile ->> 'token' = '123e4567-e89b-12d3-a456-426614174000'
    mariadb: select id, label from sample where nullif(json_unquote(json_extract(profile, '$.token')), 'null') = '123e4567-e89b-12d3-a456-426614174000'
  rows:
    - { id: 1, label: Ada }
  roundTrips: 1
