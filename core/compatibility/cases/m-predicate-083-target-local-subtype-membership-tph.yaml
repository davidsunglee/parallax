# A path-targeted narrowing tests the subtype of the single Pet a collar reaches,
# not of the queried collar: collars on dogs. An absent pet is false. The bare test
# needs no operand envelope, so MariaDB spells it too.
model: models/predicate-traversal.yaml
tags: [m-predicate, narrow, relationship, to-one, m-inheritance, table-per-hierarchy, m-dialect, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Collar
    predicate:
      narrow:
        path: parallax.compatibility.Collar.pet
        to: [parallax.compatibility.Dog]
        operand:
          'true': {}
then:
  statements:
  - sql: {postgres: 'select t0.id, t0.pet_id from traversal_collar t0 where coalesce((select t1.kind = ? from traversal_pet t1 where t1.id = t0.pet_id), false)', mariadb: 'select t0.id, t0.pet_id from traversal_collar t0 where coalesce((select t1.kind = ? from traversal_pet t1 where t1.id = t0.pet_id), false)'}
    binds: [dog]
  referenceSql: select id, pet_id from traversal_collar where pet_id in (select id from traversal_pet where kind = 'dog')
  rows:
  - {id: 10, pet_id: 1}
  - {id: 11, pet_id: 2}
  roundTrips: 1
