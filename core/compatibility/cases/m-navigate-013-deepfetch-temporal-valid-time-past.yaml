# Deep fetch Policy.coverages, Valid Time PAST 2024-03-01 / Transaction Time LATEST. The
# Valid-Time dimension propagates as a range, the Transaction-Time dimension as the equality form:
# child `from_z <= ? and thru_z > ? and out_z = ?` (binds B, B, infinity). At
# Valid Time 2024-03-01 with the current belief, coverage 10 is the HEAD -> 600
# (C-R2); coverage 20 -> 300.
model: models/policy.yaml
tags: [m-navigate, m-object-query, m-temporal-read, temporal, relationship, propagation, bitemporal, slice-snapshot-1, slice-managed-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "deep-fetch child level - the Policy.coverages IN-list binds are the distinct policy ids gathered from the root query result, so the child emissions depend on a query result"
when:
  objectQuery:
    target: parallax.compatibility.Policy
    predicate:
      all: {}
    temporal:
      transaction-time:
        asOf: latest
      valid-time:
        asOf: "2024-03-01T00:00:00.000000Z"
    includes:
      - segments:
          - rel: parallax.compatibility.Policy.coverages
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from policy t0 where t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?
        mariadb: select t0.id, t0.name, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from policy t0 where t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?
      binds: ["2024-03-01T00:00:00.000000Z", "2024-03-01T00:00:00.000000Z", infinity]
    - sql:
        postgres: select t0.id, t0.policy_id, t0.amount, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from coverage t0 where t0.policy_id in (?, ?) and t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?
        mariadb: select t0.id, t0.policy_id, t0.amount, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from coverage t0 where t0.policy_id in (?, ?) and t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?
      binds: [1, 2, "2024-03-01T00:00:00.000000Z", "2024-03-01T00:00:00.000000Z", infinity]
  graph:
    Policy:
      - id: 1
        name: Auto
        validStart: "2024-01-01T00:00:00.000000Z"
        validEnd: infinity
        txStart: "2024-01-01T00:00:00.000000Z"
        txEnd: infinity
        coverages:
          - { id: 10, policyId: 1, amount: "600.00", validStart: "2024-01-01T00:00:00.000000Z", validEnd: "2024-06-01T00:00:00.000000Z", txStart: "2024-04-01T00:00:00.000000Z", txEnd: infinity }
      - id: 2
        name: Home
        validStart: "2024-01-01T00:00:00.000000Z"
        validEnd: infinity
        txStart: "2024-01-01T00:00:00.000000Z"
        txEnd: infinity
        coverages:
          - { id: 20, policyId: 2, amount: "300.00", validStart: "2024-01-01T00:00:00.000000Z", validEnd: infinity, txStart: "2024-01-01T00:00:00.000000Z", txEnd: infinity }
  roundTrips: 2
