          rows:
            - { id: 3, label: w }
          validFrom: "2024-07-01T00:00:00.000000Z"
          until: "2024-08-01T00:00:00.000000Z"
          at: "2024-11-03T00:00:00.000000Z"
      note: "a target of the first original and an observed write of the second"
