# Boundary case (m-execution-lifecycle x m-db-port): session setup that fails
# opens NO boundary — the attempt that had already adopted its Model Edition
# finishes `beginFailed`, the callback never runs, and the failure is terminal —
# `api-conformance` lane.
model: models/account.yaml
tags: [m-execution-lifecycle, m-unit-work, m-api-conformance, isolation, slice-snapshot-1]
lane: api-conformance
shape: boundary
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection concurrency/locking intent (given.fault, shape:boundary)"
given:
  fault: isolation-setup-failure
when:
  uow:
    isolation: serializable
  boundary:
    - action: read
      note: the callback never runs, so this observation never happens
then:
  outcome: boundary-failed
  roundTrips: 0
  executionLifecycle:
    roots:
      - execution: 1
        kind: transaction-invocation
        events:
          - sequence: 1
            activity: 1
            parent: null
            transactionInvocationStarted:
              invocation: outer
              concurrency: optimistic
              retries: 10
              retryOptimisticConflicts: false
              isolation: serializable
          - sequence: 2
            activity: 2
            parent: 1
            transactionAttemptStarted: { edition: account }
          - sequence: 3
            activity: 3
            parent: 2
            acquisitionStarted: {}
          - sequence: 4
            activity: 3
            parent: 2
            acquisitionFinished: { outcome: acquired }
          - sequence: 5
            activity: 4
            parent: 2
            releaseStarted: {}
          - sequence: 6
            activity: 4
            parent: 2
            releaseFinished: { cleanup: returned }
          - sequence: 7
            activity: 2
            parent: 1
            transactionAttemptFinished: { outcome: beginFailed, attribution: direct }
          - sequence: 8
            activity: 1
            parent: null
            transactionInvocationFinished: { outcome: failed, attribution: caused, cause: 2 }