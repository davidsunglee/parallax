# Deep fetch, nullable to-one: every OrderStatus with its optional OrderItem.
#
# Order-level statuses have order_item_id NULL and must attach orderItem: null.
# Item-level statuses gather the distinct non-null item ids {11, 12, 421} and
# fetch those parents in one child statement.
model: models/orders.yaml
tags: [m-deep-fetch, m-object-query, m-op-list, to-one, nullable, relationship, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.OrderStatus
    predicate:
      all: {}
    includes:
      - segments:
          - rel: parallax.compatibility.OrderStatus.orderItem
then:
  statements:
    - sql:
        postgres: select t0.id, t0.order_id, t0.order_item_id, t0.code from order_status t0
    - sql:
        postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.id in (?, ?, ?)
      binds: [11, 12, 421]
  referenceSql: select id, order_id, order_item_id, code from order_status
  graph:
    OrderStatus:
      - { id: 101, orderId: 1, orderItemId: null, code: NEW, orderItem: null }
      - { id: 102, orderId: 2, orderItemId: null, code: SHIPPED, orderItem: null }
      - { id: 142, orderId: 42, orderItemId: null, code: NEW, orderItem: null }
      - id: 201
        orderId: 1
        orderItemId: 11
        code: PICKED
        orderItem: { id: 11, orderId: 1, sku: A-100, quantity: 2, shippedOn: null }
      - id: 202
        orderId: 1
        orderItemId: 11
        code: PACKED
        orderItem: { id: 11, orderId: 1, sku: A-100, quantity: 2, shippedOn: null }
      - id: 203
        orderId: 1
        orderItemId: 12
        code: PICKED
        orderItem: { id: 12, orderId: 1, sku: B-200, quantity: 1, shippedOn: 2024-02-15 }
      - id: 204
        orderId: 42
        orderItemId: 421
        code: PICKED
        orderItem: { id: 421, orderId: 42, sku: A-999, quantity: 3, shippedOn: 2024-03-10 }
  roundTrips: 2
