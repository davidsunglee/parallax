# Batch-size invariance, arm 1 of 2 (m-snapshot-read): at `batchSize: 2` the SAME
# Object Query is delivered over THREE root statements, and publishes the same
# four roots in the same order as its `batch-size-twin-3` sibling.
#
# The pair is the corpus proof that a page size is a performance dial alone. Its
# two members share one model, one `when.objectQuery`, and one `then.graph`, and
# differ only in `when.stream.batchSize` and the physical observations that follow
# from it; the static twin gate holds them equal on everything else, so a later
# edit cannot quietly make them two unrelated cases that both pass. This arm pages
# orders {1, 2, 3, 42} two at a time: {1, 2}, then {3, 42} seeking past id 2, then
# the empty terminal statement seeking past id 42 that a full final page costs.
#
# It declares NO includes, which is what makes it the witness for the compile
# rule as well: with no deep-fetch fan-out anywhere, the only query result its
# emissions depend on is the keyset seek itself — and the case is run-only
# because of it.
model: models/orders.yaml
tags: [m-snapshot-read, m-object-query, stream, streamed-delivery, batch-size, graph, materialization, slice-snapshot-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "a streamed read's keyset seek - each continuing root statement binds the primary key of the root the previous page delivered last, so the emissions depend on a query result even though the read declares no includes"
when:
  objectQuery:
    target: parallax.compatibility.Order
    predicate:
      in:
        attr: parallax.compatibility.Order.id
        values:
          - 1
          - 2
          - 3
          - 42
  stream:
    batchSize: 2
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.id parallax_seek_0 from orders t0 where t0.id in (?, ?, ?, ?) order by t0.id asc limit ?
        mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.id parallax_seek_0 from orders t0 where t0.id in (?, ?, ?, ?) order by t0.id asc limit ?
      binds: [1, 2, 3, 42, 2]
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.id parallax_seek_0 from orders t0 where t0.id in (?, ?, ?, ?) and t0.id > ? order by t0.id asc limit ?
        mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.id parallax_seek_0 from orders t0 where t0.id in (?, ?, ?, ?) and t0.id > ? order by t0.id asc limit ?
      binds: [1, 2, 3, 42, 2, 2]
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.id parallax_seek_0 from orders t0 where t0.id in (?, ?, ?, ?) and t0.id > ? order by t0.id asc limit ?
        mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.id parallax_seek_0 from orders t0 where t0.id in (?, ?, ?, ?) and t0.id > ? order by t0.id asc limit ?
      binds: [1, 2, 3, 42, 42, 2]
  referenceSql: select id, name, sku, qty, price, active, ordered_on from orders where id in (1, 2, 3, 42)
  graph:
    Order:
      - { id: 1, name: Ada, sku: A-100, qty: 5, price: "10.50", active: true, orderedOn: 2024-01-05 }
      - { id: 2, name: Linus, sku: B-200, qty: 10, price: "20.00", active: true, orderedOn: 2024-02-10 }
      - { id: 3, name: ada, sku: A-300, qty: 15, price: "30.25", active: false, orderedOn: 2024-03-15 }
      - { id: 42, name: Grace, sku: A-999, qty: 30, price: "99.99", active: true, orderedOn: 2024-06-30 }
  roundTrips: 3
