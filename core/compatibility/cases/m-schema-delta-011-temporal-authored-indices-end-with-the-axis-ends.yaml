            unique: true
    mariadb:
      delta:
        statements:
          - create table assignment (id bigint not null, code varchar(32) not null, label varchar(64) not null, rate bigint not null, from_z datetime(6) not null, thru_z datetime(6) not null, in_z datetime(6) not null, out_z datetime(6) not null, primary key (id, thru_z, out_z))
