          - create unique index pxi_assignment_parallax_compati_63f39cbbbd84a275a919154ccc0c2271 on assignment (code, thru_z, out_z)
          - create table handle (id bigint not null, code varchar(32) not null, label varchar(64) not null, in_z datetime(6) not null, out_z datetime(6) not null, primary key (id, out_z))
