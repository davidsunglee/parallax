# A broad TPCS instance read projects and decodes each concrete table's document with
# that branch's own shape. The observed instance contains only the selected concrete's
# members; sibling-only members are omitted rather than represented by null padding.
model: models/document-layout.yaml
tags: [m-inheritance, m-storage-layout, m-sql, m-document-codec, table-per-concrete-subtype, document-layout, union-all, familyVariant, graph, instance-form, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Publication
    predicate:
      all: {}
then:
  statements:
    - sql:
        postgres: select t0.id, t0.payload, 'Book' family_variant from publication_book t0 union all select t0.id, t0.payload, 'Film' family_variant from publication_film t0
        mariadb: select t0.id, t0.payload, 'Book' family_variant from publication_book t0 union all select t0.id, t0.payload, 'Film' family_variant from publication_film t0
  graph:
    Publication:
      - { id: 10, title: Systems, detail: ISBN-10, pages: 320, familyVariant: Book }
      - { id: 20, title: Frames, detail: 850, minutes: 95, familyVariant: Film }
  roundTrips: 1
