            - { id: 8, amount: 200, label: b, memo: { note: n8 } }
          validFrom: "2024-05-01T00:00:00.000000Z"
          until: "2024-07-01T00:00:00.000000Z"
          at: "2024-11-01T00:00:00.000000Z"
      note: "span 9 covers [January, April); span 8 covers [May, July)"
    - uow: later
      write:
        - mutation: insertUntil
          entity: parallax.compatibility.SequenceSpan
