          until: "2024-08-01T00:00:00.000000Z"
          at: "2024-11-02T00:00:00.000000Z"
      note: "span 9 also covers [June, August), leaving a gap in [April, June)"
    - uow: replaced
      objectQuery:
        target: parallax.compatibility.SequenceSpan
        predicate:
          eq:
            path: parallax.compatibility.SequenceSpan.id
            value: 9
        temporal: { transaction-time: { asOf: latest }, valid-time: { asOf: "2024-03-01T00:00:00.000000Z" } }
      note: "observe span 9 at March"
      expectRows:
        - id: 9
          amount: 100
          label: a
          memo: { note: n9 }
          from_z: "2024-01-01T00:00:00.000000Z"
          thru_z: "2024-04-01T00:00:00.000000Z"
          in_z: "2024-11-01T00:00:00.000000Z"
          out_z: infinity
    - uow: replaced
      write:
        - mutation: replaceUntil
          "on": 2
          entity: parallax.compatibility.SequenceSpan
          rows:
            - { id: 9, amount: 300, label: r, memo: { note: rr } }
          validFrom: "2024-03-01T00:00:00.000000Z"
          until: "2024-09-01T00:00:00.000000Z"
          at: "2024-11-03T00:00:00.000000Z"
      note: "the observed source replaces [March, September): both rectangles it reaches take its complete state, and both gaps of its window open with it, all of it one state and so one row"
    - uow: pending
      write:
        - mutation: insertUntil
          entity: parallax.compatibility.SequenceSpan
          rows:
            - { id: 8, amount: 100, label: a, memo: { note: n8a } }
          validFrom: "2024-01-01T00:00:00.000000Z"
          until: "2024-04-01T00:00:00.000000Z"
          at: "2024-11-04T00:00:00.000000Z"
        - mutation: replaceUntil
          "on": "/scenario/4/write/0"
          entity: parallax.compatibility.SequenceSpan
          rows:
            - { id: 8, amount: 300, label: r, memo: { note: rr } }
          validFrom: "2024-01-01T00:00:00.000000Z"
          until: "2024-06-01T00:00:00.000000Z"
          at: "2024-11-04T00:00:00.000000Z"
      note: "a still-pending insertion of span 8 is replaced through June: its own window, the gap before the stored rectangle, and the part of that rectangle the window reaches take the replacement as one row, and no state of the insert itself is ever stored"
