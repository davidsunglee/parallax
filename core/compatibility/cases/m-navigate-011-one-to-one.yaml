# Presence and a dotted field over a ONE-TO-ONE relationship (m-descriptor cardinality,
# m-predicate single-valued traversal).
model: models/person.yaml
tags: [m-navigate, navigate, relationship, one-to-one, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Person
    predicate:
      and:
        operands:
          - exists:
              path: parallax.compatibility.Person.passport
          - eq:
              path: parallax.compatibility.Person.passport.number
              value: P-AAA
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name from person t0 left join passport t1 on t1.person_id = t0.id where not t1.id is null and t1.number = ?
      binds: [P-AAA]
  referenceSql: select id, name from person where id in (select person_id from passport where number = 'P-AAA')
  rows:
    - { id: 1, name: Alan }
  databaseCalls: 1
