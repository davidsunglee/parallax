# A universal fails on any element its predicate does not make true and holds for an
# empty collection: [15] and [] match, [5, 25] and [0] do not.
model: models/predicate-collections.yaml
tags: [m-predicate, quantifier, scalar-collection, all, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Basket
    predicate:
      all:
        path: parallax.compatibility.Basket.scores
        where:
          greaterThan: {value: 10}
then:
  statements:
  - sql: {postgres: 'select t0.id, t0.label, t0.owner_id, not t0.tags is null, t0.tags, not t0.scores is null, t0.scores, not t0.prices is null, t0.prices, not t0.flags is null, t0.flags, not t0.parcels is null, t0.parcels, not t0.meta is null, t0.meta from basket t0 where not exists (select 1 from jsonb_array_elements(case when jsonb_typeof(t0.scores) = ? then t0.scores else cast(? as jsonb) end) t1 where not (case when jsonb_typeof(t1.value) = ? then cast(t1.value #>> ? as bigint) end > ?) is true)'}
    binds: [array, '[]', number, '{}', 10]
  graph:
    Basket:
    - id: 2
      label: two
      ownerId: null
      tags: []
      scores: []
      prices: []
      flags: []
      parcels: []
      meta: null
    - id: 3
      label: three
      ownerId: 2
      tags: [gift]
      scores: [15]
      prices: ['2.00', '3.00']
      flags: [false]
      parcels:
      - sku: c
        qty: 5
        notes: [urgent]
      meta:
        labels: []
  roundTrips: 1
