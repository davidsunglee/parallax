# A universal over a `many` value object: every parcel has a positive quantity, which
# the basket with no parcels satisfies and the one with a zero-quantity parcel does not.
model: models/predicate-collections.yaml
tags: [m-predicate, quantifier, all, m-value-object, to-many, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Basket
    predicate:
      all:
        path: parallax.compatibility.Basket.parcels
        where:
          greaterThan: {path: qty, value: 0}
then:
  statements:
  - sql: {postgres: 'select t0.id, t0.label, t0.owner_id, not t0.tags is null, t0.tags, not t0.scores is null, t0.scores, not t0.prices is null, t0.prices, not t0.flags is null, t0.flags, not t0.parcels is null, t0.parcels, not t0.meta is null, t0.meta from basket t0 where not exists (select 1 from jsonb_array_elements(case when jsonb_typeof(t0.parcels) = ? then t0.parcels else cast(? as jsonb) end) t1 where not (cast(jsonb_extract_path_text(t1.value, ?) as bigint) > ?) is true)'}
    binds: [array, '[]', qty, 0]
  graph:
    Basket:
    - id: 2
      label: two
      ownerId: null
      tags: []
      scores: []
      prices: []
      flags: []
      parcels: []
      meta: null
    - id: 3
      label: three
      ownerId: 2
      tags: [gift]
      scores: [15]
      prices: ['2.00', '3.00']
      flags: [false]
      parcels:
      - sku: c
        qty: 5
        notes: [urgent]
      meta:
        labels: []
    - id: 4
      label: four
      ownerId: 3
      tags: [urgent]
      scores: [0]
      prices: []
      flags: [true, false]
      parcels:
      - sku: d
        qty: 1
        notes: [urgent, x]
      meta: null
  roundTrips: 1
