# Relationship ADDITION and REMOVAL (m-model-evolution): the two directions of
# one boundary.
tags: [m-model-evolution, evolution, relationship, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-relationship-v1.yaml
    later: models/evolution-relationship-v2.yaml
then:
  evolution:
    kind: coordinated
    operations:
      - kind: RelationshipAdded
        relationship: parallax.compatibility.Folder.items
      - kind: RelationshipRemoved
        relationship: parallax.compatibility.Folder.notes
    behavioralImpacts: []
    overlapVisibleOperations: []
    coordinationRequirements:
      - operation:
          kind: RelationshipRemoved
          relationship: parallax.compatibility.Folder.notes
        reasons:
          - AuthoringSurfaceChangeRequired
