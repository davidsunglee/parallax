# Negative (m-metamodel): two Entity declarations resolve to one Entity Identity,
# each mapped to its own table.
model: models/person.yaml
tags: [m-metamodel, m-model-formation, m-descriptor, rejected, negative, slice-snapshot-1]
shape: rejected
when:
  model:
    entities:
      - name: Person
        table: person
        attributes:
          - { name: id, type: int64, primaryKey: true }
      - name: Person
        table: person_archive
        attributes:
          - { name: id, type: int64, primaryKey: true }
then:
  rejectedRule: metamodel-duplicate-entity-identity
