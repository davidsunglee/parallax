# A READLESS predicate write selects on a valueObject inner field, and its DML renders
# the extraction UNALIASED (m-batch-write, m-value-object, m-sql rule 1).
model: models/customer.yaml
tags: [m-batch-write, m-value-object, m-sql, m-unit-work, predicate-write, readless, nested, json, scenario, slice-snapshot-1]
shape: scenario
when:
  scenario:
    - write:
        mutation: delete
        target:
          entity: parallax.compatibility.Customer
          predicate:
            nestedEq: { path: parallax.compatibility.Customer.address.city, value: Boston }
      roundTrips: 1
      statements:
        - sql:
            postgres: delete from customer where jsonb_extract_path_text(address, ?) = ?
          binds: [city, Boston]
    - objectQuery:
        target: parallax.compatibility.Customer
        predicate:
          nestedEq:
            path: parallax.compatibility.Customer.address.city
            value: Boston
      roundTrips: 1
      statements:
        - sql:
            postgres: select t0.id, t0.name, not t0.address is null, t0.address from customer t0 where jsonb_extract_path_text(t0.address, ?) = ? for share of t0
          binds: [city, Boston]
      referenceSql: select id, name, address from customer where address ->> 'city' = 'Boston'
      expectRows: []
then:
  roundTrips: 2
