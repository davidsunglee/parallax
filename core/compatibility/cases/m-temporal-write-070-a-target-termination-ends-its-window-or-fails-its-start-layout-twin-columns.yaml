given:
  fixtures: true
when:
  uow:
    concurrency: optimistic
  scenario:
    - uow: unbounded
      write:
        - mutation: terminate
          entity: parallax.compatibility.SequenceSpan
          row: { id: 1 }
          ifTxStart: "2023-12-01T00:00:00.000000Z"
          validFrom: "2024-03-01T00:00:00.000000Z"
          at: "2024-11-01T00:00:00.000000Z"
      note: "end span 1 from March through infinity under the milestone its caller observed; its coverage before March reopens"
    - uow: bounded
      write:
        - mutation: terminateUntil
          entity: parallax.compatibility.SequenceSpan
          row: { id: 2 }
          ifTxStart: "2023-12-01T00:00:00.000000Z"
          validFrom: "2024-03-01T00:00:00.000000Z"
          until: "2024-05-01T00:00:00.000000Z"
          at: "2024-11-02T00:00:00.000000Z"
      note: "end span 2 over [March, May) alone; its coverage on either side reopens"
    - uow: revised
      write:
        - mutation: terminate
          entity: parallax.compatibility.SequenceSpan
          row: { id: 4 }
          ifTxStart: "2023-12-01T00:00:00.000000Z"
          validFrom: "2024-03-01T00:00:00.000000Z"
          at: "2024-11-02T00:00:00.000000Z"
      note: "span 4's coverage at March stands at T1, so a caller stating T0 states a revision that no longer holds: the termination fails rather than ending nothing"
    - uow: missing
      write:
        - mutation: terminate
          entity: parallax.compatibility.SequenceSpan
          row: { id: 9 }
          ifTxStart: "2023-12-01T00:00:00.000000Z"
          validFrom: "2024-03-01T00:00:00.000000Z"
          at: "2024-11-02T00:00:00.000000Z"
      note: "no span 9 covers March at all, so its termination fails the same precondition"
then:
  units:
    unbounded: { outcome: committed }
    bounded: { outcome: committed }
    revised:
      outcome: rolledBack
      flushFailure:
        at: commit
        entity: parallax.compatibility.SequenceSpan
        key: { id: 4 }
        shortfall: failedPrecondition
    missing:
