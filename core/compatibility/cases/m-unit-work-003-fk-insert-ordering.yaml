# Foreign-key insert ordering (m-unit-work): a parent row is inserted BEFORE a child that
# references it.
model: models/orders.yaml
tags: [m-unit-work, m-sql, write-sequence, insert, fk-ordering, slice-snapshot-1, slice-managed-1]
shape: writeSequence
when:
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.Order
      statements: 1
      note: insert the parent Order first (the referenced row)
      rows:
        - { id: 100, name: Hopper, sku: X-1, qty: 1, price: "9.99", active: true, orderedOn: "2024-07-01" }
    - mutation: insert
      entity: parallax.compatibility.OrderItem
      statements: 1
      note: then insert the child OrderItem whose order_id references it
      rows:
        - { id: 200, orderId: 100, sku: X-1, quantity: 3 }
then:
  statements:
    - sql:
        postgres: insert into orders(id, name, sku, qty, price, active, ordered_on) values (?, ?, ?, ?, ?, ?, ?)
      binds: [100, Hopper, X-1, 1, "9.99", true, 2024-07-01]
    - sql:
        postgres: insert into order_item(id, order_id, sku, quantity) values (?, ?, ?, ?)
      binds: [200, 100, X-1, 3]
  tableState:
    orders:
      - { id: 100, name: Hopper, sku: X-1, qty: 1, price: "9.99", active: true, ordered_on: 2024-07-01 }
    order_item:
      - { id: 200, order_id: 100, sku: X-1, quantity: 3, shipped_on: null }
  roundTrips: 2
