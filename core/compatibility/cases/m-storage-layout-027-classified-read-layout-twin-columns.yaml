# Columns half of the cross-layout classification proof: one production descriptor,
# fixture, and Object Query publish four result positions whose stored state a read
# must judge identically under either layout. Its twin authors the same operation,
# the same graph, and the same diagnoses under Relational Document Layout; only the
# physical projection differs.
#
# `profile.street` is required, so a stored profile omitting it contradicts the
# model and still hydrates: nothing has to be invented, because the normative
# absence collapse answers what the member reads as. The published occurrence
# carries the members the document held, and a required leaf is not one of the two
# positions publication carries regardless, so `street` is absent from it rather
# than rendered as a null the document never stored — the hydratable half of
# classification, at both positions a root can carry it. Position
# 0 is invalid through an INCLUDED node (child 11), position 1 at the ROOT itself,
# and position 2 through both at once, which is what shows one record carrying the
# diagnoses of every node its own include tree reached. Position 3 is the
# corruption below. Every diagnosis names the concrete Entity it was found
# on, the member path inside the occurrence, and the affected object's own key.
#
# Position 3 no longer conforms: `given.corrupt` writes a JSON null over its own
# `profile.street` once the conforming fixtures have loaded, which is the stored
# state a fixture cannot author at all — a null at a required leaf is refused by the
# canonical-literal oracle before a case runs. It hydrates too, through the normative
# NULL collapse rather than the absence one, and the difference is observable: the
# published occurrence carries `street` as null where an omitted one carries no key,
# so `stored-data-required-member-null` and `stored-data-required-member-absent` are
# told apart by what the value looks like and not only by the code. Both halves of
# this pair state the corruption identically, because what it names is a logical
# location and a stored value — the layout decides where that lands and changes
# neither the verdict nor the published shape.
model: models/classification-transparency-layout-twin-columns.yaml
tags: [m-storage-layout, m-snapshot-read, m-document-codec, read, layout-twin, columns, slice-snapshot-1]
shape: read
given:
  corrupt:
    - entity: parallax.compatibility.ClassificationTwinItem
      key: 4
      member: [profile, street]
      value: null
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "deep-fetch child level - the ClassificationTwinItem.children IN-list binds are the distinct item ids gathered from the root query result"
when:
  objectQuery:
    target: parallax.compatibility.ClassificationTwinItem
    predicate:
      all: {}
    orderBy:
      - attr: parallax.compatibility.ClassificationTwinItem.id
        direction: asc
    includes:
      - segments:
          - rel: parallax.compatibility.ClassificationTwinItem.children
then:
  statements:
    - sql:
        postgres: select t0.id, not t0.profile is null, t0.profile from classification_twin t0 order by t0.id asc
        mariadb: select t0.id, not t0.profile is null, t0.profile from classification_twin t0 order by t0.id asc
    - sql:
        postgres: select t0.id, t0.item_id, not t0.profile is null, t0.profile from classification_twin_child t0 where t0.item_id in (?, ?, ?, ?) order by t0.id asc
        mariadb: select t0.id, t0.item_id, not t0.profile is null, t0.profile from classification_twin_child t0 where t0.item_id in (?, ?, ?, ?) order by t0.id asc
      binds: [1, 2, 3, 4]
  graph:
    ClassificationTwinItem:
      - id: 1
        profile: { street: 1 Main, city: null }
        children:
          - { id: 11, itemId: 1, profile: { city: Berlin } }
      - id: 2
        profile: { city: Oslo }
        children:
          - { id: 12, itemId: 2, profile: { street: 12 Main, city: null } }
      - id: 3
        profile: { city: Berlin }
        children:
          - { id: 13, itemId: 3, profile: { city: Oslo } }
      - id: 4
        profile: { street: null, city: Boston }
        children:
          - { id: 14, itemId: 4, profile: { street: 14 Main, city: null } }
  storedDataIssues:
    - ordinal: 0
      hydrated: true
      issues:
        - code: stored-data-required-member-absent
          entity: parallax.compatibility.ClassificationTwinChild
          member: parallax.compatibility.ClassificationTwinChild.profile.street
          objectKey: { entity: parallax.compatibility.ClassificationTwinChild, key: { id: 11 } }
    - ordinal: 1
      hydrated: true
      issues:
        - code: stored-data-required-member-absent
          entity: parallax.compatibility.ClassificationTwinItem
          member: parallax.compatibility.ClassificationTwinItem.profile.street
          objectKey: { entity: parallax.compatibility.ClassificationTwinItem, key: { id: 2 } }
    - ordinal: 2
      hydrated: true
      issues:
        - code: stored-data-required-member-absent
          entity: parallax.compatibility.ClassificationTwinChild
          member: parallax.compatibility.ClassificationTwinChild.profile.street
          objectKey: { entity: parallax.compatibility.ClassificationTwinChild, key: { id: 13 } }
        - code: stored-data-required-member-absent
          entity: parallax.compatibility.ClassificationTwinItem
          member: parallax.compatibility.ClassificationTwinItem.profile.street
          objectKey: { entity: parallax.compatibility.ClassificationTwinItem, key: { id: 3 } }
    - ordinal: 3
      hydrated: true
      issues:
        - code: stored-data-required-member-null
          entity: parallax.compatibility.ClassificationTwinItem
          member: parallax.compatibility.ClassificationTwinItem.profile.street
          objectKey: { entity: parallax.compatibility.ClassificationTwinItem, key: { id: 4 } }
  roundTrips: 2
