model: models/customer.yaml
tags: [m-predicate, m-value-object, rejected, negative, matching, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  objectQuery:
    target: parallax.compatibility.Customer
    predicate:
      exists:
        path: parallax.compatibility.Customer.address.geo
        where:
          eq: {path: country, value: US}
then:
  rejectedRule: path-target-kind-mismatch
