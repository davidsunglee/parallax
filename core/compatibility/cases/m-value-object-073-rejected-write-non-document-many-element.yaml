# Negative (m-value-object write validation, resolved Q7): a NON-DOCUMENT element inside
# a `many` occurrence's array is refused PRE-SQL.
#
# A `many` occurrence binds an array of DOCUMENTS, so the array's shape being right does
# not settle the elements'. Contact's `address.phones` is a `many` occurrence; this write
# binds a well-formed one-element array whose element is the string `"555"` rather than a
# phone document. The distinction from m-value-object-072 is where the defect sits — the
# occurrence's own value there, one element of it here — and both name the same rule,
# because an element that is not a document is a value its declared position cannot hold.
model: models/contact.yaml
tags: [m-value-object, rejected, negative, write, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  write:
    id: 1
    name: Acme
    address:
      street: 1 Main St
      city: Oslo
      geo:
        country: "NO"
        point: { lat: 59.9, lon: 10.7 }
      phones: ["555"]
then:
  rejectedRule: write-value-type-mismatch
