# Negative (m-relationship): a many-to-one direction, whose target Multiplicity is
# One, declares an ordering.
model: models/identifier-types.yaml
tags: [m-relationship, m-model-formation, relationship, rejected, slice-snapshot-1]
shape: rejected
when:
  model:
    entities:
      - name: Child
        table: child
        attributes:
          - {name: id, type: int64, primaryKey: true}
          - {name: parentId, type: int64}
        relationships:
          - name: parent
            cardinality: many-to-one
            join: {source: parentId, target: {entity: Parent, attribute: id}}
            orderBy:
              - {attribute: id}
      - name: Parent
        table: parent
        attributes:
          - {name: id, type: int64, primaryKey: true}
then:
  rejectedRule: relationship-order-on-to-one
