# Negative (m-metamodel): an authored Index names an As-Of Axis endpoint of its own
# Bitemporal Entity. Every Index of a temporal Table already ends with the derived
# axis ends, so an authored endpoint component is refused wherever it stands.
# The document is otherwise valid, so the refusal is Model Formation's.
model: models/person.yaml
tags: [m-metamodel, m-model-formation, m-descriptor, rejected, negative, index, temporal, bitemporal, slice-snapshot-1]
shape: rejected
when:
  model:
    entity:
      name: Tariff
      table: tariff
      temporality: bitemporal
      attributes:
        - { name: id, type: int64, primaryKey: true }
        - { name: code, type: string, maxLength: 32 }
      indices:
        - { name: tariff_audit, attributes: [code, txEnd] }
then:
  rejectedRule: metamodel-index-temporal-attribute
