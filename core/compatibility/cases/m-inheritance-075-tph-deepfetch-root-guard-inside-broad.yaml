# A path-root guard SUBSUMED by a broad path beside it still costs its own statement
# (m-deep-fetch, m-inheritance).
model: models/animal.yaml
tags: [m-deep-fetch, m-inheritance, m-predicate, m-object-query, m-sql, table-per-hierarchy, narrow, deep-fetch, familyVariant, slice-snapshot-1, slice-managed-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "deep-fetch child levels - the broad and the Dog-guarded owner hops each bind their person-table IN-list from owner ids gathered from the root query result, so the child emissions depend on a query result"
when:
  objectQuery:
    target: parallax.compatibility.Animal
    predicate:
      all: {}
    includes:
      - segments:
          - rel: parallax.compatibility.Animal.owner
      - appliesTo:
          - parallax.compatibility.Dog
        segments:
          - rel: parallax.compatibility.Animal.owner
then:
  statements:
    - sql:
        postgres: select t0.id, t0.kind, t0.name, t0.owner_id, t0.license_id, t0.indoor, t0.bark_volume, t0.tusk_length from animal t0
    - sql:
        postgres: select t0.id, t0.name from person t0 where t0.id = any(?)
      binds: [[10, 11, 12]]
    - sql:
        postgres: select t0.id, t0.name from person t0 where t0.id = any(?)
      binds: [[10, 11]]
  referenceSql: select id, kind, name, owner_id, license_id, indoor, bark_volume, tusk_length from animal
  graph:
    Animal:
      - id: 1
        name: Rex
        ownerId: 10
        licenseId: L-100
        barkVolume: 7
        indoor: null
        tuskLength: null
        familyVariant: Dog
        owner: { id: 10, name: Alice }
      - id: 2
        name: Fido
        ownerId: 11
        licenseId: L-101
        barkVolume: 3
        indoor: null
        tuskLength: null
        familyVariant: Dog
        owner: { id: 11, name: Bob }
      - id: 3
        name: Whiskers
        ownerId: 10
        licenseId: L-200
        barkVolume: null
        indoor: true
        tuskLength: null
        familyVariant: Cat
        owner: { id: 10, name: Alice }
      - id: 4
        name: Tusker
        ownerId: 12
        licenseId: null
        barkVolume: null
        indoor: null
        tuskLength: "12.50"
        familyVariant: WildBoar
        owner: { id: 12, name: Carol }
  roundTrips: 3
