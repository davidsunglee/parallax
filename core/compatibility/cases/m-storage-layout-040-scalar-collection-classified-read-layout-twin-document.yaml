# Relational Document Layout half of the scalar collection classification proof:
# the same logical corruptions, addressed inside the shared `payload` document,
# publish the same invalid roots and the same diagnoses.
model: models/scalar-collection-layout-twin-document.yaml
tags: [m-storage-layout, m-snapshot-read, m-document-codec, read, stored-data, corrupt, layout-twin, document-layout, graph, slice-snapshot-1]
shape: read
given:
  corrupt:
    - entity: parallax.compatibility.CollectionTwinItem
      key: 1
      member: [tags, 1]
      value: 5
    - entity: parallax.compatibility.CollectionTwinItem
      key: 2
      member: [parts]
      value: [{ sku: e, marks: "7" }]
when:
  objectQuery:
    target: parallax.compatibility.CollectionTwinItem
    predicate:
      all: {}
    orderBy:
      - attr: parallax.compatibility.CollectionTwinItem.id
        direction: asc
then:
  statements:
    - sql:
        postgres: select t0.id, not t0.payload is null, t0.payload from collection_twin t0 order by t0.id asc
        mariadb: select t0.id, not t0.payload is null, t0.payload from collection_twin t0 order by t0.id asc
  graph:
    CollectionTwinItem:
      - null
      - null
  storedDataIssues:
    - ordinal: 0
      hydrated: false
      issues:
        - code: stored-data-leaf-undecodable
          entity: parallax.compatibility.CollectionTwinItem
          member: parallax.compatibility.CollectionTwinItem.tags
          objectKey: { entity: parallax.compatibility.CollectionTwinItem, key: { id: 1 } }
    - ordinal: 1
      hydrated: false
      issues:
        - code: stored-data-leaf-undecodable
          entity: parallax.compatibility.CollectionTwinItem
          member: parallax.compatibility.CollectionTwinItem.parts.marks
          objectKey: { entity: parallax.compatibility.CollectionTwinItem, key: { id: 2 } }
  roundTrips: 1
