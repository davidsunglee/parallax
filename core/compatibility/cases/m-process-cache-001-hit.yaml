# Cache-hit scenario (m-process-cache): two identical finds cost ONE Database Call.
model: models/account.yaml
tags: [m-process-cache, query cache, cache-hit, scenario]
shape: scenario
when:
  scenario:
    - objectQuery:
        target: parallax.compatibility.Account
        predicate:
          eq:
            path: parallax.compatibility.Account.id
            value: 1
      databaseCalls: 1
      note: cache MISS — execute the find once against the database
      statements:
        - sql:
            postgres: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.id = ?
          binds: [1]
      expectRows:
        - { id: 1, owner: Ada, balance: "100.00", version: 1 }
    - objectQuery:
        target: parallax.compatibility.Account
        predicate:
          eq:
            path: parallax.compatibility.Account.id
            value: 1
      databaseCalls: 0
      sameObjectAs: 0
      note: cache HIT — same query, served from the query cache, zero Database Calls
      expectRows:
        - { id: 1, owner: Ada, balance: "100.00", version: 1 }
then:
  databaseCalls: 1
