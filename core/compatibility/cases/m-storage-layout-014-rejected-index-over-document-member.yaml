# Negative (m-storage-layout): a Secondary Index names a document-resident
# Attribute, which has no Column to index.
model: models/member-column-defaults.yaml
tags: [m-storage-layout, m-model-formation, m-descriptor, rejected, negative, document-layout, index, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  model:
    entity:
      name: Order
      table: orders
      layout:
        document:
          column: payload
      attributes:
        - { name: id, type: int64, primaryKey: true }
        - { name: displayName, type: string }
      indices:
        - { name: byDisplayName, attributes: [displayName] }
then:
  rejectedRule: storage-layout-index-over-document-member
