# A predicate-selected deletion of a Transaction-Time-Only Entity is refused when it
# is prepared: each selected object's current milestone must be observed before it
# is closed, and one readless statement observes nothing.
model: models/balance.yaml
tags: [m-batch-write, m-temporal-write, rejected, predicate-write, temporal, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  write:
    mutation: delete
    target:
      entity: parallax.compatibility.Balance
      predicate:
        eq:
          path: parallax.compatibility.Balance.acctNum
          value: A-1
then:
  rejectedRule: set-based-write-target-unsupported
