# Negative (m-value-object write validation x m-case-format portable literal grammar):
# a decimal literal spelling NEGATIVE ZERO is out of space and refused pre-SQL.
#
# The exact decimal spelling m-document-codec fixes carries a `-` only for a value
# BELOW zero. Zero is not below zero, so `-0.00` names no member of `decimal(12,2)` —
# it is a spelling of a value whose one spelling is unsigned — and the value at a
# declared position that decodes to no member is `write-value-type-mismatch`. Every
# other member is absent-and-nullable, isolating the verdict to `amount`.
#
# The semantic distinction is that the grammar decides this, not a host decimal parser.
# `Decimal("-0.00")`, `BigDecimal("-0.00")`, and `strtod` all accept the spelling and
# answer a signed zero, so an implementation that delegates admits it and stores a
# value the encoding table cannot spell back — the round trip would answer `0.00`, a
# different document than the one written. The neighbouring `-0.01` IS in space and is
# not authored here; the boundary this case pins is the magnitude, not the sign.
model: models/document-codec.yaml
tags: [m-document-codec, m-value-object, rejected, negative, write, json, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  write:
    id: 141
    label: SignedZero
    profile:
      amount: "-0.00"
then:
  rejectedRule: write-value-type-mismatch
