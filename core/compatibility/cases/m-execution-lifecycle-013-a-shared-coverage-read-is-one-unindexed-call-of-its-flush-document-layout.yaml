model: models/shared-coverage-layout-twin-document.yaml
tags: [m-execution-lifecycle, m-unit-work, m-sql, m-temporal-write, m-read-lock, bitemporal, temporal, scenario, document, grouped-effect, slice-snapshot-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "the writes settle against the milestones a find step of their own unit of work observed (m-case-format 'Settling against a grouped find')"
given:
  fixtures: true
when:
  uow:
    concurrency: locking
  scenario:
    - uow: correct
      objectQuery:
        target: parallax.compatibility.CoverageSpan
        predicate:
          lessThan: { path: parallax.compatibility.CoverageSpan.id, value: 3 }
        orderBy:
          - { attr: parallax.compatibility.CoverageSpan.id, direction: asc }
        temporal: { transaction-time: { asOf: latest }, valid-time: { asOf: "2024-03-01T00:00:00.000000Z" } }
      databaseCalls: 1
      note: observe both spans' heads at March under the shared lock
      statements:
        - sql:
            postgres: select t0.id, t0.from_z, t0.thru_z, t0.in_z, t0.out_z, not t0.payload is null, t0.payload from coverage_span t0 where t0.id < ? and t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ? order by t0.id asc for share of t0
          binds: [3, "2024-03-01T00:00:00.000000Z", "2024-03-01T00:00:00.000000Z", infinity]
      expectRows:
        - { id: 1, amount: 100, label: a, from_z: "2024-01-01T00:00:00.000000Z", thru_z: "2024-06-01T00:00:00.000000Z", in_z: "2023-12-01T00:00:00.000000Z", out_z: infinity }
        - { id: 2, amount: 100, label: b, from_z: "2024-01-01T00:00:00.000000Z", thru_z: "2024-06-01T00:00:00.000000Z", in_z: "2023-12-01T00:00:00.000000Z", out_z: infinity }
    - uow: correct
      write:
        - { mutation: amend, "on": 0, entity: parallax.compatibility.CoverageSpan, rows: [{ id: 1, amount: 150 }], validFrom: "2024-03-01T00:00:00.000000Z", at: "2024-10-01T00:00:00.000000Z" }
        - { mutation: amend, "on": 0, entity: parallax.compatibility.CoverageSpan, rows: [{ id: 2, amount: 150 }], validFrom: "2024-03-01T00:00:00.000000Z", at: "2024-10-01T00:00:00.000000Z" }
      databaseCalls: 3
      note: one shared coverage read names both spans' uncovered June onward and share-locks both tails, after which both spans are ready and execute as one Write Group; each tail already holds 150 and is kept, so each span closes only its head, and both heads' closes, one grouped effect, precede one insert opening each span's head and amended middle; the two closes are one write call, which finishes before the insert's starts
      statements:
        - sql:
            postgres: update coverage_span t set out_z = v.c3 from unnest(cast(? as bigint[]), cast(? as timestamptz[]), cast(? as timestamptz[])) with ordinality v(c1, c2, c3, ord) where t.id = v.c1 and t.thru_z = v.c2 and t.out_z = ? returning v.ord
          binds:
            - [1, 2]
            - ["2024-06-01T00:00:00.000000Z", "2024-06-01T00:00:00.000000Z"]
            - ["2024-10-01T00:00:00.000000Z", "2024-10-01T00:00:00.000000Z"]
            - infinity
        - sql:
            postgres: insert into coverage_span(id, from_z, thru_z, in_z, out_z, payload) select * from unnest(cast(? as bigint[]), cast(? as timestamptz[]), cast(? as timestamptz[]), cast(? as timestamptz[]), cast(? as timestamptz[]), cast(? as jsonb[]))
          binds:
            - [1, 1, 2, 2]
            - ["2024-01-01T00:00:00.000000Z", "2024-03-01T00:00:00.000000Z", "2024-01-01T00:00:00.000000Z", "2024-03-01T00:00:00.000000Z"]
            - ["2024-03-01T00:00:00.000000Z", "2024-06-01T00:00:00.000000Z", "2024-03-01T00:00:00.000000Z", "2024-06-01T00:00:00.000000Z"]
            - ["2024-10-01T00:00:00.000000Z", "2024-10-01T00:00:00.000000Z", "2024-10-01T00:00:00.000000Z", "2024-10-01T00:00:00.000000Z"]
            - [infinity, infinity, infinity, infinity]
            - [{amount: 100, label: a}, {amount: 150, label: a}, {amount: 100, label: b}, {amount: 150, label: b}]
then:
  databaseCalls: 4
  tableState:
