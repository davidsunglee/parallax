# valueObject document WRITE under an OPTIMISTIC gate (m-value-object + m-opt-lock):
# a versioned UPDATE replaces the whole `address` document and advances the version
# exactly once, gated on the observed version.
model: models/subscriber.yaml
tags: [m-value-object, m-opt-lock, m-sql, conflict, json, slice-snapshot-1, slice-managed-1]
shape: conflict
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection concurrency/locking intent (shape:conflict)"
when:
  uow:
    concurrency: optimistic
  write:
    id: 1
    observedVersion: 1
    address:
      street: 9 Fjord Way
      city: Oslo
      geo:
        country: "NO"
then:
  statements:
    - sql:
        postgres: update subscriber set address = ?, version = ? where id = ? and version = ?
        mariadb: update subscriber set address = ?, version = ? where id = ? and version = ?
      binds:
        - street: 9 Fjord Way
          city: Oslo
          geo:
            country: "NO"
        - 2
        - 1
        - 1
  affectedRows: 1
  tableState:
    subscriber:
      - id: 1
        version: 2
        address:
          street: 9 Fjord Way
          city: Oslo
          geo:
            country: "NO"
  roundTrips: 2
