# Infinity-fallback temporal read: the second cross-dialect seam point.
model: models/balance.yaml
tags: [m-temporal-read, m-object-query, m-dialect, m-sql, as-of, audit-only, infinity-fallback]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Balance
    predicate:
      all: {}
    temporal:
      transaction-time:
        asOf: latest
then:
  statements:
    - sql:
        postgres: select t0.bal_id, t0.acct_num, t0.val, t0.in_z, t0.out_z from balance t0 where t0.out_z = ?
        mariadb: select t0.bal_id, t0.acct_num, t0.val, t0.in_z, t0.out_z from balance t0 where t0.out_z = ?
      binds: [infinity]
  referenceSql: select bal_id, acct_num, val, in_z, out_z from balance where out_z > '9000-01-01'
  rows:
    - { bal_id: 1, acct_num: A, val: "150.00", in_z: "2024-06-01T00:00:00.000000Z", out_z: infinity }
    - { bal_id: 2, acct_num: B, val: "200.00", in_z: "2024-02-01T00:00:00.000000Z", out_z: infinity }
  roundTrips: 1
