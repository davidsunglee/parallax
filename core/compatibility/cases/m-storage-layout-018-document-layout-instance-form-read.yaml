# An instance-form read of a document-mapped Entity materializes every member from
# the ONE Structured Column, occurrences included (m-storage-layout x m-sql x
# m-value-object), on Postgres AND MariaDB.
model: models/document-layout.yaml
tags: [m-storage-layout, m-value-object, m-sql, m-document-codec, read, json, nested, document-layout, materialization, graph, to-one, to-many, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Traveler
    predicate:
      nestedEq:
        path: parallax.compatibility.Traveler.address.geo.country
        value: 'NO'
then:
  statements:
    - sql:
        postgres: select t0.id, not t0.payload is null, t0.payload from traveler t0 where jsonb_extract_path_text(t0.payload, ?, ?, ?) = ?
        mariadb: select t0.id, not t0.payload is null, t0.payload from traveler t0 where json_value(t0.payload, ?) = ?
      binds:
        postgres: [address, geo, country, "NO"]
        mariadb: ['$.address.geo.country', "NO"]
  graph:
    Traveler:
      - id: 1
        displayName: Ada
        score: 7
        joinedOn: '2026-01-15'
        note: north wing
        address:
          city: Oslo
          geo:
            country: "NO"
        tags:
          - { label: founder }
          - { label: staff }
      - id: 2
        displayName: Bo
        score: 30
        joinedOn: '2025-12-31'
        note: null
        address:
          city: Bergen
          geo:
            country: "NO"
        tags: []
  roundTrips: 1
