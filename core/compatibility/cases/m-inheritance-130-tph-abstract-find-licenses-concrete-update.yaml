# An abstract table-per-hierarchy find licenses the CONCRETE subtype's own gated update
# (m-inheritance x m-opt-lock x m-unit-work).
model: models/vehicle.yaml
tags: [m-inheritance, m-opt-lock, m-unit-work, table-per-hierarchy, tag, scenario, slice-snapshot-1, slice-managed-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "the update's version gate is the version the group's own observing find returned - a query result (m-opt-lock, m-unit-work uow grouping)"
when:
  uow:
    concurrency: optimistic
  scenario:
    - uow: observe-and-update
      objectQuery:
        target: parallax.compatibility.Vehicle
        predicate:
          eq:
            attr: parallax.compatibility.Vehicle.id
            value: 1
      roundTrips: 1
      note: observe vehicle 1 through the abstract root; the row resolves to the concrete Car
      statements:
        - sql:
            postgres: select t0.id, t0.kind, t0.name, t0.version, t0.doors, t0.axles from vehicle t0 where t0.id = ?
          binds: [1]
      expectRows:
        - { id: 1, name: Sedan, version: 5, doors: 4, axles: null, familyVariant: Car }
    - uow: observe-and-update
      write:
        - mutation: update
          entity: parallax.compatibility.Car
          rows:
            - { id: 1, name: Coupe }
      roundTrips: 1
      note: no authored observedVersion - the gate binds the version step 0 observed
      statements:
        - sql:
            postgres: update vehicle set name = ?, version = ? where id = ? and kind = ? and version = ?
          binds: [Coupe, 6, 1, car, 5]
    - uow: observe-and-update
      objectQuery:
        target: parallax.compatibility.Car
        predicate:
          eq:
            attr: parallax.compatibility.Car.id
            value: 1
      roundTrips: 1
      note: read the renamed row back as the concrete the write named; the group COMMITS after this
      statements:
        - sql:
            postgres: select t0.id, t0.name, t0.version, t0.doors from vehicle t0 where t0.id = ? and t0.kind = ?
          binds: [1, car]
      expectRows:
        - { id: 1, name: Coupe, version: 6, doors: 4 }
then:
  roundTrips: 3
