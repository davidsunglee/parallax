# Value Object occurrence NULLABILITY (m-model-evolution): both directions of one
# boundary in one evolution.
tags: [m-model-evolution, evolution, value-object, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-vo-nullability-v1.yaml
    later: models/evolution-vo-nullability-v2.yaml
then:
  evolution:
    kind: coordinated
    operations:
      - kind: ValueObjectOccurrenceAltered
        valueObject: parallax.compatibility.Parcel.courier
        deltas:
          - kind: NullabilityChanged
            earlier: true
            later: false
      - kind: ValueObjectOccurrenceAltered
        valueObject: parallax.compatibility.Parcel.origin
        deltas:
          - kind: NullabilityChanged
            earlier: false
            later: true
    behavioralImpacts:
      - kind: ValueAdmissibilityChanged
        scope:
          valueObject: parallax.compatibility.Parcel.courier
        earlier:
          nullable: true
        later:
          nullable: false
        causedBy:
          - kind: ValueObjectOccurrenceAltered
            valueObject: parallax.compatibility.Parcel.courier
            deltas:
              - kind: NullabilityChanged
                earlier: true
                later: false
      - kind: ValueAdmissibilityChanged
        scope:
          valueObject: parallax.compatibility.Parcel.origin
        earlier:
          nullable: false
        later:
          nullable: true
        causedBy:
          - kind: ValueObjectOccurrenceAltered
            valueObject: parallax.compatibility.Parcel.origin
            deltas:
              - kind: NullabilityChanged
                earlier: false
                later: true
    overlapVisibleOperations: []
    coordinationRequirements:
      - operation:
          kind: ValueObjectOccurrenceAltered
          valueObject: parallax.compatibility.Parcel.courier
          deltas:
            - kind: NullabilityChanged
              earlier: true
              later: false
        reasons:
          - DatabaseMigrationRequired
