# A table-per-hierarchy family placed by its root: the binding keys the mapping
# owner, the Payment root, so a concrete CardPayment read selects the shared
# family table in `px_billing` and keeps the tag guard beside its predicate.
model: models/payment.yaml
binding:
  postgres:
    format_version: 1
    backend: postgres
    default: { schema: px }
    entities:
      parallax.compatibility.Payment: { schema: px_billing }
  mariadb:
    format_version: 1
    backend: mariadb
    default: { database: px }
    entities:
      parallax.compatibility.Payment: { database: px_billing }
tags: [m-database-binding, m-inheritance, m-sql, table-per-hierarchy, tag, binding, slice-snapshot-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.CardPayment
    predicate:
      greaterThan:
        path: parallax.compatibility.CardPayment.amount
        value: "60.00"
then:
  statements:
    - sql:
        postgres: select t0.id, t0.amount, t0.card_network from px_billing.payment t0 where t0.amount > ? and t0.kind = ?
        mariadb: select t0.id, t0.amount, t0.card_network from px_billing.payment t0 where t0.amount > ? and t0.kind = ?
      binds: ["60.00", card]
  referenceSql: select id, amount, card_network from px_billing.payment where amount > 60.00 and kind = 'card'
  rows:
    - { id: 1, amount: "100.00", card_network: Visa, _type: parallax.compatibility.CardPayment }
  databaseCalls: 1
