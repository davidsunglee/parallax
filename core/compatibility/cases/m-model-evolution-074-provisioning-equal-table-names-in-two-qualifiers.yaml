# Provisioning two owners that declare one table name (m-model-evolution,
# m-schema-delta, m-database-binding): the later binding places the audit ledger
# in its own schema, so the statements create two tables sharing the local name
# `ledger`, each qualified, ordered by local name and then qualifier.
tags: [m-model-evolution, m-schema-delta, m-database-binding, evolution, provisioning, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: null
    later: models/binding-ledgers.yaml
    laterBinding:
      postgres:
        format_version: 1
        backend: postgres
        default: { schema: px }
        entities:
          parallax.compatibility.AuditLedger: { schema: px_audit }
      mariadb:
        format_version: 1
        backend: mariadb
        default: { database: px }
        entities:
          parallax.compatibility.AuditLedger: { database: px_audit }
then:
  evolution:
    kind: unilateral
    operations:
      - { kind: EntityAdded, entity: parallax.compatibility.AuditLedger }
      - { kind: EntityAdded, entity: parallax.compatibility.SalesLedger }
    behavioralImpacts: []
    overlapVisibleOperations: []
    coordinationRequirements: []
  schema:
    postgres:
      delta:
        statements:
          - create table px.ledger (id bigint not null, amount numeric(18, 2) not null, primary key (id))
          - create table px_audit.ledger (id bigint not null, note varchar(64) not null, primary key (id))
        createdIndices: []
    mariadb:
      delta:
        statements:
          - create table px.ledger (id bigint not null, amount decimal(18,2) not null, primary key (id))
          - create table px_audit.ledger (id bigint not null, note varchar(64) not null, primary key (id))
        createdIndices: []
