# valueObject string filter: nestedLike carries the top-level pattern and case-folding
# semantics against a nested extraction (m-op-algebra nested string predicates, m-sql),
# on Postgres AND MariaDB.
#
# `address.city` is a `string` attribute, so the extraction is already the text the
# pattern matches and no cast is applied — the one flat `nested*` family member that
# takes none. `caseInsensitive: true` folds BOTH sides with `lower(...)`, so the
# authored `OSLO` matches the stored `Oslo` on Ada (1) and Linus (2); an implementation
# folding only the column, or only the bind, matches nothing. Boston (3) and Berlin (6)
# differ in more than case, and every not-present row extracts SQL NULL and is excluded
# — the null column (4), the missing key (5, 8, 9, 10), and the explicit JSON `null`
# leaf (7).
#
# Postgres binds one path segment then the pattern; MariaDB binds one '$.city' path
# then the pattern, so the hole structure diverges and `binds` is a per-dialect map.
# The oracle folds the other way — `upper(...) = 'OSLO'` rather than a lowered `like` —
# which is equivalent only because this pattern carries no wildcard.
model: models/customer.yaml
tags: [m-value-object, m-op-algebra, m-sql, m-dialect, nested, json, string, like, caseInsensitive, slice-snapshot-1, slice-managed-1]
shape: read
when:
  targetEntity: parallax.compatibility.Customer
  operation:
    nestedLike: { path: parallax.compatibility.Customer.address.city, value: OSLO, caseInsensitive: true }
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name from customer t0 where lower(jsonb_extract_path_text(t0.address, ?)) like lower(?)
        mariadb: select t0.id, t0.name from customer t0 where lower(json_value(t0.address, ?)) like lower(?)
      binds:
        postgres: [city, OSLO]
        mariadb: ['$.city', OSLO]
  referenceSql:
    postgres: select id, name from customer where upper(address ->> 'city') = 'OSLO'
    mariadb: select id, name from customer where upper(nullif(json_unquote(json_extract(address, '$.city')), 'null')) = 'OSLO'
  rows:
    - { id: 1, name: Ada }
    - { id: 2, name: Linus }
  roundTrips: 1
