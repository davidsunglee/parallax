# Two DISTINCT current Assignments carrying one authored unique code and the
# same Valid-Time end. The authored unique index is (code, thru_z, out_z), so
# the second insert repeats the whole key and is refused as a uniqueViolation,
# although its Valid-Time start differs. Distinct ids keep the primary key and
# the logical-key exclusion out of it.
model: models/temporal-authored-index.yaml
tags: [m-db-error, uniqueViolation, m-storage-layout, temporal, bitemporal, unique-index, slice-snapshot-1, slice-managed-1]
shape: error
then:
  statements:
    - sql:
        postgres: insert into assignment(id, code, label, rate, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?, ?)
        mariadb: insert into assignment(id, code, label, rate, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?, ?)
      binds: [1, Y, a, 100, "2024-01-01T00:00:00.000000Z", infinity, "2024-01-01T00:00:00.000000Z", infinity]
    - sql:
        postgres: insert into assignment(id, code, label, rate, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?, ?)
        mariadb: insert into assignment(id, code, label, rate, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?, ?)
      binds: [2, Y, b, 200, "2024-03-01T00:00:00.000000Z", infinity, "2024-03-01T00:00:00.000000Z", infinity]
  errorClass: uniqueViolation
  nativeCode:
    postgres: "23505"
    mariadb: 1062
