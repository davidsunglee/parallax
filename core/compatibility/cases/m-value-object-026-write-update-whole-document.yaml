# valueObject WHOLE-document UPDATE: an update REPLACES the entire document column,
# never a path inside it (m-value-object write, m-sql), on Postgres AND MariaDB.
model: models/customer.yaml
tags: [m-value-object, m-sql, write-sequence, update, json, nested, to-many, slice-snapshot-1, slice-managed-1]
shape: writeSequence
when:
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.Customer
      statements: 1
      note: seed a Customer with the original address document
      rows:
        - id: 200
          name: Ingrid
          address:
            street: 3 Old Road
            city: Bergen
            geo:
              country: "NO"
            phones:
              - { type: home, number: '555-1111' }
    - mutation: update
      entity: parallax.compatibility.Customer
      statements: 1
      note: replace the WHOLE address document (a different shape — proves no path-level merge)
      rows:
        - id: 200
          address:
            street: 9 New Way
            city: Stavanger
            phones:
              - { type: work, number: '555-2222' }
then:
  statements:
    - sql:
        postgres: insert into customer(id, name, address) values (?, ?, ?)
        mariadb: insert into customer(id, name, address) values (?, ?, ?)
      binds:
        - 200
        - Ingrid
        - street: 3 Old Road
          city: Bergen
          geo:
            country: "NO"
          phones:
            - { type: home, number: '555-1111' }
    - sql:
        postgres: update customer set address = ? where id = ?
        mariadb: update customer set address = ? where id = ?
      binds:
        - street: 9 New Way
          city: Stavanger
          phones:
            - { type: work, number: '555-2222' }
        - 200
  tableState:
    customer:
      - id: 200
        name: Ingrid
        address:
          street: 9 New Way
          city: Stavanger
          phones:
            - { type: work, number: '555-2222' }
  roundTrips: 3
