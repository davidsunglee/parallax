# `exists` over a TABLE-PER-CONCRETE-SUBTYPE polymorphic target NARROWED to an
# abstract subtype (m-navigate, m-predicate, m-inheritance, m-sql, resolved Q7 + Q10).
model: models/document.yaml
tags: [m-navigate, m-predicate, m-inheritance, m-sql, table-per-concrete-subtype, polymorphic, narrow, exists, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Folder
    predicate:
      exists:
        rel: parallax.compatibility.Folder.documents
        op:
          narrow:
            to:
              - parallax.compatibility.FinancialDocument
            operand:
              all: {}
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name from folder t0 where (exists (select 1 from invoice t1 where t1.folder_id = t0.id) or exists (select 1 from receipt t2 where t2.folder_id = t0.id))
  referenceSql: select id, name from folder where id in (select folder_id from invoice) or id in (select folder_id from receipt)
  rows:
    - { id: 100, name: Alpha }
    - { id: 101, name: Beta }
  roundTrips: 1
