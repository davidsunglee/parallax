# `exists` over a TABLE-PER-CONCRETE-SUBTYPE polymorphic target NARROWED to an
# abstract subtype (m-navigate, m-predicate, m-inheritance, m-sql, resolved Q7 + Q10).
model: models/document.yaml
tags: [m-navigate, m-predicate, m-inheritance, m-sql, table-per-concrete-subtype, polymorphic, narrow, exists, slice-snapshot-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Folder
    predicate:
      any:
        path: parallax.compatibility.Folder.documents
        where:
          narrow:
            to:
              - parallax.compatibility.FinancialDocument
            operand:
              "true": {}
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name from px.folder t0 where (exists (select 1 from px.invoice t1 where t1.folder_id = t0.id) or exists (select 1 from px.receipt t2 where t2.folder_id = t0.id))
  referenceSql: select id, name from px.folder where id in (select folder_id from px.invoice) or id in (select folder_id from px.receipt)
  rows:
    - { id: 100, name: Alpha }
    - { id: 101, name: Beta }
  databaseCalls: 1
