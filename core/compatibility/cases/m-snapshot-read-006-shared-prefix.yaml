# Snapshot graph, SHARED-PREFIX levels (m-snapshot-read): the canonical maximal
# include path materializes its prefix ONCE.
#
# The snapshot twin of the m-deep-fetch shared-prefix shape (no m-op-list tag). The
# include is the maximal `Order.items -> OrderItem.statuses` path; its
# `Order.items` prefix is materialized, so the level count is 3:
#   level 0 (root)     : all orders
#   level 1 (items)    : items keyed by the distinct order ids {1,2,3,4,5,42}
#   level 2 (statuses) : item-level statuses keyed by the distinct item ids
#                        {11,12,21,421,422}
# A naive materialization would fetch `Order.items` twice; the harness asserts
# exactly 3 statements, proving the snapshot shares the prefix.
model: models/orders.yaml
tags: [m-snapshot-read, m-object-query, m-deep-fetch, shared-prefix, relationship, graph, materialization, slice-snapshot-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "deep-fetch child levels - the shared Order.items IN-list binds are the distinct order ids the root query returned, and the OrderItem.statuses IN-list binds are the distinct item ids the items level returned, so both child emissions depend on a query result"
when:
  objectQuery:
    target: parallax.compatibility.Order
    predicate:
      all: {}
    includes:
      - segments:
          - rel: parallax.compatibility.Order.items
          - rel: parallax.compatibility.OrderItem.statuses
  equivalentEncodings:
    - target: parallax.compatibility.Order
      predicate:
        all: {}
      includes:
        - segments:
            - rel: parallax.compatibility.Order.items
        - segments:
            - rel: parallax.compatibility.Order.items
            - rel: parallax.compatibility.OrderItem.statuses
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0
    - sql:
        postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id in (?, ?, ?, ?, ?, ?) order by t0.id desc
      binds: [1, 2, 3, 4, 5, 42]
    - sql:
        postgres: select t0.id, t0.order_id, t0.order_item_id, t0.code from order_status t0 where t0.order_item_id in (?, ?, ?, ?, ?) order by t0.code asc
      binds: [11, 12, 21, 421, 422]
  referenceSql: select id, name, sku, qty, price, active, ordered_on from orders
  graph:
    Order:
      - id: 1
        name: Ada
        sku: A-100
        qty: 5
        price: "10.50"
        active: true
        orderedOn: 2024-01-05
        items:
          - id: 12
            orderId: 1
            sku: B-200
            quantity: 1
            shippedOn: 2024-02-15
            statuses:
              - { id: 203, orderId: 1, orderItemId: 12, code: PICKED }
          - id: 11
            orderId: 1
            sku: A-100
            quantity: 2
            shippedOn: null
            statuses:
              - { id: 202, orderId: 1, orderItemId: 11, code: PACKED }
              - { id: 201, orderId: 1, orderItemId: 11, code: PICKED }
      - id: 2
        name: Linus
        sku: B-200
        qty: 10
        price: "20.00"
        active: true
        orderedOn: 2024-02-10
        items:
          - id: 21
            orderId: 2
            sku: A-300
            quantity: 4
            shippedOn: 2024-02-20
            statuses: []
      - id: 3
        name: ada
        sku: A-300
        qty: 15
        price: "30.25"
        active: false
        orderedOn: 2024-03-15
        items: []
      - id: 4
        name: Margaret
        sku: null
        qty: 20
        price: "40.00"
        active: true
        orderedOn: 2024-04-20
        items: []
      - id: 5
        name: Alan
        sku: "C_50%"
        qty: 25
        price: "50.75"
        active: false
        orderedOn: 2024-05-25
        items: []
      - id: 42
        name: Grace
        sku: A-999
        qty: 30
        price: "99.99"
        active: true
        orderedOn: 2024-06-30
        items:
          - id: 422
            orderId: 42
            sku: B-200
            quantity: 5
            shippedOn: 2024-02-05
            statuses: []
          - id: 421
            orderId: 42
            sku: A-999
            quantity: 3
            shippedOn: 2024-03-10
            statuses:
              - { id: 204, orderId: 42, orderItemId: 421, code: PICKED }
  roundTrips: 3
