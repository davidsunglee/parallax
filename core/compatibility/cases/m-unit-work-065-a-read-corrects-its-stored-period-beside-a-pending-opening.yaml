model: models/position.yaml
tags: [m-unit-work, m-temporal-write, scenario, bitemporal, insertion, same-transaction-coalescing, slice-snapshot-1, slice-managed-1]
shape: scenario
grading: state
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "state-graded: the correcting unit of work composes several submissions into one flush, so no golden statement is stated to compile against (m-case-format 'State-graded scenarios')"
given:
  fixtures: true
when:
  uow:
    concurrency: optimistic
  scenario:
    - uow: seed
      write:
        - mutation: insertUntil
          entity: parallax.compatibility.Position
          rows:
            - { id: 7, acctNum: K, value: "100.00" }
          validFrom: "2024-01-01T00:00:00.000000Z"
          until: "2024-06-01T00:00:00.000000Z"
          at: "2024-11-01T00:00:00.000000Z"
      note: "position 7 is stored over [January, June)"
    - uow: corrected
      objectQuery:
        target: parallax.compatibility.Position
        predicate:
          eq:
            path: parallax.compatibility.Position.id
            value: 7
        temporal: { transaction-time: { asOf: latest }, valid-time: { asOf: "2024-03-01T00:00:00.000000Z" } }
      note: "observe position 7 at March, inside its stored period"
      expectRows:
        - pos_id: 7
          acct_num: K
          val: "100.00"
          from_z: "2024-01-01T00:00:00.000000Z"
          thru_z: "2024-06-01T00:00:00.000000Z"
          in_z: "2024-11-01T00:00:00.000000Z"
          out_z: infinity
    - uow: corrected
      write:
        - mutation: insertUntil
          entity: parallax.compatibility.Position
          rows:
            - { id: 7, acctNum: K, value: "300.00" }
          validFrom: "2024-08-01T00:00:00.000000Z"
          until: "2024-12-01T00:00:00.000000Z"
          at: "2024-11-02T00:00:00.000000Z"
        - mutation: amendUntil
          "on": 1
          entity: parallax.compatibility.Position
          rows:
            - { id: 7, value: "150.00" }
          validFrom: "2024-03-01T00:00:00.000000Z"
          until: "2024-05-01T00:00:00.000000Z"
          at: "2024-11-02T00:00:00.000000Z"
        - mutation: amendUntil
          "on": "/scenario/2/write/0"
          entity: parallax.compatibility.Position
          rows:
            - { id: 7, value: "350.00" }
          validFrom: "2024-08-01T00:00:00.000000Z"
          until: "2024-09-01T00:00:00.000000Z"
          at: "2024-11-02T00:00:00.000000Z"
      note: "an independent insertion opens [August, December) while the March read's correction of [March, May) is pending beside it: the correction revises only the stored period it observed, and only the edit through the insertion composes with the opening"
then:
  units:
    seed: { outcome: committed }
    corrected: { outcome: committed }
