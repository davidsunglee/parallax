model: models/position.yaml
tags: [m-temporal-write, m-opt-lock, m-unit-work, bitemporal, temporal, materialize, predicate-write, scenario, slice-snapshot-1]
shape: scenario
grading: state
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "state-graded: a predicate amendment's selection and the coverage its flush reads decide its statements, so no golden statement is stated to compile against (m-case-format 'State-graded scenarios')"
given:
  fixtures: true
when:
  uow:
    concurrency: optimistic
  scenario:
    - uow: spanning
      write:
        - mutation: amendUntil
          target:
            entity: parallax.compatibility.Position
            predicate: { eq: { attr: parallax.compatibility.Position.value, value: "100.00" } }
          assignments:
            - { attr: parallax.compatibility.Position.value, value: "300.00" }
          validFrom: "2024-03-01T00:00:00.000000Z"
          until: "2024-09-01T00:00:00.000000Z"
          at: "2024-10-01T00:00:00.000000Z"
      note: "position 1 is selected by [January, June) at 100 in March; the window also reaches [June, infinity) at 200, which the predicate does not match and the amendment changes all the same, so March through September holds one state and is one row"
    - uow: unmatched
      write:
        - mutation: amendUntil
          target:
            entity: parallax.compatibility.Position
            predicate: { eq: { attr: parallax.compatibility.Position.value, value: "200.00" } }
          assignments:
            - { attr: parallax.compatibility.Position.value, value: "400.00" }
          validFrom: "2024-02-01T00:00:00.000000Z"
          until: "2024-10-01T00:00:00.000000Z"
          at: "2024-10-02T00:00:00.000000Z"
      note: "in February position 1 holds 100, so nothing is selected, though its rectangle from September holds 200"
    - uow: unmatched
      objectQuery:
        target: parallax.compatibility.Position
        predicate: { eq: { attr: parallax.compatibility.Position.id, value: 1 } }
        temporal: { transaction-time: { asOf: latest }, valid-time: { asOf: "2024-07-01T00:00:00.000000Z" } }
      expectRows:
        - pos_id: 1
          acct_num: A
          val: "300.00"
          from_z: "2024-03-01T00:00:00.000000Z"
          thru_z: "2024-09-01T00:00:00.000000Z"
          in_z: "2024-10-01T00:00:00.000000Z"
          out_z: infinity
then:
  units:
    spanning: { outcome: committed }
    unmatched: { outcome: committed }
  tableState:
    position:
      - pos_id: 1
        acct_num: A
        val: "90.00"
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: infinity
        in_z: "2024-01-01T00:00:00.000000Z"
        out_z: "2024-04-01T00:00:00.000000Z"
      - pos_id: 1
        acct_num: A
        val: "100.00"
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: "2024-06-01T00:00:00.000000Z"
        in_z: "2024-04-01T00:00:00.000000Z"
        out_z: "2024-10-01T00:00:00.000000Z"
      - pos_id: 1
        acct_num: A
        val: "200.00"
        from_z: "2024-06-01T00:00:00.000000Z"
        thru_z: infinity
        in_z: "2024-04-01T00:00:00.000000Z"
        out_z: "2024-10-01T00:00:00.000000Z"
      - pos_id: 1
        acct_num: A
        val: "100.00"
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: "2024-03-01T00:00:00.000000Z"
        in_z: "2024-10-01T00:00:00.000000Z"
        out_z: infinity
      - pos_id: 1
        acct_num: A
        val: "300.00"
        from_z: "2024-03-01T00:00:00.000000Z"
        thru_z: "2024-09-01T00:00:00.000000Z"
        in_z: "2024-10-01T00:00:00.000000Z"
        out_z: infinity
      - pos_id: 1
        acct_num: A
        val: "200.00"
        from_z: "2024-09-01T00:00:00.000000Z"
        thru_z: infinity
        in_z: "2024-10-01T00:00:00.000000Z"
        out_z: infinity
