# Each reservation of a block of one advances by the increment size: 1000,
# 1005, then 1010.
model: models/pk-sequence.yaml
tags: [m-pk-gen, m-unit-work, sequence, write-sequence, slice-snapshot-1]
shape: writeSequence
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "the insert binds the keys a native reservation answers, so its emissions depend on a query result"
when:
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.Ticket
      statements: 1
      note: "1000"
      rows:
        - { tier: gold }
    - mutation: insert
      entity: parallax.compatibility.Ticket
      statements: 1
      note: "1005"
      rows:
        - { tier: silver }
    - mutation: insert
      entity: parallax.compatibility.Ticket
      statements: 1
      note: "1010"
      rows:
        - { tier: bronze }
then:
  statements:
    - purpose: reservation
      sql:
        postgres: select pg_catalog.nextval(t0.seqrelid) first_key, t0.seqincrement increment, t0.seqmin minimum, t0.seqmax maximum, t0.seqcycle cycles, pg_catalog.format_type(t0.seqtypid, null) data_type from pg_catalog.pg_sequence t0 where t0.seqrelid = pg_catalog.to_regclass(?)
        mariadb: select nextval(px.ticket_seq) first_key, t0.increment, t0.minimum_value minimum, t0.maximum_value maximum, t0.cycle_option cycles from px.ticket_seq t0
      binds:
        postgres: [px.ticket_seq]
        mariadb: []
    - sql:
        postgres: insert into px.ticket(id, tier) values (?, ?)
        mariadb: insert into px.ticket(id, tier) values (?, ?)
      binds: [1000, gold]
    - purpose: reservation
      sql:
        postgres: select pg_catalog.nextval(t0.seqrelid) first_key, t0.seqincrement increment, t0.seqmin minimum, t0.seqmax maximum, t0.seqcycle cycles, pg_catalog.format_type(t0.seqtypid, null) data_type from pg_catalog.pg_sequence t0 where t0.seqrelid = pg_catalog.to_regclass(?)
        mariadb: select nextval(px.ticket_seq) first_key, t0.increment, t0.minimum_value minimum, t0.maximum_value maximum, t0.cycle_option cycles from px.ticket_seq t0
      binds:
        postgres: [px.ticket_seq]
        mariadb: []
    - sql:
        postgres: insert into px.ticket(id, tier) values (?, ?)
        mariadb: insert into px.ticket(id, tier) values (?, ?)
      binds: [1005, silver]
    - purpose: reservation
      sql:
        postgres: select pg_catalog.nextval(t0.seqrelid) first_key, t0.seqincrement increment, t0.seqmin minimum, t0.seqmax maximum, t0.seqcycle cycles, pg_catalog.format_type(t0.seqtypid, null) data_type from pg_catalog.pg_sequence t0 where t0.seqrelid = pg_catalog.to_regclass(?)
        mariadb: select nextval(px.ticket_seq) first_key, t0.increment, t0.minimum_value minimum, t0.maximum_value maximum, t0.cycle_option cycles from px.ticket_seq t0
      binds:
        postgres: [px.ticket_seq]
        mariadb: []
    - sql:
        postgres: insert into px.ticket(id, tier) values (?, ?)
        mariadb: insert into px.ticket(id, tier) values (?, ?)
      binds: [1010, bronze]
  tableState:
    px:
      ticket:
        - { id: 1000, tier: gold }
        - { id: 1005, tier: silver }
        - { id: 1010, tier: bronze }
  databaseCalls: 6
