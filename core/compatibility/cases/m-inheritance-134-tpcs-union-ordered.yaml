# An ORDERED table-per-concrete-subtype `union all` read: the union becomes a derived
# table and the result-shape tail applies against its alias (m-inheritance, m-sql,
# m-object-query, m-dialect).
model: models/document.yaml
tags: [m-inheritance, m-object-query, m-sql, m-dialect, table-per-concrete-subtype, union-all, root, orderBy, ordering, nulls, nullable, directive, familyVariant, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Document
    predicate:
      all: {}
    orderBy:
      - attr: parallax.compatibility.Document.folderId
        direction: desc
        nulls: last
      - attr: parallax.compatibility.Document.title
        direction: asc
then:
  statements:
    - sql:
        postgres: select u.id, u.title, u.folder_id, u.currency, u.amount_due, u.body, u.paid_amount, u.family_variant from (select t0.id, t0.title, t0.folder_id, t0.currency, t0.amount_due, cast(null as varchar(64)) body, cast(null as decimal(18, 2)) paid_amount, 'Invoice' family_variant from invoice t0 union all select t0.id, t0.title, t0.folder_id, cast(null as varchar(3)) currency, cast(null as decimal(18, 2)) amount_due, t0.body, cast(null as decimal(18, 2)) paid_amount, 'Memo' family_variant from memo t0 union all select t0.id, t0.title, t0.folder_id, t0.currency, cast(null as decimal(18, 2)) amount_due, cast(null as varchar(64)) body, t0.paid_amount, 'Receipt' family_variant from receipt t0) u order by u.folder_id desc nulls last, u.title asc
        mariadb: select u.id, u.title, u.folder_id, u.currency, u.amount_due, u.body, u.paid_amount, u.family_variant from (select t0.id, t0.title, t0.folder_id, t0.currency, t0.amount_due, cast(null as char(64)) body, cast(null as decimal(18, 2)) paid_amount, 'Invoice' family_variant from invoice t0 union all select t0.id, t0.title, t0.folder_id, cast(null as char(3)) currency, cast(null as decimal(18, 2)) amount_due, t0.body, cast(null as decimal(18, 2)) paid_amount, 'Memo' family_variant from memo t0 union all select t0.id, t0.title, t0.folder_id, t0.currency, cast(null as decimal(18, 2)) amount_due, cast(null as char(64)) body, t0.paid_amount, 'Receipt' family_variant from receipt t0) u order by u.folder_id desc, u.title asc
  referenceSql: select id, title, folder_id, currency, amount_due, null as body, null as paid_amount, 'Invoice' as family_variant from invoice union all select id, title, folder_id, currency, null as amount_due, null as body, paid_amount, 'Receipt' as family_variant from receipt union all select id, title, folder_id, null as currency, null as amount_due, body, null as paid_amount, 'Memo' as family_variant from memo
  rows:
    - { id: 1, title: Invoice-A, folder_id: 100, currency: USD, amount_due: "120.00", body: null, paid_amount: null, familyVariant: Invoice }
    - { id: 2, title: Invoice-B, folder_id: 101, currency: EUR, amount_due: "80.00", body: null, paid_amount: null, familyVariant: Invoice }
    - { id: 1, title: Memo-A, folder_id: 102, currency: null, amount_due: null, body: Reminder, paid_amount: null, familyVariant: Memo }
    - { id: 1, title: Receipt-A, folder_id: 100, currency: USD, amount_due: null, body: null, paid_amount: "120.00", familyVariant: Receipt }
  roundTrips: 1
