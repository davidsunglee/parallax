# Document half of the inherited scalar collection write proof: the same writes
# store and patch the arrays in each table's shared document, which carries no
# member a sibling declares. Its twin authors the same writes under Columns.
model: models/scalar-collection-lifecycle-layout-twin-document.yaml
tags: [m-inheritance, m-storage-layout, m-document-codec, m-sql, m-unit-work, table-per-hierarchy, table-per-concrete-subtype, write-sequence, insert, update, json, layout-twin, document-layout, slice-snapshot-1, slice-managed-1]
shape: writeSequence
given:
  fixtures: true
when:
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.TagPhone
      statements: 1
      note: a concrete inserts the collections its root, abstract subtype, and own declaration contribute, and omits a sibling's
      rows:
        - { id: 3, tags: [n], numbers: [x, x], codes: ["00"] }
    - mutation: insert
      entity: parallax.compatibility.TagSaw
      statements: 1
      note: a table-per-concrete-subtype concrete writes its own table, its omitted inherited collection empty
      rows:
        - { id: 3, blades: [a] }
    - mutation: amend
      entity: parallax.compatibility.TagPhone
      statements: 1
      note: an amendment of the abstract subtype's and the concrete's own collections leaves the root's collection as stored
      rows:
        - { id: 1, ports: [9], numbers: [] }
then:
  statements:
    - sql:
        postgres: insert into tag_asset(id, kind, payload) values (?, ?, ?)
        mariadb: insert into tag_asset(id, kind, payload) values (?, ?, ?)
      binds:
        - 3
        - phone
        - { tags: [n], ports: [], numbers: [x, x], codes: ["00"] }
    - sql:
        postgres: insert into tag_saw(id, payload) values (?, ?)
        mariadb: insert into tag_saw(id, payload) values (?, ?)
      binds:
        - 3
        - { tags: [], blades: [a] }
    - sql:
        postgres: update tag_asset set payload = jsonb_set(jsonb_set(payload, ?, cast(? as jsonb)), ?, cast(? as jsonb)) where id = ? and kind = ?
        mariadb: update tag_asset set payload = json_set(payload, ?, json_extract(?, '$'), ?, json_extract(?, '$')) where id = ? and kind = ?
      binds:
        postgres: ['{ports}', [9], '{numbers}', [], 1, phone]
        mariadb: ['$.ports', [9], '$.numbers', [], 1, phone]
  tableState:
    tag_asset:
      - id: 1
        kind: phone
        payload: { tags: [a, a], ports: [9], numbers: [], codes: ["01ff"] }
      - id: 2
        kind: desk
        payload: { tags: [d], legs: [l, r] }
      - id: 3
        kind: phone
        payload: { tags: [n], ports: [], numbers: [x, x], codes: ["00"] }
    tag_drill:
      - id: 1
        payload: { tags: [t], bits: [8, 8] }
    tag_saw:
      - id: 2
        payload: { tags: [], blades: [rip] }
      - id: 3
        payload: { tags: [], blades: [a] }
  roundTrips: 4
