# Optimistic-lock success (m-opt-lock): a fresh-version UPDATE affects exactly ONE row.
model: models/account.yaml
tags: [m-opt-lock, m-sql, success, optimistic-lock-success, slice-snapshot-1, slice-managed-1]
shape: conflict
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection concurrency/locking intent (shape:conflict)"
when:
  uow:
    concurrency: optimistic
  write: { id: 2, balance: "500.00", observedVersion: 1 }
then:
  statements:
    - sql:
        postgres: update account set balance = ?, version = ? where id = ? and version = ?
      binds: ["500.00", 2, 2, 1]
  affectedRows: 1
  roundTrips: 2
  executionLifecycle:
    roots:
      - execution: 1
        kind: read
        events:
          - sequence: 1
            activity: 1
            parent: null
            readStarted: { target: parallax.compatibility.Account, interface: wire, edition: account }
          - sequence: 2
            activity: 2
            parent: 1
            acquisitionStarted: {}
          - sequence: 3
            activity: 2
            parent: 1
            acquisitionFinished: { outcome: acquired }
          - sequence: 4
            activity: 3
            parent: 1
            databaseCallStarted: { target: parallax.compatibility.Account, kind: read }
          - sequence: 5
            activity: 3
            parent: 1
            databaseCallFinished: { outcome: readCompleted, returnedRows: 1 }
          - sequence: 6
            activity: 4
            parent: 1
            releaseStarted: {}
          - sequence: 7
            activity: 4
            parent: 1
            releaseFinished: { cleanup: returned }
          - sequence: 8
            activity: 1
            parent: null
            readFinished: { outcome: completed }
      - execution: 2
        kind: transaction-invocation
        events:
          - sequence: 1
            activity: 1
            parent: null
            transactionInvocationStarted:
              invocation: outer
              concurrency: optimistic
              retries: 10
              retryOptimisticConflicts: false
              isolation: read-committed
          - sequence: 2
            activity: 2
            parent: 1
            transactionAttemptStarted: {edition: account}
          - sequence: 3
            activity: 3
            parent: 2
            acquisitionStarted: {}
          - sequence: 4
            activity: 3
            parent: 2
            acquisitionFinished: { outcome: acquired }
          - sequence: 5
            activity: 4
            parent: 2
            writeBatchStarted: { trigger: pre-commit }
          - sequence: 6
            activity: 5
            parent: 4
            databaseCallStarted:
              target: parallax.compatibility.Account
              kind: write
              statement: 0
          - sequence: 7
            activity: 5
            parent: 4
            databaseCallFinished: { outcome: writeCompleted, affectedRows: 1 }
          - sequence: 8
            activity: 4
            parent: 2
            writeBatchFinished: { outcome: completed }
          - sequence: 9
            activity: 6
            parent: 2
            releaseStarted: {}
          - sequence: 10
            activity: 6
            parent: 2
            releaseFinished: { cleanup: returned }
          - sequence: 11
            activity: 2
            parent: 1
            transactionAttemptFinished: { outcome: committed }
          - sequence: 12
            activity: 1
            parent: null
            transactionInvocationFinished: { outcome: committed }
  tableState:
    account:
      - { id: 1, owner: Ada, balance: "100.00", version: 1 }
      - { id: 2, owner: Linus, balance: "500.00", version: 2 }
      - { id: 3, owner: Grace, balance: "10.00", version: 1 }
