# A match reads the candidates visible at the read's coordinates. At valid time
# 2024-03-01, Coverage 10's visible milestone holds 600.00 (its later one holds
# 700.00), so claim 1000 matches; Coverage 20 holds 300.00.
model: models/policy.yaml
tags: [m-predicate, relationship, to-one, exists, matching, m-temporal-read, temporal, propagation, bitemporal, m-dialect, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Claim
    predicate:
      exists:
        path: parallax.compatibility.Claim.coverage
        where:
          eq: {path: amount, value: '600.00'}
    temporal:
      transaction-time: {asOf: latest}
      valid-time: {asOf: "2024-03-01T00:00:00.000000Z"}
then:
  statements:
  - sql: {postgres: 'select t0.id, t0.coverage_id, t0.reserve, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from claim t0 where exists (select 1 from coverage t1 where t1.id = t0.coverage_id and t1.amount = ? and t1.from_z <= ? and t1.thru_z > ? and t1.out_z = ?) and t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?', mariadb: 'select t0.id, t0.coverage_id, t0.reserve, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from claim t0 where exists (select 1 from coverage t1 where t1.id = t0.coverage_id and t1.amount = ? and t1.from_z <= ? and t1.thru_z > ? and t1.out_z = ?) and t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?'}
    binds: ['600.00', '2024-03-01T00:00:00.000000Z', '2024-03-01T00:00:00.000000Z', infinity, '2024-03-01T00:00:00.000000Z', '2024-03-01T00:00:00.000000Z', infinity]
  referenceSql: select id, coverage_id, reserve, from_z, thru_z, in_z, out_z from claim where coverage_id in (select id from coverage where amount = 600.00 and from_z <= '2024-03-01' and thru_z > '2024-03-01' and out_z > '9000-01-01') and from_z <= '2024-03-01' and thru_z > '2024-03-01' and out_z > '9000-01-01'
  rows:
  - {id: 1000, coverage_id: 10, reserve: '9000.00', from_z: '2024-01-01T00:00:00.000000Z', thru_z: infinity, in_z: '2024-01-01T00:00:00.000000Z', out_z: infinity}
  roundTrips: 1
