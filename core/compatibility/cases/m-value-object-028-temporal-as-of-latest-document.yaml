# valueObject on a UNITEMPORAL (Transaction-Time) owner: the document is visible per
# milestone — an as-of-NOW read returns each supplier's CURRENT address document
# (m-value-object "Inherited temporality", m-temporal-read), on Postgres AND MariaDB.
model: models/supplier.yaml
tags: [m-value-object, m-object-query, m-temporal-read, m-sql, nested, json, temporal, as-of, audit-only, materialization, graph, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Supplier
    predicate:
      all: {}
    temporal:
      transaction-time:
        asOf: latest
then:
  statements:
    - sql:
        postgres: select t0.sup_id, t0.name, t0.in_z, t0.out_z, not t0.address is null, t0.address from supplier t0 where t0.out_z = ?
        mariadb: select t0.sup_id, t0.name, t0.in_z, t0.out_z, not t0.address is null, t0.address from supplier t0 where t0.out_z = ?
      binds: [infinity]
  referenceSql: select sup_id, name, in_z, out_z from supplier where out_z > '9000-01-01'
  graph:
    Supplier:
      - id: 1
        name: Nordic Foods
        txStart: "2024-06-01T00:00:00.000000Z"
        txEnd: infinity
        address:
          street: 2 New Avenue
          city: Bergen
          geo:
            country: "NO"
          phones:
            - { type: work, number: '555-0200' }
      - id: 2
        name: Baltic Traders
        txStart: "2024-02-01T00:00:00.000000Z"
        txEnd: infinity
        address:
          street: 5 Port Road
          city: Riga
          geo:
            country: LV
          phones: []
  roundTrips: 1
