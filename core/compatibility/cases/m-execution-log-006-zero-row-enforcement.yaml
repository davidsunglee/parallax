# Zero-row enforcement after a COMPLETED call (m-execution-log): the shortfall is
# the attempt's failure, and the call it rejected is still a completion.
#
# `given.apply` removes wallet 2 out of band, so the unversioned keyed UPDATE
# addresses a row that no longer exists and affects none. The semantic
# distinction this case pins down is where that outcome is recorded. The port
# call succeeded: it reached the database, returned an affected-row count, and is
# therefore a `writeCompleted` of zero — NOT a `failed` completion, which is
# reserved for a call the port could not complete at all. What failed is the
# post-call enforcement, so the diagnostic lives on the attempt, and its
# `databaseCall` index points back at that same completed call rather than
# copying it. The sibling m-execution-log-005 is the other half of the
# distinction: there the call itself failed and the completion says so.
#
# Wallet declares no version column, so this write required no observation and no
# gate could have failed: the shortfall is the non-retriable missing target
# (m-unit-work), which the failure reports as `retryEligible: false`. That is the
# classifier's verdict, so a language MUST NOT retry it however much budget
# remains.
model: models/wallet.yaml
tags: [m-execution-log, m-unit-work, missing-target, slice-snapshot-1]
shape: conflict
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection concurrency/locking intent (given.apply, shape:conflict)"
given:
  apply:
    - sql: delete from wallet where id = 2
when:
  uow:
    concurrency: locking
  mutation: update
  write: { id: 2, balance: 250.00 }
then:
  statements:
    - sql:
        postgres: update wallet set balance = ? where id = ?
      binds: [250.00, 2]
  affectedRows: 0
  tableState:
    wallet:
      - { id: 1, owner: Ada, balance: 100.00 }
      - { id: 3, owner: Grace, balance: 10.00 }
  roundTrips: 1
  execution:
    transactionLog:
      concurrency: locking
      retryPolicy:
        maxRetries: 10
        retryOptimisticConflicts: false
      attempts:
        - status: rolled-back
          traces:
            - writeBatch:
                trigger: finalization
                calls:
                  - statement: 0
                    kind: write
                    completion:
                      writeCompleted:
                        affectedRows: 0
                roundTrips: 1
          roundTrips: 1
          failure:
            phase: finalization
            retryEligible: false
            databaseCall: 0
      roundTrips: 1
