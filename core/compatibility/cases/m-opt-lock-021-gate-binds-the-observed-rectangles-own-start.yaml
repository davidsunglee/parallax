# The optimistic gate binds the OBSERVED rectangle's own Transaction-Time start, taken
# from the same observation the close's address came from (m-opt-lock + m-bitemp-write
# "Address and gate are separate", m-unit-work "an observation is keyed by the
# milestone it observed").
#
# The sibling of m-bitemp-write-021: same fixtures, same close instant, same optimistic
# mode, and the OTHER of Position id 1's two current rectangles. This case names R3 by
# its own edge (`observedValidStart` 2024-06-01 with `observedTxStart` 2024-04-01)
# where -021 names R2's (2024-01-01 with the same 2024-04-01), so the two goldens
# differ by exactly one bind: `thru_z` infinity here, 2024-06-01 there. Both bind the
# same gate, because both rectangles share in_z.
#
# That shared gate is the semantic distinction this case adds. A gate is NOT a second,
# independent way to identify the milestone a close addresses: two rectangles of one
# key may carry the same in_z, so a gate bound from a misresolved observation matches
# the wrongly addressed row just as readily as the right one, and the close still
# reports 1 affected row. Address and gate therefore have to come from ONE resolved
# observation — which is what an edge-keyed observation guarantees and a
# primary-key-keyed one cannot. An implementation whose gate agreed with its address by
# construction, while both named a rectangle the write never observed, is
# non-conforming here even though every count it reports is right.
#
# The close inactivates exactly 1 row: `then.tableState` shows R3 closed at 2024-10-01
# with R1 and R2 untouched. As in -021 a conflict case runs only that single close, not
# the replacement INSERTs a full rectangle split would chain, so nothing re-opens the
# Valid-Time window R3 covered.
model: models/position.yaml
tags: [m-opt-lock, m-bitemp-write, m-unit-work, m-sql, bitemporal, temporal, conflict, slice-snapshot-1, slice-managed-1]
shape: conflict
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection concurrency/locking intent (shape:conflict)"
when:
  uow:
    concurrency: optimistic
  write: { id: 1 }
  at: "2024-10-01T00:00:00+00:00"
  observedTxStart: "2024-04-01T00:00:00+00:00"
  observedValidStart: "2024-06-01T00:00:00+00:00"
then:
  statements:
    - sql:
        postgres: update position set out_z = ? where pos_id = ? and thru_z = ? and out_z = ? and in_z = ?
        mariadb: update `position` set out_z = ? where pos_id = ? and thru_z = ? and out_z = ? and in_z = ?
      binds: ["2024-10-01T00:00:00+00:00", 1, infinity, infinity, "2024-04-01T00:00:00+00:00"]
  affectedRows: 1
  tableState:
    position:
      - pos_id: 1
        acct_num: A
        val: 90.00
        from_z: "2024-01-01T00:00:00+00:00"
        thru_z: infinity
        in_z: "2024-01-01T00:00:00+00:00"
        out_z: "2024-04-01T00:00:00+00:00"
      - pos_id: 1
        acct_num: A
        val: 100.00
        from_z: "2024-01-01T00:00:00+00:00"
        thru_z: "2024-06-01T00:00:00+00:00"
        in_z: "2024-04-01T00:00:00+00:00"
        out_z: infinity
      - pos_id: 1
        acct_num: A
        val: 200.00
        from_z: "2024-06-01T00:00:00+00:00"
        thru_z: infinity
        in_z: "2024-04-01T00:00:00+00:00"
        out_z: "2024-10-01T00:00:00+00:00"
