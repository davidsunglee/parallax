# Deep fetch Coverage.policy — a to-ONE temporal hop (many-to-one back-reference),
# Valid Time LATEST / Transaction Time LATEST. The single-object attach path: each
# coverage's `policy` is the propagated-as-of Policy milestone. Root Coverage
# resolves to the fully-Latest coverages (10 -> 700, 20 -> 300); the propagated
# pin fetches policies 1 and 2 (`id in (?, ?) and thru_z = ? and out_z = ?`),
# attached as single objects.
model: models/policy.yaml
tags: [m-navigate, m-object-query, m-temporal-read, temporal, relationship, propagation, bitemporal, to-one, slice-snapshot-1, slice-managed-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "deep-fetch child level - the Coverage.policy IN-list binds are the distinct policy ids gathered from the root query result, so the child emissions depend on a query result"
when:
  objectQuery:
    target: parallax.compatibility.Coverage
    predicate:
      all: {}
    temporal:
      transaction-time:
        asOf: latest
      valid-time:
        asOf: latest
    includes:
      - segments:
          - rel: parallax.compatibility.Coverage.policy
then:
  statements:
    - sql:
        postgres: select t0.id, t0.policy_id, t0.amount, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from coverage t0 where t0.thru_z = ? and t0.out_z = ?
      binds: [infinity, infinity]
    - sql:
        postgres: select t0.id, t0.name, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from policy t0 where t0.id in (?, ?) and t0.thru_z = ? and t0.out_z = ?
      binds: [1, 2, infinity, infinity]
  graph:
    Coverage:
      - id: 10
        policyId: 1
        amount: 700.00
        validStart: "2024-06-01T00:00:00+00:00"
        validEnd: infinity
        txStart: "2024-04-01T00:00:00+00:00"
        txEnd: infinity
        policy: { id: 1, name: Auto, validStart: "2024-01-01T00:00:00+00:00", validEnd: infinity, txStart: "2024-01-01T00:00:00+00:00", txEnd: infinity }
      - id: 20
        policyId: 2
        amount: 300.00
        validStart: "2024-01-01T00:00:00+00:00"
        validEnd: infinity
        txStart: "2024-01-01T00:00:00+00:00"
        txEnd: infinity
        policy: { id: 2, name: Home, validStart: "2024-01-01T00:00:00+00:00", validEnd: infinity, txStart: "2024-01-01T00:00:00+00:00", txEnd: infinity }
  roundTrips: 2
