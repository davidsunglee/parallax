# A narrow nested under a boolean combinator lowers independently in each TPCS branch.
# Each narrow's predicate evaluates only in the selected concrete branches and lowers
# to false in every other branch, unlike an ordinary predicate shared by all branches.
model: models/document-layout.yaml
tags: [m-inheritance, m-storage-layout, m-sql, m-dialect, m-document-codec, m-predicate, table-per-concrete-subtype, document-layout, union-all, narrow, predicate, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Publication
    predicate:
      or:
        operands:
          - narrow:
              to:
                - parallax.compatibility.Book
              operand:
                greaterThan:
                  attr: parallax.compatibility.Book.pages
                  value: 300
          - narrow:
              to:
                - parallax.compatibility.Film
              operand:
                greaterThan:
                  attr: parallax.compatibility.Film.minutes
                  value: 100
then:
  statements:
    - sql:
        postgres: select t0.id, not t0.payload is null, t0.payload, 'Book' family_variant from publication_book t0 where cast(jsonb_extract_path_text(t0.payload, ?) as bigint) > ? or 1 = 0 union all select t0.id, not t0.payload is null, t0.payload, 'Film' family_variant from publication_film t0 where 1 = 0 or cast(jsonb_extract_path_text(t0.payload, ?) as bigint) > ?
        mariadb: select t0.id, not t0.payload is null, t0.payload, 'Book' family_variant from publication_book t0 where cast(json_value(t0.payload, ?) as signed) > ? or 1 = 0 union all select t0.id, not t0.payload is null, t0.payload, 'Film' family_variant from publication_film t0 where 1 = 0 or cast(json_value(t0.payload, ?) as signed) > ?
      binds:
        postgres: [pages, 300, minutes, 100]
        mariadb: ['$.pages', 300, '$.minutes', 100]
  rows:
    - { id: 10, title: Systems, detail: ISBN-10, pages: 320, minutes: null, familyVariant: Book }
  roundTrips: 1
