# Negating the two-hop narrowing: a missing collar or pet complements to true, while
# Fido's unknown bark matches neither form.
model: models/predicate-traversal.yaml
tags: [m-predicate, narrow, relationship, to-one, m-inheritance, traversal, negation, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Leash
    predicate:
      not:
        operand:
          narrow:
            path: parallax.compatibility.Leash.collar.pet
            to: [parallax.compatibility.Dog]
            operand:
              greaterThan: {path: barkVolume, value: 5}
then:
  statements:
  - sql: {postgres: 'select t0.id, t0.collar_id from traversal_leash t0 left join traversal_collar t1 on t1.id = t0.collar_id left join traversal_pet t2 on t2.id = t1.pet_id where not case when not t2.id is null and t2.kind = ? then t2.bark_volume > ? else false end'}
    binds: [dog, 5]
  referenceSql: select id, collar_id from traversal_leash where collar_id is null or collar_id in (select id from traversal_collar where pet_id is null)
  rows:
  - {id: 21, collar_id: 13}
  - {id: 22, collar_id: null}
  roundTrips: 1
