# Write sequence: plain (UNBOUNDED) bitemporal update — the everyday correction
# (Reladomo testUpdateLaterBusinesDay). A value is corrected from a Valid-Time
# instant B ONWARD, with no upper Valid-Time bound: the new value holds for
# [B, infinity) while the audit trail is preserved on the Transaction-Time dimension.
model: models/position.yaml
tags: [m-bitemp-write, m-sql, bitemporal, temporal, write-sequence, plain-update-split, slice-snapshot-1, slice-managed-1]
shape: writeSequence
when:
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.Position
      statements: 1
      note: open the original Latest rectangle [valid inf, transaction inf)
      rows:
        - { id: 1, acctNum: A, value: "100.00" }
      validFrom: "2024-01-01T00:00:00.000000Z"
      at: "2024-01-01T00:00:00.000000Z"
    - mutation: update
      entity: parallax.compatibility.Position
      statements: 3
      note: inactivate the original on the Transaction-Time dimension, then chain head (old) + new tail (new)
      rows:
        - { id: 1, value: "200.00" }
      validFrom: "2024-06-01T00:00:00.000000Z"
      at: "2024-07-01T00:00:00.000000Z"
then:
  statements:
    - sql:
        postgres: insert into position(pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
        mariadb: insert into `position` (pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
      binds: [1, A, "100.00", "2024-01-01T00:00:00.000000Z", infinity, "2024-01-01T00:00:00.000000Z", infinity]
    - sql:
        postgres: update position set out_z = ? where pos_id = ? and thru_z = ? and out_z = ? and in_z = ?
        mariadb: update `position` set out_z = ? where pos_id = ? and thru_z = ? and out_z = ? and in_z = ?
      binds: ["2024-07-01T00:00:00.000000Z", 1, infinity, infinity, "2024-01-01T00:00:00.000000Z"]
    - sql:
        postgres: insert into position(pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
        mariadb: insert into `position` (pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
      binds: [1, A, "100.00", "2024-01-01T00:00:00.000000Z", "2024-06-01T00:00:00.000000Z", "2024-07-01T00:00:00.000000Z", infinity]
    - sql:
        postgres: insert into position(pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
        mariadb: insert into `position` (pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
      binds: [1, A, "200.00", "2024-06-01T00:00:00.000000Z", infinity, "2024-07-01T00:00:00.000000Z", infinity]
  tableState:
    position:
      - pos_id: 1
        acct_num: A
        val: "100.00"
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: infinity
        in_z: "2024-01-01T00:00:00.000000Z"
        out_z: "2024-07-01T00:00:00.000000Z"
      - pos_id: 1
        acct_num: A
        val: "100.00"
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: "2024-06-01T00:00:00.000000Z"
        in_z: "2024-07-01T00:00:00.000000Z"
        out_z: infinity
      - pos_id: 1
        acct_num: A
        val: "200.00"
        from_z: "2024-06-01T00:00:00.000000Z"
        thru_z: infinity
        in_z: "2024-07-01T00:00:00.000000Z"
        out_z: infinity
  roundTrips: 5
