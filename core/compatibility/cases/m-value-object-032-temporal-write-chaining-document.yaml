# valueObject on a UNITEMPORAL (Transaction-Time) owner: the document RIDES milestone
# chaining exactly like a scalar column (m-value-object "Inherited temporality",
# m-txtime-write), on Postgres AND MariaDB.
model: models/supplier.yaml
tags: [m-value-object, m-txtime-write, m-sql, write-sequence, update, temporal, audit-only, json, nested, to-many, slice-snapshot-1, slice-managed-1]
shape: writeSequence
when:
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.Supplier
      statements: 1
      note: open a current milestone [2024-01-01, infinity) carrying the address document D1
      rows:
        - id: 1
          name: Nordic Foods
          address:
            street: 1 Old Street
            city: Oslo
            geo:
              country: "NO"
            phones:
              - { type: home, number: '555-0100' }
      at: "2024-01-01T00:00:00.000000Z"
    - mutation: update
      entity: parallax.compatibility.Supplier
      statements: 2
      note: close the current row, then chain a new current milestone carrying the new document D2
      rows:
        - id: 1
          name: Nordic Foods
          address:
            street: 2 New Avenue
            city: Bergen
            geo:
              country: "NO"
            phones:
              - { type: work, number: '555-0200' }
              - { type: home, number: '555-0201' }
      at: "2024-06-01T00:00:00.000000Z"
then:
  statements:
    - sql:
        postgres: insert into supplier(sup_id, name, in_z, out_z, address) values (?, ?, ?, ?, ?)
        mariadb: insert into supplier(sup_id, name, in_z, out_z, address) values (?, ?, ?, ?, ?)
      binds:
        - 1
        - Nordic Foods
        - "2024-01-01T00:00:00.000000Z"
        - infinity
        - street: 1 Old Street
          city: Oslo
          geo:
            country: "NO"
          phones:
            - { type: home, number: '555-0100' }
    - sql:
        postgres: update supplier set out_z = ? where sup_id = ? and out_z = ? and in_z = ?
        mariadb: update supplier set out_z = ? where sup_id = ? and out_z = ? and in_z = ?
      binds: ["2024-06-01T00:00:00.000000Z", 1, infinity, "2024-01-01T00:00:00.000000Z"]
    - sql:
        postgres: insert into supplier(sup_id, name, in_z, out_z, address) values (?, ?, ?, ?, ?)
        mariadb: insert into supplier(sup_id, name, in_z, out_z, address) values (?, ?, ?, ?, ?)
      binds:
        - 1
        - Nordic Foods
        - "2024-06-01T00:00:00.000000Z"
        - infinity
        - street: 2 New Avenue
          city: Bergen
          geo:
            country: "NO"
          phones:
            - { type: work, number: '555-0200' }
            - { type: home, number: '555-0201' }
  tableState:
    supplier:
      - sup_id: 1
        name: Nordic Foods
        in_z: "2024-01-01T00:00:00.000000Z"
        out_z: "2024-06-01T00:00:00.000000Z"
        address:
          street: 1 Old Street
          city: Oslo
          geo:
            country: "NO"
          phones:
            - { type: home, number: '555-0100' }
      - sup_id: 1
        name: Nordic Foods
        in_z: "2024-06-01T00:00:00.000000Z"
        out_z: infinity
        address:
          street: 2 New Avenue
          city: Bergen
          geo:
            country: "NO"
          phones:
            - { type: work, number: '555-0200' }
            - { type: home, number: '555-0201' }
  roundTrips: 4
