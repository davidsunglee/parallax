# valueObject on a FULL BITEMPORAL owner: the fully-Latest document (both dimensions Latest)
# (m-value-object "Inherited temporality", m-temporal-read), on Postgres AND MariaDB.
model: models/branch.yaml
tags: [m-value-object, m-object-query, m-temporal-read, m-sql, nested, json, temporal, bitemporal, as-of, both-axes, materialization, graph, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Branch
    predicate:
      all: {}
    temporal:
      transaction-time:
        asOf: latest
      valid-time:
        asOf: latest
then:
  statements:
    - sql:
        postgres: select t0.br_id, t0.name, t0.from_z, t0.thru_z, t0.in_z, t0.out_z, not t0.address is null, t0.address from branch t0 where t0.thru_z = ? and t0.out_z = ?
        mariadb: select t0.br_id, t0.name, t0.from_z, t0.thru_z, t0.in_z, t0.out_z, not t0.address is null, t0.address from branch t0 where t0.thru_z = ? and t0.out_z = ?
      binds: [infinity, infinity]
  referenceSql: select br_id, name, from_z, thru_z, in_z, out_z from branch where thru_z > '9000-01-01' and out_z > '9000-01-01'
  graph:
    Branch:
      - id: 1
        name: Central Branch
        validStart: "2024-06-01T00:00:00.000000Z"
        validEnd: infinity
        txStart: "2024-04-01T00:00:00.000000Z"
        txEnd: infinity
        address:
          street: 30 New Road
          city: Tampere
          geo:
            country: FI
          phones:
            - { type: main, number: '555-3000' }
            - { type: fax, number: '555-3001' }
  roundTrips: 1
