# The same fixed-revision update at Repeatable Read, its snapshot taken by the first
# read before the peer committed: the engine refuses it as a serialization failure
# rather than matching no row, so the stated revision is not what refused it.
model: models/account.yaml
tags: [m-opt-lock, m-unit-work, m-db-error, isolation, concurrency, target-write, deadlock, repeatable-read, slice-snapshot-1]
shape: error
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "two-session isolation witness (when.concurrency)"
given:
  fixtures: true
when:
  uow:
    concurrency: optimistic
    isolation: repeatable-read
  concurrency:
    rounds:
      - A:
          statements:
            - sql:
                postgres: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.id = ?
                mariadb: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.id = ?
              binds: [1]
      - B:
          statements:
            - sql:
                postgres: update account set balance = ?, version = ? where id = ? and version = ?
                mariadb: update account set balance = ?, version = ? where id = ? and version = ?
              binds: ["999.00", 2, 2, 1]
      - B:
          kind: commit
      - A:
          statements:
            - sql:
                postgres: update account set balance = ?, version = ? where id = ? and version = ?
                mariadb: update account set balance = ?, version = ? where id = ? and version = ?
              binds: ["300.00", 2, 2, 1]
then:
  errorClass: deadlock
  nativeCode:
    postgres: "40001"
    mariadb: 1020
  tableState:
    account:
      - { id: 1, owner: Ada, balance: "100.00", version: 1 }
      - { id: 2, owner: Linus, balance: "999.00", version: 2 }
      - { id: 3, owner: Grace, balance: "10.00", version: 1 }
