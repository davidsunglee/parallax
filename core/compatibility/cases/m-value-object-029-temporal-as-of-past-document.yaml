# valueObject on a UNITEMPORAL (Transaction-Time) owner: the SUPERSEDED document is visible
# as-of a PAST instant — the discriminating half of the milestone proof
# (m-value-object "Inherited temporality", m-temporal-read), on Postgres AND MariaDB.
model: models/supplier.yaml
tags: [m-value-object, m-object-query, m-temporal-read, m-sql, nested, json, temporal, as-of, audit-only, past, materialization, graph, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Supplier
    predicate:
      all: {}
    temporal:
      transaction-time:
        asOf: "2024-04-01T00:00:00.000000Z"
then:
  statements:
    - sql:
        postgres: select t0.sup_id, t0.name, t0.in_z, t0.out_z, not t0.address is null, t0.address from supplier t0 where t0.in_z <= ? and t0.out_z > ?
        mariadb: select t0.sup_id, t0.name, t0.in_z, t0.out_z, not t0.address is null, t0.address from supplier t0 where t0.in_z <= ? and t0.out_z > ?
      binds: ["2024-04-01T00:00:00.000000Z", "2024-04-01T00:00:00.000000Z"]
  referenceSql:
    postgres: "select sup_id, name, in_z, out_z from supplier where in_z <= '2024-04-01T00:00:00+00:00'::timestamptz and out_z > '2024-04-01T00:00:00+00:00'::timestamptz"
    mariadb: select sup_id, name, in_z, out_z from supplier where in_z <= '2024-04-01 00:00:00' and out_z > '2024-04-01 00:00:00'
  graph:
    Supplier:
      - id: 1
        name: Nordic Foods
        txStart: "2024-01-01T00:00:00.000000Z"
        txEnd: "2024-06-01T00:00:00.000000Z"
        address:
          street: 1 Old Street
          city: Oslo
          geo:
            country: "NO"
          phones:
            - { type: home, number: '555-0100' }
      - id: 2
        name: Baltic Traders
        txStart: "2024-02-01T00:00:00.000000Z"
        txEnd: infinity
        address:
          street: 5 Port Road
          city: Riga
          geo:
            country: LV
          phones: []
  roundTrips: 1
