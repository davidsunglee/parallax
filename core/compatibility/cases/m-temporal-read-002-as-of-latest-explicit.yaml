# Explicit as-of-Latest read: the caller writes the canonical Transaction-Time
# selection. It lowers to the current-row predicate (`out_z = infinity`) that an
# omitted Transaction-Time selection normalizes to before canonical execution.
model: models/balance.yaml
tags: [m-temporal-read, m-object-query, m-sql, as-of, audit-only, explicit, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Balance
    predicate:
      all: {}
    temporal:
      transaction-time:
        asOf: latest
then:
  statements:
    - sql:
        postgres: select t0.bal_id, t0.acct_num, t0.val, t0.in_z, t0.out_z from balance t0 where t0.out_z = ?
      binds: [infinity]
  referenceSql: select bal_id, acct_num, val, in_z, out_z from balance where out_z = 'infinity'::timestamptz
  rows:
    - { bal_id: 1, acct_num: A, val: 150.00, in_z: "2024-06-01T00:00:00+00:00", out_z: infinity }
    - { bal_id: 2, acct_num: B, val: 200.00, in_z: "2024-02-01T00:00:00+00:00", out_z: infinity }
  roundTrips: 1
