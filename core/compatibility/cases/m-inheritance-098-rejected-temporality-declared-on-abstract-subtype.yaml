# Negative (m-inheritance, binding decision): a NON-TEMPORAL table-per-hierarchy
# root with an INTERMEDIATE abstract subtype that declares its own Temporality
# Profile.
#
# Temporality is a family-wide property: only the family ROOT may declare
# `temporality`, and every descendant inherits exactly the axes it derives —
# when the root declares none, no descendant may declare any either (mixed
# temporality within one family is not supported; a root without axes cannot
# expose a uniform Transaction-Time coordinate, and a non-temporal branch cannot
# safely stand in as timeless data returned at every historical coordinate).
# `Animal` (root) declares NO profile; `Pet` (abstract-subtype) declares its own
# Transaction-Time one — a model-aware validator MUST reject the family before
# any SQL, exactly as the sibling `inheritance-strategy-redeclared` /
# `inheritance-tag-on-concrete-subtype-strategy` root-only invariants do.
model: models/payment.yaml
tags: [m-inheritance, m-descriptor, rejected, negative, temporal, table-per-hierarchy, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  model:
    entities:
      - name: Animal
        table: animal
        inheritance:
          strategy: table-per-hierarchy
          role: root
          tag: { column: kind }
        attributes:
          - { name: id, type: int64, column: id, primaryKey: true }
      - name: Pet
        inheritance:
          role: abstract-subtype
          parent: Animal
        temporality: transaction-time
        attributes:
          - { name: licenseId, type: string, column: license_id, nullable: true }
      - name: Dog
        inheritance:
          role: concrete-subtype
          parent: Pet
          tagValue: dog
        attributes:
          - { name: barkVolume, type: int32, column: bark_volume, nullable: true }
then:
  rejectedRule: inheritance-temporality-not-root-owned
