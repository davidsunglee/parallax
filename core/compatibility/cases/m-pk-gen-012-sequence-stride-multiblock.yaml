# Two units of work each reserve the next strided block: 100 and 110, then 120
# and 130.
model: models/pk-sequence.yaml
tags: [m-pk-gen, m-unit-work, sequence, write-sequence, slice-snapshot-1]
shape: writeSequence
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "the insert binds the keys a native reservation answers, so its emissions depend on a query result"
when:
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.Voucher
      statements: 1
      note: "the block at 100"
      rows:
        - { label: spring }
        - { label: summer }
    - mutation: insert
      entity: parallax.compatibility.Voucher
      statements: 1
      note: "the block at 120"
      rows:
        - { label: autumn }
        - { label: winter }
then:
  statements:
    - purpose: reservation
      sql:
        postgres: select pg_catalog.nextval(t0.seqrelid) first_key, t0.seqincrement increment, t0.seqmin minimum, t0.seqmax maximum, t0.seqcycle cycles, pg_catalog.format_type(t0.seqtypid, null) data_type from pg_catalog.pg_sequence t0 where t0.seqrelid = pg_catalog.to_regclass(?)
        mariadb: select nextval(px.voucher_seq) first_key, t0.increment, t0.minimum_value minimum, t0.maximum_value maximum, t0.cycle_option cycles from px.voucher_seq t0
      binds:
        postgres: [px.voucher_seq]
        mariadb: []
    - sql:
        postgres: insert into px.voucher(id, label) select * from unnest(cast(? as bigint[]), cast(? as text[]))
        mariadb: insert into px.voucher(id, label) values (?, ?), (?, ?)
      binds:
        postgres:
          - [100, 110]
          - [spring, summer]
        mariadb: [100, spring, 110, summer]
    - purpose: reservation
      sql:
        postgres: select pg_catalog.nextval(t0.seqrelid) first_key, t0.seqincrement increment, t0.seqmin minimum, t0.seqmax maximum, t0.seqcycle cycles, pg_catalog.format_type(t0.seqtypid, null) data_type from pg_catalog.pg_sequence t0 where t0.seqrelid = pg_catalog.to_regclass(?)
        mariadb: select nextval(px.voucher_seq) first_key, t0.increment, t0.minimum_value minimum, t0.maximum_value maximum, t0.cycle_option cycles from px.voucher_seq t0
      binds:
        postgres: [px.voucher_seq]
        mariadb: []
    - sql:
        postgres: insert into px.voucher(id, label) select * from unnest(cast(? as bigint[]), cast(? as text[]))
        mariadb: insert into px.voucher(id, label) values (?, ?), (?, ?)
      binds:
        postgres:
          - [120, 130]
          - [autumn, winter]
        mariadb: [120, autumn, 130, winter]
  tableState:
    px:
      voucher:
        - { id: 100, label: spring }
        - { id: 110, label: summer }
        - { id: 120, label: autumn }
        - { id: 130, label: winter }
  databaseCalls: 4
