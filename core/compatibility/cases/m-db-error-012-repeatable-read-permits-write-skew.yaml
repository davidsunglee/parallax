# Each transaction reads accounts 1 and 2, sees a combined balance of 350.00, and
# withdraws from a different account an amount that keeps that sum non-negative in its
# own snapshot. Repeatable Read refuses neither, so the committed sum is negative:
# write skew, which only Serializable forbids.
model: models/account.yaml
tags: [m-db-error, m-unit-work, isolation, concurrency, write-skew, repeatable-read, slice-snapshot-1]
shape: concurrencySuccess
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "two-session isolation witness (when.concurrency)"
given:
  fixtures: true
when:
  uow:
    concurrency: optimistic
    isolation: repeatable-read
  concurrency:
    rounds:
      - A:
          kind: read
          statements:
            - sql:
                postgres: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.id in (?, ?)
                mariadb: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.id in (?, ?)
              binds: [1, 2]
          expectRows:
            - { id: 1, owner: Ada, balance: "100.00", version: 1 }
            - { id: 2, owner: Linus, balance: "250.00", version: 1 }
      - B:
          kind: read
          statements:
            - sql:
                postgres: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.id in (?, ?)
                mariadb: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.id in (?, ?)
              binds: [1, 2]
          expectRows:
            - { id: 1, owner: Ada, balance: "100.00", version: 1 }
            - { id: 2, owner: Linus, balance: "250.00", version: 1 }
      - A:
          kind: write
          statements:
            - sql:
                postgres: update account set balance = ?, version = ? where id = ? and version = ?
                mariadb: update account set balance = ?, version = ? where id = ? and version = ?
              binds: ["-200.00", 2, 1, 1]
          affectedRows: [1]
      - B:
          kind: write
          statements:
            - sql:
                postgres: update account set balance = ?, version = ? where id = ? and version = ?
                mariadb: update account set balance = ?, version = ? where id = ? and version = ?
              binds: ["-50.00", 2, 2, 1]
          affectedRows: [1]
      - A:
          kind: commit
      - B:
          kind: commit
then:
  tableState:
    account:
      - { id: 1, owner: Ada, balance: "-200.00", version: 2 }
      - { id: 2, owner: Linus, balance: "-50.00", version: 2 }
      - { id: 3, owner: Grace, balance: "10.00", version: 1 }
