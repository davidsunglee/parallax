        postgres: select u.id, u.title, u.folder_id, u.currency, u.amount_due, u.body, u.paid_amount, u.family_variant from (select t0.id, t0.title, t0.folder_id, t0.currency, t0.amount_due, cast(null as varchar(64)) body, cast(null as decimal(18, 2)) paid_amount, 'Invoice' family_variant from invoice t0 union all select t0.id, t0.title, t0.folder_id, cast(null as varchar(3)) currency, cast(null as decimal(18, 2)) amount_due, t0.body, cast(null as decimal(18, 2)) paid_amount, 'Memo' family_variant from memo t0 union all select t0.id, t0.title, t0.folder_id, t0.currency, cast(null as decimal(18, 2)) amount_due, cast(null as varchar(64)) body, t0.paid_amount, 'Receipt' family_variant from receipt t0) u order by u.title desc limit ?
        mariadb: select u.id, u.title, u.folder_id, u.currency, u.amount_due, u.body, u.paid_amount, u.family_variant from (select t0.id, t0.title, t0.folder_id, t0.currency, t0.amount_due, cast(null as char(64)) body, cast(null as decimal(18, 2)) paid_amount, 'Invoice' family_variant from invoice t0 union all select t0.id, t0.title, t0.folder_id, cast(null as char(3)) currency, cast(null as decimal(18, 2)) amount_due, t0.body, cast(null as decimal(18, 2)) paid_amount, 'Memo' family_variant from memo t0 union all select t0.id, t0.title, t0.folder_id, t0.currency, cast(null as decimal(18, 2)) amount_due, cast(null as char(64)) body, t0.paid_amount, 'Receipt' family_variant from receipt t0) u order by u.title desc limit ?
      binds: [2]
  referenceSql: select * from (select id, title, folder_id, currency, amount_due, null as body, null as paid_amount, 'Invoice' as family_variant from invoice union all select id, title, folder_id, currency, null as amount_due, null as body, paid_amount, 'Receipt' as family_variant from receipt union all select id, title, folder_id, null as currency, null as amount_due, body, null as paid_amount, 'Memo' as family_variant from memo) every_document order by title desc limit 2
  rows:
