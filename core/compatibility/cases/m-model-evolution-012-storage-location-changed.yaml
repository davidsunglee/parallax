# Changing an accepted Storage Location (m-model-evolution): coordinated, for the
# database alone.
tags: [m-model-evolution, evolution, attribute, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-attribute-column-v1.yaml
    later: models/evolution-attribute-column-v2.yaml
then:
  evolution:
    kind: coordinated
    operations:
      - kind: AttributeAltered
        attribute: parallax.compatibility.Placard.caption
        deltas: [{ kind: StorageChanged, earlier: caption, later: headline }]
    behavioralImpacts: []
    overlapVisibleOperations: []
    coordinationRequirements:
      - operation:
          kind: AttributeAltered
          attribute: parallax.compatibility.Placard.caption
          deltas: [{ kind: StorageChanged, earlier: caption, later: headline }]
        reasons: [DatabaseMigrationRequired]
