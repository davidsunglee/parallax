# Two DISTINCT current Handles carrying one authored unique code. The authored
# unique index ends with `out_z`, and both rows are current (`out_z = infinity`),
# so the second insert repeats the whole end-keyed key and is refused as a
# uniqueViolation. Distinct ids keep the primary key out of it.
model: models/temporal-authored-index.yaml
tags: [m-db-error, uniqueViolation, m-storage-layout, temporal, audit-only, unique-index, slice-snapshot-1, slice-managed-1]
shape: error
then:
  statements:
    - sql:
        postgres: insert into handle(id, code, label, in_z, out_z) values (?, ?, ?, ?, ?)
        mariadb: insert into handle(id, code, label, in_z, out_z) values (?, ?, ?, ?, ?)
      binds: [1, X, a, "2024-01-01T00:00:00.000000Z", infinity]
    - sql:
        postgres: insert into handle(id, code, label, in_z, out_z) values (?, ?, ?, ?, ?)
        mariadb: insert into handle(id, code, label, in_z, out_z) values (?, ?, ?, ?, ?)
      binds: [2, X, b, "2024-06-01T00:00:00.000000Z", infinity]
  errorClass: uniqueViolation
  nativeCode:
    postgres: "23505"
    mariadb: 1062
