model: models/document-codec.yaml
tags: [m-document-codec, m-wire, m-value-object, m-sql, write-sequence, insert, json, slice-snapshot-1, slice-managed-1]
shape: writeSequence
when:
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.Sample
      statements: 1
      note: insert one Sample whose float32 and float64 leaves each underflow from below
      rows:
        - id: 150
          label: Underflow
          profile:
            ratio: -1e-50
            measure: -1e-400
then:
  statements:
    - sql:
        postgres: insert into sample(id, label, profile) values (?, ?, ?)
        mariadb: insert into sample(id, label, profile) values (?, ?, ?)
      binds:
        - 150
        - Underflow
        - ratio: 0.0
          measure: 0.0
          entries: []
  tableState:
    sample:
      - id: 150
        label: Underflow
        profile:
          ratio: 0.0
          measure: 0.0
          entries: []
  roundTrips: 1
