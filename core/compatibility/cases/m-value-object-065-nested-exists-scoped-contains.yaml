# valueObject to-many: the infix affix form in the element scope, completing the five
# string predicates at this scope (m-predicate elementPredicate + wildcard rule, m-sql).
# Postgres golden only — a `where` carrying a non-`eq` leaf is outside MariaDB's
# containment scope (m-dialect, "Scope of the containment golden").
model: models/customer.yaml
tags: [m-value-object, m-predicate, m-sql, m-dialect, nested, json, to-many, exists, scoped, same-element, string, contains, array-traversal, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Customer
    predicate:
      nestedExists:
        path: parallax.compatibility.Customer.address.phones
        where:
          and:
            operands:
              - nestedEq:
                  path: type
                  value: home
              - nestedContains:
                  path: number
                  value: '-99'
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name from customer t0 where exists (select 1 from jsonb_array_elements(case when jsonb_typeof(jsonb_extract_path(t0.address, ?)) = ? then jsonb_extract_path(t0.address, ?) else cast(? as jsonb) end) t1 where jsonb_extract_path_text(t1.value, ?) = ? and jsonb_extract_path_text(t1.value, ?) like ?)
      binds: [phones, 'array', phones, '[]', type, home, number, '%-99%']
  referenceSql:
    postgres: select id, name from customer where jsonb_typeof(address -> 'phones') = 'array' and exists (select 1 from jsonb_array_elements(address -> 'phones') e where e.value ->> 'type' = 'home' and position('-99' in e.value ->> 'number') > 0)
  rows:
    - { id: 2, name: Linus }
  roundTrips: 1
