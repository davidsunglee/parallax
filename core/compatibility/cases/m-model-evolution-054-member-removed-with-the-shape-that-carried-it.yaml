# A required member and the shape that carried it leaving one position together
# (m-model-evolution): each reason reported where its subject is.
tags: [m-model-evolution, evolution, inheritance, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-departing-shape-v1.yaml
    later: models/evolution-departing-shape-v2.yaml
then:
  evolution:
    kind: coordinated
    operations:
      - kind: AttributeRemoved
        attribute: parallax.compatibility.Holding.custodian
      - kind: EntityAltered
        entity: parallax.compatibility.Lot
        deltas:
          - kind: InheritanceChanged
            earlier:
              role: concrete-subtype
              parent: parallax.compatibility.Holding
              tag: { value: lot }
            later:
              role: concrete-subtype
              parent: parallax.compatibility.Portfolio
              tag: { value: lot }
    behavioralImpacts:
      - kind: QueryResultMembershipChanged
        scope: { entity: parallax.compatibility.Holding }
        earlier: { concreteEntities: [parallax.compatibility.Lot], axes: [] }
        later: { concreteEntities: [], axes: [] }
        causedBy:
          - kind: EntityAltered
            entity: parallax.compatibility.Lot
            deltas:
              - kind: InheritanceChanged
                earlier:
                  role: concrete-subtype
                  parent: parallax.compatibility.Holding
                  tag: { value: lot }
                later:
                  role: concrete-subtype
                  parent: parallax.compatibility.Portfolio
                  tag: { value: lot }
    overlapVisibleOperations: []
    coordinationRequirements:
      - operation:
          kind: AttributeRemoved
          attribute: parallax.compatibility.Holding.custodian
        reasons: [AuthoringSurfaceChangeRequired]
      - operation:
          kind: EntityAltered
          entity: parallax.compatibility.Lot
          deltas:
            - kind: InheritanceChanged
              earlier:
                role: concrete-subtype
                parent: parallax.compatibility.Holding
                tag: { value: lot }
              later:
                role: concrete-subtype
                parent: parallax.compatibility.Portfolio
                tag: { value: lot }
        reasons: [AuthoringSurfaceChangeRequired, DatabaseMigrationRequired]
