# Boundary case (m-auto-retry, m-case-format root configuration): an explicit
# `maxRetries` at the call overrides the Database Root's `maxRetries: 0`, so the
# injected transient is retried away — `api-conformance` lane.
#
# The counterpart of `m-auto-retry-007`: the same root, whose bound of 0 would
# surface the `serialization-failure` after one attempt, and an invocation that
# requests `maxRetries: 1` of its own. The explicit value wins the resolution,
# the first attempt's failed write is re-executed, and the second attempt
# commits; the outer invocation reports `retries: 1`, the value it resolved to,
# and never the root's.
#
# `roundTrips: 4` is what the two attempts cost between them: each observes the
# row and issues its write, the failed one included.
model: models/account.yaml
tags: [m-auto-retry, m-opt-lock, m-api-conformance, transient, database-options, slice-snapshot-1, slice-managed-1]
lane: api-conformance
shape: boundary
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection concurrency/locking intent (given.fault, shape:boundary)"
given:
  fault: serialization-failure
  databaseOptions:
    maxRetries: 0
when:
  uow:
    maxRetries: 1
  boundary:
    - action: read
      note: observe the versioned row
    - action: update
      note: the first attempt's write raises an injected serialization failure — the explicit bound admits one retry
then:
  outcome: committed
  roundTrips: 4
