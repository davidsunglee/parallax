# Boundary case (m-auto-retry, m-case-format root configuration): an explicit
# `maxRetries` at the call overrides the Database Root's `maxRetries: 0`, so the
# injected transient is retried away — `api-conformance` lane.
model: models/account.yaml
tags: [m-auto-retry, m-opt-lock, m-api-conformance, transient, database-options, slice-snapshot-1, slice-managed-1]
lane: api-conformance
shape: boundary
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection concurrency/locking intent (given.fault, shape:boundary)"
given:
  fault: serialization-failure
  databaseOptions:
    maxRetries: 0
when:
  uow:
    maxRetries: 1
  boundary:
    - action: read
      note: observe the versioned row
    - action: update
      note: the first attempt's write raises an injected serialization failure — the explicit bound admits one retry
then:
  outcome: committed
  roundTrips: 4
