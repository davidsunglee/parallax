# valueObject to-many affix match: nestedEndsWith through a `many` segment places the
# LEADING wildcard, the mirror of m-value-object-058 (m-predicate wildcard rule +
# any-element, m-sql). Postgres golden only — a non-equality element predicate is outside
# MariaDB's containment scope (m-dialect, "Scope of the containment golden").
#
# nestedEndsWith(Customer.address.phones.number, '9999') binds '%9999'. Ada (1) matches
# on her SECOND element ({work, 555-9999}) while her first does not, which is the point
# of any-element: one satisfying element is enough and the predicate never asks which.
# Linus (2) matches on his only element. Nils (7) carries 555-0000 and is out.
#
# Every zero-element form remains out: the empty arrays (3, 9, 10), the null column
# (4), the missing keys (5, 6), and the nested null (8).
model: models/customer.yaml
tags: [m-value-object, m-predicate, m-sql, m-dialect, nested, json, to-many, any-element, string, endsWith, array-traversal, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Customer
    predicate:
      nestedEndsWith:
        path: parallax.compatibility.Customer.address.phones.number
        value: '9999'
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name from customer t0 where exists (select 1 from jsonb_array_elements(case when jsonb_typeof(jsonb_extract_path(t0.address, ?)) = ? then jsonb_extract_path(t0.address, ?) else cast(? as jsonb) end) t1 where jsonb_extract_path_text(t1.value, ?) like ?)
      binds: [phones, 'array', phones, '[]', number, '%9999']
  referenceSql:
    postgres: select id, name from customer where jsonb_typeof(address -> 'phones') = 'array' and exists (select 1 from jsonb_array_elements(address -> 'phones') e where right(e.value ->> 'number', 4) = '9999')
  rows:
    - { id: 1, name: Ada }
    - { id: 2, name: Linus }
  roundTrips: 1
