# Portable document encoding: a `decimal(p, s)` leaf is a JSON STRING and still
# CASTS — the one row where document form and comparison behavior part company
# (m-document-codec, m-dialect typed cast form, m-sql), on Postgres AND MariaDB.
model: models/document-codec.yaml
tags: [m-document-codec, m-value-object, m-sql, m-dialect, nested, json, cast, numeric, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Sample
    predicate:
      nestedGt:
        path: parallax.compatibility.Sample.profile.amount
        value: "9.50"
then:
  statements:
    - sql:
        postgres: select t0.id, t0.label from sample t0 where cast(jsonb_extract_path_text(t0.profile, ?) as decimal(12, 2)) > ?
        mariadb: select t0.id, t0.label from sample t0 where cast(json_value(t0.profile, ?) as decimal(12, 2)) > ?
      binds:
        postgres: [amount, '9.50']
        mariadb: ['$.amount', '9.50']
  referenceSql:
    postgres: select id, label from sample where (profile ->> 'amount')::decimal(12, 2) > 9.50
    mariadb: select id, label from sample where cast(nullif(json_unquote(json_extract(profile, '$.amount')), 'null') as decimal(12, 2)) > 9.50
  rows:
    - { id: 1, label: Ada }
  roundTrips: 1
