# Negative (m-inheritance, m-predicate): a concrete-subtype attribute used OUTSIDE a
# compatible narrowing scope.
model: models/animal.yaml
tags: [m-inheritance, m-predicate, rejected, negative, narrow, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  objectQuery:
    target: parallax.compatibility.Animal
    predicate:
      greaterThan:
        attr: parallax.compatibility.Dog.barkVolume
        value: 5
then:
  rejectedRule: subtype-attribute-outside-narrow-scope
