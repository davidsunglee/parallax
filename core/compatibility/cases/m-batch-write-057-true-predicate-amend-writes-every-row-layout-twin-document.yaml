model: models/storage-layout-transparency-layout-twin-document.yaml
tags: [m-batch-write, m-unit-work, m-storage-layout, m-document-codec, m-sql, predicate-write, readless, scenario, update, layout-twin, document-layout, slice-snapshot-1, slice-managed-1]
shape: scenario
when:
  scenario:
    - write:
        mutation: amend
        target:
          entity: parallax.compatibility.LayoutTwinItem
          predicate:
            "true": {}
        assignments:
          - { attr: parallax.compatibility.LayoutTwinItem.rank, value: 5 }
      databaseCalls: 1
      expectAffectedRows: 2
      statements:
        - sql:
            postgres: update storage_layout_transparency set payload = jsonb_set(payload, ?, cast(? as jsonb))
            mariadb: update storage_layout_transparency set payload = json_set(payload, ?, json_extract(?, '$'))
          binds:
            postgres: ['{rank}', 5]
            mariadb: ['$.rank', 5]
then:
  databaseCalls: 1
  tableState:
    storage_layout_transparency:
      - id: 1
        payload: { label: alpha, rank: 5 }
      - id: 2
        payload: { label: beta, rank: 5 }
