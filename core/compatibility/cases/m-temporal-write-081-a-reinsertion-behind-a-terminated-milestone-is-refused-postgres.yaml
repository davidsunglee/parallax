# Balance 3 was known [March, August) and then terminated. A reinsertion stamped at
# May — a clock behind the termination — would open [May, infinity), overlapping the
# terminated milestone in Transaction Time. The generated exclusion refuses it.
model: models/balance.yaml
tags: [m-temporal-write, m-db-error, temporal, audit-only, insert, constraintViolation, slice-snapshot-1, slice-managed-1]
shape: error
then:
  statements:
    - sql:
        postgres: insert into balance(bal_id, acct_num, val, in_z, out_z) values (?, ?, ?, ?, ?)
      binds: [3, C, "50.00", "2024-03-01T00:00:00.000000Z", "2024-08-01T00:00:00.000000Z"]
    - sql:
        postgres: insert into balance(bal_id, acct_num, val, in_z, out_z) values (?, ?, ?, ?, ?)
      binds: [3, C, "75.00", "2024-05-01T00:00:00.000000Z", infinity]
  errorClass: constraintViolation
  nativeCode:
    postgres: "23P01"
