# A document-resident top-level `one` occurrence keeps its containment path while an
# assignment REPLACES the whole subtree stored there, on PostgreSQL and MariaDB. Step
# 2 authors `address` naming only `city`, so the stored nested `address.geo` is gone
# afterwards — the author stated a complete value and no stored member is merged back
# into it — while every root sibling outside the occurrence survives untouched. The
# golden is one flat assignment at `address` carrying that whole document, separating
# replacement of the assigned subtree from a path-level merge inside it and from a
# whole-column rewrite that would take the root siblings with it.
model: models/document-layout.yaml
tags: [m-value-object, m-storage-layout, m-document-codec, m-sql, write-sequence, update, json, nested, document-layout, slice-snapshot-1, slice-managed-1]
shape: writeSequence
when:
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.Traveler
      statements: 1
      note: seed a row whose occurrence nests a further occurrence inside it
      rows:
        - id: 7
          displayName: Gro
          score: 9
          address:
            city: Narvik
            geo:
              country: "NO"
          tags:
            - { label: pilot }
    - mutation: update
      entity: parallax.compatibility.Traveler
      statements: 1
      note: assign the occurrence while omitting its nullable nested `geo`
      rows:
        - id: 7
          address:
            city: Bodo
then:
  statements:
    - sql:
        postgres: insert into traveler(id, payload) values (?, ?)
        mariadb: insert into traveler(id, payload) values (?, ?)
      binds:
        - 7
        - displayName: Gro
          score: 9
          address:
            city: Narvik
            geo:
              country: "NO"
          tags:
            - { label: pilot }
    - sql:
        postgres: update traveler set payload = jsonb_set(payload, ?, cast(? as jsonb)) where id = ?
        mariadb: update traveler set payload = json_set(payload, ?, json_extract(?, '$')) where id = ?
      binds:
        postgres: ['{address}', { city: Bodo }, 7]
        mariadb: ['$.address', { city: Bodo }, 7]
  tableState:
    traveler:
      - id: 7
        payload:
          displayName: Gro
          score: 9
          address:
            city: Bodo
          tags:
            - { label: pilot }
  roundTrips: 3
