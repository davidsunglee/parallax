# A document-resident top-level `one` occurrence keeps its containment path while an
# assignment recursively patches only the declared members its authored document
# names on PostgreSQL and MariaDB. The stored `address.geo` occurrence is omitted by
# step 2 and therefore survives beside the changed `address.city`; root siblings also
# survive. The golden requires an object guard and write-back at `address`, separating
# declared-member assignment from whole-subtree replacement and from a flat deep-path
# mutation that would silently lose the write when the occurrence parent is absent.
model: models/document-layout.yaml
tags: [m-value-object, m-storage-layout, m-document-codec, m-sql, write-sequence, update, json, nested, document-layout, slice-snapshot-1, slice-managed-1]
shape: writeSequence
when:
  writeSequence:
    - mutation: insert
      entity: Traveler
      statements: 1
      note: seed a row whose occurrence nests a further occurrence inside it
      rows:
        - id: 7
          displayName: Gro
          score: 9
          address:
            city: Narvik
            geo:
              country: "NO"
          tags:
            - { label: pilot }
    - mutation: update
      entity: Traveler
      statements: 1
      note: assign the occurrence while omitting its nullable nested `geo`
      rows:
        - id: 7
          address:
            city: Bodo
then:
  statements:
    - sql:
        postgres: insert into traveler(id, payload) values (?, ?)
        mariadb: insert into traveler(id, payload) values (?, ?)
      binds:
        - 7
        - displayName: Gro
          score: 9
          address:
            city: Narvik
            geo:
              country: "NO"
          tags:
            - { label: pilot }
    - sql:
        postgres: 'update traveler set payload = jsonb_set(payload, ?, jsonb_set(case when jsonb_typeof(payload #> ?) = ? then payload #> ? else cast(? as jsonb) end, ?, cast(? as jsonb))) where id = ?'
        mariadb: update traveler set payload = json_set(payload, ?, json_set(case when json_type(json_extract(payload, ?)) = ? then json_extract(payload, ?) else json_object() end, ?, json_extract(?, '$'))) where id = ?
      binds:
        postgres: ['{address}', '{address}', object, '{address}', '{}', '{city}', '"Bodo"', 7]
        mariadb: ['$.address', '$.address', OBJECT, '$.address', '$.city', '"Bodo"', 7]
  tableState:
    traveler:
      - id: 7
        payload:
          displayName: Gro
          score: 9
          address:
            city: Bodo
            geo:
              country: "NO"
          tags:
            - { label: pilot }
  roundTrips: 2
