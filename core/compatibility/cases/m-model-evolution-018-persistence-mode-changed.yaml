# Withdrawing and granting persistence (m-model-evolution): one evolution, both
# directions of the boundary, and an Entity-level impact that DOMINATES its
# members.
tags: [m-model-evolution, evolution, entity, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-persistence-v1.yaml
    later: models/evolution-persistence-v2.yaml
then:
  evolution:
    kind: coordinated
    operations:
      - kind: EntityAltered
        entity: parallax.compatibility.Archive
        deltas: [{ kind: PersistenceChanged, earlier: null, later: read-only }]
      - kind: AttributeAltered
        attribute: parallax.compatibility.Archive.note
        deltas: [{ kind: ReadOnlyChanged, earlier: false, later: true }]
      - kind: EntityAltered
        entity: parallax.compatibility.Journal
        deltas: [{ kind: PersistenceChanged, earlier: read-only, later: null }]
    behavioralImpacts:
      - kind: WriteCapabilityChanged
        scope: { entity: parallax.compatibility.Archive }
        earlier: { writes: Enabled, shape: NonTemporal }
        later: { writes: Disabled }
        causedBy:
          - kind: EntityAltered
            entity: parallax.compatibility.Archive
            deltas: [{ kind: PersistenceChanged, earlier: null, later: read-only }]
      - kind: WriteCapabilityChanged
        scope: { entity: parallax.compatibility.Journal }
        earlier: { writes: Disabled }
        later: { writes: Enabled, shape: NonTemporal }
        causedBy:
          - kind: EntityAltered
            entity: parallax.compatibility.Journal
            deltas: [{ kind: PersistenceChanged, earlier: read-only, later: null }]
    overlapVisibleOperations: []
    coordinationRequirements:
      - operation:
          kind: EntityAltered
          entity: parallax.compatibility.Archive
          deltas: [{ kind: PersistenceChanged, earlier: null, later: read-only }]
        reasons: [AuthoringSurfaceChangeRequired]
      - operation:
          kind: AttributeAltered
          attribute: parallax.compatibility.Archive.note
          deltas: [{ kind: ReadOnlyChanged, earlier: false, later: true }]
        reasons: [AuthoringSurfaceChangeRequired]
