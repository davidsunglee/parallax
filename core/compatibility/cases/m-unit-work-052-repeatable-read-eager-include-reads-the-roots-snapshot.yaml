# An eager deep fetch reads its root and its include in separate statements. At
# Repeatable Read the include reads the snapshot the root statement took, so the
# peer's commit between them reaches neither.
model: models/orders.yaml
tags: [m-unit-work, m-deep-fetch, m-db-error, isolation, concurrency, deep-fetch, repeatable-read, slice-snapshot-1]
shape: concurrencySuccess
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "two-session isolation witness (when.concurrency)"
given:
  fixtures: true
when:
  uow:
    isolation: repeatable-read
  concurrency:
    rounds:
      - A:
          kind: read
          statements:
            - sql:
                postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.id = ?
                mariadb: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.id = ?
              binds: [11]
          expectRows:
            - { id: 11, order_id: 1, sku: A-100, quantity: 2, shipped_on: null }
      - B:
          kind: write
          statements:
            - sql:
                postgres: update order_item set sku = ? where id = ?
                mariadb: update order_item set sku = ? where id = ?
              binds: [A-101, 11]
            - sql:
                postgres: update orders set name = ? where id = ?
                mariadb: update orders set name = ? where id = ?
              binds: ["Ada Lovelace", 1]
          affectedRows: [1, 1]
      - B:
          kind: commit
      - A:
          kind: read
          statements:
            - sql:
                postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.id = any(?)
                mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.id in (?)
              binds: { postgres: [[1]], mariadb: [1] }
          expectRows:
            - { id: 1, name: Ada, sku: A-100, qty: 5, price: "10.50", active: true, ordered_on: 2024-01-05 }
      - A:
          kind: commit
