# Keyed writes to table-per-concrete-subtype leaves the binding places in three
# schemas: each insert and the delete reach their own leaf's bound table, and
# the key 1 every leaf's fixtures hold is removed only where it was addressed.
model: models/document.yaml
binding:
  postgres:
    format_version: 1
    backend: postgres
    default: { schema: px }
    entities:
      parallax.compatibility.Invoice: { schema: px_fin }
      parallax.compatibility.Memo: { schema: px_notes }
  mariadb:
    format_version: 1
    backend: mariadb
    default: { database: px }
    entities:
      parallax.compatibility.Invoice: { database: px_fin }
      parallax.compatibility.Memo: { database: px_notes }
tags: [m-database-binding, m-inheritance, m-sql, table-per-concrete-subtype, write-sequence, delete, binding, slice-snapshot-1]
shape: writeSequence
given:
  fixtures: true
when:
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.Invoice
      statements: 1
      rows:
        - { id: 10, title: Invoice-C, currency: USD, amountDue: "300.00" }
    - mutation: insert
      entity: parallax.compatibility.Memo
      statements: 1
      rows:
        - { id: 5, title: Memo-C, body: Note }
    - mutation: delete
      entity: parallax.compatibility.Receipt
      statements: 1
      rows:
        - { id: 1 }
then:
  statements:
    - sql:
        postgres: insert into px_fin.invoice(id, title, currency, amount_due) values (?, ?, ?, ?)
        mariadb: insert into px_fin.invoice(id, title, currency, amount_due) values (?, ?, ?, ?)
      binds: [10, Invoice-C, USD, "300.00"]
    - sql:
        postgres: insert into px_notes.memo(id, title, body) values (?, ?, ?)
        mariadb: insert into px_notes.memo(id, title, body) values (?, ?, ?)
      binds: [5, Memo-C, Note]
    - sql:
        postgres: delete from px.receipt where id = ?
        mariadb: delete from px.receipt where id = ?
      binds: [1]
  tableState:
    px:
      receipt: []
    px_fin:
      invoice:
        - { id: 1, title: Invoice-A, folder_id: 100, currency: USD, amount_due: "120.00" }
        - { id: 2, title: Invoice-B, folder_id: 101, currency: EUR, amount_due: "80.00" }
        - { id: 10, title: Invoice-C, folder_id: null, currency: USD, amount_due: "300.00" }
    px_notes:
      memo:
        - { id: 1, title: Memo-A, folder_id: 102, body: Reminder, annotation: { author: Ada, priority: high } }
        - { id: 5, title: Memo-C, folder_id: null, body: Note, annotation: null }
  databaseCalls: 4
