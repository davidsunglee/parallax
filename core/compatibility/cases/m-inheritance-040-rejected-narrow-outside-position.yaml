# Negative (m-inheritance, m-op-algebra): a narrow BROADENS beyond its position.
#
# A rejected operation with no targetEntity starts at the descriptor's inheritance
# root Animal, whose effective set is {Cat, Dog, WildBoar}. The selection asks for
# the unrelated standalone Entity Person. Its resolved set is non-empty but not a
# subset of the active family position, so a model-aware validator MUST reject the
# operation pre-SQL as `narrow-outside-position`.
model: models/animal.yaml
tags: [m-inheritance, m-op-algebra, rejected, negative, narrow, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  operation:
    narrow:
      to: [parallax.compatibility.Person]
      operand:
        all: {}
then:
  rejectedRule: narrow-outside-position
