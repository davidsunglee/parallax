# Reordering an INDEX's components (m-model-evolution): an alteration that
# enforces the same rule.
#
# Component order is retained in the delta because it changes the physical access
# path. The uniqueness rule, by contrast, is an unordered Attribute set, so the
# reordered Index enforces exactly what it enforced before and the evolution
# carries no Behavioral Impact.
tags: [m-model-evolution, m-schema-delta, evolution, index, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-index-components-v1.yaml
    later: models/evolution-index-components-v2.yaml
then:
  evolution:
    kind: unilateral
    operations:
      - kind: IndexAltered
        index: parallax.compatibility.Bale.bale_lookup
        deltas:
          - kind: ComponentsChanged
            earlier:
              - parallax.compatibility.Bale.region
              - parallax.compatibility.Bale.label
            later:
              - parallax.compatibility.Bale.label
              - parallax.compatibility.Bale.region
    behavioralImpacts: []
    overlapVisibleOperations: []
    coordinationRequirements: []
  schema:
    postgres:
      delta:
        statements:
          - create unique index pxi_evolution_bale_parallax_co_d96760939d8bbbace573a4bce02d40e2 on evolution_bale (label, region)
          - drop index pxi_evolution_bale_parallax_co_5f906729e5263c442b8da00f6a83daf4
        createdIndices:
          - physicalIndexName: pxi_evolution_bale_parallax_co_d96760939d8bbbace573a4bce02d40e2
            physicalTable: evolution_bale
            logicalIndexIdentity: parallax.compatibility.Bale.bale_lookup
            unique: true
    mariadb:
      delta:
        statements:
          - create unique index pxi_evolution_bale_parallax_com_d96760939d8bbbace573a4bce02d40e2 on evolution_bale (label, region)
          - drop index pxi_evolution_bale_parallax_com_5f906729e5263c442b8da00f6a83daf4 on evolution_bale
        createdIndices:
          - physicalIndexName: pxi_evolution_bale_parallax_com_d96760939d8bbbace573a4bce02d40e2
            physicalTable: evolution_bale
            logicalIndexIdentity: parallax.compatibility.Bale.bale_lookup
            unique: true
