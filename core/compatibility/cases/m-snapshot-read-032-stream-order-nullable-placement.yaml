# A Sort Key over a NULLABLE member changes what a streamed page can seek
# (m-snapshot-read): a non-null coordinate gives the range arm its hoist, while
# a disjoint second arm retains the trailing NULL region.
model: models/orders.yaml
tags: [m-snapshot-read, m-object-query, m-dialect, stream, streamed-delivery, orderBy, ordering, nulls, nullable, graph, materialization, slice-snapshot-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "a streamed read's keyset seek - each continuing root statement binds the Continuation Order coordinates of the root the previous page delivered last, so the emissions depend on a query result even though the read declares no includes"
when:
  objectQuery:
    target: parallax.compatibility.Order
    predicate:
      all: {}
    orderBy:
      - attr: parallax.compatibility.Order.sku
  stream:
    batchSize: 2
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.sku parallax_seek_0, t0.id parallax_seek_1 from orders t0 order by t0.sku asc, t0.id asc limit ?
        mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.sku parallax_seek_0, t0.id parallax_seek_1 from orders t0 order by t0.sku is null, t0.sku asc, t0.id asc limit ?
      binds: [3]
    - sql:
        postgres: select u.id, u.name, u.sku, u.qty, u.price, u.active, u.ordered_on, u.parallax_seek_0, u.parallax_seek_1 from ((select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.sku parallax_seek_0, t0.id parallax_seek_1 from orders t0 where t0.sku >= ? and (t0.sku > ? or t0.sku is null or (t0.sku = ? and (t0.id > ? or t0.id is null))) order by t0.sku asc, t0.id asc limit ?) union all (select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.sku parallax_seek_0, t0.id parallax_seek_1 from orders t0 where t0.sku is null order by t0.sku asc, t0.id asc limit ?)) u order by u.parallax_seek_0 asc, u.parallax_seek_1 asc limit ?
        mariadb: select u.id, u.name, u.sku, u.qty, u.price, u.active, u.ordered_on, u.parallax_seek_0, u.parallax_seek_1 from ((select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.sku parallax_seek_0, t0.id parallax_seek_1 from orders t0 where t0.sku >= ? and (t0.sku > ? or t0.sku is null or (t0.sku = ? and t0.id > ?)) order by t0.sku is null, t0.sku asc, t0.id asc limit ?) union all (select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.sku parallax_seek_0, t0.id parallax_seek_1 from orders t0 where t0.sku is null order by t0.sku is null, t0.sku asc, t0.id asc limit ?)) u order by u.parallax_seek_0 is null, u.parallax_seek_0 asc, u.parallax_seek_1 asc limit ?
      binds: { postgres: ["A-300", "A-300", "A-300", 3, 3, 3, 3], mariadb: ["A-300", "A-300", "A-300", 3, 3, 3, 3] }
    - sql:
        postgres: select u.id, u.name, u.sku, u.qty, u.price, u.active, u.ordered_on, u.parallax_seek_0, u.parallax_seek_1 from ((select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.sku parallax_seek_0, t0.id parallax_seek_1 from orders t0 where t0.sku >= ? and (t0.sku > ? or t0.sku is null or (t0.sku = ? and (t0.id > ? or t0.id is null))) order by t0.sku asc, t0.id asc limit ?) union all (select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.sku parallax_seek_0, t0.id parallax_seek_1 from orders t0 where t0.sku is null order by t0.sku asc, t0.id asc limit ?)) u order by u.parallax_seek_0 asc, u.parallax_seek_1 asc limit ?
        mariadb: select u.id, u.name, u.sku, u.qty, u.price, u.active, u.ordered_on, u.parallax_seek_0, u.parallax_seek_1 from ((select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.sku parallax_seek_0, t0.id parallax_seek_1 from orders t0 where t0.sku >= ? and (t0.sku > ? or t0.sku is null or (t0.sku = ? and t0.id > ?)) order by t0.sku is null, t0.sku asc, t0.id asc limit ?) union all (select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.sku parallax_seek_0, t0.id parallax_seek_1 from orders t0 where t0.sku is null order by t0.sku is null, t0.sku asc, t0.id asc limit ?)) u order by u.parallax_seek_0 is null, u.parallax_seek_0 asc, u.parallax_seek_1 asc limit ?
      binds: { postgres: ["B-200", "B-200", "B-200", 2, 3, 3, 3], mariadb: ["B-200", "B-200", "B-200", 2, 3, 3, 3] }
  referenceSql: select id, name, sku, qty, price, active, ordered_on from orders
  graph:
    Order:
      - { id: 1, name: Ada, sku: A-100, qty: 5, price: "10.50", active: true, orderedOn: 2024-01-05 }
      - { id: 3, name: ada, sku: A-300, qty: 15, price: "30.25", active: false, orderedOn: 2024-03-15 }
      - { id: 42, name: Grace, sku: A-999, qty: 30, price: "99.99", active: true, orderedOn: 2024-06-30 }
      - { id: 2, name: Linus, sku: B-200, qty: 10, price: "20.00", active: true, orderedOn: 2024-02-10 }
      - { id: 5, name: Alan, sku: "C_50%", qty: 25, price: "50.75", active: false, orderedOn: 2024-05-25 }
      - { id: 4, name: Margaret, sku: null, qty: 20, price: "40.00", active: true, orderedOn: 2024-04-20 }
  roundTrips: 3
