# A changed Value Object edit reaches an absent optional weight through a
# read-produced containing Entity and makes it present, preserves application-owned
# auxiliary state behind a read-only property with independent bindings, invokes no
# assignment hook, drops a warm cache, and leaves source and occurrence unchanged.
model: models/note.yaml
tags: [m-edit, m-value-object, slice-snapshot-1, slice-managed-1]
shape: edit
lane: api-conformance
when:
  edit:
    source:
      origin: read
      objectQuery:
        target: parallax.compatibility.Note
        predicate:
          eq:
            attr: parallax.compatibility.Note.id
            value: 2
      path: parallax.compatibility.Note.tag
    set: { weight: 1 }
then:
  result:
    members: { label: b, weight: 1 }
  carry:
    auxiliary: { identity: shared, binding: independent, hooks: none }
    derivedCache: { value: B, evaluations: 1 }
  source: { unchanged: true }
