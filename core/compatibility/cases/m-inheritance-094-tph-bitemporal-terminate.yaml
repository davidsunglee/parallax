# Table-per-hierarchy BITEMPORAL plain TERMINATE: the inactivation is tag-GUARDED
# (m-inheritance x m-bitemp-write x m-sql).
model: models/instrument.yaml
tags: [m-inheritance, m-bitemp-write, m-sql, table-per-hierarchy, tag, temporal, bitemporal, write-sequence, plain-terminate, slice-snapshot-1, slice-managed-1]
shape: writeSequence
when:
  uow:
    concurrency: locking
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.Bond
      statements: 1
      note: open the original Latest rectangle; kind=bond derived from tagValue
      rows:
        - { id: 1, price: "100.00", coupon: "5.00" }
      validFrom: "2024-01-01T00:00:00.000000Z"
      at: "2024-01-01T00:00:00.000000Z"
    - mutation: terminate
      entity: parallax.compatibility.Bond
      statements: 2
      note: inactivate the original on the Transaction-Time dimension (tag-guarded on kind='bond'), then chain head only
      rows:
        - { id: 1 }
      validFrom: "2024-06-01T00:00:00.000000Z"
      at: "2024-07-01T00:00:00.000000Z"
then:
  statements:
    - sql:
        postgres: insert into instrument(id, kind, price, coupon, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?, ?)
      binds: [1, bond, "100.00", "5.00", "2024-01-01T00:00:00.000000Z", infinity, "2024-01-01T00:00:00.000000Z", infinity]
    - sql:
        postgres: update instrument set out_z = ? where id = ? and kind = ? and thru_z = ? and out_z = ?
      binds: ["2024-07-01T00:00:00.000000Z", 1, bond, infinity, infinity]
    - sql:
        postgres: insert into instrument(id, kind, price, coupon, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?, ?)
      binds: [1, bond, "100.00", "5.00", "2024-01-01T00:00:00.000000Z", "2024-06-01T00:00:00.000000Z", "2024-07-01T00:00:00.000000Z", infinity]
  tableState:
    instrument:
      - id: 1
        kind: bond
        price: "100.00"
        coupon: "5.00"
        ticker: null
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: infinity
        in_z: "2024-01-01T00:00:00.000000Z"
        out_z: "2024-07-01T00:00:00.000000Z"
      - id: 1
        kind: bond
        price: "100.00"
        coupon: "5.00"
        ticker: null
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: "2024-06-01T00:00:00.000000Z"
        in_z: "2024-07-01T00:00:00.000000Z"
        out_z: infinity
  roundTrips: 4
