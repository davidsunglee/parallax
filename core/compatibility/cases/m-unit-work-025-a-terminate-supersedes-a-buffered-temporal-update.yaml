# Observed-State Coalescing over a TEMPORAL target (m-unit-work): an update
# followed by a terminate of ONE observed milestone, over the same region, is one
# terminate — the close alone, with no chained successor.
model: models/balance.yaml
tags: [m-unit-work, m-txtime-write, m-opt-lock, m-sql, coalescing, temporal, audit-only, scenario, slice-snapshot-1, slice-managed-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "the surviving close addresses and gates on the milestone the group's own find observed — a query result (m-case-format 'Settling against a grouped find')"
when:
  uow:
    concurrency: optimistic
  scenario:
    - uow: superseded-chain
      objectQuery:
        target: parallax.compatibility.Balance
        predicate:
          eq:
            attr: parallax.compatibility.Balance.id
            value: 1
        temporal:
          transaction-time:
            asOf: latest
      roundTrips: 1
      note: observe balance 1's current milestone (150.00, known from 2024-06-01) — the ONE state both buffered writes settle against
      statements:
        - sql:
            postgres: select t0.bal_id, t0.acct_num, t0.val, t0.in_z, t0.out_z from balance t0 where t0.bal_id = ? and t0.out_z = ?
          binds: [1, infinity]
      expectRows:
        - { bal_id: 1, acct_num: A, val: "150.00", in_z: "2024-06-01T00:00:00.000000Z", out_z: infinity }
    - uow: superseded-chain
      "on": 0
      write:
        - mutation: update
          entity: parallax.compatibility.Balance
          rows:
            - { id: 1, acctNum: A, value: "175.00" }
          at: "2024-10-01T00:00:00.000000Z"
        - mutation: terminate
          entity: parallax.compatibility.Balance
          rows:
            - { id: 1 }
          at: "2024-10-01T00:00:00.000000Z"
      roundTrips: 1
      note: the terminate supersedes the buffered update, so the close is emitted alone and no successor milestone is chained
      statements:
        - sql:
            postgres: update balance set out_z = ? where bal_id = ? and out_z = ? and in_z = ?
          binds: ["2024-10-01T00:00:00.000000Z", 1, infinity, "2024-06-01T00:00:00.000000Z"]
    - uow: superseded-chain
      objectQuery:
        target: parallax.compatibility.Balance
        predicate:
          eq:
            attr: parallax.compatibility.Balance.id
            value: 1
        temporal:
          transaction-time:
            asOf: latest
      roundTrips: 1
      note: the dependent find MUST observe no current milestone; the group COMMITS after this, its last step
      statements:
        - sql:
            postgres: select t0.bal_id, t0.acct_num, t0.val, t0.in_z, t0.out_z from balance t0 where t0.bal_id = ? and t0.out_z = ?
          binds: [1, infinity]
      expectRows: []
then:
  roundTrips: 3
  tableState:
    balance:
      - { bal_id: 1, acct_num: A, val: "100.00", in_z: "2024-01-01T00:00:00.000000Z", out_z: "2024-06-01T00:00:00.000000Z" }
      - { bal_id: 1, acct_num: A, val: "150.00", in_z: "2024-06-01T00:00:00.000000Z", out_z: "2024-10-01T00:00:00.000000Z" }
      - { bal_id: 2, acct_num: B, val: "200.00", in_z: "2024-02-01T00:00:00.000000Z", out_z: infinity }
      - { bal_id: 3, acct_num: C, val: "50.00", in_z: "2024-03-01T00:00:00.000000Z", out_z: "2024-08-01T00:00:00.000000Z" }
