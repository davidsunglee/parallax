# A unit of work that reads one key twice keeps BOTH reads as evidence, and the close
# that follows settles against the milestone the read it names observed — not against
# whichever read of that key ran last (m-unit-work "An observation is filed under the
# object it observed AND the milestone it observed of that object").
model: models/position.yaml
tags: [m-unit-work, m-bitemp-write, m-temporal-read, m-opt-lock, m-sql, bitemporal, temporal, as-of, scenario, slice-snapshot-1, slice-managed-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "the close settles against the milestone a find step of its own unit of work observed, so its address is read off a row no compile lane executes (m-case-format 'Settling against a grouped find')"
when:
  uow:
    concurrency: optimistic
  scenario:
    - uow: observe-then-close
      objectQuery:
        target: parallax.compatibility.Position
        predicate:
          eq:
            attr: parallax.compatibility.Position.id
            value: 1
        temporal:
          transaction-time:
            asOf: latest
          valid-time:
            asOf: "2024-03-01T00:00:00.000000Z"
      roundTrips: 1
      note: observe R2 — id 1 pinned at Valid Time 2024-03-01, the rectangle-split head (100.00), valid [2024-01-01, 2024-06-01)
      statements:
        - sql:
            postgres: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? and t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?
          binds: [1, "2024-03-01T00:00:00.000000Z", "2024-03-01T00:00:00.000000Z", infinity]
      expectRows:
        - { pos_id: 1, acct_num: A, val: "100.00", from_z: "2024-01-01T00:00:00.000000Z", thru_z: "2024-06-01T00:00:00.000000Z", in_z: "2024-04-01T00:00:00.000000Z", out_z: infinity }
    - uow: observe-then-close
      objectQuery:
        target: parallax.compatibility.Position
        predicate:
          eq:
            attr: parallax.compatibility.Position.id
            value: 1
        temporal:
          transaction-time:
            asOf: latest
          valid-time:
            asOf: "2024-09-01T00:00:00.000000Z"
      roundTrips: 1
      note: observe R3 — the SAME primary key at Valid Time 2024-09-01, the corrected tail (200.00), a DIFFERENT milestone also current on Transaction Time
      statements:
        - sql:
            postgres: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? and t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?
          binds: [1, "2024-09-01T00:00:00.000000Z", "2024-09-01T00:00:00.000000Z", infinity]
      expectRows:
        - { pos_id: 1, acct_num: A, val: "200.00", from_z: "2024-06-01T00:00:00.000000Z", thru_z: infinity, in_z: "2024-04-01T00:00:00.000000Z", out_z: infinity }
    - uow: observe-then-close
      "on": 0
      write:
        - mutation: update
          entity: parallax.compatibility.Position
          rows:
            - { id: 1, value: "150.00" }
          validFrom: "2024-03-01T00:00:00.000000Z"
          at: "2024-10-01T00:00:00.000000Z"
      roundTrips: 3
      note: correct the value the step-0 read returned — the close addresses R2 (thru_z 2024-06-01) and re-opens R2's own window, leaving R3 alone
      statements:
        - sql:
            postgres: update position set out_z = ? where pos_id = ? and thru_z = ? and out_z = ? and in_z = ?
          binds: ["2024-10-01T00:00:00.000000Z", 1, "2024-06-01T00:00:00.000000Z", infinity, "2024-04-01T00:00:00.000000Z"]
        - sql:
            postgres: insert into position(pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
          binds: [1, A, "100.00", "2024-01-01T00:00:00.000000Z", "2024-03-01T00:00:00.000000Z", "2024-10-01T00:00:00.000000Z", infinity]
        - sql:
            postgres: insert into position(pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
          binds: [1, A, "150.00", "2024-03-01T00:00:00.000000Z", "2024-06-01T00:00:00.000000Z", "2024-10-01T00:00:00.000000Z", infinity]
then:
  roundTrips: 5
  tableState:
    position:
      - pos_id: 1
        acct_num: A
        val: "90.00"
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: infinity
        in_z: "2024-01-01T00:00:00.000000Z"
        out_z: "2024-04-01T00:00:00.000000Z"
      - pos_id: 1
        acct_num: A
        val: "100.00"
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: "2024-06-01T00:00:00.000000Z"
        in_z: "2024-04-01T00:00:00.000000Z"
        out_z: "2024-10-01T00:00:00.000000Z"
      - pos_id: 1
        acct_num: A
        val: "200.00"
        from_z: "2024-06-01T00:00:00.000000Z"
        thru_z: infinity
        in_z: "2024-04-01T00:00:00.000000Z"
        out_z: infinity
      - pos_id: 1
        acct_num: A
        val: "100.00"
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: "2024-03-01T00:00:00.000000Z"
        in_z: "2024-10-01T00:00:00.000000Z"
        out_z: infinity
      - pos_id: 1
        acct_num: A
        val: "150.00"
        from_z: "2024-03-01T00:00:00.000000Z"
        thru_z: "2024-06-01T00:00:00.000000Z"
        in_z: "2024-10-01T00:00:00.000000Z"
        out_z: infinity
