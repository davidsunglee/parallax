model: models/predicate-collections.yaml
tags: [m-predicate, relationship, to-one, exists, matching, negation, quantifier, scalar-collection, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Basket
    predicate:
      not:
        operand:
          exists:
            path: parallax.compatibility.Basket.owner
            where:
              or:
                operands:
                  - eq: {path: active, value: false}
                  - any: {path: tags, where: {eq: {value: vip}}}
then:
  statements:
  - sql: {postgres: 'select t0.id, t0.label, t0.owner_id, not t0.tags is null, t0.tags, not t0.scores is null, t0.scores, not t0.prices is null, t0.prices, not t0.flags is null, t0.flags, not t0.parcels is null, t0.parcels, not t0.meta is null, t0.meta from basket t0 where not exists (select 1 from basket_owner t1 where t1.id = t0.owner_id and (t1.active = ? or exists (select 1 from jsonb_array_elements(case when jsonb_typeof(t1.tags) = ? then t1.tags else cast(? as jsonb) end) t2 where case when jsonb_typeof(t2.value) = ? then t2.value #>> ? end = ?)))'}
    binds: [false, array, '[]', string, '{}', vip]
  graph:
    Basket:
    - id: 2
      label: two
      ownerId: null
      tags: []
      scores: []
      prices: []
      flags: []
      parcels: []
      meta: null
    - id: 3
      label: three
      ownerId: 2
      tags: [gift]
      scores: [15]
      prices: ['2.00', '3.00']
      flags: [false]
      parcels:
      - sku: c
        qty: 5
        notes: [urgent]
      meta:
        labels: []
  databaseCalls: 1
