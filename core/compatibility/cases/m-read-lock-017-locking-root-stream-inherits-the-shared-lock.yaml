# A transactional stream inherits its Database Root's locking preference: the
# group's invocation names no preference at all, and every page still carries
# PostgreSQL's shared-row authority (m-read-lock / m-unit-work / m-case-format).
# The choreography is `m-read-lock-016`'s — page 1 asks for three roots and
# publishes accounts 1 and 2, page 2 seeks from account 2 and returns account 3
# alone — with the `locking` preference moved from `when.uow` into
# `given.databaseOptions`, so what produces the `for share of t0` suffix is
# resolution against the root the transaction was opened through, not a request
# the call made. The `uow` label is what puts the stream inside a transaction for
# the root's defaults to govern; a standalone stream under the same root takes no
# lock (`m-read-lock-019`). MariaDB's one-arm continuation carries the same
# inherited lock clause.
model: models/account.yaml
tags: [m-read-lock, m-snapshot-read, m-unit-work, m-sql, m-dialect, stream, streamed-delivery, concurrency, locking-mode, database-options, slice-snapshot-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "the continuing page binds the primary key of the root the first page delivered last"
given:
  fixtures: true
  databaseOptions:
    concurrency: locking
when:
  scenario:
    - uow: locking-stream
      objectQuery:
        target: parallax.compatibility.Account
        predicate:
          all: {}
      stream:
        batchSize: 2
      roundTrips: 2
      statements:
        - sql:
            postgres: select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 order by t0.id asc limit ? for share of t0
            mariadb: select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 order by t0.id asc limit ? lock in share mode
          binds: [3]
        - sql:
            postgres: select u.id, u.owner, u.balance, u.version, u.parallax_seek_0 from ((select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 where t0.id >= ? and (t0.id > ? or t0.id is null) order by t0.id asc limit ?) union all (select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 where t0.id is null order by t0.id asc limit ?)) u join account t0 on u.id = t0.id order by u.parallax_seek_0 asc limit ? for share of t0
            mariadb: select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 where t0.id >= ? and t0.id > ? order by t0.id asc limit ? lock in share mode
          binds:
            postgres: [2, 2, 3, 3, 3]
            mariadb: [2, 2, 3]
      referenceSql: select id, owner, balance, version from account
      expectRows:
      - { id: 1, owner: Ada, balance: "100.00", version: 1 }
      - { id: 2, owner: Linus, balance: "250.00", version: 1 }
      - { id: 3, owner: Grace, balance: "10.00", version: 1 }
then:
  roundTrips: 2
