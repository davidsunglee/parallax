# A Valid-Time range read of position 1's current rectangles, repeated after a peer
# replaces the June rectangle and commits. At Read Committed the second read sees the
# replacement: the range a transaction acts on can change between its own statements.
model: models/position.yaml
tags: [m-temporal-write, m-temporal-read, m-unit-work, isolation, concurrency, bitemporal, temporal, read-committed, slice-snapshot-1]
shape: concurrencySuccess
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "two-session isolation witness (when.concurrency)"
given:
  fixtures: true
when:
  uow:
    isolation: read-committed
  concurrency:
    rounds:
      - A:
          kind: read
          statements:
            - sql:
                postgres: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? and t0.out_z = ? order by t0.pos_id asc, t0.from_z asc, t0.in_z asc
                mariadb: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from `position` t0 where t0.pos_id = ? and t0.out_z = ? order by t0.pos_id asc, t0.from_z asc, t0.in_z asc
              binds: [1, infinity]
          expectRows:
            - { pos_id: 1, acct_num: A, val: "100.00", from_z: "2024-01-01T00:00:00.000000Z", thru_z: "2024-06-01T00:00:00.000000Z", in_z: "2024-04-01T00:00:00.000000Z", out_z: infinity }
            - { pos_id: 1, acct_num: A, val: "200.00", from_z: "2024-06-01T00:00:00.000000Z", thru_z: infinity, in_z: "2024-04-01T00:00:00.000000Z", out_z: infinity }
      - B:
          kind: write
          statements:
            - sql:
                postgres: update position set out_z = ? where pos_id = ? and thru_z = ? and out_z = ? and in_z = ?
                mariadb: update `position` set out_z = ? where pos_id = ? and thru_z = ? and out_z = ? and in_z = ?
              binds: ["2024-05-01T00:00:00.000000Z", 1, infinity, infinity, "2024-04-01T00:00:00.000000Z"]
            - sql:
                postgres: insert into position(pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
                mariadb: insert into `position` (pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
              binds: [1, A, "250.00", "2024-06-01T00:00:00.000000Z", infinity, "2024-05-01T00:00:00.000000Z", infinity]
          affectedRows: [1, 1]
      - B:
          kind: commit
      - A:
          kind: read
          statements:
            - sql:
                postgres: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? and t0.out_z = ? order by t0.pos_id asc, t0.from_z asc, t0.in_z asc
                mariadb: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from `position` t0 where t0.pos_id = ? and t0.out_z = ? order by t0.pos_id asc, t0.from_z asc, t0.in_z asc
              binds: [1, infinity]
          expectRows:
            - { pos_id: 1, acct_num: A, val: "100.00", from_z: "2024-01-01T00:00:00.000000Z", thru_z: "2024-06-01T00:00:00.000000Z", in_z: "2024-04-01T00:00:00.000000Z", out_z: infinity }
            - { pos_id: 1, acct_num: A, val: "250.00", from_z: "2024-06-01T00:00:00.000000Z", thru_z: infinity, in_z: "2024-05-01T00:00:00.000000Z", out_z: infinity }
      - A:
          kind: commit
