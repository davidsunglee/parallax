# NESTED Value Object occurrences (m-model-evolution): a nested add or remove
# suppresses its own members.
tags: [m-model-evolution, evolution, value-object, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-vo-nested-v1.yaml
    later: models/evolution-vo-nested-v2.yaml
then:
  evolution:
    kind: coordinated
    operations:
      - kind: ValueObjectOccurrenceRemoved
        valueObject: parallax.compatibility.Contact.profile.home
      - kind: ValueObjectOccurrenceAdded
        valueObject: parallax.compatibility.Contact.profile.work
    behavioralImpacts: []
    overlapVisibleOperations: []
    coordinationRequirements:
      - operation:
          kind: ValueObjectOccurrenceRemoved
          valueObject: parallax.compatibility.Contact.profile.home
        reasons:
          - AuthoringSurfaceChangeRequired
          - DatabaseMigrationRequired
