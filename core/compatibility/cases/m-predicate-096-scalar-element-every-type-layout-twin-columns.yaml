# Columns half of the every-type element proof: one `any` per declared
# element type, each comparing the bound element by its type's own rule — a cast for
# the numeric, Decimal, and Boolean types, the canonical text for the rest.
model: models/scalar-collection-layout-twin-columns.yaml
tags: [m-predicate, m-value-object, m-sql, read, quantifier, scalar-collection, graph, layout-twin, columns, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.CollectionTwinItem
    predicate:
      and:
        operands:
        - any:
            path: parallax.compatibility.CollectionTwinItem.flags
            where:
              eq: {value: true}
        - any:
            path: parallax.compatibility.CollectionTwinItem.smalls
            where:
              eq: {value: 3}
        - any:
            path: parallax.compatibility.CollectionTwinItem.counts
            where:
              eq: {value: 9007199254740993}
        - any:
            path: parallax.compatibility.CollectionTwinItem.ratios
            where:
              eq: {value: 0.0}
        - any:
            path: parallax.compatibility.CollectionTwinItem.scores
            where:
              eq: {value: 2.5}
        - any:
            path: parallax.compatibility.CollectionTwinItem.amounts
            where:
              eq: {value: '7.00'}
        - any:
            path: parallax.compatibility.CollectionTwinItem.tags
            where:
              eq: {value: a}
        - any:
            path: parallax.compatibility.CollectionTwinItem.blobs
            where:
              eq: {value: 0aff}
        - any:
            path: parallax.compatibility.CollectionTwinItem.days
            where:
              eq: {value: '2024-02-29'}
        - any:
            path: parallax.compatibility.CollectionTwinItem.clocks
            where:
              eq: {value: '13:05:07.000250'}
        - any:
            path: parallax.compatibility.CollectionTwinItem.instants
            where:
              eq: {value: '2024-06-01T10:00:00.000000Z'}
        - any:
            path: parallax.compatibility.CollectionTwinItem.tokens
            where:
              eq: {value: 12345678-1234-5678-1234-567812345678}
then:
  statements:
  - sql: {postgres: 'select t0.id, not t0.flags is null, t0.flags, not t0.smalls is null, t0.smalls, not t0.counts is null, t0.counts, not t0.ratios is null, t0.ratios, not t0.scores is null, t0.scores, not t0.amounts is null, t0.amounts, not t0.tags is null, t0.tags, not t0.blobs is null, t0.blobs, not t0.days is null, t0.days, not t0.clocks is null, t0.clocks, not t0.instants is null, t0.instants, not t0.tokens is null, t0.tokens, not t0.detail is null, t0.detail, not t0.parts is null, t0.parts from collection_twin t0 where exists (select 1 from jsonb_array_elements(case when jsonb_typeof(t0.flags) = ? then t0.flags else cast(? as jsonb) end) t1 where case when jsonb_typeof(t1.value) = ? then cast(t1.value #>> ? as boolean) end = ?) and exists (select 1 from jsonb_array_elements(case when jsonb_typeof(t0.smalls) = ? then t0.smalls else cast(? as jsonb) end) t2 where case when jsonb_typeof(t2.value) = ? then cast(t2.value #>> ? as bigint) end = ?) and exists (select 1 from jsonb_array_elements(case
        when jsonb_typeof(t0.counts) = ? then t0.counts else cast(? as jsonb) end) t3 where case when jsonb_typeof(t3.value) = ? then cast(t3.value #>> ? as bigint) end = ?) and exists (select 1 from jsonb_array_elements(case when jsonb_typeof(t0.ratios) = ? then t0.ratios else cast(? as jsonb) end) t4 where case when jsonb_typeof(t4.value) = ? then cast(t4.value #>> ? as real) end = ?) and exists (select 1 from jsonb_array_elements(case when jsonb_typeof(t0.scores) = ? then t0.scores else cast(? as jsonb) end) t5 where case when jsonb_typeof(t5.value) = ? then cast(t5.value #>> ? as double precision) end = ?) and exists (select 1 from jsonb_array_elements(case when jsonb_typeof(t0.amounts) = ? then t0.amounts else cast(? as jsonb) end) t6 where case when jsonb_typeof(t6.value) = ? then cast(t6.value #>> ? as decimal(12, 2)) end = ?) and exists (select 1 from jsonb_array_elements(case when jsonb_typeof(t0.tags) = ? then t0.tags else cast(? as jsonb) end) t7 where case when jsonb_typeof(t7.value)
        = ? then t7.value #>> ? end = ?) and exists (select 1 from jsonb_array_elements(case when jsonb_typeof(t0.blobs) = ? then t0.blobs else cast(? as jsonb) end) t8 where case when jsonb_typeof(t8.value) = ? then t8.value #>> ? end = ?) and exists (select 1 from jsonb_array_elements(case when jsonb_typeof(t0.days) = ? then t0.days else cast(? as jsonb) end) t9 where case when jsonb_typeof(t9.value) = ? then t9.value #>> ? end = ?) and exists (select 1 from jsonb_array_elements(case when jsonb_typeof(t0.clocks) = ? then t0.clocks else cast(? as jsonb) end) t10 where case when jsonb_typeof(t10.value) = ? then t10.value #>> ? end = ?) and exists (select 1 from jsonb_array_elements(case when jsonb_typeof(t0.instants) = ? then t0.instants else cast(? as jsonb) end) t11 where case when jsonb_typeof(t11.value) = ? then t11.value #>> ? end = ?) and exists (select 1 from jsonb_array_elements(case when jsonb_typeof(t0.tokens) = ? then t0.tokens else cast(? as jsonb) end) t12 where case when jsonb_typeof(t12.value)
        = ? then t12.value #>> ? end = ?)'}
    binds: [array, '[]', boolean, '{}', true, array, '[]', number, '{}', 3, array, '[]', number, '{}', 9007199254740993, array, '[]', number, '{}', 0.0, array, '[]', number, '{}', 2.5, array, '[]', string, '{}', '7.00', array, '[]', string, '{}', a, array, '[]', string, '{}', 0aff, array, '[]', string, '{}', '2024-02-29', array, '[]', string, '{}', '13:05:07.000250', array, '[]', string, '{}', '2024-06-01T10:00:00.000000Z', array, '[]', string, '{}', 12345678-1234-5678-1234-567812345678]
  graph:
    CollectionTwinItem:
    - id: 1
      flags: [true, false, true]
      smalls: [3, -2, 3]
      counts: [9007199254740993, 0]
      ratios: [1.2, 0.0]
      scores: [0.1, 2.5, 0.1]
      amounts: ['1.50', '1.50', '7.00']
      tags: [b, a, b]
      blobs: [0aff, '']
      days: ['2024-02-29']
      clocks: ['13:05:07.000250']
      instants: ['2024-06-01T10:00:00.000000Z']
      tokens: [12345678-1234-5678-1234-567812345678, 12345678-1234-5678-1234-567812345678]
      detail:
        labels: [x, y, x]
      parts:
      - sku: a
        marks: [2, 1, 2]
        note:
          words: [deep]
      - sku: b
        marks: []
  roundTrips: 1
