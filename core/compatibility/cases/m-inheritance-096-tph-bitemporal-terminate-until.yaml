      statements: 3
      note: inactivate the original (tag-guarded on kind='stock'), then chain head + tail (no middle)
      rows:
        - { id: 2 }
      validFrom: "2024-03-01T00:00:00.000000Z"
      at: "2024-02-15T00:00:00.000000Z"
      until: "2024-09-01T00:00:00.000000Z"
