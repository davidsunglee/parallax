# A ROW-FORM read that needs no document-resident member projects no Structured
# Column at all, even though the Entity declares the layout (m-storage-layout x m-sql
# *Read projection*), on Postgres AND MariaDB.
model: models/document-layout.yaml
tags: [m-storage-layout, m-sql, read, json, document-layout, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Beacon
    predicate:
      all: {}
then:
  statements:
    - sql:
        postgres: select t0.id from beacon t0
        mariadb: select t0.id from beacon t0
  referenceSql: select id from beacon
  rows:
    - { id: 10 }
    - { id: 11 }
  roundTrips: 1
