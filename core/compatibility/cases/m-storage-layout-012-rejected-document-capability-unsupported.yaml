# Negative (m-storage-layout): a well-formed root-owned Relational Document
# Layout is refused while this build cannot execute it end to end.
#
# `Order` is a standalone Entity declaring `layout.document` with a resolved
# Structured Column name, and nothing about it is malformed — the layout is
# root-owned, no member overrides a column, no Index reaches into the document,
# and `payload` collides with no direct column. It is refused anyway, because an
# implementation MUST NOT accept a layout whose reads and writes it cannot both
# execute: the Rule Set carries a declared capability scope list and this build
# still refuses the standalone shape. A model is accepted or refused whole, so
# the refusal is a formation rejection rather than a per-operation failure, and
# the entry — with the rule itself, once the list empties — is deleted by the
# phase that makes the shape work.
model: models/member-column-defaults.yaml
tags: [m-storage-layout, m-model-formation, m-descriptor, rejected, negative, document-layout, capability, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  model:
    entity:
      name: Order
      table: orders
      layout:
        document:
          column: payload
      attributes:
        - { name: id, type: int64, primaryKey: true }
        - { name: displayName, type: string }
        - { name: total, type: "decimal(12,2)" }
then:
  rejectedRule: storage-layout-document-capability-unsupported
