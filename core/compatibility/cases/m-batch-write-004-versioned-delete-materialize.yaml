# Versioned set-based DELETE materializes per key (m-batch-write + m-opt-lock, ADR 0014).
#
# The versioned complement of m-batch-write-003's collapse. A set-based delete
# targeting a VERSIONED entity (Account) has NO readless predicate template —
# every write against an existing versioned row requires that row's OWN prior
# observation in BOTH modes (optimistic binds it as that row's gate; locking needs
# the read that took its shared lock), and one predicate statement can neither
# carry nor acquire one — so it MATERIALIZES: one keyed
# `delete from account where id = ?` per resolved row, mirroring the
# versioned set-based UPDATE (m-opt-lock-003/004). This case DECLARES the
# `locking` preference, which resolves versioned Account to the Locking Effective
# Concurrency Strategy, so every per-key delete is UNGATED, exactly as the
# locking-mode versioned UPDATE (m-opt-lock-004) and the locking-mode temporal
# close are: the shared read lock the resolving read takes, not a version
# predicate, is what makes each removal correct (m-opt-lock: the Effective
# Concurrency Strategy determines the gate uniformly). The OPTIMISTIC
# counterpart (m-opt-lock-015) renders `and version =
# ?` per key instead, and a per-key gate matching zero rows there would be the
# `updatedRows != 1` conflict signal (m-opt-lock-005).
#
# Fixtures are loaded first (accounts 1/2/3 at version 1). The materialize deletes
# accounts 1 and 2, leaving account 3 untouched. The harness applies the ordered DML
# and reads the table back — the per-key materialize is proven by the rows it
# removes (1 and 2 gone, 3 intact), never collapsed into an IN list. The materialize
# READ round trip that resolves the predicate to rows is proven separately by the
# versioned set-based UPDATE scenarios (m-opt-lock-003/004); this case pins the
# versioned DELETE *write* shape.
model: models/account.yaml
tags: [m-batch-write, m-opt-lock, m-sql, write-sequence, materialize, slice-snapshot-1, slice-managed-1]
shape: writeSequence
given:
  fixtures: true
when:
  uow:
    concurrency: locking
  writeSequence:
    - mutation: delete
      entity: parallax.compatibility.Account
      statements: 2
      note: a versioned set-based delete materializes to ONE keyed delete per key, ungated in locking mode
      rows:
        - { id: 1, observedVersion: 1 }
        - { id: 2, observedVersion: 1 }
then:
  statements:
    - sql:
        postgres: delete from account where id = ?
      binds: [1]
    - sql:
        postgres: delete from account where id = ?
      binds: [2]
  tableState:
    account:
      - { id: 3, owner: Grace, balance: 10.00, version: 1 }
  roundTrips: 3
