# Repeatable Read forbids a nonrepeatable read across a STREAMED delivery
# (m-unit-work / m-snapshot-read / m-db-port): a unit of work opened at
# `when.uow.isolation: repeatable-read` pages the same query twice and delivers the
# same roots both times, across a peer transaction that committed a change to one of
# them in between.
model: models/account.yaml
tags: [m-unit-work, m-snapshot-read, isolation, repeatable-read, nonrepeatable-read, stream, streamed-delivery, scenario, slice-snapshot-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "a streamed delivery's keyset seek binds the previous page's last root, and the write's gate binds the version its own group's observing find returned"
when:
  uow:
    isolation: repeatable-read
  scenario:
    - uow: reader
      objectQuery:
        target: parallax.compatibility.Account
        predicate:
          all: {}
      stream:
        batchSize: 2
      roundTrips: 2
      note: the reading unit of work's first delivery — two pages, the second short of the size it asked for
      statements:
        - sql:
            postgres: select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 order by t0.id asc limit ?
            mariadb: select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 order by t0.id asc limit ?
          binds: [3]
        - sql:
            postgres: select u.id, u.owner, u.balance, u.version, u.parallax_seek_0 from ((select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 where t0.id >= ? and (t0.id > ? or t0.id is null) order by t0.id asc limit ?) union all (select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 where t0.id is null order by t0.id asc limit ?)) u order by u.parallax_seek_0 asc limit ?
            mariadb: select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 where t0.id >= ? and t0.id > ? order by t0.id asc limit ?
          binds: { postgres: [2, 2, 3, 3, 3], mariadb: [2, 2, 3] }
      referenceSql: select id, owner, balance, version from account
      expectRows:
        - { id: 1, owner: Ada, balance: "100.00", version: 1 }
        - { id: 2, owner: Linus, balance: "250.00", version: 1 }
        - { id: 3, owner: Grace, balance: "10.00", version: 1 }
    - uow: writer
      objectQuery:
        target: parallax.compatibility.Account
        predicate:
          eq:
            attr: parallax.compatibility.Account.id
            value: 2
      roundTrips: 1
      note: the writing unit of work observes account 2 before gating on it
      statements:
        - sql:
            postgres: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.id = ?
            mariadb: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.id = ?
          binds: [2]
      expectRows:
        - { id: 2, owner: Linus, balance: "250.00", version: 1 }
    - uow: writer
      write:
        - mutation: update
          entity: parallax.compatibility.Account
          rows:
            - { id: 2, balance: "999.00" }
      roundTrips: 1
      note: the gated update advancing the OBSERVED version 1 -> 2; the group COMMITS after this, its last step, while the reader is still open
      statements:
        - sql:
            postgres: update account set balance = ?, version = ? where id = ? and version = ?
            mariadb: update account set balance = ?, version = ? where id = ? and version = ?
          binds: ["999.00", 2, 2, 1]
    - uow: reader
      objectQuery:
        target: parallax.compatibility.Account
        predicate:
          all: {}
      stream:
        batchSize: 2
      roundTrips: 2
      note: the SAME delivery again MUST deliver the same roots — account 2 still 250.00 at version 1 across both pages; the group COMMITS after this, its last step
      statements:
        - sql:
            postgres: select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 order by t0.id asc limit ?
            mariadb: select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 order by t0.id asc limit ?
          binds: [3]
        - sql:
            postgres: select u.id, u.owner, u.balance, u.version, u.parallax_seek_0 from ((select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 where t0.id >= ? and (t0.id > ? or t0.id is null) order by t0.id asc limit ?) union all (select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 where t0.id is null order by t0.id asc limit ?)) u order by u.parallax_seek_0 asc limit ?
            mariadb: select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 where t0.id >= ? and t0.id > ? order by t0.id asc limit ?
          binds: { postgres: [2, 2, 3, 3, 3], mariadb: [2, 2, 3] }
      referenceSql: select id, owner, balance, version from account
      expectRows:
        - { id: 1, owner: Ada, balance: "100.00", version: 1 }
        - { id: 2, owner: Linus, balance: "250.00", version: 1 }
        - { id: 3, owner: Grace, balance: "10.00", version: 1 }
    - objectQuery:
        target: parallax.compatibility.Account
        predicate:
          eq:
            attr: parallax.compatibility.Account.id
            value: 2
      roundTrips: 1
      note: UNGROUPED, after both groups resolved — the peer's write is durable, 999.00 at version 2
      statements:
        - sql:
            postgres: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.id = ?
            mariadb: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.id = ?
          binds: [2]
      expectRows:
        - { id: 2, owner: Linus, balance: "999.00", version: 2 }
then:
  roundTrips: 7
