# Table-per-hierarchy narrow to ONE concrete subtype with a concrete-subtype predicate
# (m-inheritance, m-object-query, m-predicate, m-sql).
model: models/animal.yaml
tags: [m-inheritance, m-predicate, m-object-query, m-sql, table-per-hierarchy, narrow, familyVariant, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Animal
    predicate:
      greaterThan:
        attr: parallax.compatibility.Dog.barkVolume
        value: 3
    narrowTo:
      - parallax.compatibility.Dog
then:
  statements:
    - sql:
        postgres: select t0.id, t0.kind, t0.name, t0.owner_id, t0.license_id, t0.bark_volume from animal t0 where t0.bark_volume > ? and t0.kind = ?
      binds: [3, dog]
  referenceSql: select id, kind, name, owner_id, license_id, bark_volume from animal where bark_volume > 3 and kind = 'dog'
  rows:
    - { id: 1, name: Rex, owner_id: 10, license_id: L-100, bark_volume: 7, familyVariant: Dog }
  roundTrips: 1
