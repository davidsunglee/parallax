# Retry exhaustion (m-execution-log): every attempt rolls back, and the BOUND —
# not the classifier — is what stops the loop.
#
# A persistent injected deadlock fails the write on every attempt under
# `retries: 1`, so the log holds two attempts and both are `rolled-back`. The
# semantic distinction this case pins down is that each failure still reports
# `retryEligible: true`: retry eligibility is the classifier's verdict under the
# effective policy, INDEPENDENT of the remaining budget and claiming nothing
# about whether another attempt occurred. Reading the log's `retryPolicy`
# alongside those verdicts is what explains a missing successor — a caller sees a
# retriable failure that ran out of budget, not a failure reclassified as
# non-retriable after the fact. The sibling m-execution-log-004 is the same
# classifier verdict with budget left.
#
# The failed write is still a Database Call: it reached the port and came back,
# so it counts one round trip and completes as `failed` with the neutral
# m-db-error category, while begin, commit, and rollback count none. Four round
# trips across two attempts is therefore two reads plus two failed writes — a
# total no per-attempt count reconstructs.
#
# `lane: api-conformance`: a persistent injected transient and an exhausted bound
# need a fault a real database cannot be asked to produce, so no golden SQL is
# authored and each Database Call omits its `statement` index — the call's kind
# and completion are the whole portable oracle here. Satisfied by each language's
# API Conformance Suite.
model: models/account.yaml
tags: [m-execution-log, m-auto-retry, m-api-conformance, transient, slice-snapshot-1]
lane: api-conformance
shape: boundary
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection concurrency/locking intent (given.fault, shape:boundary)"
given:
  fault: deadlock
when:
  uow:
    concurrency: locking
    retries: 1
  boundary:
    - action: read
      note: observe the row the write addresses
    - action: update
      note: the write deadlocks on every attempt — the bound, not the classifier, ends the loop
then:
  outcome: deadlock
  roundTrips: 4
  execution:
    transactionLog:
      concurrency: locking
      retryPolicy:
        maxRetries: 1
        retryOptimisticConflicts: false
      attempts:
        - status: rolled-back
          traces:
            - readTrace:
                calls:
                  - kind: read
                    completion:
                      readCompleted:
                        returnedRows: 1
                roundTrips: 1
            - writeBatch:
                trigger: finalization
                calls:
                  - kind: write
                    completion:
                      failed:
                        category: deadlock
                roundTrips: 1
          roundTrips: 2
          failure:
            phase: finalization
            retryEligible: true
            databaseCall: 1
        - status: rolled-back
          traces:
            - readTrace:
                calls:
                  - kind: read
                    completion:
                      readCompleted:
                        returnedRows: 1
                roundTrips: 1
            - writeBatch:
                trigger: finalization
                calls:
                  - kind: write
                    completion:
                      failed:
                        category: deadlock
                roundTrips: 1
          roundTrips: 2
          failure:
            phase: finalization
            retryEligible: true
            databaseCall: 1
      roundTrips: 4
