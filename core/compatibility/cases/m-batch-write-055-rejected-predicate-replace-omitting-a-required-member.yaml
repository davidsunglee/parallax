# A predicate-selected replacement states each selected object's whole writable
# state, so a row omitting a required member is refused when it is prepared,
# exactly as any replacement omitting it is (m-batch-write, m-unit-work).
model: models/wallet.yaml
tags: [m-batch-write, m-unit-work, rejected, predicate-write, replace, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  write:
    mutation: replace
    target:
      entity: parallax.compatibility.Wallet
      predicate:
        lessThan:
          path: parallax.compatibility.Wallet.balance
          value: "200.00"
    row:
      owner: Ada
then:
  rejectedRule: write-required-attribute-missing
