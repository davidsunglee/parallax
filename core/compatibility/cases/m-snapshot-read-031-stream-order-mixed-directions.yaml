# A streamed read advances by the Continuation Order — the authored Sort Keys in
# the precedence the query declares, then the primary key ascending
# (m-snapshot-read) — and its seek measures "after" in EACH term's own direction.
#
# The query orders by `active` descending and `qty` ascending, so the composed
# order is three terms pointing two ways: `active desc, qty asc, id asc`. Four
# orders share `active: true`, which is what makes the second and third terms
# load-bearing — a seek that compared only the leading term would re-deliver or
# skip the whole tie group at every page boundary.
#
# `active` is non-nullable, so a continuing page hoists the redundant leading
# range `t0.active <= ?` ahead of the lexicographic remainder: the remainder
# alone offers a planner nothing to push down, while the hoisted conjunct is the
# ordinary AND-qual an index range is reached through, and `<=` rather than `>=`
# because the leading term descends. Behind it sit three branches, one per tie
# depth — the leading term strictly after its coordinate, or equal to it and the
# second strictly after its own, or both equal and the key strictly after its own
# — each binding the coordinates it ties with before its own.
#
# Pages of 2 over 6 roots: {1, 2}, then {4, 42} seeking past (true, 10, 2), then
# {3, 5} seeking past (true, 30, 42), then the empty terminal statement seeking
# past (false, 25, 5) that a full final page costs. Four root statements, no
# includes, and the delivered graph is the eager read's own.
model: models/orders.yaml
tags: [m-snapshot-read, m-object-query, stream, streamed-delivery, orderBy, ordering, graph, materialization, slice-snapshot-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "a streamed read's keyset seek - each continuing root statement binds the Continuation Order coordinates of the root the previous page delivered last, so the emissions depend on a query result even though the read declares no includes"
when:
  objectQuery:
    target: parallax.compatibility.Order
    predicate:
      all: {}
    orderBy:
      - attr: parallax.compatibility.Order.active
        direction: desc
      - attr: parallax.compatibility.Order.qty
        direction: asc
  stream:
    batchSize: 2
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 order by t0.active desc, t0.qty asc, t0.id asc limit ?
        mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 order by t0.active desc, t0.qty asc, t0.id asc limit ?
      binds: [2]
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.active <= ? and (t0.active < ? or (t0.active = ? and t0.qty > ?) or (t0.active = ? and t0.qty = ? and t0.id > ?)) order by t0.active desc, t0.qty asc, t0.id asc limit ?
        mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.active <= ? and (t0.active < ? or (t0.active = ? and t0.qty > ?) or (t0.active = ? and t0.qty = ? and t0.id > ?)) order by t0.active desc, t0.qty asc, t0.id asc limit ?
      binds: [true, true, true, 10, true, 10, 2, 2]
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.active <= ? and (t0.active < ? or (t0.active = ? and t0.qty > ?) or (t0.active = ? and t0.qty = ? and t0.id > ?)) order by t0.active desc, t0.qty asc, t0.id asc limit ?
        mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.active <= ? and (t0.active < ? or (t0.active = ? and t0.qty > ?) or (t0.active = ? and t0.qty = ? and t0.id > ?)) order by t0.active desc, t0.qty asc, t0.id asc limit ?
      binds: [true, true, true, 30, true, 30, 42, 2]
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.active <= ? and (t0.active < ? or (t0.active = ? and t0.qty > ?) or (t0.active = ? and t0.qty = ? and t0.id > ?)) order by t0.active desc, t0.qty asc, t0.id asc limit ?
        mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.active <= ? and (t0.active < ? or (t0.active = ? and t0.qty > ?) or (t0.active = ? and t0.qty = ? and t0.id > ?)) order by t0.active desc, t0.qty asc, t0.id asc limit ?
      binds: [false, false, false, 25, false, 25, 5, 2]
  referenceSql: select id, name, sku, qty, price, active, ordered_on from orders
  graph:
    Order:
      - { id: 1, name: Ada, sku: A-100, qty: 5, price: "10.50", active: true, orderedOn: 2024-01-05 }
      - { id: 2, name: Linus, sku: B-200, qty: 10, price: "20.00", active: true, orderedOn: 2024-02-10 }
      - { id: 4, name: Margaret, sku: null, qty: 20, price: "40.00", active: true, orderedOn: 2024-04-20 }
      - { id: 42, name: Grace, sku: A-999, qty: 30, price: "99.99", active: true, orderedOn: 2024-06-30 }
      - { id: 3, name: ada, sku: A-300, qty: 15, price: "30.25", active: false, orderedOn: 2024-03-15 }
      - { id: 5, name: Alan, sku: "C_50%", qty: 25, price: "50.75", active: false, orderedOn: 2024-05-25 }
  roundTrips: 4
