# Columns half of the assigned-occurrence replacement proof: one update assigns both
# occurrences of item 1 and each is REPLACED whole, at either cardinality, while the
# member outside them rides forward as stored. Its twin authors the same update and
# the same expected row under Relational Document Layout.
#
# The stored `spec` carries `title`, `note`, a nested `one` `origin`, and a nested
# `many` `stops`; the assignment names `title` alone. Afterwards `note` and `origin`
# are gone and `stops` is the empty array, because the author stated a complete value
# and no stored member is merged back into it — replacement reaches every depth of
# the occurrence, not just its own level. `marks` shows the same rule at the top
# level: the two stored elements are gone and the assigned one-element array is the
# whole of it. `label` was never mentioned, so it is still `north`.
#
# The semantic distinction this pair pins down is that the unit of replacement is the
# ASSIGNED OCCURRENCE — narrower than the row, wider than the members the assignment
# named. An implementation that merged the stored subtree back would keep `origin`;
# one that rewrote the row would lose `label`. Both members publish the same row
# afterwards, which is what makes the unit layout-independent rather than a property
# of storing one occurrence per Column. `WriteTwinItem` declares no version and no
# As-Of Axis, so its Effective Concurrency Strategy is Locking: the write's own
# resolving read takes the shared row lock that licenses it, and the dependent find
# takes it again.
model: models/write-transparency-layout-twin-columns.yaml
tags: [m-storage-layout, m-value-object, m-document-codec, m-unit-work, m-opt-lock, m-read-lock, m-sql, scenario, update, json, nested, to-many, layout-twin, columns, slice-snapshot-1, slice-managed-1]
shape: scenario
when:
  scenario:
    - write:
        - mutation: update
          entity: parallax.compatibility.WriteTwinItem
          rows:
            - id: 1
              spec:
                title: Pilot
              marks:
                - { code: Z }
      roundTrips: 2
      note: assign both occurrences, naming one leaf of the `one` and one element of the `many`
      statements:
        - sql:
            postgres: update write_twin set spec = ?, marks = ? where id = ?
            mariadb: update write_twin set spec = ?, marks = ? where id = ?
          binds:
            - title: Pilot
              stops: []
            - - { code: Z }
            - 1
    - objectQuery:
        target: parallax.compatibility.WriteTwinItem
        predicate:
          eq:
            attr: parallax.compatibility.WriteTwinItem.id
            value: 1
      roundTrips: 1
      note: the dependent find observes the replaced occurrences and the untouched `label`
      statements:
        - sql:
            postgres: select t0.id, t0.label, not t0.spec is null, t0.spec, not t0.marks is null, t0.marks from write_twin t0 where t0.id = ? for share of t0
            mariadb: select t0.id, t0.label, not t0.spec is null, t0.spec, not t0.marks is null, t0.marks from write_twin t0 where t0.id = ? lock in share mode
          binds: [1]
      expectRows:
        - id: 1
          label: north
          spec:
            title: Pilot
            note: null
            origin: null
            stops: []
          marks:
            - { code: Z }
then:
  roundTrips: 3
  tableState:
    write_twin:
      - id: 1
        label: north
        spec:
          title: Pilot
          stops: []
        marks:
          - { code: Z }
      - id: 2
        label: south
        spec:
          title: Meridian
          note: second
          origin: { country: SE }
          stops:
            - { port: Bergen }
        marks:
          - { code: C }
