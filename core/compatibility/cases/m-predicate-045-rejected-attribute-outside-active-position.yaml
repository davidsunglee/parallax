# Negative (m-predicate positional rule): a predicate reference names an entity the
# read is not positioned at, and no narrow can bring it into scope.
model: models/animal.yaml
tags: [m-predicate, m-inheritance, rejected, negative, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  objectQuery:
    target: parallax.compatibility.Animal
    predicate:
      eq:
        attr: parallax.compatibility.Person.name
        value: Ada
then:
  rejectedRule: attribute-outside-active-position
