# Portable document encoding: a `date` leaf compares as the extracted TEXT, with no
# cast on either dialect, and its ISO-8601 spelling is what makes that order-correct
# (m-document-codec, m-dialect text-compared table, m-sql), on Postgres AND MariaDB.
model: models/document-codec.yaml
tags: [m-document-codec, m-value-object, m-sql, m-dialect, nested, json, temporal, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Sample
    predicate:
      nestedGt:
        path: parallax.compatibility.Sample.profile.day
        value: '2025-12-31'
then:
  statements:
    - sql:
        postgres: select t0.id, t0.label from sample t0 where jsonb_extract_path_text(t0.profile, ?) > ?
        mariadb: select t0.id, t0.label from sample t0 where json_value(t0.profile, ?) > ?
      binds:
        postgres: [day, '2025-12-31']
        mariadb: ['$.day', '2025-12-31']
  referenceSql:
    postgres: select id, label from sample where profile ->> 'day' > '2025-12-31'
    mariadb: select id, label from sample where nullif(json_unquote(json_extract(profile, '$.day')), 'null') > '2025-12-31'
  rows:
    - { id: 1, label: Ada }
  roundTrips: 1
