# Rollback / abort scenario for DELETE (m-unit-work): a DELETE performed inside a
# unit of work that ABORTS is discarded — a post-abort find observes the ORIGINAL row.
model: models/account.yaml
tags: [m-unit-work, rollback, abort, scenario, slice-snapshot-1, slice-managed-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "the versioned delete's required observation is the one the unit of work's own observing find recorded — a query result the compile lane cannot derive (m-opt-lock)"
when:
  scenario:
    - uow: doomed-delete
      objectQuery:
        target: parallax.compatibility.Account
        predicate:
          eq:
            attr: parallax.compatibility.Account.id
            value: 3
      roundTrips: 1
      note: observe account 3 (Grace, balance 10.00, version 1) before the delete, inside the doomed unit of work
      statements:
        - sql:
            postgres: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.id = ?
          binds: [3]
      expectRows:
        - { id: 3, owner: Grace, balance: "10.00", version: 1 }
    - uow: doomed-delete
      write:
        - mutation: delete
          entity: parallax.compatibility.Account
          rows:
            - { id: 3 }
      rollback: true
      roundTrips: 1
      note: "apply a gated delete of the OBSERVED account 3 — dooms the group (rollback: true)"
      statements:
        - sql:
            postgres: delete from account where id = ? and version = ?
          binds: [3, 1]
    - uow: doomed-delete
      objectQuery:
        target: parallax.compatibility.Account
        predicate:
          eq:
            attr: parallax.compatibility.Account.id
            value: 3
      roundTrips: 1
      note: the SAME find re-issued INSIDE the still-open doomed transaction (mirrors the story's forced-flush find) — it MUST observe the deletion; the group ROLLS BACK after this, its last step
      statements:
        - sql:
            postgres: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.id = ?
          binds: [3]
      expectRows: []
    - objectQuery:
        target: parallax.compatibility.Account
        predicate:
          eq:
            attr: parallax.compatibility.Account.id
            value: 3
      roundTrips: 1
      note: the dependent post-abort find, UNGROUPED — the aborted delete was discarded, so this MUST observe the ORIGINAL account 3
      statements:
        - sql:
            postgres: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.id = ?
          binds: [3]
      expectRows:
        - { id: 3, owner: Grace, balance: "10.00", version: 1 }
then:
  roundTrips: 4
