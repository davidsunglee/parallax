# Retry then commit (m-execution-log): ONE Execution Log spans both physical
# attempts of one logical invocation.
#
# An injected optimistic-lock conflict makes the first attempt's gated UPDATE
# match nothing, and `retryOptimisticConflicts: true` joins that conflict to the
# retriable set, so the boundary RE-EXECUTES the whole closure: the second
# attempt re-reads the now-current version and its re-applied UPDATE lands. The
# semantic distinction this case pins down is that those two attempts are ONE
# log, not two: a retry is a physical re-execution of the same logical
# invocation, so the rolled-back attempt survives in `attempts[0]` instead of
# being discarded with the transaction that produced it. Nothing else in the
# corpus can observe a failed attempt after the fact.
#
# Each attempt's zero-row and one-row outcomes are ordinary `writeCompleted`
# completions — the call REACHED the database and returned a count, so a
# shortfall is not a failed call. What records the shortfall is the attempt's
# detached failure: `finalization` phase (the boundary-owned batch raised it),
# `retryEligible: true` (the classifier's verdict under this invocation's
# optimistic-conflict opt-in), and a `databaseCall` index into that attempt's own
# flattened calls naming the completed call the enforcement rejected. The
# committed attempt carries no failure at all. Its sibling m-execution-log-005 is
# the SAME classifier verdict with the budget spent instead of left.
#
# `roundTrips` counts every attempted call across attempts, so it is 4 for a
# read-then-write closure retried once — the one number in the corpus that a
# per-attempt count cannot reconstruct.
#
# `lane: api-conformance`: an injected conflict and a re-executed closure are
# observables a single-connection harness cannot provoke, and the conflict-shape
# `when.attempts` form cannot express them either — that form authors each
# attempt's own write and drives each as its own transaction, which is a
# sequence of invocations rather than one invocation retried. No golden SQL is
# authored, so each Database Call omits its `statement` index. Satisfied by each
# language's API Conformance Suite.
model: models/account.yaml
tags: [m-execution-log, m-opt-lock, m-auto-retry, m-api-conformance, retry]
lane: api-conformance
shape: boundary
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection concurrency/locking intent (given.fault, shape:boundary)"
given:
  fault: optimistic-lock-conflict
when:
  uow:
    concurrency: optimistic
    retryOptimisticConflicts: true
  boundary:
    - action: read
      note: observe the versioned row (records the observed version)
    - action: update
      note: the gated UPDATE conflicts once; the auto-retry re-reads and the second attempt commits
then:
  outcome: committed
  roundTrips: 4
  execution:
    transactionLog:
      concurrency: optimistic
      retryPolicy:
        maxRetries: 10
        retryOptimisticConflicts: true
      attempts:
        - status: rolled-back
          traces:
            - readTrace:
                calls:
                  - kind: read
                    completion:
                      readCompleted:
                        returnedRows: 1
                roundTrips: 1
            - writeBatch:
                trigger: finalization
                calls:
                  - kind: write
                    completion:
                      writeCompleted:
                        affectedRows: 0
                roundTrips: 1
          roundTrips: 2
          failure:
            phase: finalization
            code: optimistic-lock-conflict
            retryEligible: true
            databaseCall: 1
        - status: committed
          traces:
            - readTrace:
                calls:
                  - kind: read
                    completion:
                      readCompleted:
                        returnedRows: 1
                roundTrips: 1
            - writeBatch:
                trigger: finalization
                calls:
                  - kind: write
                    completion:
                      writeCompleted:
                        affectedRows: 1
                roundTrips: 1
          roundTrips: 2
      roundTrips: 4
