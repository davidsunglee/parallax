model: models/account.yaml
tags: [m-opt-lock, m-unit-work, m-sql, write-sequence, slice-snapshot-1, slice-managed-1]
shape: writeSequence
given:
  fixtures: true
when:
  uow:
    concurrency: optimistic
  writeSequence:
    - mutation: delete
      entity: parallax.compatibility.Account
      statements: 1
      note: the caller states the key and the version it last observed; nothing is read first, and that version gates the delete, so a row that no longer stands at it fails the caller's precondition rather than deleting nothing
      row: { id: 2 }
      ifVersion: 1
then:
  statements:
    - sql:
        postgres: delete from account where id = ? and version = ?
      binds: [2, 1]
  tableState:
    account:
      - { id: 1, owner: Ada, balance: "100.00", version: 1 }
      - { id: 3, owner: Grace, balance: "10.00", version: 1 }
  databaseCalls: 1
