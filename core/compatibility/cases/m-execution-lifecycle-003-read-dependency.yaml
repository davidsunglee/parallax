# Read dependency (m-execution-lifecycle): the batch a dependent read forced
# carries the `read-dependency` trigger and FINISHES before the Read it enabled
# starts.
model: models/account.yaml
tags: [m-execution-lifecycle, m-unit-work, slice-snapshot-1, write-batch, read-dependency]
shape: scenario
when:
  uow:
    concurrency: locking
  scenario:
    - uow: dependency
      write:
        - mutation: insert
          entity: parallax.compatibility.Account
          rows:
            - { id: 7, owner: Newton, balance: "5.00", version: 1 }
      roundTrips: 1
      note: buffer an insert of a brand-new account 7 inside the group; nothing flushes yet
      statements:
        - sql:
            postgres: insert into account(id, owner, balance, version) values (?, ?, ?, ?)
          binds: [7, Newton, "5.00", 1]
    - uow: dependency
      objectQuery:
        target: parallax.compatibility.Account
        predicate:
          eq:
            attr: parallax.compatibility.Account.id
            value: 7
      roundTrips: 1
      note: the dependent find forces the buffered insert out as a read-dependency batch, then observes it; the group COMMITS after this, its last step
      statements:
        - sql:
            postgres: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.id = ? for share of t0
          binds: [7]
      expectRows:
        - { id: 7, owner: Newton, balance: "5.00", version: 1 }
then:
  roundTrips: 2
  executionLifecycle:
    roots:
      - execution: 1
        kind: transaction-invocation
        events:
          - sequence: 1
            activity: 1
            parent: null
            transactionInvocationStarted:
              invocation: outer
              concurrency: locking
              retries: 10
              retryOptimisticConflicts: false
              isolation: read-committed
          - sequence: 2
            activity: 2
            parent: 1
            transactionAttemptStarted: {edition: account}
          - sequence: 3
            activity: 3
            parent: 2
            acquisitionStarted: {}
          - sequence: 4
            activity: 3
            parent: 2
            acquisitionFinished: { outcome: acquired }
          - sequence: 5
            activity: 4
            parent: 2
            writeBatchStarted: { trigger: read-dependency }
          - sequence: 6
            activity: 5
            parent: 4
            databaseCallStarted:
              target: parallax.compatibility.Account
              kind: write
              statement: 0
          - sequence: 7
            activity: 5
            parent: 4
            databaseCallFinished: { outcome: writeCompleted, affectedRows: 1 }
          - sequence: 8
            activity: 4
            parent: 2
            writeBatchFinished: { outcome: completed }
          - sequence: 9
            activity: 6
            parent: 2
            readStarted: { target: parallax.compatibility.Account, interface: wire }
          - sequence: 10
            activity: 7
            parent: 6
            databaseCallStarted:
              target: parallax.compatibility.Account
              kind: read
              statement: 1
          - sequence: 11
            activity: 7
            parent: 6
            databaseCallFinished: { outcome: readCompleted, returnedRows: 1 }
          - sequence: 12
            activity: 6
            parent: 2
            readFinished: { outcome: completed }
          - sequence: 13
            activity: 8
            parent: 2
            releaseStarted: {}
          - sequence: 14
            activity: 8
            parent: 2
            releaseFinished: { cleanup: returned }
          - sequence: 15
            activity: 2
            parent: 1
            transactionAttemptFinished: { outcome: committed }
          - sequence: 16
            activity: 1
            parent: null
            transactionInvocationFinished: { outcome: committed }