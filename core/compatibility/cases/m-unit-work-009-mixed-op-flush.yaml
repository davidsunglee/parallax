# Mixed-op flush ordering (m-unit-work): one unit of work buffering an INSERT, an
# UPDATE, and a DELETE flushes them in the combined canonical order — inserts,
# then updates, then deletes.
model: models/account.yaml
tags: [m-unit-work, m-sql, mixed-op-flush, scenario, slice-snapshot-1, slice-managed-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "the versioned update's version bind is the framework-owned advance of the version its own observing find returned, and the versioned delete requires that find's observation to run at all — a query result (m-opt-lock)"
given:
  fixtures: true
when:
  scenario:
    - uow: mixed-flush
      objectQuery:
        target: parallax.compatibility.Account
        predicate:
          eq:
            attr: parallax.compatibility.Account.id
            value: 1
      roundTrips: 1
      note: observe account 1 (Ada, balance 100.00, version 1) before the update, inside the SAME unit of work as the flush below
      statements:
        - sql:
            postgres: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.id = ?
          binds: [1]
      expectRows:
        - { id: 1, owner: Ada, balance: "100.00", version: 1 }
    - uow: mixed-flush
      objectQuery:
        target: parallax.compatibility.Account
        predicate:
          eq:
            attr: parallax.compatibility.Account.id
            value: 3
      roundTrips: 1
      note: observe account 3 (Grace, balance 10.00, version 1) before the delete, inside the SAME unit of work as the flush below
      statements:
        - sql:
            postgres: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.id = ?
          binds: [3]
      expectRows:
        - { id: 3, owner: Grace, balance: "10.00", version: 1 }
    - uow: mixed-flush
      write:
        - mutation: insert
          entity: parallax.compatibility.Account
          rows:
            - { id: 9, owner: Noether, balance: "5.00", version: 1 }
        - mutation: update
          entity: parallax.compatibility.Account
          rows:
            - { id: 1, balance: "20.00" }
        - mutation: delete
          entity: parallax.compatibility.Account
          rows:
            - { id: 3 }
      roundTrips: 3
      note: one flush, combined order — insert account 9, update the observed account 1, delete the observed account 3; the unit of work commits at the group's last step below
      statements:
        - sql:
            postgres: insert into account(id, owner, balance, version) values (?, ?, ?, ?)
          binds: [9, Noether, "5.00", 1]
        - sql:
            postgres: update account set balance = ?, version = ? where id = ? and version = ?
          binds: ["20.00", 2, 1, 1]
        - sql:
            postgres: delete from account where id = ? and version = ?
          binds: [3, 1]
    - uow: mixed-flush
      objectQuery:
        target: parallax.compatibility.Account
        predicate:
          lessThan:
            attr: parallax.compatibility.Account.balance
            value: "50.00"
      roundTrips: 1
      note: the combined net state — account 1 (20.00) + account 9 (5.00); account 3 was deleted, account 2 excluded. The group COMMITS after this, its last step.
      statements:
        - sql:
            postgres: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.balance < ?
          binds: ["50.00"]
      expectRows:
        - { id: 1, owner: Ada, balance: "20.00", version: 2 }
        - { id: 9, owner: Noether, balance: "5.00", version: 1 }
then:
  roundTrips: 6
