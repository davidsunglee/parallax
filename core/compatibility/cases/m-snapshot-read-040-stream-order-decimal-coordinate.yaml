# A streamed page ordered by a document-resident `decimal(12,2)` compares under
# the declared type's cast, so the captured carrier is what that cast evaluated
# and the seek binds it back at the declared scale. Both the caller predicate and
# the generated seek carry `10.25` while every comparison casts the extracted
# digit string numerically. The terminal continuation is what would expose a
# host-float rendering or a lost fixed scale.
model: models/stream-coordinates.yaml
tags: [m-snapshot-read, m-object-query, stream, streamed-delivery, decimal, document-layout, cast, graph, slice-snapshot-1]
shape: read
compileEligibility: { mode: run-only, reason: query-result-dependent }
when:
  objectQuery:
    target: parallax.compatibility.StreamCoordinate
    predicate: { eq: { attr: parallax.compatibility.StreamCoordinate.amount, value: "10.25" } }
    orderBy: [{ attr: parallax.compatibility.StreamCoordinate.amount }]
  stream: { batchSize: 1 }
then:
  statements:
    - sql: { postgres: "select t0.id, not t0.coordinates is null, t0.coordinates, cast(jsonb_extract_path_text(t0.coordinates, ?) as decimal(12, 2)) parallax_seek_0, t0.id parallax_seek_1 from stream_coordinate t0 where cast(jsonb_extract_path_text(t0.coordinates, ?) as decimal(12, 2)) = ? order by cast(jsonb_extract_path_text(t0.coordinates, ?) as decimal(12, 2)) asc, t0.id asc limit ?" }
      binds: { postgres: [amount, amount, "10.25", amount, 1] }
    - sql: { postgres: "select t0.id, not t0.coordinates is null, t0.coordinates, cast(jsonb_extract_path_text(t0.coordinates, ?) as decimal(12, 2)) parallax_seek_0, t0.id parallax_seek_1 from stream_coordinate t0 where cast(jsonb_extract_path_text(t0.coordinates, ?) as decimal(12, 2)) = ? and cast(jsonb_extract_path_text(t0.coordinates, ?) as decimal(12, 2)) >= ? and (cast(jsonb_extract_path_text(t0.coordinates, ?) as decimal(12, 2)) > ? or jsonb_extract_path_text(t0.coordinates, ?) is null or (cast(jsonb_extract_path_text(t0.coordinates, ?) as decimal(12, 2)) = ? and (t0.id > ? or t0.id is null))) order by cast(jsonb_extract_path_text(t0.coordinates, ?) as decimal(12, 2)) asc, t0.id asc limit ?" }
      binds: { postgres: [amount, amount, "10.25", amount, "10.25", amount, "10.25", amount, amount, "10.25", 101, amount, 1] }
  referenceSql: { postgres: "select id, coordinates ->> 'amount' as amount from stream_coordinate where coordinates ->> 'amount' = '10.25'" }
  graph: { StreamCoordinate: [{ id: 101, day: "2026-01-15", clock: "09:30:00", amount: "10.25", payload: "0a1b", token: "00000000-0000-4000-8000-0000000000ab", instant: "2026-01-15T09:30:00.000000Z", f32: 1.5, f64: 2.25 }] }
  roundTrips: 2
