# Back-reference cycle in a snapshot graph (m-snapshot-read): an included
# back-reference points to the ORIGINAL node, a legal in-memory cycle.
#
# Order 1 is materialized with `[items, items.order]`: each OrderItem's `order`
# back-reference reaches the ROOT order — an ancestor already on the current path, a
# true cycle. What makes the graph JSON a finite value tree is the requested include
# tree, not a cycle detector: `items.order` is the LAST level, so the node it reaches
# is unwound with no level left to follow and renders its own members in full with no
# relationship at all. The unwind therefore terminates after 1 (root) + 1 (items) = 2
# round trips and the cycle emits no third query. The rendered back-reference carries
# the ancestor's whole value rather than a primary-key stub, so the graph states what
# was reached instead of deferring the claim to a separate reference-identity
# assertion.
model: models/orders.yaml
tags: [m-snapshot-read, m-object-query, m-deep-fetch, back-reference, cycle, relationship, graph, slice-snapshot-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "deep-fetch child level - the Order.items IN-list binds are the distinct order ids gathered from the root query result, so the child emissions depend on a query result (the back-reference OrderItem.order hop resolves from the already-materialized graph and issues no SQL of its own)"
lane: api-conformance
when:
  objectQuery:
    target: parallax.compatibility.Order
    predicate:
      eq:
        attr: parallax.compatibility.Order.id
        value: 1
    includes:
      - segments:
          - rel: parallax.compatibility.Order.items
          - rel: parallax.compatibility.OrderItem.order
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.id = ?
      binds: [1]
    - sql:
        postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id in (?) order by t0.id desc
      binds: [1]
  referenceSql: select id, name, sku, qty, price, active, ordered_on from orders where id = 1
  graph:
    Order:
      - id: 1
        name: Ada
        sku: A-100
        qty: 5
        price: 10.50
        active: true
        orderedOn: 2024-01-05
        items:
          - id: 12
            orderId: 1
            sku: B-200
            quantity: 1
            shippedOn: 2024-02-15
            order:
              id: 1
              name: Ada
              sku: A-100
              qty: 5
              price: 10.50
              active: true
              orderedOn: 2024-01-05
          - id: 11
            orderId: 1
            sku: A-100
            quantity: 2
            shippedOn: null
            order:
              id: 1
              name: Ada
              sku: A-100
              qty: 5
              price: 10.50
              active: true
              orderedOn: 2024-01-05
  roundTrips: 2
