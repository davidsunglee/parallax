# Optimistic bitemporal inactivation gated on a STALE observed in_z affects ZERO rows
# even though a current row for the same Valid-Time window exists — the bitemporal
# lost update the in_z gate catches (m-temporal-write + m-opt-lock). It carries the
# stale-gate conflict the conflict form pinned — the close-only shape addressed by
# the key, the observed rectangle's open Valid-Time end and the open out_z, gated on
# an in_z no longer current — now produced by a public `terminate` over exactly the
# observed rectangle's extent, racing a concurrent unit of work's public `update`
# of the same rectangle that committed first. It additionally grades both units'
# fates and the state the race leaves: the winner's close and changed successor
# stand, and the loser's close changes no row.
model: models/position.yaml
tags: [m-temporal-write, m-opt-lock, m-unit-work, m-sql, bitemporal, temporal, as-of, optimistic-lock-conflict, scenario, slice-snapshot-1, slice-managed-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "each close is addressed and gated by the rectangle its own group's find observed, and the concurrent update's successor carries that rectangle's unassigned members — a query result (m-case-format 'Settling against a grouped find')"
when:
  uow:
    concurrency: optimistic
  scenario:
    - uow: ours
      objectQuery:
        target: parallax.compatibility.Position
        predicate:
          eq:
            path: parallax.compatibility.Position.id
            value: 1
        temporal:
          transaction-time:
            asOf: latest
          valid-time:
            asOf: "2024-06-01T00:00:00.000000Z"
      roundTrips: 1
      note: OUR unit of work observes R3 — id 1 pinned at Valid Time 2024-06-01, its own start, the open current rectangle (200.00, known from 2024-04-01)
      statements:
        - sql:
            postgres: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? and t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?
            mariadb: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? and t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?
          binds: [1, "2024-06-01T00:00:00.000000Z", "2024-06-01T00:00:00.000000Z", infinity]
      expectRows:
        - { pos_id: 1, acct_num: A, val: "200.00", from_z: "2024-06-01T00:00:00.000000Z", thru_z: infinity, in_z: "2024-04-01T00:00:00.000000Z", out_z: infinity }
    - uow: concurrent
      objectQuery:
        target: parallax.compatibility.Position
        predicate:
          eq:
            path: parallax.compatibility.Position.id
            value: 1
        temporal:
          transaction-time:
            asOf: latest
          valid-time:
            asOf: "2024-06-01T00:00:00.000000Z"
      roundTrips: 1
      note: a CONCURRENT unit of work observes the SAME rectangle — the classic race
      statements:
        - sql:
            postgres: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? and t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?
            mariadb: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? and t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?
          binds: [1, "2024-06-01T00:00:00.000000Z", "2024-06-01T00:00:00.000000Z", infinity]
      expectRows:
        - { pos_id: 1, acct_num: A, val: "200.00", from_z: "2024-06-01T00:00:00.000000Z", thru_z: infinity, in_z: "2024-04-01T00:00:00.000000Z", out_z: infinity }
    - uow: concurrent
      write:
        - mutation: amend
          "on": 1
          entity: parallax.compatibility.Position
          rows:
            - { id: 1, value: "250.00" }
          validFrom: "2024-06-01T00:00:00.000000Z"
          at: "2024-05-01T00:00:00.000000Z"
      roundTrips: 2
      note: the concurrent unit of work commits FIRST — an update from the observed rectangle's own start has no head, so its close gated on the in_z it observed, then the changed successor [2024-06-01, infinity) from the same instant; the group COMMITS after this, its last step
      statements:
        - sql:
            postgres: update position set out_z = ? where pos_id = ? and thru_z = ? and out_z = ? and in_z = ?
            mariadb: update `position` set out_z = ? where pos_id = ? and thru_z = ? and out_z = ? and in_z = ?
          binds: ["2024-05-01T00:00:00.000000Z", 1, infinity, infinity, "2024-04-01T00:00:00.000000Z"]
        - sql:
            postgres: insert into position(pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
            mariadb: insert into `position` (pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
          binds: [1, A, "250.00", "2024-06-01T00:00:00.000000Z", infinity, "2024-05-01T00:00:00.000000Z", infinity]
    - uow: ours
      write:
        - mutation: terminate
          "on": 0
          entity: parallax.compatibility.Position
          rows:
            - { id: 1 }
          validFrom: "2024-06-01T00:00:00.000000Z"
          at: "2024-10-01T00:00:00.000000Z"
      roundTrips: 1
      note: "our terminate from the observed rectangle's own start through its open end is the close alone, gated on OUR observed in_z 2024-04-01, which the concurrent commit closed — 0 rows; the commit's flush fails and the group ROLLS BACK after this, its last step"
      statements:
        - sql:
            postgres: update position set out_z = ? where pos_id = ? and thru_z = ? and out_z = ? and in_z = ?
            mariadb: update `position` set out_z = ? where pos_id = ? and thru_z = ? and out_z = ? and in_z = ?
          binds: ["2024-10-01T00:00:00.000000Z", 1, infinity, infinity, "2024-04-01T00:00:00.000000Z"]
then:
  units:
    ours:
      outcome: rolledBack
      flushFailure: { at: commit, entity: parallax.compatibility.Position, key: { id: 1 }, shortfall: optimisticConflict }
    concurrent:
      outcome: committed
  roundTrips: 5
  tableState:
    position:
      - pos_id: 1
        acct_num: A
        val: "90.00"
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: infinity
        in_z: "2024-01-01T00:00:00.000000Z"
        out_z: "2024-04-01T00:00:00.000000Z"
      - pos_id: 1
        acct_num: A
        val: "100.00"
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: "2024-06-01T00:00:00.000000Z"
        in_z: "2024-04-01T00:00:00.000000Z"
        out_z: infinity
      - pos_id: 1
        acct_num: A
        val: "200.00"
        from_z: "2024-06-01T00:00:00.000000Z"
        thru_z: infinity
        in_z: "2024-04-01T00:00:00.000000Z"
        out_z: "2024-05-01T00:00:00.000000Z"
      - pos_id: 1
        acct_num: A
        val: "250.00"
        from_z: "2024-06-01T00:00:00.000000Z"
        thru_z: infinity
        in_z: "2024-05-01T00:00:00.000000Z"
        out_z: infinity
