# Numeric precision/scale WRITE boundary (m-core): a numeric(18,4) value round-trips
# all four fractional digits exactly.
model: models/writable-scalars.yaml
tags: [m-core, m-sql, scalar, decimal, write-sequence, slice-snapshot-1]
shape: writeSequence
when:
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.WritableScalar
      statements: 1
      note: write a numeric(18,4) value using all four fractional digits
      rows:
        - { id: 3, amount: "9999.9999" }
then:
  statements:
    - sql:
        postgres: insert into px.writable_scalars(id, amount) values (?, ?)
      binds: [3, "9999.9999"]
  tableState:
    px:
      writable_scalars:
        - id: 3
          f32: null
          f64: null
          payload: null
          local_time: null
          external_id: null
          amount: "9999.9999"
          label: null
  databaseCalls: 1
