# Retry exhaustion (m-execution-lifecycle): every failure FINISHES before the
# next attempt starts, and the BOUND — not the classifier — is what stops the
# loop.
#
# A persistent injected deadlock fails the write on every attempt under
# `retries: 1`, so the root holds two attempts and both roll back. Two
# distinctions ride on that.
#
# The first is balance under failure. Every activity the first attempt opened is
# finished before the second one starts: the failed call (activity 7) finishes
# at sequence 11, its batch (6) at 12, its connection goes back at 13-14, its
# attempt (2) finishes at 15, and only then does activity 9 start at 16. A
# stream where a retry began while a failed activity was still open would
# describe a tree that never existed — and it is the SCOPE that guarantees this,
# not any call site's discipline, because a Finished is emitted however the body
# leaves.
#
# The connection is part of that balance. Each attempt acquires its own (3 and
# 10) and RELEASES it before finishing (8 and 15), so the first attempt's
# connection is back before the second asks for one: a retry never runs on a
# connection an abandoned attempt is still holding, whether or not it is handed
# the same physical one. A failed attempt releases exactly like a committed one,
# because what ended the attempt says nothing about the resource it borrowed.
#
# The second is that each failure still reports `retryEligible: true`. Retry
# eligibility is the CLASSIFIER's verdict under the effective policy,
# INDEPENDENT of the remaining budget, and claims nothing about whether another
# attempt occurred. Reading it beside the invocation's own `retries: 1` is what
# explains the missing successor: a caller sees a retriable failure that ran out
# of budget, not a failure reclassified as non-retriable after the fact. The
# sibling m-execution-lifecycle-004 is the same verdict with budget left.
#
# The failed write is still a Database Call: it reached the port and came back,
# so it counts one round trip and finishes `failed` carrying the neutral
# `m-db-error` category. That category is portable and the driver's native code
# is not, so the oracle states `deadlock` and nothing else. A failed call is the
# ONE place a category appears at all: begin, commit, and rollback are not
# Database Calls, so a boundary failure's category reaches no event. Four round
# trips across two attempts is therefore two reads plus two failed writes — a
# total no per-attempt count reconstructs.
#
# The invocation's own failure is `caused` by the last attempt (9), which is
# caused by its batch (13), which is caused by its call (14): three links over
# one exception, each naming its own direct child, walkable from the root down
# to the statement that failed. The Release standing between the batch and the
# attempt's own end takes no part in that chain: a cleanup fact is never a
# cause, and a release that returned the connection leaves the attempt's failure
# exactly as the work made it.
#
# `lane: api-conformance`: a persistent injected transient and an exhausted
# bound need a fault a real database cannot be asked to produce, so no golden
# SQL is authored and each Database Call omits its `statement` index. Satisfied
# by each language's API Conformance Suite.
model: models/account.yaml
tags: [m-execution-lifecycle, m-auto-retry, m-api-conformance, slice-snapshot-1, transient]
lane: api-conformance
shape: boundary
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection concurrency/locking intent (given.fault, shape:boundary)"
given:
  fault: deadlock
when:
  uow:
    concurrency: locking
    retries: 1
  boundary:
    - action: read
      note: observe the row the write addresses
    - action: update
      note: the write deadlocks on every attempt — the bound, not the classifier, ends the loop
then:
  outcome: deadlock
  roundTrips: 4
  executionLifecycle:
    roots:
      - execution: 1
        kind: transaction-invocation
        events:
          - sequence: 1
            activity: 1
            parent: null
            transactionInvocationStarted:
              invocation: outer
              concurrency: locking
              retries: 1
              retryOptimisticConflicts: false
          - sequence: 2
            activity: 2
            parent: 1
            transactionAttemptStarted: {edition: account}
          - sequence: 3
            activity: 3
            parent: 2
            acquisitionStarted: {}
          - sequence: 4
            activity: 3
            parent: 2
            acquisitionFinished: { outcome: acquired }
          - sequence: 5
            activity: 4
            parent: 2
            readStarted: { target: parallax.compatibility.Account, interface: typed }
          - sequence: 6
            activity: 5
            parent: 4
            databaseCallStarted: { target: parallax.compatibility.Account, kind: read }
          - sequence: 7
            activity: 5
            parent: 4
            databaseCallFinished: { outcome: readCompleted, returnedRows: 1 }
          - sequence: 8
            activity: 4
            parent: 2
            readFinished: { outcome: completed }
          - sequence: 9
            activity: 6
            parent: 2
            writeBatchStarted: { trigger: pre-commit }
          - sequence: 10
            activity: 7
            parent: 6
            databaseCallStarted: { target: parallax.compatibility.Account, kind: write }
          - sequence: 11
            activity: 7
            parent: 6
            databaseCallFinished: { outcome: failed, category: deadlock }
          - sequence: 12
            activity: 6
            parent: 2
            writeBatchFinished: { outcome: failed, attribution: caused, cause: 7 }
          - sequence: 13
            activity: 8
            parent: 2
            releaseStarted: {}
          - sequence: 14
            activity: 8
            parent: 2
            releaseFinished: { cleanup: returned }
          - sequence: 15
            activity: 2
            parent: 1
            transactionAttemptFinished:
              outcome: rolledBack
              phase: pre-commit
              retryEligible: true
              attribution: caused
              cause: 6
          - sequence: 16
            activity: 9
            parent: 1
            transactionAttemptStarted: {edition: account}
          - sequence: 17
            activity: 10
            parent: 9
            acquisitionStarted: {}
          - sequence: 18
            activity: 10
            parent: 9
            acquisitionFinished: { outcome: acquired }
          - sequence: 19
            activity: 11
            parent: 9
            readStarted: { target: parallax.compatibility.Account, interface: typed }
          - sequence: 20
            activity: 12
            parent: 11
            databaseCallStarted: { target: parallax.compatibility.Account, kind: read }
          - sequence: 21
            activity: 12
            parent: 11
            databaseCallFinished: { outcome: readCompleted, returnedRows: 1 }
          - sequence: 22
            activity: 11
            parent: 9
            readFinished: { outcome: completed }
          - sequence: 23
            activity: 13
            parent: 9
            writeBatchStarted: { trigger: pre-commit }
          - sequence: 24
            activity: 14
            parent: 13
            databaseCallStarted: { target: parallax.compatibility.Account, kind: write }
          - sequence: 25
            activity: 14
            parent: 13
            databaseCallFinished: { outcome: failed, category: deadlock }
          - sequence: 26
            activity: 13
            parent: 9
            writeBatchFinished: { outcome: failed, attribution: caused, cause: 14 }
          - sequence: 27
            activity: 15
            parent: 9
            releaseStarted: {}
          - sequence: 28
            activity: 15
            parent: 9
            releaseFinished: { cleanup: returned }
          - sequence: 29
            activity: 9
            parent: 1
            transactionAttemptFinished:
              outcome: rolledBack
              phase: pre-commit
              retryEligible: true
              attribution: caused
              cause: 13
          - sequence: 30
            activity: 1
            parent: null
            transactionInvocationFinished: { outcome: failed, attribution: caused, cause: 9 }