# Table-per-hierarchy applicability and effective physical nullability
# (m-storage-layout).
model: models/storage-layout.yaml
tags: [m-storage-layout, m-inheritance, m-sql, table-per-hierarchy, tag, nullability, write-sequence, slice-snapshot-1, slice-managed-1]
shape: writeSequence
when:
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.LayoutCardPayment
      statements: 1
      note: insert a card variant; kind='card' is derived, tendered does not apply
      rows:
        - { id: 1, amount: "100.00", cardNetwork: Visa }
    - mutation: insert
      entity: parallax.compatibility.LayoutCashPayment
      statements: 1
      note: insert a cash variant into the same shared table; card_network does not apply
      rows:
        - { id: 2, amount: "20.00", tendered: "25.00" }
then:
  statements:
    - sql:
        postgres: insert into layout_payment(id, kind, amount, card_network) values (?, ?, ?, ?)
      binds: [1, card, "100.00", Visa]
    - sql:
        postgres: insert into layout_payment(id, kind, amount, tendered) values (?, ?, ?, ?)
      binds: [2, cash, "20.00", "25.00"]
  tableState:
    layout_payment:
      - { id: 1, kind: card, amount: "100.00", card_network: Visa, tendered: null }
      - { id: 2, kind: cash, amount: "20.00", card_network: null, tendered: "25.00" }
  roundTrips: 2
