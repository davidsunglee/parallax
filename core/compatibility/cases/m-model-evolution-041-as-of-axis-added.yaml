# Adding an AS-OF AXIS to an Entity that already stores rows
# (m-model-evolution): coordinated for both reasons, with three impacts.
#
# The Temporality Profile derives the axis and its two framework-owned endpoint
# Attributes, so the evolution names each addition in its own right. The axis
# changes the temporal operation surface and the framework ownership of its
# endpoints, and it moves the derived physical primary key and the bounds
# existing rows must carry. Behind that, the Entity selects through a temporal
# shape it did not have, gates its writes on the milestone start, and writes
# through a different temporal shape.
tags: [m-model-evolution, evolution, temporal, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-temporality-v1.yaml
    later: models/evolution-temporality-v2.yaml
then:
  evolution:
    kind: coordinated
    operations:
      - kind: AttributeAdded
        attribute: parallax.compatibility.Meter.txEnd
      - kind: AttributeAdded
        attribute: parallax.compatibility.Meter.txStart
      - kind: AsOfAxisAdded
        entity: parallax.compatibility.Meter
        dimension: transaction-time
    behavioralImpacts:
      - kind: ConcurrencyControlChanged
        scope:
          entity: parallax.compatibility.Meter
        earlier:
          gate: LockingFallback
        later:
          gate: TransactionTimeGated
          startAttribute: parallax.compatibility.Meter.txStart
        causedBy:
          - kind: AsOfAxisAdded
            entity: parallax.compatibility.Meter
            dimension: transaction-time
      - kind: QueryResultMembershipChanged
        scope:
          entity: parallax.compatibility.Meter
        earlier:
          concreteEntities:
            - parallax.compatibility.Meter
          axes: []
        later:
          concreteEntities:
            - parallax.compatibility.Meter
          axes:
            - dimension: transaction-time
              startAttribute: parallax.compatibility.Meter.txStart
              endAttribute: parallax.compatibility.Meter.txEnd
        causedBy:
          - kind: AsOfAxisAdded
            entity: parallax.compatibility.Meter
            dimension: transaction-time
      - kind: WriteCapabilityChanged
        scope:
          entity: parallax.compatibility.Meter
        earlier:
          writes: Enabled
          shape: NonTemporal
        later:
          writes: Enabled
          shape: TransactionTimeOnly
        causedBy:
          - kind: AsOfAxisAdded
            entity: parallax.compatibility.Meter
            dimension: transaction-time
    overlapVisibleOperations: []
    coordinationRequirements:
      - operation:
          kind: AttributeAdded
          attribute: parallax.compatibility.Meter.txEnd
        reasons:
          - DatabaseMigrationRequired
      - operation:
          kind: AttributeAdded
          attribute: parallax.compatibility.Meter.txStart
        reasons:
          - DatabaseMigrationRequired
      - operation:
          kind: AsOfAxisAdded
          entity: parallax.compatibility.Meter
          dimension: transaction-time
        reasons:
          - AuthoringSurfaceChangeRequired
          - DatabaseMigrationRequired
