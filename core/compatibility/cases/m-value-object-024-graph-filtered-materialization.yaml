# valueObject materialization under a FILTER: the matched owners' nested composite
# still arrives in ONE round trip (m-value-object "Materialization and navigation
# contract"), on Postgres AND MariaDB.
model: models/customer.yaml
tags: [m-value-object, m-sql, nested, json, materialization, graph, to-one, to-many, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Customer
    predicate:
      nestedEq:
        path: parallax.compatibility.Customer.address.city
        value: Oslo
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name, not t0.address is null, t0.address from customer t0 where jsonb_extract_path_text(t0.address, ?) = ?
        mariadb: select t0.id, t0.name, not t0.address is null, t0.address from customer t0 where json_value(t0.address, ?) = ?
      binds:
        postgres: [city, Oslo]
        mariadb: ['$.city', Oslo]
  referenceSql:
    postgres: select id, name from customer where address ->> 'city' = 'Oslo'
    mariadb: select id, name from customer where nullif(json_unquote(json_extract(address, '$.city')), 'null') = 'Oslo'
  graph:
    Customer:
      - id: 1
        name: Ada
        address:
          street: 1 Park Ave
          city: Oslo
          geo:
            country: "NO"
            elevation: 10.5
            point: { lat: 59.9, lon: 10.7 }
          phones:
            - { type: home, number: '555-1234' }
            - { type: work, number: '555-9999' }
      - id: 2
        name: Linus
        address:
          street: 2 Main St
          city: Oslo
          geo:
            country: "NO"
            elevation: 20.0
            point: { lat: 59.9, lon: 10.8 }
          phones:
            - { type: home, number: '555-9999' }
  roundTrips: 1
