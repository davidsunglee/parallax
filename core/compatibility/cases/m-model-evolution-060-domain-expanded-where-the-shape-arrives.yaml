# Expanding a member's domain in the edition its shape arrives at the position
# (m-model-evolution): the mirror of m-model-evolution-059, and Overlap-Visible to
# nobody.
tags: [m-model-evolution, m-schema-delta, evolution, inheritance, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-departing-domain-v2.yaml
    later: models/evolution-departing-domain-v1.yaml
then:
  evolution:
    kind: unilateral
    operations:
      - kind: AttributeAltered
        attribute: parallax.compatibility.Filed.clerk
        deltas: [{ kind: NullabilityChanged, earlier: false, later: true }]
      - kind: EntityAltered
        entity: parallax.compatibility.Record
        deltas:
          - kind: InheritanceChanged
            earlier:
              role: concrete-subtype
              parent: parallax.compatibility.Registry
              tag: { value: record }
            later:
              role: concrete-subtype
              parent: parallax.compatibility.Filed
              tag: { value: record }
    behavioralImpacts:
      - kind: ValueAdmissibilityChanged
        scope: { attribute: parallax.compatibility.Filed.clerk }
        earlier: { type: string, nullable: false, maxLength: 32 }
        later: { type: string, nullable: true, maxLength: 32 }
        causedBy:
          - kind: AttributeAltered
            attribute: parallax.compatibility.Filed.clerk
            deltas: [{ kind: NullabilityChanged, earlier: false, later: true }]
      - kind: QueryResultMembershipChanged
        scope: { entity: parallax.compatibility.Filed }
        earlier: { concreteEntities: [], axes: [] }
        later: { concreteEntities: [parallax.compatibility.Record], axes: [] }
        causedBy:
          - kind: EntityAltered
            entity: parallax.compatibility.Record
            deltas:
              - kind: InheritanceChanged
                earlier:
                  role: concrete-subtype
                  parent: parallax.compatibility.Registry
                  tag: { value: record }
                later:
                  role: concrete-subtype
                  parent: parallax.compatibility.Filed
                  tag: { value: record }
    overlapVisibleOperations: []
    coordinationRequirements: []
  schema:
    postgres:
      delta:
        statements: []
        createdIndices: []
    mariadb:
      delta:
        statements: []
        createdIndices: []
