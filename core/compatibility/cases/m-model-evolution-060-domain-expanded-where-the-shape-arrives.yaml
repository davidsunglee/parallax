# Expanding a member's domain in the edition its shape arrives at the position
# (m-model-evolution): the mirror of m-model-evolution-059, and Overlap-Visible to
# nobody.
#
# `Record` is reparented onto the abstract `Filed`, whose `clerk` becomes nullable
# in the same edition. Every earlier narrowing still resolves and the rows keep
# their Table and tag, and the member the arriving ancestor hands them is nullable,
# so `Record`'s inheritance alteration is unilateral. So is the expansion, and it
# is visible to no earlier reader: an expansion widens what an ALREADY STORED
# shape admits, so it needs a shape both editions denote under the position, and
# no shape is denoted under `Filed` at both endpoints — the earlier edition
# denotes none there at all, because the rows arrive in the same edition that
# widens the member.
tags: [m-model-evolution, evolution, inheritance, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-departing-domain-v2.yaml
    later: models/evolution-departing-domain-v1.yaml
then:
  evolution:
    kind: unilateral
    operations:
      - kind: AttributeAltered
        attribute: parallax.compatibility.Filed.clerk
        deltas: [{ kind: NullabilityChanged, earlier: false, later: true }]
      - kind: EntityAltered
        entity: parallax.compatibility.Record
        deltas:
          - kind: InheritanceChanged
            earlier:
              role: concrete-subtype
              parent: parallax.compatibility.Registry
              tag: { value: record }
            later:
              role: concrete-subtype
              parent: parallax.compatibility.Filed
              tag: { value: record }
    behavioralImpacts:
      - kind: ValueAdmissibilityChanged
        scope: { attribute: parallax.compatibility.Filed.clerk }
        earlier: { type: string, nullable: false, maxLength: 32 }
        later: { type: string, nullable: true, maxLength: 32 }
        causedBy:
          - kind: AttributeAltered
            attribute: parallax.compatibility.Filed.clerk
            deltas: [{ kind: NullabilityChanged, earlier: false, later: true }]
      - kind: QueryResultMembershipChanged
        scope: { entity: parallax.compatibility.Filed }
        earlier: { concreteEntities: [], axes: [] }
        later: { concreteEntities: [parallax.compatibility.Record], axes: [] }
        causedBy:
          - kind: EntityAltered
            entity: parallax.compatibility.Record
            deltas:
              - kind: InheritanceChanged
                earlier:
                  role: concrete-subtype
                  parent: parallax.compatibility.Registry
                  tag: { value: record }
                later:
                  role: concrete-subtype
                  parent: parallax.compatibility.Filed
                  tag: { value: record }
    overlapVisibleOperations: []
    coordinationRequirements: []
