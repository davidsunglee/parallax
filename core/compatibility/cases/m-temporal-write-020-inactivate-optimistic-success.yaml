# Optimistic bitemporal termination of the OPEN current rectangle a find observed, over
# exactly that rectangle's extent, closes EXACTLY the one observed row and chains nothing
# (m-temporal-write + m-opt-lock). It carries the fresh-gate success the conflict form pinned:
# the close addresses R3 by its open Valid-Time end, gates on the Transaction-Time start
# the find observed, and affects one row — now produced by a public `terminate` whose
# head and tail successors are empty, rather than by a close the case authors.
model: models/position.yaml
tags: [m-temporal-write, m-opt-lock, m-unit-work, m-sql, bitemporal, temporal, as-of, scenario, slice-snapshot-1, slice-managed-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "the close settles against the rectangle its own group's find observed, so its address and gate are read off a row no compile lane executes (m-case-format 'Settling against a grouped find')"
when:
  uow:
    concurrency: optimistic
  scenario:
    - uow: observe-then-terminate
      objectQuery:
        target: parallax.compatibility.Position
        predicate:
          eq:
            attr: parallax.compatibility.Position.id
            value: 1
        temporal:
          transaction-time:
            asOf: latest
          valid-time:
            asOf: "2024-06-01T00:00:00.000000Z"
      roundTrips: 1
      note: observe R3 — id 1 pinned at Valid Time 2024-06-01, its own start, the open current rectangle (200.00), valid [2024-06-01, infinity)
      statements:
        - sql:
            postgres: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? and t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?
            mariadb: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? and t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?
          binds: [1, "2024-06-01T00:00:00.000000Z", "2024-06-01T00:00:00.000000Z", infinity]
      expectRows:
        - { pos_id: 1, acct_num: A, val: "200.00", from_z: "2024-06-01T00:00:00.000000Z", thru_z: infinity, in_z: "2024-04-01T00:00:00.000000Z", out_z: infinity }
    - uow: observe-then-terminate
      write:
        - mutation: terminate
          "on": 0
          entity: parallax.compatibility.Position
          rows:
            - { id: 1 }
          validFrom: "2024-06-01T00:00:00.000000Z"
          at: "2024-10-01T00:00:00.000000Z"
      roundTrips: 1
      note: terminate from the observed rectangle's own start through its open end — the close alone, addressed by thru_z infinity and gated on the observed in_z
      statements:
        - sql:
            postgres: update position set out_z = ? where pos_id = ? and thru_z = ? and out_z = ? and in_z = ?
            mariadb: update `position` set out_z = ? where pos_id = ? and thru_z = ? and out_z = ? and in_z = ?
          binds: ["2024-10-01T00:00:00.000000Z", 1, infinity, infinity, "2024-04-01T00:00:00.000000Z"]
then:
  roundTrips: 2
  tableState:
    position:
      - pos_id: 1
        acct_num: A
        val: "90.00"
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: infinity
        in_z: "2024-01-01T00:00:00.000000Z"
        out_z: "2024-04-01T00:00:00.000000Z"
      - pos_id: 1
        acct_num: A
        val: "100.00"
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: "2024-06-01T00:00:00.000000Z"
        in_z: "2024-04-01T00:00:00.000000Z"
        out_z: infinity
      - pos_id: 1
        acct_num: A
        val: "200.00"
        from_z: "2024-06-01T00:00:00.000000Z"
        thru_z: infinity
        in_z: "2024-04-01T00:00:00.000000Z"
        out_z: "2024-10-01T00:00:00.000000Z"
