# Scalar type round trip for the less-common m-core scalar mappings: float32,
# float64, bytes, time, and uuid.
model: models/scalars.yaml
tags: [m-core, m-descriptor, m-sql, scalar, postgres, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.ScalarThing
    predicate:
      all: {}
then:
  statements:
    - sql:
        postgres: select t0.id, t0.f32, t0.f64, encode(t0.payload, ?) payload_hex, t0.local_time, t0.external_id from scalar_thing t0
      binds: [hex]
  rows:
    - id: 1
      f32: 1.5
      f64: 2.25
      payload_hex: "01020304"
      local_time: "12:34:56"
      external_id: "123e4567-e89b-12d3-a456-426614174000"
  roundTrips: 1
