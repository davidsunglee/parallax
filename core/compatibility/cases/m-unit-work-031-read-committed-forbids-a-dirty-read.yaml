# Read Committed forbids a dirty read (m-unit-work / m-db-port): a unit of work
# opened at `when.uow.isolation: read-committed` never observes another unit of
# work's uncommitted write, flushed to the database while that unit of work
# stays open.
model: models/account.yaml
tags: [m-unit-work, isolation, read-committed, dirty-read, scenario, slice-snapshot-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "the versioned write's version bind is the framework-owned advance of the version its own group's observing find returned — a query result (m-concurrency)"
when:
  uow:
    isolation: read-committed
  scenario:
    - uow: writer
      objectQuery:
        target: parallax.compatibility.Account
        predicate:
          eq:
            path: parallax.compatibility.Account.id
            value: 2
      databaseCalls: 1
      note: the writing unit of work observes account 2 (250.00, version 1) before its update
      statements:
        - sql:
            postgres: select t0.id, t0.owner, t0.balance, t0.version from px.account t0 where t0.id = ?
            mariadb: select t0.id, t0.owner, t0.balance, t0.version from px.account t0 where t0.id = ?
          binds: [2]
      expectRows:
        - { id: 2, owner: Linus, balance: "250.00", version: 1 }
    - uow: writer
      write:
        - mutation: amend
          entity: parallax.compatibility.Account
          rows:
            - { id: 2, balance: "999.00" }
      databaseCalls: 0
      note: buffer the gated update advancing the OBSERVED version 1 -> 2; the writer's next find flushes it
    - uow: writer
      objectQuery:
        target: parallax.compatibility.Account
        predicate:
          eq:
            path: parallax.compatibility.Account.id
            value: 2
      databaseCalls: 2
      note: the writer's find flushes its update and reads it back inside its own transaction; the group does not close here, so the flushed write stays uncommitted across the reader's find below
      flush:
        - sql:
            postgres: update px.account set balance = ?, version = ? where id = ? and version = ?
            mariadb: update px.account set balance = ?, version = ? where id = ? and version = ?
          binds: ["999.00", 2, 2, 1]
      statements:
        - sql:
            postgres: select t0.id, t0.owner, t0.balance, t0.version from px.account t0 where t0.id = ?
            mariadb: select t0.id, t0.owner, t0.balance, t0.version from px.account t0 where t0.id = ?
          binds: [2]
      expectRows:
        - { id: 2, owner: Linus, balance: "999.00", version: 2 }
    - uow: reader
      objectQuery:
        target: parallax.compatibility.Account
        predicate:
          eq:
            path: parallax.compatibility.Account.id
            value: 2
      databaseCalls: 1
      note: the reading unit of work MUST observe the COMMITTED 250.00 at version 1, never the peer's flushed but uncommitted 999.00; the group COMMITS after this, its last step
      statements:
        - sql:
            postgres: select t0.id, t0.owner, t0.balance, t0.version from px.account t0 where t0.id = ?
            mariadb: select t0.id, t0.owner, t0.balance, t0.version from px.account t0 where t0.id = ?
          binds: [2]
      expectRows:
        - { id: 2, owner: Linus, balance: "250.00", version: 1 }
    - uow: writer
      objectQuery:
        target: parallax.compatibility.Account
        predicate:
          eq:
            path: parallax.compatibility.Account.id
            value: 2
      databaseCalls: 1
      note: the writer reads its OWN write back again, which keeps its group open across the reader's find; the group COMMITS after this, its last step
      statements:
        - sql:
            postgres: select t0.id, t0.owner, t0.balance, t0.version from px.account t0 where t0.id = ?
            mariadb: select t0.id, t0.owner, t0.balance, t0.version from px.account t0 where t0.id = ?
          binds: [2]
      expectRows:
        - { id: 2, owner: Linus, balance: "999.00", version: 2 }
    - objectQuery:
        target: parallax.compatibility.Account
        predicate:
          eq:
            path: parallax.compatibility.Account.id
            value: 2
      databaseCalls: 1
      note: UNGROUPED, after both groups resolved — the committed 999.00 at version 2
      statements:
        - sql:
            postgres: select t0.id, t0.owner, t0.balance, t0.version from px.account t0 where t0.id = ?
            mariadb: select t0.id, t0.owner, t0.balance, t0.version from px.account t0 where t0.id = ?
          binds: [2]
      expectRows:
        - { id: 2, owner: Linus, balance: "999.00", version: 2 }
then:
  databaseCalls: 6
