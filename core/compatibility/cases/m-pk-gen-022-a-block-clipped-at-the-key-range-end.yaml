# An Int32 key's block of three starting at 2147483646 holds only the two keys
# the key range has left. Both rows take them, and the sequence is exhausted:
# its next reservation is refused rather than wrapping.
model: models/pk-sequence.yaml
tags: [m-pk-gen, m-unit-work, m-dialect, sequence, write-sequence, slice-snapshot-1]
shape: writeSequence
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "the insert binds the keys a native reservation answers, so its emissions depend on a query result"
when:
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.Wristband
      statements: 1
      note: "the block's third key, 2147483648, lies past the Int32 range"
      rows:
        - { gate: east }
        - { gate: west }
then:
  statements:
    - purpose: reservation
      sql:
        postgres: select pg_catalog.nextval(t0.seqrelid) first_key, t0.seqincrement increment, t0.seqmin minimum, t0.seqmax maximum, t0.seqcycle cycles, pg_catalog.format_type(t0.seqtypid, null) data_type from pg_catalog.pg_sequence t0 where t0.seqrelid = pg_catalog.to_regclass(?)
        mariadb: select nextval(px.wristband_seq) first_key, t0.increment, t0.minimum_value minimum, t0.maximum_value maximum, t0.cycle_option cycles from px.wristband_seq t0
      binds:
        postgres: [px.wristband_seq]
        mariadb: []
    - sql:
        postgres: insert into px.wristband(id, gate) select * from unnest(cast(? as int[]), cast(? as text[]))
        mariadb: insert into px.wristband(id, gate) values (?, ?), (?, ?)
      binds:
        postgres:
          - [2147483646, 2147483647]
          - [east, west]
        mariadb: [2147483646, east, 2147483647, west]
  tableState:
    px:
      wristband:
        - { id: 2147483646, gate: east }
        - { id: 2147483647, gate: west }
  databaseCalls: 2
