# A FULL final page proves nothing, so exhaustion costs one more root statement
# that returns no rows (m-snapshot-read) — and that terminal statement is the
# whole cost, because a page with no roots gathers no parent keys and so issues
# no child SQL.
#
# Orders {1, 2, 3, 42} are delivered at `batchSize: 2` with one include level
# (`Order.items`), and 4 divides by 2 exactly. Page 1 returns orders 1 and 2 and
# fetches their items; page 2 seeks past id 2, returns orders 3 and 42, and
# fetches items for BOTH parent ids even though order 3 has none — the level runs
# because the page gathered keys, and order 3's view is materialized empty. Page 2
# is full, so the delivery cannot end there: a third root statement seeks past id
# 42, returns nothing, and ends it at a cost of exactly one statement. Total 2 + 2
# + 1 = 5.
model: models/orders.yaml
tags: [m-snapshot-read, m-object-query, m-deep-fetch, stream, streamed-delivery, to-many, relationship, graph, materialization, slice-snapshot-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "a streamed read's keyset seek - each continuing root statement binds the primary key of the root the previous page delivered last, and the item level binds the order ids that page's own roots gathered"
when:
  objectQuery:
    target: parallax.compatibility.Order
    predicate:
      in:
        attr: parallax.compatibility.Order.id
        values:
          - 1
          - 2
          - 3
          - 42
    includes:
      - segments:
          - rel: parallax.compatibility.Order.items
  stream:
    batchSize: 2
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.id in (?, ?, ?, ?) order by t0.id asc limit ?
        mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.id in (?, ?, ?, ?) order by t0.id asc limit ?
      binds: [1, 2, 3, 42, 2]
    - sql:
        postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id in (?, ?) order by t0.id desc
        mariadb: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id in (?, ?) order by t0.id desc
      binds: [1, 2]
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.id in (?, ?, ?, ?) and t0.id > ? order by t0.id asc limit ?
        mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.id in (?, ?, ?, ?) and t0.id > ? order by t0.id asc limit ?
      binds: [1, 2, 3, 42, 2, 2]
    - sql:
        postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id in (?, ?) order by t0.id desc
        mariadb: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id in (?, ?) order by t0.id desc
      binds: [3, 42]
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.id in (?, ?, ?, ?) and t0.id > ? order by t0.id asc limit ?
        mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.id in (?, ?, ?, ?) and t0.id > ? order by t0.id asc limit ?
      binds: [1, 2, 3, 42, 42, 2]
  referenceSql: select id, name, sku, qty, price, active, ordered_on from orders where id in (1, 2, 3, 42)
  graph:
    Order:
      - id: 1
        name: Ada
        sku: A-100
        qty: 5
        price: "10.50"
        active: true
        orderedOn: 2024-01-05
        items:
          - { id: 12, orderId: 1, sku: B-200, quantity: 1, shippedOn: 2024-02-15 }
          - { id: 11, orderId: 1, sku: A-100, quantity: 2, shippedOn: null }
      - id: 2
        name: Linus
        sku: B-200
        qty: 10
        price: "20.00"
        active: true
        orderedOn: 2024-02-10
        items:
          - { id: 21, orderId: 2, sku: A-300, quantity: 4, shippedOn: 2024-02-20 }
      - id: 3
        name: ada
        sku: A-300
        qty: 15
        price: "30.25"
        active: false
        orderedOn: 2024-03-15
        items: []
      - id: 42
        name: Grace
        sku: A-999
        qty: 30
        price: "99.99"
        active: true
        orderedOn: 2024-06-30
        items:
          - { id: 422, orderId: 42, sku: B-200, quantity: 5, shippedOn: 2024-02-05 }
          - { id: 421, orderId: 42, sku: A-999, quantity: 3, shippedOn: 2024-03-10 }
  roundTrips: 5
