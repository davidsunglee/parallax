# A predicate-selected amendment of a Bitemporal Entity is refused when it is
# prepared, before any window or assignment is judged: each selected object's
# current rectangle must be observed before it is split, and one readless statement
# observes nothing.
model: models/position.yaml
tags: [m-batch-write, m-temporal-write, rejected, predicate-write, temporal, bitemporal, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  write:
    mutation: amend
    target:
      entity: parallax.compatibility.Position
      predicate:
        eq:
          path: parallax.compatibility.Position.acctNum
          value: A-1
    assignments:
      - attr: parallax.compatibility.Position.value
        value: "0.00"
then:
  rejectedRule: set-based-write-target-unsupported
