# One temporal observation-bearing assignment fixes the UNIT of replacement on
# PostgreSQL and MariaDB: the assigned occurrence, not the row and not the document.
# Both assigned occurrences are replaced whole, at either cardinality — the `one`
# drops the stored undeclared `sealNumber` and the `many` drops its stored element's
# undeclared `berth` — while the root-level undeclared `charterCode`, which sits
# outside every assigned occurrence and was never mentioned, rides into the successor
# untouched. The contrast is m-txtime-write-011, where `manifest` is CARRIED rather
# than assigned and keeps the very key this case's assignment destroys.
model: models/document-layout.yaml
tags: [m-txtime-write, m-storage-layout, m-document-codec, m-value-object, m-sql, write-sequence, update, audit-only, temporal, json, document-layout, slice-snapshot-1, slice-managed-1]
shape: writeSequence
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection concurrency/locking intent (given.apply)"
given:
  apply:
    - sql: insert into voyage(id, in_z, out_z, payload) values (?, ?, ?, ?)
      binds:
        - 8
        - "2026-01-01T00:00:00.000000Z"
        - infinity
        - title: Island Run
          crew: 3
          charterCode: NB-204
          manifest:
            cargo: ore
            sealNumber: S-9930
          legs:
            - port: Oslo
              berth: B7
when:
  writeSequence:
    - mutation: update
      entity: parallax.compatibility.Voyage
      statements: 2
      note: assign both occurrence kinds in one observed successor
      rows:
        - id: 8
          title: Island Run
          crew: 3
          manifest:
            cargo: salt
          legs:
            - port: Bergen
      at: "2026-06-01T00:00:00.000000Z"
then:
  statements:
    - sql:
        postgres: update voyage set out_z = ? where id = ? and out_z = ?
        mariadb: update voyage set out_z = ? where id = ? and out_z = ?
      binds: ["2026-06-01T00:00:00.000000Z", 8, infinity]
    - sql:
        postgres: insert into voyage(id, in_z, out_z, payload) values (?, ?, ?, ?)
        mariadb: insert into voyage(id, in_z, out_z, payload) values (?, ?, ?, ?)
      binds:
        - 8
        - "2026-06-01T00:00:00.000000Z"
        - infinity
        - title: Island Run
          crew: 3
          charterCode: NB-204
          manifest:
            cargo: salt
          legs:
            - port: Bergen
  tableState:
    voyage:
      - id: 8
        in_z: "2026-01-01T00:00:00.000000Z"
        out_z: "2026-06-01T00:00:00.000000Z"
        payload:
          title: Island Run
          crew: 3
          charterCode: NB-204
          manifest:
            cargo: ore
            sealNumber: S-9930
          legs:
            - port: Oslo
              berth: B7
      - id: 8
        in_z: "2026-06-01T00:00:00.000000Z"
        out_z: infinity
        payload:
          title: Island Run
          crew: 3
          charterCode: NB-204
          manifest:
            cargo: salt
          legs:
            - port: Bergen
  roundTrips: 3
