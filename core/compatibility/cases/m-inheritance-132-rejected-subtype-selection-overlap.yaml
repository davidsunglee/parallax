# Negative (m-inheritance): one Subtype Selection contains overlapping alternatives.
#
# Pet resolves to {Cat, Dog}, while Dog resolves to {Dog}. Distinct authored
# alternatives must have pairwise-disjoint effective concrete-subtype sets, so this
# selection is refused before SQL as `subtype-selection-overlapping-alternatives`.
# This is scoped to one selection: separate sibling root guards may still overlap.
model: models/animal.yaml
tags: [m-inheritance, m-predicate, m-object-query, rejected, negative, narrow, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  objectQuery:
    target: parallax.compatibility.Animal
    predicate:
      all: {}
    narrowTo:
      - parallax.compatibility.Dog
      - parallax.compatibility.Pet
then:
  rejectedRule: subtype-selection-overlapping-alternatives
