# A readless predicate write to a Document-layout Entity whose exact namespace
# default places it in `px_docs`: its one statement replaces the array at the
# occurrence's path in every matching row of the bound table.
model: models/document-layout.yaml
binding:
  postgres:
    format_version: 1
    backend: postgres
    default: { schema: px }
    namespaces:
      parallax.compatibility: { schema: px_docs }
  mariadb:
    format_version: 1
    backend: mariadb
    default: { database: px }
    namespaces:
      parallax.compatibility: { database: px_docs }
tags: [m-database-binding, m-batch-write, m-storage-layout, m-sql, predicate-write, readless, scenario, update, json, document-layout, binding, slice-snapshot-1]
shape: scenario
when:
  scenario:
    - write:
        mutation: amend
        target:
          entity: parallax.compatibility.Traveler
          predicate:
            lessThan:
              path: parallax.compatibility.Traveler.id
              value: 3
        assignments:
          - attr: parallax.compatibility.Traveler.tags
            value:
              - { label: founder }
      databaseCalls: 1
      expectAffectedRows: 2
      statements:
        - sql:
            postgres: update px_docs.traveler set payload = payload || cast(? as jsonb) where id < ?
            mariadb: update px_docs.traveler set payload = json_set(payload, ?, json_extract(?, '$')) where id < ?
          binds:
            postgres: [{ tags: [{ label: founder }] }, 3]
            mariadb: ['$.tags', [{ label: founder }], 3]
then:
  databaseCalls: 1
  tableState:
    px_docs:
      traveler:
        - id: 1
          payload:
            displayName: Ada
            score: 7
            joinedOn: "2026-01-15"
            note: north wing
            address:
              city: Oslo
              geo:
                country: "NO"
            tags:
              - { label: founder }
        - id: 2
          payload:
            displayName: Bo
            score: 30
            joinedOn: "2025-12-31"
            address:
              city: Bergen
              geo:
                country: "NO"
            tags:
              - { label: founder }
        - id: 3
          payload:
            displayName: Cyd
            score: null
            joinedOn: null
            note: null
            address: null
            tags: []
