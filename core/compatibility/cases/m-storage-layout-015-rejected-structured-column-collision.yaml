# Negative (m-storage-layout): the shared Structured Column collides with a
# direct Attribute Column and reports the existing physical collision code.
model: models/member-column-defaults.yaml
tags: [m-storage-layout, m-model-formation, m-descriptor, rejected, negative, document-layout, physical-column, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  model:
    entity:
      name: Order
      table: orders
      layout:
        document:
          column: id
      attributes:
        - { name: id, type: int64, primaryKey: true }
        - { name: displayName, type: string }
then:
  rejectedRule: storage-layout-column-collision
