# Omitted coordinate vs explicit `latest` (m-identity-map): an OMITTED temporal
# coordinate and an EXPLICIT `asOf(latest)` lower to the SAME coordinate, so both
# resolve to the same managed object.
model: models/balance.yaml
tags: [m-identity-map, m-temporal-read, identity, as-of, temporal, audit-only, scenario, slice-managed-1]
shape: scenario
when:
  uow:
    concurrency: optimistic
  scenario:
    - objectQuery:
        target: parallax.compatibility.Balance
        predicate:
          eq:
            attr: parallax.compatibility.Balance.id
            value: 1
        temporal:
          transaction-time:
            asOf: latest
      equivalentEncodings:
        - target: parallax.compatibility.Balance
          predicate:
            eq:
              attr: parallax.compatibility.Balance.id
              value: 1
      roundTrips: 1
      note: OMITTED authoring coordinate canonicalizes to the explicit Latest find above (out_z = infinity)
      statements:
        - sql:
            postgres: select t0.bal_id, t0.acct_num, t0.val, t0.in_z, t0.out_z from balance t0 where t0.bal_id = ? and t0.out_z = ?
          binds: [1, infinity]
      expectRows:
        - { bal_id: 1, acct_num: A, val: "150.00", in_z: "2024-06-01T00:00:00.000000Z", out_z: infinity }
    - objectQuery:
        target: parallax.compatibility.Balance
        predicate:
          eq:
            attr: parallax.compatibility.Balance.id
            value: 1
        temporal:
          transaction-time:
            asOf: latest
      roundTrips: 1
      sameObjectAs: 0
      identityAttr: bal_id
      note: EXPLICIT asOf(latest) — lowers to the SAME out_z = infinity coordinate, the SAME managed view as step 0
      statements:
        - sql:
            postgres: select t0.bal_id, t0.acct_num, t0.val, t0.in_z, t0.out_z from balance t0 where t0.bal_id = ? and t0.out_z = ?
          binds: [1, infinity]
      expectRows:
        - { bal_id: 1, acct_num: A, val: "150.00", in_z: "2024-06-01T00:00:00.000000Z", out_z: infinity }
then:
  roundTrips: 2
