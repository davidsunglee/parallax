# A caller's stated start that no longer holds fails the flush as a failed
# precondition, which is never retried and dooms the unit of work: every effect rolls
# back, the earlier units' included, and a refusal the caller caught along the way
# changes nothing of that (m-unit-work Caller-addressed writes, Abort; m-opt-lock).
#
#   stale: an observed write of span 1 and a target of span 4 stating T0, which T1
#     superseded; the commit's flush executes span 1's unit, then finds span 4 at
#     another start.
#   caught: a target of span 2, a refused unequal second target, and a target of
#     span 3 stating T0 where its June rectangle is known from T1.
#   control: span 2 written again in a fresh unit of work, which finds the rectangle
#     the rolled-back group left standing.
model: models/buffered-sequence-layout-twin-columns.yaml
tags: [m-opt-lock, m-unit-work, m-bitemp-write, m-storage-layout, m-sql, scenario, target-write, abort, layout-twin, columns, slice-snapshot-1, slice-managed-1]
shape: scenario
grading: state
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "state-graded: each flush writes against coverage its own reads and the attempt's earlier units leave, so no golden statement is stated to compile against (m-case-format 'State-graded scenarios')"
given:
  fixtures: true
when:
  uow:
    concurrency: optimistic
  scenario:
    - uow: stale
      objectQuery:
        target: parallax.compatibility.SequenceSpan
        predicate: { eq: { attr: parallax.compatibility.SequenceSpan.id, value: 1 } }
        temporal: { transaction-time: { asOf: latest }, valid-time: { asOf: "2024-02-01T00:00:00.000000Z" } }
      note: "observe span 1 at February"
      expectRows:
        - id: 1
          amount: 100
          label: a
          memo: { note: n1 }
          from_z: "2024-01-01T00:00:00.000000Z"
          thru_z: infinity
          in_z: "2023-12-01T00:00:00.000000Z"
          out_z: infinity
    - uow: stale
      write:
        - mutation: updateUntil
          "on": 0
          entity: parallax.compatibility.SequenceSpan
          rows:
            - { id: 1, label: x }
          validFrom: "2024-02-01T00:00:00.000000Z"
          until: "2024-04-01T00:00:00.000000Z"
          at: "2024-11-01T00:00:00.000000Z"
        - mutation: updateUntil
          entity: parallax.compatibility.SequenceSpan
          row: { id: 4, amount: 150 }
          ifTxStart: "2023-12-01T00:00:00.000000Z"
          validFrom: "2024-02-01T00:00:00.000000Z"
          until: "2024-04-01T00:00:00.000000Z"
          at: "2024-11-01T00:00:00.000000Z"
    - uow: caught
      write:
        - mutation: updateUntil
          entity: parallax.compatibility.SequenceSpan
          row: { id: 2, amount: 150 }
          ifTxStart: "2023-12-01T00:00:00.000000Z"
          validFrom: "2024-02-01T00:00:00.000000Z"
          until: "2024-04-01T00:00:00.000000Z"
          at: "2024-11-02T00:00:00.000000Z"
        - mutation: updateUntil
          entity: parallax.compatibility.SequenceSpan
          row: { id: 2, amount: 160 }
          ifTxStart: "2023-12-01T00:00:00.000000Z"
          validFrom: "2024-03-01T00:00:00.000000Z"
          until: "2024-05-01T00:00:00.000000Z"
          at: "2024-11-02T00:00:00.000000Z"
          expectError: write-evidence-already-claimed
        - mutation: updateUntil
          entity: parallax.compatibility.SequenceSpan
          row: { id: 3, amount: 210 }
          ifTxStart: "2023-12-01T00:00:00.000000Z"
          validFrom: "2024-06-01T00:00:00.000000Z"
          until: "2024-07-01T00:00:00.000000Z"
          at: "2024-11-02T00:00:00.000000Z"
    - uow: control
      write:
        - mutation: updateUntil
          entity: parallax.compatibility.SequenceSpan
          row: { id: 2, amount: 155 }
          ifTxStart: "2023-12-01T00:00:00.000000Z"
          validFrom: "2024-02-01T00:00:00.000000Z"
          until: "2024-04-01T00:00:00.000000Z"
          at: "2024-11-03T00:00:00.000000Z"
then:
  units:
    stale:
      outcome: rolledBack
      flushFailure:
        at: commit
        entity: parallax.compatibility.SequenceSpan
        key: { id: 4 }
        shortfall: failedPrecondition
    caught:
      outcome: rolledBack
      flushFailure:
        at: commit
        entity: parallax.compatibility.SequenceSpan
        key: { id: 3 }
        shortfall: failedPrecondition
    control: { outcome: committed }
  tableState:
    sequence_span:
      - id: 1
        amount: 100
        label: a
        memo: { note: n1 }
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: infinity
        in_z: "2023-12-01T00:00:00.000000Z"
        out_z: infinity
      - id: 2
        amount: 100
        label: b
        memo: { note: n2 }
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: infinity
        in_z: "2023-12-01T00:00:00.000000Z"
        out_z: "2024-11-03T00:00:00.000000Z"
      - id: 2
        amount: 100
        label: b
        memo: { note: n2 }
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: "2024-02-01T00:00:00.000000Z"
        in_z: "2024-11-03T00:00:00.000000Z"
        out_z: infinity
      - id: 2
        amount: 155
        label: b
        memo: { note: n2 }
        from_z: "2024-02-01T00:00:00.000000Z"
        thru_z: "2024-04-01T00:00:00.000000Z"
        in_z: "2024-11-03T00:00:00.000000Z"
        out_z: infinity
      - id: 2
        amount: 100
        label: b
