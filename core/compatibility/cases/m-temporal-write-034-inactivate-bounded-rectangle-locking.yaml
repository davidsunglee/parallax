# LOCKING-mode bitemporal termination of the BOUNDED current rectangle a find observed:
# the observing find takes the shared row lock, and the close renders its address in full
# and no gate at all (m-temporal-write + m-opt-lock + m-read-lock, ADR 0046). It carries the
# Locking one-row cardinality the conflict form pinned — the finite R2 address with no
# in_z gate, affecting exactly R2 — now licensed by the participating read's lock rather
# than by a coordinate the case authors.
model: models/position.yaml
tags: [m-temporal-write, m-opt-lock, m-read-lock, m-unit-work, m-sql, bitemporal, temporal, as-of, locking, scenario, slice-snapshot-1, slice-managed-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "the close addresses the rectangle its own group's find observed, so its finite address is read off a row no compile lane executes (m-case-format 'Settling against a grouped find')"
when:
  uow:
    concurrency: locking
  scenario:
    - uow: lock-then-terminate
      objectQuery:
        target: parallax.compatibility.Position
        predicate:
          eq:
            attr: parallax.compatibility.Position.id
            value: 1
        temporal:
          transaction-time:
            asOf: latest
          valid-time:
            asOf: "2024-01-01T00:00:00.000000Z"
      roundTrips: 1
      note: observe R2 under the shared row lock this unit's locking mode takes — id 1 pinned at Valid Time 2024-01-01, the bounded current rectangle (100.00), valid [2024-01-01, 2024-06-01)
      statements:
        - sql:
            postgres: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? and t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ? for share of t0
            mariadb: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? and t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ? lock in share mode
          binds: [1, "2024-01-01T00:00:00.000000Z", "2024-01-01T00:00:00.000000Z", infinity]
      expectRows:
        - { pos_id: 1, acct_num: A, val: "100.00", from_z: "2024-01-01T00:00:00.000000Z", thru_z: "2024-06-01T00:00:00.000000Z", in_z: "2024-04-01T00:00:00.000000Z", out_z: infinity }
    - uow: lock-then-terminate
      write:
        - mutation: terminateUntil
          "on": 0
          entity: parallax.compatibility.Position
          rows:
            - { id: 1 }
          validFrom: "2024-01-01T00:00:00.000000Z"
          until: "2024-06-01T00:00:00.000000Z"
          at: "2024-10-01T00:00:00.000000Z"
      roundTrips: 1
      note: terminate over exactly the observed rectangle's extent — the close alone, addressed by R2's finite thru_z, with no gate predicate (locking mode)
      statements:
        - sql:
            postgres: update position set out_z = ? where pos_id = ? and thru_z = ? and out_z = ?
            mariadb: update `position` set out_z = ? where pos_id = ? and thru_z = ? and out_z = ?
          binds: ["2024-10-01T00:00:00.000000Z", 1, "2024-06-01T00:00:00.000000Z", infinity]
then:
  roundTrips: 2
  tableState:
    position:
      - pos_id: 1
        acct_num: A
        val: "90.00"
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: infinity
        in_z: "2024-01-01T00:00:00.000000Z"
        out_z: "2024-04-01T00:00:00.000000Z"
      - pos_id: 1
        acct_num: A
        val: "100.00"
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: "2024-06-01T00:00:00.000000Z"
        in_z: "2024-04-01T00:00:00.000000Z"
        out_z: "2024-10-01T00:00:00.000000Z"
      - pos_id: 1
        acct_num: A
        val: "200.00"
        from_z: "2024-06-01T00:00:00.000000Z"
        thru_z: infinity
        in_z: "2024-04-01T00:00:00.000000Z"
        out_z: infinity
