# One path narrowing at BOTH positions: a root guard, then a segment narrow
# (m-read-planning, m-inheritance).
model: models/animal.yaml
tags: [m-read-planning, m-inheritance, m-predicate, m-object-query, m-sql, table-per-hierarchy, narrow, deep-fetch, type-key, slice-snapshot-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "deep-fetch child levels - the guarded owner hop and the narrowed pets[Dog] hop each bind their IN-list from keys gathered from the previous level's result, so the child emissions depend on a query result"
when:
  objectQuery:
    target: parallax.compatibility.Animal
    predicate:
      "true": {}
    includes:
      - appliesTo:
          - parallax.compatibility.Pet
        segments:
          - rel: parallax.compatibility.Animal.owner
          - rel: parallax.compatibility.Person.pets
            narrowTo:
              - parallax.compatibility.Dog
then:
  statements:
    - sql:
        postgres: select t0.id, t0.kind, t0.name, t0.owner_id, t0.license_id, t0.indoor, t0.bark_volume, t0.tusk_length from px.animal t0
    - sql:
        postgres: select t0.id, t0.name from px.person t0 where t0.id = any(cast(? as bigint[]))
      binds: [[10, 11]]
    - sql:
        postgres: select t0.id, t0.name, t0.owner_id, t0.license_id, t0.bark_volume from px.animal t0 where t0.owner_id = any(cast(? as bigint[])) and t0.kind = ?
      binds: [[10, 11], dog]
  referenceSql: select id, kind, name, owner_id, license_id, indoor, bark_volume, tusk_length from px.animal
  graph:
    Animal:
      - id: 1
        name: Rex
        ownerId: 10
        licenseId: L-100
        barkVolume: 7
        _type: parallax.compatibility.Dog
        owner:
          id: 10
          name: Alice
          "pets[Dog]":
            - { id: 1, name: Rex, ownerId: 10, licenseId: L-100, barkVolume: 7, _type: parallax.compatibility.Dog }
      - id: 2
        name: Fido
        ownerId: 11
        licenseId: L-101
        barkVolume: 3
        _type: parallax.compatibility.Dog
        owner:
          id: 11
          name: Bob
          "pets[Dog]":
            - { id: 2, name: Fido, ownerId: 11, licenseId: L-101, barkVolume: 3, _type: parallax.compatibility.Dog }
      - id: 3
        name: Whiskers
        ownerId: 10
        licenseId: L-200
        indoor: true
        _type: parallax.compatibility.Cat
        owner:
          id: 10
          name: Alice
          "pets[Dog]":
            - { id: 1, name: Rex, ownerId: 10, licenseId: L-100, barkVolume: 7, _type: parallax.compatibility.Dog }
      - id: 4
        name: Tusker
        ownerId: 12
        tuskLength: "12.50"
        _type: parallax.compatibility.WildBoar
  databaseCalls: 3
