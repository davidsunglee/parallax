# One path narrowing at BOTH positions: a root guard, then a segment narrow
# (m-deep-fetch, m-inheritance).
model: models/animal.yaml
tags: [m-deep-fetch, m-inheritance, m-predicate, m-object-query, m-sql, table-per-hierarchy, narrow, deep-fetch, familyVariant, slice-snapshot-1, slice-managed-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "deep-fetch child levels - the guarded owner hop and the narrowed pets[Dog] hop each bind their IN-list from keys gathered from the previous level's result, so the child emissions depend on a query result"
when:
  objectQuery:
    target: parallax.compatibility.Animal
    predicate:
      all: {}
    includes:
      - appliesTo:
          - parallax.compatibility.Pet
        segments:
          - rel: parallax.compatibility.Animal.owner
          - rel: parallax.compatibility.Person.pets
            narrowTo:
              - parallax.compatibility.Dog
then:
  statements:
    - sql:
        postgres: select t0.id, t0.kind, t0.name, t0.owner_id, t0.license_id, t0.indoor, t0.bark_volume, t0.tusk_length from animal t0
    - sql:
        postgres: select t0.id, t0.name from person t0 where t0.id = any(?)
      binds: [[10, 11]]
    - sql:
        postgres: select t0.id, t0.name, t0.owner_id, t0.license_id, t0.bark_volume from animal t0 where t0.owner_id = any(?) and t0.kind = ?
      binds: [[10, 11], dog]
  referenceSql: select id, kind, name, owner_id, license_id, indoor, bark_volume, tusk_length from animal
  graph:
    Animal:
      - id: 1
        name: Rex
        ownerId: 10
        licenseId: L-100
        barkVolume: 7
        indoor: null
        tuskLength: null
        familyVariant: Dog
        owner:
          id: 10
          name: Alice
          "pets[Dog]":
            - { id: 1, name: Rex, ownerId: 10, licenseId: L-100, barkVolume: 7 }
      - id: 2
        name: Fido
        ownerId: 11
        licenseId: L-101
        barkVolume: 3
        indoor: null
        tuskLength: null
        familyVariant: Dog
        owner:
          id: 11
          name: Bob
          "pets[Dog]":
            - { id: 2, name: Fido, ownerId: 11, licenseId: L-101, barkVolume: 3 }
      - id: 3
        name: Whiskers
        ownerId: 10
        licenseId: L-200
        barkVolume: null
        indoor: true
        tuskLength: null
        familyVariant: Cat
        owner:
          id: 10
          name: Alice
          "pets[Dog]":
            - { id: 1, name: Rex, ownerId: 10, licenseId: L-100, barkVolume: 7 }
      - id: 4
        name: Tusker
        ownerId: 12
        licenseId: null
        barkVolume: null
        indoor: null
        tuskLength: "12.50"
        familyVariant: WildBoar
  roundTrips: 3
