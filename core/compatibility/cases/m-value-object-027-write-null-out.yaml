# valueObject NULL-OUT: writing a nullable valueObject absent binds SQL NULL — the
# whole column, not a document of nulls (m-value-object write, m-sql), on Postgres
# AND MariaDB.
model: models/customer.yaml
tags: [m-value-object, m-sql, write-sequence, update, json, "null", slice-snapshot-1]
shape: writeSequence
when:
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.Customer
      statements: 1
      note: seed a Customer with an address document
      rows:
        - id: 300
          name: Bjorn
          address:
            street: 7 Fjord Vei
            city: Alesund
            geo:
              country: "NO"
            phones: []
    - mutation: amend
      entity: parallax.compatibility.Customer
      statements: 1
      note: null out the nullable address valueObject → SQL NULL (the whole column)
      rows:
        - id: 300
          address: null
then:
  statements:
    - sql:
        postgres: insert into px.customer(id, name, address) values (?, ?, ?)
        mariadb: insert into px.customer(id, name, address) values (?, ?, ?)
      binds:
        - 300
        - Bjorn
        - street: 7 Fjord Vei
          city: Alesund
          geo:
            country: "NO"
          phones: []
    - sql:
        postgres: update px.customer set address = ? where id = ?
        mariadb: update px.customer set address = ? where id = ?
      binds: [null, 300]
  tableState:
    px:
      customer:
        - id: 300
          name: Bjorn
          address: null
  databaseCalls: 3
