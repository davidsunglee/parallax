# Exact-window chains of caller-addressed and observed writes compose into one
# operation per window (m-unit-work Observed-State Coalescing, m-bitemp-write
# Caller-addressed writes span their requested extent). Each group writes one span's
# window [validFrom, until) inside the rectangle its own read observed, and flushes it
# at commit, at the group's one Transaction Instant:
#
#   span 1, P -> O -> O over [2024-03-01, 2024-05-01): the target's amount 150 is
#     overwritten by 160, then by 175 with label x; the window still closes the
#     original under the caller's start T0 and opens one piece.
#   span 2, R -> O -> P over the same window: the replacement states 300 / r / rr, the
#     observed write overlays label o, the patch amount 350; the replacement's memo
#     survives because the later writes never name it.
#   span 3, O -> R -> D over [2024-02-01, 2024-04-01) inside its first rectangle: the
#     termination supersedes the assignment and the replacement, so the window is
#     destroyed and no gap is filled; its second rectangle is untouched.
model: models/buffered-sequence-layout-twin-columns.yaml
tags: [m-unit-work, m-bitemp-write, m-opt-lock, m-storage-layout, m-sql, scenario, target-write, composition, layout-twin, columns, slice-snapshot-1, slice-managed-1]
shape: scenario
grading: state
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "state-graded: each flush writes against coverage its own reads and the attempt's earlier units leave, so no golden statement is stated to compile against (m-case-format 'State-graded scenarios')"
given:
  fixtures: true
when:
  uow:
    concurrency: optimistic
  scenario:
    - uow: p-o-o
      objectQuery:
        target: parallax.compatibility.SequenceSpan
        predicate: { eq: { attr: parallax.compatibility.SequenceSpan.id, value: 1 } }
        temporal: { transaction-time: { asOf: latest }, valid-time: { asOf: "2024-03-01T00:00:00.000000Z" } }
      note: "observe span 1 at March, the source of both observed writes"
      expectRows:
        - id: 1
          amount: 100
          label: a
          memo: { note: n1 }
          from_z: "2024-01-01T00:00:00.000000Z"
          thru_z: infinity
          in_z: "2023-12-01T00:00:00.000000Z"
          out_z: infinity
    - uow: p-o-o
      write:
        - mutation: updateUntil
          entity: parallax.compatibility.SequenceSpan
          row: { id: 1, amount: 150 }
          ifTxStart: "2023-12-01T00:00:00.000000Z"
          validFrom: "2024-03-01T00:00:00.000000Z"
          until: "2024-05-01T00:00:00.000000Z"
          at: "2024-11-01T00:00:00.000000Z"
        - mutation: updateUntil
          "on": 0
          entity: parallax.compatibility.SequenceSpan
          rows:
            - { id: 1, amount: 160 }
          validFrom: "2024-03-01T00:00:00.000000Z"
          until: "2024-05-01T00:00:00.000000Z"
          at: "2024-11-01T00:00:00.000000Z"
        - mutation: updateUntil
          "on": 0
          entity: parallax.compatibility.SequenceSpan
          rows:
            - { id: 1, amount: 175, label: x }
          validFrom: "2024-03-01T00:00:00.000000Z"
          until: "2024-05-01T00:00:00.000000Z"
          at: "2024-11-01T00:00:00.000000Z"
      note: "P, then O, then O over one window: one operation, the target's values fully overwritten"
    - uow: r-o-p
      objectQuery:
        target: parallax.compatibility.SequenceSpan
        predicate: { eq: { attr: parallax.compatibility.SequenceSpan.id, value: 2 } }
        temporal: { transaction-time: { asOf: latest }, valid-time: { asOf: "2024-03-01T00:00:00.000000Z" } }
      note: "observe span 2 at March"
      expectRows:
        - id: 2
          amount: 100
          label: b
          memo: { note: n2 }
          from_z: "2024-01-01T00:00:00.000000Z"
          thru_z: infinity
          in_z: "2023-12-01T00:00:00.000000Z"
          out_z: infinity
    - uow: r-o-p
      write:
        - mutation: replaceUntil
          entity: parallax.compatibility.SequenceSpan
          row: { id: 2, amount: 300, label: r, memo: { note: rr } }
          ifTxStart: "2023-12-01T00:00:00.000000Z"
          validFrom: "2024-03-01T00:00:00.000000Z"
          until: "2024-05-01T00:00:00.000000Z"
          at: "2024-11-02T00:00:00.000000Z"
        - mutation: updateUntil
          "on": 2
          entity: parallax.compatibility.SequenceSpan
          rows:
            - { id: 2, label: o }
          validFrom: "2024-03-01T00:00:00.000000Z"
          until: "2024-05-01T00:00:00.000000Z"
          at: "2024-11-02T00:00:00.000000Z"
        - mutation: updateUntil
          entity: parallax.compatibility.SequenceSpan
          row: { id: 2, amount: 350 }
          ifTxStart: "2023-12-01T00:00:00.000000Z"
          validFrom: "2024-03-01T00:00:00.000000Z"
          until: "2024-05-01T00:00:00.000000Z"
          at: "2024-11-02T00:00:00.000000Z"
      note: "R, then O, then P: each later write overlays the replacement it composes with"
    - uow: o-r-d
      objectQuery:
        target: parallax.compatibility.SequenceSpan
        predicate: { eq: { attr: parallax.compatibility.SequenceSpan.id, value: 3 } }
        temporal: { transaction-time: { asOf: latest }, valid-time: { asOf: "2024-02-01T00:00:00.000000Z" } }
      note: "observe span 3 at February, inside its first rectangle"
      expectRows:
        - id: 3
          amount: 100
          label: c
          memo: { note: n3 }
          from_z: "2024-01-01T00:00:00.000000Z"
          thru_z: "2024-06-01T00:00:00.000000Z"
          in_z: "2023-12-01T00:00:00.000000Z"
          out_z: infinity
    - uow: o-r-d
      write:
        - mutation: updateUntil
          "on": 4
          entity: parallax.compatibility.SequenceSpan
          rows:
            - { id: 3, label: z }
          validFrom: "2024-02-01T00:00:00.000000Z"
          until: "2024-04-01T00:00:00.000000Z"
          at: "2024-11-03T00:00:00.000000Z"
        - mutation: replaceUntil
          entity: parallax.compatibility.SequenceSpan
          row: { id: 3, amount: 500, label: q, memo: { note: q } }
          ifTxStart: "2023-12-01T00:00:00.000000Z"
          validFrom: "2024-02-01T00:00:00.000000Z"
          until: "2024-04-01T00:00:00.000000Z"
          at: "2024-11-03T00:00:00.000000Z"
        - mutation: terminateUntil
          "on": 4
          entity: parallax.compatibility.SequenceSpan
          rows:
            - { id: 3 }
          validFrom: "2024-02-01T00:00:00.000000Z"
          until: "2024-04-01T00:00:00.000000Z"
          at: "2024-11-03T00:00:00.000000Z"
      note: "O, then R, then D: the destruction removes the window and fills no gap"
