# Table-per-concrete-subtype narrow to an ABSTRACT SUBTYPE, INSTANCE-FORM sibling:
# the developer-surface per-variant node shape (m-inheritance, m-predicate,
# m-case-format, m-sql).
#
# Same model, same query, and BYTE-IDENTICAL golden SQL as the row-form original
# (`m-inheritance-052`) — Document declares no value objects, so the instance-form
# Document-slot delta is empty (the `union all` branches project the same columns either
# way, m-sql *Read projection*). `then.graph` asserts the per-variant node shape: the two
# Invoice nodes carry NO `paid_amount` key; the Receipt node carries NO `amount_due` key.
# `m-inheritance-052` remains the values-lane witness (the flat superset row); this is the
# object-lane (developer-surface `db.find`) witness.
model: models/document.yaml
tags: [m-inheritance, m-predicate, m-object-query, m-sql, table-per-concrete-subtype, union-all, narrow, familyVariant, graph, instance-form, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Document
    predicate:
      all: {}
    narrowTo:
      - parallax.compatibility.FinancialDocument
then:
  statements:
    - sql:
        postgres: select t0.id, t0.title, t0.folder_id, t0.currency, t0.amount_due, cast(null as decimal(18, 2)) paid_amount, 'Invoice' family_variant from invoice t0 union all select t0.id, t0.title, t0.folder_id, t0.currency, cast(null as decimal(18, 2)) amount_due, t0.paid_amount, 'Receipt' family_variant from receipt t0
        mariadb: select t0.id, t0.title, t0.folder_id, t0.currency, t0.amount_due, cast(null as decimal(18, 2)) paid_amount, 'Invoice' family_variant from invoice t0 union all select t0.id, t0.title, t0.folder_id, t0.currency, cast(null as decimal(18, 2)) amount_due, t0.paid_amount, 'Receipt' family_variant from receipt t0
  graph:
    Document:
      - { id: 1, title: Invoice-A, folderId: 100, currency: USD, amountDue: "120.00", familyVariant: Invoice }
      - { id: 2, title: Invoice-B, folderId: 101, currency: EUR, amountDue: "80.00", familyVariant: Invoice }
      - { id: 1, title: Receipt-A, folderId: 100, currency: USD, paidAmount: "120.00", familyVariant: Receipt }
  roundTrips: 1
