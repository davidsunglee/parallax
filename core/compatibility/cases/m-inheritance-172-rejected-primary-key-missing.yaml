# Negative (m-inheritance family invariants): the root position's ancestry chain
# carries no primary-key Attribute. Its one concrete subtype declares the key, so
# the root is the only position whose chain lacks one.
model: models/payment.yaml
tags: [m-inheritance, m-model-formation, m-descriptor, rejected, negative, slice-snapshot-1]
shape: rejected
when:
  model:
    entities:
      - name: Animal
        table: animal
        inheritance:
          strategy: table-per-hierarchy
          role: root
          tag: { column: kind }
        attributes:
          - { name: name, type: string, maxLength: 64 }
      - name: Dog
        inheritance:
          role: concrete-subtype
          parent: Animal
          tagValue: dog
        attributes:
          - { name: id, type: int64, primaryKey: true }
then:
  rejectedRule: inheritance-primary-key-missing
