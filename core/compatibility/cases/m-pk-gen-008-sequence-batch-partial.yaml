# Two keyless rows take 1 and 2 from one reserved block of three and insert in
# one grouped statement; 3 is abandoned with the root.
model: models/pk-sequence.yaml
tags: [m-pk-gen, m-unit-work, sequence, write-sequence, slice-snapshot-1]
shape: writeSequence
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "the insert binds the keys a native reservation answers, so its emissions depend on a query result"
when:
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.Pass
      statements: 1
      note: "one reservation, two local handouts, one grouped insert"
      rows:
        - { zone: north }
        - { zone: south }
then:
  statements:
    - purpose: reservation
      sql:
        postgres: select pg_catalog.nextval(t0.seqrelid) first_key, t0.seqincrement increment, t0.seqmin minimum, t0.seqmax maximum, t0.seqcycle cycles, pg_catalog.format_type(t0.seqtypid, null) data_type from pg_catalog.pg_sequence t0 where t0.seqrelid = pg_catalog.to_regclass(?)
        mariadb: select nextval(px.pass_seq) first_key, t0.increment, t0.minimum_value minimum, t0.maximum_value maximum, t0.cycle_option cycles from px.pass_seq t0
      binds:
        postgres: [px.pass_seq]
        mariadb: []
    - sql:
        postgres: insert into px.pass(id, zone) select * from unnest(cast(? as bigint[]), cast(? as text[]))
        mariadb: insert into px.pass(id, zone) values (?, ?), (?, ?)
      binds:
        postgres:
          - [1, 2]
          - [north, south]
        mariadb: [1, north, 2, south]
  tableState:
    px:
      pass:
        - { id: 1, zone: north }
        - { id: 2, zone: south }
  databaseCalls: 2
