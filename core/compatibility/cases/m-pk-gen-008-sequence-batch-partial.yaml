# PK generation `sequence` (m-pk-gen) — batchSize block reservation, partial consume.
model: models/pk-sequence.yaml
tags: [m-pk-gen, m-unit-work, sequence, write-sequence, slice-snapshot-1, slice-managed-1]
shape: writeSequence
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "sequence-strategy PK allocation - the following INSERT binds registry-read-derived id values, so emissions depend on a query result"
given:
  fixtures: true
when:
  writeSequence:
    - mutation: update
      entity: parallax.compatibility.PkSequence
      statements: 1
      note: "reserve block of 3 (next_val += 3), base 1"
      rows:
        - { name: pass_seq, nextVal: { increment: 3 } }
    - mutation: insert
      entity: parallax.compatibility.Pass
      statements: 2
      note: "hand out 2 of the reserved block (ids 1,2; id 3 lost)"
      rows:
        - { id: 1, zone: north }
        - { id: 2, zone: south }
then:
  statements:
    - sql:
        postgres: update pk_sequence set next_val = next_val + ? where name = ?
        mariadb: update pk_sequence set next_val = next_val + ? where name = ?
      binds: [3, pass_seq]
    - sql:
        postgres: insert into pass(id, zone) values (?, ?)
        mariadb: insert into pass(id, zone) values (?, ?)
      binds: [1, north]
    - sql:
        postgres: insert into pass(id, zone) values (?, ?)
        mariadb: insert into pass(id, zone) values (?, ?)
      binds: [2, south]
  tableState:
    pass:
      - { id: 1, zone: north }
      - { id: 2, zone: south }
  roundTrips: 3
