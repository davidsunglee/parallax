# A change-free Value Object edit reached through a read-produced containing Entity
# leaves the unassigned optional weight present with its value while deriving a
# distinct value, preserves application-owned auxiliary state with independent
# bindings, invokes no hook, drops a warm cache, and leaves source and occurrence unchanged.
model: models/note.yaml
tags: [m-edit, m-value-object, slice-snapshot-1, slice-managed-1]
shape: edit
lane: api-conformance
when:
  edit:
    source:
      origin: read
      objectQuery:
        target: parallax.compatibility.Note
        predicate:
          eq:
            attr: parallax.compatibility.Note.id
            value: 1
      path: parallax.compatibility.Note.tag
then:
  result:
    members: { label: a, weight: 3 }
  carry:
    auxiliary: { identity: shared, binding: independent, hooks: none }
    derivedCache: { value: A, evaluations: 1 }
  source: { unchanged: true }
