# Optimistic-lock conflict (m-concurrency): a stale-version UPDATE affects ZERO rows.
model: models/account.yaml
tags: [m-concurrency, m-sql, conflict, optimistic-lock-conflict, slice-snapshot-1]
shape: conflict
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection concurrency/locking intent (given.apply, shape:conflict)"
given:
  apply:
    - sql: update px.account set balance = 999.00, version = 2 where id = 2
when:
  uow:
    concurrency: optimistic
    retry: {maxRetries: 0}
  write: { id: 2, balance: "275.00", observedVersion: 1 }
then:
  statements:
    - sql:
        postgres: update px.account set balance = ?, version = ? where id = ? and version = ?
      binds: ["275.00", 2, 2, 1]
  affectedRows: 0
  tableState:
    px:
      account:
        - { id: 1, owner: Ada, balance: "100.00", version: 1 }
        - { id: 2, owner: Linus, balance: "999.00", version: 2 }
        - { id: 3, owner: Grace, balance: "10.00", version: 1 }
