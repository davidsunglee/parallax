# The physical key is the model key then each temporal END, even though every domain
# slot precedes the temporal slots in the complete Column sequence (m-storage-layout x
# m-txtime-write).
model: models/storage-layout.yaml
tags: [m-storage-layout, m-inheritance, m-txtime-write, m-value-object, m-sql, table-per-hierarchy, tag, temporal, audit-only, document, write-sequence, update, slice-snapshot-1, slice-managed-1]
shape: writeSequence
when:
  uow:
    concurrency: locking
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.LayoutMeterReading
      statements: 1
      note: open a current milestone; kind='meter' is derived and in_z/out_z are bookkeeping
      rows:
        - id: 1
          sensor: north
          celsius: "20.00"
          probe:
            model: TH-1
      at: "2024-01-01T00:00:00.000000Z"
    - mutation: update
      entity: parallax.compatibility.LayoutMeterReading
      statements: 2
      note: close the current milestone, then chain a second row under the same model key
      rows:
        - id: 1
          sensor: north
          celsius: "21.50"
          probe:
            model: TH-2
      at: "2024-02-01T00:00:00.000000Z"
then:
  statements:
    - sql:
        postgres: insert into layout_reading(id, kind, sensor, celsius, in_z, out_z, probe) values (?, ?, ?, ?, ?, ?, ?)
      binds:
        - 1
        - meter
        - north
        - "20.00"
        - "2024-01-01T00:00:00.000000Z"
        - infinity
        - model: TH-1
    - sql:
        postgres: update layout_reading set out_z = ? where id = ? and kind = ? and out_z = ?
      binds: ["2024-02-01T00:00:00.000000Z", 1, meter, infinity]
    - sql:
        postgres: insert into layout_reading(id, kind, sensor, celsius, in_z, out_z, probe) values (?, ?, ?, ?, ?, ?, ?)
      binds:
        - 1
        - meter
        - north
        - "21.50"
        - "2024-02-01T00:00:00.000000Z"
        - infinity
        - model: TH-2
  tableState:
    layout_reading:
      - id: 1
        kind: meter
        sensor: north
        celsius: "20.00"
        in_z: "2024-01-01T00:00:00.000000Z"
        out_z: "2024-02-01T00:00:00.000000Z"
        probe:
          model: TH-1
      - id: 1
        kind: meter
        sensor: north
        celsius: "21.50"
        in_z: "2024-02-01T00:00:00.000000Z"
        out_z: infinity
        probe:
          model: TH-2
  roundTrips: 4
