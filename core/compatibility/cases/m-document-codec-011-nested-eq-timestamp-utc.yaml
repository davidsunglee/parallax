# Portable document encoding: a `timestamp` leaf stores ISO-8601 UTC at microsecond
# precision, and a comparison binds that form whatever offset the literal carried
# (m-document-codec, m-dialect text-compared table, m-sql), on Postgres AND MariaDB.
#
# `YYYY-MM-DDThh:mm:ss.ffffffZ` is fixed width and already UTC-normalized, so text
# order is instant order and the extraction compares directly. Two spellings of one
# instant would otherwise be two different texts, which is why the normalization is
# part of the encoding rather than a caller's courtesy.
#
# The literal here is `+02:00`, the same instant Ada stores as `09:30:00.000000Z`. It
# is decoded to the instant and re-spelled through the codec, so the bind is the
# stored characters and Ada matches; a literal bound as authored would match nothing.
# Bo's instant is a different one, and the not-present rows (3/4/5) extract SQL NULL.
model: models/document-codec.yaml
tags: [m-document-codec, m-value-object, m-sql, m-dialect, nested, json, temporal, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Sample
    predicate:
      nestedEq:
        path: parallax.compatibility.Sample.profile.instant
        value: '2026-01-15T11:30:00+02:00'
then:
  statements:
    - sql:
        postgres: select t0.id, t0.label from sample t0 where jsonb_extract_path_text(t0.profile, ?) = ?
        mariadb: select t0.id, t0.label from sample t0 where json_value(t0.profile, ?) = ?
      binds:
        postgres: [instant, '2026-01-15T09:30:00.000000Z']
        mariadb: ['$.instant', '2026-01-15T09:30:00.000000Z']
  referenceSql:
    postgres: select id, label from sample where profile ->> 'instant' = '2026-01-15T09:30:00.000000Z'
    mariadb: select id, label from sample where nullif(json_unquote(json_extract(profile, '$.instant')), 'null') = '2026-01-15T09:30:00.000000Z'
  rows:
    - { id: 1, label: Ada }
  roundTrips: 1
