# Pinned graph consistency (m-snapshot-read): a deep fetch pinned to a PAST instant
# materializes a point-consistent snapshot graph — every temporal node at the
# propagated pin, including now-superseded milestones.
model: models/invoice.yaml
tags: [m-snapshot-read, m-object-query, m-deep-fetch, m-temporal-read, temporal, as-of, past, propagation, graph, audit-only, slice-snapshot-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "deep-fetch child level - the Invoice.lines IN-list binds are the distinct invoice ids gathered from the root query result, so the child emissions depend on a query result"
when:
  objectQuery:
    target: parallax.compatibility.Invoice
    predicate:
      all: {}
    temporal:
      transaction-time:
        asOf: "2024-02-01T00:00:00.000000Z"
    includes:
      - segments:
          - rel: parallax.compatibility.Invoice.lines
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name, t0.in_z, t0.out_z from invoice t0 where t0.in_z <= ? and t0.out_z > ?
      binds: ["2024-02-01T00:00:00.000000Z", "2024-02-01T00:00:00.000000Z"]
    - sql:
        postgres: select t0.id, t0.invoice_id, t0.amount, t0.in_z, t0.out_z from invoice_line t0 where t0.invoice_id = any(?) and t0.in_z <= ? and t0.out_z > ?
      binds: [[100], "2024-02-01T00:00:00.000000Z", "2024-02-01T00:00:00.000000Z"]
  referenceSql: "select id, name, in_z, out_z from invoice where in_z <= '2024-02-01T00:00:00+00:00'::timestamptz and out_z > '2024-02-01T00:00:00+00:00'::timestamptz"
  graph:
    Invoice:
      - id: 100
        name: INV-100
        txStart: "2024-01-01T00:00:00.000000Z"
        txEnd: infinity
        lines:
          - { id: 1000, invoiceId: 100, amount: "50.00", txStart: "2024-01-01T00:00:00.000000Z", txEnd: "2024-04-01T00:00:00.000000Z" }
          - { id: 1001, invoiceId: 100, amount: "25.00", txStart: "2024-01-01T00:00:00.000000Z", txEnd: infinity }
  roundTrips: 2
