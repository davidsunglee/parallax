# Positive (m-predicate reference resolution): a predicate path spells its Entity
# CANONICALLY, so a local name two namespaces of the model declare names exactly
# one Entity and the read lowers to SQL against that Entity's table.
model: models/shared-local-name.yaml
tags: [m-predicate, relationship, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: archive.SharedVariant
    predicate:
      eq:
        path: archive.SharedVariant.archiveLabel
        value: A-1
then:
  statements:
    - sql:
        postgres: select t0.id, t0.archive_label from archive_shared t0 where t0.archive_label = ?
        mariadb: select t0.id, t0.archive_label from archive_shared t0 where t0.archive_label = ?
      binds: [A-1]
  referenceSql: select id, archive_label from archive_shared where archive_label = 'A-1'
  rows:
    - { id: 10, archive_label: A-1 }
  roundTrips: 1
