# Three write-sequence entries, each its own unit of work, each reserve the
# next block of one: the sequence hands 1, 2, 3 out in order.
model: models/pk-sequence.yaml
tags: [m-pk-gen, m-unit-work, sequence, write-sequence, slice-snapshot-1]
shape: writeSequence
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "the insert binds the keys a native reservation answers, so its emissions depend on a query result"
when:
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.Badge
      statements: 1
      note: "the first reservation answers 1"
      rows:
        - { holder: Bo }
    - mutation: insert
      entity: parallax.compatibility.Badge
      statements: 1
      note: "the next answers 2"
      rows:
        - { holder: Cy }
    - mutation: insert
      entity: parallax.compatibility.Badge
      statements: 1
      note: "the next answers 3"
      rows:
        - { holder: Di }
then:
  statements:
    - purpose: reservation
      sql:
        postgres: select pg_catalog.nextval(t0.seqrelid) first_key, t0.seqincrement increment, t0.seqmin minimum, t0.seqmax maximum, t0.seqcycle cycles, pg_catalog.format_type(t0.seqtypid, null) data_type from pg_catalog.pg_sequence t0 where t0.seqrelid = pg_catalog.to_regclass(?)
        mariadb: select nextval(px.badge_seq) first_key, t0.increment, t0.minimum_value minimum, t0.maximum_value maximum, t0.cycle_option cycles from px.badge_seq t0
      binds:
        postgres: [px.badge_seq]
        mariadb: []
    - sql:
        postgres: insert into px.badge(id, holder) values (?, ?)
        mariadb: insert into px.badge(id, holder) values (?, ?)
      binds: [1, Bo]
    - purpose: reservation
      sql:
        postgres: select pg_catalog.nextval(t0.seqrelid) first_key, t0.seqincrement increment, t0.seqmin minimum, t0.seqmax maximum, t0.seqcycle cycles, pg_catalog.format_type(t0.seqtypid, null) data_type from pg_catalog.pg_sequence t0 where t0.seqrelid = pg_catalog.to_regclass(?)
        mariadb: select nextval(px.badge_seq) first_key, t0.increment, t0.minimum_value minimum, t0.maximum_value maximum, t0.cycle_option cycles from px.badge_seq t0
      binds:
        postgres: [px.badge_seq]
        mariadb: []
    - sql:
        postgres: insert into px.badge(id, holder) values (?, ?)
        mariadb: insert into px.badge(id, holder) values (?, ?)
      binds: [2, Cy]
    - purpose: reservation
      sql:
        postgres: select pg_catalog.nextval(t0.seqrelid) first_key, t0.seqincrement increment, t0.seqmin minimum, t0.seqmax maximum, t0.seqcycle cycles, pg_catalog.format_type(t0.seqtypid, null) data_type from pg_catalog.pg_sequence t0 where t0.seqrelid = pg_catalog.to_regclass(?)
        mariadb: select nextval(px.badge_seq) first_key, t0.increment, t0.minimum_value minimum, t0.maximum_value maximum, t0.cycle_option cycles from px.badge_seq t0
      binds:
        postgres: [px.badge_seq]
        mariadb: []
    - sql:
        postgres: insert into px.badge(id, holder) values (?, ?)
        mariadb: insert into px.badge(id, holder) values (?, ?)
      binds: [3, Di]
  tableState:
    px:
      badge:
        - { id: 1, holder: Bo }
        - { id: 2, holder: Cy }
        - { id: 3, holder: Di }
  databaseCalls: 6
