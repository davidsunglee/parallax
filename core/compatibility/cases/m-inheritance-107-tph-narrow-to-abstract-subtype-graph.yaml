# Table-per-hierarchy narrow to an ABSTRACT subtype, INSTANCE-FORM sibling: the
# developer-surface per-variant node shape (m-inheritance, m-predicate,
# m-case-format, m-sql).
model: models/animal.yaml
tags: [m-inheritance, m-predicate, m-object-query, m-sql, table-per-hierarchy, narrow, familyVariant, graph, instance-form, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Animal
    predicate:
      all: {}
    narrowTo:
      - parallax.compatibility.Pet
then:
  statements:
    - sql:
        postgres: select t0.id, t0.kind, t0.name, t0.owner_id, t0.license_id, t0.indoor, t0.bark_volume from animal t0 where t0.kind in (?, ?)
      binds: [cat, dog]
  referenceSql: select id, kind, name, owner_id, license_id, indoor, bark_volume from animal where kind in ('cat', 'dog')
  graph:
    Animal:
      - { id: 1, name: Rex, ownerId: 10, licenseId: L-100, barkVolume: 7, familyVariant: Dog }
      - { id: 2, name: Fido, ownerId: 11, licenseId: L-101, barkVolume: 3, familyVariant: Dog }
      - { id: 3, name: Whiskers, ownerId: 10, licenseId: L-200, indoor: true, familyVariant: Cat }
  roundTrips: 1
