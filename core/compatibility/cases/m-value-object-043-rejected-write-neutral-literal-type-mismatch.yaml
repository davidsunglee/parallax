# Negative (m-wire typed-literal conversion): a write whose document field cannot
# denote its declared type is refused PRE-SQL.
model: models/contact.yaml
tags: [m-value-object, m-wire, rejected, negative, write, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  write:
    id: 5
    name: Echo
    address:
      street: 42
      city: Oslo
      geo:
        country: "NO"
        point: { lat: 59.9, lon: 10.7 }
then:
  rejectedRule: neutral-literal-type-mismatch
