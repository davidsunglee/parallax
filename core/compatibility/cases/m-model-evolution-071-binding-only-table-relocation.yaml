# A binding-only TABLE RELOCATION (m-model-evolution, m-database-binding): the
# two endpoints declare one model, and only the later binding moves its table to
# another qualifier. No logical operation describes that move, yet the surviving
# owner's physical table differs, so the relocation alone coordinates the
# evolution, exactly as publication refuses the same candidate.
tags: [m-model-evolution, m-database-binding, evolution, entity, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-widget-v1.yaml
    later: models/evolution-widget-v1.yaml
    laterBinding:
      postgres:
        format_version: 1
        backend: postgres
        default: { schema: px }
        entities:
          parallax.compatibility.Widget: { schema: px_archive }
      mariadb:
        format_version: 1
        backend: mariadb
        default: { database: px }
        entities:
          parallax.compatibility.Widget: { database: px_archive }
then:
  evolution:
    kind: coordinated
    operations:
      - kind: TableRelocated
        entity: parallax.compatibility.Widget
        earlier: { qualifier: [px], name: evolution_widget }
        later: { qualifier: [px_archive], name: evolution_widget }
    behavioralImpacts: []
    overlapVisibleOperations: []
    coordinationRequirements:
      - operation:
          kind: TableRelocated
          entity: parallax.compatibility.Widget
          earlier: { qualifier: [px], name: evolution_widget }
          later: { qualifier: [px_archive], name: evolution_widget }
        reasons: [DatabaseMigrationRequired]
