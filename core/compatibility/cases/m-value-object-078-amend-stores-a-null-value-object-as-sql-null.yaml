# A read and `tableState` render SQL NULL and a stored JSON null alike, so the
# read's `referenceSql` tests `address is null` to tell them apart.
model: models/customer.yaml
tags: [m-value-object, m-sql, scenario, update, json, "null", slice-snapshot-1, slice-managed-1]
shape: scenario
when:
  scenario:
    - write:
        - mutation: insert
          entity: parallax.compatibility.Customer
          rows:
            - id: 304
              name: Eir
              address: { street: 4 Fjord Vei, city: Alesund, geo: { country: "NO" }, phones: [] }
      databaseCalls: 1
      statements:
        - sql:
            postgres: insert into customer(id, name, address) values (?, ?, ?)
            mariadb: insert into customer(id, name, address) values (?, ?, ?)
          binds:
            - 304
            - Eir
            - { street: 4 Fjord Vei, city: Alesund, geo: { country: "NO" }, phones: [] }
    - write:
        - mutation: amend
          entity: parallax.compatibility.Customer
          rows:
            - { id: 304, address: null }
      databaseCalls: 2
      statements:
        - sql:
            postgres: update customer set address = ? where id = ?
            mariadb: update customer set address = ? where id = ?
          binds: [null, 304]
    - objectQuery:
        target: parallax.compatibility.Customer
        predicate:
          eq:
            path: parallax.compatibility.Customer.id
            value: 304
      databaseCalls: 1
      statements:
        - sql:
            postgres: select t0.id, t0.name, not t0.address is null, t0.address from customer t0 where t0.id = ? for share of t0
            mariadb: select t0.id, t0.name, not t0.address is null, t0.address from customer t0 where t0.id = ? lock in share mode
          binds: { postgres: [304], mariadb: [304] }
      referenceSql: select id, name, address from customer where id = 304 and address is null
      expectRows:
        - { id: 304, name: Eir, address: null }
then:
  databaseCalls: 4
