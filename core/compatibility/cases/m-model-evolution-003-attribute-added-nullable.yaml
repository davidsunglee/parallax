# Adding a NULLABLE member (m-model-evolution): unilateral, and not
# Overlap-Visible.
tags: [m-model-evolution, m-schema-delta, evolution, attribute, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-nullable-member-v1.yaml
    later: models/evolution-nullable-member-v2.yaml
then:
  evolution:
    kind: unilateral
    operations:
      [{ kind: AttributeAdded, attribute: parallax.compatibility.Note.summary }]
    behavioralImpacts: []
    overlapVisibleOperations: []
    coordinationRequirements: []
  schema:
    postgres:
      delta:
        statements:
          - alter table evolution_note add column summary varchar(64)
        createdIndices: []
    mariadb:
      delta:
        statements:
          - alter table evolution_note add column summary varchar(64)
        createdIndices: []
