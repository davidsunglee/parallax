model: models/orders.yaml
tags: [m-read-planning, m-object-query, m-snapshot-read, back-reference, relationship, graph, slice-snapshot-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "deep-fetch child level - the Order.items binds are the distinct order ids gathered from the root query result"
when:
  objectQuery:
    target: parallax.compatibility.Order
    predicate:
      eq:
        path: parallax.compatibility.Order.id
        value: 1
    includes:
      - segments:
          - rel: parallax.compatibility.Order.items
          - rel: parallax.compatibility.OrderItem.order
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from px.orders t0 where t0.id = ?
      binds: [1]
    - sql:
        postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from px.order_item t0 where t0.order_id = any(cast(? as bigint[])) order by t0.id desc
      binds: [[1]]
  referenceSql: select id, name, sku, qty, price, active, ordered_on from px.orders where id = 1
  graph:
    Order:
      - id: 1
        name: Ada
        sku: A-100
        qty: 5
        price: "10.50"
        active: true
        orderedOn: 2024-01-05
        items:
          - id: 12
            orderId: 1
            sku: B-200
            quantity: 1
            shippedOn: 2024-02-15
            order:
              id: 1
              name: Ada
              sku: A-100
              qty: 5
              price: "10.50"
              active: true
              orderedOn: 2024-01-05
          - id: 11
            orderId: 1
            sku: A-100
            quantity: 2
            shippedOn: null
            order:
              id: 1
              name: Ada
              sku: A-100
              qty: 5
              price: "10.50"
              active: true
              orderedOn: 2024-01-05
  databaseCalls: 2
