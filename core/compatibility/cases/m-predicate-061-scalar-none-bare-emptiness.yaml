# A bare `none` tests emptiness: only the basket whose `tags` is empty matches, on
# PostgreSQL and on MariaDB's guarded occupancy lane.
model: models/predicate-collections.yaml
tags: [m-predicate, quantifier, scalar-collection, m-dialect, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Basket
    predicate:
      none: {path: parallax.compatibility.Basket.tags}
then:
  statements:
  - sql: {postgres: 'select t0.id, t0.label, t0.owner_id, not t0.tags is null, t0.tags, not t0.scores is null, t0.scores, not t0.prices is null, t0.prices, not t0.flags is null, t0.flags, not t0.parcels is null, t0.parcels, not t0.meta is null, t0.meta from basket t0 where not exists (select 1 from jsonb_array_elements(case when jsonb_typeof(t0.tags) = ? then t0.tags else cast(? as jsonb) end) t1)', mariadb: 'select t0.id, t0.label, t0.owner_id, not t0.tags is null, t0.tags, not t0.scores is null, t0.scores, not t0.prices is null, t0.prices, not t0.flags is null, t0.flags, not t0.parcels is null, t0.parcels, not t0.meta is null, t0.meta from basket t0 where not coalesce(json_type(json_extract(t0.tags, ?)) = ? and json_length(t0.tags, ?) > ?, ?)'}
    binds:
      postgres: [array, '[]']
      mariadb: [$, ARRAY, $, 0, 0]
  graph:
    Basket:
    - id: 2
      label: two
      ownerId: null
      tags: []
      scores: []
      prices: []
      flags: []
      parcels: []
      meta: null
  roundTrips: 1
