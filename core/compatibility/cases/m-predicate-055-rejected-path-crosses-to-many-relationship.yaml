# Negative (m-predicate explicit quantification): a field path continues past a
# to-many relationship, which only an any / all / none quantifier binds.
model: models/orders.yaml
tags: [m-predicate, m-navigate, rejected, negative, to-many, relationship, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  objectQuery:
    target: parallax.compatibility.Order
    predicate:
      eq:
        path: parallax.compatibility.Order.items.sku
        value: A-100
then:
  rejectedRule: path-crosses-many
