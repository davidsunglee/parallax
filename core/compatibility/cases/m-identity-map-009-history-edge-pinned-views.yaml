# History materializes one edge-pinned view per milestone (m-identity-map): a
# `history` read returns the full milestone set, and each result is a DISTINCT
# coordinate-keyed view interned at its milestone's own EDGE pin (its from-instant,
# the one instant guaranteed to select exactly that milestone).
model: models/position.yaml
tags: [m-identity-map, m-temporal-read, identity, as-of, bitemporal, temporal, history, scenario, slice-managed-1]
shape: scenario
when:
  uow:
    concurrency: optimistic
  scenario:
    - objectQuery:
        target: parallax.compatibility.Position
        predicate:
          eq:
            attr: parallax.compatibility.Position.id
            value: 1
        temporal:
          transaction-time:
            history: {}
          valid-time:
            history: {}
      roundTrips: 1
      note: history returns all three milestones, each carrying its own edge pins (from/thru/in/out)
      statements:
        - sql:
            postgres: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ?
          binds: [1]
      expectRows:
        - { pos_id: 1, acct_num: A, val: "90.00", from_z: "2024-01-01T00:00:00.000000Z", thru_z: infinity, in_z: "2024-01-01T00:00:00.000000Z", out_z: "2024-04-01T00:00:00.000000Z" }
        - { pos_id: 1, acct_num: A, val: "100.00", from_z: "2024-01-01T00:00:00.000000Z", thru_z: "2024-06-01T00:00:00.000000Z", in_z: "2024-04-01T00:00:00.000000Z", out_z: infinity }
        - { pos_id: 1, acct_num: A, val: "200.00", from_z: "2024-06-01T00:00:00.000000Z", thru_z: infinity, in_z: "2024-04-01T00:00:00.000000Z", out_z: infinity }
    - objectQuery:
        target: parallax.compatibility.Position
        predicate:
          eq:
            attr: parallax.compatibility.Position.id
            value: 1
        temporal:
          transaction-time:
            asOf: "2024-01-01T00:00:00.000000Z"
          valid-time:
            asOf: "2024-01-01T00:00:00.000000Z"
      roundTrips: 1
      note: re-read at R1's edge pin (Valid-Time + Transaction-Time from-instant 2024-01-01) -> exactly R1 (90)
      statements:
        - sql:
            postgres: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? and t0.from_z <= ? and t0.thru_z > ? and t0.in_z <= ? and t0.out_z > ?
          binds: [1, "2024-01-01T00:00:00.000000Z", "2024-01-01T00:00:00.000000Z", "2024-01-01T00:00:00.000000Z", "2024-01-01T00:00:00.000000Z"]
      expectRows:
        - { pos_id: 1, acct_num: A, val: "90.00", from_z: "2024-01-01T00:00:00.000000Z", thru_z: infinity, in_z: "2024-01-01T00:00:00.000000Z", out_z: "2024-04-01T00:00:00.000000Z" }
    - objectQuery:
        target: parallax.compatibility.Position
        predicate:
          eq:
            attr: parallax.compatibility.Position.id
            value: 1
        temporal:
          transaction-time:
            asOf: "2024-04-01T00:00:00.000000Z"
          valid-time:
            asOf: "2024-06-01T00:00:00.000000Z"
      roundTrips: 1
      differentObjectFrom: 1
      identityAttr: pos_id
      note: re-read at R3's edge pin (Valid Time 2024-06-01, Transaction Time 2024-04-01) -> exactly R3 (200), a DISTINCT view from R1
      statements:
        - sql:
            postgres: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? and t0.from_z <= ? and t0.thru_z > ? and t0.in_z <= ? and t0.out_z > ?
          binds: [1, "2024-06-01T00:00:00.000000Z", "2024-06-01T00:00:00.000000Z", "2024-04-01T00:00:00.000000Z", "2024-04-01T00:00:00.000000Z"]
      expectRows:
        - { pos_id: 1, acct_num: A, val: "200.00", from_z: "2024-06-01T00:00:00.000000Z", thru_z: infinity, in_z: "2024-04-01T00:00:00.000000Z", out_z: infinity }
then:
  roundTrips: 3
