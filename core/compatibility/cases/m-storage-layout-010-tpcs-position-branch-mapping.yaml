# One Position Layout contributor sequence aligns every table-per-concrete-subtype
# branch (m-storage-layout x m-sql).
model: models/storage-layout.yaml
tags: [m-storage-layout, m-inheritance, m-sql, table-per-concrete-subtype, union-all, root, familyVariant, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.LayoutReport
    predicate:
      all: {}
then:
  statements:
    - sql:
        postgres: select t0.id, t0.title, t0.detail parallax_attr_0, cast(null as varchar(32)) parallax_attr_1, 'LayoutAudit' family_variant from layout_audit t0 union all select t0.id, t0.title, cast(null as varchar(32)) parallax_attr_0, t0.detail parallax_attr_1, 'LayoutSurvey' family_variant from layout_survey t0
  rows:
    - { id: 1, title: Quarterly audit, detail: Ingrid, familyVariant: LayoutAudit }
    - { id: 1, title: Annual survey, detail: Bjorn, familyVariant: LayoutSurvey }
  roundTrips: 1
