model: models/account.yaml
tags: [m-execution-lifecycle, m-concurrency, m-unit-work, m-sql, write-sequence, target-write, slice-snapshot-1]
shape: writeSequence
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "the Locking target write acquires the row the fixtures stored before it writes, so its emissions depend on a query result"
given:
  fixtures: true
when:
  uow:
    concurrency: locking
  writeSequence:
    - mutation: amend
      entity: parallax.compatibility.Account
      statements: 1
      note: the acquisition runs when the write is buffered, in a Read of its own that publishes nothing, and the update waits for the pre-commit Flush
      row: { id: 1, balance: "90.00" }
      ifVersion: 1
then:
  statements:
    - sql:
        postgres: update px.account set balance = ?, version = ? where id = ?
      binds: ["90.00", 2, 1]
  tableState:
    px:
      account:
        - { id: 1, owner: Ada, balance: "90.00", version: 2 }
        - { id: 2, owner: Linus, balance: "250.00", version: 1 }
        - { id: 3, owner: Grace, balance: "10.00", version: 1 }
  databaseCalls: 2
  executionLifecycle:
    roots:
      - execution: 1
        kind: transaction-invocation
        events:
          - sequence: 1
            activity: 1
            parent: null
            transactionInvocationStarted: { invocation: outer, accessMode: read-write, concurrency: locking, retry: {maxRetries: 10, backoff: {baseDelay: 0.008, maxDelay: 1.0}}, isolation: read-committed }
          - sequence: 2
            activity: 2
            parent: 1
            transactionAttemptStarted: { edition: account }
          - sequence: 3
            activity: 3
            parent: 2
            acquisitionStarted: { policy: writer-only }
          - sequence: 4
            activity: 3
            parent: 2
            acquisitionFinished: { outcome: acquired, route: writer }
          - sequence: 5
            activity: 4
            parent: 2
            readStarted: { target: parallax.compatibility.Account, purpose: row-acquisition }
          - sequence: 6
            activity: 5
            parent: 4
            databaseCallStarted: { target: parallax.compatibility.Account, kind: read }
          - sequence: 7
            activity: 5
            parent: 4
            databaseCallFinished: { outcome: readCompleted, returnedRows: 1 }
          - sequence: 8
            activity: 4
            parent: 2
            readFinished: { outcome: completed }
          - sequence: 9
            activity: 6
            parent: 2
            flushStarted: { trigger: pre-commit }
          - sequence: 10
            activity: 7
            parent: 6
            databaseCallStarted: { target: parallax.compatibility.Account, kind: write, statement: 0 }
          - sequence: 11
            activity: 7
            parent: 6
            databaseCallFinished: { outcome: writeCompleted, affectedRows: 1 }
          - sequence: 12
            activity: 6
            parent: 2
            flushFinished: { outcome: completed }
          - sequence: 13
            activity: 8
            parent: 2
            releaseStarted: {}
          - sequence: 14
            activity: 8
            parent: 2
            releaseFinished: { cleanup: returned }
          - sequence: 15
            activity: 2
            parent: 1
            transactionAttemptFinished: { outcome: committed }
          - sequence: 16
            activity: 1
            parent: null
            transactionInvocationFinished: { outcome: committed }
