    - sql:
        postgres: insert into position(pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
      binds: [2, B, "10.00", "2024-03-01T00:00:00.000000Z", "2024-09-01T00:00:00.000000Z", "2024-01-01T00:00:00.000000Z", infinity]
    - sql:
        postgres: insert into position(pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
      binds: [2, B, "20.00", "2024-06-01T00:00:00.000000Z", "2024-12-01T00:00:00.000000Z", "2024-02-01T00:00:00.000000Z", infinity]
