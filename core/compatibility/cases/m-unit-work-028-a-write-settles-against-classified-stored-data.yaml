      - id: 7
        name: Nils
        address:
          street: 7 Fjord Vei
          city: null
          geo:
            country: null
            zip: "0152"
            elevation: null
            point:
              lat: null
              lon: null
          phones:
            - { type: work, number: '555-0000' }
      - id: 8
