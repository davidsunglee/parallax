# valueObject multi-row batched INSERT: two Customers collapse into ONE multi-row
# INSERT, each `address` document binding atomically in its layout position
# (m-value-object write + m-batch-write set-based flush).
model: models/customer.yaml
tags: [m-value-object, m-batch-write, m-sql, write-sequence, insert, json, slice-snapshot-1, slice-managed-1]
shape: writeSequence
when:
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.Customer
      statements: 1
      note: two Customers collapse into one multi-row INSERT, each address document atomic
      rows:
        - id: 200
          name: Ann
          address:
            street: 1 Aurora Ave
            city: Oslo
            geo:
              country: "NO"
            phones:
              - { type: home, number: '555-0201' }
        - id: 201
          name: Bo
          address:
            street: 2 Birch Rd
            city: Bergen
            geo:
              country: "NO"
            phones:
              - { type: work, number: '555-0202' }
then:
  statements:
    - sql:
        postgres: insert into customer(id, name, address) values (?, ?, ?), (?, ?, ?)
        mariadb: insert into customer(id, name, address) values (?, ?, ?), (?, ?, ?)
      binds:
        - 200
        - Ann
        - street: 1 Aurora Ave
          city: Oslo
          geo:
            country: "NO"
          phones:
            - { type: home, number: '555-0201' }
        - 201
        - Bo
        - street: 2 Birch Rd
          city: Bergen
          geo:
            country: "NO"
          phones:
            - { type: work, number: '555-0202' }
  tableState:
    customer:
      - id: 200
        name: Ann
        address:
          street: 1 Aurora Ave
          city: Oslo
          geo:
            country: "NO"
          phones:
            - { type: home, number: '555-0201' }
      - id: 201
        name: Bo
        address:
          street: 2 Birch Rd
          city: Bergen
          geo:
            country: "NO"
          phones:
            - { type: work, number: '555-0202' }
  roundTrips: 1
