# Removing a concrete subtype (m-model-evolution): coordinated, and its Behavioral
# Impact is retained.
tags: [m-model-evolution, evolution, inheritance, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-hierarchy-v2.yaml
    later: models/evolution-hierarchy-v1.yaml
then:
  evolution:
    kind: coordinated
    operations:
      [{ kind: ConcreteSubtypeRemoved, entity: parallax.compatibility.Future }]
    behavioralImpacts:
      - kind: QueryResultMembershipChanged
        scope: { entity: parallax.compatibility.Deal }
        earlier:
          concreteEntities: [parallax.compatibility.Future, parallax.compatibility.Swap]
          axes: []
        later: { concreteEntities: [parallax.compatibility.Swap], axes: [] }
        causedBy: [{ kind: ConcreteSubtypeRemoved, entity: parallax.compatibility.Future }]
    overlapVisibleOperations: []
    coordinationRequirements:
      - operation: { kind: ConcreteSubtypeRemoved, entity: parallax.compatibility.Future }
        reasons: [AuthoringSurfaceChangeRequired]
