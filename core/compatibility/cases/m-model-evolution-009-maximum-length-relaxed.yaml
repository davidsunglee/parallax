# Relaxing a String maximum length (m-model-evolution): unilateral and
# Overlap-Visible, both when the bound grows and when it disappears.
#
# `Digest.title` moves to a larger bound and `Digest.body` loses its bound
# entirely; the two are one boundary, because a removed bound admits everything a
# larger one does. Each is Overlap-Visible for the same reason nullability
# widening is: the later edition can store a value the earlier edition cannot
# admit. String maximum length is a field of its own, so neither operation carries
# a `TypeChanged`.
tags: [m-model-evolution, m-schema-delta, evolution, attribute, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-string-bound-v1.yaml
    later: models/evolution-string-bound-v2.yaml
then:
  evolution:
    kind: unilateral
    operations:
      - kind: AttributeAltered
        attribute: parallax.compatibility.Digest.body
        deltas: [{ kind: MaximumLengthChanged, earlier: 64, later: null }]
      - kind: AttributeAltered
        attribute: parallax.compatibility.Digest.title
        deltas: [{ kind: MaximumLengthChanged, earlier: 32, later: 128 }]
    behavioralImpacts:
      - kind: ValueAdmissibilityChanged
        scope: { attribute: parallax.compatibility.Digest.body }
        earlier: { type: string, nullable: false, maxLength: 64 }
        later: { type: string, nullable: false, maxLength: null }
        causedBy:
          - kind: AttributeAltered
            attribute: parallax.compatibility.Digest.body
            deltas: [{ kind: MaximumLengthChanged, earlier: 64, later: null }]
      - kind: ValueAdmissibilityChanged
        scope: { attribute: parallax.compatibility.Digest.title }
        earlier: { type: string, nullable: false, maxLength: 32 }
        later: { type: string, nullable: false, maxLength: 128 }
        causedBy:
          - kind: AttributeAltered
            attribute: parallax.compatibility.Digest.title
            deltas: [{ kind: MaximumLengthChanged, earlier: 32, later: 128 }]
    overlapVisibleOperations:
      - kind: AttributeAltered
        attribute: parallax.compatibility.Digest.body
        deltas: [{ kind: MaximumLengthChanged, earlier: 64, later: null }]
      - kind: AttributeAltered
        attribute: parallax.compatibility.Digest.title
        deltas: [{ kind: MaximumLengthChanged, earlier: 32, later: 128 }]
    coordinationRequirements: []
  schema:
    postgres:
      delta:
        statements:
          - alter table evolution_digest alter column body type text
          - alter table evolution_digest alter column title type varchar(128)
        createdIndices: []
    mariadb:
      delta:
        statements:
          - alter table evolution_digest modify body text not null
          - alter table evolution_digest modify title varchar(128) not null
        createdIndices: []
