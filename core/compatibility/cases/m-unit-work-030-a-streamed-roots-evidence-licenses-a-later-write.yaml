# A root a STREAM delivered is evidence exactly as a root a find returned is, and
# the write it licenses is the same write (m-unit-work "The ledger admits multiple
# observed states for one Entity and primary key"; m-case-format *Streamed read
# steps* / *Settling against a grouped find*).
model: models/account.yaml
tags: [m-unit-work, m-opt-lock, m-snapshot-read, m-sql, observed-state, stream, streamed-delivery, scenario, slice-snapshot-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "a streamed delivery's keyset seek binds the previous page's last root, and each write's gate binds the observed version the delivery it names returned"
when:
  scenario:
    - uow: two-deliveries
      objectQuery:
        target: parallax.compatibility.Account
        predicate:
          all: {}
      stream:
        batchSize: 2
      roundTrips: 2
      note: the first delivery — two pages, the second short of the size it asked for
      statements:
        - sql:
            postgres: select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 order by t0.id asc limit ?
            mariadb: select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 order by t0.id asc limit ?
          binds: [3]
        - sql:
            postgres: select u.id, u.owner, u.balance, u.version, u.parallax_seek_0 from ((select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 where t0.id >= ? and (t0.id > ? or t0.id is null) order by t0.id asc limit ?) union all (select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 where t0.id is null order by t0.id asc limit ?)) u order by u.parallax_seek_0 asc limit ?
            mariadb: select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 where t0.id >= ? and t0.id > ? order by t0.id asc limit ?
          binds: { postgres: [2, 2, 3, 3, 3], mariadb: [2, 2, 3] }
      referenceSql: select id, owner, balance, version from account
      expectRows:
        - { id: 1, owner: Ada, balance: "100.00", version: 1 }
        - { id: 2, owner: Linus, balance: "250.00", version: 1 }
        - { id: 3, owner: Grace, balance: "10.00", version: 1 }
    - uow: two-deliveries
      "on": 0
      write:
        - mutation: update
          entity: parallax.compatibility.Account
          rows:
            - { id: 1, balance: "125.00" }
      roundTrips: 1
      note: settle against the FIRST delivery — the gate binds the version it published for a root it delivered on a page since released
      statements:
        - sql:
            postgres: update account set balance = ?, version = ? where id = ? and version = ?
            mariadb: update account set balance = ?, version = ? where id = ? and version = ?
          binds: ["125.00", 2, 1, 1]
    - uow: two-deliveries
      objectQuery:
        target: parallax.compatibility.Account
        predicate:
          all: {}
      stream:
        batchSize: 2
      roundTrips: 2
      note: the second delivery — its first page force-flushes the pending intent and then observes account 1 at generation two
      statements:
        - sql:
            postgres: select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 order by t0.id asc limit ?
            mariadb: select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 order by t0.id asc limit ?
          binds: [3]
        - sql:
            postgres: select u.id, u.owner, u.balance, u.version, u.parallax_seek_0 from ((select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 where t0.id >= ? and (t0.id > ? or t0.id is null) order by t0.id asc limit ?) union all (select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 where t0.id is null order by t0.id asc limit ?)) u order by u.parallax_seek_0 asc limit ?
            mariadb: select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 where t0.id >= ? and t0.id > ? order by t0.id asc limit ?
          binds: { postgres: [2, 2, 3, 3, 3], mariadb: [2, 2, 3] }
      referenceSql: select id, owner, balance, version from account
      expectRows:
        - { id: 1, owner: Ada, balance: "125.00", version: 2 }
        - { id: 2, owner: Linus, balance: "250.00", version: 1 }
        - { id: 3, owner: Grace, balance: "10.00", version: 1 }
    - uow: two-deliveries
      "on": 2
      write:
        - mutation: update
          entity: parallax.compatibility.Account
          rows:
            - { id: 1, balance: "175.00" }
      roundTrips: 1
      note: settle against the SECOND delivery — the gate binds version 2; naming step 0 would gate on a version the row has left
      statements:
        - sql:
            postgres: update account set balance = ?, version = ? where id = ? and version = ?
            mariadb: update account set balance = ?, version = ? where id = ? and version = ?
          binds: ["175.00", 3, 1, 2]
then:
  roundTrips: 6
