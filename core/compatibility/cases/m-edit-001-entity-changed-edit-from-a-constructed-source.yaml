# A changed Entity edit preserves application-owned auxiliary state by shallow identity with independent bindings, invokes no setter hook while carrying it, drops a warm declared cache even though the authored body assignment is unrelated to that cache, and leaves the constructed source unchanged.
model: models/note.yaml
tags: [m-edit, m-value-object, slice-snapshot-1, slice-managed-1]
shape: edit
lane: api-conformance
when:
  edit:
    source:
      origin: constructed
      value:
        id: 1
        title: alpha
        body: first
        tag: { label: a, weight: 3 }
        marks: []
    set: { body: null }
then:
  result:
    members:
      id: 1
      title: alpha
      body: null
      tag: { label: a, weight: 3 }
      marks: []
  carry:
    auxiliary: { identity: shared, binding: independent, hooks: none }
    derivedCache: { value: ALPHA, evaluations: 1 }
  source: { unchanged: true }
