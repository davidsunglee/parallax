# A physical operation one Dialect cannot render (m-schema-delta): the cell is the
# refusal, and the Evolution stays unilateral.
tags: [m-model-evolution, m-schema-delta, evolution, index, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-unbounded-index-v1.yaml
    later: models/evolution-unbounded-index-v2.yaml
then:
  evolution:
    kind: unilateral
    operations:
      - { kind: IndexAdded, index: parallax.compatibility.Transcript.transcript_body }
    behavioralImpacts: []
    overlapVisibleOperations: []
    coordinationRequirements: []
  schema:
    postgres:
      delta:
        statements:
          - create index pxi_evolution_transcript_paral_36be0cd7240a86e5f5612e9151d54d2b on evolution_transcript (body)
        createdIndices:
          - physicalIndexName: pxi_evolution_transcript_paral_36be0cd7240a86e5f5612e9151d54d2b
            physicalTable: evolution_transcript
            logicalIndexIdentity: parallax.compatibility.Transcript.transcript_body
            unique: false
    mariadb:
      unsupported:
        operations:
          - kind: CreateIndex
            physicalLocation:
              table: evolution_transcript
              index: pxi_evolution_transcript_parall_36be0cd7240a86e5f5612e9151d54d2b
            causedBy:
              - { kind: IndexAdded, index: parallax.compatibility.Transcript.transcript_body }
