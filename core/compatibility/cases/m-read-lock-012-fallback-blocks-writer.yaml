# Behavioral counterpart to m-opt-lock-023 (m-read-lock / m-opt-lock / m-unit-work): the
# lock the mandatory Locking FALLBACK derives excludes a concurrent writer.
model: models/wallet.yaml
tags: [m-read-lock, m-opt-lock, m-unit-work, m-dialect, m-db-error, concurrency, lockWaitTimeout, slice-snapshot-1, slice-managed-1]
shape: error
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection concurrency/locking intent (when.concurrency)"
given:
  fixtures: true
when:
  concurrency:
    rounds:
      - A:
          statements:
            - sql:
                postgres: select t0.id, t0.owner, t0.balance from wallet t0 where t0.id = ? for share of t0
                mariadb: select t0.id, t0.owner, t0.balance from wallet t0 where t0.id = ? lock in share mode
              binds: [1]
      - B:
          statements:
            - sql:
                postgres: update wallet set balance = ? where id = ?
                mariadb: update wallet set balance = ? where id = ?
              binds: ["999.00", 1]
then:
  errorClass: lockWaitTimeout
  nativeCode:
    postgres: "55P03"
    mariadb: 1205
