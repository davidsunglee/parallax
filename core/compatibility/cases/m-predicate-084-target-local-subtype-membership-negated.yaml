# Negating a bare path-targeted narrowing includes the absent pet and the cat.
model: models/predicate-traversal.yaml
tags: [m-predicate, narrow, relationship, to-one, m-inheritance, table-per-hierarchy, negation, m-dialect, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Collar
    predicate:
      not:
        operand:
          narrow:
            path: parallax.compatibility.Collar.pet
            to: [parallax.compatibility.Dog]
            operand:
              'true': {}
then:
  statements:
  - sql: {postgres: 'select t0.id, t0.pet_id from traversal_collar t0 where not coalesce((select t1.kind = ? from traversal_pet t1 where t1.id = t0.pet_id), false)', mariadb: 'select t0.id, t0.pet_id from traversal_collar t0 where not coalesce((select t1.kind = ? from traversal_pet t1 where t1.id = t0.pet_id), false)'}
    binds: [dog]
  referenceSql: select id, pet_id from traversal_collar where pet_id is null or pet_id not in (select id from traversal_pet where kind = 'dog')
  rows:
  - {id: 12, pet_id: 3}
  - {id: 13, pet_id: null}
  roundTrips: 1
