# valueObject to-many: a range inside a scoped `where` is SAME-element — one element
# must satisfy the equality AND the whole range (m-predicate elementPredicate +
# nested range, m-sql, m-dialect array-traversal form). Postgres golden only — a
# `where` carrying a non-`eq` leaf is outside MariaDB's containment scope (m-dialect,
# "Scope of the containment golden").
#
# nestedExists(Customer.address.phones, where: type = 'home' AND number between
# '555-9000' and '555-9999') matches only Linus (id 2), whose single element
# {home, 555-9999} carries both. Ada is the discriminating row: her `home` element's
# number is 555-1234 (below the range) while her in-range 555-9999 sits on a `work`
# element, so the unscoped AND of the two flat any-element predicates would match her
# and this scoped form does not — the same contrast m-value-object-018 draws against
# -019, now with a range on one side. Nils's element is `work`, so he is out.
#
# Priya (10) is the trap: her non-array OBJECT `phones` is exactly the candidate
# {type: home, number: '555-9999'}, so an unguarded traversal would match it and
# Postgres `jsonb_array_elements` would ERROR on it; the array-type guard collapses
# it to not-present, together with the empty array (3), the null column (4), the
# missing keys (5, 6) and the other non-array states (8, 9).
#
# Both element predicates lower against the SAME unnested alias t1, which is the
# structural signal of same-element matching. The oracle guards with an outer
# `jsonb_typeof` rather than the golden's inline `case` and spells the range as two
# comparisons on that one element.
model: models/customer.yaml
tags: [m-value-object, m-predicate, m-sql, m-dialect, nested, json, to-many, exists, scoped, same-element, between, array-traversal, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Customer
    predicate:
      nestedExists:
        path: parallax.compatibility.Customer.address.phones
        where:
          and:
            operands:
              - nestedEq:
                  path: type
                  value: home
              - nestedBetween:
                  path: number
                  lower: 555-9000
                  upper: 555-9999
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name from customer t0 where exists (select 1 from jsonb_array_elements(case when jsonb_typeof(jsonb_extract_path(t0.address, ?)) = ? then jsonb_extract_path(t0.address, ?) else cast(? as jsonb) end) t1 where jsonb_extract_path_text(t1.value, ?) = ? and jsonb_extract_path_text(t1.value, ?) between ? and ?)
      binds: [phones, 'array', phones, '[]', type, home, number, '555-9000', '555-9999']
  referenceSql:
    postgres: select id, name from customer where jsonb_typeof(address -> 'phones') = 'array' and exists (select 1 from jsonb_array_elements(address -> 'phones') e where e.value ->> 'type' = 'home' and e.value ->> 'number' >= '555-9000' and e.value ->> 'number' <= '555-9999')
  rows:
    - { id: 2, name: Linus }
  roundTrips: 1
