# A predicate-selected amendment assigns a Value Object occurrence whole, and
# decodes each leaf it states at that leaf's own position: a number where the
# leaf declares `string` is refused with the classified Wire literal rule, before
# anything executes (m-batch-write, m-unit-work, m-value-object).
model: models/shipment.yaml
tags: [m-batch-write, m-unit-work, m-value-object, m-wire, rejected, predicate-write, readless, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  write:
    mutation: amend
    target:
      entity: parallax.compatibility.Shipment
      predicate:
        eq:
          path: parallax.compatibility.Shipment.id
          value: 1
    assignments:
      - attr: parallax.compatibility.Shipment.destination
        value: { street: 1, city: Oslo }
then:
  rejectedRule: neutral-literal-type-mismatch
