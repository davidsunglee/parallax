# Zero-row versioned UPDATE in LOCKING mode: the ungated update finds no row and
# affects 0 rows — the non-retriable stale write (m-opt-lock, ADR 0047).
#
# The update arm of the rule m-opt-lock-016 pins for the delete, and the
# locking-mode counterpart of m-opt-lock-005's gated update conflict. The
# concurrency mode alone decides whether an observation-requiring write renders a
# gate — uniformly across update, delete, and close — so this locking-mode keyed
# UPDATE emits `update account set balance = ?, version = ? where id = ?`: it
# still ADVANCES the version (the advance is unconditional, m-opt-lock-002), but
# renders no `and version = ?` clause. The observation is still mandatory: it is
# the read that took the m-read-lock shared lock, which is what makes the ungated
# update correct in the first place.
#
# `given.apply` REMOVES account 2 out of band (a concurrent transaction that
# committed first), so the keyed update matches nothing. A vanished row is the
# only way to drive a shortfall here — bumping the version out of band, the way
# m-opt-lock-005 does, leaves an ungated update matching its row exactly as
# before. Because no gate could have caused the shortfall, the zero-row outcome
# is NOT the retriable optimistic-lock conflict m-opt-lock-005 pins: it is the
# distinct, never-retriable stale/consistency outcome, and retrying it would
# re-run the unit of work against a cause no re-read can change.
# `then.affectedRows` is 0 and `then.tableState` shows accounts 1 and 3 untouched
# with account 2 already gone (the update changed nothing).
model: models/account.yaml
tags: [m-opt-lock, m-sql, conflict, locking, stale-write, slice-snapshot-1, slice-managed-1]
shape: conflict
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection concurrency/locking intent (given.apply, shape:conflict)"
given:
  apply:
    - sql: delete from account where id = 2
when:
  uow:
    concurrency: locking
  mutation: update
  write: { id: 2, balance: 250.00, observedVersion: 1 }
then:
  statements:
    - sql:
        postgres: update account set balance = ?, version = ? where id = ?
      binds: [250.00, 2, 2]
  affectedRows: 0
  tableState:
    account:
      - { id: 1, owner: Ada, balance: 100.00, version: 1 }
      - { id: 3, owner: Grace, balance: 10.00, version: 1 }
