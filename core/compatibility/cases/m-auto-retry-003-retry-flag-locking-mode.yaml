# Boundary case (m-auto-retry/m-opt-lock): `retryOptimisticConflicts` has NO effect in LOCKING mode —
# there is no gate to conflict on — `api-conformance` lane.
model: models/account.yaml
tags: [m-auto-retry, m-opt-lock, m-api-conformance, locking-mode, slice-snapshot-1, slice-managed-1]
lane: api-conformance
shape: boundary
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection concurrency/locking intent (shape:boundary)"
when:
  uow:
    concurrency: locking
    retryOptimisticConflicts: true
  boundary:
    - action: read
      note: observe the versioned row under the shared lock
    - action: update
      note: the ungated locking-mode UPDATE commits — the conflict flag is inert
then:
  outcome: committed
  roundTrips: 2
