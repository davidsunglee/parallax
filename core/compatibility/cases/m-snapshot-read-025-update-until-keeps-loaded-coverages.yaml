# The original pin still selects a row after splitting, but a different one.
# Re-resolving the relationship would silently substitute that successor.
model: models/policy.yaml
tags: [m-snapshot-read, m-deep-fetch, m-temporal-read, m-bitemp-write, m-unit-work, closed-world, relationship, temporal, bitemporal, update-until, rectangle-split, scenario, slice-snapshot-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "include level - the Policy.coverages child IN-list binds are the distinct root keys gathered from step 0's own root read, so the child emission depends on a query result"
when:
  scenario:
    - objectQuery:
        target: parallax.compatibility.Policy
        predicate:
          eq:
            attr: parallax.compatibility.Policy.id
            value: 2
        temporal:
          transaction-time:
            asOf: latest
          valid-time:
            asOf: "2024-05-01T00:00:00.000000Z"
        includes:
          - segments:
              - rel: parallax.compatibility.Policy.coverages
      roundTrips: 2
      note: materialize a snapshot of policy 2 at Valid Time 2024-05-01 / Transaction Time LATEST WITH its coverages (1 + L levels, the root pin propagating per hop and per axis)
      statements:
        - sql:
            postgres: select t0.id, t0.name, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from policy t0 where t0.id = ? and t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?
          binds: [2, "2024-05-01T00:00:00.000000Z", "2024-05-01T00:00:00.000000Z", infinity]
        - sql:
            postgres: select t0.id, t0.policy_id, t0.amount, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from coverage t0 where t0.policy_id = any(?) and t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?
          binds: [[2], "2024-05-01T00:00:00.000000Z", "2024-05-01T00:00:00.000000Z", infinity]
      expectRows:
        - { id: 2, name: Home, from_z: "2024-01-01T00:00:00.000000Z", thru_z: infinity, in_z: "2024-01-01T00:00:00.000000Z", out_z: infinity }
    - write:
        - mutation: updateUntil
          entity: parallax.compatibility.Coverage
          rows:
            - { id: 20, amount: "999.00" }
          validFrom: "2024-03-01T00:00:00.000000Z"
          until: "2024-09-01T00:00:00.000000Z"
          at: "2024-07-01T00:00:00.000000Z"
      roundTrips: 5
      note: split the very rectangle the loaded `coverages` view holds - inactivate it, chain head / middle / tail, plus the resolving read the keyed write owes
      statements:
        - sql:
            postgres: update coverage set out_z = ? where id = ? and thru_z = ? and out_z = ? and in_z = ?
          binds: ["2024-07-01T00:00:00.000000Z", 20, infinity, infinity, "2024-01-01T00:00:00.000000Z"]
        - sql:
            postgres: insert into coverage(id, policy_id, amount, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
          binds: [20, 2, "300.00", "2024-01-01T00:00:00.000000Z", "2024-03-01T00:00:00.000000Z", "2024-07-01T00:00:00.000000Z", infinity]
        - sql:
            postgres: insert into coverage(id, policy_id, amount, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
          binds: [20, 2, "999.00", "2024-03-01T00:00:00.000000Z", "2024-09-01T00:00:00.000000Z", "2024-07-01T00:00:00.000000Z", infinity]
        - sql:
            postgres: insert into coverage(id, policy_id, amount, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
          binds: [20, 2, "300.00", "2024-09-01T00:00:00.000000Z", infinity, "2024-07-01T00:00:00.000000Z", infinity]
    - action: access
      "on": 0
      path: coverages
      roundTrips: 0
      sameObjectAs: 0
      note: access the ALREADY-MATERIALIZED coverages after the split -> ZERO SQL and the inactivated rectangle still whole in the view
      expectGraph:
        Coverage:
          - { id: 20, policyId: 2, amount: "300.00", validStart: "2024-01-01T00:00:00.000000Z", validEnd: infinity, txStart: "2024-01-01T00:00:00.000000Z", txEnd: infinity }
    - objectQuery:
        target: parallax.compatibility.Coverage
        predicate:
          eq:
            attr: parallax.compatibility.Coverage.policyId
            value: 2
        temporal:
          transaction-time:
            asOf: latest
          valid-time:
            asOf: "2024-05-01T00:00:00.000000Z"
      roundTrips: 1
      note: observing the write means issuing another read - the same pin now selects the middle rectangle the split chained
      statements:
        - sql:
            postgres: select t0.id, t0.policy_id, t0.amount, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from coverage t0 where t0.policy_id = ? and t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?
          binds: [2, "2024-05-01T00:00:00.000000Z", "2024-05-01T00:00:00.000000Z", infinity]
      expectRows:
        - { id: 20, policy_id: 2, amount: "999.00", from_z: "2024-03-01T00:00:00.000000Z", thru_z: "2024-09-01T00:00:00.000000Z", in_z: "2024-07-01T00:00:00.000000Z", out_z: infinity }
then:
  roundTrips: 8
