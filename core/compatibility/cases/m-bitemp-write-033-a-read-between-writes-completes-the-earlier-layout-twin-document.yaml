model: models/buffered-sequence-layout-twin-document.yaml
tags: [m-bitemp-write, m-unit-work, m-opt-lock, m-storage-layout, m-sql, scenario, target-write, dependent-read, layout-twin, document-layout, slice-snapshot-1, slice-managed-1]
shape: scenario
grading: state
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "state-graded: each flush writes against coverage its own reads and the attempt's earlier units leave, so no golden statement is stated to compile against (m-case-format 'State-graded scenarios')"
given:
  fixtures: true
when:
  uow:
    concurrency: optimistic
  scenario:
    - uow: target-first
      write:
        - mutation: updateUntil
          entity: parallax.compatibility.SequenceSpan
          row: { id: 1, amount: 150 }
          ifTxStart: "2023-12-01T00:00:00.000000Z"
          validFrom: "2024-02-01T00:00:00.000000Z"
          until: "2024-04-01T00:00:00.000000Z"
          at: "2024-11-01T00:00:00.000000Z"
    - uow: target-first
      objectQuery:
        target: parallax.compatibility.SequenceSpan
        predicate: { eq: { attr: parallax.compatibility.SequenceSpan.id, value: 1 } }
        temporal: { transaction-time: { asOf: latest }, valid-time: { asOf: "2024-02-01T00:00:00.000000Z" } }
      note: "flush the target and read what it opened"
      expectRows:
        - id: 1
          amount: 150
          label: a
          memo: { note: n1 }
          from_z: "2024-02-01T00:00:00.000000Z"
          thru_z: "2024-04-01T00:00:00.000000Z"
          in_z: "2024-11-01T00:00:00.000000Z"
          out_z: infinity
    - uow: target-first
      write:
        - mutation: updateUntil
          "on": 1
          entity: parallax.compatibility.SequenceSpan
          rows:
            - { id: 1, label: x }
          validFrom: "2024-02-01T00:00:00.000000Z"
          until: "2024-04-01T00:00:00.000000Z"
          at: "2024-11-01T00:00:00.000000Z"
      note: "an observed write through the fresh read"
    - uow: observed-first
      objectQuery:
        target: parallax.compatibility.SequenceSpan
        predicate: { eq: { attr: parallax.compatibility.SequenceSpan.id, value: 2 } }
        temporal: { transaction-time: { asOf: latest }, valid-time: { asOf: "2024-02-01T00:00:00.000000Z" } }
      note: "observe span 2 at February"
      expectRows:
        - id: 2
          amount: 100
          label: b
          memo: { note: n2 }
          from_z: "2024-01-01T00:00:00.000000Z"
          thru_z: infinity
          in_z: "2023-12-01T00:00:00.000000Z"
          out_z: infinity
    - uow: observed-first
      write:
        - mutation: updateUntil
          "on": 3
          entity: parallax.compatibility.SequenceSpan
          rows:
            - { id: 2, label: o }
          validFrom: "2024-02-01T00:00:00.000000Z"
          until: "2024-04-01T00:00:00.000000Z"
          at: "2024-11-02T00:00:00.000000Z"
    - uow: observed-first
      objectQuery:
        target: parallax.compatibility.SequenceSpan
        predicate: { eq: { attr: parallax.compatibility.SequenceSpan.id, value: 2 } }
        temporal: { transaction-time: { asOf: latest }, valid-time: { asOf: "2024-02-01T00:00:00.000000Z" } }
      note: "flush the observed write and read its milestone"
      expectRows:
        - id: 2
          amount: 100
          label: o
          memo: { note: n2 }
          from_z: "2024-02-01T00:00:00.000000Z"
          thru_z: "2024-04-01T00:00:00.000000Z"
          in_z: "2024-11-02T00:00:00.000000Z"
          out_z: infinity
    - uow: observed-first
      write:
        - mutation: updateUntil
          entity: parallax.compatibility.SequenceSpan
          row: { id: 2, amount: 160 }
          ifTxStart: "2024-11-02T00:00:00.000000Z"
          validFrom: "2024-02-01T00:00:00.000000Z"
          until: "2024-04-01T00:00:00.000000Z"
          at: "2024-11-02T00:00:00.000000Z"
      note: "a target stating the attempt's own milestone"
    - uow: stale
      write:
        - mutation: updateUntil
          entity: parallax.compatibility.SequenceSpan
          row: { id: 4, amount: 150 }
          ifTxStart: "2023-12-15T00:00:00.000000Z"
          validFrom: "2024-02-01T00:00:00.000000Z"
          until: "2024-03-01T00:00:00.000000Z"
          at: "2024-11-03T00:00:00.000000Z"
    - uow: stale
      objectQuery:
        target: parallax.compatibility.SequenceSpan
        predicate: { eq: { attr: parallax.compatibility.SequenceSpan.id, value: 4 } }
        temporal: { transaction-time: { asOf: latest }, valid-time: { asOf: "2024-02-01T00:00:00.000000Z" } }
      note: "flush the first target"
      expectRows:
        - id: 4
          amount: 150
          label: d
          memo: { note: n4 }
          from_z: "2024-02-01T00:00:00.000000Z"
          thru_z: "2024-03-01T00:00:00.000000Z"
          in_z: "2024-11-03T00:00:00.000000Z"
          out_z: infinity
    - uow: stale
      write:
        - mutation: updateUntil
          entity: parallax.compatibility.SequenceSpan
          row: { id: 4, amount: 250 }
          ifTxStart: "2023-12-15T00:00:00.000000Z"
          validFrom: "2024-06-01T00:00:00.000000Z"
          until: "2024-07-01T00:00:00.000000Z"
          at: "2024-11-03T00:00:00.000000Z"
      note: "T1 no longer describes the coverage at June: the flush closed it"
