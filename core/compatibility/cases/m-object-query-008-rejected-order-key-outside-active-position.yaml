# Negative (m-object-query Sort Key positional rule): an ORDER KEY reference names an
# entity the read is not positioned at.
model: models/animal.yaml
tags: [m-object-query, m-predicate, m-inheritance, rejected, negative, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  objectQuery:
    target: parallax.compatibility.Animal
    predicate:
      all: {}
    orderBy:
      - attr: parallax.compatibility.Person.name
then:
  rejectedRule: attribute-outside-active-position
