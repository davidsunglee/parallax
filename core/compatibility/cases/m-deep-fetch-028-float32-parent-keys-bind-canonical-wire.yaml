# An include page keyed by float32 parent identities authored as `1.2` and `0.1`.
# Each gathered key's carrier is its binary32 value, whose binary64 spelling
# (`1.2000000476837158`) is not its canonical Wire value (`1.2`), so the page reports
# every key through `m-wire` encoding: inside one array bind on Postgres, and as one
# bind per key on MariaDB.
model: models/float32-key.yaml
tags: [m-deep-fetch, m-object-query, m-sql, m-wire, relationship, to-many, graph, slice-snapshot-1, slice-managed-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "deep-fetch child level - the Buoy.pings key-set binds are the distinct parent keys gathered from the root query result, so the child emissions depend on a query result"
when:
  objectQuery:
    target: parallax.compatibility.Buoy
    predicate:
      all: {}
    orderBy:
      - { attr: parallax.compatibility.Buoy.id }
    includes:
      - segments:
          - rel: parallax.compatibility.Buoy.pings
then:
  statements:
    - sql:
        postgres: select t0.id, t0.label from buoy t0 order by t0.id asc
        mariadb: select t0.id, t0.label from buoy t0 order by t0.id asc
    - sql:
        postgres: select t0.id, t0.buoy_id, t0.strength from buoy_ping t0 where t0.buoy_id = any(?)
        mariadb: select t0.id, t0.buoy_id, t0.strength from buoy_ping t0 where t0.buoy_id in (?, ?)
      binds: { postgres: [[0.1, 1.2]], mariadb: [0.1, 1.2] }
  referenceSql: select id, label from buoy
  graph:
    Buoy:
      - id: 0.1
        label: South
        pings:
          - { id: 3, buoyId: 0.1, strength: 5 }
      - id: 1.2
        label: North
        pings:
          - { id: 1, buoyId: 1.2, strength: 7 }
          - { id: 2, buoyId: 1.2, strength: 3 }
  roundTrips: 2
