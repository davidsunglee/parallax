# `exists` over a polymorphic target NARROWED to ONE concrete subtype
# (m-navigate, m-predicate, m-inheritance, resolved Q10).
model: models/animal.yaml
tags: [m-navigate, m-predicate, m-inheritance, m-sql, table-per-hierarchy, polymorphic, narrow, exists, slice-snapshot-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Person
    predicate:
      any:
        path: parallax.compatibility.Person.pets
        where:
          narrow:
            to:
              - parallax.compatibility.Cat
            operand:
              "true": {}
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name from px.person t0 where exists (select 1 from px.animal t1 where t1.owner_id = t0.id and t1.kind = ?)
      binds: [cat]
  referenceSql: select id, name from px.person where id in (select owner_id from px.animal where kind = 'cat')
  rows:
    - { id: 10, name: Alice }
  databaseCalls: 1
