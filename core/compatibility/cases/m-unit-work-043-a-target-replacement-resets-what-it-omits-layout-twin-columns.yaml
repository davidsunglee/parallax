model: models/write-transparency-layout-twin-columns.yaml
tags: [m-unit-work, m-storage-layout, m-value-object, m-opt-lock, m-temporal-write, m-sql, write-sequence, update, temporal, audit-only, json, nested, to-many, layout-twin, columns, slice-snapshot-1, slice-managed-1]
shape: writeSequence
given:
  fixtures: true
when:
  writeSequence:
    - mutation: replace
      entity: parallax.compatibility.WriteTwinLog
      statements: 2
      note: the replacement states only the label under the milestone its caller observed, so its successor writes the nullable occurrence empty and the many occurrence as the empty collection; the flush reads the current row and closes it gated on the caller's start
      row: { id: 5, label: Pilot }
      ifTxStart: "2026-01-01T00:00:00.000000Z"
      at: "2026-06-01T00:00:00.000000Z"
then:
  statements:
    - sql:
        postgres: update write_twin_log set out_z = ? where id = ? and out_z = ? and in_z = ?
        mariadb: update write_twin_log set out_z = ? where id = ? and out_z = ? and in_z = ?
      binds: ["2026-06-01T00:00:00.000000Z", 5, infinity, "2026-01-01T00:00:00.000000Z"]
    - sql:
        postgres: insert into write_twin_log(id, label, in_z, out_z, spec, marks) values (?, ?, ?, ?, ?, ?)
        mariadb: insert into write_twin_log(id, label, in_z, out_z, spec, marks) values (?, ?, ?, ?, ?, ?)
      binds: [5, Pilot, "2026-06-01T00:00:00.000000Z", infinity, null, []]
  roundTrips: 3
  tableState:
    write_twin_log:
      - id: 5
        label: voyager
        in_z: "2026-01-01T00:00:00.000000Z"
        out_z: "2026-06-01T00:00:00.000000Z"
        spec:
          title: Ore Run
          origin: { country: "NO" }
        marks:
          - { code: X }
      - id: 5
        label: Pilot
        in_z: "2026-06-01T00:00:00.000000Z"
        out_z: infinity
        spec: null
        marks: []
