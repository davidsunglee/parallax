# Family-normalized, projection-independent diamond (m-snapshot-read): a root-typed
# and a leaf-typed include path reaching ONE inheritance row share a node; the
# differing fetched projections do not fork identity.
model: models/animal.yaml
tags: [m-snapshot-read, m-object-query, m-deep-fetch, m-inheritance, table-per-hierarchy, diamond, familyVariant, graph, slice-snapshot-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "deep-fetch child levels - the broad Person.animals and narrowed pets[Dog] IN-list binds are both the distinct owner ids gathered from the root query result, so the child emissions depend on a query result"
when:
  objectQuery:
    target: parallax.compatibility.Person
    predicate:
      eq:
        attr: parallax.compatibility.Person.id
        value: 10
    includes:
      - segments:
          - rel: parallax.compatibility.Person.animals
      - segments:
          - rel: parallax.compatibility.Person.pets
            narrowTo:
              - parallax.compatibility.Dog
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name from person t0 where t0.id = ?
      binds: [10]
    - sql:
        postgres: select t0.id, t0.kind, t0.name, t0.owner_id, t0.license_id, t0.indoor, t0.bark_volume, t0.tusk_length from animal t0 where t0.owner_id = any(?)
      binds: [[10]]
    - sql:
        postgres: select t0.id, t0.name, t0.owner_id, t0.license_id, t0.bark_volume from animal t0 where t0.owner_id = any(?) and t0.kind = ?
      binds: [[10], dog]
  referenceSql: select id, name from person where id = 10
  graph:
    Person:
      - id: 10
        name: Alice
        animals:
          - { id: 1, name: Rex, ownerId: 10, licenseId: L-100, barkVolume: 7, indoor: null, tuskLength: null, familyVariant: Dog }
          - { id: 3, name: Whiskers, ownerId: 10, licenseId: L-200, barkVolume: null, indoor: true, tuskLength: null, familyVariant: Cat }
        "pets[Dog]":
          - { id: 1, name: Rex, ownerId: 10, licenseId: L-100, barkVolume: 7 }
  roundTrips: 3
