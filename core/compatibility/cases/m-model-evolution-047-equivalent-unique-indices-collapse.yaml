# Two equivalent unique INDICES are ONE enforcement rule (m-model-evolution).
#
# The two additions differ in name and component order and in nothing else that
# uniqueness depends on, so the Entity gains one rule rather than two. Both
# operations caused it, and both are named — `causedBy` carries all and only the
# operations whose changed facts contribute.
tags: [m-model-evolution, m-schema-delta, evolution, index, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-index-collapse-v1.yaml
    later: models/evolution-index-collapse-v2.yaml
then:
  evolution:
    kind: unilateral
    operations:
      - kind: IndexAdded
        index: parallax.compatibility.Tote.tote_by_label
      - kind: IndexAdded
        index: parallax.compatibility.Tote.tote_by_region
    behavioralImpacts:
      - kind: UniquenessEnforcementChanged
        scope:
          entity: parallax.compatibility.Tote
        earlier: []
        later:
          - - parallax.compatibility.Tote.label
            - parallax.compatibility.Tote.region
        causedBy:
          - kind: IndexAdded
            index: parallax.compatibility.Tote.tote_by_label
          - kind: IndexAdded
            index: parallax.compatibility.Tote.tote_by_region
    overlapVisibleOperations: []
    coordinationRequirements: []
  schema:
    postgres:
      delta:
        statements:
          - create unique index pxi_evolution_tote_parallax_co_99750a164f63cf5873a7f3016eeefd95 on evolution_tote (label, region)
          - create unique index pxi_evolution_tote_parallax_co_c868b1fdc826986b8f1ef7d32d8df8fa on evolution_tote (region, label)
        createdIndices:
          - physicalIndexName: pxi_evolution_tote_parallax_co_99750a164f63cf5873a7f3016eeefd95
            physicalTable: evolution_tote
            logicalIndexIdentity: parallax.compatibility.Tote.tote_by_label
            unique: true
          - physicalIndexName: pxi_evolution_tote_parallax_co_c868b1fdc826986b8f1ef7d32d8df8fa
            physicalTable: evolution_tote
            logicalIndexIdentity: parallax.compatibility.Tote.tote_by_region
            unique: true
    mariadb:
      delta:
        statements:
          - create unique index pxi_evolution_tote_parallax_com_99750a164f63cf5873a7f3016eeefd95 on evolution_tote (label, region)
          - create unique index pxi_evolution_tote_parallax_com_c868b1fdc826986b8f1ef7d32d8df8fa on evolution_tote (region, label)
        createdIndices:
          - physicalIndexName: pxi_evolution_tote_parallax_com_99750a164f63cf5873a7f3016eeefd95
            physicalTable: evolution_tote
            logicalIndexIdentity: parallax.compatibility.Tote.tote_by_label
            unique: true
          - physicalIndexName: pxi_evolution_tote_parallax_com_c868b1fdc826986b8f1ef7d32d8df8fa
            physicalTable: evolution_tote
            logicalIndexIdentity: parallax.compatibility.Tote.tote_by_region
            unique: true
