# Negative (m-value-object write validation, resolved Q7): a SCALAR standing where a
# `one` value object is declared is refused PRE-SQL.
#
# A value object is written atomically as one whole DOCUMENT, so its occurrence admits
# a document or an explicit null and nothing else. Contact's `address` is a `one`
# occurrence; this write binds the string `"1 Main St"` to it — a value the position
# cannot hold, which is a type mismatch rather than an absence: the member IS named, so
# no required-ness rule is what it violates. Model-aware write validation MUST reject it
# before any DML.
model: models/contact.yaml
tags: [m-value-object, rejected, negative, write, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  write:
    id: 1
    name: Acme
    address: 1 Main St
then:
  rejectedRule: write-value-type-mismatch
