# valueObject atomic document INSERT: the whole embedded composite binds as ONE
# document value in its layout `Document` position (m-value-object write, m-sql), on Postgres
# AND MariaDB.
model: models/customer.yaml
tags: [m-value-object, m-sql, write-sequence, insert, json, nested, to-many, slice-snapshot-1, slice-managed-1]
shape: writeSequence
when:
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.Customer
      statements: 1
      note: insert one Customer, binding the whole address document atomically in its layout position
      rows:
        - id: 100
          name: Solveig
          address:
            street: 12 Aurora Ave
            city: Tromso
            geo:
              country: "NO"
            phones:
              - { type: home, number: '555-0001' }
              - { type: work, number: '555-0002' }
then:
  statements:
    - sql:
        postgres: insert into customer(id, name, address) values (?, ?, ?)
        mariadb: insert into customer(id, name, address) values (?, ?, ?)
      binds:
        - 100
        - Solveig
        - street: 12 Aurora Ave
          city: Tromso
          geo:
            country: "NO"
          phones:
            - { type: home, number: '555-0001' }
            - { type: work, number: '555-0002' }
  tableState:
    customer:
      - id: 100
        name: Solveig
        address:
          street: 12 Aurora Ave
          city: Tromso
          geo:
            country: "NO"
          phones:
            - { type: home, number: '555-0001' }
            - { type: work, number: '555-0002' }
  roundTrips: 1
