# valueObject negated membership: nestedNotIn excludes every not-present row rather
# than treating absence as "not in the list" (m-predicate nested membership +
# absence collapse, m-sql), on Postgres AND MariaDB.
model: models/customer.yaml
tags: [m-value-object, m-predicate, m-sql, m-dialect, nested, json, notIn, absence-collapse, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Customer
    predicate:
      nestedNotIn:
        path: parallax.compatibility.Customer.address.city
        values:
          - Oslo
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name from customer t0 where not jsonb_extract_path_text(t0.address, ?) in (?)
        mariadb: select t0.id, t0.name from customer t0 where not json_value(t0.address, ?) in (?)
      binds:
        postgres: [city, Oslo]
        mariadb: ['$.city', Oslo]
  referenceSql:
    postgres: select id, name from customer where address ->> 'city' not in ('Oslo')
    mariadb: select id, name from customer where nullif(json_unquote(json_extract(address, '$.city')), 'null') not in ('Oslo')
  rows:
    - { id: 3, name: Grace }
    - { id: 6, name: Rin }
  roundTrips: 1
