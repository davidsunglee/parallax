# A Transaction-Time-Only predicate terminate materializes: an unlocked read of the
# current milestones over 120.00, then a close gated on each observed in_z. The peer
# closes balance 2's milestone and chains a successor between the two. At Repeatable
# Read balance 2's close is refused because the row changed after the snapshot the
# read took.
model: models/balance.yaml
tags: [m-batch-write, m-temporal-write, m-opt-lock, m-unit-work, m-db-error, isolation, concurrency, predicate-write, materialize, temporal, audit-only, terminate, repeatable-read, slice-snapshot-1]
shape: error
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "two-session isolation witness (when.concurrency)"
given:
  fixtures: true
when:
  uow:
    concurrency: optimistic
    isolation: repeatable-read
  concurrency:
    rounds:
      - A:
          statements:
            - sql:
                postgres: select t0.bal_id, t0.acct_num, t0.val, t0.in_z, t0.out_z from balance t0 where t0.val > ? and t0.out_z = ?
                mariadb: select t0.bal_id, t0.acct_num, t0.val, t0.in_z, t0.out_z from balance t0 where t0.val > ? and t0.out_z = ?
              binds: ["120.00", infinity]
      - B:
          statements:
            - sql:
                postgres: update balance set out_z = ? where bal_id = ? and out_z = ? and in_z = ?
                mariadb: update balance set out_z = ? where bal_id = ? and out_z = ? and in_z = ?
              binds: ["2024-09-01T00:00:00.000000Z", 2, infinity, "2024-02-01T00:00:00.000000Z"]
            - sql:
                postgres: insert into balance(bal_id, acct_num, val, in_z, out_z) values (?, ?, ?, ?, ?)
                mariadb: insert into balance(bal_id, acct_num, val, in_z, out_z) values (?, ?, ?, ?, ?)
              binds: [2, B, "999.00", "2024-09-01T00:00:00.000000Z", infinity]
      - B:
          kind: commit
      - A:
          statements:
            - sql:
                postgres: update balance set out_z = ? where bal_id = ? and out_z = ? and in_z = ?
                mariadb: update balance set out_z = ? where bal_id = ? and out_z = ? and in_z = ?
              binds: ["2024-10-01T00:00:00.000000Z", 1, infinity, "2024-06-01T00:00:00.000000Z"]
            - sql:
                postgres: update balance set out_z = ? where bal_id = ? and out_z = ? and in_z = ?
                mariadb: update balance set out_z = ? where bal_id = ? and out_z = ? and in_z = ?
              binds: ["2024-10-01T00:00:00.000000Z", 2, infinity, "2024-02-01T00:00:00.000000Z"]
then:
  errorClass: deadlock
  nativeCode:
    postgres: "40001"
    mariadb: 1020
  tableState:
    balance:
      - bal_id: 1
        acct_num: A
        val: "100.00"
        in_z: "2024-01-01T00:00:00.000000Z"
        out_z: "2024-06-01T00:00:00.000000Z"
      - { bal_id: 1, acct_num: A, val: "150.00", in_z: "2024-06-01T00:00:00.000000Z", out_z: infinity }
      - bal_id: 2
        acct_num: B
        val: "200.00"
        in_z: "2024-02-01T00:00:00.000000Z"
        out_z: "2024-09-01T00:00:00.000000Z"
      - { bal_id: 2, acct_num: B, val: "999.00", in_z: "2024-09-01T00:00:00.000000Z", out_z: infinity }
      - bal_id: 3
        acct_num: C
        val: "50.00"
        in_z: "2024-03-01T00:00:00.000000Z"
        out_z: "2024-08-01T00:00:00.000000Z"
