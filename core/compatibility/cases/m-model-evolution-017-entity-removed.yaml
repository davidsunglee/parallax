# Removing a whole Entity (m-model-evolution): coordinated, and its members are
# SUPPRESSED.
tags: [m-model-evolution, evolution, entity, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-entity-v2.yaml
    later: models/evolution-entity-v1.yaml
then:
  evolution:
    kind: coordinated
    operations:
      [{ kind: EntityRemoved, entity: parallax.compatibility.Crate }]
    behavioralImpacts: []
    overlapVisibleOperations: []
    coordinationRequirements:
      - operation: { kind: EntityRemoved, entity: parallax.compatibility.Crate }
        reasons: [AuthoringSurfaceChangeRequired]
