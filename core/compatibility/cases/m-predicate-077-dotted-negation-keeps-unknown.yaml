# Negating a dotted comparison keeps its unknown: a basket with no owner, and one
# whose owner's `active` is null, satisfy neither the comparison nor its negation.
model: models/predicate-collections.yaml
tags: [m-predicate, relationship, to-one, traversal, negation, m-dialect, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Basket
    predicate:
      not:
        operand:
          eq: {path: parallax.compatibility.Basket.owner.active, value: true}
then:
  statements:
  - sql: {postgres: 'select t0.id, t0.label, t0.owner_id, not t0.tags is null, t0.tags, not t0.scores is null, t0.scores, not t0.prices is null, t0.prices, not t0.flags is null, t0.flags, not t0.parcels is null, t0.parcels, not t0.meta is null, t0.meta from basket t0 where not (select t1.active from basket_owner t1 where t1.id = t0.owner_id) = ?', mariadb: 'select t0.id, t0.label, t0.owner_id, not t0.tags is null, t0.tags, not t0.scores is null, t0.scores, not t0.prices is null, t0.prices, not t0.flags is null, t0.flags, not t0.parcels is null, t0.parcels, not t0.meta is null, t0.meta from basket t0 where not (select t1.active from basket_owner t1 where t1.id = t0.owner_id) = ?'}
    binds: [true]
  graph:
    Basket:
    - id: 4
      label: four
      ownerId: 3
      tags: [urgent]
      scores: [0]
      prices: []
      flags: [true, false]
      parcels:
      - sku: d
        qty: 1
        notes: [urgent, x]
      meta: null
  roundTrips: 1
