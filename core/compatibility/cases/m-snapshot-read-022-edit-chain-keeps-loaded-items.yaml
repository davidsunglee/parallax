# A POPULATED to-many relationship survives a CHAIN of authored edits
# (m-snapshot-read *Closed world*, composition): deriving a copy of a copy leaves
# the materialized view alone at every hop, so accessing it after the chain still
# issues ZERO SQL and still answers both line items. This is the clause "a
# derived copy's view state IS its source's" held over a chain rather than a
# single derivation; m-snapshot-read-016 holds it for ONE edit, and the two
# together say that carrying a view is a property of the edit verb rather than of
# the first use of it.
#
# Step 0 materializes order 1 WITH its `items` — the ordinary 1 + L deep fetch,
# one statement per level, two round trips. Step 1 derives an edited copy
# assigning `name`, and step 2 derives a SECOND copy from THAT one, naming step 1
# rather than step 0 and assigning nothing at all. The two hops are the two kinds
# of edit there are: an authored change and a change-free derivation, which is
# the partition the composition rule must hold across (an edit with no changes is
# legal and builds a copy of the value's own state). Neither hop emits DML, and
# neither reaches the database — a snapshot graph is never enrolled in a unit of
# work. Step 3 then accesses `items` on the view step 0 materialized and states
# its WHOLE contents through `expectGraph`: both OrderItem rows, every declared
# member, unchanged, in the `id desc` order the relationship declares.
#
# The semantic distinction is against a single edit and against a re-read alike.
# An implementation that carries views on the FIRST derivation but rebuilds a
# copy of a copy from its declared members — or that short-circuits a change-free
# edit into something other than a copy — passes m-snapshot-read-016 and fails
# here at step 2's own hop, because step 3 asks the source what it still holds
# after the chain ran. A fresh find after the chain would re-query the database
# and grade a NEW materialization instead, which is why `expectGraph` is legal on
# an access step alone. `roundTrips: 0` is the closed-world half; `expectGraph`
# is the survival half.
#
# The access names step 0, the read: `on` names the step whose Include Paths
# materialized the view whose contents are stated, and the chain's own copies are
# where the derivation is observable rather than where the fetch happened. What
# each copy itself answers for `items` — the SAME objects, hop after hop — is the
# reference-identity assertion each language's API Conformance Suite runs
# (m-api-conformance), which is also the only lane that holds a copy at all.
# `sameObjectAs: 0` rides along for consistency with the other zero-round-trip
# accesses (m-op-list-002); on the wire lane it is primary-key equality against
# this step's own reused source rows.
model: models/orders.yaml
tags: [m-snapshot-read, m-deep-fetch, closed-world, relationship, mutation, scenario, slice-snapshot-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "include level - the Order.items child IN-list binds are the distinct root keys gathered from step 0's own root read, so the child emission depends on a query result"
when:
  scenario:
    - objectQuery:
        target: parallax.compatibility.Order
        predicate:
          eq:
            attr: parallax.compatibility.Order.id
            value: 1
        includes:
          - segments:
              - rel: parallax.compatibility.Order.items
      roundTrips: 2
      note: materialize a snapshot of order 1 WITH its line items (1 + L levels)
      statements:
        - sql:
            postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.id = ?
          binds: [1]
        - sql:
            postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id in (?) order by t0.id desc
          binds: [1]
      expectRows:
        - { id: 1, name: Ada, sku: A-100, qty: 5, price: 10.50, active: true, ordered_on: 2024-01-05 }
    - action: mutate
      "on": 0
      set: { name: Mutant }
      roundTrips: 0
      note: the first hop - an AUTHORED change, deriving an edited copy of the snapshot node -> NO DML
    - action: mutate
      "on": 1
      roundTrips: 0
      note: the second hop - a CHANGE-FREE edit of the copy step 1 derived, naming that copy rather than the read
    - action: access
      "on": 0
      path: items
      roundTrips: 0
      sameObjectAs: 0
      note: access the ALREADY-MATERIALIZED items after the whole chain -> ZERO SQL and the same contents
      expectGraph:
        OrderItem:
          - { id: 12, orderId: 1, sku: B-200, quantity: 1, shippedOn: 2024-02-15 }
          - { id: 11, orderId: 1, sku: A-100, quantity: 2, shippedOn: null }
then:
  roundTrips: 2
