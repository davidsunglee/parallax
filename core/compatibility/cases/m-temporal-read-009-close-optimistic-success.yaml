# Optimistic Transaction-Time-Only termination after a find gates on the Transaction-Time
# start the unit of work observed and closes EXACTLY one row (m-temporal-read +
# m-opt-lock). It carries the fresh-gate success the conflict form pinned — the close-only
# shape, gated on the observed in_z, affecting the one current milestone — now produced by
# a public `terminate`, which chains no successor on a Transaction-Time-Only target.
model: models/balance.yaml
tags: [m-temporal-read, m-opt-lock, m-temporal-write, m-unit-work, m-sql, temporal, audit-only, scenario, slice-snapshot-1, slice-managed-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "the close gates on the milestone its own group's find observed — a query result (m-case-format 'Settling against a grouped find')"
when:
  uow:
    concurrency: optimistic
  scenario:
    - uow: observe-then-terminate
      objectQuery:
        target: parallax.compatibility.Balance
        predicate:
          eq:
            path: parallax.compatibility.Balance.id
            value: 2
        temporal:
          transaction-time:
            asOf: latest
      roundTrips: 1
      note: observe balance 2's current milestone (200.00, known from 2024-02-01)
      statements:
        - sql:
            postgres: select t0.bal_id, t0.acct_num, t0.val, t0.in_z, t0.out_z from balance t0 where t0.bal_id = ? and t0.out_z = ?
            mariadb: select t0.bal_id, t0.acct_num, t0.val, t0.in_z, t0.out_z from balance t0 where t0.bal_id = ? and t0.out_z = ?
          binds: [2, infinity]
      expectRows:
        - { bal_id: 2, acct_num: B, val: "200.00", in_z: "2024-02-01T00:00:00.000000Z", out_z: infinity }
    - uow: observe-then-terminate
      write:
        - mutation: terminate
          "on": 0
          entity: parallax.compatibility.Balance
          rows:
            - { id: 2 }
          at: "2024-10-01T00:00:00.000000Z"
      roundTrips: 1
      note: the close alone, gated on the observed in_z — a Transaction-Time-Only terminate chains no successor
      statements:
        - sql:
            postgres: update balance set out_z = ? where bal_id = ? and out_z = ? and in_z = ?
            mariadb: update balance set out_z = ? where bal_id = ? and out_z = ? and in_z = ?
          binds: ["2024-10-01T00:00:00.000000Z", 2, infinity, "2024-02-01T00:00:00.000000Z"]
then:
  roundTrips: 2
  tableState:
    balance:
      - { bal_id: 1, acct_num: A, val: "100.00", in_z: "2024-01-01T00:00:00.000000Z", out_z: "2024-06-01T00:00:00.000000Z" }
      - { bal_id: 1, acct_num: A, val: "150.00", in_z: "2024-06-01T00:00:00.000000Z", out_z: infinity }
      - { bal_id: 2, acct_num: B, val: "200.00", in_z: "2024-02-01T00:00:00.000000Z", out_z: "2024-10-01T00:00:00.000000Z" }
      - { bal_id: 3, acct_num: C, val: "50.00", in_z: "2024-03-01T00:00:00.000000Z", out_z: "2024-08-01T00:00:00.000000Z" }
