# A temporal close reaching MORE rows than its Milestone Target addresses: the
# excess is cardinality corruption, never a concurrency outcome (m-unit-work,
# ADR 0044).
#
# A Milestone Target names the one current physical milestone row a key holds,
# so a close expects exactly one row in both modes. Every other case in the
# corpus drives the shortfall side of that expectation; this one drives the
# excess, and the semantic distinction it pins down is that the two sides are
# NOT symmetric. A shortfall is a concurrency outcome, classified by the write's
# own gate and retriable when the gate detected a lost update. An excess cannot
# be any of those: no concurrent writer can make a correctly addressed singleton
# match two rows. It means an accepted identity, storage, or lowering invariant
# does not hold, so it is a distinct, never-retriable failure — retrying would
# re-run the closure against state already known to be corrupt, and opting into
# optimistic-conflict retry must not admit it.
#
# `given.apply` INSERTS a second row for bal_id 2 that is also current
# (`out_z = infinity`) at a different `in_z`, which the `(bal_id, in_z)` primary
# key permits and the temporal invariant forbids: the key now holds two current
# milestones. The ungated locking-mode close addresses the current row by key
# and open upper bound alone, so it matches BOTH and `then.affectedRows` is 2
# where exactly 1 was expected. The golden SQL is unchanged from
# m-temporal-read-012's ungated close — the statement is right, the world is not.
#
# `then.tableState` is deliberately absent. The write is refused, so its unit of
# work reaches no committed state to assert; the claim is the emitted statement
# and the count it must be held to.
model: models/balance.yaml
tags: [m-unit-work, m-temporal-read, m-sql, temporal, conflict, locking, cardinality-corruption, slice-snapshot-1, slice-managed-1]
shape: conflict
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection concurrency/locking intent (given.apply, shape:conflict)"
given:
  apply:
    - sql: insert into balance (bal_id, acct_num, val, in_z, out_z) values (2, 'B', 275.00, '2024-05-01T00:00:00+00:00', 'infinity')
when:
  uow:
    concurrency: locking
  write: { id: 2 }
  at: "2024-10-01T00:00:00+00:00"
then:
  statements:
    - sql:
        postgres: update balance set out_z = ? where bal_id = ? and out_z = ?
      binds: ["2024-10-01T00:00:00+00:00", 2, infinity]
  affectedRows: 2
