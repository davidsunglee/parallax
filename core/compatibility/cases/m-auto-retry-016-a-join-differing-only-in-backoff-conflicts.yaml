model: models/account.yaml
tags: [m-auto-retry, m-unit-work, m-api-conformance, join, slice-snapshot-1, slice-managed-1]
lane: api-conformance
shape: boundary
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection unit-of-work boundary intent (shape:boundary)"
when:
  uow:
    retry: {maxRetries: 2, backoff: {baseDelay: 0.002, maxDelay: 0.05}}
  boundary:
    - action: read
      note: the outer body observes the row it will write
    - action: join
      note: a joining call naming nothing inherits the policy the transaction resolved
    - action: amend
      note: the joined body buffers a write onto the shared unit of work
    - action: join
      retry: {maxRetries: 2, backoff: {baseDelay: 0.002, maxDelay: 0.05}}
      note: a joining call repeating the resolved policy is accepted
    - action: join
      retry: {maxRetries: 2}
      note: the same bound under the built-in backoff is another policy, refused before its callback runs
then:
  outcome: option-conflict
  databaseCalls: 1
  executionLifecycle:
    roots:
      - execution: 1
        kind: transaction-invocation
        events:
          - sequence: 1
            activity: 1
            parent: null
            transactionInvocationStarted:
              invocation: outer
              accessMode: read-write
              concurrency: optimistic
              retry: {maxRetries: 2, backoff: {baseDelay: 0.002, maxDelay: 0.05}}
              isolation: read-committed
          - sequence: 2
            activity: 2
            parent: 1
            transactionAttemptStarted: {edition: account}
          - sequence: 3
            activity: 3
            parent: 2
            acquisitionStarted: { policy: writer-only }
          - sequence: 4
            activity: 3
            parent: 2
            acquisitionFinished: { outcome: acquired, route: writer }
          - sequence: 5
            activity: 4
            parent: 2
            readStarted: { target: parallax.compatibility.Account, interface: typed }
          - sequence: 6
            activity: 5
            parent: 4
            databaseCallStarted: { target: parallax.compatibility.Account, kind: read }
          - sequence: 7
            activity: 5
            parent: 4
            databaseCallFinished: { outcome: readCompleted, returnedRows: 1 }
          - sequence: 8
            activity: 4
            parent: 2
            readFinished: { outcome: completed }
          - sequence: 9
            activity: 6
            parent: 2
            transactionInvocationStarted: { invocation: joined }
          - sequence: 10
            activity: 7
            parent: 2
            transactionInvocationStarted: { invocation: joined }
          - sequence: 11
            activity: 7
            parent: 2
            transactionInvocationFinished: { outcome: raised, attribution: direct }
          - sequence: 12
            activity: 6
            parent: 2
            transactionInvocationFinished: { outcome: raised, attribution: direct }
          - sequence: 13
            activity: 8
            parent: 2
            releaseStarted: {}
          - sequence: 14
            activity: 8
            parent: 2
            releaseFinished: { cleanup: returned }
          - sequence: 15
            activity: 2
            parent: 1
            transactionAttemptFinished:
              outcome: rolledBack
              phase: callback
              retryEligible: false
              attribution: caused
              cause: 7
          - sequence: 16
            activity: 1
            parent: null
            transactionInvocationFinished: { outcome: failed, attribution: caused, cause: 2 }
