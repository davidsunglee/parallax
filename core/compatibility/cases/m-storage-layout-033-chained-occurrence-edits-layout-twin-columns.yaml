# Columns half of the chained-edit proof: two successive edits of ONE occurrence,
# each replacing it whole against the state the previous one left. Its twin authors
# the same two edits and the same two expected rows under Relational Document Layout.
model: models/write-transparency-layout-twin-columns.yaml
tags: [m-storage-layout, m-value-object, m-document-codec, m-unit-work, m-opt-lock, m-read-lock, m-sql, scenario, update, json, nested, to-many, layout-twin, columns, slice-snapshot-1, slice-managed-1]
shape: scenario
when:
  scenario:
    - write:
        - mutation: update
          entity: parallax.compatibility.WriteTwinItem
          rows:
            - id: 2
              spec:
                title: Meridian
                note: second
                origin: { country: SE }
                stops:
                  - { port: Bergen }
                  - { port: Kiel }
      roundTrips: 2
      note: the first edit restates the whole occurrence to add a stop
      statements:
        - sql:
            postgres: update write_twin set spec = ? where id = ?
            mariadb: update write_twin set spec = ? where id = ?
          binds:
            - title: Meridian
              note: second
              origin: { country: SE }
              stops:
                - { port: Bergen }
                - { port: Kiel }
            - 2
    - objectQuery:
        target: parallax.compatibility.WriteTwinItem
        predicate:
          eq:
            attr: parallax.compatibility.WriteTwinItem.id
            value: 2
      roundTrips: 1
      note: the restated occurrence is what item 2 holds when the second edit arrives
      statements:
        - sql:
            postgres: select t0.id, t0.label, not t0.spec is null, t0.spec, not t0.marks is null, t0.marks from write_twin t0 where t0.id = ? for share of t0
            mariadb: select t0.id, t0.label, not t0.spec is null, t0.spec, not t0.marks is null, t0.marks from write_twin t0 where t0.id = ? lock in share mode
          binds: [2]
      expectRows:
        - id: 2
          label: south
          spec:
            title: Meridian
            note: second
            origin: { country: SE }
            stops:
              - { port: Bergen }
              - { port: Kiel }
          marks:
            - { code: C }
    - write:
        - mutation: update
          entity: parallax.compatibility.WriteTwinItem
          rows:
            - id: 2
              spec:
                title: Meridian
                stops:
                  - { port: Kiel }
      roundTrips: 2
      note: the second edit names two members, so it destroys what the first edit had just stored
      statements:
        - sql:
            postgres: update write_twin set spec = ? where id = ?
            mariadb: update write_twin set spec = ? where id = ?
          binds:
            - title: Meridian
              stops:
                - { port: Kiel }
            - 2
    - objectQuery:
        target: parallax.compatibility.WriteTwinItem
        predicate:
          eq:
            attr: parallax.compatibility.WriteTwinItem.id
            value: 2
      roundTrips: 1
      note: only the second edit's own value survives, and `label` and `marks` are untouched throughout
      statements:
        - sql:
            postgres: select t0.id, t0.label, not t0.spec is null, t0.spec, not t0.marks is null, t0.marks from write_twin t0 where t0.id = ? for share of t0
            mariadb: select t0.id, t0.label, not t0.spec is null, t0.spec, not t0.marks is null, t0.marks from write_twin t0 where t0.id = ? lock in share mode
          binds: [2]
      expectRows:
        - id: 2
          label: south
          spec:
            title: Meridian
            stops:
              - { port: Kiel }
          marks:
            - { code: C }
then:
  roundTrips: 6
  tableState:
    write_twin:
      - id: 1
        label: north
        spec:
          title: Atlas
          note: first
          origin: { country: "NO" }
          stops:
            - { port: Oslo }
        marks:
          - { code: A }
          - { code: B }
      - id: 2
        label: south
        spec:
          title: Meridian
          stops:
            - { port: Kiel }
        marks:
          - { code: C }
