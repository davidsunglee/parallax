# Boundary case (m-opt-lock, m-case-format root configuration): requesting
# `retryOptimisticConflicts: false` at the call overrides a Database Root that
# opted in, so an optimistic-lock conflict surfaces after one attempt —
# `api-conformance` lane.
model: models/account.yaml
tags: [m-opt-lock, m-auto-retry, m-api-conformance, conflict, database-options, slice-snapshot-1, slice-managed-1]
lane: api-conformance
shape: boundary
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection concurrency/locking intent (given.fault, shape:boundary)"
given:
  fault: optimistic-lock-conflict
  databaseOptions:
    retryOptimisticConflicts: true
when:
  uow:
    retryOptimisticConflicts: false
  boundary:
    - action: read
      note: observe the versioned row (records the observed version)
    - action: update
      note: the gated UPDATE conflicts once — the explicit opt-out leaves it unretried
then:
  outcome: optimistic-lock-conflict
  roundTrips: 2
