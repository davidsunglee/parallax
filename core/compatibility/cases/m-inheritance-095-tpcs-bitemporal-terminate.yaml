# Table-per-concrete-subtype BITEMPORAL plain TERMINATE: the inactivation targets the
# subtype's OWN table with NO tag guard (m-inheritance x m-bitemp-write x m-sql).
model: models/rate.yaml
tags: [m-inheritance, m-bitemp-write, m-sql, table-per-concrete-subtype, temporal, bitemporal, write-sequence, plain-terminate, slice-snapshot-1, slice-managed-1]
shape: writeSequence
when:
  uow:
    concurrency: locking
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.DepositRate
      statements: 1
      note: open the original Latest rectangle in the concrete deposit_rate table
      rows:
        - { id: 1, amount: "2.50", grade: A }
      validFrom: "2024-01-01T00:00:00.000000Z"
      at: "2024-01-01T00:00:00.000000Z"
    - mutation: terminate
      entity: parallax.compatibility.DepositRate
      statements: 2
      note: inactivate the original in the concrete table (no tag guard), then chain head only
      rows:
        - { id: 1 }
      validFrom: "2024-06-01T00:00:00.000000Z"
      at: "2024-07-01T00:00:00.000000Z"
then:
  statements:
    - sql:
        postgres: insert into deposit_rate(id, amount, grade, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
      binds: [1, "2.50", A, "2024-01-01T00:00:00.000000Z", infinity, "2024-01-01T00:00:00.000000Z", infinity]
    - sql:
        postgres: update deposit_rate set out_z = ? where id = ? and thru_z = ? and out_z = ?
      binds: ["2024-07-01T00:00:00.000000Z", 1, infinity, infinity]
    - sql:
        postgres: insert into deposit_rate(id, amount, grade, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
      binds: [1, "2.50", A, "2024-01-01T00:00:00.000000Z", "2024-06-01T00:00:00.000000Z", "2024-07-01T00:00:00.000000Z", infinity]
  tableState:
    deposit_rate:
      - id: 1
        amount: "2.50"
        grade: A
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: infinity
        in_z: "2024-01-01T00:00:00.000000Z"
        out_z: "2024-07-01T00:00:00.000000Z"
      - id: 1
        amount: "2.50"
        grade: A
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: "2024-06-01T00:00:00.000000Z"
        in_z: "2024-07-01T00:00:00.000000Z"
        out_z: infinity
  roundTrips: 4
