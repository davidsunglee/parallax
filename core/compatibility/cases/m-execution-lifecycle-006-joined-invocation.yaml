# Joined invocation (m-execution-lifecycle): a joined unit of work is an
# activity of its own that runs NO attempt, and its buffered write reaches the
# database in the OUTER attempt's pre-commit batch.
model: models/account.yaml
tags: [m-execution-lifecycle, m-unit-work, m-api-conformance, slice-snapshot-1, joined]
lane: api-conformance
shape: boundary
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection unit-of-work boundary intent (shape:boundary)"
when:
  uow:
    concurrency: locking
  boundary:
    - action: read
      note: the OUTER body observes the row it will write
    - action: join
      note: open a joined unit of work — it shares the outer transaction, not a nested boundary of its own
    - action: update
      note: the joined body writes; the OUTER boundary flushes the shared buffer
then:
  outcome: committed
  roundTrips: 2
  executionLifecycle:
    roots:
      - execution: 1
        kind: transaction-invocation
        events:
          - sequence: 1
            activity: 1
            parent: null
            transactionInvocationStarted:
              invocation: outer
              concurrency: locking
              retries: 10
              retryOptimisticConflicts: false
              isolation: read-committed
          - sequence: 2
            activity: 2
            parent: 1
            transactionAttemptStarted: {edition: account}
          - sequence: 3
            activity: 3
            parent: 2
            acquisitionStarted: {}
          - sequence: 4
            activity: 3
            parent: 2
            acquisitionFinished: { outcome: acquired }
          - sequence: 5
            activity: 4
            parent: 2
            readStarted: { target: parallax.compatibility.Account, interface: typed }
          - sequence: 6
            activity: 5
            parent: 4
            databaseCallStarted: { target: parallax.compatibility.Account, kind: read }
          - sequence: 7
            activity: 5
            parent: 4
            databaseCallFinished: { outcome: readCompleted, returnedRows: 1 }
          - sequence: 8
            activity: 4
            parent: 2
            readFinished: { outcome: completed }
          - sequence: 9
            activity: 6
            parent: 2
            transactionInvocationStarted: { invocation: joined }
          - sequence: 10
            activity: 6
            parent: 2
            transactionInvocationFinished: { outcome: returned }
          - sequence: 11
            activity: 7
            parent: 2
            writeBatchStarted: { trigger: pre-commit }
          - sequence: 12
            activity: 8
            parent: 7
            databaseCallStarted: { target: parallax.compatibility.Account, kind: write }
          - sequence: 13
            activity: 8
            parent: 7
            databaseCallFinished: { outcome: writeCompleted, affectedRows: 1 }
          - sequence: 14
            activity: 7
            parent: 2
            writeBatchFinished: { outcome: completed }
          - sequence: 15
            activity: 9
            parent: 2
            releaseStarted: {}
          - sequence: 16
            activity: 9
            parent: 2
            releaseFinished: { cleanup: returned }
          - sequence: 17
            activity: 2
            parent: 1
            transactionAttemptFinished: { outcome: committed }
          - sequence: 18
            activity: 1
            parent: null
            transactionInvocationFinished: { outcome: committed }