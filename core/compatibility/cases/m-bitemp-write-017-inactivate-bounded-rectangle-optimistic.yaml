# Optimistic bitemporal inactivation of the BOUNDED current rectangle: the close's
# address binds the observed rectangle's OWN Valid-Time end, which here is FINITE
# (m-bitemp-write + m-opt-lock, ADR 0046).
#
# Fixture rows R2 (value 100, valid [2024-01-01, 2024-06-01)) and R3 (value 200, valid
# [2024-06-01, infinity)) are both current on Transaction Time and share in_z
# 2024-04-01, so primary key, `out_z = infinity`, and the observed-in_z gate are
# IDENTICAL for the two — `thru_z` is the only discriminator left. This case closes R2;
# m-bitemp-write-004 closes R3 from the same fixtures with the same instant and the
# same gate, so the two goldens differ by exactly one bind: `thru_z` 2024-06-01 here,
# infinity there.
#
# That one bind is the semantic distinction. R3's Valid-Time end coincides with the
# invariant Transaction-Time end, so -004 on its own cannot separate "bind the observed
# predecessor's own validEnd" from "bind infinity on every as-of axis". A finite end
# separates them, and it is the only witness in the corpus for the finite arm of a
# Milestone Target's exclusive upper bound.
#
# The close inactivates exactly 1 row: `then.tableState` shows R2 closed at 2024-10-01
# with R1 and R3 untouched. As in -004 a conflict case runs only that single close, not
# the replacement INSERTs a full rectangle split would chain, so nothing re-opens the
# Valid-Time window R2 covered.
model: models/position.yaml
tags: [m-bitemp-write, m-opt-lock, m-sql, bitemporal, temporal, conflict, slice-snapshot-1, slice-managed-1]
shape: conflict
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection concurrency/locking intent (shape:conflict)"
when:
  uow:
    concurrency: optimistic
  write: { id: 1, validEnd: "2024-06-01T00:00:00.000000Z" }
  at: "2024-10-01T00:00:00.000000Z"
  observedTxStart: "2024-04-01T00:00:00.000000Z"
then:
  statements:
    - sql:
        postgres: update position set out_z = ? where pos_id = ? and thru_z = ? and out_z = ? and in_z = ?
        mariadb: update `position` set out_z = ? where pos_id = ? and thru_z = ? and out_z = ? and in_z = ?
      binds: ["2024-10-01T00:00:00.000000Z", 1, "2024-06-01T00:00:00.000000Z", infinity, "2024-04-01T00:00:00.000000Z"]
  affectedRows: 1
  tableState:
    position:
      - pos_id: 1
        acct_num: A
        val: "90.00"
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: infinity
        in_z: "2024-01-01T00:00:00.000000Z"
        out_z: "2024-04-01T00:00:00.000000Z"
      - pos_id: 1
        acct_num: A
        val: "100.00"
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: "2024-06-01T00:00:00.000000Z"
        in_z: "2024-04-01T00:00:00.000000Z"
        out_z: "2024-10-01T00:00:00.000000Z"
      - pos_id: 1
        acct_num: A
        val: "200.00"
        from_z: "2024-06-01T00:00:00.000000Z"
        thru_z: infinity
        in_z: "2024-04-01T00:00:00.000000Z"
        out_z: infinity
