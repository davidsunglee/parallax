# Transaction A changes order item 11's own sku, a column the predicate tests, and
# holds the change. Transaction B's key-selecting update of Ada's items whose sku is
# A-100 runs before A commits. Repeatable Read refuses the resumed statement because
# item 11 changed after its snapshot: a serialization failure in the retriable
# deadlock category.
model: models/orders.yaml
tags: [m-batch-write, m-sql, m-unit-work, m-db-error, isolation, concurrency, predicate-write, readless, relationship, to-one, update, repeatable-read, deadlock, slice-snapshot-1]
shape: error
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "two-session isolation witness (when.concurrency)"
given:
  fixtures: true
when:
  uow:
    isolation: repeatable-read
  concurrency:
    rounds:
      - A:
          statements:
            - sql:
                postgres: update order_item set sku = ? where id = ?
              binds: [X-1, 11]
      - B:
          blocks: true
          statements:
            - sql:
                postgres: update order_item set sku = ? where id in (select t0.id from order_item t0 left join orders t1 on t1.id = t0.order_id where t1.name = ? and t0.sku = ?)
              binds: [Z, Ada, A-100]
      - A:
          kind: commit
then:
  errorClass: deadlock
  nativeCode:
    postgres: "40001"
  tableState:
    order_item:
      - { id: 11, order_id: 1, sku: X-1, quantity: 2, shipped_on: null }
      - { id: 12, order_id: 1, sku: B-200, quantity: 1, shipped_on: 2024-02-15 }
      - { id: 21, order_id: 2, sku: A-300, quantity: 4, shipped_on: 2024-02-20 }
      - { id: 421, order_id: 42, sku: A-999, quantity: 3, shipped_on: 2024-03-10 }
      - { id: 422, order_id: 42, sku: B-200, quantity: 5, shipped_on: 2024-02-05 }
