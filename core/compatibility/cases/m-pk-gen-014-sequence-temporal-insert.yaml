# PK generation `sequence` composed with a TEMPORAL (audit-only) insert (m-pk-gen +
# m-txtime-write) — net-new: no existing case puts pk generation on a temporal entity.
model: models/pk-audit.yaml
tags: [m-pk-gen, m-txtime-write, m-sql, sequence, write-sequence, slice-snapshot-1, slice-managed-1]
shape: writeSequence
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "sequence-strategy PK allocation - the following INSERT binds registry-read-derived id values, so emissions depend on a query result"
given:
  fixtures: true
when:
  writeSequence:
    - mutation: update
      entity: parallax.compatibility.AuditSeq
      statements: 1
      note: reserve a block of 1 (next_val += 1), base = 1
      rows:
        - { name: entry_seq, nextVal: { increment: 1 } }
    - mutation: insert
      entity: parallax.compatibility.AuditEntry
      statements: 1
      note: open a milestone [txInstant, infinity) carrying the reserved id 1
      rows:
        - { id: 1, note: opened }
      at: "2024-05-01T00:00:00.000000Z"
then:
  statements:
    - sql:
        postgres: update audit_seq set next_val = next_val + ? where name = ?
      binds: [1, entry_seq]
    - sql:
        postgres: insert into audit_entry(id, note, in_z, out_z) values (?, ?, ?, ?)
      binds: [1, opened, "2024-05-01T00:00:00.000000Z", infinity]
  tableState:
    audit_seq:
      - { name: entry_seq, next_val: 2 }
    audit_entry:
      - { id: 1, note: opened, in_z: "2024-05-01T00:00:00.000000Z", out_z: infinity }
  roundTrips: 2
