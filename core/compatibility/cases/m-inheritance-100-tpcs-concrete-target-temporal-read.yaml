# Table-per-concrete-subtype CONCRETE-target TEMPORAL read: DepositRate's root-owned
# axes, referenced through the concrete position (m-inheritance x m-temporal-read x
# m-sql — binding decision: temporal axes are family-wide and root-owned, but every
# concrete-target read still inherits and uses them).
model: models/rate.yaml
tags: [m-inheritance, m-object-query, m-temporal-read, m-sql, table-per-concrete-subtype, temporal, bitemporal, as-of, slice-snapshot-1, slice-managed-1]
shape: read
given:
  fixtures: true
when:
  objectQuery:
    target: parallax.compatibility.DepositRate
    predicate:
      all: {}
    temporal:
      transaction-time:
        asOf: "2024-01-15T00:00:00.000000Z"
      valid-time:
        asOf: latest
then:
  statements:
    - sql:
        postgres: select t0.id, t0.amount, t0.grade, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from deposit_rate t0 where t0.thru_z = ? and t0.in_z <= ? and t0.out_z > ?
      binds: [infinity, "2024-01-15T00:00:00.000000Z", "2024-01-15T00:00:00.000000Z"]
  referenceSql: "select id, amount, grade, from_z, thru_z, in_z, out_z from deposit_rate where thru_z = 'infinity'::timestamptz and in_z <= '2024-01-15T00:00:00+00:00'::timestamptz and out_z > '2024-01-15T00:00:00+00:00'::timestamptz"
  rows:
    - { id: 1, amount: "2.25", grade: B, from_z: "2024-01-01T00:00:00.000000Z", thru_z: infinity, in_z: "2024-01-01T00:00:00.000000Z", out_z: "2024-02-01T00:00:00.000000Z" }
  roundTrips: 1
