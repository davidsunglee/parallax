model: models/predicate-traversal.yaml
tags: [m-predicate, relationship, to-one, traversal, m-dialect, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Leash
    predicate:
      eq: {path: parallax.compatibility.Leash.collar.pet.name, value: Rex}
then:
  statements:
  - sql: {postgres: 'select t0.id, t0.collar_id from traversal_leash t0 left join traversal_collar t1 on t1.id = t0.collar_id left join traversal_pet t2 on t2.id = t1.pet_id where t2.name = ?', mariadb: 'select t0.id, t0.collar_id from traversal_leash t0 left join traversal_collar t1 on t1.id = t0.collar_id left join traversal_pet t2 on t2.id = t1.pet_id where t2.name = ?'}
    binds: [Rex]
  referenceSql: select id, collar_id from traversal_leash where collar_id in (select id from traversal_collar where pet_id in (select id from traversal_pet where name = 'Rex'))
  rows:
  - {id: 20, collar_id: 10}
  databaseCalls: 1
