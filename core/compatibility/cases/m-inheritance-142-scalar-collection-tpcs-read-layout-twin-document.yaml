# Document half of the table-per-concrete-subtype scalar collection read proof:
# each branch's Structured Column carries its own collections. Its twin authors the
# same read under Columns.
model: models/scalar-collection-lifecycle-layout-twin-document.yaml
tags: [m-inheritance, m-storage-layout, m-document-codec, m-sql, read, table-per-concrete-subtype, union-all, root, graph, instance-form, json, layout-twin, document-layout, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.TagKit
    predicate:
      "true": {}
    orderBy:
      - attr: parallax.compatibility.TagKit.id
        direction: asc
then:
  statements:
    - sql:
        postgres: select u.id, not u.payload is null, u.payload, u.family_variant from (select t0.id, t0.payload, 'TagDrill' family_variant from tag_drill t0 union all select t0.id, t0.payload, 'TagSaw' family_variant from tag_saw t0) u order by u.id asc
        mariadb: select u.id, not u.payload is null, u.payload, u.family_variant from (select t0.id, t0.payload, 'TagDrill' family_variant from tag_drill t0 union all select t0.id, t0.payload, 'TagSaw' family_variant from tag_saw t0) u order by u.id asc
  graph:
    TagKit:
      - { id: 1, tags: [t], bits: [8, 8], familyVariant: TagDrill }
      - { id: 2, tags: [], blades: [rip], familyVariant: TagSaw }
  roundTrips: 1
