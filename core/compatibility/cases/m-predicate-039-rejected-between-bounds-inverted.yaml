# Negative (m-predicate bound-ordering MUST): a `between` whose bounds are INVERTED
# is refused pre-SQL.
model: models/orders.yaml
tags: [m-predicate, rejected, negative, between, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  objectQuery:
    target: parallax.compatibility.Order
    predicate:
      between:
        attr: parallax.compatibility.Order.price
        lower: "50.75"
        upper: "20.00"
then:
  rejectedRule: between-bounds-inverted
