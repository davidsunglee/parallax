# The CLEAN audit-only example: deep fetch Invoice.lines as of Transaction Time LATEST.
# Single-axis propagation: the child carries `out_z = ?` (bind infinity). Line
# 1000 -> 75 (current), line 1001 -> 25.
model: models/invoice.yaml
tags: [m-navigate, m-object-query, m-temporal-read, temporal, relationship, propagation, audit-only, slice-snapshot-1, slice-managed-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "deep-fetch child level - the Invoice.lines IN-list binds are the distinct invoice ids gathered from the root query result, so the child emissions depend on a query result"
when:
  objectQuery:
    target: parallax.compatibility.Invoice
    predicate:
      all: {}
    temporal:
      transaction-time:
        asOf: latest
    includes:
      - segments:
          - rel: parallax.compatibility.Invoice.lines
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name, t0.in_z, t0.out_z from invoice t0 where t0.out_z = ?
      binds: [infinity]
    - sql:
        postgres: select t0.id, t0.invoice_id, t0.amount, t0.in_z, t0.out_z from invoice_line t0 where t0.invoice_id in (?) and t0.out_z = ?
      binds: [100, infinity]
  graph:
    Invoice:
      - id: 100
        name: INV-100
        txStart: "2024-01-01T00:00:00.000000Z"
        txEnd: infinity
        lines:
          - { id: 1000, invoiceId: 100, amount: "75.00", txStart: "2024-04-01T00:00:00.000000Z", txEnd: infinity }
          - { id: 1001, invoiceId: 100, amount: "25.00", txStart: "2024-01-01T00:00:00.000000Z", txEnd: infinity }
  roundTrips: 2
