# Access-mode setup that fails opens NO boundary (m-db-port *Mapping
# obligations*): the attempt that had already adopted its Model Edition finishes
# `beginFailed`, the read-only callback never runs, and the failure is terminal.
model: models/account.yaml
tags: [m-execution, m-execution-lifecycle, m-api-conformance, slice-snapshot-1]
lane: api-conformance
shape: boundary
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection access-mode setup intent (given.fault, shape:boundary)"
given:
  fault: access-mode-setup-failure
when:
  uow:
    accessMode: read-only
  boundary:
    - action: read
      note: the callback never runs, so this observation never happens
then:
  outcome: boundary-failed
  roundTrips: 0
  executionLifecycle:
    roots:
      - execution: 1
        kind: transaction-invocation
        events:
          - { sequence: 1, activity: 1, parent: null, transactionInvocationStarted: { invocation: outer, accessMode: read-only, retries: 10, isolation: read-committed } }
          - { sequence: 2, activity: 2, parent: 1, transactionAttemptStarted: { edition: account } }
          - { sequence: 3, activity: 3, parent: 2, acquisitionStarted: {} }
          - { sequence: 4, activity: 3, parent: 2, acquisitionFinished: { outcome: acquired } }
          - { sequence: 5, activity: 4, parent: 2, releaseStarted: {} }
          - { sequence: 6, activity: 4, parent: 2, releaseFinished: { cleanup: returned } }
          - { sequence: 7, activity: 2, parent: 1, transactionAttemptFinished: { outcome: beginFailed, attribution: direct } }
          - { sequence: 8, activity: 1, parent: null, transactionInvocationFinished: { outcome: failed, attribution: caused, cause: 2 } }
