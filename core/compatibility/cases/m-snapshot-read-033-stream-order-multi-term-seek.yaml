# The primary key is appended to the Continuation Order ONCE and never twice
# (m-snapshot-read), and a multi-term seek interleaves with the deep-fetch levels
# a page pays `1 + L` for.
#
# The query orders by `active` ascending and then by `Order.id` — the primary key
# itself — descending. A Sort Key already names the key, so nothing is appended
# and the Continuation Order is exactly the two authored terms: an implementation
# that appended unconditionally would order by `active asc, id desc, id asc` and
# seek a third coordinate no page here binds. It is also where the appended
# default is visible as a default rather than a rule: the key carries the
# author's own descending direction, so the last branch of every seek reads
# `t0.id < ?`.
#
# `active` is non-nullable, so a continuing page hoists `t0.active >= ?` ahead of
# the two-branch remainder, and four orders tie on it so the second branch is the
# one that actually advances within the tie group.
#
# Each nonempty page then runs its own item level over the order ids that page
# gathered — including page 1's, whose two roots have no items at all and whose
# level still runs because keys were gathered. Pages of 2 over 6 roots: {5, 3},
# {42, 4} seeking past (false, 3), {2, 1} seeking past (true, 4), then the empty
# terminal root statement seeking past (true, 1), which gathers nothing and so
# runs no level. Three pages of 2 statements plus 1 is 7.
model: models/orders.yaml
tags: [m-snapshot-read, m-object-query, m-deep-fetch, stream, streamed-delivery, orderBy, ordering, to-many, relationship, graph, materialization, slice-snapshot-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "a streamed read's keyset seek - each continuing root statement binds the Continuation Order coordinates of the root the previous page delivered last, and the item level binds the order ids that page's own roots gathered"
when:
  objectQuery:
    target: parallax.compatibility.Order
    predicate:
      all: {}
    orderBy:
      - attr: parallax.compatibility.Order.active
        direction: asc
      - attr: parallax.compatibility.Order.id
        direction: desc
    includes:
      - segments:
          - rel: parallax.compatibility.Order.items
  stream:
    batchSize: 2
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.active parallax_seek_0, t0.id parallax_seek_1 from orders t0 order by t0.active asc, t0.id desc limit ?
        mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.active parallax_seek_0, t0.id parallax_seek_1 from orders t0 order by t0.active asc, t0.id desc limit ?
      binds: [2]
    - sql:
        postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id in (?, ?) order by t0.id desc
        mariadb: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id in (?, ?) order by t0.id desc
      binds: [5, 3]
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.active parallax_seek_0, t0.id parallax_seek_1 from orders t0 where t0.active >= ? and (t0.active > ? or (t0.active = ? and t0.id < ?)) order by t0.active asc, t0.id desc limit ?
        mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.active parallax_seek_0, t0.id parallax_seek_1 from orders t0 where t0.active >= ? and (t0.active > ? or (t0.active = ? and t0.id < ?)) order by t0.active asc, t0.id desc limit ?
      binds: [false, false, false, 3, 2]
    - sql:
        postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id in (?, ?) order by t0.id desc
        mariadb: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id in (?, ?) order by t0.id desc
      binds: [42, 4]
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.active parallax_seek_0, t0.id parallax_seek_1 from orders t0 where t0.active >= ? and (t0.active > ? or (t0.active = ? and t0.id < ?)) order by t0.active asc, t0.id desc limit ?
        mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.active parallax_seek_0, t0.id parallax_seek_1 from orders t0 where t0.active >= ? and (t0.active > ? or (t0.active = ? and t0.id < ?)) order by t0.active asc, t0.id desc limit ?
      binds: [true, true, true, 4, 2]
    - sql:
        postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id in (?, ?) order by t0.id desc
        mariadb: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id in (?, ?) order by t0.id desc
      binds: [2, 1]
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.active parallax_seek_0, t0.id parallax_seek_1 from orders t0 where t0.active >= ? and (t0.active > ? or (t0.active = ? and t0.id < ?)) order by t0.active asc, t0.id desc limit ?
        mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.active parallax_seek_0, t0.id parallax_seek_1 from orders t0 where t0.active >= ? and (t0.active > ? or (t0.active = ? and t0.id < ?)) order by t0.active asc, t0.id desc limit ?
      binds: [true, true, true, 1, 2]
