# The primary key is appended to the Continuation Order ONCE and never twice
# (m-snapshot-read), and a multi-term seek interleaves with the deep-fetch levels
# a page pays `1 + L` for.
model: models/orders.yaml
tags: [m-snapshot-read, m-object-query, m-deep-fetch, stream, streamed-delivery, orderBy, ordering, to-many, relationship, graph, materialization, slice-snapshot-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "a streamed read's keyset seek - each continuing root statement binds the Continuation Order coordinates of the root the previous page delivered last, and the item level binds the order ids that page's own roots gathered"
when:
  objectQuery:
    target: parallax.compatibility.Order
    predicate:
      all: {}
    orderBy:
      - attr: parallax.compatibility.Order.active
        direction: asc
      - attr: parallax.compatibility.Order.id
        direction: desc
    includes:
      - segments:
          - rel: parallax.compatibility.Order.items
  stream:
    batchSize: 2
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.active parallax_seek_0, t0.id parallax_seek_1 from orders t0 order by t0.active asc, t0.id desc limit ?
        mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.active parallax_seek_0, t0.id parallax_seek_1 from orders t0 order by t0.active asc, t0.id desc limit ?
      binds: [3]
    - sql:
        postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id = any(?) order by t0.id desc
        mariadb: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id in (?, ?) order by t0.id desc
      binds: { postgres: [[5, 3]], mariadb: [5, 3] }
    - sql:
        postgres: select u.id, u.name, u.sku, u.qty, u.price, u.active, u.ordered_on, u.parallax_seek_0, u.parallax_seek_1 from ((select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.active parallax_seek_0, t0.id parallax_seek_1 from orders t0 where t0.active >= ? and (t0.active > ? or t0.active is null or (t0.active = ? and t0.id < ?)) order by t0.active asc, t0.id desc limit ?) union all (select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.active parallax_seek_0, t0.id parallax_seek_1 from orders t0 where t0.active is null order by t0.active asc, t0.id desc limit ?)) u order by u.parallax_seek_0 asc, u.parallax_seek_1 desc limit ?
        mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.active parallax_seek_0, t0.id parallax_seek_1 from orders t0 where t0.active >= ? and (t0.active > ? or (t0.active = ? and (t0.id < ? or t0.id is null))) order by t0.active asc, t0.id desc limit ?
      binds: { postgres: [false, false, false, 3, 3, 3, 3], mariadb: [false, false, false, 3, 3] }
    - sql:
        postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id = any(?) order by t0.id desc
        mariadb: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id in (?, ?) order by t0.id desc
      binds: { postgres: [[42, 4]], mariadb: [42, 4] }
    - sql:
        postgres: select u.id, u.name, u.sku, u.qty, u.price, u.active, u.ordered_on, u.parallax_seek_0, u.parallax_seek_1 from ((select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.active parallax_seek_0, t0.id parallax_seek_1 from orders t0 where t0.active >= ? and (t0.active > ? or t0.active is null or (t0.active = ? and t0.id < ?)) order by t0.active asc, t0.id desc limit ?) union all (select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.active parallax_seek_0, t0.id parallax_seek_1 from orders t0 where t0.active is null order by t0.active asc, t0.id desc limit ?)) u order by u.parallax_seek_0 asc, u.parallax_seek_1 desc limit ?
        mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.active parallax_seek_0, t0.id parallax_seek_1 from orders t0 where t0.active >= ? and (t0.active > ? or (t0.active = ? and (t0.id < ? or t0.id is null))) order by t0.active asc, t0.id desc limit ?
      binds: { postgres: [true, true, true, 4, 3, 3, 3], mariadb: [true, true, true, 4, 3] }
    - sql:
        postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id = any(?) order by t0.id desc
        mariadb: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id in (?, ?) order by t0.id desc
      binds: { postgres: [[2, 1]], mariadb: [2, 1] }
  referenceSql: select id, name, sku, qty, price, active, ordered_on from orders
  graph:
    Order:
