# Adding a REQUIRED member to an existing stored shape (m-model-evolution):
# coordinated, for both reasons.
#
# `Ticket.queue` is the same AttributeAdded operation as the nullable addition in
# m-model-evolution-003, classified the other way: rows the earlier edition
# already stored carry no value the later model requires, and no default and
# backfill contract exists yet to supply one, which is
# `DatabaseMigrationRequired`. The caller authors the value, so every previously
# valid insert now omits an input the later model demands, which is
# `AuthoringSurfaceChangeRequired`.
tags: [m-model-evolution, evolution, attribute, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-required-member-v1.yaml
    later: models/evolution-required-member-v2.yaml
then:
  evolution:
    kind: coordinated
    operations:
      [{ kind: AttributeAdded, attribute: parallax.compatibility.Ticket.queue }]
    behavioralImpacts: []
    overlapVisibleOperations: []
    coordinationRequirements:
      - operation: { kind: AttributeAdded, attribute: parallax.compatibility.Ticket.queue }
        reasons: [AuthoringSurfaceChangeRequired, DatabaseMigrationRequired]
