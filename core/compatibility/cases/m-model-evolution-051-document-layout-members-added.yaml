# Adding members under a RELATIONAL DOCUMENT LAYOUT (m-model-evolution): the
# described evolution is the layout's twin.
tags: [m-model-evolution, m-schema-delta, evolution, storage-layout, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-document-members-v1.yaml
    later: models/evolution-document-members-v2.yaml
then:
  evolution:
    kind: unilateral
    operations:
      - kind: AttributeAdded
        attribute: parallax.compatibility.Container.note
      - kind: ValueObjectOccurrenceAdded
        valueObject: parallax.compatibility.Container.origin
    behavioralImpacts: []
    overlapVisibleOperations: []
    coordinationRequirements: []
  schema:
    postgres:
      delta:
        statements: []
        createdIndices: []
    mariadb:
      delta:
        statements: []
        createdIndices: []
