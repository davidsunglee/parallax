# Bitemporal history: the FULL milestone set across both axes, no as-of predicate
# injected on either dimension.
model: models/position.yaml
tags: [m-temporal-read, m-object-query, m-sql, bitemporal, temporal, history, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Position
    predicate:
      eq:
        attr: parallax.compatibility.Position.id
        value: 1
    temporal:
      transaction-time:
        history: {}
      valid-time:
        history: {}
then:
  statements:
    - sql:
        postgres: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ?
      binds: [1]
  referenceSql: select pos_id, acct_num, val, from_z, thru_z, in_z, out_z from position where pos_id = 1
  rows:
    - pos_id: 1
      acct_num: A
      val: "90.00"
      from_z: "2024-01-01T00:00:00.000000Z"
      thru_z: infinity
      in_z: "2024-01-01T00:00:00.000000Z"
      out_z: "2024-04-01T00:00:00.000000Z"
    - pos_id: 1
      acct_num: A
      val: "100.00"
      from_z: "2024-01-01T00:00:00.000000Z"
      thru_z: "2024-06-01T00:00:00.000000Z"
      in_z: "2024-04-01T00:00:00.000000Z"
      out_z: infinity
    - pos_id: 1
      acct_num: A
      val: "200.00"
      from_z: "2024-06-01T00:00:00.000000Z"
      thru_z: infinity
      in_z: "2024-04-01T00:00:00.000000Z"
      out_z: infinity
  roundTrips: 1
