# Transaction A renames order 1, the joined row alone, so neither item row changes,
# and holds the change. Transaction B's key-selecting delete of items of orders named
# Ada runs before A commits. MariaDB reads the selection's joined order with a locking
# read, so the statement waits on order 1, then re-reads it after A's commit and
# selects no item. The statement is the transaction's first, so no read view predates
# A's commit and Repeatable Read raises no conflict.
model: models/orders.yaml
tags: [m-batch-write, m-sql, m-unit-work, isolation, concurrency, predicate-write, readless, relationship, to-one, delete, repeatable-read]
shape: concurrencySuccess
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "two-session isolation witness (when.concurrency)"
given:
  fixtures: true
when:
  uow:
    isolation: repeatable-read
  concurrency:
    rounds:
      - A:
          kind: write
          statements:
            - sql:
                mariadb: update orders set name = ? where id = ?
              binds: [Zed, 1]
          affectedRows: [1]
      - B:
          kind: write
          blocks: true
          statements:
            - sql:
                mariadb: delete from order_item where id in (select t0.id from order_item t0 left join orders t1 on t1.id = t0.order_id where t1.name = ?)
              binds: [Ada]
          affectedRows: [0]
      - A:
          kind: commit
      - B:
          kind: commit
then:
  tableState:
    order_item:
      - { id: 11, order_id: 1, sku: A-100, quantity: 2, shipped_on: null }
      - { id: 12, order_id: 1, sku: B-200, quantity: 1, shipped_on: 2024-02-15 }
      - { id: 21, order_id: 2, sku: A-300, quantity: 4, shipped_on: 2024-02-20 }
      - { id: 421, order_id: 42, sku: A-999, quantity: 3, shipped_on: 2024-03-10 }
      - { id: 422, order_id: 42, sku: B-200, quantity: 5, shipped_on: 2024-02-05 }
