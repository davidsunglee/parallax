model: models/predicate-collections.yaml
tags: [m-batch-write, m-sql, m-unit-work, m-dialect, predicate-write, readless, quantifier, scalar-collection, relationship, to-one, scenario, update, json, slice-snapshot-1]
shape: scenario
given:
  fixtures: true
when:
  scenario:
    - write:
        mutation: amend
        target:
          entity: parallax.compatibility.Basket
          predicate:
            and:
              operands:
                - any: {path: parallax.compatibility.Basket.owner.tags}
                - notEq: {path: parallax.compatibility.Basket.owner.name, value: Ada}
        assignments:
          - { attr: parallax.compatibility.Basket.label, value: kept }
      databaseCalls: 1
      statements:
        - sql:
            postgres: update basket set label = ? where id in (select t0.id from basket t0 left join basket_owner t1 on t1.id = t0.owner_id left join (select t3.id, exists (select 1 from jsonb_array_elements(case when jsonb_typeof(t3.tags) = ? then t3.tags else cast(? as jsonb) end) t2) q0 from basket_owner t3) r0 on r0.id = t1.id where coalesce(r0.q0, false) and t1.name <> ?)
            mariadb: update basket set label = ? where id in (select t0.id from basket t0 left join basket_owner t1 on t1.id = t0.owner_id left join (select t2.id, json_type(json_extract(t2.tags, ?)) = ? and json_length(t2.tags, ?) > ? q0 from basket_owner t2) r0 on r0.id = t1.id where coalesce(r0.q0, false) and t1.name <> ?)
          binds:
            postgres: [kept, array, '[]', Ada]
            mariadb: [kept, $, ARRAY, $, 0, Ada]
then:
  databaseCalls: 1
  tableState:
    basket:
      - id: 1
        label: one
        owner_id: 1
        tags: [urgent, gift]
        scores: [5, 25]
        prices: ["1.50"]
        flags: [true]
        parcels:
          - { sku: a, qty: 2, notes: [x] }
          - { sku: b, qty: 0, notes: [] }
        meta: { labels: [m] }
      - { id: 2, label: two, owner_id: null, tags: [], scores: [], prices: [], flags: [], parcels: [], meta: null }
      - id: 3
        label: three
        owner_id: 2
        tags: [gift]
        scores: [15]
        prices: ["2.00", "3.00"]
        flags: [false]
        parcels:
          - { sku: c, qty: 5, notes: [urgent] }
        meta: { labels: [] }
      - id: 4
        label: kept
        owner_id: 3
        tags: [urgent]
        scores: [0]
        prices: []
        flags: [true, false]
        parcels:
          - { sku: d, qty: 1, notes: [urgent, x] }
        meta: null
