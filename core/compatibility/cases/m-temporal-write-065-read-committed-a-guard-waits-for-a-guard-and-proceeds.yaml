# Transaction A's unchanged-milestone guard rewrites balance 2's row in place without
# changing its in_z, and holds it. Transaction B's own guard of the same milestone
# waits on it and resumes on A's commit. At Read Committed B's statement rechecks the
# new row version, whose in_z still matches, and proceeds.
model: models/balance.yaml
tags: [m-temporal-write, m-opt-lock, m-unit-work, isolation, concurrency, temporal, audit-only, unchanged-milestone, read-committed, slice-snapshot-1]
shape: concurrencySuccess
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "two-session isolation witness (when.concurrency)"
given:
  fixtures: true
when:
  uow:
    concurrency: optimistic
    isolation: read-committed
  concurrency:
    rounds:
      - A:
          kind: read
          statements:
            - sql:
                postgres: select t0.bal_id, t0.acct_num, t0.val, t0.in_z, t0.out_z from balance t0 where t0.bal_id = ? and t0.out_z = ?
              binds: [2, infinity]
          expectRows:
            - { bal_id: 2, acct_num: B, val: "200.00", in_z: "2024-02-01T00:00:00.000000Z", out_z: infinity }
      - B:
          kind: read
          statements:
            - sql:
                postgres: select t0.bal_id, t0.acct_num, t0.val, t0.in_z, t0.out_z from balance t0 where t0.bal_id = ? and t0.out_z = ?
              binds: [2, infinity]
          expectRows:
            - { bal_id: 2, acct_num: B, val: "200.00", in_z: "2024-02-01T00:00:00.000000Z", out_z: infinity }
      - A:
          kind: write
          statements:
            - sql:
                postgres: update balance set in_z = in_z where bal_id = ? and out_z = ? and in_z = ?
              binds: [2, infinity, "2024-02-01T00:00:00.000000Z"]
          affectedRows: [1]
      - B:
          kind: write
          blocks: true
          statements:
            - sql:
                postgres: update balance set in_z = in_z where bal_id = ? and out_z = ? and in_z = ?
              binds: [2, infinity, "2024-02-01T00:00:00.000000Z"]
          affectedRows: [1]
      - A:
          kind: commit
      - B:
          kind: commit
then:
  tableState:
    balance:
      - bal_id: 1
        acct_num: A
        val: "100.00"
        in_z: "2024-01-01T00:00:00.000000Z"
        out_z: "2024-06-01T00:00:00.000000Z"
      - { bal_id: 1, acct_num: A, val: "150.00", in_z: "2024-06-01T00:00:00.000000Z", out_z: infinity }
      - { bal_id: 2, acct_num: B, val: "200.00", in_z: "2024-02-01T00:00:00.000000Z", out_z: infinity }
      - bal_id: 3
        acct_num: C
        val: "50.00"
        in_z: "2024-03-01T00:00:00.000000Z"
        out_z: "2024-08-01T00:00:00.000000Z"
