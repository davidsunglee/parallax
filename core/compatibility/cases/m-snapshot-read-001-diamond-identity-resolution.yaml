# Diamond identity resolution (m-snapshot-read): two include paths reach the SAME
# rows, and the snapshot graph materializes them in 1 + L statements — one node
# per row, referenced from both positions.
model: models/orders.yaml
tags: [m-snapshot-read, m-object-query, m-deep-fetch, to-many, relationship, graph, materialization, slice-snapshot-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "deep-fetch child levels - the Order.items and Order.itemsByShipDate IN-list binds are the distinct order ids gathered from the root query result, so the child emissions depend on a query result"
when:
  objectQuery:
    target: parallax.compatibility.Order
    predicate:
      eq:
        attr: parallax.compatibility.Order.id
        value: 1
    includes:
      - segments:
          - rel: parallax.compatibility.Order.items
      - segments:
          - rel: parallax.compatibility.Order.itemsByShipDate
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.id = ?
      binds: [1]
    - sql:
        postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id = any(?) order by t0.id desc
      binds: [[1]]
    - sql:
        postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id = any(?) order by t0.shipped_on asc
      binds: [[1]]
  referenceSql: select id, name, sku, qty, price, active, ordered_on from orders where id = 1
  graph:
    Order:
      - id: 1
        name: Ada
        sku: A-100
        qty: 5
        price: "10.50"
        active: true
        orderedOn: 2024-01-05
        items:
          - { id: 12, orderId: 1, sku: B-200, quantity: 1, shippedOn: 2024-02-15 }
          - { id: 11, orderId: 1, sku: A-100, quantity: 2, shippedOn: null }
        itemsByShipDate:
          - { id: 12, orderId: 1, sku: B-200, quantity: 1, shippedOn: 2024-02-15 }
          - { id: 11, orderId: 1, sku: A-100, quantity: 2, shippedOn: null }
  roundTrips: 3
