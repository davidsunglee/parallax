# Relationship CARDINALITY (m-model-evolution): the boundary is the result shape,
# not the cardinality name.
tags: [m-model-evolution, evolution, relationship, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-relationship-cardinality-v1.yaml
    later: models/evolution-relationship-cardinality-v2.yaml
then:
  evolution:
    kind: coordinated
    operations:
      - kind: RelationshipAltered
        relationship: parallax.compatibility.Folder.badge
        deltas:
          - kind: CardinalityChanged
            earlier: one-to-one
            later: many-to-one
      - kind: RelationshipAltered
        relationship: parallax.compatibility.Folder.items
        deltas:
          - kind: CardinalityChanged
            earlier: many-to-one
            later: one-to-many
    behavioralImpacts: []
    overlapVisibleOperations: []
    coordinationRequirements:
      - operation:
          kind: RelationshipAltered
          relationship: parallax.compatibility.Folder.items
          deltas:
            - kind: CardinalityChanged
              earlier: many-to-one
              later: one-to-many
        reasons:
          - AuthoringSurfaceChangeRequired
