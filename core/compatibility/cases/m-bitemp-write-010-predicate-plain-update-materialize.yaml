# Predicate-selected PLAIN bitemporal UPDATE materializes per resolved row to a
# Transaction-Time close + a Valid-Time timeline split (m-bitemp-write + m-opt-lock, ADR 0014).
model: models/position.yaml
tags: [m-bitemp-write, m-opt-lock, m-sql, m-unit-work, bitemporal, temporal, materialize, predicate-write, scenario, slice-snapshot-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "predicate write materializes per-row from a resolving read - per-row binds (observed version / in_z / matched keys) depend on the query result"
when:
  uow:
    concurrency: optimistic
  scenario:
    - objectQuery:
        target: parallax.compatibility.Position
        predicate:
          and:
            operands:
              - eq:
                  attr: parallax.compatibility.Position.id
                  value: 1
              - eq:
                  attr: parallax.compatibility.Position.value
                  value: "200.00"
        temporal:
          transaction-time:
            asOf: latest
          valid-time:
            asOf: latest
      roundTrips: 1
      statements:
        - sql:
            postgres: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? and t0.val = ? and t0.thru_z = ? and t0.out_z = ?
          binds: [1, "200.00", infinity, infinity]
      referenceSql: select pos_id, acct_num, val, from_z, thru_z, in_z, out_z from position where pos_id = 1 and val = 200.00 and thru_z = 'infinity'::timestamptz and out_z = 'infinity'::timestamptz
      expectRows:
        - { pos_id: 1, acct_num: A, val: "200.00", from_z: "2024-06-01T00:00:00.000000Z", thru_z: infinity, in_z: "2024-04-01T00:00:00.000000Z", out_z: infinity }
    - write:
        mutation: update
        target:
          entity: parallax.compatibility.Position
          predicate:
            and:
              operands:
                - { eq: { attr: parallax.compatibility.Position.id, value: 1 } }
                - { eq: { attr: parallax.compatibility.Position.value, value: "200.00" } }
        assignments:
          - { attr: parallax.compatibility.Position.value, value: "300.00" }
        at: "2024-10-01T00:00:00.000000Z"
        validFrom: "2024-07-01T00:00:00.000000Z"
      roundTrips: 3
      statements:
        - sql:
            postgres: update position set out_z = ? where pos_id = ? and thru_z = ? and out_z = ? and in_z = ?
          binds: ["2024-10-01T00:00:00.000000Z", 1, infinity, infinity, "2024-04-01T00:00:00.000000Z"]
        - sql:
            postgres: insert into position(pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
          binds: [1, A, "200.00", "2024-06-01T00:00:00.000000Z", "2024-07-01T00:00:00.000000Z", "2024-10-01T00:00:00.000000Z", infinity]
        - sql:
            postgres: insert into position(pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
          binds: [1, A, "300.00", "2024-07-01T00:00:00.000000Z", infinity, "2024-10-01T00:00:00.000000Z", infinity]
    - objectQuery:
        target: parallax.compatibility.Position
        predicate:
          eq:
            attr: parallax.compatibility.Position.value
            value: "300.00"
        temporal:
          transaction-time:
            asOf: latest
          valid-time:
            asOf: latest
      roundTrips: 1
      statements:
        - sql:
            postgres: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.val = ? and t0.thru_z = ? and t0.out_z = ?
          binds: ["300.00", infinity, infinity]
      referenceSql: select pos_id, acct_num, val, from_z, thru_z, in_z, out_z from position where val = 300.00 and thru_z = 'infinity'::timestamptz and out_z = 'infinity'::timestamptz
      expectRows:
        - { pos_id: 1, acct_num: A, val: "300.00", from_z: "2024-07-01T00:00:00.000000Z", thru_z: infinity, in_z: "2024-10-01T00:00:00.000000Z", out_z: infinity }
then:
  roundTrips: 5
