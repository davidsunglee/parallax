# Two EQUIVALENT path-root guards over one relationship deduplicate to a single hop
# (m-deep-fetch, m-inheritance).
#
# The read targets the abstract root Animal, so its result set is every animal, and
# both paths guard the SAME relationship `Animal.owner` at the path ROOT: one spells
# the guard `to: [Pet]`, the other `to: [Cat, Dog]`. Both resolve to the identical
# source set {Cat, Dog}, so they are ONE hop — `1 + L` = 2 statements, and the child
# level's IN list carries only the owner ids gathered from the Cat and Dog roots
# (10, 11), never Carol's 12. This is the semantic distinction the case pins down:
# hop identity at the ROOT position keys on the RESOLVED SOURCE SET, deliberately
# unlike a segment narrow, whose identity keys on whether a narrow was AUTHORED.
# A root guard also creates NO view of its own — Rex, Fido, and Whiskers each carry
# the ORDINARY `owner` view (there is no `owner[Cat,Dog]` key anywhere), while the
# unguarded WildBoar Tusker carries no `owner` key at all: an excluded root never
# participated in the path, which is not the same observation as having no owner.
model: models/animal.yaml
tags: [m-deep-fetch, m-inheritance, m-predicate, m-object-query, m-sql, table-per-hierarchy, narrow, deep-fetch, familyVariant, slice-snapshot-1, slice-managed-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "deep-fetch child level - the guarded owner hop binds its person-table IN-list from the owner ids gathered from the Cat and Dog rows of the root query result, so the child emission depends on a query result"
when:
  objectQuery:
    target: parallax.compatibility.Animal
    predicate:
      all: {}
    includes:
      - appliesTo:
          - parallax.compatibility.Cat
          - parallax.compatibility.Dog
        segments:
          - rel: parallax.compatibility.Animal.owner
      - appliesTo:
          - parallax.compatibility.Pet
        segments:
          - rel: parallax.compatibility.Animal.owner
then:
  statements:
    - sql:
        postgres: select t0.id, t0.kind, t0.name, t0.owner_id, t0.license_id, t0.indoor, t0.bark_volume, t0.tusk_length from animal t0
    - sql:
        postgres: select t0.id, t0.name from person t0 where t0.id in (?, ?)
      binds: [10, 11]
  referenceSql: select id, kind, name, owner_id, license_id, indoor, bark_volume, tusk_length from animal
  graph:
    Animal:
      - id: 1
        name: Rex
        ownerId: 10
        licenseId: L-100
        barkVolume: 7
        indoor: null
        tuskLength: null
        familyVariant: Dog
        owner: { id: 10, name: Alice }
      - id: 2
        name: Fido
        ownerId: 11
        licenseId: L-101
        barkVolume: 3
        indoor: null
        tuskLength: null
        familyVariant: Dog
        owner: { id: 11, name: Bob }
      - id: 3
        name: Whiskers
        ownerId: 10
        licenseId: L-200
        barkVolume: null
        indoor: true
        tuskLength: null
        familyVariant: Cat
        owner: { id: 10, name: Alice }
      - id: 4
        name: Tusker
        ownerId: 12
        licenseId: null
        barkVolume: null
        indoor: null
        tuskLength: 12.50
        familyVariant: WildBoar
  roundTrips: 2
