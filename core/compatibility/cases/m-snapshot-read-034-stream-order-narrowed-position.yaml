# A streamed read's Sort Keys are measured against the NARROWED position while
# its primary key comes from the family root (m-snapshot-read, m-object-query's
# positional rule, m-inheritance).
model: models/animal.yaml
tags: [m-snapshot-read, m-object-query, m-inheritance, m-sql, table-per-hierarchy, narrow, stream, streamed-delivery, orderBy, ordering, nullable, familyVariant, graph, materialization, slice-snapshot-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "a streamed read's keyset seek - each continuing root statement binds the Continuation Order coordinates of the root the previous page delivered last, so the emissions depend on a query result even though the read declares no includes"
when:
  objectQuery:
    target: parallax.compatibility.Animal
    predicate:
      all: {}
    narrowTo:
      - parallax.compatibility.Dog
    orderBy:
      - attr: parallax.compatibility.Dog.barkVolume
        direction: desc
  stream:
    batchSize: 1
then:
  statements:
    - sql:
        postgres: select t0.id, t0.kind, t0.name, t0.owner_id, t0.license_id, t0.bark_volume, t0.bark_volume parallax_seek_0, t0.id parallax_seek_1 from animal t0 where t0.kind = ? order by t0.bark_volume desc nulls last, t0.id asc limit ?
      binds: [dog, 2]
    - sql:
        postgres: select u.id, u.kind, u.name, u.owner_id, u.license_id, u.bark_volume, u.parallax_seek_0, u.parallax_seek_1 from ((select t0.id, t0.kind, t0.name, t0.owner_id, t0.license_id, t0.bark_volume, t0.bark_volume parallax_seek_0, t0.id parallax_seek_1 from animal t0 where t0.bark_volume <= ? and (t0.bark_volume < ? or t0.bark_volume is null or (t0.bark_volume = ? and (t0.id > ? or t0.id is null))) and t0.kind = ? order by t0.bark_volume desc nulls last, t0.id asc limit ?) union all (select t0.id, t0.kind, t0.name, t0.owner_id, t0.license_id, t0.bark_volume, t0.bark_volume parallax_seek_0, t0.id parallax_seek_1 from animal t0 where t0.bark_volume is null and t0.kind = ? order by t0.bark_volume desc nulls last, t0.id asc limit ?)) u order by u.parallax_seek_0 desc nulls last, u.parallax_seek_1 asc limit ?
      binds: [7, 7, 7, 1, "dog", 2, "dog", 2, 2]
  referenceSql: select id, kind, name, owner_id, license_id, bark_volume from animal where kind = 'dog'
  graph:
    Animal:
      - id: 1
        name: Rex
        ownerId: 10
        licenseId: L-100
        barkVolume: 7
        familyVariant: Dog
      - id: 2
        name: Fido
        ownerId: 11
        licenseId: L-101
        barkVolume: 3
        familyVariant: Dog
  roundTrips: 2
