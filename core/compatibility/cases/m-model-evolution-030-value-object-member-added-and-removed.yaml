# Value Object LEAF addition and removal (m-model-evolution): no rename is
# inferred, and the addition boundary is the leaf's own nullability.
tags: [m-model-evolution, evolution, value-object, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-vo-member-v1.yaml
    later: models/evolution-vo-member-v2.yaml
then:
  evolution:
    kind: coordinated
    operations:
      - kind: ValueObjectAttributeAdded
        valueObjectAttribute: parallax.compatibility.Consignment.origin.postcode
      - kind: ValueObjectAttributeRemoved
        valueObjectAttribute: parallax.compatibility.Consignment.origin.region
      - kind: ValueObjectAttributeAdded
        valueObjectAttribute: parallax.compatibility.Consignment.origin.tier
    behavioralImpacts: []
    overlapVisibleOperations: []
    coordinationRequirements:
      - operation:
          kind: ValueObjectAttributeRemoved
          valueObjectAttribute: parallax.compatibility.Consignment.origin.region
        reasons:
          - AuthoringSurfaceChangeRequired
          - DatabaseMigrationRequired
      - operation:
          kind: ValueObjectAttributeAdded
          valueObjectAttribute: parallax.compatibility.Consignment.origin.tier
        reasons:
          - AuthoringSurfaceChangeRequired
          - DatabaseMigrationRequired
