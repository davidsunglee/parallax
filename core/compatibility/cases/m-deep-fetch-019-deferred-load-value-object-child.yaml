# Deferred load x value object: the LIFECYCLE-ACTION analogue of m-deep-fetch-018.
model: models/customer.yaml
tags: [m-deep-fetch, m-value-object, relationship, to-many, deferred-load, materialization, json, slice-managed-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "deferred load - the Customer.locations child IN-list binds are the distinct parent keys gathered from step 0's find result, so the child emission depends on a query result"
when:
  scenario:
    - objectQuery:
        target: parallax.compatibility.Customer
        predicate:
          eq:
            attr: parallax.compatibility.Customer.id
            value: 1
      roundTrips: 1
      note: managed find materializes the owner WITH its address Document slot — INSTANCE-FORM (id, name, then address presence/value pair last)
      statements:
        - sql:
            postgres: select t0.id, t0.name, not t0.address is null, t0.address from customer t0 where t0.id = ?
            mariadb: select t0.id, t0.name, not t0.address is null, t0.address from customer t0 where t0.id = ?
          binds: [1]
      expectRows:
        - id: 1
          name: Ada
          address:
            street: 1 Park Ave
            city: Oslo
            geo:
              country: "NO"
              elevation: 10.5
              point: { lat: 59.9, lon: 10.7 }
            phones:
              - { type: home, number: '555-1234' }
              - { type: work, number: '555-9999' }
    - action: load
      "on": 0
      path: locations
      roundTrips: 1
      note: deferred load of the VO-bearing child Location — INSTANCE-FORM, projects Location's own list (id, customer_id, label, then address presence/value pair); each row's address decodes with LOCATION's descriptor
      statements:
        - sql:
            postgres: select t0.id, t0.customer_id, t0.label, not t0.address is null, t0.address from location t0 where t0.customer_id in (?) order by t0.id asc
            mariadb: select t0.id, t0.customer_id, t0.label, not t0.address is null, t0.address from location t0 where t0.customer_id in (?) order by t0.id asc
          binds: [1]
      expectRows:
        - id: 100
          customer_id: 1
          label: HQ
          address:
            street: 1 Harbour Way
            city: Oslo
            geo:
              country: "NO"
              elevation: 12.0
              point: { lat: 59.91, lon: 10.75 }
            phones:
              - { type: work, number: '555-0100' }
        - id: 101
          customer_id: 1
          label: Depot
          address: null
then:
  roundTrips: 2
