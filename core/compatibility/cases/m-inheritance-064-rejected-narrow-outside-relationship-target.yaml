# REJECTED: narrowing a relationship past its target's effective set
# (m-navigate, m-predicate, m-inheritance, resolved Q10).
model: models/animal.yaml
tags: [m-navigate, m-predicate, m-inheritance, table-per-hierarchy, narrow, rejected, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  objectQuery:
    target: parallax.compatibility.Person
    predicate:
      any:
        path: parallax.compatibility.Person.pets
        where:
          narrow:
            to:
              - parallax.compatibility.WildBoar
            operand:
              "true": {}
then:
  rejectedRule: narrow-outside-relationship-target
