# A RENAME is one removal and one addition (m-model-evolution), in identity order.
tags: [m-model-evolution, evolution, attribute, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-rename-v1.yaml
    later: models/evolution-rename-v2.yaml
then:
  evolution:
    kind: coordinated
    operations:
      - { kind: AttributeAdded, attribute: parallax.compatibility.Label.caption }
      - { kind: AttributeRemoved, attribute: parallax.compatibility.Label.label }
    behavioralImpacts: []
    overlapVisibleOperations: []
    coordinationRequirements:
      - operation: { kind: AttributeAdded, attribute: parallax.compatibility.Label.caption }
        reasons: [AuthoringSurfaceChangeRequired, DatabaseMigrationRequired]
      - operation: { kind: AttributeRemoved, attribute: parallax.compatibility.Label.label }
        reasons: [AuthoringSurfaceChangeRequired, DatabaseMigrationRequired]
