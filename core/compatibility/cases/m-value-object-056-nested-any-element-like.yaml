# valueObject to-many string match: nestedLike through a `many` segment is ANY-ELEMENT,
# and its `value` stays a raw pattern (m-op-algebra nested string predicates +
# any-element, m-sql, m-dialect array-traversal form). Postgres golden only — a
# non-equality element predicate is outside MariaDB's containment scope (m-dialect,
# "Scope of the containment golden").
#
# nestedLike(Customer.address.phones.number, '555-0%') matches a row iff SOME element's
# number matches the pattern, whose `%` is an authored wildcard passed through
# unescaped — the contrast with the affix forms, which escape their literal and place
# the wildcards themselves. Only Nils (7) carries 555-0000. Omar (9) is the trap: his
# `phones` is the JSON scalar STRING "555-0000", which the pattern would match
# character for character, and it must NOT match because a non-array `phones` has no
# elements — the array-type guard collapses it, along with the JSON null (8) and the
# object (10).
#
# The oracle guards with an outer `jsonb_typeof` instead of the golden's inline `case`
# and reads the element field with `->>` instead of jsonb_extract_path_text.
model: models/customer.yaml
tags: [m-value-object, m-op-algebra, m-sql, m-dialect, nested, json, to-many, any-element, string, like, array-traversal, slice-snapshot-1, slice-managed-1]
shape: read
when:
  targetEntity: Customer
  operation:
    nestedLike: { path: Customer.address.phones.number, value: '555-0%' }
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name from customer t0 where exists (select 1 from jsonb_array_elements(case when jsonb_typeof(jsonb_extract_path(t0.address, ?)) = ? then jsonb_extract_path(t0.address, ?) else cast(? as jsonb) end) t1 where jsonb_extract_path_text(t1.value, ?) like ?)
      binds: [phones, 'array', phones, '[]', number, '555-0%']
  referenceSql:
    postgres: select id, name from customer where jsonb_typeof(address -> 'phones') = 'array' and exists (select 1 from jsonb_array_elements(address -> 'phones') e where e.value ->> 'number' like '555-0%')
  rows:
    - { id: 7, name: Nils }
  roundTrips: 1
