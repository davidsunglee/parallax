# A caller reviewed account 2 at version 1 before a peer moved it to version 2. A
# transaction that starts afterward reads version 2 and writes from it; Repeatable
# Read raises nothing, because the reviewed revision predates the snapshot.
model: models/account.yaml
tags: [m-db-error, m-opt-lock, m-unit-work, isolation, concurrency, repeatable-read, slice-snapshot-1]
shape: concurrencySuccess
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "two-session isolation witness (when.concurrency)"
given:
  fixtures: true
when:
  uow:
    concurrency: optimistic
    isolation: repeatable-read
  concurrency:
    rounds:
      - B:
          kind: write
          statements:
            - sql:
                postgres: update account set balance = ?, version = ? where id = ? and version = ?
                mariadb: update account set balance = ?, version = ? where id = ? and version = ?
              binds: ["999.00", 2, 2, 1]
          affectedRows: [1]
      - B:
          kind: commit
      - A:
          kind: read
          statements:
            - sql:
                postgres: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.id = ?
                mariadb: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.id = ?
              binds: [2]
          expectRows:
            - { id: 2, owner: Linus, balance: "999.00", version: 2 }
      - A:
          kind: write
          statements:
            - sql:
                postgres: update account set balance = ?, version = ? where id = ? and version = ?
                mariadb: update account set balance = ?, version = ? where id = ? and version = ?
              binds: ["300.00", 3, 2, 2]
          affectedRows: [1]
      - A:
          kind: commit
then:
  tableState:
    account:
      - { id: 1, owner: Ada, balance: "100.00", version: 1 }
      - { id: 2, owner: Linus, balance: "300.00", version: 3 }
      - { id: 3, owner: Grace, balance: "10.00", version: 1 }
