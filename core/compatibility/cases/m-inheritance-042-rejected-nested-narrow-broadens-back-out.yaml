# Negative (m-inheritance, m-predicate): a NESTED narrow broadens back out of the
# position the enclosing narrow established.
model: models/animal.yaml
tags: [m-inheritance, m-predicate, m-object-query, rejected, negative, narrow, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  objectQuery:
    target: parallax.compatibility.Animal
    predicate:
      narrow:
        to:
          - parallax.compatibility.Cat
        operand:
          all: {}
    narrowTo:
      - parallax.compatibility.Dog
then:
  rejectedRule: narrow-outside-position
