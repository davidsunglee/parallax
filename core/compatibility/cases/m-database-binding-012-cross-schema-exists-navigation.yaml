# An existence predicate across qualifiers: the case binding places the line
# items in their own schema, so the correlated EXISTS reads `px_crm.order_item`
# while the orders it filters stay in `px`. Orders 1, 2, and 42 have items.
model: models/orders.yaml
binding:
  postgres:
    format_version: 1
    backend: postgres
    default: { schema: px }
    entities:
      parallax.compatibility.OrderItem: { schema: px_crm }
  mariadb:
    format_version: 1
    backend: mariadb
    default: { database: px }
    entities:
      parallax.compatibility.OrderItem: { database: px_crm }
tags: [m-database-binding, m-navigate, m-sql, exists, relationship, binding, slice-snapshot-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Order
    predicate:
      any:
        path: parallax.compatibility.Order.items
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from px.orders t0 where exists (select 1 from px_crm.order_item t1 where t1.order_id = t0.id)
        mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from px.orders t0 where exists (select 1 from px_crm.order_item t1 where t1.order_id = t0.id)
  referenceSql: select id, name, sku, qty, price, active, ordered_on from px.orders where id in (select order_id from px_crm.order_item)
  rows:
    - { id: 1, name: Ada, sku: A-100, qty: 5, price: "10.50", active: true, ordered_on: 2024-01-05 }
    - { id: 2, name: Linus, sku: B-200, qty: 10, price: "20.00", active: true, ordered_on: 2024-02-10 }
    - { id: 42, name: Grace, sku: A-999, qty: 30, price: "99.99", active: true, ordered_on: 2024-06-30 }
  databaseCalls: 1
