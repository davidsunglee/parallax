# Every root of a streamed milestone set stands at its OWN edge pin, and the
# Continuation Order carries the whole edge — every declared axis start, Valid
# Time before Transaction Time (m-snapshot-read *Streamed delivery*).
model: models/position.yaml
tags: [m-snapshot-read, m-object-query, m-temporal-read, stream, streamed-delivery, temporal, history, bitemporal, both-axes, edge-pinned, graph, slice-snapshot-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "a streamed read's keyset seek - each continuing root statement binds the Continuation Order coordinates of the root the previous page delivered last, which for a milestone-set read are that milestone's own key and both axis starts"
when:
  objectQuery:
    target: parallax.compatibility.Position
    predicate:
      eq:
        attr: parallax.compatibility.Position.id
        value: 1
    temporal:
      transaction-time:
        history: {}
      valid-time:
        history: {}
  stream:
    batchSize: 1
then:
  statements:
    - sql:
        postgres: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z, t0.pos_id parallax_seek_0, t0.from_z parallax_seek_1, t0.in_z parallax_seek_2 from position t0 where t0.pos_id = ? order by t0.pos_id asc, t0.from_z asc, t0.in_z asc limit ?
        mariadb: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z, t0.pos_id parallax_seek_0, t0.from_z parallax_seek_1, t0.in_z parallax_seek_2 from position t0 where t0.pos_id = ? order by t0.pos_id asc, t0.from_z asc, t0.in_z asc limit ?
      binds: [1, 2]
    - sql:
        postgres: select u.pos_id, u.acct_num, u.val, u.from_z, u.thru_z, u.in_z, u.out_z, u.parallax_seek_0, u.parallax_seek_1, u.parallax_seek_2 from ((select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z, t0.pos_id parallax_seek_0, t0.from_z parallax_seek_1, t0.in_z parallax_seek_2 from position t0 where t0.pos_id = ? and t0.pos_id >= ? and (t0.pos_id > ? or t0.pos_id is null or (t0.pos_id = ? and (t0.from_z > ? or t0.from_z is null)) or (t0.pos_id = ? and t0.from_z = ? and (t0.in_z > ? or t0.in_z is null))) order by t0.pos_id asc, t0.from_z asc, t0.in_z asc limit ?) union all (select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z, t0.pos_id parallax_seek_0, t0.from_z parallax_seek_1, t0.in_z parallax_seek_2 from position t0 where t0.pos_id = ? and t0.pos_id is null order by t0.pos_id asc, t0.from_z asc, t0.in_z asc limit ?)) u order by u.parallax_seek_0 asc, u.parallax_seek_1 asc, u.parallax_seek_2 asc limit ?
        mariadb: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z, t0.pos_id parallax_seek_0, t0.from_z parallax_seek_1, t0.in_z parallax_seek_2 from position t0 where t0.pos_id = ? and t0.pos_id >= ? and (t0.pos_id > ? or (t0.pos_id = ? and t0.from_z > ?) or (t0.pos_id = ? and t0.from_z = ? and t0.in_z > ?)) order by t0.pos_id asc, t0.from_z asc, t0.in_z asc limit ?
      binds: { postgres: [1, 1, 1, 1, "2024-01-01T00:00:00.000000Z", 1, "2024-01-01T00:00:00.000000Z", "2024-01-01T00:00:00.000000Z", 2, 1, 2, 2], mariadb: [1, 1, 1, 1, "2024-01-01T00:00:00.000000Z", 1, "2024-01-01T00:00:00.000000Z", "2024-01-01T00:00:00.000000Z", 2] }
    - sql:
        postgres: select u.pos_id, u.acct_num, u.val, u.from_z, u.thru_z, u.in_z, u.out_z, u.parallax_seek_0, u.parallax_seek_1, u.parallax_seek_2 from ((select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z, t0.pos_id parallax_seek_0, t0.from_z parallax_seek_1, t0.in_z parallax_seek_2 from position t0 where t0.pos_id = ? and t0.pos_id >= ? and (t0.pos_id > ? or t0.pos_id is null or (t0.pos_id = ? and (t0.from_z > ? or t0.from_z is null)) or (t0.pos_id = ? and t0.from_z = ? and (t0.in_z > ? or t0.in_z is null))) order by t0.pos_id asc, t0.from_z asc, t0.in_z asc limit ?) union all (select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z, t0.pos_id parallax_seek_0, t0.from_z parallax_seek_1, t0.in_z parallax_seek_2 from position t0 where t0.pos_id = ? and t0.pos_id is null order by t0.pos_id asc, t0.from_z asc, t0.in_z asc limit ?)) u order by u.parallax_seek_0 asc, u.parallax_seek_1 asc, u.parallax_seek_2 asc limit ?
        mariadb: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z, t0.pos_id parallax_seek_0, t0.from_z parallax_seek_1, t0.in_z parallax_seek_2 from position t0 where t0.pos_id = ? and t0.pos_id >= ? and (t0.pos_id > ? or (t0.pos_id = ? and t0.from_z > ?) or (t0.pos_id = ? and t0.from_z = ? and t0.in_z > ?)) order by t0.pos_id asc, t0.from_z asc, t0.in_z asc limit ?
      binds: { postgres: [1, 1, 1, 1, "2024-01-01T00:00:00.000000Z", 1, "2024-01-01T00:00:00.000000Z", "2024-04-01T00:00:00.000000Z", 2, 1, 2, 2], mariadb: [1, 1, 1, 1, "2024-01-01T00:00:00.000000Z", 1, "2024-01-01T00:00:00.000000Z", "2024-04-01T00:00:00.000000Z", 2] }
  referenceSql: select pos_id, acct_num, val, from_z, thru_z, in_z, out_z from position where pos_id = 1
  graphs:
    - pin: { valid-time: "2024-01-01T00:00:00.000000Z", transaction-time: "2024-01-01T00:00:00.000000Z" }
      graph:
        Position:
          - { id: 1, acctNum: A, value: "90.00", validStart: "2024-01-01T00:00:00.000000Z", validEnd: infinity, txStart: "2024-01-01T00:00:00.000000Z", txEnd: "2024-04-01T00:00:00.000000Z" }
