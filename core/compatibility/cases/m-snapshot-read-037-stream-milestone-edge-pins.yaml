# Every root of a streamed milestone set stands at its OWN edge pin, and the
# Continuation Order carries the whole edge — every declared axis start, Valid
# Time before Transaction Time (m-snapshot-read *Streamed delivery*).
#
# Position 1 is one business key at THREE bitemporal rectangles (models/position.yaml):
# the superseded belief R1 (valid [2024-01-01, infinity), transaction [2024-01-01,
# 2024-04-01)), the rectangle-split head R2 (valid [2024-01-01, 2024-06-01),
# transaction [2024-04-01, infinity)), and the corrected R3 (valid [2024-06-01,
# infinity), transaction [2024-04-01, infinity)). Scanning BOTH axes returns all
# three with no as-of predicate injected, so the key is constant across the whole
# result and the edge is the only thing separating the roots.
#
# That makes this the case where the edge's own multi-term seek is exercised: R1
# and R2 TIE on `from_z` and part on `in_z`, so page 3 seeks the deepest branch of
# the lexicographic remainder — `pos_id = ? and from_z = ? and in_z > ?` — while
# page 4 parts one level higher, on `from_z` alone. Ordering by the key alone
# would deliver ONE root; ordering by the key and Transaction Time alone would tie
# R2 with R3, which share `in_z`.
#
# The delivery is three full pages at `batchSize: 1` plus the terminal empty root
# statement. `then.graphs` states three PAIRWISE DISJOINT bitemporal pins, one per
# published root, each naming that milestone's own from-instant on both axes and
# never the coordinates of any read — the same partition m-temporal-read-016's
# whole-result read of this query resolves into rows.
model: models/position.yaml
tags: [m-snapshot-read, m-object-query, m-temporal-read, stream, streamed-delivery, temporal, history, bitemporal, both-axes, edge-pinned, graph, slice-snapshot-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "a streamed read's keyset seek - each continuing root statement binds the Continuation Order coordinates of the root the previous page delivered last, which for a milestone-set read are that milestone's own key and both axis starts"
when:
  objectQuery:
    target: parallax.compatibility.Position
    predicate:
      eq:
        attr: parallax.compatibility.Position.id
        value: 1
    temporal:
      transaction-time:
        history: {}
      valid-time:
        history: {}
  stream:
    batchSize: 1
then:
  statements:
    - sql:
        postgres: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? order by t0.pos_id asc, t0.from_z asc, t0.in_z asc limit ?
        mariadb: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? order by t0.pos_id asc, t0.from_z asc, t0.in_z asc limit ?
      binds: [1, 1]
    - sql:
        postgres: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? and t0.pos_id >= ? and (t0.pos_id > ? or (t0.pos_id = ? and t0.from_z > ?) or (t0.pos_id = ? and t0.from_z = ? and t0.in_z > ?)) order by t0.pos_id asc, t0.from_z asc, t0.in_z asc limit ?
        mariadb: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? and t0.pos_id >= ? and (t0.pos_id > ? or (t0.pos_id = ? and t0.from_z > ?) or (t0.pos_id = ? and t0.from_z = ? and t0.in_z > ?)) order by t0.pos_id asc, t0.from_z asc, t0.in_z asc limit ?
      binds: [1, 1, 1, 1, "2024-01-01T00:00:00.000000Z", 1, "2024-01-01T00:00:00.000000Z", "2024-01-01T00:00:00.000000Z", 1]
    - sql:
        postgres: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? and t0.pos_id >= ? and (t0.pos_id > ? or (t0.pos_id = ? and t0.from_z > ?) or (t0.pos_id = ? and t0.from_z = ? and t0.in_z > ?)) order by t0.pos_id asc, t0.from_z asc, t0.in_z asc limit ?
        mariadb: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? and t0.pos_id >= ? and (t0.pos_id > ? or (t0.pos_id = ? and t0.from_z > ?) or (t0.pos_id = ? and t0.from_z = ? and t0.in_z > ?)) order by t0.pos_id asc, t0.from_z asc, t0.in_z asc limit ?
      binds: [1, 1, 1, 1, "2024-01-01T00:00:00.000000Z", 1, "2024-01-01T00:00:00.000000Z", "2024-04-01T00:00:00.000000Z", 1]
    - sql:
        postgres: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? and t0.pos_id >= ? and (t0.pos_id > ? or (t0.pos_id = ? and t0.from_z > ?) or (t0.pos_id = ? and t0.from_z = ? and t0.in_z > ?)) order by t0.pos_id asc, t0.from_z asc, t0.in_z asc limit ?
        mariadb: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? and t0.pos_id >= ? and (t0.pos_id > ? or (t0.pos_id = ? and t0.from_z > ?) or (t0.pos_id = ? and t0.from_z = ? and t0.in_z > ?)) order by t0.pos_id asc, t0.from_z asc, t0.in_z asc limit ?
      binds: [1, 1, 1, 1, "2024-06-01T00:00:00.000000Z", 1, "2024-06-01T00:00:00.000000Z", "2024-04-01T00:00:00.000000Z", 1]
  referenceSql: select pos_id, acct_num, val, from_z, thru_z, in_z, out_z from position where pos_id = 1
  graphs:
    - pin: { valid-time: "2024-01-01T00:00:00.000000Z", transaction-time: "2024-01-01T00:00:00.000000Z" }
      graph:
        Position:
          - { id: 1, acctNum: A, value: "90.00", validStart: "2024-01-01T00:00:00.000000Z", validEnd: infinity, txStart: "2024-01-01T00:00:00.000000Z", txEnd: "2024-04-01T00:00:00.000000Z" }
    - pin: { valid-time: "2024-01-01T00:00:00.000000Z", transaction-time: "2024-04-01T00:00:00.000000Z" }
      graph:
        Position:
          - { id: 1, acctNum: A, value: "100.00", validStart: "2024-01-01T00:00:00.000000Z", validEnd: "2024-06-01T00:00:00.000000Z", txStart: "2024-04-01T00:00:00.000000Z", txEnd: infinity }
    - pin: { valid-time: "2024-06-01T00:00:00.000000Z", transaction-time: "2024-04-01T00:00:00.000000Z" }
      graph:
        Position:
          - { id: 1, acctNum: A, value: "200.00", validStart: "2024-06-01T00:00:00.000000Z", validEnd: infinity, txStart: "2024-04-01T00:00:00.000000Z", txEnd: infinity }
  roundTrips: 4
