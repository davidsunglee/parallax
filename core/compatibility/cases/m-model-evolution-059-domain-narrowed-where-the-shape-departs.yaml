# Narrowing a member's domain in the edition its shape leaves the position
# (m-model-evolution): the contraction reaches no stored value.
tags: [m-model-evolution, evolution, inheritance, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-departing-domain-v1.yaml
    later: models/evolution-departing-domain-v2.yaml
then:
  evolution:
    kind: coordinated
    operations:
      - kind: AttributeAltered
        attribute: parallax.compatibility.Filed.clerk
        deltas: [{ kind: NullabilityChanged, earlier: true, later: false }]
      - kind: EntityAltered
        entity: parallax.compatibility.Record
        deltas:
          - kind: InheritanceChanged
            earlier:
              role: concrete-subtype
              parent: parallax.compatibility.Filed
              tag: { value: record }
            later:
              role: concrete-subtype
              parent: parallax.compatibility.Registry
              tag: { value: record }
    behavioralImpacts:
      - kind: ValueAdmissibilityChanged
        scope: { attribute: parallax.compatibility.Filed.clerk }
        earlier: { type: string, nullable: true, maxLength: 32 }
        later: { type: string, nullable: false, maxLength: 32 }
        causedBy:
          - kind: AttributeAltered
            attribute: parallax.compatibility.Filed.clerk
            deltas: [{ kind: NullabilityChanged, earlier: true, later: false }]
      - kind: QueryResultMembershipChanged
        scope: { entity: parallax.compatibility.Filed }
        earlier: { concreteEntities: [parallax.compatibility.Record], axes: [] }
        later: { concreteEntities: [], axes: [] }
        causedBy:
          - kind: EntityAltered
            entity: parallax.compatibility.Record
            deltas:
              - kind: InheritanceChanged
                earlier:
                  role: concrete-subtype
                  parent: parallax.compatibility.Filed
                  tag: { value: record }
                later:
                  role: concrete-subtype
                  parent: parallax.compatibility.Registry
                  tag: { value: record }
    overlapVisibleOperations: []
    coordinationRequirements:
      - operation:
          kind: EntityAltered
          entity: parallax.compatibility.Record
          deltas:
            - kind: InheritanceChanged
              earlier:
                role: concrete-subtype
                parent: parallax.compatibility.Filed
                tag: { value: record }
              later:
                role: concrete-subtype
                parent: parallax.compatibility.Registry
                tag: { value: record }
        reasons: [AuthoringSurfaceChangeRequired]
