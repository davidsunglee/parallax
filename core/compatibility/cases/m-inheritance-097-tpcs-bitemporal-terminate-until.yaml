# Table-per-concrete-subtype BITEMPORAL terminateUntil: the inactivation targets the
# subtype's OWN table with NO tag guard (m-inheritance x m-bitemp-write x m-sql).
model: models/rate.yaml
tags: [m-inheritance, m-bitemp-write, m-sql, table-per-concrete-subtype, temporal, bitemporal, write-sequence, terminate-until, rectangle-split, slice-snapshot-1, slice-managed-1]
shape: writeSequence
when:
  uow:
    concurrency: locking
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.LoanRate
      statements: 1
      note: open the original Latest rectangle in the concrete loan_rate table
      rows:
        - { id: 2, amount: "6.75", spread: "1.25" }
      validFrom: "2024-01-01T00:00:00.000000Z"
      at: "2024-01-01T00:00:00.000000Z"
    - mutation: terminateUntil
      entity: parallax.compatibility.LoanRate
      statements: 3
      note: inactivate the original in the concrete table (no tag guard), then chain head + tail (no middle)
      rows:
        - { id: 2 }
      validFrom: "2024-03-01T00:00:00.000000Z"
      at: "2024-02-15T00:00:00.000000Z"
      until: "2024-09-01T00:00:00.000000Z"
then:
  statements:
    - sql:
        postgres: insert into loan_rate(id, amount, spread, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
      binds: [2, "6.75", "1.25", "2024-01-01T00:00:00.000000Z", infinity, "2024-01-01T00:00:00.000000Z", infinity]
    - sql:
        postgres: update loan_rate set out_z = ? where id = ? and thru_z = ? and out_z = ?
      binds: ["2024-02-15T00:00:00.000000Z", 2, infinity, infinity]
    - sql:
        postgres: insert into loan_rate(id, amount, spread, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
      binds: [2, "6.75", "1.25", "2024-01-01T00:00:00.000000Z", "2024-03-01T00:00:00.000000Z", "2024-02-15T00:00:00.000000Z", infinity]
    - sql:
        postgres: insert into loan_rate(id, amount, spread, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
      binds: [2, "6.75", "1.25", "2024-09-01T00:00:00.000000Z", infinity, "2024-02-15T00:00:00.000000Z", infinity]
  tableState:
    loan_rate:
      - id: 2
        amount: "6.75"
        spread: "1.25"
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: infinity
        in_z: "2024-01-01T00:00:00.000000Z"
        out_z: "2024-02-15T00:00:00.000000Z"
      - id: 2
        amount: "6.75"
        spread: "1.25"
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: "2024-03-01T00:00:00.000000Z"
        in_z: "2024-02-15T00:00:00.000000Z"
        out_z: infinity
      - id: 2
        amount: "6.75"
        spread: "1.25"
        from_z: "2024-09-01T00:00:00.000000Z"
        thru_z: infinity
        in_z: "2024-02-15T00:00:00.000000Z"
        out_z: infinity
  roundTrips: 5
