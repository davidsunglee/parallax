# Write sequence: terminateUntil — terminate a bitemporal value for a BOUNDED
# Valid-Time window, leaving the value intact before and after it (rectangle split
# with NO middle).
model: models/position.yaml
tags: [m-bitemp-write, m-sql, bitemporal, temporal, write-sequence, terminate-until, rectangle-split, slice-snapshot-1, slice-managed-1]
shape: writeSequence
when:
  uow:
    concurrency: locking
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.Position
      statements: 1
      note: open the original Latest rectangle [valid inf, transaction inf)
      rows:
        - { id: 1, acctNum: A, value: "100.00" }
      validFrom: "2024-01-01T00:00:00.000000Z"
      at: "2024-01-01T00:00:00.000000Z"
    - mutation: terminateUntil
      entity: parallax.compatibility.Position
      statements: 3
      note: inactivate the original on the Transaction-Time dimension, then chain head + tail (no middle)
      rows:
        - { id: 1 }
      validFrom: "2024-03-01T00:00:00.000000Z"
      at: "2024-02-15T00:00:00.000000Z"
      until: "2024-09-01T00:00:00.000000Z"
then:
  statements:
    - sql:
        postgres: insert into position(pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
        mariadb: insert into `position` (pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
      binds: [1, A, "100.00", "2024-01-01T00:00:00.000000Z", infinity, "2024-01-01T00:00:00.000000Z", infinity]
    - sql:
        postgres: update position set out_z = ? where pos_id = ? and thru_z = ? and out_z = ?
        mariadb: update `position` set out_z = ? where pos_id = ? and thru_z = ? and out_z = ?
      binds: ["2024-02-15T00:00:00.000000Z", 1, infinity, infinity]
    - sql:
        postgres: insert into position(pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
        mariadb: insert into `position` (pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
      binds: [1, A, "100.00", "2024-01-01T00:00:00.000000Z", "2024-03-01T00:00:00.000000Z", "2024-02-15T00:00:00.000000Z", infinity]
    - sql:
        postgres: insert into position(pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
        mariadb: insert into `position` (pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
      binds: [1, A, "100.00", "2024-09-01T00:00:00.000000Z", infinity, "2024-02-15T00:00:00.000000Z", infinity]
  tableState:
    position:
      - pos_id: 1
        acct_num: A
        val: "100.00"
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: infinity
        in_z: "2024-01-01T00:00:00.000000Z"
        out_z: "2024-02-15T00:00:00.000000Z"
      - pos_id: 1
        acct_num: A
        val: "100.00"
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: "2024-03-01T00:00:00.000000Z"
        in_z: "2024-02-15T00:00:00.000000Z"
        out_z: infinity
      - pos_id: 1
        acct_num: A
        val: "100.00"
        from_z: "2024-09-01T00:00:00.000000Z"
        thru_z: infinity
        in_z: "2024-02-15T00:00:00.000000Z"
        out_z: infinity
  roundTrips: 5
