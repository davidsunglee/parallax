# Reading one key at two as-of coordinates leaves TWO independently pinned views, and
# whether a view may be mutated is a property of THAT view rather than of the primary
# key the two share (m-snapshot-read "Closed world": no node is interned beyond its own
# graph, so each find's result is its own pinned view; m-bitemp-write's finite-pin
# contrast then answers per view. m-identity-map states the same invariant for the
# MANAGED lifecycle, where the views are interned objects rather than graphs — that
# slice's own witnesses are m-identity-map-010 / -011, and this case makes no claim
# about them.)
#
# Both steps read Position id 1. Step 0 pins it at the finite Valid-Time instant
# 2024-03-01 with Transaction Time defaulted Latest, materializing the rectangle-split
# head (value 100) — a WRITABLE view, because a finite Valid-Time pin is the retroactive
# correction. Step 1 pins the SAME primary key at the finite Transaction-Time instant
# 2024-02-01, materializing the superseded belief (value 90) — a READ-ONLY view, because
# the Transaction-Time past is never rewritten. The two coordinates resolve to two
# DIFFERENT milestones of one key.
#
# The mutation verb then answers per view, in both directions: step 2 mutates the view
# step 0 produced and is ACCEPTED, and step 3 mutates the view step 1 produced and
# raises `transaction-time-pin-read-only`.
#
# That is the semantic distinction, and it is what m-bitemp-write-015 and -016 cannot
# state: each of those pins ONE view of one key, so each is consistent with an
# implementation holding a single view per primary key whose mutability the most recent
# read decides. Here both views are live at once and disagree, so such an implementation
# fails in one direction or the other — the second read would demote the first view, or
# the first would license the second.
#
# What this case does NOT grade, so that no reader takes it for more: a `mutate` step is
# an in-memory change over a snapshot-read view that emits no DML at all (roundTrips 0,
# as every mutate step in the corpus does) and enrolls the view in no unit of work. No
# write evidence is recorded and none is consumed, so nothing here observes how an
# implementation KEYS the observations its reads record, nor which row a later flush
# would close. The wire-lane pair m-bitemp-write-021 / m-opt-lock-021 grades that a
# close's address is derived from the milestone its write observed; no case in the
# corpus grades the keying itself.
model: models/position.yaml
lane: api-conformance
tags: [m-unit-work, m-snapshot-read, m-bitemp-write, m-temporal-read, bitemporal, temporal, as-of, scenario, slice-snapshot-1]
shape: scenario
when:
  scenario:
    - targetEntity: Position
      find:
        asOf:
          operand:
            eq:
              attr: Position.id
              value: 1
          dimension: valid-time
          coordinate: "2024-03-01T00:00:00+00:00"
      roundTrips: 1
      note: pin id 1 at the finite Valid-Time instant 2024-03-01 (Transaction Time defaulted Latest) — the rectangle-split head (100.00), a WRITABLE view
      statements:
        - sql:
            postgres: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? and t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?
          binds: [1, "2024-03-01T00:00:00+00:00", "2024-03-01T00:00:00+00:00", infinity]
      expectRows:
        - { pos_id: 1, acct_num: A, val: 100.00, from_z: "2024-01-01T00:00:00+00:00", thru_z: "2024-06-01T00:00:00+00:00", in_z: "2024-04-01T00:00:00+00:00", out_z: infinity }
    - targetEntity: Position
      find:
        asOf:
          operand:
            eq:
              attr: Position.id
              value: 1
          dimension: transaction-time
          coordinate: "2024-02-01T00:00:00+00:00"
      roundTrips: 1
      note: pin the SAME primary key at the finite Transaction-Time instant 2024-02-01 — the superseded belief (90.00), a DIFFERENT milestone and a READ-ONLY view
      statements:
        - sql:
            postgres: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? and t0.thru_z = ? and t0.in_z <= ? and t0.out_z > ?
          binds: [1, infinity, "2024-02-01T00:00:00+00:00", "2024-02-01T00:00:00+00:00"]
      expectRows:
        - { pos_id: 1, acct_num: A, val: 90.00, from_z: "2024-01-01T00:00:00+00:00", thru_z: infinity, in_z: "2024-01-01T00:00:00+00:00", out_z: "2024-04-01T00:00:00+00:00" }
    - action: mutate
      "on": 0
      set:
        value: 250.00
      roundTrips: 0
      note: the Valid-Time-pinned view stays WRITABLE — step 1's read of the same primary key observed another milestone and took nothing away from this one
    - action: mutate
      "on": 1
      set:
        value: 999.00
      roundTrips: 0
      expectError: transaction-time-pin-read-only
      note: the Transaction-Time-pinned view stays READ-ONLY — step 0's read of the same primary key licensed nothing here either
then:
  roundTrips: 2
