# valueObject to-many affix match: nestedContains through a `many` segment wraps the
# literal on BOTH sides, completing the affix trio beside m-value-object-058/-059
# (m-op-algebra wildcard rule + any-element, m-sql). Postgres golden only — a
# non-equality element predicate is outside MariaDB's containment scope (m-dialect,
# "Scope of the containment golden").
#
# nestedContains(Customer.address.phones.number, '-00') binds '%-00%' and matches only
# Nils (7), whose 555-0000 carries the infix. Ada's 555-1234 / 555-9999 and Linus's
# 555-9999 do not. Omar (9) is the trap: his non-array scalar `phones` is the STRING
# "555-0000", which carries the same infix and would match an unguarded traversal; the
# array-type guard reads him as zero elements, with the JSON null (8) and the object
# (10).
#
# The oracle uses `position(... in ...)` rather than a pattern, so a mis-derived affix
# pattern is a row difference rather than the same mistake spelled twice.
model: models/customer.yaml
tags: [m-value-object, m-op-algebra, m-sql, m-dialect, nested, json, to-many, any-element, string, contains, array-traversal, slice-snapshot-1, slice-managed-1]
shape: read
when:
  targetEntity: parallax.compatibility.Customer
  operation:
    nestedContains: { path: parallax.compatibility.Customer.address.phones.number, value: '-00' }
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name from customer t0 where exists (select 1 from jsonb_array_elements(case when jsonb_typeof(jsonb_extract_path(t0.address, ?)) = ? then jsonb_extract_path(t0.address, ?) else cast(? as jsonb) end) t1 where jsonb_extract_path_text(t1.value, ?) like ?)
      binds: [phones, 'array', phones, '[]', number, '%-00%']
  referenceSql:
    postgres: select id, name from customer where jsonb_typeof(address -> 'phones') = 'array' and exists (select 1 from jsonb_array_elements(address -> 'phones') e where position('-00' in e.value ->> 'number') > 0)
  rows:
    - { id: 7, name: Nils }
  roundTrips: 1
