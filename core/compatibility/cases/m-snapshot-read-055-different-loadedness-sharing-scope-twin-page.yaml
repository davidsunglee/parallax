# Different loadedness at two positions at both Sharing Scopes (m-snapshot-read *Node
# sharing*): one OrderItem is reached as a root, which requests `order`, through
# `Order.itemsByShipDate`, which requests `statuses`, and through `Order.items`, which
# requests nothing. A shared node holds the union of them, and each position still
# renders exactly its own keys.
model: models/orders.yaml
tags: [m-snapshot-read, m-read-planning, sharing-scope, to-many, relationship, graph, materialization, slice-snapshot-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "deep-fetch child levels - each IN-list bind is gathered from the level above, so the child emissions depend on a query result"
when:
  objectQuery:
    target: parallax.compatibility.OrderItem
    predicate:
      in:
        path: parallax.compatibility.OrderItem.id
        values:
          - 11
          - 12
    orderBy:
      - attr: parallax.compatibility.OrderItem.id
        direction: asc
    includes:
      - segments:
          - rel: parallax.compatibility.OrderItem.order
          - rel: parallax.compatibility.Order.items
      - segments:
          - rel: parallax.compatibility.OrderItem.order
          - rel: parallax.compatibility.Order.itemsByShipDate
          - rel: parallax.compatibility.OrderItem.statuses
  sharingScope: page
then:
  statements:
    - sql:
        postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.id = any(cast(? as bigint[])) order by t0.id asc
      binds: [[11, 12]]
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.id = any(cast(? as bigint[]))
      binds: [[1]]
    - sql:
        postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id = any(cast(? as bigint[])) order by t0.id desc
      binds: [[1]]
    - sql:
        postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id = any(cast(? as bigint[])) order by t0.shipped_on asc
      binds: [[1]]
    - sql:
        postgres: select t0.id, t0.order_id, t0.order_item_id, t0.code from order_status t0 where t0.order_item_id = any(cast(? as bigint[])) order by t0.code asc
      binds: [[12, 11]]
  graph:
    OrderItem:
      - id: 11
        orderId: 1
        sku: A-100
        quantity: 2
        shippedOn: null
        order:
          id: 1
          name: Ada
          sku: A-100
          qty: 5
          price: "10.50"
          active: true
          orderedOn: 2024-01-05
          items:
            - { id: 12, orderId: 1, sku: B-200, quantity: 1, shippedOn: 2024-02-15 }
            - { id: 11, orderId: 1, sku: A-100, quantity: 2, shippedOn: null }
          itemsByShipDate:
            - id: 12
              orderId: 1
              sku: B-200
              quantity: 1
              shippedOn: 2024-02-15
              statuses:
                - { id: 203, orderId: 1, orderItemId: 12, code: PICKED }
            - id: 11
              orderId: 1
              sku: A-100
              quantity: 2
              shippedOn: null
              statuses:
                - { id: 202, orderId: 1, orderItemId: 11, code: PACKED }
                - { id: 201, orderId: 1, orderItemId: 11, code: PICKED }
      - id: 12
        orderId: 1
        sku: B-200
        quantity: 1
        shippedOn: 2024-02-15
        order:
          id: 1
          name: Ada
          sku: A-100
          qty: 5
          price: "10.50"
          active: true
          orderedOn: 2024-01-05
          items:
            - { id: 12, orderId: 1, sku: B-200, quantity: 1, shippedOn: 2024-02-15 }
            - { id: 11, orderId: 1, sku: A-100, quantity: 2, shippedOn: null }
          itemsByShipDate:
            - id: 12
              orderId: 1
              sku: B-200
              quantity: 1
              shippedOn: 2024-02-15
              statuses:
                - { id: 203, orderId: 1, orderItemId: 12, code: PICKED }
            - id: 11
              orderId: 1
              sku: A-100
              quantity: 2
              shippedOn: null
              statuses:
                - { id: 202, orderId: 1, orderItemId: 11, code: PACKED }
                - { id: 201, orderId: 1, orderItemId: 11, code: PICKED }
  databaseCalls: 5
