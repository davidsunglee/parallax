# Table-per-hierarchy ABSTRACT-ROOT read: the whole Payment family (m-inheritance, m-sql).
model: models/payment.yaml
tags: [m-inheritance, m-sql, table-per-hierarchy, root, type-key, slice-snapshot-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Payment
    predicate:
      "true": {}
then:
  statements:
    - sql:
        postgres: select t0.id, t0.kind, t0.amount, t0.card_network, t0.tendered from payment t0
  rows:
    - { id: 1, amount: "100.00", card_network: Visa, tendered: null, _type: parallax.compatibility.CardPayment }
    - { id: 2, amount: "50.00", card_network: Amex, tendered: null, _type: parallax.compatibility.CardPayment }
    - { id: 3, amount: "20.00", card_network: null, tendered: "25.00", _type: parallax.compatibility.CashPayment }
  databaseCalls: 1
