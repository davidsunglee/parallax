# A page seeks past a NULL coordinate through a NEGATED null test, which is what
# Nulls First makes reachable (m-snapshot-read *Streamed delivery* x m-sql
# *Continuation coordinates*).
model: models/orders.yaml
tags: [m-snapshot-read, m-object-query, m-dialect, stream, streamed-delivery, orderBy, ordering, nulls, nullable, graph, materialization, slice-snapshot-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "a streamed read's keyset seek - the continuing root statement binds the Continuation Order coordinates of the root the previous page delivered last, so the emissions depend on a query result even though the read declares no includes"
when:
  objectQuery:
    target: parallax.compatibility.Order
    predicate:
      in:
        attr: parallax.compatibility.Order.id
        values:
          - 1
          - 4
    orderBy:
      - attr: parallax.compatibility.Order.sku
        direction: asc
        nulls: first
  stream:
    batchSize: 1
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.sku parallax_seek_0, t0.id parallax_seek_1 from orders t0 where t0.id in (?, ?) order by t0.sku asc nulls first, t0.id asc limit ?
        mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.sku parallax_seek_0, t0.id parallax_seek_1 from orders t0 where t0.id in (?, ?) order by t0.sku asc, t0.id asc limit ?
      binds: [1, 4, 2]
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.sku parallax_seek_0, t0.id parallax_seek_1 from orders t0 where t0.id in (?, ?) and (t0.sku is not null or (t0.sku is null and (t0.id > ? or t0.id is null))) order by t0.sku asc nulls first, t0.id asc limit ?
        mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on, t0.sku parallax_seek_0, t0.id parallax_seek_1 from orders t0 where t0.id in (?, ?) and (not t0.sku is null or (t0.sku is null and t0.id > ?)) order by t0.sku asc, t0.id asc limit ?
      binds: [1, 4, 4, 2]
  referenceSql: select id, name, sku, qty, price, active, ordered_on from orders where id in (1, 4)
  graph:
    Order:
      - { id: 4, name: Margaret, sku: null, qty: 20, price: "40.00", active: true, orderedOn: 2024-04-20 }
      - { id: 1, name: Ada, sku: A-100, qty: 5, price: "10.50", active: true, orderedOn: 2024-01-05 }
  roundTrips: 2
