# valueObject presence test: nestedIsNull over a shallow field (m-value-object,
# m-predicate absence collapse), on Postgres AND MariaDB.
model: models/customer.yaml
tags: [m-value-object, m-predicate, m-sql, nested, json, "null", absence-collapse, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Customer
    predicate:
      nestedIsNull:
        path: parallax.compatibility.Customer.address.city
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name from customer t0 where jsonb_extract_path_text(t0.address, ?) is null
        mariadb: select t0.id, t0.name from customer t0 where json_value(t0.address, ?) is null
      binds:
        postgres: [city]
        mariadb: ['$.city']
  referenceSql:
    postgres: select id, name from customer where address ->> 'city' is null
    mariadb: select id, name from customer where nullif(json_unquote(json_extract(address, '$.city')), 'null') is null
  rows:
    - { id: 4, name: Mary }
    - { id: 5, name: Kavi }
    - { id: 7, name: Nils }
    - { id: 8, name: Iris }
    - { id: 9, name: Omar }
    - { id: 10, name: Priya }
  roundTrips: 1
