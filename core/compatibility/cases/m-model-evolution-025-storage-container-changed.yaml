# Changing the Storage Container (m-model-evolution): coordinated, for the
# database alone.
tags: [m-model-evolution, evolution, entity, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-storage-container-v1.yaml
    later: models/evolution-storage-container-v2.yaml
then:
  evolution:
    kind: coordinated
    operations:
      - kind: EntityAltered
        entity: parallax.compatibility.Vault
        deltas:
          - kind: StorageContainerChanged
            earlier: evolution_vault
            later: evolution_vault_archive
    behavioralImpacts: []
    overlapVisibleOperations: []
    coordinationRequirements:
      - operation:
          kind: EntityAltered
          entity: parallax.compatibility.Vault
          deltas:
            - kind: StorageContainerChanged
              earlier: evolution_vault
              later: evolution_vault_archive
        reasons: [DatabaseMigrationRequired]
