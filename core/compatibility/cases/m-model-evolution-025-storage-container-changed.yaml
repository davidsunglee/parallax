# Changing the Storage Container (m-model-evolution): the declared table name is
# a logical change alone, and the default binding, which pins no table name,
# resolves the surviving owner to a renamed physical table. That relocation is
# what needs the database migrated, so it is coordinated on its own.
tags: [m-model-evolution, m-database-binding, evolution, entity, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-storage-container-v1.yaml
    later: models/evolution-storage-container-v2.yaml
then:
  evolution:
    kind: coordinated
    operations:
      - kind: EntityAltered
        entity: parallax.compatibility.Vault
        deltas:
          - kind: StorageContainerChanged
            earlier: evolution_vault
            later: evolution_vault_archive
      - kind: TableRelocated
        entity: parallax.compatibility.Vault
        earlier: { qualifier: [px], name: evolution_vault }
        later: { qualifier: [px], name: evolution_vault_archive }
    behavioralImpacts: []
    overlapVisibleOperations: []
    coordinationRequirements:
      - operation:
          kind: TableRelocated
          entity: parallax.compatibility.Vault
          earlier: { qualifier: [px], name: evolution_vault }
          later: { qualifier: [px], name: evolution_vault_archive }
        reasons: [DatabaseMigrationRequired]
