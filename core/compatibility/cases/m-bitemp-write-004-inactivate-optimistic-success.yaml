# Optimistic bitemporal inactivation with a FRESH observed in_z inactivates EXACTLY
# the one observed current row (m-bitemp-write + m-opt-lock).
model: models/position.yaml
tags: [m-bitemp-write, m-opt-lock, m-sql, bitemporal, temporal, conflict, slice-snapshot-1, slice-managed-1]
shape: conflict
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection concurrency/locking intent (shape:conflict)"
when:
  uow:
    concurrency: optimistic
  write: { id: 1, validEnd: infinity }
  at: "2024-10-01T00:00:00.000000Z"
  observedTxStart: "2024-04-01T00:00:00.000000Z"
then:
  statements:
    - sql:
        postgres: update position set out_z = ? where pos_id = ? and thru_z = ? and out_z = ? and in_z = ?
        mariadb: update `position` set out_z = ? where pos_id = ? and thru_z = ? and out_z = ? and in_z = ?
      binds: ["2024-10-01T00:00:00.000000Z", 1, infinity, infinity, "2024-04-01T00:00:00.000000Z"]
  affectedRows: 1
  tableState:
    position:
      - pos_id: 1
        acct_num: A
        val: "90.00"
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: infinity
        in_z: "2024-01-01T00:00:00.000000Z"
        out_z: "2024-04-01T00:00:00.000000Z"
      - pos_id: 1
        acct_num: A
        val: "100.00"
        from_z: "2024-01-01T00:00:00.000000Z"
        thru_z: "2024-06-01T00:00:00.000000Z"
        in_z: "2024-04-01T00:00:00.000000Z"
        out_z: infinity
      - pos_id: 1
        acct_num: A
        val: "200.00"
        from_z: "2024-06-01T00:00:00.000000Z"
        thru_z: infinity
        in_z: "2024-04-01T00:00:00.000000Z"
        out_z: "2024-10-01T00:00:00.000000Z"
