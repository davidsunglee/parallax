# Optimistic-lock RETRY after conflict (m-opt-lock retry contract).
#
# m-opt-lock-005 stops at the conflict signal (a stale UPDATE affects 0 rows). This proves
# the retry closes the loop: after the conflict, a retry that re-reads the now-
# fresh version and re-applies affects exactly 1 row. The `attempts` retry
# sequence makes the two-step observable (0 then 1) expressible in one case.
#
# Account 2 (Linus) is read at version 1 — a REAL read whose retained
# observation licenses the first attempt's write. A concurrent transaction then
# commits (the `given.apply`: balance 999.00, version 2), BETWEEN that read and
# the write it invalidates. Then:
#   attempt 0 (stale) : UPDATE gates on the version the read observed (1) ⇒ 0 rows — conflict.
#   attempt 1 (retry) : re-read — a real second read, which now observes the fresh
#                       version (2) — and re-apply gating on 2 ⇒ 1 row,
#                       advancing the version to 3.
# The resulting state confirms the retried write landed: account 2 carries the
# retried balance 275.00 at version 3, not the concurrent writer's 999.00.
#
# The new balance (275.00) differs from what either read observed, so each
# attempt's write is an effective change rather than a restoration of what the
# row already held.
#
# `roundTrips: 4` is what the two authored attempts cost between them — a
# resolving read and the gated UPDATE it licenses, each. The first UPDATE REACHED
# the database and reported zero rows, so it counts exactly as the second does;
# the count spans every attempt rather than the last. The resolving read stands
# OUTSIDE the transaction it licenses and is counted all the same: `roundTrips`
# is every call that reached the database, while the goldens are the DML alone.
#
model: models/account.yaml
tags: [m-opt-lock, m-sql, conflict, success, slice-snapshot-1, slice-managed-1]
shape: conflict
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection concurrency/locking intent (given.apply, shape:conflict)"
given:
  apply:
    - sql: update account set balance = 999.00, version = 2 where id = 2
when:
  uow:
    concurrency: optimistic
  attempts:
    - note: stale-version UPDATE — gates on version 1, which no longer matches ⇒ 0 rows
      statements:
        - sql:
            postgres: update account set balance = ?, version = ? where id = ? and version = ?
          binds: [275.00, 2, 2, 1]
      write: { id: 2, balance: 275.00, observedVersion: 1 }
      affectedRows: 0
    - note: retry — re-read the fresh version (2) and re-apply ⇒ 1 row, version 2 -> 3
      statements:
        - sql:
            postgres: update account set balance = ?, version = ? where id = ? and version = ?
          binds: [275.00, 3, 2, 2]
      write: { id: 2, balance: 275.00, observedVersion: 2 }
      affectedRows: 1
then:
  roundTrips: 4
  tableState:
    account:
      - { id: 1, owner: Ada, balance: 100.00, version: 1 }
      - { id: 2, owner: Linus, balance: 275.00, version: 3 }
      - { id: 3, owner: Grace, balance: 10.00, version: 1 }
