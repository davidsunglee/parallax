# Deep fetch, EMPTY INTERMEDIATE level — downstream child SQL is elided (m-deep-fetch).
model: models/orders.yaml
tags: [m-deep-fetch, m-object-query, m-op-list, empty-intermediate, relationship, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Order
    predicate:
      eq:
        attr: parallax.compatibility.Order.id
        value: 4
    includes:
      - segments:
          - rel: parallax.compatibility.Order.items
          - rel: parallax.compatibility.OrderItem.statuses
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.id = ?
      binds: [4]
    - sql:
        postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id = any(?) order by t0.id desc
      binds: [[4]]
  referenceSql: select id, name, sku, qty, price, active, ordered_on from orders where id = 4
  graph:
    Order:
      - id: 4
        name: Margaret
        sku: null
        qty: 20
        price: "40.00"
        active: true
        orderedOn: 2024-04-20
        items: []
  roundTrips: 2
