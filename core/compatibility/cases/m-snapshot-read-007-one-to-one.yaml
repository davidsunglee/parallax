# Snapshot graph over a ONE-TO-ONE relationship (m-snapshot-read): a one-to-one peer
# materializes as one hard pointer, not a collection.
model: models/person.yaml
tags: [m-snapshot-read, m-object-query, m-deep-fetch, one-to-one, relationship, nullable, graph, materialization, slice-snapshot-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "deep-fetch child level - the Person.passport IN-list binds are the distinct person ids gathered from the root query result, so the child emissions depend on a query result"
when:
  objectQuery:
    target: parallax.compatibility.Person
    predicate:
      all: {}
    includes:
      - segments:
          - rel: parallax.compatibility.Person.passport
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name from person t0
    - sql:
        postgres: select t0.id, t0.person_id, t0.number from passport t0 where t0.person_id = any(?)
      binds: [[1, 2, 3]]
  referenceSql: select id, name from person
  graph:
    Person:
      - id: 1
        name: Alan
        passport: { id: 101, personId: 1, number: P-AAA }
      - id: 2
        name: Grace
        passport: { id: 102, personId: 2, number: P-BBB }
      - { id: 3, name: Ada, passport: null }
  roundTrips: 2
