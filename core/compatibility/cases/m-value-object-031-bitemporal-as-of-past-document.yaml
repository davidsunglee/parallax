# valueObject on a FULL BITEMPORAL owner: the originally-BELIEVED document — an audit
# read (both axes in the past) (m-value-object "Inherited temporality",
# m-temporal-read), on Postgres AND MariaDB.
#
# Pin valid-time = 2024-03-01 AND transaction-time = 2024-02-01: as the system BELIEVED
# on 2024-02-01, what address was true in the world on 2024-03-01? Both pins are past
# instants, so each axis injects its [from, to) containment predicate (four binds,
# Valid-Time-first then Transaction Time). Over branch id 1's history that returns R1 — the
# original belief D1 (Helsinki, one phone). R2/R3 were not yet known on 2024-02-01
# (their Transaction-Time starts 2024-04-01), so the audit read reconstructs the superseded
# document — distinct from the D3 (Tampere) the system knows now (case 030). The SAME
# owner read at a different (valid x transaction) point returns a DIFFERENT address
# document: the document rides the bitemporal milestone like a scalar column.
#
# The golden SQL is IDENTICAL on both dialects (a presence-plus-document projection + the four
# injected containment predicates); the two past instants ride as four shared binds, so
# `binds` is one flat array. The referenceSql is per-dialect only because the inline
# timestamp-literal spelling diverges (Postgres `'…'::timestamptz`, MariaDB a
# space-separated DATETIME); both select the same then-believed rectangle.
model: models/branch.yaml
tags: [m-value-object, m-object-query, m-temporal-read, m-sql, nested, json, temporal, bitemporal, as-of, both-axes, past, audit, materialization, graph, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Branch
    predicate:
      all: {}
    temporal:
      transaction-time:
        asOf: "2024-02-01T00:00:00.000000Z"
      valid-time:
        asOf: "2024-03-01T00:00:00.000000Z"
then:
  statements:
    - sql:
        postgres: select t0.br_id, t0.name, t0.from_z, t0.thru_z, t0.in_z, t0.out_z, not t0.address is null, t0.address from branch t0 where t0.from_z <= ? and t0.thru_z > ? and t0.in_z <= ? and t0.out_z > ?
        mariadb: select t0.br_id, t0.name, t0.from_z, t0.thru_z, t0.in_z, t0.out_z, not t0.address is null, t0.address from branch t0 where t0.from_z <= ? and t0.thru_z > ? and t0.in_z <= ? and t0.out_z > ?
      binds: ["2024-03-01T00:00:00.000000Z", "2024-03-01T00:00:00.000000Z", "2024-02-01T00:00:00.000000Z", "2024-02-01T00:00:00.000000Z"]
  referenceSql:
    postgres: "select br_id, name, from_z, thru_z, in_z, out_z from branch where from_z <= '2024-03-01T00:00:00+00:00'::timestamptz and thru_z > '2024-03-01T00:00:00+00:00'::timestamptz and in_z <= '2024-02-01T00:00:00+00:00'::timestamptz and out_z > '2024-02-01T00:00:00+00:00'::timestamptz"
    mariadb: select br_id, name, from_z, thru_z, in_z, out_z from branch where from_z <= '2024-03-01 00:00:00' and thru_z > '2024-03-01 00:00:00' and in_z <= '2024-02-01 00:00:00' and out_z > '2024-02-01 00:00:00'
  graph:
    Branch:
      - id: 1
        name: Central Branch
        validStart: "2024-01-01T00:00:00.000000Z"
        validEnd: infinity
        txStart: "2024-01-01T00:00:00.000000Z"
        txEnd: "2024-04-01T00:00:00.000000Z"
        address:
          street: 10 Old Road
          city: Helsinki
          geo:
            country: FI
          phones:
            - { type: main, number: '555-1000' }
  roundTrips: 1
