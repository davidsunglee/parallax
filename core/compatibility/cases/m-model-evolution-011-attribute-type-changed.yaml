# Changing an accepted Neutral Type (m-model-evolution): coordinated for BOTH
# reasons.
tags: [m-model-evolution, evolution, attribute, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: models/evolution-attribute-type-v1.yaml
    later: models/evolution-attribute-type-v2.yaml
then:
  evolution:
    kind: coordinated
    operations:
      - kind: AttributeAltered
        attribute: parallax.compatibility.Meter.reading
        deltas: [{ kind: TypeChanged, earlier: int32, later: int64 }]
    behavioralImpacts:
      - kind: ValueAdmissibilityChanged
        scope: { attribute: parallax.compatibility.Meter.reading }
        earlier: { type: int32, nullable: false, maxLength: null }
        later: { type: int64, nullable: false, maxLength: null }
        causedBy:
          - kind: AttributeAltered
            attribute: parallax.compatibility.Meter.reading
            deltas: [{ kind: TypeChanged, earlier: int32, later: int64 }]
    overlapVisibleOperations: []
    coordinationRequirements:
      - operation:
          kind: AttributeAltered
          attribute: parallax.compatibility.Meter.reading
          deltas: [{ kind: TypeChanged, earlier: int32, later: int64 }]
        reasons: [AuthoringSurfaceChangeRequired, DatabaseMigrationRequired]
