# Polymorphic relationship targeting the abstract ROOT (m-navigate, m-inheritance).
model: models/animal.yaml
tags: [m-navigate, m-inheritance, m-sql, table-per-hierarchy, polymorphic, exists, slice-snapshot-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Person
    predicate:
      any:
        path: parallax.compatibility.Person.animals
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name from px.person t0 where exists (select 1 from px.animal t1 where t1.owner_id = t0.id)
  referenceSql: select id, name from px.person where id in (select owner_id from px.animal)
  rows:
    - { id: 10, name: Alice }
    - { id: 11, name: Bob }
    - { id: 12, name: Carol }
  databaseCalls: 1
