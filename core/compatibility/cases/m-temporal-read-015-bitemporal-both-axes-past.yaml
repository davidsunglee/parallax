# Bitemporal as-of: BOTH axes in the past — the audit read.
#
# Pin valid-time = 2024-03-01 AND transaction-time = 2024-02-01. Both pins are
# past instants, so each axis injects its [from, to) containment predicate. This
# asks: as the system BELIEVED on 2024-02-01, what was true in the world on
# 2024-03-01? — reconstructing a historical belief, the signature bitemporal read.
#
# Over the id-1 history that is R1 (value 90): R1's Transaction-Time interval
# [2024-01-01, 2024-04-01) contains 2024-02-01 AND its Valid-Time interval
# [2024-01-01, infinity) contains 2024-03-01. R2/R3 were not yet known on
# 2024-02-01 (their Transaction-Time starts 2024-04-01), so the audit read returns the
# ORIGINAL belief 90 — distinct from the 100 the system knows about that same
# Valid Time NOW (case m-temporal-read-014). The four binds read Valid-Time-first (outer
# pin), then Transaction Time.
model: models/position.yaml
tags: [m-temporal-read, m-object-query, m-sql, bitemporal, temporal, as-of, both-axes, past, audit, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Position
    predicate:
      all: {}
    temporal:
      transaction-time:
        asOf: "2024-02-01T00:00:00.000000Z"
      valid-time:
        asOf: "2024-03-01T00:00:00.000000Z"
then:
  statements:
    - sql:
        postgres: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.from_z <= ? and t0.thru_z > ? and t0.in_z <= ? and t0.out_z > ?
      binds: ["2024-03-01T00:00:00.000000Z", "2024-03-01T00:00:00.000000Z", "2024-02-01T00:00:00.000000Z", "2024-02-01T00:00:00.000000Z"]
  referenceSql: "select pos_id, acct_num, val, from_z, thru_z, in_z, out_z from position where from_z <= '2024-03-01T00:00:00+00:00'::timestamptz and thru_z > '2024-03-01T00:00:00+00:00'::timestamptz and in_z <= '2024-02-01T00:00:00+00:00'::timestamptz and out_z > '2024-02-01T00:00:00+00:00'::timestamptz"
  rows:
    - { pos_id: 1, acct_num: A, val: "90.00", from_z: "2024-01-01T00:00:00.000000Z", thru_z: infinity, in_z: "2024-01-01T00:00:00.000000Z", out_z: "2024-04-01T00:00:00.000000Z" }
  roundTrips: 1
