# Optimistic gate on an audit-only chaining update's close (m-temporal-write + m-opt-lock).
# It carries the gated close the conflict form pinned — addressed by the key and the open
# out_z, gated on the in_z the find observed, affecting the one current milestone — now
# produced by a public `update`, and additionally grades the successor milestone that
# update chains at the same instant.
model: models/balance.yaml
tags: [m-temporal-write, m-opt-lock, m-unit-work, m-sql, temporal, audit-only, scenario, slice-snapshot-1, slice-managed-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "the close gates on the milestone its own group's find observed, and the chained successor carries that milestone's unassigned members — a query result (m-case-format 'Settling against a grouped find')"
when:
  uow:
    concurrency: optimistic
  scenario:
    - uow: observe-then-update
      objectQuery:
        target: parallax.compatibility.Balance
        predicate:
          eq:
            attr: parallax.compatibility.Balance.id
            value: 1
        temporal:
          transaction-time:
            asOf: latest
      roundTrips: 1
      note: observe balance 1's current milestone (150.00, known from 2024-06-01)
      statements:
        - sql:
            postgres: select t0.bal_id, t0.acct_num, t0.val, t0.in_z, t0.out_z from balance t0 where t0.bal_id = ? and t0.out_z = ?
            mariadb: select t0.bal_id, t0.acct_num, t0.val, t0.in_z, t0.out_z from balance t0 where t0.bal_id = ? and t0.out_z = ?
          binds: [1, infinity]
      expectRows:
        - { bal_id: 1, acct_num: A, val: "150.00", in_z: "2024-06-01T00:00:00.000000Z", out_z: infinity }
    - uow: observe-then-update
      write:
        - mutation: update
          "on": 0
          entity: parallax.compatibility.Balance
          rows:
            - { id: 1, value: "175.00" }
          at: "2024-09-01T00:00:00.000000Z"
      roundTrips: 2
      note: the close gated on the observed in_z, then the chained successor carrying the new value and the observed acct_num from the same instant
      statements:
        - sql:
            postgres: update balance set out_z = ? where bal_id = ? and out_z = ? and in_z = ?
            mariadb: update balance set out_z = ? where bal_id = ? and out_z = ? and in_z = ?
          binds: ["2024-09-01T00:00:00.000000Z", 1, infinity, "2024-06-01T00:00:00.000000Z"]
        - sql:
            postgres: insert into balance(bal_id, acct_num, val, in_z, out_z) values (?, ?, ?, ?, ?)
            mariadb: insert into balance(bal_id, acct_num, val, in_z, out_z) values (?, ?, ?, ?, ?)
          binds: [1, A, "175.00", "2024-09-01T00:00:00.000000Z", infinity]
then:
  roundTrips: 3
  tableState:
    balance:
      - { bal_id: 1, acct_num: A, val: "100.00", in_z: "2024-01-01T00:00:00.000000Z", out_z: "2024-06-01T00:00:00.000000Z" }
      - { bal_id: 1, acct_num: A, val: "150.00", in_z: "2024-06-01T00:00:00.000000Z", out_z: "2024-09-01T00:00:00.000000Z" }
      - { bal_id: 1, acct_num: A, val: "175.00", in_z: "2024-09-01T00:00:00.000000Z", out_z: infinity }
      - { bal_id: 2, acct_num: B, val: "200.00", in_z: "2024-02-01T00:00:00.000000Z", out_z: infinity }
      - { bal_id: 3, acct_num: C, val: "50.00", in_z: "2024-03-01T00:00:00.000000Z", out_z: "2024-08-01T00:00:00.000000Z" }
