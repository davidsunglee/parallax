model: models/account.yaml
tags: [m-auto-retry, m-unit-work, m-api-conformance, join, slice-snapshot-1]
lane: api-conformance
shape: boundary
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection unit-of-work boundary intent (shape:boundary)"
when:
  uow:
    retry: {maxRetries: 2}
  boundary:
    - action: read
      note: the outer body observes the row
    - action: join
      retry: {maxRetries: 2, backoff: {baseDelay: 0.008, maxDelay: 1.0}}
      note: a joining call spelling the same policy out in full is accepted
    - action: read
      note: the joined body reads on the shared attempt
then:
  outcome: committed
  databaseCalls: 2
  executionLifecycle:
    roots:
      - execution: 1
        kind: transaction-invocation
        events:
          - { sequence: 1, activity: 1, parent: null, transactionInvocationStarted: { invocation: outer, accessMode: read-write, concurrency: optimistic, retry: {maxRetries: 2, backoff: {baseDelay: 0.008, maxDelay: 1.0}}, isolation: read-committed } }
          - { sequence: 2, activity: 2, parent: 1, transactionAttemptStarted: { edition: account } }
          - { sequence: 3, activity: 3, parent: 2, acquisitionStarted: { policy: writer-only } }
          - { sequence: 4, activity: 3, parent: 2, acquisitionFinished: { outcome: acquired, route: writer } }
          - { sequence: 5, activity: 4, parent: 2, readStarted: { target: parallax.compatibility.Account, purpose: typed } }
          - { sequence: 6, activity: 5, parent: 4, databaseCallStarted: { target: parallax.compatibility.Account, kind: read } }
          - { sequence: 7, activity: 5, parent: 4, databaseCallFinished: { outcome: readCompleted, returnedRows: 1 } }
          - { sequence: 8, activity: 4, parent: 2, readFinished: { outcome: completed } }
          - { sequence: 9, activity: 6, parent: 2, transactionInvocationStarted: { invocation: joined } }
          - { sequence: 10, activity: 7, parent: 2, readStarted: { target: parallax.compatibility.Account, purpose: typed } }
          - { sequence: 11, activity: 8, parent: 7, databaseCallStarted: { target: parallax.compatibility.Account, kind: read } }
          - { sequence: 12, activity: 8, parent: 7, databaseCallFinished: { outcome: readCompleted, returnedRows: 1 } }
          - { sequence: 13, activity: 7, parent: 2, readFinished: { outcome: completed } }
          - { sequence: 14, activity: 6, parent: 2, transactionInvocationFinished: { outcome: returned } }
          - { sequence: 15, activity: 9, parent: 2, releaseStarted: {} }
          - { sequence: 16, activity: 9, parent: 2, releaseFinished: { cleanup: returned } }
          - { sequence: 17, activity: 2, parent: 1, transactionAttemptFinished: { outcome: committed } }
          - { sequence: 18, activity: 1, parent: null, transactionInvocationFinished: { outcome: committed } }
