model: models/account.yaml
tags: [m-batch-write, m-opt-lock, m-sql, write-sequence, materialize, grouped-effect, slice-snapshot-1, slice-managed-1]
shape: writeSequence
given:
  fixtures: true
when:
  uow:
    concurrency: locking
  writeSequence:
    - mutation: delete
      entity: parallax.compatibility.Account
      statements: 1
      note: a versioned set-based delete keeps ONE keyed delete step per key, ungated in locking mode, applied as one grouped effect
      rows:
        - { id: 1, observedVersion: 1 }
        - { id: 2, observedVersion: 1 }
then:
  statements:
    - sql:
        postgres: delete from account t using unnest(cast(? as bigint[])) with ordinality v(c1, ord) where t.id = v.c1 returning v.ord
      binds:
        - [1, 2]
  tableState:
    account:
      - { id: 3, owner: Grace, balance: "10.00", version: 1 }
  databaseCalls: 2
