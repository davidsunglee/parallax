model: models/composed-beast-reader.yaml
tags: [m-inheritance, m-deep-fetch, m-sql, m-object-query, table-per-hierarchy, narrow, deep-fetch, graph, partial-composition, slice-snapshot-1]
shape: read
given:
  provisioningModel: models/composed-beast-provisioning.yaml
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "deep-fetch child level - the narrowed beasts[Wolf] key-set binds are the keeper ids gathered from the root query result"
when:
  objectQuery:
    target: parallax.compatibility.Keeper
    predicate:
      "true": {}
    orderBy:
      - attr: parallax.compatibility.Keeper.id
        direction: asc
    includes:
      - segments:
          - rel: parallax.compatibility.Keeper.beasts
            narrowTo:
              - parallax.compatibility.Wolf
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name from keeper t0 order by t0.id asc
        mariadb: select t0.id, t0.name from keeper t0 order by t0.id asc
    - sql:
        postgres: select t0.id, t0.name, t0.keeper_id, t0.howl from beast t0 where t0.keeper_id = any(?) and t0.kind = ? order by t0.id asc
        mariadb: select t0.id, t0.name, t0.keeper_id, t0.howl from beast t0 where t0.keeper_id in (?, ?, ?) and t0.kind = ? order by t0.id asc
      binds: { postgres: [[10, 11, 12], wolf], mariadb: [10, 11, 12, wolf] }
  referenceSql: select id, name from keeper
  graph:
    Keeper:
      - id: 10
        name: Mowgli
        "beasts[Wolf]":
          - { id: 1, name: Akela, keeperId: 10, howl: aroo }
          - { id: 3, name: Raksha, keeperId: 10, howl: yip }
      - id: 11
        name: Bagheera
        "beasts[Wolf]": []
      - id: 12
        name: Kaa
        "beasts[Wolf]": []
  roundTrips: 2
