# valueObject to-many: a same-element `where` MAY constrain one element-relative path
# twice, and the conflicting form is outside MariaDB's containment scope (m-predicate
# scoped `where`, m-sql to-many, m-dialect "Scope of the containment golden",
# m-document-codec `encodeCandidate`). Postgres golden only.
model: models/customer.yaml
tags: [m-value-object, m-predicate, m-sql, m-dialect, m-document-codec, nested, json, to-many, exists, scoped, same-element, array-traversal, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Customer
    predicate:
      nestedExists:
        path: parallax.compatibility.Customer.address.phones
        where:
          and:
            operands:
              - nestedEq:
                  path: type
                  value: home
              - nestedEq:
                  path: type
                  value: work
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name from customer t0 where exists (select 1 from jsonb_array_elements(case when jsonb_typeof(jsonb_extract_path(t0.address, ?)) = ? then jsonb_extract_path(t0.address, ?) else cast(? as jsonb) end) t1 where jsonb_extract_path_text(t1.value, ?) = ? and jsonb_extract_path_text(t1.value, ?) = ?)
      binds: [phones, 'array', phones, '[]', type, home, type, work]
  referenceSql:
    postgres: select id, name from customer where jsonb_typeof(address -> 'phones') = 'array' and exists (select 1 from jsonb_array_elements(address -> 'phones') e where e.value ->> 'type' = 'home' and e.value ->> 'type' = 'work')
  rows: []
  roundTrips: 1
