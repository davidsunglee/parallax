# Write sequence: TERMINATE an audit-only balance (milestone chaining, m-txtime-write).
model: models/balance.yaml
tags: [m-txtime-write, m-sql, write-sequence, terminate, audit-only, slice-snapshot-1, slice-managed-1]
shape: writeSequence
when:
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.Balance
      statements: 1
      note: open a current milestone [2024-01-01, infinity)
      rows:
        - { id: 1, acctNum: A, value: "100.00" }
      at: "2024-01-01T00:00:00.000000Z"
    - mutation: terminate
      entity: parallax.compatibility.Balance
      statements: 1
      note: close the current row; insert nothing (no current row remains)
      rows:
        - { id: 1 }
      at: "2024-08-01T00:00:00.000000Z"
then:
  statements:
    - sql:
        postgres: insert into balance(bal_id, acct_num, val, in_z, out_z) values (?, ?, ?, ?, ?)
        mariadb: insert into balance(bal_id, acct_num, val, in_z, out_z) values (?, ?, ?, ?, ?)
      binds: [1, A, "100.00", "2024-01-01T00:00:00.000000Z", infinity]
    - sql:
        postgres: update balance set out_z = ? where bal_id = ? and out_z = ? and in_z = ?
        mariadb: update balance set out_z = ? where bal_id = ? and out_z = ? and in_z = ?
      binds: ["2024-08-01T00:00:00.000000Z", 1, infinity, "2024-01-01T00:00:00.000000Z"]
  tableState:
    balance:
      - { bal_id: 1, acct_num: A, val: "100.00", in_z: "2024-01-01T00:00:00.000000Z", out_z: "2024-08-01T00:00:00.000000Z" }
  roundTrips: 3
