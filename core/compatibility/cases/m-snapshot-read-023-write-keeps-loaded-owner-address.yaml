# Embedded documents exercise graph isolation beyond scalar fields; phone
# order also detects reconstruction that preserves members but reorders them.
model: models/customer.yaml
tags: [m-snapshot-read, m-deep-fetch, m-value-object, m-unit-work, closed-world, relationship, to-one, json, update, scenario, slice-snapshot-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "include level - the Location.customer parent IN-list binds are the distinct customer keys gathered from step 0's own root read, so the child emission depends on a query result"
when:
  scenario:
    - objectQuery:
        target: parallax.compatibility.Location
        predicate:
          eq:
            attr: parallax.compatibility.Location.id
            value: 100
        includes:
          - segments:
              - rel: parallax.compatibility.Location.customer
      roundTrips: 2
      note: materialize a snapshot of location 100 WITH its owning customer - both levels decode their own address document
      statements:
        - sql:
            postgres: select t0.id, t0.customer_id, t0.label, not t0.address is null, t0.address from location t0 where t0.id = ?
          binds: [100]
        - sql:
            postgres: select t0.id, t0.name, not t0.address is null, t0.address from customer t0 where t0.id = any(?)
          binds: [[1]]
      expectRows:
        - id: 100
          customer_id: 1
          label: HQ
          address:
            street: 1 Harbour Way
            city: Oslo
            geo:
              country: "NO"
              elevation: 12.0
              point: { lat: 59.91, lon: 10.75 }
            phones:
              - { type: work, number: '555-0100' }
    - write:
        - mutation: update
          entity: parallax.compatibility.Customer
          rows:
            - id: 1
              address:
                street: 1 Park Ave
                city: Bergen
                geo:
                  country: "NO"
                  elevation: 10.5
                  point: { lat: 59.9, lon: 10.7 }
                phones:
                  - { type: work, number: '555-9999' }
                  - { type: home, number: '555-1234' }
      roundTrips: 2
      note: rewrite the very document the loaded `customer` view holds - a changed city AND the two phones in the opposite order
      statements:
        - sql:
            postgres: update customer set address = ? where id = ?
          binds:
            - street: 1 Park Ave
              city: Bergen
              geo:
                country: "NO"
                elevation: 10.5
                point: { lat: 59.9, lon: 10.7 }
              phones:
                - { type: work, number: '555-9999' }
                - { type: home, number: '555-1234' }
            - 1
    - action: access
      "on": 0
      path: customer
      roundTrips: 0
      sameObjectAs: 0
      note: access the ALREADY-MATERIALIZED customer after the write -> ZERO SQL, the pre-write city, and the phones in the order the read decoded them
      expectGraph:
        Customer:
          - id: 1
            name: Ada
            address:
              street: 1 Park Ave
              city: Oslo
              geo:
                country: "NO"
                elevation: 10.5
                point: { lat: 59.9, lon: 10.7 }
              phones:
                - { type: home, number: '555-1234' }
                - { type: work, number: '555-9999' }
    - objectQuery:
        target: parallax.compatibility.Customer
        predicate:
          eq:
            attr: parallax.compatibility.Customer.id
            value: 1
      roundTrips: 1
      note: observing the write means issuing another read - the same customer, re-read, holds the rewritten document
      statements:
        - sql:
            postgres: select t0.id, t0.name, not t0.address is null, t0.address from customer t0 where t0.id = ?
          binds: [1]
      expectRows:
        - id: 1
          name: Ada
          address:
            street: 1 Park Ave
            city: Bergen
            geo:
              country: "NO"
              elevation: 10.5
              point: { lat: 59.9, lon: 10.7 }
            phones:
              - { type: work, number: '555-9999' }
              - { type: home, number: '555-1234' }
then:
  roundTrips: 5
