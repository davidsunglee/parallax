# Table-per-concrete-subtype TEMPORAL abstract-root read: `union all` with PER-BRANCH
# as-of binds (m-inheritance x m-temporal-read x m-sql).
#
# Targeting the abstract root Rate (bitemporal) resolves to every concrete descendant
# {DepositRate, LoanRate} (ALPHABETICAL branch order). With no shared table and no tag,
# the read lowers to `union all` over those concrete tables, and the injected as-of
# predicate is applied PER BRANCH: each branch carries its own `from_z <= ? and thru_z > ?
# and out_z = ?` fragment (valid-time pinned past 2024-06-01, transaction-time defaulted
# NOW), in Valid-Time-first bind order. Because every concrete branch inherits the same
# axes from the root, each branch's as-of fragment is identical, so the union's binds are
# the per-branch suffix [2024-06-01, 2024-06-01, infinity] repeated in alphabetical branch
# order — the harness recomputes and asserts this per-branch propagation from the read's pin.
#
# Every branch projects the SAME stable Position Layout sequence — identity `id`,
# Domain slots `amount`, DepositRate's `grade`, and LoanRate's `spread`, then the four
# Temporal interval slots and the per-branch familyVariant literal. A column not
# applicable to a branch is a NULL placeholder cast to its type; the bounded-string
# placeholder diverges per dialect (Postgres varchar / MariaDB char), the decimal is
# identical — hence the per-dialect goldens. The interval columns are inherited, so they
# are real references in EVERY branch (never NULL-cast).
#
# DepositRate carries TWO Transaction-Time milestones under business key id=1 over the SAME
# Valid-Time interval: a SUPERSEDED one closed at 2024-02-01 (amount 2.25 / grade B) and the
# CURRENT one open from 2024-02-01 (amount 2.50 / grade A). The Transaction-Time Latest
# default (`out_z = ?` bind `infinity`) therefore discriminates WITHIN one key's milestone
# chain, not merely across branches: the DepositRate branch projects amount 2.50 / grade A
# with `in_z` at that milestone's own start. m-inheritance-100 pins the superseded row from
# the same fixture by reading Transaction-Time-past into the closed window.
model: models/rate.yaml
tags: [m-inheritance, m-temporal-read, m-sql, table-per-concrete-subtype, union-all, temporal, bitemporal, as-of, familyVariant, slice-snapshot-1, slice-managed-1]
shape: read
given:
  fixtures: true
when:
  targetEntity: parallax.compatibility.Rate
  operation:
    asOf:
      operand:
        all: {}
      dimension: valid-time
      coordinate: "2024-06-01T00:00:00+00:00"
then:
  statements:
    - sql:
        postgres: select t0.id, t0.amount, t0.grade, cast(null as decimal(18, 2)) spread, t0.from_z, t0.thru_z, t0.in_z, t0.out_z, 'DepositRate' family_variant from deposit_rate t0 where t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ? union all select t0.id, t0.amount, cast(null as varchar(8)) grade, t0.spread, t0.from_z, t0.thru_z, t0.in_z, t0.out_z, 'LoanRate' family_variant from loan_rate t0 where t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?
        mariadb: select t0.id, t0.amount, t0.grade, cast(null as decimal(18, 2)) spread, t0.from_z, t0.thru_z, t0.in_z, t0.out_z, 'DepositRate' family_variant from deposit_rate t0 where t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ? union all select t0.id, t0.amount, cast(null as char(8)) grade, t0.spread, t0.from_z, t0.thru_z, t0.in_z, t0.out_z, 'LoanRate' family_variant from loan_rate t0 where t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?
      binds: ["2024-06-01T00:00:00+00:00", "2024-06-01T00:00:00+00:00", infinity, "2024-06-01T00:00:00+00:00", "2024-06-01T00:00:00+00:00", infinity]
  rows:
    - { id: 1, amount: 2.50, grade: A, spread: null, from_z: "2024-01-01T00:00:00+00:00", thru_z: infinity, in_z: "2024-02-01T00:00:00+00:00", out_z: infinity, familyVariant: DepositRate }
    - { id: 2, amount: 6.75, grade: null, spread: 1.25, from_z: "2024-01-01T00:00:00+00:00", thru_z: infinity, in_z: "2024-01-01T00:00:00+00:00", out_z: infinity, familyVariant: LoanRate }
  roundTrips: 1
