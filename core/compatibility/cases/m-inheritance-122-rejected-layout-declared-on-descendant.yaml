# Negative (m-inheritance): a conventionally-mapped table-per-hierarchy root
# whose concrete subtype declares its own Relational Document Layout.
model: models/payment.yaml
tags: [m-inheritance, m-storage-layout, m-model-formation, m-descriptor, rejected, negative, table-per-hierarchy, document-layout, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  model:
    entities:
      - name: Record
        table: record
        inheritance:
          role: root
          strategy: table-per-hierarchy
          tag: { column: kind }
        attributes:
          - { name: id, type: int64, primaryKey: true }
      - name: CardRecord
        inheritance:
          role: concrete-subtype
          parent: Record
          tagValue: card
        layout:
          document:
            column: payload
        attributes:
          - { name: cardNote, type: string }
then:
  rejectedRule: inheritance-layout-not-root-owned
