# Read-lock matrix (m-concurrency): an object find inside an OPTIMISTIC unit of work
# emits NO lock — the locking/optimistic contrast — `api-conformance` lane.
model: models/account.yaml
tags: [m-concurrency, m-dialect, m-api-conformance, slice-snapshot-1]
lane: api-conformance
shape: read
when:
  uow:
    concurrency: optimistic
  objectQuery:
    target: parallax.compatibility.Account
    predicate:
      eq:
        path: parallax.compatibility.Account.id
        value: 2
then:
  statements:
    - sql:
        postgres: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.id = ?
      binds: [2]
  referenceSql: select id, owner, balance, version from account where id = 2
  rows:
    - { id: 2, owner: Linus, balance: "250.00", version: 1 }
  databaseCalls: 1
