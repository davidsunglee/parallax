# Negative (m-wire typed-literal conversion, and the order the two range checks run
# in): an element-scoped range whose bounds cannot denote the declared leaf is refused
# as a neutral literal type mismatch, not as an inverted range.
model: models/customer.yaml
tags: [m-predicate, m-wire, m-value-object, rejected, negative, nested, between, scoped, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  objectQuery:
    target: parallax.compatibility.Customer
    predicate:
      nestedExists:
        path: parallax.compatibility.Customer.address.phones
        where:
          nestedBetween:
            path: number
            lower: 42
            upper: 7
then:
  rejectedRule: neutral-literal-type-mismatch
