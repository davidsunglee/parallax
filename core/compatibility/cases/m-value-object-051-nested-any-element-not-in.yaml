# valueObject to-many negated membership: nestedNotIn through a `many` segment keeps
# the UNIFORM any-element reading — SOME element's member is not in the list — never
# the no-element reading (m-predicate any-element + absence collapse, m-sql,
# m-dialect array-traversal form). Postgres golden only — a non-equality element
# predicate is outside MariaDB's containment scope (m-dialect, "Scope of the
# containment golden").
model: models/customer.yaml
tags: [m-value-object, m-predicate, m-sql, m-dialect, nested, json, to-many, any-element, notIn, absence-collapse, array-traversal, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Customer
    predicate:
      nestedNotIn:
        path: parallax.compatibility.Customer.address.phones.type
        values:
          - work
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name from customer t0 where exists (select 1 from jsonb_array_elements(case when jsonb_typeof(jsonb_extract_path(t0.address, ?)) = ? then jsonb_extract_path(t0.address, ?) else cast(? as jsonb) end) t1 where not jsonb_extract_path_text(t1.value, ?) in (?))
      binds: [phones, 'array', phones, '[]', type, work]
  referenceSql:
    postgres: select id, name from customer where jsonb_typeof(address -> 'phones') = 'array' and exists (select 1 from jsonb_array_elements(address -> 'phones') e where e.value ->> 'type' is not null and e.value ->> 'type' <> 'work')
  rows:
    - { id: 1, name: Ada }
    - { id: 2, name: Linus }
  roundTrips: 1
