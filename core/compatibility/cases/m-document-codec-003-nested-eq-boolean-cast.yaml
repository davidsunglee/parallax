# Portable document encoding: a `boolean` leaf compares through a dialect CAST, never
# as extracted text (m-document-codec, m-dialect typed cast form, m-sql), on Postgres
# AND MariaDB.
model: models/document-codec.yaml
tags: [m-document-codec, m-value-object, m-sql, m-dialect, nested, json, cast, boolean, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Sample
    predicate:
      nestedEq:
        path: parallax.compatibility.Sample.profile.flag
        value: true
then:
  statements:
    - sql:
        postgres: select t0.id, t0.label from sample t0 where cast(jsonb_extract_path_text(t0.profile, ?) as boolean) = ?
        mariadb: select t0.id, t0.label from sample t0 where cast(json_value(t0.profile, ?) as signed) = ?
      binds:
        postgres: [flag, true]
        mariadb: ['$.flag', true]
  referenceSql:
    postgres: select id, label from sample where (profile ->> 'flag')::boolean = true
    mariadb: select id, label from sample where nullif(json_unquote(json_extract(profile, '$.flag')), 'null') = 'true'
  rows:
    - { id: 1, label: Ada }
  roundTrips: 1
