# A streamed delivery reads each page in its own statement. At Repeatable Read every
# page reads the first page's snapshot, so the second page delivers account 3 and
# never account 4, whatever the peer committed between the pages.
model: models/account.yaml
tags: [m-unit-work, m-snapshot-read, isolation, concurrency, stream, streamed-delivery, repeatable-read, slice-snapshot-1]
shape: concurrencySuccess
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "two-session isolation witness (when.concurrency)"
given:
  fixtures: true
when:
  uow:
    isolation: repeatable-read
  concurrency:
    rounds:
      - A:
          kind: read
          statements:
            - sql:
                postgres: select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 order by t0.id asc limit ?
                mariadb: select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 order by t0.id asc limit ?
              binds: [3]
          expectRows:
            - { id: 1, owner: Ada, balance: "100.00", version: 1, parallax_seek_0: 1 }
            - { id: 2, owner: Linus, balance: "250.00", version: 1, parallax_seek_0: 2 }
            - { id: 3, owner: Grace, balance: "10.00", version: 1, parallax_seek_0: 3 }
      - B:
          kind: write
          statements:
            - sql:
                postgres: insert into account(id, owner, balance, version) values (?, ?, ?, ?)
                mariadb: insert into account(id, owner, balance, version) values (?, ?, ?, ?)
              binds: [4, Noether, "5.00", 1]
            - sql:
                postgres: delete from account where id = ? and version = ?
                mariadb: delete from account where id = ? and version = ?
              binds: [3, 1]
          affectedRows: [1, 1]
      - B:
          kind: commit
      - A:
          kind: read
          statements:
            - sql:
                postgres: select u.id, u.owner, u.balance, u.version, u.parallax_seek_0 from ((select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 where t0.id >= ? and (t0.id > ? or t0.id is null) order by t0.id asc limit ?) union all (select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 where t0.id is null order by t0.id asc limit ?)) u order by u.parallax_seek_0 asc limit ?
                mariadb: select t0.id, t0.owner, t0.balance, t0.version, t0.id parallax_seek_0 from account t0 where t0.id >= ? and t0.id > ? order by t0.id asc limit ?
              binds: { postgres: [2, 2, 3, 3, 3], mariadb: [2, 2, 3] }
          expectRows:
            - { id: 3, owner: Grace, balance: "10.00", version: 1, parallax_seek_0: 3 }
      - A:
          kind: commit
