# A streamed read of a Document-layout Entity whose exact namespace default
# places it in `px_docs`: every page's keyset seek over document-resident sort
# keys reads the bound table.
model: models/document-layout.yaml
binding:
  postgres:
    format_version: 1
    backend: postgres
    default: { schema: px }
    namespaces:
      parallax.compatibility: { schema: px_docs }
  mariadb:
    format_version: 1
    backend: mariadb
    default: { database: px }
    namespaces:
      parallax.compatibility: { database: px_docs }
tags: [m-database-binding, m-snapshot-read, m-storage-layout, m-sql, m-dialect, stream, streamed-delivery, orderBy, json, document-layout, graph, binding, slice-snapshot-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "a streamed read's keyset seek - each continuing root statement binds the Document Path and the Continuation Order coordinate of every term, captured by the previous page's own hidden cells for the root it delivered last"
when:
  objectQuery:
    target: parallax.compatibility.Trip
    predicate:
      "true": {}
    orderBy:
      - attr: parallax.compatibility.Trip.destination
        direction: desc
      - attr: parallax.compatibility.Trip.nights
        direction: desc
  stream:
    batchSize: 1
then:
  statements:
    - sql:
        postgres: select t0.id, t0.traveler_id, not t0.payload is null, t0.payload, jsonb_extract_path_text(t0.payload, ?) parallax_seek_0, cast(jsonb_extract_path_text(t0.payload, ?) as bigint) parallax_seek_1, t0.id parallax_seek_2 from px_docs.trip t0 order by jsonb_extract_path_text(t0.payload, ?) desc nulls last, cast(jsonb_extract_path_text(t0.payload, ?) as bigint) desc nulls last, t0.id asc limit ?
        mariadb: select t0.id, t0.traveler_id, not t0.payload is null, t0.payload, json_value(t0.payload, ?) parallax_seek_0, cast(json_value(t0.payload, ?) as signed) parallax_seek_1, t0.id parallax_seek_2 from px_docs.trip t0 order by json_value(t0.payload, ?) desc, cast(json_value(t0.payload, ?) as signed) desc, t0.id asc limit ?
      binds:
        postgres: [destination, nights, destination, nights, 2]
        mariadb: ['$.destination', '$.nights', '$.destination', '$.nights', 2]
    - sql:
        postgres: select t0.id, t0.traveler_id, not t0.payload is null, t0.payload, jsonb_extract_path_text(t0.payload, ?) parallax_seek_0, cast(jsonb_extract_path_text(t0.payload, ?) as bigint) parallax_seek_1, t0.id parallax_seek_2 from px_docs.trip t0 where (jsonb_extract_path_text(t0.payload, ?) < ? or jsonb_extract_path_text(t0.payload, ?) is null or (jsonb_extract_path_text(t0.payload, ?) = ? and (cast(jsonb_extract_path_text(t0.payload, ?) as bigint) < ? or jsonb_extract_path_text(t0.payload, ?) is null)) or (jsonb_extract_path_text(t0.payload, ?) = ? and cast(jsonb_extract_path_text(t0.payload, ?) as bigint) = ? and (t0.id > ? or t0.id is null))) order by jsonb_extract_path_text(t0.payload, ?) desc nulls last, cast(jsonb_extract_path_text(t0.payload, ?) as bigint) desc nulls last, t0.id asc limit ?
        mariadb: select t0.id, t0.traveler_id, not t0.payload is null, t0.payload, json_value(t0.payload, ?) parallax_seek_0, cast(json_value(t0.payload, ?) as signed) parallax_seek_1, t0.id parallax_seek_2 from px_docs.trip t0 where (json_value(t0.payload, ?) < ? or json_value(t0.payload, ?) is null or (json_value(t0.payload, ?) = ? and (cast(json_value(t0.payload, ?) as signed) < ? or json_value(t0.payload, ?) is null)) or (json_value(t0.payload, ?) = ? and cast(json_value(t0.payload, ?) as signed) = ? and t0.id > ?)) order by json_value(t0.payload, ?) desc, cast(json_value(t0.payload, ?) as signed) desc, t0.id asc limit ?
      binds:
        postgres: [destination, nights, destination, Oslo, destination, destination, Oslo, nights, 3, nights, destination, Oslo, nights, 3, 51, destination, nights, 2]
        mariadb: ['$.destination', '$.nights', '$.destination', Oslo, '$.destination', '$.destination', Oslo, '$.nights', 3, '$.nights', '$.destination', Oslo, '$.nights', 3, 51, '$.destination', '$.nights', 2]
    - sql:
        postgres: select t0.id, t0.traveler_id, not t0.payload is null, t0.payload, jsonb_extract_path_text(t0.payload, ?) parallax_seek_0, cast(jsonb_extract_path_text(t0.payload, ?) as bigint) parallax_seek_1, t0.id parallax_seek_2 from px_docs.trip t0 where (jsonb_extract_path_text(t0.payload, ?) < ? or jsonb_extract_path_text(t0.payload, ?) is null or (jsonb_extract_path_text(t0.payload, ?) = ? and (cast(jsonb_extract_path_text(t0.payload, ?) as bigint) < ? or jsonb_extract_path_text(t0.payload, ?) is null)) or (jsonb_extract_path_text(t0.payload, ?) = ? and cast(jsonb_extract_path_text(t0.payload, ?) as bigint) = ? and (t0.id > ? or t0.id is null))) order by jsonb_extract_path_text(t0.payload, ?) desc nulls last, cast(jsonb_extract_path_text(t0.payload, ?) as bigint) desc nulls last, t0.id asc limit ?
        mariadb: select t0.id, t0.traveler_id, not t0.payload is null, t0.payload, json_value(t0.payload, ?) parallax_seek_0, cast(json_value(t0.payload, ?) as signed) parallax_seek_1, t0.id parallax_seek_2 from px_docs.trip t0 where (json_value(t0.payload, ?) < ? or json_value(t0.payload, ?) is null or (json_value(t0.payload, ?) = ? and (cast(json_value(t0.payload, ?) as signed) < ? or json_value(t0.payload, ?) is null)) or (json_value(t0.payload, ?) = ? and cast(json_value(t0.payload, ?) as signed) = ? and t0.id > ?)) order by json_value(t0.payload, ?) desc, cast(json_value(t0.payload, ?) as signed) desc, t0.id asc limit ?
      binds:
        postgres: [destination, nights, destination, Bergen, destination, destination, Bergen, nights, 7, nights, destination, Bergen, nights, 7, 53, destination, nights, 2]
        mariadb: ['$.destination', '$.nights', '$.destination', Bergen, '$.destination', '$.destination', Bergen, '$.nights', 7, '$.nights', '$.destination', Bergen, '$.nights', 7, 53, '$.destination', '$.nights', 2]
  referenceSql:
    postgres: select id, traveler_id, payload ->> 'destination' as destination, cast(payload ->> 'nights' as integer) as nights from px_docs.trip
    mariadb: select id, traveler_id, json_value(payload, '$.destination') as destination, cast(json_value(payload, '$.nights') as signed) as nights from px_docs.trip
  graph:
    Trip:
      - { id: 51, travelerId: 1, destination: Oslo, nights: 3 }
      - { id: 53, travelerId: 2, destination: Bergen, nights: 7 }
      - { id: 52, travelerId: 1, destination: Bergen, nights: 1 }
  databaseCalls: 3
