# An observation of a document-mapped Entity with NO document-resident member still
# projects and retains the Structured Column, so a rectangle split carries a key the
# model decodes nowhere (m-storage-layout x m-sql *Read projection* rule 5 x
# m-unit-work), on Postgres AND MariaDB.
model: models/document-layout.yaml
tags: [m-bitemp-write, m-storage-layout, m-document-codec, m-sql, m-unit-work, bitemporal, temporal, materialize, predicate-write, json, document-layout, scenario, slice-snapshot-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "out-of-band given.apply seeds a Structured Column key no authored member can produce"
given:
  apply:
    - sql: update mooring set payload = '{"berthCode":"NB-118"}'
when:
  uow:
    concurrency: optimistic
  scenario:
    - objectQuery:
        target: parallax.compatibility.Mooring
        predicate:
          eq:
            attr: parallax.compatibility.Mooring.id
            value: 1
        temporal:
          transaction-time:
            asOf: latest
          valid-time:
            asOf: latest
      roundTrips: 1
      note: the materializing read — `t0.payload` is projected for the observation, not for any member
      statements:
        - sql:
            postgres: select t0.id, t0.from_z, t0.thru_z, t0.in_z, t0.out_z, not t0.payload is null, t0.payload from mooring t0 where t0.id = ? and t0.thru_z = ? and t0.out_z = ?
            mariadb: select t0.id, t0.from_z, t0.thru_z, t0.in_z, t0.out_z, not t0.payload is null, t0.payload from mooring t0 where t0.id = ? and t0.thru_z = ? and t0.out_z = ?
          binds: [1, infinity, infinity]
      expectRows:
        - { id: 1, from_z: "2026-01-01T00:00:00.000000Z", thru_z: infinity, in_z: "2026-01-01T00:00:00.000000Z", out_z: infinity }
    - write:
        mutation: terminateUntil
        target:
          entity: parallax.compatibility.Mooring
          predicate:
            eq: { attr: parallax.compatibility.Mooring.id, value: 1 }
        at: "2026-02-15T00:00:00.000000Z"
        validFrom: "2026-03-01T00:00:00.000000Z"
        until: "2026-09-01T00:00:00.000000Z"
      roundTrips: 3
      note: head and tail each bind the closed rectangle's own document, `berthCode` included
      statements:
        - sql:
            postgres: update mooring set out_z = ? where id = ? and thru_z = ? and out_z = ? and in_z = ?
            mariadb: update mooring set out_z = ? where id = ? and thru_z = ? and out_z = ? and in_z = ?
          binds: ["2026-02-15T00:00:00.000000Z", 1, infinity, infinity, "2026-01-01T00:00:00.000000Z"]
        - sql:
            postgres: insert into mooring(id, from_z, thru_z, in_z, out_z, payload) values (?, ?, ?, ?, ?, ?)
            mariadb: insert into mooring(id, from_z, thru_z, in_z, out_z, payload) values (?, ?, ?, ?, ?, ?)
          binds:
            - 1
            - "2026-01-01T00:00:00.000000Z"
            - "2026-03-01T00:00:00.000000Z"
            - "2026-02-15T00:00:00.000000Z"
            - infinity
            - berthCode: NB-118
        - sql:
            postgres: insert into mooring(id, from_z, thru_z, in_z, out_z, payload) values (?, ?, ?, ?, ?, ?)
            mariadb: insert into mooring(id, from_z, thru_z, in_z, out_z, payload) values (?, ?, ?, ?, ?, ?)
          binds:
            - 1
            - "2026-09-01T00:00:00.000000Z"
            - infinity
            - "2026-02-15T00:00:00.000000Z"
            - infinity
            - berthCode: NB-118
    - objectQuery:
        target: parallax.compatibility.Mooring
        predicate:
          eq:
            attr: parallax.compatibility.Mooring.id
            value: 1
        temporal:
          transaction-time:
            asOf: latest
          valid-time:
            asOf: "2026-05-01T00:00:00.000000Z"
      roundTrips: 1
      note: no rectangle covers the excised window, and this read projects the Structured Column too
      statements:
        - sql:
            postgres: select t0.id, t0.from_z, t0.thru_z, t0.in_z, t0.out_z, not t0.payload is null, t0.payload from mooring t0 where t0.id = ? and t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?
            mariadb: select t0.id, t0.from_z, t0.thru_z, t0.in_z, t0.out_z, not t0.payload is null, t0.payload from mooring t0 where t0.id = ? and t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?
          binds: [1, "2026-05-01T00:00:00.000000Z", "2026-05-01T00:00:00.000000Z", infinity]
      expectRows: []
then:
  roundTrips: 5
