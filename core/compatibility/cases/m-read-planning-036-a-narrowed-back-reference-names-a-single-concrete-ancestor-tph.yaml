model: models/keeper.yaml
tags: [m-read-planning, m-inheritance, m-object-query, table-per-hierarchy, back-reference, narrow, relationship, graph, slice-snapshot-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "deep-fetch child levels - each level's binds are the keys gathered from the level above it"
when:
  objectQuery:
    target: parallax.compatibility.Task
    predicate:
      "true": {}
    includes:
      - segments:
          - rel: parallax.compatibility.Task.crew
            narrowTo: [parallax.compatibility.Cook]
          - rel: parallax.compatibility.Crew.tasks
          - rel: parallax.compatibility.Task.crew
            narrowTo: [parallax.compatibility.Cook, parallax.compatibility.Pilot]
then:
  statements:
    - sql:
        postgres: select t0.id, t0.crew_id, t0.label from crew_task t0
    - sql:
        postgres: select t0.id, t0.name from crew t0 where t0.id = any(cast(? as bigint[])) and t0.kind = ?
      binds: [[1, 2, 3], cook]
    - sql:
        postgres: select t0.id, t0.crew_id, t0.label from crew_task t0 where t0.crew_id = any(cast(? as bigint[])) order by t0.id asc
      binds: [[1]]
  graph:
    Task:
      - id: 21
        crewId: 1
        label: galley
        "crew[Cook]":
          id: 1
          name: Cal
          tasks:
            - id: 21
              crewId: 1
              label: galley
              "crew[Cook,Pilot]": { id: 1, name: Cal, familyVariant: Cook }
      - id: 22
        crewId: 2
        label: triage
        "crew[Cook]": null
      - id: 23
        crewId: 3
        label: approach
        "crew[Cook]": null
  databaseCalls: 3
