          until: "2024-09-01T00:00:00.000000Z"
          at: "2024-11-02T00:00:00.000000Z"
      note: "in March spans 3 and 9 already hold 150: each keeps every rectangle holding 150, and only span 3's [August, infinity) at 200 changes"
