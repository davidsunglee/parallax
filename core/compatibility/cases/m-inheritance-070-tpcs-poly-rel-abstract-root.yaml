# Polymorphic relationship over a TABLE-PER-CONCRETE-SUBTYPE family, targeting the
# abstract ROOT (m-navigate, m-inheritance, m-sql, resolved Q7).
model: models/document.yaml
tags: [m-navigate, m-inheritance, m-sql, table-per-concrete-subtype, polymorphic, exists, slice-snapshot-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Folder
    predicate:
      any:
        path: parallax.compatibility.Folder.documents
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name from px.folder t0 where (exists (select 1 from px.invoice t1 where t1.folder_id = t0.id) or exists (select 1 from px.memo t2 where t2.folder_id = t0.id) or exists (select 1 from px.receipt t3 where t3.folder_id = t0.id))
  referenceSql: select id, name from px.folder where id in (select folder_id from px.invoice) or id in (select folder_id from px.memo) or id in (select folder_id from px.receipt)
  rows:
    - { id: 100, name: Alpha }
    - { id: 101, name: Beta }
    - { id: 102, name: Gamma }
  databaseCalls: 1
