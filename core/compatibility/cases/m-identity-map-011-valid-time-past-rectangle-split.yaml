# A finite Valid-Time-axis pinned view is WRITABLE (m-identity-map): mutating a view
# pinned at a finite Valid-Time-axis instant is the retroactive correction that lowers
# to the m-bitemp-write RECTANGLE SPLIT. (Contrast a finite Transaction-Time-axis pin,
# which is read-only — m-identity-map-010.)
model: models/position.yaml
tags: [m-identity-map, m-edit, m-bitemp-write, m-temporal-read, identity, bitemporal, temporal, rectangle-split, scenario, slice-managed-1]
shape: scenario
when:
  uow:
    concurrency: optimistic
  scenario:
    - write: insert
      roundTrips: 1
      note: establish a fresh managed Position id 2 as one clean Latest rectangle (value 100, both axes current)
      statements:
        - sql:
            postgres: insert into position(pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
          binds: [2, A, "100.00", "2024-01-01T00:00:00.000000Z", infinity, "2024-01-01T00:00:00.000000Z", infinity]
    - objectQuery:
        target: parallax.compatibility.Position
        predicate:
          eq:
            attr: parallax.compatibility.Position.id
            value: 2
        temporal:
          transaction-time:
            asOf: latest
          valid-time:
            asOf: "2024-03-01T00:00:00.000000Z"
      roundTrips: 1
      note: pin id 2 at the finite Valid-Time instant 2024-03-01 (Transaction Time latest) — a WRITABLE Valid-Time-past view (100)
      statements:
        - sql:
            postgres: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? and t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?
          binds: [2, "2024-03-01T00:00:00.000000Z", "2024-03-01T00:00:00.000000Z", infinity]
      expectRows:
        - { pos_id: 2, acct_num: A, val: "100.00", from_z: "2024-01-01T00:00:00.000000Z", thru_z: infinity, in_z: "2024-01-01T00:00:00.000000Z", out_z: infinity }
    - action: mutate
      "on": 1
      set:
        value: "200.00"
      roundTrips: 0
      note: buffer the retroactive correction to 200 over the Valid-Time window [2024-03-01, 2024-09-01) — no DML yet
    - action: flush
      "on": 1
      roundTrips: 4
      note: the correction lowers to the m-bitemp-write rectangle split — inactivate the original, then chain head / middle / tail
      statements:
        - sql:
            postgres: update position set out_z = ? where pos_id = ? and thru_z = ? and out_z = ?
          binds: ["2024-02-15T00:00:00.000000Z", 2, infinity, infinity]
        - sql:
            postgres: insert into position(pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
          binds: [2, A, "100.00", "2024-01-01T00:00:00.000000Z", "2024-03-01T00:00:00.000000Z", "2024-02-15T00:00:00.000000Z", infinity]
        - sql:
            postgres: insert into position(pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
          binds: [2, A, "200.00", "2024-03-01T00:00:00.000000Z", "2024-09-01T00:00:00.000000Z", "2024-02-15T00:00:00.000000Z", infinity]
        - sql:
            postgres: insert into position(pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
          binds: [2, A, "100.00", "2024-09-01T00:00:00.000000Z", infinity, "2024-02-15T00:00:00.000000Z", infinity]
    - objectQuery:
        target: parallax.compatibility.Position
        predicate:
          eq:
            attr: parallax.compatibility.Position.id
            value: 2
        temporal:
          transaction-time:
            asOf: latest
          valid-time:
            asOf: "2024-04-01T00:00:00.000000Z"
      roundTrips: 1
      note: re-read inside the corrected window (Valid Time 2024-04-01, Transaction Time latest) -> the MIDDLE's new value 200
      statements:
        - sql:
            postgres: select t0.pos_id, t0.acct_num, t0.val, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from position t0 where t0.pos_id = ? and t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?
          binds: [2, "2024-04-01T00:00:00.000000Z", "2024-04-01T00:00:00.000000Z", infinity]
      expectRows:
        - { pos_id: 2, acct_num: A, val: "200.00", from_z: "2024-03-01T00:00:00.000000Z", thru_z: "2024-09-01T00:00:00.000000Z", in_z: "2024-02-15T00:00:00.000000Z", out_z: infinity }
then:
  roundTrips: 7
