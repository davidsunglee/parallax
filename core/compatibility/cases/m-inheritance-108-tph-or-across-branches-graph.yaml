# Table-per-hierarchy OR across two concrete-subtype branches, INSTANCE-FORM sibling:
# the developer-surface per-variant node shape (m-inheritance, m-predicate,
# m-case-format, m-sql).
#
# Same model, same query, and BYTE-IDENTICAL golden SQL as the row-form original
# (`m-inheritance-015`) — Animal declares no value objects, so the instance-form
# Document-slot delta is empty. `then.graph` asserts the per-variant node shape: Rex (Dog)
# carries NO `indoor` / `tusk_length` keys; Whiskers (Cat) carries NO `bark_volume` /
# `tusk_length` keys. `m-inheritance-015` remains the values-lane witness.
model: models/animal.yaml
tags: [m-inheritance, m-predicate, m-sql, table-per-hierarchy, narrow, familyVariant, graph, instance-form, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Animal
    predicate:
      or:
        operands:
          - narrow:
              to:
                - parallax.compatibility.Dog
              operand:
                greaterThan:
                  attr: parallax.compatibility.Dog.barkVolume
                  value: 5
          - narrow:
              to:
                - parallax.compatibility.Cat
              operand:
                eq:
                  attr: parallax.compatibility.Cat.indoor
                  value: true
then:
  statements:
    - sql:
        postgres: select t0.id, t0.kind, t0.name, t0.owner_id, t0.license_id, t0.indoor, t0.bark_volume, t0.tusk_length from animal t0 where (t0.bark_volume > ? and t0.kind = ?) or (t0.indoor = ? and t0.kind = ?)
      binds: [5, dog, true, cat]
  referenceSql: select id, kind, name, owner_id, license_id, indoor, bark_volume, tusk_length from animal where (bark_volume > 5 and kind = 'dog') or (indoor = true and kind = 'cat')
  graph:
    Animal:
      - { id: 1, name: Rex, ownerId: 10, licenseId: L-100, barkVolume: 7, familyVariant: Dog }
      - { id: 3, name: Whiskers, ownerId: 10, licenseId: L-200, indoor: true, familyVariant: Cat }
  roundTrips: 1
