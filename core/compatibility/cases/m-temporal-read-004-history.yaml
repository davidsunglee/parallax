# history(transaction-time): the FULL milestone set, no as-of predicate injected.
model: models/balance.yaml
tags: [m-temporal-read, m-object-query, m-sql, history, audit-only, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Balance
    predicate:
      eq:
        attr: parallax.compatibility.Balance.id
        value: 1
    temporal:
      transaction-time:
        history: {}
then:
  statements:
    - sql:
        postgres: select t0.bal_id, t0.acct_num, t0.val, t0.in_z, t0.out_z from balance t0 where t0.bal_id = ?
      binds: [1]
  referenceSql: select bal_id, acct_num, val, in_z, out_z from balance where bal_id = 1
  rows:
    - { bal_id: 1, acct_num: A, val: "100.00", in_z: "2024-01-01T00:00:00.000000Z", out_z: "2024-06-01T00:00:00.000000Z" }
    - { bal_id: 1, acct_num: A, val: "150.00", in_z: "2024-06-01T00:00:00.000000Z", out_z: infinity }
  roundTrips: 1
