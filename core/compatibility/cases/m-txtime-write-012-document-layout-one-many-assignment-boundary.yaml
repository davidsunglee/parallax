# One temporal observation-bearing assignment applies the two occurrence rules at
# once on PostgreSQL and MariaDB: a `one` recursively patches its named declared
# member and preserves the stored undeclared `sealNumber`, while a `many` replaces
# its ordered array whole and therefore drops the stored element's undeclared
# `berth`. The root-level undeclared `charterCode` survives both, distinguishing
# declared-member patching from whole-document replacement and positional array merge.
model: models/document-layout.yaml
tags: [m-txtime-write, m-storage-layout, m-document-codec, m-value-object, m-sql, write-sequence, update, audit-only, temporal, json, document-layout, slice-snapshot-1, slice-managed-1]
shape: writeSequence
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection concurrency/locking intent (given.apply)"
given:
  apply:
    - sql: insert into voyage(id, in_z, out_z, payload) values (?, ?, ?, ?)
      binds:
        - 8
        - "2026-01-01T00:00:00+00:00"
        - infinity
        - title: Island Run
          crew: 3
          charterCode: NB-204
          manifest:
            cargo: ore
            sealNumber: S-9930
          legs:
            - port: Oslo
              berth: B7
when:
  writeSequence:
    - mutation: update
      entity: parallax.compatibility.Voyage
      statements: 2
      note: assign one and many occurrences in the same observed successor
      rows:
        - id: 8
          title: Island Run
          crew: 3
          manifest:
            cargo: salt
          legs:
            - port: Bergen
      at: "2026-06-01T00:00:00+00:00"
then:
  statements:
    - sql:
        postgres: update voyage set out_z = ? where id = ? and out_z = ?
        mariadb: update voyage set out_z = ? where id = ? and out_z = ?
      binds: ["2026-06-01T00:00:00+00:00", 8, infinity]
    - sql:
        postgres: insert into voyage(id, in_z, out_z, payload) values (?, ?, ?, ?)
        mariadb: insert into voyage(id, in_z, out_z, payload) values (?, ?, ?, ?)
      binds:
        - 8
        - "2026-06-01T00:00:00+00:00"
        - infinity
        - title: Island Run
          crew: 3
          charterCode: NB-204
          manifest:
            cargo: salt
            sealNumber: S-9930
          legs:
            - port: Bergen
  tableState:
    voyage:
      - id: 8
        in_z: "2026-01-01T00:00:00+00:00"
        out_z: "2026-06-01T00:00:00+00:00"
        payload:
          title: Island Run
          crew: 3
          charterCode: NB-204
          manifest:
            cargo: ore
            sealNumber: S-9930
          legs:
            - port: Oslo
              berth: B7
      - id: 8
        in_z: "2026-06-01T00:00:00+00:00"
        out_z: infinity
        payload:
          title: Island Run
          crew: 3
          charterCode: NB-204
          manifest:
            cargo: salt
            sealNumber: S-9930
          legs:
            - port: Bergen
  roundTrips: 2
