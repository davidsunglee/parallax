# Position 2 held [January, infinity) in Valid Time and was known [March, August)
# before its termination. A reinsertion stamped at May would open a rectangle that
# overlaps the terminated one on both axes. The generated exclusion refuses it.
model: models/position.yaml
tags: [m-temporal-write, m-db-error, temporal, bitemporal, insert, constraintViolation, slice-snapshot-1, slice-managed-1]
shape: error
then:
  statements:
    - sql:
        postgres: insert into position(pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
      binds: [2, B, "10.00", "2024-01-01T00:00:00.000000Z", infinity, "2024-03-01T00:00:00.000000Z", "2024-08-01T00:00:00.000000Z"]
    - sql:
        postgres: insert into position(pos_id, acct_num, val, from_z, thru_z, in_z, out_z) values (?, ?, ?, ?, ?, ?, ?)
      binds: [2, B, "20.00", "2024-01-01T00:00:00.000000Z", infinity, "2024-05-01T00:00:00.000000Z", infinity]
  errorClass: constraintViolation
  nativeCode:
    postgres: "23P01"
