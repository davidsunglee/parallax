# Deep fetch from a root that ALSO orders and caps: the top-1 Policy (ordered by
# id, `limit 1`) as of Valid Time PAST 2024-03-01 / Transaction Time LATEST,
# eager-loading its coverages as of the SAME instant. Every clause is a SIBLING of
# the query's `temporal` map, so `orderBy` / `limit` / `includes` sit beside the
# Temporal Selection rather than around it: the root injects the Valid-Time-past
# predicate and collects the same as-of pins to PROPAGATE into the child level
# whatever other clauses the query carries.
#
# This catches a propagation-pin collector that derives the child pin from the
# root's ordering and cap rather than from the query's own Temporal Selection:
# such a collector finds no pin here and the child Coverage level wrongly defaults
# to Latest, returning coverage 10's CURRENT value 700 (C-R3) instead of the
# Valid-Time 2024-03-01 HEAD 600 (C-R2). The propagated child suffix is the
# ordered `[valid, valid, transaction]` binds `[B, B, infinity]`, appended after
# the IN list. Mirrors m-navigate-013 (Valid-Time-past deep fetch) but proves
# propagation is insensitive to the ordering and cap clauses; `limit 1` keeps only
# Policy 1.
model: models/policy.yaml
tags: [m-navigate, m-object-query, m-temporal-read, temporal, relationship, propagation, bitemporal, orderBy, limit, slice-snapshot-1, slice-managed-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "deep-fetch child level - the Policy.coverages IN-list binds are the distinct policy ids gathered from the ordered, top-1 root query result, so the child emissions depend on a query result"
when:
  objectQuery:
    target: parallax.compatibility.Policy
    predicate:
      all: {}
    temporal:
      transaction-time:
        asOf: latest
      valid-time:
        asOf: '2024-03-01T00:00:00+00:00'
    orderBy:
      - attr: parallax.compatibility.Policy.id
        direction: asc
    limit: 1
    includes:
      - segments:
          - rel: parallax.compatibility.Policy.coverages
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from policy t0 where t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ? order by t0.id asc limit ?
        mariadb: select t0.id, t0.name, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from policy t0 where t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ? order by t0.id asc limit ?
      binds: ["2024-03-01T00:00:00+00:00", "2024-03-01T00:00:00+00:00", infinity, 1]
    - sql:
        postgres: select t0.id, t0.policy_id, t0.amount, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from coverage t0 where t0.policy_id in (?) and t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?
        mariadb: select t0.id, t0.policy_id, t0.amount, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from coverage t0 where t0.policy_id in (?) and t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?
      binds: [1, "2024-03-01T00:00:00+00:00", "2024-03-01T00:00:00+00:00", infinity]
  graph:
    Policy:
      - id: 1
        name: Auto
        from_z: "2024-01-01T00:00:00+00:00"
        thru_z: infinity
        in_z: "2024-01-01T00:00:00+00:00"
        out_z: infinity
        coverages:
          - { id: 10, policy_id: 1, amount: 600.00, from_z: "2024-01-01T00:00:00+00:00", thru_z: "2024-06-01T00:00:00+00:00", in_z: "2024-04-01T00:00:00+00:00", out_z: infinity }
  roundTrips: 2
