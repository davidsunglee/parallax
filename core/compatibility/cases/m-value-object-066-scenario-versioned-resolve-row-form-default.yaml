# Scenario-step ROW-FORM DEFAULT over a value-object-bearing VERSIONED entity
# (m-value-object + m-opt-lock + m-unit-work + m-sql "Read result form"): the internal
# materialized-predicate-write resolving read OMITS the owner's `address` Document
# slot, while the managed find one step earlier — the SAME query over the SAME
# row — projects it. Postgres AND MariaDB.
model: models/subscriber.yaml
tags: [m-value-object, m-opt-lock, m-sql, m-unit-work, json, materialize, predicate-write, scenario, slice-snapshot-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "predicate write materializes per-row from a resolving read - per-row binds (matched keys / observed version) depend on the query result"
when:
  uow:
    concurrency: optimistic
  scenario:
    - objectQuery:
        target: parallax.compatibility.Subscriber
        predicate:
          all: {}
      roundTrips: 1
      note: managed find materializes the owner WITH its address Document slot — INSTANCE-FORM
      statements:
        - sql:
            postgres: select t0.id, t0.version, not t0.address is null, t0.address from subscriber t0
            mariadb: select t0.id, t0.version, not t0.address is null, t0.address from subscriber t0
      referenceSql: select id, version, address from subscriber
      expectRows:
        - id: 1
          version: 1
          address:
            street: 1 Elm St
            city: Rome
            geo:
              country: IT
    - objectQuery:
        target: parallax.compatibility.Subscriber
        predicate:
          all: {}
      roundTrips: 1
      note: the predicate-write resolving read is ROW-FORM and projects pk + version only — a Version Observation retains no predecessor row, so the address Document slot stays out
      statements:
        - sql:
            postgres: select t0.id, t0.version from subscriber t0
            mariadb: select t0.id, t0.version from subscriber t0
      referenceSql: select id, version from subscriber
      expectRows:
        - { id: 1, version: 1 }
    - write:
        mutation: delete
        target:
          entity: parallax.compatibility.Subscriber
          predicate:
            all: {}
      roundTrips: 1
      note: remove the resolved row under its own observed version — one keyed, version-gated delete per resolved row, planned from step 1's two columns alone
      statements:
        - sql:
            postgres: delete from subscriber where id = ? and version = ?
            mariadb: delete from subscriber where id = ? and version = ?
          binds: [1, 1]
    - objectQuery:
        target: parallax.compatibility.Subscriber
        predicate:
          all: {}
      roundTrips: 1
      note: verify (INSTANCE-FORM, the same golden as step 0) — the gated delete removed the row, so the read returns nothing
      statements:
        - sql:
            postgres: select t0.id, t0.version, not t0.address is null, t0.address from subscriber t0
            mariadb: select t0.id, t0.version, not t0.address is null, t0.address from subscriber t0
      referenceSql: select id, version, address from subscriber
      expectRows: []
then:
  roundTrips: 4
