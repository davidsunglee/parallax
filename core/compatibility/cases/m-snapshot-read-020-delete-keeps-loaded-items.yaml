# Deletion distinguishes a captured relationship value from a view that
# retains keys and resolves them again after the write.
model: models/orders.yaml
tags: [m-snapshot-read, m-deep-fetch, m-unit-work, closed-world, relationship, delete, scenario, slice-snapshot-1]
shape: scenario
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "include level - the Order.items child IN-list binds are the distinct root keys gathered from step 0's own root read, so the child emission depends on a query result"
when:
  scenario:
    - objectQuery:
        target: parallax.compatibility.Order
        predicate:
          eq:
            attr: parallax.compatibility.Order.id
            value: 1
        includes:
          - segments:
              - rel: parallax.compatibility.Order.items
      roundTrips: 2
      note: materialize a snapshot of order 1 WITH its line items (1 + L levels)
      statements:
        - sql:
            postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 where t0.id = ?
          binds: [1]
        - sql:
            postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id = any(?) order by t0.id desc
          binds: [[1]]
      expectRows:
        - { id: 1, name: Ada, sku: A-100, qty: 5, price: "10.50", active: true, ordered_on: 2024-01-05 }
    - write:
        - mutation: delete
          entity: parallax.compatibility.OrderItem
          rows:
            - { id: 11 }
      roundTrips: 2
      note: destroy the very row the loaded `items` view holds - one DML statement plus the resolving read the keyed delete owes
      statements:
        - sql:
            postgres: delete from order_item where id = ?
          binds: [11]
    - action: access
      "on": 0
      path: items
      roundTrips: 0
      sameObjectAs: 0
      note: access the ALREADY-MATERIALIZED items after the delete -> ZERO SQL and the destroyed row still among them
      expectGraph:
        OrderItem:
          - { id: 12, orderId: 1, sku: B-200, quantity: 1, shippedOn: 2024-02-15 }
          - { id: 11, orderId: 1, sku: A-100, quantity: 2, shippedOn: null }
    - objectQuery:
        target: parallax.compatibility.OrderItem
        predicate:
          eq:
            attr: parallax.compatibility.OrderItem.orderId
            value: 1
      roundTrips: 1
      note: observing the write means issuing another read - the same relationship's rows, re-read, hold item 12 alone
      expectRows:
        - { id: 12, order_id: 1, sku: B-200, quantity: 1, shipped_on: 2024-02-15 }
      statements:
        - sql:
            postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.order_id = ?
          binds: [1]
then:
  roundTrips: 5
