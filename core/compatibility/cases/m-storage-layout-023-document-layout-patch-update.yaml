# An UPDATE of a document-mapped Entity PATCHES the assigned paths and leaves every
# other key of the document standing (m-storage-layout x m-dialect *Document
# mutation-expression form*), on Postgres AND MariaDB.
model: models/document-layout.yaml
tags: [m-storage-layout, m-dialect, m-document-codec, m-sql, write-sequence, update, json, document-layout, slice-snapshot-1]
shape: writeSequence
when:
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.Traveler
      statements: 1
      note: seed one complete row so the update has keys it must NOT touch
      rows:
        - id: 6
          displayName: Frida
          score: 4
          joinedOn: '2026-04-01'
          note: west wing
          address:
            city: Alta
            geo:
              country: "NO"
          tags:
            - { label: scout }
    - mutation: amend
      entity: parallax.compatibility.Traveler
      statements: 1
      note: assign two scalars — two ordered path patches inside the one Structured Column
      rows:
        - id: 6
          displayName: Dagny
          score: 21
then:
  statements:
    - sql:
        postgres: insert into px.traveler(id, payload) values (?, ?)
        mariadb: insert into px.traveler(id, payload) values (?, ?)
      binds:
        - 6
        - displayName: Frida
          score: 4
          joinedOn: '2026-04-01'
          note: west wing
          address:
            city: Alta
            geo:
              country: "NO"
          tags:
            - { label: scout }
    - sql:
        postgres: update px.traveler set payload = payload || cast(? as jsonb) where id = ?
        mariadb: update px.traveler set payload = json_set(payload, ?, json_extract(?, '$'), ?, json_extract(?, '$')) where id = ?
      binds:
        postgres: [{ displayName: Dagny, score: 21 }, 6]
        mariadb: ['$.displayName', Dagny, '$.score', 21, 6]
  tableState:
    px:
      traveler:
        - id: 6
          payload:
            displayName: Dagny
            score: 21
            joinedOn: '2026-04-01'
            note: west wing
            address:
              city: Alta
              geo:
                country: "NO"
            tags:
              - { label: scout }
  databaseCalls: 3
