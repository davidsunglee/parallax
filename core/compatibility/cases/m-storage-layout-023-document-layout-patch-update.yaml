# An UPDATE of a document-mapped Entity PATCHES the assigned paths and leaves every
# other key of the document standing (m-storage-layout x m-dialect *Document
# mutation-expression form*), on Postgres AND MariaDB.
model: models/document-layout.yaml
tags: [m-storage-layout, m-dialect, m-document-codec, m-sql, write-sequence, update, json, document-layout, slice-snapshot-1, slice-managed-1]
shape: writeSequence
when:
  writeSequence:
    - mutation: insert
      entity: parallax.compatibility.Traveler
      statements: 1
      note: seed one complete row so the update has keys it must NOT touch
      rows:
        - id: 6
          displayName: Frida
          score: 4
          joinedOn: '2026-04-01'
          note: west wing
          address:
            city: Alta
            geo:
              country: "NO"
          tags:
            - { label: scout }
    - mutation: update
      entity: parallax.compatibility.Traveler
      statements: 1
      note: assign two scalars — two ordered path patches inside the one Structured Column
      rows:
        - id: 6
          displayName: Dagny
          score: 21
then:
  statements:
    - sql:
        postgres: insert into traveler(id, payload) values (?, ?)
        mariadb: insert into traveler(id, payload) values (?, ?)
      binds:
        - 6
        - displayName: Frida
          score: 4
          joinedOn: '2026-04-01'
          note: west wing
          address:
            city: Alta
            geo:
              country: "NO"
          tags:
            - { label: scout }
    - sql:
        postgres: update traveler set payload = jsonb_set(jsonb_set(payload, ?, cast(? as jsonb)), ?, cast(? as jsonb)) where id = ?
        mariadb: update traveler set payload = json_set(payload, ?, json_extract(?, '$'), ?, json_extract(?, '$')) where id = ?
      binds:
        postgres: ['{displayName}', Dagny, '{score}', 21, 6]
        mariadb: ['$.displayName', Dagny, '$.score', 21, 6]
  tableState:
    traveler:
      - id: 6
        payload:
          displayName: Dagny
          score: 21
          joinedOn: '2026-04-01'
          note: west wing
          address:
            city: Alta
            geo:
              country: "NO"
          tags:
            - { label: scout }
  roundTrips: 3
