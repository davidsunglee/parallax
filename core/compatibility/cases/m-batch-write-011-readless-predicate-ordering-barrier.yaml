# A readless predicate write is an ordering barrier (m-unit-work, m-batch-write,
# ADR 0043): buffered in one unit of work between keyed writes, it keeps its
# authored position in the flush. The delete before it is not moved after it,
# and the inserts after it are not moved before it, although insert-before-delete
# and foreign-key ordering would otherwise reorder all three; foreign-key ordering
# still applies within the region after it.
model: models/orders.yaml
tags: [m-batch-write, m-unit-work, m-sql, predicate-write, readless, fk-ordering, scenario, slice-snapshot-1]
shape: scenario
given:
  fixtures: true
when:
  scenario:
    - uow: barrier
      objectQuery:
        target: parallax.compatibility.OrderItem
        predicate:
          eq:
            attr: parallax.compatibility.OrderItem.id
            value: 12
      roundTrips: 1
      note: observe line item 12 inside the unit of work, so the delete below has a source
      statements:
        - sql:
            postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 where t0.id = ? for share of t0
          binds: [12]
      expectRows:
        - { id: 12, order_id: 1, sku: B-200, quantity: 1, shipped_on: 2024-02-15 }
    - uow: barrier
      write:
        - mutation: delete
          entity: parallax.compatibility.OrderItem
          rows:
            - { id: 12 }
      roundTrips: 1
      note: buffered before the barrier, so it is delivered before it rather than after every insert
      statements:
        - sql:
            postgres: delete from order_item where id = ?
          binds: [12]
    - uow: barrier
      write:
        mutation: update
        target:
          entity: parallax.compatibility.OrderItem
          predicate:
            lessThan: { attr: parallax.compatibility.OrderItem.quantity, value: 3 }
        assignments:
          - { attr: parallax.compatibility.OrderItem.sku, value: Z }
      roundTrips: 1
      note: the readless barrier; it matches item 11 alone, because item 12 is already deleted and item 13 is not yet inserted
      statements:
        - sql:
            postgres: update order_item set sku = ? where quantity < ?
          binds: [Z, 3]
    - uow: barrier
      write:
        - mutation: insert
          entity: parallax.compatibility.OrderItem
          rows:
            - { id: 13, orderId: 7, sku: N-13, quantity: 1 }
        - mutation: insert
          entity: parallax.compatibility.Order
          rows:
            - { id: 7, name: Barrier, sku: G-7, qty: 1, price: "1.00", active: true, orderedOn: "2024-09-01" }
      roundTrips: 2
      note: buffered after the barrier and delivered after it, parent Order before the line item that references it; the unit of work commits after this, its last step
      statements:
        - sql:
            postgres: insert into orders(id, name, sku, qty, price, active, ordered_on) values (?, ?, ?, ?, ?, ?, ?)
          binds: [7, Barrier, G-7, 1, "1.00", true, 2024-09-01]
        - sql:
            postgres: insert into order_item(id, order_id, sku, quantity) values (?, ?, ?, ?)
          binds: [13, 7, N-13, 1]
then:
  roundTrips: 5
  tableState:
    orders:
      - { id: 1, name: Ada, sku: A-100, qty: 5, price: "10.50", active: true, ordered_on: 2024-01-05 }
      - { id: 2, name: Linus, sku: B-200, qty: 10, price: "20.00", active: true, ordered_on: 2024-02-10 }
      - { id: 3, name: ada, sku: A-300, qty: 15, price: "30.25", active: false, ordered_on: 2024-03-15 }
      - { id: 4, name: Margaret, sku: null, qty: 20, price: "40.00", active: true, ordered_on: 2024-04-20 }
      - { id: 5, name: Alan, sku: "C_50%", qty: 25, price: "50.75", active: false, ordered_on: 2024-05-25 }
      - { id: 7, name: Barrier, sku: G-7, qty: 1, price: "1.00", active: true, ordered_on: 2024-09-01 }
      - { id: 42, name: Grace, sku: A-999, qty: 30, price: "99.99", active: true, ordered_on: 2024-06-30 }
    order_item:
      - { id: 11, order_id: 1, sku: Z, quantity: 2, shipped_on: null }
      - { id: 13, order_id: 7, sku: N-13, quantity: 1, shipped_on: null }
      - { id: 21, order_id: 2, sku: A-300, quantity: 4, shipped_on: 2024-02-20 }
      - { id: 421, order_id: 42, sku: A-999, quantity: 3, shipped_on: 2024-03-10 }
      - { id: 422, order_id: 42, sku: B-200, quantity: 5, shipped_on: 2024-02-05 }
