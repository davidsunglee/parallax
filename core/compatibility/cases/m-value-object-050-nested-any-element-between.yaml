# valueObject to-many range: nestedBetween through a `many` segment is ANY-ELEMENT,
# and ONE element must satisfy the WHOLE range (m-predicate nested range +
# any-element, m-sql, m-dialect array-traversal form). Postgres golden only — a
# non-equality element predicate is outside MariaDB's containment scope (m-dialect,
# "Scope of the containment golden").
model: models/customer.yaml
tags: [m-value-object, m-predicate, m-sql, m-dialect, nested, json, to-many, any-element, between, array-traversal, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Customer
    predicate:
      nestedBetween:
        path: parallax.compatibility.Customer.address.phones.number
        lower: 555-0000
        upper: 555-1234
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name from customer t0 where exists (select 1 from jsonb_array_elements(case when jsonb_typeof(jsonb_extract_path(t0.address, ?)) = ? then jsonb_extract_path(t0.address, ?) else cast(? as jsonb) end) t1 where jsonb_extract_path_text(t1.value, ?) between ? and ?)
      binds: [phones, 'array', phones, '[]', number, '555-0000', '555-1234']
  referenceSql:
    postgres: select id, name from customer where jsonb_typeof(address -> 'phones') = 'array' and exists (select 1 from jsonb_array_elements(address -> 'phones') e where e.value ->> 'number' >= '555-0000' and e.value ->> 'number' <= '555-1234')
  rows:
    - { id: 1, name: Ada }
    - { id: 7, name: Nils }
  roundTrips: 1
