# Provisioning two Transaction-Time owners that declare one table name and one
# key shape into two schemas (m-model-evolution, m-schema-delta,
# m-database-binding): every derived temporal constraint name hashes the
# physical local name and the constraint's columns alone, so both tables carry
# identical key, check, and exclusion names. PostgreSQL scopes the key's and the
# exclusion's backing indices by schema, so the repeated names are legal and
# the census reports no collision. The authored indices share an authored name
# but not an owner, so their Physical Index Names differ.
tags: [m-model-evolution, m-schema-delta, m-database-binding, m-storage-layout, evolution, provisioning, index, temporal, unique-index, slice-snapshot-1]
shape: evolution
when:
  evolve:
    earlier: null
    later: models/binding-temporal-ledgers.yaml
    laterBinding:
      postgres:
        format_version: 1
        backend: postgres
        default: { schema: px }
        entities:
          parallax.compatibility.AuditHandle: { schema: px_audit }
      mariadb:
        format_version: 1
        backend: mariadb
        default: { database: px }
        entities:
          parallax.compatibility.AuditHandle: { database: px_audit }
then:
  evolution:
    kind: unilateral
    operations:
      - { kind: EntityAdded, entity: parallax.compatibility.AuditHandle }
      - { kind: EntityAdded, entity: parallax.compatibility.SalesHandle }
    behavioralImpacts: []
    overlapVisibleOperations: []
    coordinationRequirements: []
  schema:
    postgres:
      delta:
        statements:
          - create extension if not exists btree_gist
          - create table px.handle (id bigint not null, code varchar(32) not null, in_z timestamptz not null, out_z timestamptz not null, constraint pxc_pk_handle_7a967d7f73cd2d6b1bbee9e23f1cf322 primary key (id, out_z), constraint pxc_tx_handle_07f656064abe6946ab5554b0cc0e30ae check (in_z < out_z), constraint pxc_excl_handle_b194b170815bec658081075611f51cfd exclude using gist (id with =, tstzrange(in_z, out_z) with &&))
          - create unique index pxi_handle_parallax_compatibil_74fe5a62eac927285e79a21dc0f5497e on px.handle (code, out_z)
          - create table px_audit.handle (id bigint not null, code varchar(32) not null, in_z timestamptz not null, out_z timestamptz not null, constraint pxc_pk_handle_7a967d7f73cd2d6b1bbee9e23f1cf322 primary key (id, out_z), constraint pxc_tx_handle_07f656064abe6946ab5554b0cc0e30ae check (in_z < out_z), constraint pxc_excl_handle_b194b170815bec658081075611f51cfd exclude using gist (id with =, tstzrange(in_z, out_z) with &&))
          - create unique index pxi_handle_parallax_compatibil_ff8af8542cec1cd01bb73f2c947908a5 on px_audit.handle (code, out_z)
        createdIndices:
          - physicalIndexName: pxi_handle_parallax_compatibil_74fe5a62eac927285e79a21dc0f5497e
            physicalTable: { qualifier: [px], name: handle }
            logicalIndexIdentity: parallax.compatibility.SalesHandle.handle_code
            unique: true
          - physicalIndexName: pxi_handle_parallax_compatibil_ff8af8542cec1cd01bb73f2c947908a5
            physicalTable: { qualifier: [px_audit], name: handle }
            logicalIndexIdentity: parallax.compatibility.AuditHandle.handle_code
            unique: true
    mariadb:
      delta:
        statements:
          - create table px.handle (id bigint not null, code varchar(32) not null, in_z datetime(6) not null, out_z datetime(6) not null, primary key (id, out_z))
          - create unique index pxi_handle_parallax_compatibili_74fe5a62eac927285e79a21dc0f5497e on px.handle (code, out_z)
          - create table px_audit.handle (id bigint not null, code varchar(32) not null, in_z datetime(6) not null, out_z datetime(6) not null, primary key (id, out_z))
          - create unique index pxi_handle_parallax_compatibili_ff8af8542cec1cd01bb73f2c947908a5 on px_audit.handle (code, out_z)
        createdIndices:
          - physicalIndexName: pxi_handle_parallax_compatibili_74fe5a62eac927285e79a21dc0f5497e
            physicalTable: { qualifier: [px], name: handle }
            logicalIndexIdentity: parallax.compatibility.SalesHandle.handle_code
            unique: true
          - physicalIndexName: pxi_handle_parallax_compatibili_ff8af8542cec1cd01bb73f2c947908a5
            physicalTable: { qualifier: [px_audit], name: handle }
            logicalIndexIdentity: parallax.compatibility.AuditHandle.handle_code
            unique: true
