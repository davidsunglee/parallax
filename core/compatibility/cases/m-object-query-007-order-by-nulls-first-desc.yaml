# orderBy DESCENDING with `nulls: first` over a NULLABLE key — the fourth and last
# direction/placement combination, proven on BOTH dialects (m-object-query orderBy +
# m-dialect NULL ordering).
#
# This is the row of the table where MariaDB carries the whole compensation: it treats
# NULL as smallest, so `desc` would trail NULLs, and it has no NULLS FIRST syntax —
# the leading rank term `not t0.sku is null` (the m-sql normalizer's canonical
# spelling of `is not null`) pulls the NULL row to the front instead. Postgres treats
# NULL as largest and already leads with it on `desc`, emitting nothing. `limit 2`
# makes the placement observable through row MEMBERSHIP, since top-level row
# comparison is order-insensitive: order 4 (no sku) takes the slot the canonical
# nulls-last default would have given to the second-largest sku, which is how this
# case separates from m-object-query-005.
model: models/orders.yaml
tags: [m-object-query, m-predicate, m-dialect, orderBy, ordering, nulls, nullable, limit, directive, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Order
    predicate:
      all: {}
    orderBy:
      - attr: parallax.compatibility.Order.sku
        direction: desc
        nulls: first
    limit: 2
then:
  statements:
    - sql:
        postgres: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 order by t0.sku desc limit ?
        mariadb: select t0.id, t0.name, t0.sku, t0.qty, t0.price, t0.active, t0.ordered_on from orders t0 order by not t0.sku is null, t0.sku desc limit ?
      binds: [2]
  referenceSql: select id, name, sku, qty, price, active, ordered_on from orders order by case when sku is null then 0 else 1 end, sku desc limit 2
  rows:
    - { id: 4, name: Margaret, sku: null, qty: 20, price: "40.00", active: true, ordered_on: 2024-04-20 }
    - { id: 5, name: Alan, sku: "C_50%", qty: 25, price: "50.75", active: false, ordered_on: 2024-05-25 }
  roundTrips: 1
