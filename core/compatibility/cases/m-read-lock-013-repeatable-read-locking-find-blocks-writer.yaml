# A locking object find still holds its shared row lock when the unit of work asks
# for Repeatable Read (m-read-lock / m-unit-work). Round 1: transaction A, opened
# at `when.uow.isolation: repeatable-read`, issues the in-transaction shared read
# lock (`for share of t0` / `lock in share mode`) on account 2 and HOLDS. Round 2:
# transaction B updates account 2, blocks on A's shared lock, and raises
# lockWaitTimeout on the session's lowered lock-wait budget.
model: models/account.yaml
tags: [m-read-lock, m-unit-work, m-dialect, m-db-error, isolation, concurrency, locking-mode, lockWaitTimeout, slice-snapshot-1, slice-managed-1]
shape: error
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection concurrency/locking intent (when.concurrency)"
given:
  fixtures: true
when:
  uow:
    concurrency: locking
    isolation: repeatable-read
  concurrency:
    rounds:
      - A:
          statements:
            - sql:
                postgres: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.id = ? for share of t0
                mariadb: select t0.id, t0.owner, t0.balance, t0.version from account t0 where t0.id = ? lock in share mode
              binds: [2]
      - B:
          statements:
            - sql:
                postgres: update account set balance = ? where id = ?
                mariadb: update account set balance = ? where id = ?
              binds: ["999.00", 2]
then:
  errorClass: lockWaitTimeout
  nativeCode:
    postgres: "55P03"
    mariadb: 1205
