model: models/account.yaml
tags: [m-concurrency, m-unit-work, m-sql, write-sequence, slice-snapshot-1]
shape: writeSequence
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "the Locking target write acquires the row the fixtures stored before it writes, so its emissions depend on a query result"
given:
  fixtures: true
when:
  uow:
    concurrency: locking
  writeSequence:
    - mutation: delete
      entity: parallax.compatibility.Account
      statements: 1
      note: under Locking the caller's version is compared with the row an acquisition read under the shared lock, and the delete itself is ungated
      row: { id: 1 }
      ifVersion: 1
then:
  statements:
    - sql:
        postgres: delete from px.account where id = ?
      binds: [1]
  tableState:
    px:
      account:
        - { id: 2, owner: Linus, balance: "250.00", version: 1 }
        - { id: 3, owner: Grace, balance: "10.00", version: 1 }
  databaseCalls: 2
