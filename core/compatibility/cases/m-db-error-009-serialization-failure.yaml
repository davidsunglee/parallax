# Serializable refuses a nonserial committed result, and the refusal classifies to
# the retriable `deadlock` category on both engines (m-db-error). What the case
# grades is the portable promise of `when.uow.isolation: serializable` — that the
# committed participating transactions are equivalent to some serial order — never
# the mechanism either server reaches it by, which is why one choreography holds for
# both while `then.nativeCode` differs.
#
# The trigger is a write skew, distinct from the lock-cycle deadlock cases
# (m-db-error-004/005), which are ordinary row-lock contention at any level:
#   round 0 : A reads gauge 2, B reads gauge 1
#   round 1 : A writes gauge 1, B writes gauge 2 — each writing the row the peer
#             read, so no serial order of the two produces this pair of outcomes
#   round 2 : each node COMMITS its own held transaction (`kind: commit`), the
#             moment the refusal can surface at
#
# Postgres reaches it optimistically: SSI takes SIREAD predicate locks, nothing
# blocks, and the cycle is detected at commit as `40001`. MariaDB reaches it
# pessimistically: Serializable converts both plain SELECTs to shared locking reads,
# so round 1's crossed writes wait on each other and InnoDB victimizes one with
# `1213`. Either way exactly one node's transaction is refused; the runner classifies
# whichever is victimized.
model: models/error-cases.yaml
tags: [m-db-error, isolation, deadlock, serialization, slice-snapshot-1, slice-managed-1]
shape: error
compileEligibility:
  mode: run-only
  reason: single-connection
  note: "single-connection concurrency/locking intent (when.concurrency)"
given:
  fixtures: true
when:
  uow:
    isolation: serializable
  concurrency:
    rounds:
      - A:
          statements:
            - sql:
                postgres: select t0.id, t0.v from gauge t0 where t0.id = ?
                mariadb: select t0.id, t0.v from gauge t0 where t0.id = ?
              binds: [2]
        B:
          statements:
            - sql:
                postgres: select t0.id, t0.v from gauge t0 where t0.id = ?
                mariadb: select t0.id, t0.v from gauge t0 where t0.id = ?
              binds: [1]
      - A:
          statements:
            - sql:
                postgres: update gauge set v = ? where id = ?
                mariadb: update gauge set v = ? where id = ?
              binds: [11, 1]
        B:
          statements:
            - sql:
                postgres: update gauge set v = ? where id = ?
                mariadb: update gauge set v = ? where id = ?
              binds: [21, 2]
      - A:
          kind: commit
        B:
          kind: commit
then:
  errorClass: deadlock
  nativeCode:
    postgres: "40001"
    mariadb: 1213
