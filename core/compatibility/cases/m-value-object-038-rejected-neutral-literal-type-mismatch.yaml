# Negative (m-wire typed-literal conversion): a nested comparison whose literal
# cannot denote the declared attribute type is refused PRE-SQL.
model: models/customer.yaml
tags: [m-value-object, m-predicate, m-wire, rejected, negative, nested, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  objectQuery:
    target: parallax.compatibility.Customer
    predicate:
      nestedEq:
        path: parallax.compatibility.Customer.address.city
        value: 42
then:
  rejectedRule: neutral-literal-type-mismatch
