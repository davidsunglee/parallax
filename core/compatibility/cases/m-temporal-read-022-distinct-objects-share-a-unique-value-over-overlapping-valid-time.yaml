# Bitemporal uniqueness is per milestone end: two DISTINCT Assignments sharing
# the authored unique code Y are both current, over overlapping Valid Time with
# different Valid-Time ends. A read at Valid Time 2024-04-01 and Latest
# Transaction Time sees both, because the end-keyed unique index
# (code, thru_z, out_z) refuses equal ends, not overlapping ranges.
model: models/temporal-authored-index.yaml
tags: [m-temporal-read, m-object-query, m-sql, m-storage-layout, bitemporal, temporal, as-of, unique-index, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.Assignment
    predicate:
      "true": {}
    temporal:
      transaction-time:
        asOf: latest
      valid-time:
        asOf: "2024-04-01T00:00:00.000000Z"
then:
  statements:
    - sql:
        postgres: select t0.id, t0.code, t0.label, t0.rate, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from assignment t0 where t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?
        mariadb: select t0.id, t0.code, t0.label, t0.rate, t0.from_z, t0.thru_z, t0.in_z, t0.out_z from assignment t0 where t0.from_z <= ? and t0.thru_z > ? and t0.out_z = ?
      binds: ["2024-04-01T00:00:00.000000Z", "2024-04-01T00:00:00.000000Z", infinity]
  referenceSql:
    postgres: "select id, code, label, rate, from_z, thru_z, in_z, out_z from assignment where code = 'Y' and from_z <= '2024-04-01T00:00:00+00:00'::timestamptz and thru_z > '2024-04-01T00:00:00+00:00'::timestamptz and out_z = 'infinity'::timestamptz"
    mariadb: "select id, code, label, rate, from_z, thru_z, in_z, out_z from assignment where code = 'Y' and from_z <= '2024-04-01 00:00:00' and thru_z > '2024-04-01 00:00:00' and out_z > '9000-01-01'"
  rows:
    - { id: 1, code: Y, label: first, rate: 100, from_z: "2024-01-01T00:00:00.000000Z", thru_z: "2024-06-01T00:00:00.000000Z", in_z: "2024-01-01T00:00:00.000000Z", out_z: infinity }
    - { id: 2, code: Y, label: second, rate: 200, from_z: "2024-03-01T00:00:00.000000Z", thru_z: infinity, in_z: "2024-03-01T00:00:00.000000Z", out_z: infinity }
  databaseCalls: 1
