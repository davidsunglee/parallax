# A predicate on each child's to-one parent: the parent is present and its name is
# 'Ada'. Presence keeps the filter two-valued where the dotted comparison alone
# would be unknown for a child with no parent; the name is non-nullable.
model: models/orders.yaml
tags: [m-navigate, navigate, relationship, to-one, slice-snapshot-1, slice-managed-1]
shape: read
when:
  objectQuery:
    target: parallax.compatibility.OrderItem
    predicate:
      and:
        operands:
          - exists:
              path: parallax.compatibility.OrderItem.order
          - eq:
              path: parallax.compatibility.OrderItem.order.name
              value: Ada
then:
  statements:
    - sql:
        postgres: select t0.id, t0.order_id, t0.sku, t0.quantity, t0.shipped_on from order_item t0 left join orders t1 on t1.id = t0.order_id where not t1.id is null and t1.name = ?
      binds: [Ada]
  referenceSql: select id, order_id, sku, quantity, shipped_on from order_item where order_id in (select id from orders where name = 'Ada')
  rows:
    - { id: 11, order_id: 1, sku: A-100, quantity: 2, shipped_on: null }
    - { id: 12, order_id: 1, sku: B-200, quantity: 1, shipped_on: 2024-02-15 }
  databaseCalls: 1
