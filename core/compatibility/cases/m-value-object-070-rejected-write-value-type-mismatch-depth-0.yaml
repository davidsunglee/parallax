# Negative (m-value-object write validation, resolved Q7): a DEPTH-0 attribute value of
# the wrong declared type is refused PRE-SQL.
#
# `write-value-type-mismatch` is asked of every typed leaf the write row reaches, and
# the entity's own Attributes are leaves of it: the row is resolved against the written
# entity's declared structure, so a mistyped ENTITY attribute is refused exactly as
# m-value-object-043's mistyped DOCUMENT field is. Contact's `id` is an `int64`; this
# write supplies the STRING `"five"` for it. Every other member is present and
# well-typed, isolating the mismatch to `id`.
model: models/contact.yaml
tags: [m-value-object, rejected, negative, write, slice-snapshot-1, slice-managed-1]
shape: rejected
when:
  write:
    id: "five"
    name: Acme
    address:
      street: 1 Main St
      city: Oslo
      geo:
        country: "NO"
        point: { lat: 59.9, lon: 10.7 }
then:
  rejectedRule: write-value-type-mismatch
