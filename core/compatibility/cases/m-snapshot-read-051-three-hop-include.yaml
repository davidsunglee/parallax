model: models/predicate-traversal.yaml
tags: [m-snapshot-read, m-object-query, m-read-planning, m-inheritance, m-sql, table-per-concrete-subtype, union-all, deep-fetch, multi-hop, to-one, relationship, type-key, graph, slice-snapshot-1]
shape: read
compileEligibility:
  mode: run-only
  reason: query-result-dependent
  note: "deep-fetch child levels - the Parking, Vehicle, and Dealer key-set binds are the distinct non-null keys gathered from the rows of the level above, so each child emission depends on a query result"
when:
  objectQuery:
    target: parallax.compatibility.Ticket
    predicate:
      "true": {}
    includes:
      - segments:
          - rel: parallax.compatibility.Ticket.parking
          - rel: parallax.compatibility.Parking.vehicle
          - rel: parallax.compatibility.Vehicle.dealer
then:
  statements:
    - sql:
        postgres: select t0.id, t0.parking_id from px.traversal_ticket t0
        mariadb: select t0.id, t0.parking_id from px.traversal_ticket t0
    - sql:
        postgres: select t0.id, t0.vehicle_id from px.traversal_parking t0 where t0.id = any(cast(? as bigint[]))
        mariadb: select t0.id, t0.vehicle_id from px.traversal_parking t0 where t0.id in (?, ?, ?, ?)
      binds: { postgres: [[30, 31, 32, 33]], mariadb: [30, 31, 32, 33] }
    - sql:
        postgres: select t0.id, t0.maker, t0.dealer_id, t0.gears, cast(null as int) seats, 'Bike' family_variant from px.traversal_bike t0 where t0.id = any(cast(? as bigint[])) union all select t0.id, t0.maker, t0.dealer_id, cast(null as int) gears, t0.seats, 'Car' family_variant from px.traversal_car t0 where t0.id = any(cast(? as bigint[]))
        mariadb: select t0.id, t0.maker, t0.dealer_id, t0.gears, cast(null as signed) seats, 'Bike' family_variant from px.traversal_bike t0 where t0.id in (?, ?, ?) union all select t0.id, t0.maker, t0.dealer_id, cast(null as signed) gears, t0.seats, 'Car' family_variant from px.traversal_car t0 where t0.id in (?, ?, ?)
      binds: { postgres: [[5, 6, 7], [5, 6, 7]], mariadb: [5, 6, 7, 5, 6, 7] }
    - sql:
        postgres: select t0.id, t0.name from px.traversal_dealer t0 where t0.id = any(cast(? as bigint[]))
        mariadb: select t0.id, t0.name from px.traversal_dealer t0 where t0.id in (?, ?)
      binds: { postgres: [[40, 41]], mariadb: [40, 41] }
  referenceSql: select id, parking_id from px.traversal_ticket
  graph:
    Ticket:
      - id: 50
        parkingId: 30
        parking:
          id: 30
          vehicleId: 5
          vehicle:
            id: 5
            maker: Volvo
            dealerId: 40
            seats: 4
            _type: parallax.compatibility.Car
            dealer: { id: 40, name: Nordic }
      - id: 51
        parkingId: 31
        parking:
          id: 31
          vehicleId: 6
          vehicle:
            id: 6
            maker: Trek
            dealerId: 41
            gears: 21
            _type: parallax.compatibility.Bike
            dealer: { id: 41, name: Velo }
      - id: 52
        parkingId: 32
        parking: { id: 32, vehicleId: null, vehicle: null }
      - id: 53
        parkingId: 33
        parking:
          id: 33
          vehicleId: 7
          vehicle:
            id: 7
            maker: Saab
            dealerId: null
            seats: null
            _type: parallax.compatibility.Car
            dealer: null
      - id: 54
        parkingId: null
        parking: null
  databaseCalls: 4
