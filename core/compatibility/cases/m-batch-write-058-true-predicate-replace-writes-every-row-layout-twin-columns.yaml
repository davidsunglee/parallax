# Columns half of the whole-table predicate replacement proof: a predicate-selected
# replacement whose predicate is `true` writes the stated state over every row in
# one statement with no `where` clause, in Table Layout order. Its twin authors the
# same write under Relational Document Layout.
model: models/storage-layout-transparency-layout-twin-columns.yaml
tags: [m-batch-write, m-unit-work, m-storage-layout, m-document-codec, m-sql, predicate-write, readless, replace, scenario, update, layout-twin, columns, slice-snapshot-1, slice-managed-1]
shape: scenario
when:
  scenario:
    - write:
        mutation: replace
        target:
          entity: parallax.compatibility.LayoutTwinItem
          predicate:
            "true": {}
        row:
          rank: 30
          label: gamma
      databaseCalls: 1
      expectAffectedRows: 2
      statements:
        - sql:
            postgres: update storage_layout_transparency set label = ?, rank = ?
            mariadb: update storage_layout_transparency set label = ?, `rank` = ?
          binds: [gamma, 30]
then:
  databaseCalls: 1
  tableState:
    storage_layout_transparency:
      - { id: 1, label: gamma, rank: 30 }
      - { id: 2, label: gamma, rank: 30 }
