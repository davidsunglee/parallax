#   Fox  2 Bruno  brush red                (kind=fox)
#   Bear 3 Bruno  roar grr   leader Akela  (kind=bear — unknown to the reader)
#
# Fox 2 and Bear 3 share the name Bruno, so a predicate disjunct on the common
