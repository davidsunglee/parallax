# Fixture rows for the Position model (models/position.yaml) — the full bitemporal
# milestone history the both-axis as-of READ cases query.
#
# Keyed by class name; each row is a map of attribute-name -> value. Instant
# columns are authored as ISO-8601 UTC strings; the open upper bound is the
# literal `infinity`. The loader resolves attribute names to columns via the
# descriptor (validStart/validEnd -> from_z/thru_z, txStart/txEnd -> in_z/out_z).
#
# The history of position id 1 (acct A) records ONE in-the-world value that was first
# BELIEVED to be 90, then CORRECTED (known as of Transaction Time 2024-04-01) via a
# rectangle split into 100 before Valid Time 2024-06-01 and 200 from 2024-06-01 on:
#
#   R1  value 90   valid [2024-01-01, infinity)     transaction [2024-01-01, 2024-04-01)
#       — the original belief, SUPERSEDED on the Transaction-Time dimension (out_z finite).
#   R2  value 100  valid [2024-01-01, 2024-06-01)   transaction [2024-04-01, infinity)
#       — the rectangle-split HEAD: still 100 before the Valid-Time window, CURRENT.
#   R3  value 200  valid [2024-06-01, infinity)     transaction [2024-04-01, infinity)
#       — the corrected value from Valid Time 2024-06-01 onward, CURRENT.
#
# Both-axis reads discriminate, each returning a DISTINCT value:
#   valid-time=Latest  & transaction-time=Latest  -> R3 (200): true now AND known now.
#   valid-time=2024-03-01 & transaction-time=Latest -> R2 (100): the head, still current.
#   valid-time=2024-03-01 & transaction-time=2024-02-01 -> R1 (90): what the system BELIEVED
#       on 2024-02-01 about Valid Time 2024-03-01 — the audit (Transaction-Time) axis.
parallax.compatibility.Position:
  - id: 1
    acctNum: A
    value: "90.00"
    validStart: "2024-01-01T00:00:00.000000Z"
    validEnd: infinity
    txStart: "2024-01-01T00:00:00.000000Z"
    txEnd: "2024-04-01T00:00:00.000000Z"
  - id: 1
    acctNum: A
    value: "100.00"
    validStart: "2024-01-01T00:00:00.000000Z"
    validEnd: "2024-06-01T00:00:00.000000Z"
    txStart: "2024-04-01T00:00:00.000000Z"
    txEnd: infinity
  - id: 1
    acctNum: A
    value: "200.00"
    validStart: "2024-06-01T00:00:00.000000Z"
    validEnd: infinity
    txStart: "2024-04-01T00:00:00.000000Z"
    txEnd: infinity
