# Mixed-temporality fixtures. Lease 10 corrected 12mo -> 24mo (Transaction-Time dimension).
# Non-temporal Tenant + LeaseNote have no interval columns.
parallax.compatibility.Tenant:
  - { id: 1, name: Acme }
parallax.compatibility.Lease:
  - { id: 10, tenantId: 1, term: "12mo", txStart: "2024-01-01T00:00:00+00:00", txEnd: "2024-04-01T00:00:00+00:00" }
  - { id: 10, tenantId: 1, term: "24mo", txStart: "2024-04-01T00:00:00+00:00", txEnd: infinity }
parallax.compatibility.LeaseNote:
  - { id: 100, leaseId: 10, text: signed }
  - { id: 101, leaseId: 10, text: renewed }
