# Fixture rows for the Rate table-per-concrete-subtype BITEMPORAL model
# (models/rate.yaml) — the milestone history the temporal abstract-target `union all`
# read (m-inheritance-093) and the concrete-target reads (m-inheritance-100) query.
#
# Each concrete subtype owns its OWN table (deposit_rate / loan_rate), keyed by CONCRETE
# subtype (the abstract root Rate is rowless). There is no shared table and no tag.
# Interval columns are authored as ISO-8601 UTC strings; the open upper bound is the
# literal `infinity`. The loader resolves attribute names to columns
# (validStart/validEnd -> from_z/thru_z, txStart/txEnd -> in_z/out_z).
#
# DepositRate carries TWO Transaction-Time milestones sharing the SAME business key (id: 1)
# and the SAME Valid-Time interval ([2024-01-01, infinity) — no in-the-world change)
# but DIFFERENT `in_z` values: a CLOSED historical correction (Transaction Time [2024-01-01,
# 2024-02-01), amount 2.25 / grade B) and the CURRENT one (Transaction Time [2024-02-01,
# infinity), amount 2.50 / grade A). This is the fixture the TPCS provisioning DDL must
# key on `(id, from_z, in_z)` — not `(id)` — to admit at all (a single-column physical PK
# would reject the second row outright, m-descriptor). A read pinned Valid-Time-past
# 2024-06-01 / Transaction-Time Latest (m-inheritance-093, m-inheritance-100's default read) still
# resolves to exactly the CURRENT row (amount 2.50 / grade A), preserving m-inheritance-093's
# original current-result semantics; a read pinned Transaction-Time-past into the closed window
# (m-inheritance-100's historical read) resolves to the OTHER, superseded row instead.
#
# LoanRate stays a single fully-Latest rectangle (valid [2024-01-01, infinity),
# transaction [2024-01-01, infinity)) — an abstract read pinned Valid-Time-past 2024-06-01 /
# Transaction-Time Latest returns both branches' current rows, each carrying its per-branch
# familyVariant literal (DepositRate / LoanRate).
parallax.compatibility.DepositRate:
  - id: 1
    amount: "2.25"
    grade: B
    validStart: "2024-01-01T00:00:00.000000Z"
    validEnd: infinity
    txStart: "2024-01-01T00:00:00.000000Z"
    txEnd: "2024-02-01T00:00:00.000000Z"
  - id: 1
    amount: "2.50"
    grade: A
    validStart: "2024-01-01T00:00:00.000000Z"
    validEnd: infinity
    txStart: "2024-02-01T00:00:00.000000Z"
    txEnd: infinity
parallax.compatibility.LoanRate:
  - id: 2
    amount: "6.75"
    spread: "1.25"
    validStart: "2024-01-01T00:00:00.000000Z"
    validEnd: infinity
    txStart: "2024-01-01T00:00:00.000000Z"
    txEnd: infinity
