# Fixture rows for the Relational Document Layout model
# (models/document-layout.yaml).
#
# Each row is authored member by member, exactly as a `Columns`-layout fixture is:
# `joinedOn` is the ISO-8601 wire spelling a `date` Column would take, `score` a JSON
# number, `address` the occurrence's own document. The layout is what decides where
# each one lands, and the codec is what spells it — so this file states one logical
# row and never a physical document.
#
# The three Traveler rows are chosen so each of them discriminates a decision a case
# over this model makes, rather than merely populating the table:
#
#   id 1 Ada  score 7     joinedOn 2026-01-15  note "north wing"  address Oslo/NO
#   id 2 Bo   score 30    joinedOn 2025-12-31  note ABSENT        address Bergen/NO
#   id 3 Cyd  score null  joinedOn null        note JSON NULL     address null
#
# `note` is the presence pair: id 2 omits the key and id 3 writes an explicit JSON
# null, so `isNull(note)` MUST answer both and `isNotNull(note)` MUST answer Ada
# alone. A decode that told the two apart, or an extraction that handed back the four
# characters `null` for id 3, would answer differently on the two dialects rather than
# failing loudly.
#
# `score` is where the numeric family's cast is falsifiable: 30 > 7 as numbers and
# `"30" < "7"` as text, because a JSON number's integer part has no fixed width. So
# `greaterThan(score, 5)` answers both rows through the cast and Ada ALONE under a
# text comparison, and `score desc` puts Bo first through the cast and Ada first
# under a text ordering — a wrong lowering changes the answer instead of erroring.
#
# `tags` is omitted on ids 2 and 3: a `many` occurrence is never null, so the stored
# document carries the empty array either way (m-document-codec).
#
# The Trip rows hang off `Traveler.trips` and are chosen so a hop discriminates:
# Ada owns two, Bo owns one, and Cyd owns none, so `exists(Traveler.trips)` answers
# {1, 2} and a hop constrained to `destination = Oslo` answers Ada alone.
#
# The Ledger rows are the optimistic-lock pair, and their `label` is the presence
# discriminator: id 100 carries one and id 200 omits the key entirely. Assigning
# `label: null` is therefore a no-op on 200 and a real change on 100 — one authored
# write, two different per-row outcomes, so a resolve that never decoded the document
# would collapse both to one answer.
parallax.compatibility.Traveler:
  - id: 1
    displayName: Ada
    score: 7
    joinedOn: "2026-01-15"
    note: north wing
    address:
      city: Oslo
      geo:
        country: "NO"
    tags:
      - { label: founder }
      - { label: staff }
  - id: 2
    displayName: Bo
    score: 30
    joinedOn: "2025-12-31"
    address:
      city: Bergen
      geo:
        country: "NO"
  - id: 3
    displayName: Cyd
    score: null
    joinedOn: null
    note: null
    address: null
parallax.compatibility.Trip:
  - id: 51
    travelerId: 1
    destination: Oslo
    nights: 3
  - id: 52
    travelerId: 1
    destination: Bergen
    nights: 1
  - id: 53
    travelerId: 2
    destination: Bergen
    nights: 7
parallax.compatibility.Ledger:
  - id: 100
    version: 1
    label: opening
    balance: 250.00
    details: { code: opening }
  - id: 200
    version: 1
    balance: 40.00
    details: { code: settled }
# Beacon rows carry no document-resident member at all, so each row's Structured
# Column is the empty object — present and `NOT NULL`, extracted from by nothing.
parallax.compatibility.Beacon:
  - id: 10
  - id: 11
# The one Mooring row is a single open rectangle: current on both axes, and — like
# Beacon's rows — carrying the empty object, since every member it declares holds a
# direct-column role. What its Structured Column ends up holding is not authorable
# here, which is the point; the case that needs a key inside it writes one out of band.
parallax.compatibility.Mooring:
  - id: 1
    validStart: "2026-01-01T00:00:00+00:00"
    validEnd: infinity
    txStart: "2026-01-01T00:00:00+00:00"
    txEnd: infinity
# The sibling Payment rows use one physical path for two distinct declared types.
# `authorizationCode` applies only to CardPayment and is absent from the cash
# document rather than stored as JSON null.
parallax.compatibility.CardPayment:
  - id: 1
    detail: visa-4242
    authorizationCode: AUTH-7
parallax.compatibility.CashPayment:
  - id: 2
    detail: 12.50
parallax.compatibility.Book:
  - { id: 10, title: Systems, detail: ISBN-10, pages: 320 }
parallax.compatibility.Film:
  - { id: 20, title: Frames, detail: 850, minutes: 95 }
