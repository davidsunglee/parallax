[project]
name = "reference-harness"
version = "0.0.0"
description = "The canonical m-case-format compatibility runner for parallax. Tooling, NOT an ORM: it never compiles queries to SQL — it proves the suite is internally consistent and that golden SQL is correct against real databases."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = [
    "jsonschema>=4.21",
    "referencing>=0.28.4",
    "testcontainers>=4.15.0",
    "psycopg[binary]>=3.3.4",
    "pymysql>=1.1",
    "pyyaml>=6.0",
    "sqlglot>=30.17.0",
]

[project.optional-dependencies]
dev = [
    "basedpyright>=1.39.10",
    "pytest>=8.0",
    "ruff>=0.16.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reference_harness"]

[tool.uv]
# Keep dev tooling in the default sync so `uv run pytest`, `uv run ruff`, and
# `uv run basedpyright` work without an extra flag. The `dev` group installs the
# `dev` extra, so `pip install .[dev]` and `uv run` share one tool list.
default-groups = ["dev"]

[dependency-groups]
dev = ["reference-harness[dev]"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
# The scheduling partition. Neither marker is ever authored onto a test: the
# collection hook in tests/conftest.py derives exactly one of them per item from
# that item's fixture closure, so zero and both are unrepresentable.
markers = [
    "dbfree: requires no live database provider",
    "db: requires a live database provider",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.basedpyright]
include = ["src"]
pythonVersion = "3.13"
typeCheckingMode = "standard"
