# Each scenario rewrites one file of a mirrored, conforming repository and names
# the drift code the gate check must report. `old` is asserted to occur exactly
# once, so a mutation cannot silently apply to nothing.
#
# A mutation may legitimately break several rules at once, so a scenario asserts
# only that its own code is among what was reported. `problems: <n>` additionally
# pins the total, and belongs on a scenario whose breach is meant to be exactly
# one — which is what distinguishes a rule that fires on its own subject from one
# that fires as collateral of another.

- name: non-canonical-operation
  file: justfile
  old: "python-format:"
  new: "python-reformat:"
  code: non-canonical-operation
  message: "`python-reformat` performs the operation `reformat`"

