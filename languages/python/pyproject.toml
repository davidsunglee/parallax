# Parallax Python — uv workspace root.
#
# This is a virtual project (no `[build-system]`, `tool.uv.package = false`): it
# is never itself built or published. It exists to group the five workspace
# distributions under `packages/*`, own the shared dev toolchain and tool
# configuration (§10 of `spec/python.md`), and host the generated import-linter
# forbidden-edge complement (`tools/check_dag_sync.py`, §7).
[project]
name = "parallax-python"
version = "0.0.0"
description = "uv workspace root for the Parallax Python target (slice-snapshot-1). Not published."
requires-python = ">=3.12"
dependencies = [
    "parallax-core",
    "parallax-descriptor",
    "parallax-snapshot",
    "parallax-postgres",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
parallax-core = { workspace = true }
parallax-descriptor = { workspace = true }
parallax-snapshot = { workspace = true }
parallax-postgres = { workspace = true }
parallax-conformance = { workspace = true }

[dependency-groups]
# `parallax-conformance` is development-only (§8); it lives here rather than in
# the production dependency set so the clean-install topology proofs can show it
# absent from every production install.
dev = [
    "parallax-conformance",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "diff-cover>=10.5.0",
    "ruff>=0.16.3",
    "pyright>=1.1.380",
    "import-linter>=2.1",
    "vulture>=2.11",
    "griffe>=1.3",
    "twine>=7.0.0",
    "pip-audit>=2.7",
    "jsonschema>=4.21",
    "testcontainers>=4.15.0",
    "types-pyyaml>=6.0.12.20260724",
    "types-jsonschema>=4.21",
]

# ---------------------------------------------------------------------------
# pytest — §6 markers and collection.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tools", "tests"]
addopts = "-ra --strict-markers --strict-config"
# An expected failure reproduces a known defect ahead of its fix, so the run
# fails once it starts passing: the reproduction cannot outlive the defect it
# describes, and removing the marker is part of the fix. Set here rather than per
# marker so a non-strict expected failure is unrepresentable.
xfail_strict = true
# The first two are the scheduling partition and are never authored onto a test:
# the collection hook in tests/conftest.py derives exactly one of them per item
# from that item's fixture closure, so zero and both are unrepresentable. The
# other two are orthogonal focused selectors, authored where they apply.
markers = [
    "dbfree: requires no live database provider",
    "db: requires a live database provider",
    "compile_sweep: Docker-free compile of every compile-eligible claimed case",
    "adapter_smoke: real psycopg adapter smoke checks (Docker)",
]

# ---------------------------------------------------------------------------
# Coverage — branch mode; targets the shipped `parallax.*` distributions
# (product code plus the dev-only conformance CLI, per §10). Build/CI tooling
# under `tools/` is exercised by the Phase 1 canary unit tests but is not
# product code, so it is not part of the product-coverage gate.
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source_pkgs = ["parallax"]

[tool.coverage.report]
show_missing = true
# The two ellipsis patterns are anchored to the END of the line so they match a
# stub BODY only — `...` inside a signature's own type annotation (a variadic
# `tuple[T, ...]` return) must never exclude the block that signature opens.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.\\s*$",
    ":\\s*\\.\\.\\.\\s*$",
]

# ---------------------------------------------------------------------------
# Ruff — lint + deterministic formatter (§10).
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
src = ["packages/parallax-core/src", "packages/parallax-descriptor/src", "packages/parallax-snapshot/src", "packages/parallax-postgres/src", "packages/parallax-conformance/src", "tools", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["parallax"]

# ---------------------------------------------------------------------------
# Vulture — dead-code scan. `main` is the packaging-metadata console-script
# entry point (referenced by `[project.scripts]`, not by in-repo code); the
# compensating public-surface check is the api_surface griffe snapshot (§10).
# ---------------------------------------------------------------------------
[tool.vulture]
paths = ["packages", "tools"]
min_confidence = 80
ignore_names = ["main"]

# >>> check_dag_sync.py: BEGIN GENERATED IMPORT-LINTER CONTRACTS >>>
# Generated by tools/check_dag_sync.py from core/spec/modules.md and spec/python.md §7 — do not edit by hand.
# Regenerate with: uv run python tools/check_dag_sync.py --write
[tool.importlinter]
root_packages = [
    "parallax.conformance",
    "parallax.core",
    "parallax.descriptor",
    "parallax.postgres",
    "parallax.snapshot",
]

