# Parallax Python — uv workspace root.
#
# This is a virtual project (no `[build-system]`, `tool.uv.package = false`): it
# is never itself built or published. It exists to group the seven workspace
# distributions under `packages/*`, own the shared dev toolchain and tool
# configuration, and host the generated import-linter
# forbidden-edge complement (`tools/check_dag_sync.py`, §7).
[project]
name = "parallax-python"
version = "0.0.0"
description = "uv workspace root for the Parallax Python target (slice-snapshot-1). Not published."
requires-python = ">=3.14"
dependencies = [
    "parallax-core",
    "parallax-descriptor",
    "parallax-evolution",
    "parallax-snapshot",
    "parallax-postgres",
    # With the extra, so the development environment type-checks and tests the
    # engine-specific slice. The extra is the artifact-level statement that the
    # slice needs an adapter and the rest of the provider does not.
    "parallax-aws[postgres]",
]

[tool.uv]
package = false
# setuptools installs a src-layout package editable through an import hook by
# default, which static analysis cannot follow; compat mode adds `src` to the
# path the way every hatchling member's editable install does.
config-settings-package = { parallax-postgres = { editable_mode = "compat" } }

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
parallax-core = { workspace = true }
parallax-descriptor = { workspace = true }
parallax-evolution = { workspace = true }
parallax-snapshot = { workspace = true }
parallax-postgres = { workspace = true }
parallax-aws = { workspace = true }
parallax-conformance = { workspace = true }

[dependency-groups]
# `parallax-conformance` is development-only (§8); it lives here rather than in
# the production dependency set so the clean-install topology proofs can show it
# absent from every production install.
dev = [
    "parallax-conformance",
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.8.0",
    "filelock>=3.32.5",
    "diff-cover>=10.5.0",
    "ruff>=0.16.3",
    "cython-lint>=0.21.1",
    "pyright>=1.1.380",
    "import-linter>=2.1",
    "vulture>=2.11",
    "griffe>=1.3",
    "twine>=7.0.0",
    "pip-audit>=2.7",
    "deptry==0.25.1",
    "jsonschema>=4.21",
    "botocore-stubs>=1.43.67",
    "types-pyyaml>=6.0.12.20260724",
    "types-jsonschema>=4.21",
    "sqlglot>=30.20.0",
]

# ---------------------------------------------------------------------------
# pytest — markers and collection.
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["tools"]
addopts = "-ra --strict-markers --strict-config"
# An expected failure reproduces a known defect ahead of its fix, so the run
# fails once it starts passing: the reproduction cannot outlive the defect it
# describes, and removing the marker is part of the fix. Set here rather than per
# marker so a non-strict expected failure is unrepresentable.
xfail_strict = true
# The first four are the scheduling partition and are never authored onto a test:
# the collection hook in tests/conftest.py derives exactly one of them per item
# from what that item requires — its fixture closure for a database, for a
# provider-hosted environment, or for the committed cost evidence, the boundary its
# function carries for an interpreter of its own — so zero is unrepresentable and
# two is a hard error. The other two are orthogonal focused selectors, authored
# where they apply.
markers = [
    "dbfree: requires no live database provider or provider-hosted environment",
    "db: requires a live database the run provisions locally",
    "cloud: requires a provider-hosted environment and credentials for it",
    "cost: requires an interpreter no other test shares, or the committed cost evidence",
    "compile_sweep: Docker-free compile of every compile-eligible claimed case",
    "adapter_smoke: real psycopg adapter smoke checks (Docker)",
]

# ---------------------------------------------------------------------------
# Coverage — branch mode; targets the shipped `parallax.*` product distributions.
# Build/CI tooling under `tools/` is exercised by the Phase 1 canary unit tests
# and the dev-only conformance package by the suites it drives, but neither is
# product code, so neither is part of the product-coverage gate.
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source_pkgs = ["parallax"]
omit = ["*/packages/parallax-conformance/*"]

[tool.coverage.report]
show_missing = true
# The two ellipsis patterns are anchored to the END of the line so they match a
# stub BODY only — `...` inside a signature's own type annotation (a variadic
# `tuple[T, ...]` return) must never exclude the block that signature opens.
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.\\s*$",
    ":\\s*\\.\\.\\.\\s*$",
]

# ---------------------------------------------------------------------------
# diff-cover — the changed-line gate. coverage.py cannot trace a compiled
# module, so no Cython source has a line coverage can score; each is exempted by
# name and graded by the differential tests of the adapter's compiled loaders
# instead. `tools/check_native_sources.py` requires this list to name exactly
# the Cython sources that exist.
# ---------------------------------------------------------------------------
[tool.diff_cover]
exclude = [
    "*/packages/parallax-postgres/src/parallax/postgres/_cloaders.pxi",
    "*/packages/parallax-postgres/src/parallax/postgres/_cloaders_binary.pyx",
    "*/packages/parallax-postgres/src/parallax/postgres/_cloaders_c.pyx",
    "*/packages/parallax-postgres/src/parallax/postgres/_psycopg_layout/cloader.pxi",
    "*/packages/parallax-postgres/src/parallax/postgres/_psycopg_layout/psycopg_binary/__init__.pxd",
    "*/packages/parallax-postgres/src/parallax/postgres/_psycopg_layout/psycopg_binary/_psycopg.pxd",
    "*/packages/parallax-postgres/src/parallax/postgres/_psycopg_layout/psycopg_c/__init__.pxd",
    "*/packages/parallax-postgres/src/parallax/postgres/_psycopg_layout/psycopg_c/_psycopg.pxd",
]

# ---------------------------------------------------------------------------
# cython-lint — the Cython sources' lint, at Ruff's line length.
# ---------------------------------------------------------------------------
[tool.cython-lint]
max-line-length = 100

# ---------------------------------------------------------------------------
# Ruff — lint + deterministic formatter.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
src = ["packages/parallax-core/src", "packages/parallax-descriptor/src", "packages/parallax-evolution/src", "packages/parallax-snapshot/src", "packages/parallax-postgres/src", "packages/parallax-aws/src", "packages/parallax-conformance/src", "tools"]
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C90"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.isort]
known-first-party = ["parallax", "tests"]

# ---------------------------------------------------------------------------
# Vulture — dead-code scan. `main` is the packaging-metadata console-script
# entry point (referenced by `[project.scripts]`, not by in-repo code); the
# compensating public-surface check is the Griffe public-API snapshot.
# The four capitalized names are botocore's own parameter spelling for the RDS
# presign, which `parallax.aws` both declares in a Protocol and passes by
# keyword; vulture reads a keyword argument as a definition rather than a use,
# so a third-party spelling used exactly once looks unused from both ends.
# ---------------------------------------------------------------------------
[tool.vulture]
paths = ["packages", "tools"]
min_confidence = 80
ignore_names = ["main", "DBHostname", "DBUsername", "Port", "Region"]

# >>> check_dag_sync.py: BEGIN GENERATED IMPORT-LINTER CONTRACTS >>>
# Generated by tools/check_dag_sync.py from core/spec/modules.md and spec/python.md §7 — do not edit by hand.
# Regenerate with: uv run python tools/check_dag_sync.py --write
[tool.importlinter]
root_packages = [
    "parallax.aws",
    "parallax.conformance",
    "parallax.core",
    "parallax.descriptor",
    "parallax.evolution",
    "parallax.postgres",
    "parallax.snapshot",
]
