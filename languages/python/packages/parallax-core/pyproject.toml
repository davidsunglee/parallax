[project]
name = "parallax-core"
version = "0.1.0"
description = "Parallax common runtime: the class-free engine spine (domain model, Predicate algebra, SQL lowering, unit of work, abstract database port)."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Parallax" }]
dependencies = [
    "pydantic>=2.13",
    # Imported directly for Pydantic's own missing-value sentinel. Every Pydantic
    # release pins one pydantic-core, so this floor is the one `pydantic>=2.13`
    # itself requires.
    "pydantic-core>=2.46",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# PEP 420 namespace package: the wheel ships `parallax.core.*` only, with no
# `parallax/__init__.py` at the shared namespace root.
[tool.hatch.build.targets.wheel]
packages = ["src/parallax"]

[tool.hatch.build.targets.sdist]
include = ["src/parallax", "README.md"]
