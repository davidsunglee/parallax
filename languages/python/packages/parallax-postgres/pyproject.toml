[project]
name = "parallax-postgres"
version = "0.1.0"
description = "Parallax Postgres database adapter: the concrete database runtime over psycopg and its companion pool."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Parallax" }]
dependencies = [
    "parallax-core==0.1.0",
    # The binary extra bundles libpq so the adapter installs self-contained (no
    # system libpq required); the adapter owns that capability, so a sibling
    # that imports psycopg declares it without the extra. The compiled loaders
    # extend psycopg's private C loader layout, so a new minor release is a
    # reviewed change rather than an automatic one.
    "psycopg[binary]>=3.3.6,<3.4",
    # The companion pool the runtime owns: the same project, released
    # separately.
    "psycopg-pool>=3.3.1",
]

[project.urls]
Changelog = "https://github.com/davidsunglee/parallax/blob/main/languages/python/docs/releases.md"
Documentation = "https://github.com/davidsunglee/parallax/blob/main/languages/python/docs/postgresql-lifecycle.md"
Repository = "https://github.com/davidsunglee/parallax"

[build-system]
requires = ["setuptools==84.2.1", "Cython==3.3.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }
packages = ["parallax.postgres"]
include-package-data = false

[tool.setuptools.package-data]
"parallax.postgres" = ["py.typed", "*.pyi"]

# The compiled modules are built from the Cython sources, so an edit to one must
# rebuild the installed package.
[tool.uv]
cache-keys = [
    { file = "pyproject.toml" },
    { file = "setup.py" },
    { file = "src/**/*.pyx" },
    { file = "src/**/*.pxd" },
    { file = "src/**/*.pxi" },
]

[tool.parallax.postgresql]
supported = ">=18.6,<19"
