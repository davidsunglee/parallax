[project]
name = "parallax-postgres"
version = "0.1.0"
description = "Parallax Postgres database adapter: the concrete database runtime over psycopg and its companion pool (the sole psycopg declarer)."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Parallax" }]
dependencies = [
    "parallax-core",
    # The binary extra bundles libpq so the adapter installs self-contained (no
    # system libpq required); parallax-postgres remains the sole psycopg declarer.
    "psycopg[binary]>=3.3.5",
    # The companion pool the runtime owns: the same project, released
    # separately, and declared only here so higher layers stay driver-free.
    "psycopg-pool>=3.3.1",
]

[project.urls]
Documentation = "https://github.com/davidsunglee/parallax/blob/main/languages/python/docs/postgresql-lifecycle.md"
Repository = "https://github.com/davidsunglee/parallax"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parallax"]

[tool.hatch.build.targets.sdist]
include = ["src/parallax", "README.md"]
