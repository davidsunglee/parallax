[project]
name = "parallax-aws"
version = "0.1.0"
description = "Parallax AWS credential providers: RDS IAM database authentication as a Credential Source (the sole botocore declarer)."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Parallax" }]
dependencies = [
    "parallax-core==0.1.0",
    # Declared for the AWS credential chain rather than for the token: the
    # presign is local, but finding the credentials to sign with — environment,
    # profiles, IMDSv2, ECS task roles, IRSA, SSO, and the automatic refresh of
    # every temporary credential those produce — is botocore's. boto3 adds
    # nothing: `generate_db_auth_token` is a botocore RDS-client operation, so an
    # application already using boto3 shares this one install.
    "botocore>=1.43.99",
]

# The engine-specific slice `parallax.aws.postgres` composes a
# `PostgresAdapter`, and this extra is what keeps the rest of the distribution
# free of one: a deployment on another engine installs the credential provider
# and no database driver arrives with it. The slice also imports psycopg
# directly, so the extra declares the driver beside the adapter that brings its
# binary build.
[project.optional-dependencies]
postgres = ["parallax-postgres==0.1.0", "psycopg>=3.3.6,<3.4"]

[project.urls]
Documentation = "https://github.com/davidsunglee/parallax/blob/main/languages/python/docs/guide/README.md"
Repository = "https://github.com/davidsunglee/parallax"
Changelog = "https://github.com/davidsunglee/parallax/blob/main/languages/python/docs/releases.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parallax"]

[tool.hatch.build.targets.sdist]
include = ["src/parallax", "README.md", "LICENSE", "NOTICE"]
