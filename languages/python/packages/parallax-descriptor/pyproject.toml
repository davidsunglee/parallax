[project]
name = "parallax-descriptor"
version = "0.2.0"
description = "Parallax descriptor interchange: canonical model-descriptor ingestion and export over the parallax-core spine."
readme = "README.md"
requires-python = ">=3.14"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Parallax" }]
dependencies = [
    "parallax-core==0.2.0",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
]

[project.urls]
Documentation = "https://github.com/davidsunglee/parallax/blob/main/languages/python/docs/guide/README.md"
Repository = "https://github.com/davidsunglee/parallax"
Changelog = "https://github.com/davidsunglee/parallax/blob/main/languages/python/docs/releases.md"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parallax"]

[tool.hatch.build.targets.sdist]
include = ["src/parallax", "README.md", "LICENSE", "NOTICE"]
