[project]
name = "parallax-descriptor"
version = "0.1.0"
description = "Parallax descriptor interchange: canonical model-descriptor ingestion and export over the parallax-core spine."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
authors = [{ name = "Parallax" }]
dependencies = [
    "parallax-core",
    "pyyaml>=6.0",
    "jsonschema>=4.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parallax"]

[tool.hatch.build.targets.sdist]
include = ["src/parallax", "README.md"]
