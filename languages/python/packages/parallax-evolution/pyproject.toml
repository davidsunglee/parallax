[project]
name = "parallax-evolution"
version = "0.1.0"
description = "Parallax model evolution and schema deltas: the model-altitude difference between two accepted Metamodels, and the dialect statements that carry a database to the later one."
readme = "README.md"
requires-python = ">=3.13"
license = "Apache-2.0"
authors = [{ name = "Parallax" }]
dependencies = [
    "parallax-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parallax"]

[tool.hatch.build.targets.sdist]
include = ["src/parallax", "README.md"]
